让我们来探讨一下&ldquo;反传统者&rdquo;。<br />An iconoclast can be defined someone who challenges established ideas and beliefs.<br />反传统者可以被定义为挑战既有观念和信仰的人。<br />Put simply, it&#39;s someone who hasn&#39;t stopped asking that vital question, why the term iconoclast is often used negatively.<br />简单来说，就是那些从未停止追问那个关键问题&ldquo;为什么&rdquo;的人，尽管&ldquo;反传统者&rdquo;这个词通常带有负面含义。<br />But in a business context, an iconoclast can be indispensable.<br />但在商业环境中，反传统者可能是不可或缺的。<br />The fact that they ask this question of established procedures and methods means that they may be able to uncover chinks in a company&#39;s armor and find efficiencies that their colleagues are oblivious to.<br />他们对既有的程序和方法提出质疑，这意味着他们可能能够发现公司弱点，并找到他们的同事们没有注意到的效率提升之处。<br />It has long been known that your average person tends to stop questioning something if they are increasingly exposed to it.<br />人们早就知道，普通人如果越来越频繁地接触某件事，往往会停止质疑它。<br />Iconoclasts may see through this with searing clarity and are unlikely to tolerate continued exposure.<br />反传统者可能会以敏锐的洞察力看穿这一点，并且不太可能容忍持续的接触。<br />Rather than force them to conform, businesses do well to listen to them.<br />与其强迫他们顺从，企业不如好好倾听他们的意见。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658781/a3676c7b1f8a4acc82ef108e322ad851.mp3", "kws": ["business", "accept", "beliefs", "businesses", "challenges", "change", "changes", "efficient", "established", "fact"]}, {"id": 3794, "name": "Implicit and explicit memory", "ref": "Implicit memory and explicit memory are the two main types of memory. Implicit memory is also called procedural memory and cannot be consciously recalled. Implicit memory is about cultural and social background, such as using language naturally or driving automatically. Explicit memory is also known as episodic memory, related to personal life experiences. It is about time and space, such as remembering birthdays or answering questions in a test.", "ana": "&nbsp;So I&#39;m going to talk a little bit briefly about different systems of memory.<br />我将简要地谈谈记忆的不同系统。<br />And in fact, much of the memory that influences and guides our everyday life actually kind of hides in the background.<br />实际上，影响和指导我们日常生活的许多记忆都隐藏在背景之中。<br />You actually don&#39;t know that you&#39;re using the bulk of your memory.<br />你甚至不会意识到自己正在大量使用记忆。<br />And this is called implicit or procedural memory.<br />这种记忆被称为内隐记忆或程序性记忆。<br />This includes things like cultural and social norms.<br />它包括文化和社会规范等内容。<br />So kind of understanding how you&#39;re supposed to behave in a classroom or expecting a certain thing to happen when you walk into a restaurant.<br />比如你知道在教室里应该如何表现，或者走进餐厅时会预期发生某些事情。<br />These are all things that we&#39;ve learned and acquired over our years, but it&#39;s not necessarily something that we think about.<br />这些是我们多年学习和积累的结果，但我们并不一定会主动去思考它们。<br />Language also, in many aspects, is something that is fairly automatic and that we&#39;ve acquired and use very naturally, and other learned skills such as reading or driving.<br />语言在很多方面也是相当自动化的，是我们已经掌握并自然运用的技能，还包括阅读或驾驶等其他习得的技能。<br />These are things that might have been effortful at one time, but now they just come very easily and automatically to us.<br />这些技能曾经可能需要付出努力才能掌握，但现在对我们来说已经变得非常轻松和自动化了。<br />And in fact, if you actually try to describe to somebody how you drive or how to drive, you actually kind of mix you up.<br />事实上，如果你试图向别人解释你是如何开车或开车的步骤，你反而可能会感到混乱。<br />So these are in a lot of cases, consciousness kind of gets in the way of a lot of these aspects of implicit memory.<br />所以在很多情况下，意识反而会干扰我们对内隐记忆的运用。<br />Now, when we&#39;re talking about our memory, so for instance, people tell me a lot that their memories are bad.<br />当我们谈论&ldquo;记忆&rdquo;时，比如说很多人会告诉我他们的记忆力不好。<br />When people are saying when they talk about their memory, they&#39;re usually talking about explicit or episodic memory.<br />当人们谈论自己的记忆力时，他们通常指的是外显记忆或情景记忆。<br />And these are very different from implicit memories.<br />这些记忆与内隐记忆非常不同。<br />These are memories that have a very specific tag of space and time.<br />它们是带有明确时空标签的记忆。<br />These are highly personal memories, usually.<br />通常是高度个人化的记忆。<br />So this could be everything from remembering what you ate for breakfast to what you did on your last vacation, or remembering a significant birthday that you had several years ago, or... Or just an answer to a multiple choice question on a test.<br />这可以包括从记住你早餐吃了什么，到你上一次度假做了什么，或回忆几年前的一个重要生日，或者&hellip;&hellip;甚至只是考试中一道选择题的答案。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691690/82afaea0935c441ba323b7e59285e036.mp3", "kws": ["memory", "implicit", "explicit", "answering", "automatically", "background", "birthdays", "called", "cannot", "consciously"]}, {"id": 4455, "name": "Indian peasants' debt", "ref": "The lecture explains the severe debt crisis among Indian peasants caused by the high costs of commercial seeds and pesticides. Driven by globalization, farmers lack capital and must borrow money to buy these expensive agricultural materials. Consequently, the seed and pesticide companies act as both sellers and major creditors, trapping the peasants in a continuous cycle of debt.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693693/19d2cf9abd6b45138759fb32e5bf1f94.mp3\"></audio></div><br />The debt today is so high, it&rsquo;s two hundred thousand rupees, three hundred thousand rupees of peasant who have no capital.<br />如今农民的债务高得惊人，往往是二十万、三十万卢比，而他们根本没有资本。<br />They who know within a year or two, when they accumulate that kind of debt.<br />他们自己也清楚，在一两年内就会积累起如此巨额的债务。<br />Where is the debt coming from?<br />这些债务从何而来？<br />It&#39;s coming from a seed that is costing a hundred thousand to two hundred thousand rupees per kilogram, depending on what you got.<br />它源于高价种子&mdash;&mdash;每公斤要价十万到二十万卢比，具体价格取决于种类。<br />Seeds that used to be free, used to be theirs.<br />这些种子过去是免费的，原本属于他们自己。<br />Pesticides each time, the more they use, the more they have to use, 12 sprays, 15 sprays, 20 sprays.<br />而农药也是如此，用得越多，就必须用得更多，从十二次喷洒到十五次，再到二十次。<br />Pesticides used in just the last five years in the land areas of India has shown up by 2000 percent.<br />在过去五年间，印度耕地上的农药使用量暴涨了2000%。<br />That&rsquo;s why the free market and globalization have brought and since we are talking about peasants, who have no money, who have no capital, they can only buy expensive seeds and expensive pesticides by borrowing.<br />这就是所谓自由市场和全球化带来的结果，而我们说的是农民&mdash;&mdash;他们既无资金又无资本，只能靠借债购买昂贵的种子和农药。<br />And who lend that money?<br />那么，这笔钱是谁借给他们的呢？<br />The seed companies that sell the pesticides, which are the same companies that sell the seeds, as you know, are now also the major creditors.<br />正是那些销售农药和种子的种子公司，而你知道，这些公司如今也是主要的债权人。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693693/2a44a164f977496aba3ab39a54d72e93.mp3", "kws": ["debt", "peasants", "agricultural", "among", "borrow", "capital", "caused", "commercial", "companies", "consequently"]}, {"id": 4446, "name": "International environmental law", "ref": "The lecture highlights the crucial role of domestic legislation in implementing international environmental law. It traces the history of UK environmental controls and explains that early regulations lack proper enforcement, which makes them ineffective. Additionally, the Industrial Revolution worsens environmental damage because industrialists prioritize economic profit. Therefore, comprehensive statutory controls on pollutant discharge become essential for effective environmental protection.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693669/488e5e07a15646d696f4697bec897f58.mp3\"></audio></div><br /><br />Before we consider international environmental law and climate change we need to consider domestic legislation, as it is within the sovereign states that international law is put into practice.<br />在考虑国际环境法和气候变化之前，我们需要先考虑国内立法，因为国际法的实施依赖于主权国家。<br />This reflects the environmentalists&#39; maxim, &#39;think globally act locally.&#39;<br />这反映了环境保护者的格言：&ldquo;全球思考，本地行动。&rdquo;<br />United Kingdom legislative control over the impacts of man&#39;s activity on the environment is not new.<br />英国对人类活动对环境影响的立法控制并非新鲜事。<br />As long ago as the reign of Charles II the main concern was the production of smoke from the burning of sea coal.<br />早在查理二世统治时期，主要关注的是燃烧海煤产生的烟雾。<br />Almost all areas of trade and industry were subject to very detailed legislative controls at that time, although some were governed by &#39;self-regulation&#39; in the form of guilds, which regulated both supply and methods of production.<br />当时几乎所有贸易和工业领域都受到非常详细的立法控制，尽管有些行业由行会形式的&ldquo;自我监管&rdquo;管理，规范供应和生产方法。<br />However, the measures implemented were mostly ineffective because then, as now, the specifying of legal duties and standards without providing any appropriate enforcement merely indicated good intentions but were of little practical effect.<br />然而，这些措施大多无效，因为无论当时还是现在，仅仅规定法律责任和标准而没有提供适当的执行手段，只表明了良好意图，但几乎没有实际效果。<br />The next stage was prompted by the Industrial Revolution with the urbanization of society and its profound effects on the environment.<br />下一个阶段是由工业革命推动的，伴随社会城市化及其对环境的深远影响。<br />Local industrialists used the Adam Smith model to maximize their economic benefit, but this was to the detriment of the local environment with the operation of &#39;Gresham&#39;s Law&#39; that is, the bad drives out the good.<br />当地工业家采用亚当&middot;斯密模式以最大化经济利益，但这损害了当地环境，体现了&ldquo;格雷欣法则&rdquo;的作用，即劣质排挤良好。<br />Those industrialists who were concerned for either the health of their employees or the local environment faced higher costs than their competitors.<br />那些关心员工健康或当地环境的工业家，其成本高于竞争对手。<br />The result was the need for increasingly comprehensive statutory controls on the discharge of pollutants into various receiving media.<br />结果是需要对污染物排放到各类受纳介质中实施日益全面的法定控制。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693669/c30f61d5f398497abcf3cc4e7b004942.mp3", "kws": ["environmental", "controls", "additionally", "because", "become", "comprehensive", "crucial", "damage", "discharge", "domestic"]}, {"id": 2131, "name": "International law", "ref": "The lecture discusses the historical significance of international law, particularly its role in ending prolonged conflicts. It emphasizes the impact of prolonged periods of war, leading to the creation of new rules governing the behavior between states. Additionally, it highlights the establishment of international law in 1648 and underscores its implications function and power dynamics in promoting stability among nations.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678652/45d0b02abbda4ac8a22ec884b315ca80.mp3\"></audio></div><br />This lecture provides a historical perspective on the establishment of international law, emphasizing the pivotal role it played in ending protracted conflicts.<br />本次讲座从历史的角度探讨了国际法的建立，强调了它在结束长期冲突中所发挥的关键作用。<br />It begins by highlighting the painful lesson learned from prolonged periods of war, prompting the creation of a new set of rules governing the behavior between states.<br />讲座首先指出，正是从长期战争带来的痛苦教训中，催生了一套新的规范国家行为的规则。<br />The lecture underscores the significance of this development, particularly in the context of prolonged conflicts with no peace for 30 or even 100 years.<br />讲座强调了这一发展的意义，尤其是在那些持续数十年甚至百年没有和平的历史背景下。<br />Additionally, the roles of powerful nations such as the United States and Australia in shaping international law are discussed.<br />此外，讲座还讨论了诸如美国和澳大利亚等强国在塑造国际法过程中所扮演的角色。<br />It is noted that international law was formally established in 1648 as a means to end incessant wars between states and alleviate the strains of military force.<br />值得注意的是，国际法于1648年正式确立，旨在结束国家之间连绵不断的战争，并缓解军事力量带来的压力。<br />Overall, the lecture emphasizes the implication function and power dynamics of international law, shedding light on its historical significance and its role in curbing conflicts and promoting stability among nations.<br />总体而言，讲座强调了国际法的功能性含义及其背后的权力动态，揭示了其历史意义以及在遏制冲突、促进国家间稳定方面所发挥的作用。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678652/2f80cb191ad24163b9a0d4cbc53a3a07.mp3", "kws": ["international", "prolonged", "additionally", "among", "behavior", "between", "conflicts", "creation", "discusses", "dynamics"]}, {"id": 2127, "name": "International trading system", "ref": "The international trading system has evolved significantly since the WTO&#39;s establishment, with globalization driving open trade policies and expanded commerce. Countries opening ports enabled consumers worldwide to access diverse, high-quality products at competitive prices. This interconnected system fosters economic growth by facilitating cross-border exchange of ideas, technologies, and opportunities for development. The speaker believes that open trade is a boon to global prosperity.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678648/739335edb8cd44f882c0be6dfbe475da.mp3\"></audio></div><br />In our exploration of the international trading system, we acknowledge the significant changes since the inception of the World Trade Organization (WTO).<br />在我们对国际贸易体系的探讨中，我们承认自世界贸易组织（WTO）成立以来发生的重大变化。<br />As countries opened up, an era of increased international trade commenced.<br />随着各国的开放，一个国际贸易日益增长的时代开始了。<br />Globalization has been the keystone, prompting nations to welcome foreign trade by opening their ports, fostering a globally connected economy.<br />全球化成为了关键推动力，促使各国通过开放港口来欢迎对外贸易，从而促成了全球经济的互联互通。<br />The ramifications of this shift touch every facet of commerce.<br />这一转变的影响触及商业的方方面面。<br />As a result, consumers around the world now enjoy a broader range of products, competitive pricing, and improved quality.<br />因此，全球消费者如今可以享受到更丰富的产品选择、更具竞争力的价格以及更高的产品质量。<br />This trend has ushered in an era of unprecedented consumer benefits and widespread economic growth.<br />这一趋势开启了一个前所未有的消费者福利提升和广泛经济增长的时代。<br />To conclude from my perspective, the decision to engage in open trade has been immensely positive.<br />从我的角度来看，参与开放贸易的决定是非常积极的。<br />Trading across borders should not just be seen as a strategic economic move, but as a force that enriches societies by exposing them to new ideas, technologies, and opportunities for development.<br />跨境贸易不应仅仅被视为一种战略性的经济举措，而应被看作是一种力量，它通过让社会接触新的思想、技术和发展的机会来丰富整个社会。<br />It&#39;s a conviction of mine that trade openness is indeed a boon to global prosperity.<br />我坚信，贸易开放确实是全球繁荣的一大福音。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678648/c48c1a5d574643fcbdda540cb0b32080.mp3", "kws": ["open", "system", "trade", "access", "believes", "boon", "commerce", "competitive", "consumers", "countries"]}, {"id": 3789, "name": "Journalism and internet", "ref": "David Olivia Garcia, co-host of New Mexico in Focus and managing editor for the New Mexico Independent, believes that the Internet has great benefits for journalism, offering various mediums to tell stories and connect with other journalistic work. However, John Fleck, a columnist for the Albuquerque Journal, argues that the Internet actually makes journalists more efficient in terms of gathering information and confirming facts.", "ana": "David Olivia Garcia is a co-host of New Mexico in Focus and is also the managing editor for the New Mexico Independent, which is an online news site.<br />大卫&middot;奥利维亚&middot;加西亚是《聚焦新墨西哥》（New Mexico in Focus）的联合主持人，同时也是在线新闻网站&ldquo;新墨西哥独立网&rdquo;（New Mexico Independent）的主编。<br />He says that the Internet has some great benefits for journalism.<br />他表示，互联网为新闻业带来了一些巨大的优势。<br />The Internet is this new, amazing medium. Not so new: it&#39;s been around quite some time now.<br />互联网是一种全新而令人惊叹的媒介。不过它也不算新了，已经存在相当长一段时间了。<br />But it&#39;s maturing as, among other things, a place for journalism.<br />但作为新闻传播平台之一，它正在日趋成熟。<br />In a sense, the Internet allows you to tell stories better than in a newspaper or on television.<br />从某种意义上说，互联网让你能够比报纸或电视更好地讲述新闻故事。<br />For this reason, you can do it all online: you can have the written word, you can have still photographs, you can have video.<br />正因为如此，你可以在网上完成所有这些内容：你可以发布文字报道、静态图片和视频。<br />You can link and kind of connect to the other journalism that has been done on a given topic.<br />你还可以进行链接，将当前报道与围绕某一主题已有的其他新闻报道连接起来。<br />So it&#39;s not like you&#39;re in a vacuum.<br />因此，你并不是在一个信息真空中工作。<br />The Internet has had a negative impact on these papers.<br />互联网对传统纸质媒体产生了负面影响。<br />However, John Fleck, who is a columnist for the Albuquerque Journal and also has his own blog, says that he doesn&#39;t think that&#39;s entirely the case.<br />然而，《阿尔伯克基日报》（Albuquerque Journal）的专栏作家、同时也拥有自己博客的约翰&middot;弗莱克表示，他认为情况并不完全是这样。<br />It really makes me more efficient as a journalist in terms of information gathering, confirmation, helping me get the background necessary to write a story.<br />作为一名记者，它确实在信息收集和核实方面提高了我的效率，帮助我获取撰写一篇报道所需的背景资料。<br />So it&#39;s really good for that.<br />所以在这方面，它非常有用。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691682/67f174d0fbc64dd0aaac9c49ad92d8fb.mp3", "kws": ["internet", "mexico", "actually", "albuquerque", "argues", "believes", "benefits", "co-host", "columnist", "confirming"]}, {"id": 3797, "name": "Leadership", "ref": "The lecture talks about leadership. Leaders can define or clarify goals through various means such as issuing memos, executive orders, or laws, as well as using charisma, rhetoric, and example. Leadership can range from highly visible and authoritative to casual and low-key. Historically, authoritative leadership has been predominantly exhibited by men, but this pattern is changing as more women take up visible leadership roles.", "ana": "A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues.<br />领导者可以通过发布备忘录、行政命令、法令、法特瓦或推文，通过立法、下达命令，或在同事会议上提出一个有趣的想法来定义或明确目标。<br />Leaders can mobilize people&#39;s energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force.<br />领导者可以调动人们能量的方式多种多样，从温和安静的劝说，到强制性的威胁，甚至使用致命武力。<br />Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example.<br />有时，像马丁&middot;路德&middot;金这样的魅力型领导者可以通过修辞和榜样的力量来设定目标并激发能量。<br />We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields.<br />我们可以从可见性和领导者所掌握的权力两个方面，把领导力看作一个光谱。<br />On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi.<br />在这个光谱的一端是最具可见性的：权威型领导者，比如美国总统、英国首相，或者像希特勒或卡扎菲这样的独裁者。<br />At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it.<br />而在另一端，则是日常生活中随处可见的随意而低调的领导方式，这种领导力虽然低调，却能对被它影响的人们的生活产生重大影响。<br />Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men.<br />几个世纪以来，第一种即站在前台的权威型领导通常由男性担任。<br />Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of &quot;leading from behind&quot; more often, however, top leaders have been quite visible in their exercise of power.<br />一些身居高位的男性，包括纳尔逊&middot;曼德拉，更常选择&ldquo;从后方领导&rdquo;的策略。然而，大多数高层领导者在行使权力时表现得非常显眼。<br />Women (as well as some men) have provided casual, low-key leadership behind the scenes.<br />女性（以及部分男性）则在幕后提供了轻松而低调的领导力。<br />But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership.<br />但这一模式正在发生变化，越来越多的女性获得了走向前台、展现权威型领导力的机会。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691706/4f9828223de242e4801b4278efe062e8.mp3", "kws": ["leadership", "women's leadership", "a spectrum", "two forms", "out in front", "behind the scenes"]}, {"id": 4457, "name": "Los Angeles", "ref": "Since Los Angeles was established in 1781, the rapidly increasing population puts strain on the Los Angeles River. A new water source has to be found for the city&rsquo;s development as an urban center. The creation of the Los Angeles Aqueduct led to tragedies and draining of important landmarks. The Water Department eventually settled on Owens Lake as the perfect candidate to supply Los Angeles with water for expansion.", "ana": "In 1781 Los Angeles is established and named Pablo de la Renta de Los Angeles by forty-four families from Mexico as a fort for soldiers.&nbsp;<br />1781年，洛杉矶由来自墨西哥的四十四户家庭建立，并被命名为&ldquo;帕布罗&middot;德拉伦塔&middot;德&middot;洛杉矶&rdquo;，最初是一个供士兵使用的堡垒。<br />More than sixty-five years later, the discovery of gold and silver medal draws settlers from across the country to northern California.&nbsp;<br />六十多年后，金矿和银矿的发现吸引了来自全美各地的移民前往北加州。<br />After the rush for gold dies down, Americans had flocked to Northern California for a fortune begin to disperse and settle parts of Southern California.&nbsp;<br />在淘金热逐渐冷却之后，那些曾涌入北加州寻求财富的美国人开始分散并定居到南加州的部分地区。<br />By 1870, the small town of Los Angeles has gained more than five thousand six hundred residents, which multiplies nearly 20 times by the turn of the century.&nbsp;<br />到1870年时，这个名为洛杉矶的小城镇已拥有超过五千六百名居民，而到世纪之交时，这一数字增长了近20倍。<br />The rapidly increasing population puts additional strain on the Los Angeles River, the city&#39;s main source of water, which has not been helped by a recent two years of drought.&nbsp;<br />迅速增长的人口给洛杉矶河&mdash;&mdash;这座城市的主水源&mdash;&mdash;带来了更大的压力，而最近两年的干旱更是雪上加霜。<br />In order to avoid tragedy, a new water source has to be found.&nbsp;<br />为了避免灾难，必须寻找新的水源。<br />The city of Los Angeles is a development as an urban center and a growing thirst for water facilitated the triumph of the creation of the Los Angeles Aqueduct, but simultaneously led to the tragedies of St. Francis Dam and the draining of important landmarks like Mono Lake and Owen Zone.&nbsp;<br />随着洛杉矶作为城市中心的发展，以及日益增长的用水需求，洛杉矶引水渠得以建成，这是一项伟大的成就；但同时也导致了圣弗朗西斯科大坝的悲剧，以及包括莫诺湖和欧文斯地区在内的多个重要地标被抽干。<br />In the year 1900, the city of Los Angeles is growing faster than its water resources, a need for the city is as clear as the water they need.&nbsp;<br />1900年时，洛杉矶市的增长速度已经超过了其水资源的增长速度，城市对水的需求如同它所需要的水一样清晰明了。<br />In 1902, Irish American civil engineer William Holland was named superintendent of the Los Angeles Water Department.&nbsp;<br />1902年，美籍爱尔兰裔土木工程师威廉&middot;霍兰被任命为洛杉矶水务局主管。<br />Soon after the department began considering options to quench the city of Los Angeles&#39;s growing thirst, they eventually settled on a lake.&nbsp;<br />该部门不久后便开始考虑解决洛杉矶日益增长的用水需求的方案，最终他们将目光锁定在一个湖泊上。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693055/72ca6701588d44ae88732b21f6a27a51.mp3", "kws": ["angeles", "water", "aqueduct", "candidate", "center", "city", "creation", "department", "development", "draining"]}, {"id": 2134, "name": "Loss leader strategy", "ref": "A loss leader is when companies intentionally sell their products at an unprofitable price in order to attract new customers. The aim of the loss leader strategy is usually for companies to build a loyal customer base so that when they eventually increase their prices, they will make a profit. However, the loss leader strategy is a potential risk especially for small companies.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658783/bb8731e727ed4070a72d9987f8789b83.mp3\"></audio></div><br />Now, as we all know, companies usually set out to make a profit on the goods and services they sell. However, that&#39;s not always the case. So today we&#39;re going to look at a strategy called the loss leader and why companies may decide to use it.<br />现在，众所周知，公司通常以销售商品和服务来获取利润为目标。然而，情况并非总是如此。所以今天我们要探讨一种称为&ldquo;亏损领导者&rdquo;的策略，以及公司可能决定采用这种策略的原因。<br />Basically, a loss leader is a product or service that the company is willing to sell at a very low price, even though it will lead to a financial loss.<br />基本上，&ldquo;亏损领导者&rdquo;是指公司愿意以极低的价格出售的产品或服务，即使这会导致财务亏损。<br />For instance, brand new products are often sold at a special promotional or introductory price.<br />例如，全新的产品通常以特别的促销价或 introductory price（介绍性价格）出售。<br />The idea is that this low price will help spread the word about the product, so in essence, it serves as a form of marketing.<br />其目的是，这个低价将有助于传播产品的口碑，所以本质上，它是一种营销形式。<br />The low price will tempt people to at least try it once, and then if the products are hit, there will be enough loyal customers that will continue to purchase it even once the company has increased the price.<br />低价会吸引人们至少尝试一次，如果产品受欢迎，就会有足够的忠实顾客，即使公司提高价格后也会继续购买。<br />So the rationale is that the short-term loss is worth the potential long term gain.<br />因此，其基本原理是，短期的损失值得潜在的长期收益。<br />However, it should be noted that this strategy is of course highly risky.<br />然而，应该指出的是，这种策略当然具有很高的风险。<br />After all, there&#39;s nothing stopping customers from switching to other brands once the introductory price disappears.<br />毕竟，一旦促销价消失，没有什么能阻止顾客转向其他品牌。<br />And obviously any decision which involves a financial loss has to be carefully calculated.<br />显然，任何涉及财务损失的决定都必须经过仔细计算。<br />Large companies may have the financial power to take this sort of risk, but for a new or small company, the financial implications are huge.<br />大型公司可能拥有承担这种风险的财力，但对于一家新公司或小公司来说，其财务影响是巨大的。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658783/73539a3ce85d46bf922c3b1b795c50f5.mp3", "kws": ["companies", "leader", "loss", "strategy", "attract", "base", "build", "customer", "customers", "especially"]}, {"id": 4468, "name": "Luxury brand", "ref": "How a luxury brand forms is hard to explain. For standard business, a luxury brand is about the exclusivity through high prices and low stock. However, some luxury brands are characterized by huge quantity in sales and low prices. The speaker thinks both cases are relative. Therefore, the reason to explain the formation of a luxury brand is complicated. In business community, it refers to the more expensive brands.", "ana": "The question today is, what makes a luxury brand a luxury brand and how do we distinguish it is very hard to answer.&nbsp;<br />今天我们要回答&ldquo;一个奢侈品牌之所以成为奢侈品牌的原因是什么？&rdquo;以及&ldquo;我们如何区分它？&rdquo;这个问题非常困难。<br />The standard business response is to say, &#39;they are more exclusive&#39;.&nbsp;<br />商业领域常见的回答是：&ldquo;它们更具排他性&rdquo;。<br />And we get exclusivity by having high price and relatively small amounts of the product available.&nbsp;<br />这种排他性来自于高价和相对较少的产品供应量。<br />The reality, however, of luxury brands is that they are sold in their millions, and in some cases, are not priced that much higher than the standard output.&nbsp;<br />然而现实是，奢侈品牌的产品销量可以达到数百万件，有些产品的价格甚至比普通产品高不了太多。<br />The only way I can really answer your question is to say, it is all relative.&nbsp;<br />我唯一能回答你的方式是说：这一切都是相对的。<br />As you said in your introduction, it wasn&rsquo;t that long ago in Australia that we would have considered two televisions to be a luxury, or even further back, one color television.&nbsp;<br />正如你在引言中所说，在不太久远的澳大利亚历史中，拥有两台电视机曾被视为一种奢侈，更早的时候，拥有一台彩色电视机就是奢侈品。<br />And you can make a strong argument, for example, that Starbucks in China, right now, is a luxury purchase &ndash; because of its cost, because of how frequently it is purchased by many people.&nbsp;<br />例如，你可以有力地论证：如今在中国，星巴克是一种奢侈消费&mdash;&mdash;因为它的价格、也因为它被很多人购买的频率。<br />So, I think the long answer is a complicated one, but the answer is, it depends who you talk to.&nbsp;<br />所以，我认为这个问题的完整答案很复杂，但最终的答案是：这取决于你问的是谁。<br />I think in the business community what we would say, is that there is a small cluster of &#39;more expensive brands&#39; which have a distinct strategy that we would identify as being &#39;luxury brands&#39; and they start with the Rolls Royces and the Tiffanys and the Louis Vuittons of the world.&nbsp;<br />我想在商业界，我们会说：有一小部分&ldquo;更昂贵的品牌&rdquo;，它们有着独特的战略，我们可以将它们认定为&ldquo;奢侈品牌&rdquo;，比如劳斯莱斯、蒂芙尼和路易威登这些世界知名的品牌。<br />And, I think that tends to be how we see them.&nbsp;<br />我想，这就是我们通常看待它们的方式。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693066/561a9a9de48a40a3ac25945f303d10ec.mp3", "kws": ["Australia", "what makes a luxury brand", "how we distinguish it", "the standard business response", "exclusive", "expensive", "in reality", "the real answer", "depends on whom you talk to", "make a profit"]}, {"id": 2129, "name": "Multiculturalism & cultural diversity", "ref": "Multiculturalism promotes acceptance of diverse cultures, fostering inclusivity and harmony by celebrating differences rather than enforcing assimilation. It contrasts with the &quot;melting pot&quot; model, preserving cultural identities to enrich societal coexistence. By embracing multiculturalism, societies can broaden understanding of the world and fosters a sense of unity and acceptance. In this way, we can create a more vibrant and enriching society for all.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678650/850d149d6bb14ae5b41936ba8ad6c36d.mp3\"></audio></div><br />Multiculturalism is an important aspect of our society, as it encourages us to embrace and appreciate the diverse cultures that make up our world.<br />多元文化主义是我们社会的重要组成部分，因为它鼓励我们接受并欣赏构成我们世界的多元文化。<br />This concept promotes the idea that we should not only tolerate, but also celebrate and learn from the differences in our society.<br />这一理念提倡我们不仅应容忍差异，还应庆祝并从中学习。<br />Rather than expecting everyone to conform to one dominant culture, multiculturalism encourages respect for individual traditions and beliefs.<br />多元文化主义并不强求所有人都去适应一种主流文化，而是鼓励人们尊重各自的传统文化和信仰。<br />By recognizing and valuing cultural diversity, we can create a more inclusive and harmonious society.<br />通过认可和重视文化多样性，我们可以创造一个更具包容性和和谐性的社会。<br />This is in contrast to the idea of a melting pot, where diversity is expected to disappear as everyone assimilates into one homogeneous culture.<br />这与&ldquo;大熔炉&rdquo;观念形成对比，在后者中，多样性被认为会随着所有人融入一种同质文化而逐渐消失。<br />Embracing multiculturalism allows us to broaden our understanding of the world and fosters a sense of unity and acceptance amongst different groups.<br />拥抱多元文化主义使我们能够拓宽对世界的理解，并在不同群体之间培养团结与接纳的意识。<br />Ultimately, it is through respecting and celebrating our differences that we can create a more vibrant and enriching society for all.<br />最终，正是通过对差异的尊重与庆祝，我们才能为所有人建立一个更加充满活力且富有意义的社会。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678650/8cc1069e3a2349dda333a7b33ea0d798.mp3", "kws": ["acceptance", "multiculturalism", "quot", "assimilation", "broaden", "celebrating", "coexistence", "contrasts", "create", "cultural"]}, {"id": 4456, "name": "Negative bias", "ref": "The passage explains that emotions can be categorized as positive or negative, and provides examples of the physical expressions associated with anger and happiness. It discusses how anger increases blood flow to the hands and releases adrenaline, while happiness and calmness inhibit negative emotions. It acknowledges the influence of hormones on our actions. The passage also mentions a forthcoming discussion on healthy and unhealthy expressions of emotions.", "ana": "Next, let&#39;s look at a positive and negative emotions and positive and negative expression of these emotions.&nbsp;<br />接下来，我们来看看积极情绪和消极情绪，以及这些情绪的积极和消极表达方式。<br />No one can see positive and negative.&nbsp;<br />没有人能直接看到&ldquo;积极&rdquo;或&ldquo;消极&rdquo;。<br />I mentioned earlier that there is a range of feelings that we there&#39;s a range of expressions that we feel ranging from anger, sadness, shame, frustration or depression, disgust, love, calm or happiness or sadness.&nbsp;<br />我之前提到过，我们有一系列的感受，也有各种各样的情绪表达，从愤怒、悲伤、羞耻、沮丧或抑郁，到厌恶、爱、平静、快乐或悲伤。<br />So if I&#39;m looking at these emotions, I can broadly categorize all of them in either being positive or negative.&nbsp;<br />因此，当我观察这些情绪时，我可以将它们大致归类为积极或消极两类。<br />So let&#39;s take, for instance, anger and fear.&nbsp;<br />比如，我们可以看看愤怒和恐惧这两种情绪。<br />So if I&#39;m feeling angry, what happens is all the blood, the blood flow is increased towards my hands.&nbsp;<br />当我感到愤怒时，血液会大量流向双手。<br />As a result, it makes it easier for me to grasp a weapon or to make a strike.&nbsp;<br />这让我更容易握住武器或发起攻击。<br />And that is a lot of adrenaline that is released, which increases energy necessary for the action.&nbsp;<br />同时，体内会释放大量肾上腺素，为即将采取的行动提供所需能量。<br />On the other hand, if I&#39;m feeling happy, if I&#39;m feeling calm.&nbsp;<br />另一方面，如果我感到快乐或者平静。<br />The major center is the brain for a lot of activity, and this inhibits negative emotions as feeling negative or negative emotions from entering our mind.&nbsp;<br />大脑是许多活动的主要中枢，它会抑制负面情绪进入我们的思维。<br />So this is what happens.&nbsp;<br />这就是实际发生的过程。<br />It has a lot to do with hormones.&nbsp;<br />这与荷尔蒙有很大关系。<br />It has a lot to do with.&nbsp;<br />这也与很多因素有关。<br />This is a reason why they see that it was in an impulse.&nbsp;<br />这也是为什么人们会说：&ldquo;我当时一时冲动。&rdquo;<br />I happened to slap the person, but I didn&#39;t mean it.&nbsp;<br />我碰巧打了那个人一巴掌，但我不是故意的。<br />When I&#39;m angry, I don&#39;t realize that I end up hitting the person.&nbsp;<br />当我生气的时候，我没有意识到自己最终真的动手打了人。<br />So this has a lot to do with your hormones.&nbsp;<br />这种行为也与你的荷尔蒙水平密切相关。<br />Once you have once you know what you&#39;re feeling, once you are aware, you have labeled your feelings really well.&nbsp;<br />一旦你了解了自己的感受，一旦你有了觉察，并准确地给自己的情绪贴上了标签。<br />This is exactly what happens when there&#39;s blood flow rushing through your own hands.&nbsp;<br />你就能清楚地知道当血液涌向双手时，身体正在发生什么。<br />And then it makes it easier for you to make a strike, to grasp something or to defend yourself.&nbsp;<br />这让你更容易做出打击动作、抓住某物或保护自己。<br />This is exactly what happens when we&#39;re talking about positive and negative expression of our feelings.&nbsp;<br />这正是我们在谈论情绪的积极与消极表达时所发生的事情。<br />This is positive and negative.&nbsp;<br />这就是积极与消极的区别。<br />Next, we look at the healthy and the unhealthy ways of expressing ourselves.&nbsp;<br />接下来，我们将探讨表达自我的健康与不健康方式。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693054/db5a01603f974e3980613bebb950f1b1.mp3", "kws": ["emotions", "anger", "expressions", "happiness", "negative", "passage", "acknowledges", "actions", "adrenaline", "associated"]}, {"id": 4458, "name": "Neolithic stones", "ref": "Historical objects have quite a lot of mathematical significance. These Neolithic stones are probably the first examples of humans exploring the concept of symmetry. One of the intriguing things about these stones is that we don&#39;t actually know what they&#39;re for, and that&#39;s why the speaker likes them. Mathematics is a great subject, created the technology around us, but mathematicians create our mathematical objects for the joy and the beauty.", "ana": "I suppose you wouldn&#39;t expect perhaps to find a mathematician in a museum of historical objects, but actually, the objects that I&#39;ve been drawn to in this museum have quite a lot of mathematical significance.&nbsp;<br />你或许不会想到会在一个历史文物博物馆里遇到一位数学家，但事实上，我在这家博物馆中被吸引的那些展品其实具有相当多的数学意义。<br />These Neolithic stones, discovered in Scotland, dating back 5,000 years, are probably the first examples of humans exploring the concept of symmetry.&nbsp;<br />这些在苏格兰发现的新石器时代石块，距今已有五千年历史，它们可能是人类最早探索对称性概念的实例。<br />And that&#39;s what I do as a practicing mathematician. I spend my life trying to understand what symmetries are possible, in nature and in mathematics and abstractly.&nbsp;<br />而这正是我作为一名职业数学家所做的工作。我毕生都在努力理解自然界、数学中以及抽象层面可能存在的各种对称性。<br />And here I&#39;ve got a connection, going back 5,000 years, to people who are already trying to understand&ndash;how can I arrange patches on the side of these stone balls in a symmetrical manner?&nbsp;<br />在这里，我与五千年前的人们建立起了联系&mdash;&mdash;他们当时就已经在尝试理解一个问题：如何将这些石球表面的图案以对称的方式排列？<br />One of the intriguing things about these stones is that we don&#39;t actually know what they&#39;re for.&nbsp;<br />关于这些石块，一个引人入胜的谜团是，我们实际上并不知道它们的用途是什么。<br />They might have been for divination&mdash;trying to predict the future.&nbsp;<br />它们可能是用于占卜&mdash;&mdash;预测未来。<br />They might have been part of a game. They look very much like dice, but we don&#39;t really think there is any game associated with them.&nbsp;<br />它们也可能是某种游戏的一部分。它们看起来很像骰子，但我们并不认为它们真的和任何游戏有关。<br />Maybe they were just for chucking around, they&#39;re very nice in the hand when you hold them.&nbsp;<br />也许它们只是用来抛掷玩耍的，当你拿在手里时，手感非常好。<br />Or maybe they were symbols of power in the clan.&nbsp;<br />或者，它们可能是氏族中权力的象征。<br />I suppose that&#39;s why I like them because we don&#39;t really know what they are.&nbsp;<br />我想这正是我喜欢它们的原因之一&mdash;&mdash;因为我们真的不知道它们到底是什么。<br />If I had a theory about why they were doing this it would be that actually, they were starting to be mathematicians, and that here we see the first example of abstract thought at work.&nbsp;<br />如果我要推测一下他们为何制作这些石块，我会认为，他们其实已经开始成为数学家了，而这也标志着我们第一次看到抽象思维的运用。<br />That these weren&#39;t for a purpose.&nbsp;<br />这些石块并不是为了某个具体的目的而制造的。<br />Mathematics is a great subject, created a lot of the technology around us, but mathematicians we create our mathematical objects for the joy and the beauty,&nbsp;<br />数学是一门伟大的学科，它创造了我们周围许多技术；但对我们数学家来说，我们创造数学对象是为了其中的乐趣与美感，<br />so it will be lovely to think that these didn&#39;t actually have a use, that they were just really a celebration of what&#39;s possible.&nbsp;<br />因此，我认为非常美好的一种想法是：这些石块其实并没有实际用途，它们只是对&ldquo;可能性&rdquo;的一种庆祝。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693056/3403a847be504bb4a643d219020342c7.mp3", "kws": ["mathematical", "objects", "stones", "actually", "around", "beauty", "concept", "create", "created", "examples"]}, {"id": 3796, "name": "Organizational study", "ref": "This lecture is mainly about organisation courses. Firstly, organisation courses are very important. Organisation courses will help us to get leadership skills in our careers. Those skills that are supplied by organisation courses will be helpful to our careers. People can learn how to satisfy the boss. People had better learn organisation courses if they want to get long terms of successful careers.", "ana": "It&#39;s really recommended that everybody take some organization studies courses even if you&#39;re not planning to become a management specialist.<br />我强烈建议每个人都选修一些组织学课程，即使你并不打算成为一名自然领域的专家。<br />These courses will provide leadership skills that we&#39;ve got courses such as Rosens&#39;&nbsp; Leadership Development.<br />这些课程将提供领导力方面的技能，我们有像《罗森斯领导力发展》这样的课程。<br />They&#39;re going to give you the interpersonal competencies and skills to advance in your career.<br />它们将帮助你获得推动职业发展的各种人际交往能力和技能。<br />So I think org (organisation) studies give people a place to go into a number of different careers, be it in the public sector, the private sector or a nonprofit.<br />所以我认为组织学为人们进入各种不同的职业道路提供了可能，无论是在公共部门、私营企业还是非营利机构。<br />I think everyone needs to understand how organizations are structured, how they function and how people interact.<br />每个人都应该了解组织是如何构建的、它们如何运作以及人与人之间如何互动。<br />And then to get to your strategic goal.<br />这样才能实现你的战略目标。<br />It&#39;s really important to take organization studies courses.<br />因此，选修组织学课程非常重要。<br />And I know it&#39;s a bit of a hard sell for a lot of students who are appearing in it.<br />我知道这对很多学生来说听起来不是那么吸引人。<br />But over and over, alumni come back to me and say, you know what, the most important course I&#39;ve ever taken was organization studies.<br />但反复地，校友们回来告诉我：&ldquo;你知道吗，我上过的最重要的课程就是组织学。&rdquo;<br />And I really wish I took it more because those are the skills that really help me move up in my career.<br />而且我真希望当时多选修几门，因为正是这些技能真正帮助我在职业生涯中不断晋升。<br />So those are the competencies or political skills for understanding myself for knowing how to work with difficult people, for knowing how to manage my boss, knowing how to structure the organization, knowing how to create sustainable competitive advantage.<br />这些能力或说政治技能包括：了解自己、学会与难相处的人合作、懂得如何管理上司、如何建立组织结构、如何创造可持续的竞争优势。<br />And those are the skills that really differentiate people who are going to have long term successful careers.<br />而这些技能正是那些拥有长期成功职业生涯的人所具备的特质。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691704/ea2895ae34c941a68ee5f446fa1ec559.mp3", "kws": ["courses", "organisation", "careers", "learn", "people", "skills", "better", "boss", "firstly", "help"]}, {"id": 4465, "name": "Paper rejection", "ref": "Rejection can be a disappointing experience. The chance of getting a paper published is becoming smaller and smaller, but rejections will lead to better results and will be good for the career path. Use this feedback to improve your paper for submission to another journal. Also, publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time.", "ana": "Rejection happens to all of us, and it can be a disappointing experience.&nbsp;<br />拒绝是每个人都会经历的事情，它可能是一次令人失望的经历。<br />I will now give some advice for young researchers.&nbsp;<br />现在，我想给年轻的研究人员一些建议。<br />Many things have changed today, which can be a troubling issue.&nbsp;<br />如今许多事情都发生了变化，这可能会带来一些困扰。<br />The chance of getting a paper published is becoming smaller and smaller.&nbsp;<br />论文被发表的机会正变得越来越小。<br />Although it never is easy to take, rejection is particularly hard at the beginning of your career.&nbsp;<br />虽然被拒绝从来都不容易接受，但在你职业生涯的初期尤其困难。<br />But rejections will lead to a better result and will be good for the career path.&nbsp;<br />但拒绝最终可能会带来更好的结果，并对你的职业发展有益。<br />Use this feedback to improve your paper for submission to another journal as well as your next, more robust study of the topic.&nbsp;<br />请利用这些反馈意见来改进你的论文，以便再次投稿到其他期刊，同时也要用于你今后对该主题更深入的研究。<br />Usually, several individuals with expertise in the topic have donated substantial time to provide detailed advice to advance your paper and future work.&nbsp;<br />通常，几位在该领域有专长的人士已经花费了大量时间，为你提供了详细的建议，以帮助你提升论文和未来的工作。<br />Also, remember that publication does not mean funding.&nbsp;<br />此外，请记住：发表论文并不等于获得资助。<br />Investors will learn how to attract and engage young researchers at the same time.&nbsp;<br />投资者也应学会如何吸引并支持年轻的研究人员。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693063/ae72bdecb2c448bca190034b63971eda.mp3", "kws": ["a small piece of ordinary video", "advice on paper rejection and publishing", "young scientists"]}, {"id": 4459, "name": "Poetry", "ref": "Poetry is an important part of art and culture. Poetry is from the oldest form of literature. The English language in poems and poetry is difficult to understand, making it hard for readers to enjoy poetry, because poems use literary expressions. However, you should learn to simply enjoy it to know more about literature knowledge.", "ana": "Today, poetry means an important part of art and culture.&nbsp;<br />今天，诗歌被视为艺术和文化中重要的一部分。<br />We often talk about the knowledge about the literature in poems.&nbsp;<br />我们经常谈论诗歌中的文学知识。<br />Poetry is from the oldest form of literature, probably predates the origin of writing itself.&nbsp;<br />诗歌是文学最古老的形式之一，甚至可能早于书写的起源。<br />The oldest written manuscripts we have are poems.&nbsp;<br />我们现存最古老的书面手稿就是诗歌。<br />Mostly epic poems tell the stories of ancient mythology.&nbsp;<br />这些诗歌大多是史诗，讲述着古代神话故事。<br />The English language in poems and poetry is difficult to understand, often giving readers a feeling of frustration, making it hard for readers to enjoy poetry.&nbsp;<br />诗歌中使用的英语语言往往难以理解，常让读者感到沮丧，使他们难以享受诗歌的乐趣。<br />This is because poems use literary expressions.&nbsp;<br />这是因为诗歌使用了文学性的表达方式。<br />Poetry was once written according to fairly strict rules of meter and rhyme, and each culture has its own rule.&nbsp;<br />诗歌曾经是按照相当严格的格律和押韵规则写成的，每种文化都有自己的规则。<br />Some poems incorporate rhyme schemes with two or more lines that end in like-sounding words.&nbsp;<br />一些诗歌采用押韵结构，其中两行或更多行以相似发音的词结尾。<br />You should learn to simply enjoy it to know more about literature knowledge.&nbsp;<br />你应该学会去简单地欣赏诗歌，从而了解更多关于文学的知识。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693057/3cdfec5af93147168d993979edc59b95.mp3", "kws": ["lose jobs", "an introduction", "the literature of a period", "modern poetry"]}, {"id": 3798, "name": "Population growth", "ref": "The speech talks about the population. The growing population is a challenge. It brings pressure on resources. Now we have 7 billion people, and they all need water, food, and other resources. These are all problems of security because the growth will not be equally distributed. This population growth will impact the balance of power. Urban growth is remarkable.", "ana": "I hereby do not even need to elaborate too much why I think it is that population matters in the world.<br />我在此甚至不想过多阐述为什么我认为人口问题在世界上很重要。<br />These are the kind of topics which are normally cited when thinking about the population, its challenges, its problems, its opportunities, and its own problems.<br />当我们思考人口问题时，通常会提到这些话题，包括它面临的挑战、问题、机遇以及其自身的问题。<br />After all, pressure on resources is a very obvious point.<br />毕竟，资源压力是一个非常明显的问题。<br />When the world population has now reached 7 billion and is increasing by 7 to 8 million people per year, a diminishing number of course.<br />目前世界人口已达到70亿，并且每年仍在增加700万到800万人，当然这个数字正在逐渐减少。<br />But nonetheless it&#39;s still quite a challenge, particularly when global population is almost certain to add another 3 billion to that 6 billion with all kinds of questions as to the adequacy of resources, water, particularly in global climate change, but also food and other aspects of resources.<br />但即便如此，这仍然是一个相当大的挑战，尤其是当全球人口几乎肯定会从60亿再增加30亿时，各种关于资源是否充足的疑问也随之而来，包括水，尤其是在全球气候变化背景下，还有粮食和其他资源方面的问题。<br />These are all problems of security because this growth will not be equally distributed between different parts of the world.<br />这些都是安全问题，因为这种增长不会在全球不同地区之间平均分布。<br />Some parts of the world will grow. Other parts of the world will shrink.<br />世界上一些地区将增长，而另一些地区则会萎缩。<br />The balance of power, therefore, will correspondingly change for demographic reasons, as we will see.<br />因此，正如我们将看到的那样，出于人口结构的原因，权力的平衡也将相应发生变化。<br />Urban growth is remarkable. We already have megacities of 20 million people. These are going to grow even further in due course.<br />城市化的增长十分显著。我们已经有了人口达2000万的超级城市，它们在未来还将继续增长。<br />One wonders just how far they can grow before certain aspects of the infrastructure start breaking down.<br />人们不禁要问，在某些基础设施开始崩溃之前，这些城市还能扩张到什么程度。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691707/710547712b92434399f9d43e15b77389.mp3", "kws": ["growth", "population", "resources", "balance", "because", "billion", "brings", "challenge", "distributed", "equally"]}, {"id": 2136, "name": "Question Bank", "ref": "Employees&#39; work performance is directly affected by the interior design of their workplace. One inexpensive method for improving performance is placing plants around the office, because they can affect employee productivity and well-being, as well as reducing stress. Another is redesigning office space as open-plan offices can reduce communication by making staff feel reluctant to share ideas openly. Office design therefore has important effects on work culture.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2657000-2658000/2657239/3af36fbd29304ac9bc7f25eb842816e3.mp3\"></audio></div><br />We need to consider more closely the relationship between the interior of a building and its influence on an individual, because interior designers should evaluate the direct outcome their proposals can have on an employee.<br />我们需要更仔细地考虑建筑物内部与其对个人的影响之间的关系，因为室内设计师应该评估他们的提案对员工产生的直接影响。<br />Design can affect them in several ways.<br />设计会以多种方式影响他们。<br />Firstly, setting aside spaces for plants in an office is linked to worker well-being and performance.<br />首先，在办公室为植物留出空间与工人的健康和表现有关。<br />Research has shown that the simplicity of having plants in a working environment positively affects air quality.<br />研究表明，只是在工作环境中种植植物这种简单之事，就会对空气质量产生积极影响。<br />Air that is more filtered than has knock-on effects such as increased productivity, greater concentration and a reduction in stress.<br />经过更多过滤的空气具有连锁效应，如提高生产力、更集中注意力和减少压力。<br />This clearly shows that at minimum cost to companies, working performance can be improved.<br />这清楚地表明，以最低的公司成本，工作绩效可以得到改善。<br />The second one is not as cost effectively, it concerns office space.<br />第二个问题不那么具有成本效益，它涉及到办公空间。<br />While an open plan office is seen to promote interaction and boost communication and productivity, this isn&#39;t always true.<br />虽然开放式办公室被认为可以促进互动、促进沟通和提高生产力，但事实并非总是如此。<br />I think it has now been proven that it can go the opposite way.<br />我认为现在已经证明它可以走相反的路。<br />Open plan offices lead to a lack of face-to-face communication and an over-reliance on electronic interactions as staff feel vulnerable and exposed and less inclined to share ideas.<br />开放式办公室导致缺乏面对面的沟通和过度依赖电子互动，因为员工感到脆弱和暴露，不太愿意分享想法。<br />Finally, it seems clear that the interior of a building directly affects performance at work.<br />最后，很明显，建筑物的内部直接影响工作表现。<br />Therefore, we should not underestimate how work culture is affected by office design.<br />因此，我们不应该低估办公室设计对工作文化的影响。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657239/a6d707af7a0e41d397907c8d3c5521ac.mp3", "kws": ["office", "design", "performance", "work", "affect", "affected", "around", "because", "communication", "culture"]}, {"id": 2126, "name": "Singapore", "ref": "In the lecture, we analyzed Singapore&rsquo;s dynamic approach to globalization, noting its multicultural population and economic prowess. Citing a University of Chicago professor&rsquo;s work, we discussed Singapore&rsquo;s global strategy before exploring its pioneering role in future urban development. By highlighting academic opinions, the talk concluded that Singapore is a model of multiculturalism and innovative urban planning within the global context.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678647/95a21e7bb469484193005cb589407f4a.mp3\"></audio></div><br />In today&#39;s lecture, I explored Singapore&#39;s unique relationship with globalization.<br />今天的讲座中，我探讨了新加坡与全球化之间独特的联系。<br />We started by examining its diverse population and the successful blend of cultures thriving within this small yet powerful island nation.<br />我们首先考察了新加坡多元的人口结构以及在这个小而强大的岛国中繁荣发展的文化融合现象。<br />I also referenced insights from a University of Chicago professor who has studied Singapore&#39;s economic strategies extensively.<br />我还引用了一位来自芝加哥大学、长期深入研究新加坡经济策略的教授的观点。<br />Later, we delved into potential future city models and how they might manifest in places like Singapore, which continues to be at the forefront of urban development and planning.<br />随后，我们深入探讨了未来城市模型以及它们可能在像新加坡这样的地方如何呈现，新加坡一直走在城市开发与规划的前列。<br />The lecture concluded by citing various academic perspectives to offer a well-rounded discussion; names of notable professors were mentioned to credit their contributions to our understanding of globalization and its impact on Singapore.<br />讲座以引用多种学术观点作为结尾，旨在提供一个全面的讨论；几位知名教授的名字被提及，以表彰他们在帮助我们理解全球化及其对新加坡影响方面所做出的贡献。<br />As we scrutinize the examples set by Singapore, it becomes clear that this nation exemplifies the complex dynamics of globalization, standing as a beacon of multiculturalism and forward-thinking urban planning.<br />当我们仔细审视新加坡所树立的榜样时，可以清楚地看到这个国家体现了全球化的复杂动态，成为多元文化和前瞻性城市规划的典范。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678647/b6e3f591e0124fe2a33d11ca619fb5fa.mp3", "kws": ["rsquo", "singapore", "global", "urban", "academic", "analyzed", "approach", "before", "chicago", "citing"]}, {"id": 2137, "name": "Skill-based curriculum", "ref": "Although knowledge will be less valued in future job markets, people are still not keen on introducing a curriculum based on skills. This is because the education system is not ready to teach or assess critical thinking collaboration or the other cross-disciplinary skills that businesses value.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658773/9720489c7df0497e8740875775765782.mp3\"></audio></div><br />There&#39;s a broad agreement that the skills that children will need in the future are different from those that their parents needed in the past.<br />人们普遍认为，孩子未来需要的技能与他们的父母过去需要的技能不同。<br />And many people now believe that cross-disciplinary skills, things like critical thinking or collaboration or problem-solving are going to be necessary to survive in the future.<br />现在许多人相信跨学科技能，比如批判性思维、协作或解决问题，对于未来的生存是必要的。<br />We can already see that information and knowledge are increasing at an incredible rate,<br />我们已经可以看到，信息和知识正以惊人的速度增长，<br />such a rate, in fact, that no one individual can ever hope to learn everything they need to know about every subject and stay truly up to date.<br />事实上，这样的速度让任何人都无法希望学习他们需要知道的关于每个主题的一切，并保持真正的最新状态。<br />What they need are the skills to locate knowledge, and then use that knowledge in jobs.<br />他们需要的是找到知识的技能，然后将这些知识用于工作中。<br />Bear in mind that those jobs may not even exist yet.<br />请记住，这些工作可能还不存在。<br />Now, this may be the case, but one of the biggest challenges with delivering cross-disciplinary skills in the school syllabus is that many teachers were trained to teach knowledge, facts rather than skills.<br />现在，情况可能是这样，但在学校教学大纲中提供跨学科技能的最大挑战之一是，许多教师接受的培训是教授知识事实而不是技能。<br />Most assessments work with knowledge content.<br />大多数评估都与知识内容一起工作。<br />If we are to change the skills that children leave school with, we need to go through a phase of transition that some of those in the education profession feel deeply uncomfortable with.<br />如果我们要改变离开学校的孩子的技能，我们需要经历一个过渡阶段，一些教育行业的人对此深感不舒服。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658773/fb4440efe7034cc18c7d22c1b0818793.mp3", "kws": ["skills", "although", "assess", "based", "because", "businesses", "collaboration", "critical", "cross-disciplinary", "curriculum"]}, {"id": 3790, "name": "Sleep", "ref": "Sleep is essential for learning and memory. Getting enough sleep before and after learning helps consolidate information in the brain. Lack of sleep impairs memory and learning processes. Sleep prepares the brain to absorb new information, acting like a dry sponge. Without sleep, memory circuits become overwhelmed, hindering the absorption of new memories.", "ana": "This is a new discovery about learning and memory.<br />这是一种与学习和记忆相关的新发现。<br />It is a good thing for you to get enough sleep, and a bad thing for you if not.<br />睡眠充足对你有益，而睡眠不足则对你有害。<br />People need to sleep before learning, and people also need to sleep after learning.<br />人们在学习之前需要睡眠，在学习之后也需要睡眠。<br />When you are asleep, the memory can consolidate all the information into your brain.<br />当你入睡时，记忆会将所有信息整合到你的大脑中。<br />From this point, it may only get worse.<br />从这个角度来看，情况可能会更糟。<br />Not only will I tell you about the wonderfully good things that happen when you get sleep, but the alarmingly bad things that happen when you don&#39;t get enough both for your brain and your body.<br />我不仅会告诉你获得足够睡眠带来的诸多好处，还会告诉你睡眠不足对大脑和身体造成的令人担忧的负面影响。<br />Let me start with the brain and the functions of learning and memory, because what we&#39;ve discovered over the past 10 or so years is that you need sleep after learning to essentially hit the save button on those new memories so that you don&#39;t forget.<br />让我先从大脑以及学习与记忆的功能谈起。因为在过去大约十年的时间里我们发现，学习之后你需要睡眠，这就像为新的记忆按下&ldquo;保存&rdquo;按钮，从而避免遗忘。<br />But recently, we discovered that you also need sleep before learning and now to actually prepare your brain almost like a dry sponge, ready to initially soak up new information.<br />但最近我们还发现，学习之前你也需要睡眠，它能让你的大脑像一块干燥的海绵一样，准备好吸收新的信息。<br />And without sleep, the memory circuits of the brain essentially become waterlogged, as it were.<br />如果没有足够的睡眠，大脑的记忆回路可以说就像被水浸透了一样。<br />And you can&#39;t absorb new memories.<br />你就无法吸收新的记忆内容。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691683/fff7d4700ed84c6b9b5b52ba52ce04f6.mp3", "kws": ["sleep", "learning", "memory", "brain", "information", "absorb", "absorption", "acting", "after", "become"]}, {"id": 2141, "name": "Smart skin", "ref": "There is now an electronic skin called a smart skin that can be worn to monitor bodily processes. Athletes like it because it gives them real-time information about their bodies as they are training. lt can monitor various things by analysing their sweat. The skin can also show a person&#39;s heartbeat. The smart skin is very portable and scientists are exploring the numerous different uses it could have.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658779/34ce61f02d4b4ea8bcca023e6fd376a2.mp3\"></audio></div><br />So the development of stretchable electronics or smart skin has long been dreamed of, but it&#39;s now become a reality.<br />因此，可延展电子或智能皮肤的开发长期以来一直是一个梦想，但现在已经成为现实。<br />It is basically an electronic skin that can be worn in order to monitor various bodily processes.<br />它基本上是一种可以穿戴的电子皮肤，用于监测各种身体过程。<br />It&#39;s proving particularly popular with elite athletes during training as it allows clear real time monitoring.<br />它在精英运动员的训练中尤其受欢迎，因为它能够进行清晰的实时监测。<br />One thing that athletes particularly like to monitor is their electrolyte levels.<br />运动员特别喜欢监测的一件事是他们的电解质水平。<br />Electrolytes are minerals in the body that have multiple functions in keeping our bodies running healthily.<br />电解质是体内具有多种功能的矿物质，有助于我们身体健康运转。<br />So it&#39;s very important to maintain their levels.<br />因此，维持它们的水平非常重要。<br />The smart skin is able to analyze these from a person&#39;s sweat.<br />智能皮肤能够通过分析人的汗液来监测这些电解质水平。<br />If levels are low, then athletes need to take care and slow down.<br />如果水平偏低，运动员就需要注意并减速。<br />This instant analysis means that a person has the information at their fingertips, so to speak, and can make decisions before there&#39;s an adverse effect on their health.<br />这种即时分析意味着人们可以随时掌握信息，并在健康受到不利影响之前做出决定。<br />Another way the smart skin is being used is to monitor a person&#39;s heartbeat by showing a visual wave, rather like having a heart monitor strapped to your arm, but a lot more portable and comfortable.<br />智能皮肤的另一种用途是通过显示可视化的波形来监测人的心跳，就像手臂上绑着一个心脏监护仪一样，但它更便携、更舒适。<br />These are just two applications, but scientists are already starting to explore the myriad uses for this technology.<br />这仅仅是两个应用，但科学家们已经开始探索这项技术的无数用途。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658779/a0035877a5fa4c3ca287baa6b28e7077.mp3", "kws": ["skin", "monitor", "smart", "analysing", "athletes", "because", "bodies", "bodily", "called", "different"]}, {"id": 2128, "name": "Sound of words", "ref": "The lecture explains the significance of words and their sound. It discusses how the sound of words is crucial for cognitive processes, representing the world and self-perception. It also emphasizes the broad capacity of words to express concepts, using high school graduates as an example. The mention of phone numbers suggests words are vital for memory. Overall, it underscores the influence of words and sound on cognitive functions and communication", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678649/1b17a91e30fa446d825642fa18ecf010.mp3\"></audio></div><br />The lecture emphasizes the importance of words and the impact of their sound.<br />讲座强调了词语的重要性以及其发音所产生的影响。<br />According to the speaker, the sound of words plays a crucial role in cognitive processes, aiding in the representation of the world and self-perception.<br />讲者指出，词语的发音在认知过程中起着关键作用，有助于我们对世界的理解和自我认知。<br />Furthermore, the lecture highlights the broad capacity of words to express a multitude of concepts, underscoring their significance in communication and cognitive development.<br />此外，讲座还强调了词语表达多种概念的广泛能力，突显了它们在交流和认知发展中的重要性。<br />The speaker also uses the example of high school graduates to illustrate the importance of words in conveying complex ideas and information.<br />演讲者还以高中毕业生为例，说明词语在传达复杂思想和信息方面的重要性。<br />Additionally, the mention of phone numbers suggests that words and their sounds are integral to memory and recall processes.<br />此外，提到电话号码也表明词语及其发音在记忆和回忆过程中具有重要作用。<br />Overall, the lecture underscores the profound influence of words and their sound on cognitive functions and communication, informing how individuals perceive and interact with the world.<br />总体而言，讲座强调了词语及其发音对认知功能和交流方式所产生的深远影响，这决定了人们如何感知并与世界互动。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678649/f9cd6cf04e2f4bb0b551299463faa250.mp3", "kws": ["words", "sound", "cognitive", "broad", "capacity", "communication", "concepts", "crucial", "discusses", "emphasizes"]}, {"id": 2135, "name": "Sources of protein", "ref": "Our current food system is unsustainable, especially our ways of sourcing protein. This contributes to global greenhouse gas emissions and takes up a large proportion of land for agricultural purposes. We can, however, reduce these negative effects by getting more of our protein from plant-based foods and lab-grown meat, provided that the public can easily access and afford them.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2657000-2658000/2657019/2c9b5b97206d44ee8db30ef509058673.mp3\"></audio></div><br />Our current way of eating is not sustainable, neither for our health nor the environment.<br />我们目前的饮食方式不可持续，对我们的健康和环境都不利。<br />Our food system, which relies on the production of meat, eggs and dairy products as sources of protein, generates 15% of total greenhouse gas emissions globally.<br />我们的食品系统依赖于肉类、蛋类和乳制品的生产作为蛋白质的来源，产生全球温室气体排放总量的15%。<br />It also requires 70% of the agricultural land on Earth.<br />它还需要地球上70% 的农业土地。<br />We need to change how we produce, transport and cook food.<br />我们需要改变我们生产、运输和烹饪食物的方式。<br />Studies show that taking a more flexible approach to the way we obtain protein can allow our diets to have a significantly less damaging effect on the environment.<br />研究表明，采用更灵活的方法获取蛋白质可以使我们的饮食对环境的破坏性影响大大减少。<br />Specifically, it can bring the greenhouse gas emissions down by more than 50%,<br />具体来说，它可以将温室气体排放量降低50% 以上，<br />and we can do this easily by having more plant-based foods and less meat.<br />我们可以通过增加植物性食品和减少肉类来轻松实现这一目标。<br />This should be viable as more and more alternatives to traditional sources of protein are becoming more widely available.<br />这应该是可行的，因为越来越多的传统蛋白质来源的替代品正在变得越来越广泛。<br />Beans, wheat, nuts, and even insects all have a lower impact on the environment<br />豆类、小麦、坚果，甚至昆虫对环境的影响都比较小，<br />and along with the promising development of meat grown in labs,<br />实验室肉类的发展前景也不错，<br />they give us the opportunity to dramatically reduce greenhouse gas emissions compared with those produced by meat production,<br />它们为我们提供了与肉类生产产生的温室气体相比大幅减少温室气体排放的机会，<br />as long as they are both readily available and affordable for the public,<br />只要它们既容易获得又能为公众负担得起，<br />we should be able to flexibly switch between traditional and alternative sources of protein.<br />我们应该能够灵活地在传统和替代蛋白质来源之间切换。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657019/8c9699300ea44b499ca43f0a0b0ec423.mp3", "kws": ["protein", "access", "afford", "agricultural", "contributes", "current", "easily", "effects", "emissions", "especially"]}, {"id": 4442, "name": "Stock market and business", "ref": "The stock market is where investors buy and sell stocks, which represent shares of ownership in public companies. It can be accessed online through a brokerage account or retirement plan. In the past, companies used stocks to raise money, but now modern companies like Apple and Google earn money and use stocks differently. The stock market also tends to invest in large companies.From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently.", "ana": "The stock market is where investors connect to buy and sell investments - most commonly, stocks, which are shares of ownership in a public company.&nbsp;<br />股票市场是投资者进行买卖投资的场所，最常见的投资对象是股票，也就是公众公司所有权的份额。<br />When you need groceries, you go to the supermarket. When you&#39;re ready to buy stocks or mutual funds, you&#39;ll usually buy them online through the stock market, which anyone can access with a brokerage account or employee retirement plan.&nbsp;<br />当你需要购买日用品时，你会去超市；而当你准备购买股票或共同基金时，通常会通过股票市场在线购买。只要有证券账户或员工退休计划，任何人都可以进入这个市场。<br />The term &#39;stock market&#39; often refers to one of the major stock market indexes.&nbsp;<br />&ldquo;股票市场&rdquo;一词通常也用来指代主要的股票市场指数之一。<br />However, there are some different uses of the stock market before and after.&nbsp;<br />然而，在不同时期，股票市场的用途存在一些差异。<br />In the 18th century, manufacturing companies came into the market. Traditional companies used stocks to raise money, and input money into companies, while modern companies used stocks to output money.&nbsp;<br />在18世纪，制造类公司开始进入市场。传统公司通过发行股票筹集资金，将资金投入企业，而现代公司则通过股票实现资金的输出。<br />From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently.&nbsp;<br />然而从19世纪到20世纪，现代公司如苹果、谷歌和微软已经足够强大，能够自行盈利，因此它们使用股票的方式也有所不同。<br />The stock market also inclined to put money into big companies.&nbsp;<br />股票市场也更倾向于将资金投入到大型公司中。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693053/2aa766ab77a5453fb30c5b4831898e08.mp3", "kws": ["companies", "stocks", "money", "apple", "differently", "earn", "google", "market", "modern", "stock"]}, {"id": 2133, "name": "Street art", "ref": "Street art has developed as a form of expression ever since its graffiti origins and has many different influences. lt&#39;s now a common feature in many cities and sometimes conveys quite positive messages. However, street art still remains somewhat controversial and can actually be illegal. Nevertheless, public perceptions of it have gradually become more accepting. Indeed, now some of the most famous street artists areas respected as their counterparts working inconventional creative fields.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658782/e685a5564c884abb876bea6451099c5b.mp3\"></audio></div><br />Streetheart developed from an underground art form into something which has achieved mainstream recognition and acceptance.<br />街头艺术从一种地下艺术形式发展成为获得主流认可和接受的事物。<br />It has its origins in the graffiti trend, which became popular in cities in the 1960s.<br />它起源于 20 世纪 60 年代在城市中流行的涂鸦潮流。<br />At that time, adding graffiti to public spaces was most definitely considered to be an act of vandalism.<br />当时，在公共场所涂鸦绝对被认为是破坏行为。<br />Indeed, it was hardly viewed as art at all, but rather as an expression of social frustration.<br />事实上，它几乎不被视为艺术，而更多地被看作是社会挫败感的表达。<br />However, over the decades, street art has developed artistically.<br />然而，几十年过去了，街头艺术在艺术上得到了发展。<br />Street artists have taken their inspiration from a wide variety of cultural influences, including hip hop music and graphic design trends.<br />街头艺术家从各种文化影响中汲取灵感，包括嘻哈音乐和平面设计潮流。<br />Nowadays, many urban centers have colorful, large scale wall paintings displaying uplifting or socially responsible messages.<br />如今，许多城市中心都有色彩鲜艳的大型壁画，展示着令人振奋或具有社会责任感的信息。<br />For this reason, street art is now viewed as part of the urban landscape and in some cases is a source of local pride.<br />因此，街头艺术现在被视为城市景观的一部分，在某些情况下还是当地自豪感的来源。<br />The street art projects I&#39;ve just mentioned are, of course, officially approved schemes.<br />我刚才提到的街头艺术项目当然是官方批准的计划。<br />However, some designs still appear on the sides of buildings without legal permission, and that&#39;s why street art is still a controversial art form.<br />然而，一些设计仍然未经许可出现在建筑物的外墙上，这就是为什么街头艺术仍然是一种有争议的艺术形式。<br />Nevertheless, it is now broadly accepted to the extent that some street artists have even achieved the same level of fame as celebrated artists in other creative fields.<br />尽管如此，它现在已被广泛接受，以至于一些街头艺术家甚至达到了其他创意领域著名艺术家一样的名声。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658782/5d110e64bb194d0096a1fb931bd44cc4.mp3", "kws": ["street", "accepting", "actually", "areas", "artists", "become", "cities", "common", "controversial", "conveys"]}, {"id": 3791, "name": "Telescope", "ref": "Our eye is a tiny five-millimeter telescope. When we have larger telescopes that collect more light, we can see things fainter but it greatly improves detail. This is because the nature of light is a wave which has quantum mechanical effects. Telescopes also allow us to put modern digital detectors behind them, which are 100 times more efficient. Such improvement allowed astronomy to do so much in the optical regime.", "ana": "So let&#39;s just talk a little bit about a telescope.<br />那么，我们来稍微谈谈望远镜。<br />Our eye is the telescope we all are used to.<br />我们的眼睛就是我们最熟悉的望远镜。<br />It&#39;s a little tiny five millimeter telescope, and it serves us very well.<br />它是一个小小的、只有五毫米的望远镜，但它为我们服务得很好。<br />But if we make telescopes bigger, we get a couple of good things.<br />但如果我们制造更大的望远镜，我们就能获得一些更好的效果。<br />We have larger telescopes and they collect a lot more light so we can see things that are fainter.<br />更大的望远镜可以收集更多的光线，使我们能看到更暗弱的天体。<br />But it turns out they greatly improve detail.<br />此外，它们还能显著提升图像的细节。<br />And that&#39;s because of the nature that light is a wave, and wave effects are what we call quantum mechanical effects,<br />这是因为光具有波动性，而波动效应就是我们所说的量子力学效应，<br />meaning that when you use a little telescope to look at waves, it becomes blurry through what we call diffraction.<br />也就是说，当你用一个小望远镜观察光波时，由于我们称之为&ldquo;衍射&rdquo;的现象，图像会变得模糊。<br />And so larger telescopes are extremely useful to improve detail.<br />因此，更大的望远镜在提升细节方面非常有用。<br />The other thing that telescopes allow us to do is to put modern digital detectors behind them.<br />望远镜还让我们能够在其后方安装现代的数字探测器。<br />Our eye is about the same sensitivity as a photographic plate.<br />我们的眼睛对光的敏感度大致与摄影底片相当。<br />A photographic plate can be sat there and it can look at the sky for an hour so it can see fainter.<br />摄影底片可以持续曝光一小时，从而看到比肉眼更暗的天体。<br />But modern digital detectors are almost 100 times more efficient than our eyes at collecting light.<br />但现代的数字探测器在收集光线方面的效率几乎是我们眼睛的100倍。<br />And so you can improve things by a factor of 100.<br />因此，你可以将观测能力提升100倍。<br />That&#39;s like building a telescope ten times bigger.<br />这相当于建造一个口径大10倍的望远镜。<br />And so that improvement has been one of the things that&#39;s allowed astronomy to do so much in the optical regime in the last 30 years.<br />这种技术进步正是过去30年里光学天文领域取得巨大成就的关键因素之一。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691687/aa4905fb2e8c4da485dafb8801dfb653.mp3", "kws": ["light", "telescopes", "allow", "allowed", "astronomy", "because", "behind", "collect", "detail", "detectors"]}, {"id": 4460, "name": "The internet requires energy", "ref": "This lecture mainly talks about the Internet. The Internet comprises devices, data centers, and communication lines. It consumes about five percent of global electricity, with data centers using one or two percent. Most of the electricity comes from burning fossil fuels, resulting in greenhouse gas emissions. Compared to other sectors, the Internet&#39;s contribution to global emissions is around two percent.", "ana": "The Internet is pretty great, this wouldn&#39;t be a thing without it, but getting this video and all the other bits of the Internet to you uses a lot of energy.&nbsp;<br />互联网非常了不起，没有它，这段视频根本不可能存在。但将这段视频以及互联网上的其他内容传送到你手中，需要消耗大量能源。<br />What we call the Internet is made up of a lot of things, wires traversing the ocean, satellites and cell phone towers, massive data centers sending packets of information all over, and devices &mdash; so many devices!&nbsp;<br />我们所说的互联网由许多部分组成：横跨海洋的电缆、卫星和手机信号塔、庞大的数据中心向世界各地发送信息包，还有各种设备&mdash;&mdash;数不胜数！<br />Today, there are more than 30 billion things connected to the Internet.&nbsp;<br />今天，已有超过300亿台设备连接到互联网。<br />That&#39;s every cell phone, laptop, and tablet, but also every credit card reader, creepy, all-hearing speaker, newfangled fridge with a TV on the front end, and more things coming online every day.&nbsp;<br />这包括每一部手机、笔记本电脑和平板电脑，还包括每一台刷卡机、令人不安的智能音箱、带有屏幕的新型冰箱，以及其他每天都在接入网络的新设备。<br />Every single one of these devices requires electricity.&nbsp;<br />每一台这样的设备都需要电力支持。<br />Charging a single phone or a laptop doesn&#39;t use that much energy, but powering billions of Internet-connected devices adds up.&nbsp;<br />为一部手机或笔记本电脑充电所消耗的能源并不多，但数十亿台联网设备加在一起就非常可观了。<br />It&#39;s hard to estimate exactly how much because things are changing too fast, even count.&nbsp;<br />要准确估算具体的能耗非常困难，因为一切都变化得太快，甚至连统计都变得困难。<br />But in total, Internet-connected devices probably use in the neighborhood of five percent of the world&#39;s electricity.&nbsp;<br />但总体而言，互联网连接设备可能消耗了全球大约百分之五的电力。<br />Once you&#39;ve got your Internet portal charged and ready to go, streaming a video or posting a pic on Instagram, draws on power from data centers distributed around the world.&nbsp;<br />一旦你的互联网终端充满电并准备使用，无论是在线观看视频还是在Instagram上发布照片，都会调用全球各地数据中心的电力资源。<br />After devices, data centers are the Internet&#39;s next biggest energy hog, using around one or two percent of the world&#39;s total electricity.&nbsp;<br />除了终端设备之外，数据中心是互联网第二大耗能部分，约占全球总用电量的1%至2%。<br />And most of this electricity comes from burning fossil fuels, which release greenhouse gases into the atmosphere.&nbsp;<br />而其中大部分电力来自燃烧化石燃料，这会向大气中排放温室气体。<br />But when compared to all the other things that produce greenhouse gases like transportation, which causes almost a quarter of global emissions, the unit is doing all right.&nbsp;<br />不过与交通运输等其他温室气体来源相比&mdash;&mdash;交通运输几乎占全球排放量的四分之一&mdash;&mdash;互联网的碳排放表现还算不错。<br />In total, it contributes only around two percent of global emissions.&nbsp;<br />总的来说，互联网仅贡献了全球温室气体排放量的大约2%。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693058/6f123563eaa84765bca0c39220f16fa8.mp3", "kws": ["internet", "percent", "centers", "data", "electricity", "emissions", "global", "around", "burning", "comes"]}, {"id": 4466, "name": "The stability of mood", "ref": "Emotional stability varies between individuals. Research indicates that the key to happinessis maintaining a delicate balance of emotional containment and resilience, allowing for a natural ebb and flow of emotions. Finding this equilibrium is essential for emotional well-being and health, ultimately granting individuals a sense of contentment, and happiness.", "ana": "Emotional stability is a unique trait that differs from person to person.&nbsp;<br />情绪稳定性是一种因人而异的独特特质。<br />For some individuals, their moods fluctuate dramatically, resembling a roller coaster ride, while others present a consistently composed and relaxed demeanor.&nbsp;<br />对一些人来说，情绪起伏剧烈，就像坐过山车一样；而另一些人则表现出一贯的沉着与放松。<br />Studies have suggested that the key to achieving happiness lies in maintaining a certain level of emotional containment.&nbsp;<br />研究表明，获得幸福的关键在于保持一定程度的情绪控制。<br />It is a delicate balance between maintaining a sense of control while also allowing for the natural ebb and flow of emotions.&nbsp;<br />这是一种在掌控感与情绪自然起伏之间取得微妙平衡的状态。<br />The optimal emotional state appears to be characterized by a point of equilibrium, wherein there is a moderate level of emotional containment and resilience.&nbsp;<br />最佳的情绪状态似乎是一种平衡点，表现为适度的情绪控制力和心理韧性。<br />Essentially, the secret to emotional well-being involves finding this balance.&nbsp;<br />本质上，实现情绪健康的关键就在于找到这种平衡。<br />It means navigating between intense and loose emotions, striving for a state of gentle containment coupled with a poised resilience.&nbsp;<br />这意味着要在激烈与松散的情绪之间游走，努力达到一种温和节制并伴有从容坚韧的状态。<br />This harmonious emotional state ultimately grants an individual a sense of contentment and well-being.&nbsp;<br />这种和谐的情绪状态最终会赋予个体满足感和幸福感。<br />Therefore, understanding and achieving this delicate equilibrium is essential for emotional health and happiness.&nbsp;<br />因此，理解和实现这种微妙的平衡，对于情绪健康和幸福感至关重要。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693064/27ea476b5d51424ba6f5f1fe72bafdcf.mp3", "kws": ["content and pleasant", "the stability of mood", "vary among different people", "easily get intense", "riding a roller coaster", "loose", "the secret of happiness", "mild contentment", "a balance between intense and loose emotions"]}, {"id": 2122, "name": "Transportation network in Paris", "ref": "Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678215/f7e2adc70f8042a2803cb65f006ee28f.mp3\"></audio></div><br />As with most cities, we recommend getting about on foot.<br />和大多数城市一样，我们建议步行出行。<br />Besides being eco-friendly, it&#39;s a great way to get a feel for the city.<br />除了环保之外，这也是了解这座城市的好方式。<br />Just bear in mind that Paris is big, like really big.<br />但请记住，巴黎很大，是非常大。<br />A walk from the Eiffel Tower to Notre Dame would take a good hour.<br />从埃菲尔铁塔走到圣母院大约需要整整一个小时。<br />Fortunately, if you&#39;re strapped for time, there are great public transport links.<br />幸运的是，如果你时间紧张，也有非常便捷的公共交通。<br />The subway system is split into the metro and RER lines.<br />地铁系统分为地铁线和RER线。<br />Tickets will work across both, so you can treat it as one big underground network.<br />车票两者通用，因此你可以将它们视为一个庞大的地下交通网络。<br />In our experience, it served a purpose, which was to get us around quickly.<br />根据我们的经验，它确实达到了目的，那就是让我们快速通行。<br />It&#39;s just not the cleanest.<br />只是环境并不算最干净。<br />The Metro has 16 lines, each with a different color.<br />地铁有16条线路，每条都有不同的颜色。<br />The five RER lines are labeled with the letters A B C D E.<br />5条RER线路分别用字母A、B、C、D、E标注。<br />RER and metro trains run every day from 6:00 a.m. until half past midnight.<br />RER和地铁列车每天从早上6点运行到午夜半点。<br />As for tickets, a single journey is 1.90 euro.<br />至于车票，单程票价是1.90欧元。<br />We bought a book of 10 for 14.50 euro.<br />我们买了一本10张的套票，价格是14.50欧元。<br />Now there are weekly or monthly passes available.<br />现在也有周卡或月卡可供选择。<br />But in my opinion, they&#39;re just a farce.<br />但在我看来，这些卡简直是一场闹剧。<br />We need a passport photo and everything else.<br />你需要提供护照照片以及其他材料。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678215/dab162e55f594de7b18dc6000cd83ebb.mp3", "kws": ["euros", "lines", "metro", "tickets", "trains", "abcde", "book", "colors", "different", "distinguished"]}, {"id": 3800, "name": "Trust levels", "ref": "Sharing economy platforms are getting Americans to trust each other again. Over the last 40 years, the level of trust in society has fallen quite dramatically but we&#39;ve developed a heightened level of trust in strangers on digital interface. Every time society has created a new basis for trust, it has expanded the economy dramatically, so this will expand economic activities and possibilities for trade.", "ana": "I&#39;m fascinated by the extent to which sharing economy platforms like Ube
