<script>
var D=[{"id": 4451, "name": "A female novelist", "ref": "The speaker shares her personal journey from writing non-fiction to fulfilling her dream of becoming a novelist. Inspired by the belief that true art requires taking risks, she finally began writing fiction in the early 1990s. As a result, she drafted the first chapter of her acclaimed novel, &quot;The Secret Life of Bees,&quot; in 1992, which remains largely unchanged in the final published version.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693679/0a8b2d7c87ab446080a2a82f38dbd3b4.mp3\"></audio></div><br /><br />I have been writing non-fiction for years actually, but secretly wanting to be a novelist.<br />实际上，我多年来一直在写非虚构作品，但心里暗暗希望成为一名小说家。<br />When I first started writing at the age of 30, it was with the intention of writing fiction, but I took a little detour for 10 or 12 years, and write non-fiction which I absolutely have no regret about at all.<br />我30岁开始写作时，本打算写小说，但却绕了个小路，写了十到十二年的非虚构作品，而对此我完全不后悔。<br />I think it&#39;s exactly the right thing for me to do.<br />我认为这是我当时最正确的选择。<br />But there&#39;s this dream tucked away inside of me to do this.<br />但我内心深处一直藏着这个梦想。<br />Now I was remembering reading something that wrote, who is a great novelist from Mississippi who had a big influence on me actually.<br />现在我记得读过一位来自密西西比的伟大小说家的话，她对我影响很大。<br />She said, &quot;no art ever came out of not risking your neck.&quot;<br />她说：&ldquo;任何艺术都不会出自不冒风险的人。&rdquo;<br />And I think she&#39;s absolutely right about that.<br />我认为她说得完全正确。<br />It felt that way to me at the time; it actually feels that way every time I sit down to write something.<br />当时我就是这种感觉；实际上，每次我坐下来写东西时都会有这种感觉。<br />Finally, in the early 90s, I took my deep breath and started writing fiction.<br />最终，在90年代初，我深吸一口气，开始写小说。<br />It felt risky to me at the time to do that.<br />当时这样做对我来说很冒险。<br />And one of the very first things that I wrote was, what I thought was going to be the first chapter of a novel, called &quot;The Secret Life of Bees.&quot;<br />我写的第一批东西之一，是我认为会成为小说《蜜蜂的秘密生活》的第一章。<br />I wrote it in 1992, and it is actually essentially the first chapter of the novel as it is now.<br />我在1992年写了它，实际上它就是现在小说的第一章的基本内容。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693679/72316ba707434484812af152cc66af73.mp3", "kws": ["quot", "writing", "acclaimed", "becoming", "bees", "began", "belief", "chapter", "drafted", "dream"]}, {"id": 4467, "name": "A good engineer", "ref": "Engineers should know how to work with a complicated system, and sometimes, the inspirations are from their personal life experience. A complicated system cannot see, so engineering is to help virtualize it by using systems. As complicated systems are becoming reliable, engineers should deliver reliable outcomes as well. To develop a reliable system, engineers need to consider the risks, potential, predictability and accuracy.", "ana": "Today, this course you are going to take is about what engineering is and how to work with a complicated system.&nbsp;<br />今天，你们将要学习的这门课程是关于&ldquo;什么是工程&rdquo;以及&ldquo;如何与复杂系统打交道&rdquo;。<br />You guys should know the answers, because all of you guys are from the engineering course.&nbsp;<br />你们应该知道这些问题的答案，因为你们都来自工程专业。<br />Especially, when you design, build, debug and develop something new, during these process, you are working with the complicated system.&nbsp;<br />特别是当你在设计、构建、调试和开发新事物的过程中，你就是在与一个复杂系统打交道。<br />How to program complicated systems and how would you know it actually works before producing it.&nbsp;<br />如何对复杂系统进行编程？又如何在它被实际制造出来之前就知道它是可行的？<br />Inspirations are from your daily life, you probably need to consider your personal life experience.&nbsp;<br />灵感来源于你的日常生活，你可能需要结合自己的生活经验来思考。<br />And from the common everyday life to the tiny things that you cannot see virtually, and the inspirations normally exist in the tiny levels.&nbsp;<br />从日常生活中常见的现象，到那些肉眼看不见的微小细节，灵感往往就存在于这些细微之处。<br />A complicated system such as your laptops running Microsoft systems.&nbsp;<br />比如你的笔记本电脑运行微软系统，这就是一个复杂系统。<br />That means the system is not able to see, which means you guys have to virtualize it.&nbsp;<br />这意味着这个系统是无法直接看到的，也就是说你们必须通过虚拟化的方式来理解和操作它。<br />Engineering is here to help virtualize by using systems.&nbsp;<br />工程的作用就是通过系统来帮助我们实现这种虚拟化。<br />Nowadays, the complicated systems are relatively reliable, and you guys work upon these and need to deliver the new outcomes which are reliable as well.&nbsp;<br />如今，这些复杂系统已经相对可靠，你们将在这些系统之上进行工作，并创造出同样可靠的新成果。<br />This is what we do now and we are good at.&nbsp;<br />这就是我们现在所做的，而且我们已经非常擅长于此。<br />Engineering is to help virtualize by using systems.&nbsp;<br />工程的本质就是利用系统来实现虚拟化。<br />In order to develop and produce a reliable system, you need to consider more on the risks, potential, predictability and accuracy.&nbsp;<br />为了开发并制造出一个可靠的系统，你需要更多地考虑风险、潜力、可预测性和准确性。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693065/28e1c1f7fe244e7ea3561558d7a2b50c.mp3", "kws": ["complicated", "engineers", "reliable", "system", "systems", "accuracy", "becoming", "cannot", "consider", "deliver"]}, {"id": 4453, "name": "A mother’s loan", "ref": "The speaker shares her severe financial struggle caused by massive student loans. Although her college degree helps her secure a job, high interest rates make the debt unpayable, and monthly payments exceed her family income. Consequently, she deeply regrets her educational choice. Furthermore, this heavy financial burden forces her children to rely on government loans for their future college education.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693686/e92c946454294662b6b96e15c3a9b943.mp3\"></audio></div><br /><br />I&#39;m 43 years old, and I owe tens of thousands of dollars in student loans.<br />我今年43岁，欠下了数万美元的助学贷款。<br />Oh sure, I knew the loans were piling up as I went through school.<br />当然，在上学的过程中，我知道贷款在不断累积。<br />But with one loan coming from here, another from there, I had no idea of the rock slide that was building.<br />但是，由于这里一笔贷款，那里一笔贷款，我完全没有意识到这正在酝酿一场&ldquo;山崩&rdquo;。<br />Fifteen years later, I still experience moments of sheer horror regarding my family&rsquo;s financial situation.<br />十五年后，我依然时常为家庭的经济状况感到彻骨的恐惧。<br />My monthly student loan payment is more than triple my car payment.<br />我每月的助学贷款还款额是车贷的三倍多。<br />OK, so without my college degree, I would not have been able to get my current job.<br />好吧，如果没有大学学位，我是不可能得到现在这份工作的。<br />For that I&#39;m grateful but at what cost?<br />对此我心怀感激，但代价是什么？<br />My loans have been accruing at a rate of 10 percent, and now they have burgeoned to well.<br />我的贷款以10%的利率不断累积，如今已经膨胀得不可收拾。<br />I&#39;m an English major; you do the math.<br />我是学英语的，你来算算吧。<br />I don&#39;t think they&#39;ll ever get paid off.<br />我不认为这些贷款有一天能还清。<br />We&rsquo;re in debt way past our eyeballs, and there&#39;s no hope in sight.<br />我们已经债台高筑，完全看不到希望。<br />I&#39;m being kept in class a financial class of graduates whose only hope for attending college meant borrowing money from the government.<br />我被困在这样一个&ldquo;财务阶层&rdquo;里：一群毕业生，他们唯一能够上大学的途径就是向政府借钱。<br />Because of our mounting credit card debt and monthly payments that far exceed our family&rsquo;s income, my kids will also join the class of citizens who can&rsquo;t rely on their parents for college support.<br />由于我们不断增加的信用卡债务以及远远超过家庭收入的月供，我的孩子们也将加入那群无法依靠父母资助来上大学的公民行列。<br />Do I wish I&#39;d chosen another educational route? You bet.<br />我是否希望自己当初选择另一条教育之路？当然。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693686/2ea949fda7234e748923c149349cddc7.mp3", "kws": ["college", "financial", "loans", "although", "burden", "caused", "children", "choice", "consequently", "debt"]}, {"id": 2140, "name": "AI", "ref": "Al is not automatically fair to all sections of society; it is as biased as the people who create it or the texts it considers. It learns from the content of these texts, so may learn biased attitudes. Procedures are therefore needed to ensure that what Al learns is fair to all sections of society.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658777/41f0181d06604ef9a2e415ee82adb3b4.mp3\"></audio></div><br />The proclamation that artificial intelligence, or AI, will improve decision making by taking the human element out of the process, hence removing bias for or against certain sections of society, is not entirely accurate.<br />声称人工智能（AI）将通过消除决策过程中的人为因素来改进决策，从而消除对社会某些群体的偏见，这种说法并不完全准确。<br />AI is likely to be as biased as the designers who create it or the material it considers.<br />人工智能很可能与创造它的设计者或它所考虑的材料一样带有偏见。<br />An AI system may trawl through countless newspaper and magazine articles in order to learn about the world.<br />一个人工智能系统可能会搜寻无数的报纸和杂志文章，以便了解世界。<br />If those texts are biased towards 1 section of society, the AI system will learn from this and go on to perpetuate this attitude.<br />如果这些文本对社会某个群体带有偏见，人工智能系统将从中学习并继续强化这种态度。<br />It is therefore paramount that that organizations put in place procedures to analyze AI systems, both at the design stage and when the system is operating, in order to ensure that the systems have a fair and unbiased view of the world.<br />因此，至关重要的是，各组织应制定相应的程序，在人工智能系统的设计阶段和运行过程中对其进行分析，以确保这些系统对世界持有公平和公正的看法。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658777/1c53a71bbf0046149463586f7fd49270.mp3", "kws": ["biased", "fair", "learns", "sections", "society", "texts", "attitudes", "automatically", "considers", "content"]}, {"id": 4444, "name": "Amory Lovins", "ref": "The lecture introduces Amory Lovins, a polymath and consultant regarded as an eccentric genius. He dedicates himself to energy conservation and solving problems using existing technology. He demonstrates his ideas practically by living in a mountain house without a furnace. His remarkable dedication and unconventional approach attract public attention, inspiring journalist Elizabeth Kolbert to write a profile about him titled &quot;Mr. Green.&quot;", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693663/7540a951db53471ba90cdb6b9b7db3cd.mp3\"></audio></div><br />Who knows who Amory Lovins is?<br />谁知道阿莫里&middot;洛文斯（Amory Lovins）是谁？<br />Nobody.<br />没人知道。<br />Amory Lovins is an unusual character.<br />阿莫里&middot;洛文斯是一个与众不同的人物。<br />He is something of polymath.<br />他可以说是一个博学多才的人。<br />Just to say, he is sort of him of knowledge across a wide range of fields.<br />也就是说，他在多个领域都有广泛的知识。<br />He&rsquo;s not an academic.<br />他不是学术界人士。<br />He has a consulting company which he runs off until huge recently out of his home in Colorado.<br />他有一家咨询公司，直到最近，他一直从科罗拉多州的家中运营这家公司。<br />He is outside Snowmass in a house built into the side of the mountain that has no furnace.<br />他住在斯诺马斯外的一栋建在山坡上的房子里，这栋房子没有暖炉。<br />For that 30 years, he has been kind of iconic plastic oddball genius, thinking of ways to save energy, thinking of ways to solve problems using technology that already exists.<br />在过去30年里，他一直被视为标志性的古怪天才，思考如何节约能源，以及如何利用现有技术解决问题。<br />And he has demonstrated several of them.<br />而且他已经展示了其中的几个方法。<br />He also offers he is something that he is such of oddballs that people tend to think he is kind of crazy.<br />他也表现出一种古怪的特质，以至于人们往往认为他有些疯狂。<br />Anyway, Elizabeth Kolbert, went to spend some time with Amory Lovins.<br />无论如何，伊丽莎白&middot;科尔伯特（Elizabeth Kolbert）去与阿莫里&middot;洛文斯共度一段时间。<br />And so he has written his pieces called Mr. Green.<br />于是，他写了几篇作品，称为《格林先生》（Mr. Green）。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693663/18d72b305df8407fbaf00ef56d462ec1.mp3", "kws": ["quot", "amory", "approach", "attention", "attract", "conservation", "consultant", "dedicates", "dedication", "demonstrates"]}, {"id": 4461, "name": "Andrew Carnegie", "ref": "Scotland-born Andrew Carnegie and his family moved to America when he was 13. He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. Later he built the most successful steel factory and made great fortunes in the steel company, but he gave 90 percent of money away to worthy causes.", "ana": "Andrew Carnegie was born in Scotland in 1835.&nbsp;<br />安德鲁&middot;卡内基于1835年出生在苏格兰。<br />His family moved to America when he was 13 and settled in Pittsburgh.&nbsp;<br />他13岁时，全家搬到了美国，并在匹兹堡定居。<br />He found jobs working in a fabric mill and telegraph office.&nbsp;<br />他找到了在纺织厂和电报局工作的机会。<br />Carnegie always did well at whatever he set his mind to.&nbsp;<br />无论做什么，卡内基总是全力以赴，做得很好。<br />He was known to make improvements to any job he held.&nbsp;<br />他以不断改进自己所做的每一项工作而闻名。<br />While working for the telegraph office, he began studying the railroad system, and he soon became the superintendent.&nbsp;<br />在电报局工作期间，他开始研究铁路系统，不久后便成为总管。<br />He took the money he had saved and invested in an oil company.&nbsp;<br />他把自己存下的钱投资了一家石油公司。<br />His investment return was good and then he went to England to learn how to make steel.&nbsp;<br />他的投资回报丰厚，之后他前往英国学习如何制造钢铁。<br />He wanted to make steel that was cheaper and more durable than American steel.&nbsp;<br />他想要制造出比美国现有钢铁更便宜、更耐用的钢材。<br />He came back with his knowledge and built a huge steel factory.&nbsp;<br />他带着所学知识回国，建立了一座巨大的钢铁工厂。<br />Carnegie&#39;s factory was very successful and he sold it for 480 million dollars.&nbsp;<br />卡内基的工厂非常成功，后来他以4.8亿美元的价格将其出售。<br />Carnegie was a very wealthy man but he was more interested in philanthropy than spending his money on himself.&nbsp;<br />卡内基是一位非常富有的人，但他更热衷于慈善事业，而不是把钱花在自己身上。<br />He spent the rest of his life giving his money away to worthy causes.&nbsp;<br />他用余生将财富捐给各种值得支持的事业。<br />Reading and learning were very important to him, so he built many libraries.&nbsp;<br />阅读与学习对他来说非常重要，因此他建立了许多图书馆。<br />He also established universities and research institutes.&nbsp;<br />他还创办了大学和研究机构。<br />Carnegie built hospitals, museums, and theaters.&nbsp;<br />卡内基还修建了医院、博物馆和剧院。<br />One of the most recognizable buildings he built was Carnegie Hall in New York City.&nbsp;<br />他建造的最著名的建筑之一是位于纽约市的卡内基音乐厅。<br />Carnegie Hall hosts many concerts and symphonies each year and is an important part of New York City culture.&nbsp;<br />卡内基音乐厅每年举办众多音乐会和交响乐演出，是纽约市文化的重要象征。<br />Andrew Carnegie passed away at the age of 83.&nbsp;<br />安德鲁&middot;卡内基于83岁时去世。<br />In his lifetime he gave away 90% of his fortune.&nbsp;<br />他一生中共捐出了自己90%的财富。<br />He is known as a man who was selfless and wanted to do good for others.&nbsp;<br />他被世人铭记为一位无私、致力于帮助他人的人。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693059/428cef8ba0674fa784fee768a4dc47a1.mp3", "kws": ["carnegie", "steel", "always", "america", "andrew", "away", "built", "causes", "company", "fabric"]}, {"id": 3792, "name": "Australian immigration", "ref": "The first inhabitants of Australia were the ancestors of the indigenous people. Their migration occurred during the Pleistocene epoch when sea levels were lower. Australia and New Guinea were connected by a land bridge known as Sahul. As sea levels rose 10,000 years ago, Australia became a separate landmass. In recent years, Australia has experienced significant immigration, with the majority coming from Asia, particularly China and India.", "ana": "The first inhabitants in Australia were the ancestors of the present indigenous people.<br />澳大利亚最早的居民是现今原住民的祖先。<br />Whether these first migrations involved one or several successive waves and distinct peoples is still subject to academic debate, as is its timing.<br />这些最初的迁徙是一次性完成的，还是经历了多波次、不同族群的迁移，以及具体的时间仍存在学术争议。<br />The minimum widely accepted time frame places presence of humans in Australia at 40,000 to 43,000 years Before Present, while the upper range supported by others is 60,000 to 70,000 years BP.<br />目前普遍接受的最早人类到达澳大利亚的时间为距今4万至4万3千年，而另一些研究则认为可追溯到距今6万至7万年前。<br />In any event, this migration was achieved during the closing stages of the Pleistocene epoch, when sea levels were typically much lower than they are today.<br />无论如何，这次迁徙发生在更新世末期，那时的海平面远低于今天。<br />Repeated episodes of extended glaciation resulted in decreases of sea levels by some 100&ndash;150 m.<br />多次长时间的冰川作用导致海平面下降了大约100至150米。<br />The continental coastline therefore extended much further out into the Timor Sea than it does today, and Australia and New Guinea formed a single landmass (known as Sahul), connected by an extensive land bridge across the Arafura Sea, Gulf of Carpentaria and Torres Strait.<br />因此，大陆海岸线比现在更向外延伸至帝汶海，澳大利亚和新几内亚形成了一块单一的大陆（称为&ldquo;萨胡尔&rdquo;），通过阿拉弗拉海、卡奔塔利亚湾和托雷斯海峡上的广阔陆桥相连。<br />The ancestral Australian Aboriginal peoples were thus long established and continued to develop, diversify and settle through much of the continent.<br />因此，澳大利亚原住民的祖先早已定居，并在大陆大部分地区不断发展、分化并繁衍生息。<br />As the sea levels again rose at the terminus of the most recent glacial period some 10,000 years ago, the Australian continent once more became a separated landmass.<br />约一万年前最近一次冰河时期结束时，随着海平面上升，澳大利亚大陆再次成为一块孤立的陆地。<br />However, the newly formed 150 km wide Torres Strait with its chain of islands still provided the means for cultural contact and trade between New Guinea and the northern Cape York Peninsula.<br />然而，新形成的、宽达150公里的托雷斯海峡及其一连串岛屿，仍然为新几内亚与约克角半岛北部之间的文化交流和贸易提供了可能。<br />During the 1970s and 1980s around 120,000 southern Asian refugees migrated to Australia.<br />在20世纪70年代和80年代期间，约有12万名来自南亚的难民移居澳大利亚。<br />During that twenty years, Australia first began to adopt a policy of what Minister of Immigration Al Grassby termed &quot;multiculturalism&quot;.<br />在这二十年间，澳大利亚首次开始推行移民部长阿尔&middot;格拉斯比所称的&ldquo;多元文化主义&rdquo;政策。<br />In 2004&ndash;05, Australia accepted 123,000 new settlers, a 40% increase over the past 10 years.<br />在2004至2005年度，澳大利亚接纳了12.3万名新移民，比过去十年增长了40%。<br />The largest number of immigrants (40,000 in 2004&ndash;05) moved to Sydney.<br />其中最多移民选择定居的城市是悉尼（2004&ndash;05年达4万人）。<br />The majority of immigrants came from Asia, led by China and India.<br />大多数移民来自亚洲，主要来源国是中国和印度。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691689/5d47bce3664d4b28a389d76a23a1b8d7.mp3", "kws": ["australia", "levels", "years", "ancestors", "asia", "became", "bridge", "china", "coming", "connected"]}, {"id": 3802, "name": "Basic social values", "ref": "The lecture is mainly about basic social values. According to the speaker, many basic social values are passed on unconsciously, already in babyhood. And most people in different ways are working with the unloving side of society in a way and trying to find ways to provide a more caring response, especially those working in Africa who often deal with traumatic social problems.", "ana": "But I think just to put it in a nutshell, that many basic social values are passed on unconsciously, already in babyhood.<br />但我想简要地说，许多基本的社会价值观其实在婴儿时期就已经被无意识地传递了。<br />Adults convey a great deal to babies about the kind of society they&#39;re living in.<br />成年人会向婴儿传达大量关于他们所处社会的信息。<br />And, you know, the most basic level, for example, whether the world is supportive and safe or challenging and dangerous.<br />比如说，在最基本的层面上，这个世界是支持而安全的，还是充满挑战而危险的。<br />And all of us in different ways are working with the unloving side of society in a way and trying to find ways to offer a more caring response.<br />我们所有人都以不同的方式在某种程度上面对着社会中缺乏关爱的一面，并试图找到更具关怀性的回应方式。<br />And particularly those people who are working in Africa are often doing really cutting-edge work in dealing with traumatic social problems such as the AIDS epidemic, the aftermath of war, homelessness and so on.<br />特别是那些在非洲工作的人，他们常常在应对诸如艾滋病疫情、战争后遗症、无家可归等创伤性社会问题方面开展非常前沿的工作。<br />Whilst probably the majority of you who&#39;ve actually made it here today are putting your creative energy into, I&#39;m sure, wonderful, but probably more tried and tested kind of projects.<br />而今天在座的大多数人可能已经将你们的创造力投入到我相信非常精彩但也更成熟、经过验证的项目之中。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691718/3c2e77f6064d4fa58337cd83a5480abe.mp3", "kws": ["social", "basic", "values", "ways", "working", "according", "africa", "already", "babyhood", "caring"]}, {"id": 2124, "name": "Bees waggle dance", "ref": "Honeybees communicate using a waggle dance to share nectar sources. Researchers found that the dance can be interrupted by a headbutt, which serves as a warning. Scientists mimicked a nectar source in a lab and observed foraging bees returning to the hive to stop dancing bees when potential dangers were present. This behavior study sheds light on the intricate communication system and collaborative efforts of honeybees.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678216/e5bc26a4e8ef417cae814dbc9436b515.mp3\"></audio></div><br />Honeybees have a unique way of communicating with each other&mdash;the waggle dance.<br />蜜蜂有一种独特的相互交流方式&mdash;&mdash;摇摆舞。<br />When a bee finds a good source of nectar, it will perform a waggle dance to inform other bees about it.<br />当一只蜜蜂发现了一个良好的花蜜来源时，它会跳起摇摆舞来通知其他蜜蜂。<br />However, this dance can be interrupted by a headbutt from another bee, which researchers have discovered is actually a warning signal.<br />然而，这种舞蹈可能会被另一只蜜蜂的顶头动作打断，研究人员发现这实际上是一种警告信号。<br />To study this behavior, scientists set up a feeding station in the lab to mimic a source of nectar.<br />为了研究这种行为，科学家在实验室中设置了喂食站，以模拟花蜜的来源。<br />They then introduced foraging bees to potential dangers at the station, such as competition from rival colonies.<br />然后，他们让觅食蜂在喂食站面临潜在的危险，例如来自竞争蜂群的干扰。<br />When the foragers returned to the hive, they were observed stopping the dancing bees.<br />当觅食蜂返回蜂巢时，观察到它们会阻止正在跳舞的蜜蜂继续跳舞。<br />This led the researchers to believe that the headbutt serves as a warning to the dancers about the dangerous source of nectar.<br />这使研究人员相信，顶头动作实际上是在向跳舞的蜜蜂发出关于花蜜来源存在危险的警告。<br />The lecture also mentioned that bees can use their dance and sounds to describe different flowers and the environment.<br />讲座还提到，蜜蜂可以利用舞蹈和声音来描述不同的花朵和环境。<br />This study sheds light on the complex communication system of honeybees and the way they work together to ensure the safety of the colony and the success of their foraging efforts.<br />这项研究揭示了蜜蜂复杂的交流系统，以及它们如何协作以确保蜂群的安全和觅食能够成功。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678216/884ce7b0e60b48f8b9e21953869a972c.mp3", "kws": ["bees", "dance", "honeybees", "nectar", "behavior", "collaborative", "communicate", "communication", "dancing", "dangers"]}, {"id": 3787, "name": "Bees' genes and Darwin", "ref": "A healthy honeybee hive revolves around the queen&rsquo;s egg-laying capacity of up to 2500 eggs a day. The majority of the colony comprises female workers, while a small number of male drones rely on the workers for sustenance. The worker bees&rsquo; tireless efforts in gathering resources take a toll, as they live for approximately 30 days, but the hive is continually replenished by new generations.", "ana": "A healthy hive of honeybees functions like a perfect and fluid organism; at the center of all activity is the queen, the egg-laying machine.<br />一个健康的蜜蜂蜂群运作得就像一个完美而流畅的有机体，所有活动的中心是蜂王&mdash;&mdash;这是一台产卵机器。<br />The queen is actually a slave to her duties, laying up to 2500 eggs a day, as many as two million in her lifetime.<br />实际上，蜂王被她的职责所束缚，每天最多可产卵2500枚，在其一生中总共可达约200万枚。<br />The worker bees are all female and make up the bulk of the colony.<br />工蜂都是雌性，构成了蜂群的绝大部分。<br />In a typical hive of 30000 bees, only about 100 are males called drones, with oversized eyes and bulky bodies.<br />在一个拥有三万只蜜蜂的典型蜂巢中，只有大约100只是雄性蜜蜂（称为雄蜂），它们长着大眼睛和笨重的身体。<br />Drones are not equipped to gather pollen or nectar and must rely on the workers to feed them.<br />雄蜂不具备采集花粉或花蜜的能力，必须依靠工蜂来喂养它们。<br />The invaluable work bees do takes its toll in the summer.<br />蜜蜂们所从事的宝贵工作在夏季对它们造成了巨大的损耗。<br />Workers only live around 30 days, literally work to death.<br />工蜂的寿命只有大约30天，可以说是&ldquo;劳累致死&rdquo;。<br />But the hive is constantly replenished with new generations of bees ready to go to work from the moment they hatch.<br />但蜂群会不断有新一代蜜蜂补充进来，这些新蜜蜂从孵化那一刻起就准备好投入工作。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691666/f00e8f53ad104a42923abaf13654a0c4.mp3", "kws": ["the productivity", "the genes of bees", "evolution", "worker bees", "attack intruders", "die", "sacrifice their lives", "protect the next generation", "Darwin", "improving the reproductivity of the queen bees", "the bees' genes could be saved"]}, {"id": 3795, "name": "Biggish city", "ref": "The lecture talks about the population of cities in the past. According to the speaker, the population of cities in history could be numbered in thousands rather than millions. Interestingly enough, both Plato and Leonardo chose the same figures, twenty-five to thirty thousand inhabitants, for their ideal cities. Now, the number of citizens is kept deliberately low because a small population would be easier to manage.", "ana": "We have briefly looked at some of the problems involved in running a biggish city like, say, Melbourne, keeping the road and rail systems running, policing, providing food and housing, and so on.<br />我们已经简要地探讨了运营一个中等规模城市（比如墨尔本）所面临的一些问题，如保持道路和铁路系统的正常运行、治安管理、提供食物和住房等等。<br />In another lecture, I&#39;m going to deal with what we must now call megalopolis-cities with populations of ten million or more.<br />在另一场讲座中，我将讨论我们现在必须称为&ldquo;大都市群&rdquo;的城市&mdash;&mdash;人口达一千万甚至更多的城市。<br />However, first I want to go back in history to when the population of cities could be numbered in the thousands rather than millions.<br />不过，首先我想回顾一下历史，回到城市人口是以千计而非以百万计的时代。<br />One of the earliest theorists of the city was, of course, Plato, who created an ideal city in his text, The Republic.<br />当然，最早的城市理论家之一是柏拉图，他在其著作《理想国》中构想了一座理想城市。<br />The population of this city would be around twenty-five to thirty thousand at most.<br />这座城市的人口最多大约为两万五千到三万人。<br />Oddly enough, the same figures were chosen by Leonardo da Vinci for his ideal cities.<br />有趣的是，列奥纳多&middot;达&middot;芬奇也为他设想的理想城市选择了同样的数字。<br />Now, of these twenty-five to thirty thousand inhabitants, only about five thousand would be citizens.<br />在这两万五千到三万居民中，只有大约五千人是真正的公民。<br />A reason for this might be that it is the largest number that could be addressed publicly at one time and by one person, and makes a voting system much easier to manage.<br />出现这种现象的一个原因可能是，这是一个人可以一次向公众公开演讲并面对的最大人数，也使投票制度更容易管理。<br />Also, perhaps the numbers are kept deliberately low because a large population would be harder to control, or because, in practical terms, fewer inhabitants are easier to feed from local supplies without having to depend on outside sources.<br />此外，这些数字可能被刻意设定得很低，因为人口太多会更难控制，或者从实际角度来看，较少的居民更容易依靠本地资源供养，而不必依赖外部供应。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691694/829404ecaf9e4b748ec0d14937d3ff28.mp3", "kws": ["cities", "population", "according", "because", "chose", "citizens", "deliberately", "easier", "enough", "figures"]}, {"id": 4463, "name": "Boys and girls", "ref": "Research shows that girls tend to outperform boys in English results due to differences in learning styles and brain mechanisms. Boys demonstrate a greater awareness of developments in physics and technology, whereas girls tend to be more interested in sociable fields. This finding suggests the need for teachers to adopt different teaching approaches for boys and girls to enhance their learning experiences.", "ana": "The research shows that girls have a higher level of English results than boys in the same class, because boys and girls are different in learning styles, and their brain functions are different in mechanisms.&nbsp;<br />研究表明，在同一班级中，女生的英语成绩高于男生，这是因为男生和女生在学习风格上存在差异，大脑功能的运作机制也有所不同。<br />Male students were detected to be significantly more aware of the developments in the field of physics than female students.&nbsp;<br />研究发现，男生对物理学领域发展的关注度明显高于女生。<br />According to the content analysis results concerning this finding, unlike female students male students were more interested in technological developments.&nbsp;<br />根据与此发现相关的内容分析结果，与女生不同，男生对技术发展更感兴趣。<br />This finding is not surprising when the passive social role of females and the general social structure in which they tend to more sociable fields are considered.&nbsp;<br />当考虑到女性在社会中较为被动的角色，以及整体社会结构使她们倾向于选择更具社交性的领域时，这一发现并不令人意外。<br />This finding may have occurred due to the fact that males are generally more interested in technology than females.&nbsp;<br />这一现象的出现可能是因为男性通常比女性对技术更感兴趣。<br />Previous studies support this finding.&nbsp;<br />先前的研究也支持这一结论。<br />Boys are more simplified, and teachers&#39; teaching style normally suits girls better than boys.&nbsp;<br />男生的思维方式相对更简单直接，而教师的教学方式通常更适合女生而非男生。<br />Teachers should find different teaching approaches respectively for boys and girls.&nbsp;<br />因此，教师应分别为男生和女生寻找不同的教学方法。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693061/18deb212f44a4680b6c42a0a77b1e05a.mp3", "kws": ["boys", "girls", "learning", "tend", "adopt", "approaches", "awareness", "brain", "demonstrate", "developments"]}, {"id": 2139, "name": "Child-rearing", "ref": "Although many people think that small children should be cared for at home, being looked after outside the home can also have positive effects if the children can build relationships and learn skills. There&#39;s no evidence that it&#39;s better if one child is looked after by one person or if they are cared for in a group, but children benefit if each staff member is only responsible for a small number of them.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658776/429720b9458247a485b6e2d88d23e568.mp3\"></audio></div><br />Many people believe that it&#39;s always better for the development of very young children under the age of three to be cared for within the home.<br />许多人认为，对于三岁以下的幼儿来说，在家中照料总更有利于他们的发展。<br />But a recent research study in the us suggests that this is not always the case.<br />但美国最近的一项研究表明，情况并非总是如此。<br />Being cared for outside the home can actually bring benefits if the children can build relationships with the workers who look after them and they have the opportunity to develop skills.<br />如果孩子们能够与照顾他们的工作人员建立关系，并且有机会发展技能，那么在家庭以外的环境中接受照料实际上可以带来益处。<br />The research also suggests that it makes no difference if one child is looked after by one person or if they&#39;re part of a group of children in a place that&#39;s similar to a sure.<br />研究还表明，一个孩子由一个人照顾，还是在一群孩子中（类似于托儿所）接受照料，并没有什么区别。<br />And we can say for sure that a situation where each member of staff looks after a small number of children is often very positive for the children involved.<br />我们可以肯定地说，每位工作人员照顾少量孩子的情况通常对参与其中的孩子们来说是非常积极的。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658776/654b306f1a8c43b19887f90dc1ce0a66.mp3", "kws": ["children", "after", "cared", "home", "looked", "small", "although", "benefit", "better", "build"]}, {"id": 2123, "name": "Children directors", "ref": "Children are facing social difficulties with particular risks. In an experiment in a high school, the students were told to be a movie director and to choose their story structure. The students worked with each other, which involved lots of different skills. The movies they had made were actually cool. Then, the researchers tested the intervention effect, and they found this can improve their self-regulation and critical thinking skills.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678653/f76b0e07753c47979512e7cf5c681a48.mp3\"></audio></div><br />Social skills are vital in enabling an individual to have and maintain positive interactions with others.<br />社交技能对于使个体能够与他人建立并维持积极的互动关系至关重要。<br />Many of these skills are crucial in making and sustaining friendships.<br />其中许多技能在建立和维持友谊方面非常关键。<br />Social interactions do not always run smoothly and an individual needs to be able to implement appropriate strategies, such as conflict resolution when difficulties in interactions arise.<br />社交互动并不总是一帆风顺的，当互动中出现困难时，个体需要能够采取适当的策略，例如进行冲突解决。<br />It is also important for individuals to have &#39;empathy&#39; as it allows them to respond in an understanding and caring way to how others are feeling.<br />同理心对个体来说也很重要，因为它使人们能够以理解和关心的方式回应他人的感受。<br />Children are facing social difficulties with particular risks.<br />儿童正面临特殊的社交困难和风险。<br />Young people who do not have strong relationships with the adults in their family are even more at risk.<br />那些与家庭中成年人没有建立稳固关系的年轻人面临的风险更大。<br />In an experiment in a high school, which lasted for 8 to 12 weeks, the students were told to be a movie director and to choose their own story structure.<br />在一个持续了8到12周的高中实验中，学生们被要求扮演电影导演的角色，并自行选择故事结构。<br />The students worked with each other, which involved lots of different skills, and social interactivity.<br />学生们相互合作，过程中涉及多种不同的技能以及社交互动。<br />The movies they had made were actually cool.<br />他们制作的电影实际上非常精彩。<br />Then, the researchers tested the intervention effect, finding this can improve their self-regulation, and they found this can improve their self-regulation and critical thinking skills.<br />随后，研究人员测试了这种干预的效果，发现它有助于提升学生的自我调节能力以及批判性思维技能。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678653/496d77f31adf4eb9ac1de87a37790035.mp3", "kws": ["skills", "students", "actually", "children", "choose", "cool", "critical", "different", "difficulties", "director"]}, {"id": 4443, "name": "Citizenship curriculum", "ref": "The lecture discusses a report on the development of citizenship education in schools. While it praises schools that successfully implement the curriculum, it criticizes those where the subject is marginalized. Despite some challenges, citizenship education remains valuable for developing students&#39; core skills and values. However, its implementation faces major obstacles, including a lack of leadership commitment, insufficient teacher training, and an uncertain position in the curriculum.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693662/33932ca510df457f9f75bae341fd27e2.mp3\"></audio></div><br />Last month I published alongside my annual report a subject report on the development of citizenship in schools.<br />上个月，我在年度报告的同时发布了一份关于学校公民教育发展的专题报告。<br />The report celebrates the success of some schools in implementing the citizenship curriculum.<br />报告表彰了一些在实施公民课程方面取得成功的学校。<br />It praises those schools where there have been substantial developments in the subject, and which now go a long way towards fulfilling national curriculum requirements.<br />报告赞扬了那些在该学科有显著进展、并且在很大程度上满足国家课程要求的学校。<br />In the report, we are critical of schools which have not taken citizenship seriously, either through reluctance or lack of capacity to make appropriate provision in the curriculum.<br />在报告中，我们批评了那些未认真对待公民教育的学校，无论是由于不情愿还是缺乏在课程中做出适当安排的能力。<br />Citizenship is marginalized in the curriculum in one-fifth of schools.<br />在五分之一的学校中，公民教育在课程中被边缘化。<br />It is less well established in the curriculum than other subjects, and less well taught, and some critics have seized on this as a reason for wanting to step back from supporting it.<br />与其他学科相比，它在课程中的地位不够稳固，教学也不够充分，一些批评者以此为理由，希望减少对其的支持。<br />Yet, the progress made to date by the more committed schools suggests that the reasons for introducing citizenship are both worthwhile and can be fulfilled, given the time and resources.<br />然而，到目前为止，一些更投入的学校取得的进展表明，引入公民教育的理由既值得，也能够在有时间和资源的情况下实现。<br />Indeed, those reasons are given added weight by national and global events of the past few months.<br />事实上，过去几个月的国内外事件进一步强化了这些理由。<br />While not claiming too much, citizenship can address core skills, attitudes, and values that young people need to consider as they come to terms with a changing world.<br />虽然不夸大其词，公民教育可以涉及年轻人在应对变化的世界时需要考虑的核心技能、态度和价值观。<br />The main problems standing in the way of implementation of citizenship continue to be: the lack of commitment on the part of many school leaders; and insufficient amount of initial and in-service training provision to ensure that every school can call upon teachers with subject expertise; and its uncertain place in the curriculum.<br />阻碍公民教育实施的主要问题仍然是：许多学校领导缺乏投入；初始培训和在职培训不足，无法确保每所学校都能依靠具备学科专长的教师；以及它在课程中的不确定地位。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693662/79481a8bee0f464592ed1dc62a56b48a.mp3", "kws": ["citizenship", "curriculum", "education", "schools", "challenges", "commitment", "core", "criticizes", "despite", "developing"]}, {"id": 3799, "name": "Climate change in Australia", "ref": "This lecture mainly talks about the sea levels of Australia. When the sea level is rising, the consequences may well be huge. This is because there will be more floods. Also, climate change will mean more rain and droughts. Many mega cities are likely to be affected by the sea level rising, and this means more people have to deal with it.", "ana": "Sea levels are rising and the consequences could be huge.<br />海平面正在上升，其后果可能是巨大的。<br />By the end of this century, areas that only flood once every hundred years could start to flood several times every year.<br />到本世纪末，那些原本每百年才淹没一次的地区可能会每年被淹多次。<br />The rising sea is the sleeping giant of climate change.<br />上升的海水是气候变化中的&ldquo;沉睡巨人&rdquo;。<br />Climates may change, you might have more drought, and you might have more rain.<br />气候可能会发生变化，你可能会遇到更多的干旱，也可能会有更多的降雨。<br />But I think for me, the biggest issue, the biggest concern is what we&#39;ll do in the coming centuries.<br />但对我而言，最大的问题、最令人担忧的是我们在未来几个世纪将采取什么行动。<br />Unfortunately, many of the megacities in the world, and that also applies to the larger cities in Australia, have been built in low-lying areas.<br />不幸的是，世界上许多超级大城市，以及澳大利亚的一些较大城市，都建在低洼地区。<br />That means much of the world&#39;s population will eventually have to deal with sea-level rise.<br />这意味着世界大部分人口最终都将不得不面对海平面上升的问题。<br />The question is, how high will the waters get?<br />问题是，海水会上升到多高？<br />Well, we go to the remote northwest of Australia and make a disturbing discovery.<br />我们前往澳大利亚遥远的西北部，并做出了一个令人不安的发现。<br />According to this geologist&#39;s work. Sea levels could ultimately go up by a staggering nine meters.<br />根据这位地质学家的说法，工作表明：海平面最终可能会上升高达九米，这一数字令人震惊。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691712/0c9d23d1985a4ec5abe19da7d8a491f2.mp3", "kws": ["level", "rising", "affected", "australia", "because", "change", "cities", "climate", "consequences", "deal"]}, {"id": 2132, "name": "Coffee", "ref": "Although coffee originated in east Africa, much of it is now grown in Brazil. The crops there all stem from one individual plant, which means that they are vulnerable to contagion. As a result, the current outbreak of a disease called coffee rust is wiping out South American crops. This will probably lead to raised prices unless production elsewhere, such as in Vietnam, can be increased rapidly.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2656000-2657000/2656875/899c125d73064a9c937246a5f29adb57.mp3\"></audio></div><br />As you probably know, coffee is the second largest commodity by traded value in the world after oil.<br />正如你可能知道的那样，咖啡是世界上仅次于石油的第二大交易商品。<br />You probably also know that it&#39;s grown in Brazil,<br />你可能也知道它生长在巴西，<br />but you may not realize that it&#39;s not native to that country.<br />但你可能没有意识到它不是巴西原产的。<br />It originated in East Africa.<br />它起源于东非。<br />So if it came from there, how did it cross the Pacific?<br />如果它来自那里，它是如何穿越太平洋的？<br />Well, the Dutch took coffee to a number of different places around the world, including South America, where it thrived.<br />嗯，荷兰人把咖啡带到世界各地，包括南美洲，在那里它蓬勃发展。<br />Nowadays, all the coffee cultivated in Brazil comes from that one seedling, which was of a variety called Robusta.<br />如今，巴西种植的所有咖啡都来自那棵幼苗，它是一种叫做Robusta的品种。<br />Now, because it all comes from the one plant, genetically, Robusta isn&#39;t particularly varied,<br />现在，因为它们都来自一种植物，从基因上讲，Robusta并不是特别多样化，<br />which unfortunately means its resistance to disease is, well, rather on the low side.<br />这不幸地意味着它对疾病的抵抗力很低。<br />And well, this is exactly what has happened recently.<br />这正是最近发生的事情。<br />A pathogen called coffee rust is ravaging coffee crops across South America.<br />一种被称为咖啡锈病的病原体正在席卷南美洲的咖啡作物。<br />So what it looks like is that the price of coffee is, well, going to skyrocket on the wholesale market,<br />所以看起来咖啡的价格在批发市场上将会飞涨，<br />unless production is increased dramatically in a short space of time in other countries such as, you know, Vietnam, which seems rather unlikely.<br />除非在其他国家，比如越南，产量在短时间内急剧增加，这似乎是不太可能的。<br />So in short, there&#39;s a good chance that your morning coffee is going to become, well, quite pricey and pretty soon at that.<br />所以，简而言之，你早上的咖啡很有可能会变得相当昂贵，而且很快就会如此。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656875/cca7644f97e043108c257f4fa094be96.mp3", "kws": ["coffee", "crops", "africa", "although", "american", "brazil", "called", "contagion", "current", "disease"]}, {"id": 2125, "name": "Cosmology and maths", "ref": "In this lecture, the speaker explores the profound connection between mathematics and cosmology, arguing that mathematics is an inherent part of nature itself, not just a tool for explanation. They emphasize the omnipresence of mathematical patterns in the natural world, linking them to the workings of the universe. The speaker concludes that mathematics is a fundamental aspect of the cosmos, shaping our understanding and enabling us to interpret the universe.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678217/b64b2a888bb440b5b7224bafc2282c08.mp3\"></audio></div><br />The speaker is discussing the intricate relationship between mathematics and cosmology.<br />演讲者正在探讨数学与宇宙学之间复杂的联系。<br />Back in the 1970s, the lecturer pursued a career in physics while actively engaging in the field of cosmology.<br />早在20世纪70年代，这位讲师就投身于物理学领域，并积极从事宇宙学的研究。<br />Throughout this period, scientists passionately sought to harness the power of mathematics as a means to unravel the mysteries of the universe.<br />在这一时期，科学家们热情地探索如何利用数学的力量来揭开宇宙的奥秘。<br />According to the speaker, this quest for mathematical understanding led them to a fascinating realization: mathematics is an omnipresent force in the natural world.<br />根据演讲者的说法，这种对数学理解的追求使他们得出了一个引人深思的结论：数学是自然界中无处不在的一种力量。<br />In the speaker&#39;s perspective, mathematics is not just a tool used by scientists to explain the universe; rather, it is an inherent and fundamental aspect of nature itself.<br />在演讲者看来，数学不仅仅是科学家用来解释宇宙的工具；相反，它是自然本身固有且基本的一部分。<br />Nature, cosmology, and mathematics are all interconnected, forming a complex web of relationships that shape our understanding of the cosmos.<br />自然、宇宙学和数学彼此相互关联，构成了一个复杂的关系网络，塑造了我们对宇宙的理解。<br />As the speaker delves into the heart of their argument, they emphasize that mathematics can be found virtually everywhere in nature.<br />当演讲者深入阐述其观点时，他强调数学几乎在自然界的所有地方都能找到。<br />From the graceful spiral of a seashell to the precise orbits of celestial bodies, mathematical patterns and principles underpin the very fabric of our world.<br />从贝壳优雅的螺旋形状到天体精确的运行轨道，数学的模式和原理支撑着我们世界的本质结构。<br />These mathematical foundations allow us to comprehend and interpret the workings of the universe, making it an indispensable language for cosmologists.<br />这些数学基础使我们能够理解和诠释宇宙的运行机制，使其成为宇宙学家不可或缺的语言。<br />In conclusion, the speaker asserts that mathematics is the underlying system that enables us to explain the universe and nature.<br />最后，演讲者指出，数学是我们解释宇宙和自然现象的基础系统。<br />It is not merely a tool but a fundamental aspect of the cosmos itself.<br />它不仅仅是一种工具，更是宇宙本身的基本组成部分。<br />This profound connection between mathematics, nature, and cosmology has guided scientists in their pursuit of knowledge and continues to shape our understanding of the universe&#39;s grand design.<br />数学、自然与宇宙学之间这种深刻的联系，指引着科学家们不断追求知识，并持续塑造着我们对宇宙宏伟蓝图的理解。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678217/2e0843e5401d4966b5e07fb41a80158c.mp3", "kws": ["mathematics", "speaker", "universe", "arguing", "aspect", "between", "concludes", "connection", "cosmology", "cosmos"]}, {"id": 3788, "name": "Credit card experiment", "ref": "In an experiment on customers&rsquo; behaviors, one group of inactive credit card users received a message offering benefits that they could gain by using the cards, while the other group received a message implying a penalty if it&rsquo;s not used. The result shows that customers are more motivated by a potential loss when not using this card than the benefit they could gain by using the card.", "ana": "A recent study on customer behavior investigated the impact of different messaging strategies on inactive credit card users.<br />最近一项关于消费者行为的研究调查了不同信息策略对不活跃信用卡用户的影响。<br />One group was presented with a message emphasizing the benefits they could enjoy by using their cards, while the other group received a communication implying a penalty for non-use.<br />其中一组收到的信息强调使用信用卡可以带来的好处，而另一组则收到了暗示不使用卡片将面临处罚的通知。<br />Surprisingly, the results revealed that customers were more influenced by the potential loss of not using the card than the potential benefits of using it.<br />令人惊讶的是，研究结果表明，客户更容易受到&ldquo;不使用卡片可能导致损失&rdquo;的影响，而不是&ldquo;使用卡片可能获得好处&rdquo;的激励。<br />This suggests that the fear of missing out or facing a penalty may be a stronger motivator for customer action than the promise of rewards.<br />这表明，与奖励承诺相比，对错失机会或遭受处罚的担忧可能是促使客户采取行动的更强动机。<br />These findings have important implications for businesses and marketers seeking to engage inactive customers, indicating that messaging focusing on potential losses or penalties may be more effective in encouraging customer activity.<br />这些发现对于希望重新激活不活跃客户的商家和营销人员具有重要意义，表明强调潜在损失或处罚的信息可能在激发客户行为方面更为有效。<br />Further research in this area could lead to a better understanding of consumer decision-making and the psychological factors driving behavior.<br />该领域的进一步研究有助于更深入地理解消费者的决策过程及其背后的心理驱动因素。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691680/c5b7e21242ed45fbb17babb92050becd.mp3", "kws": ["how it’s produced", "how it’s consumed", "gain information in various ways", "an experiment on customers’ behaviors", "inactive credit card users", "using the cards", "gain", "a message offering benefits", "the other group", "a message implying a penalty", "the benefit", "a potential loss", "motivated"]}, {"id": 4469, "name": "Curator", "ref": "This topic is about practices, techniques and methods of curators. Museums are good at creating and communicating history where museums are defined by their collections. Curators understand material culture as evidence of people&#39;s life to understand people. Curators are different from other historians. Academic historians concentrated on words and photographers concentrate on images, while curators deal with objects that are evidence of the past. They arrange objects into exhibitions.", "ana": "I am going to talk today mostly about what I do as a curator here at the National Museum of Australia but I want to draw some generalities from that in terms of a series of curatorial practices, tools, techniques and methods that I think could be of interest to your students and to you in developing extension history courses.&nbsp;<br />今天我主要想谈谈我在澳大利亚国家博物馆作为策展人的工作，但我也希望通过讨论一系列我认为可能对你们的学生以及你们在开发扩展历史课程时感兴趣的策展实践、工具、技术和方法来从中得出一些普遍性的结论。<br />I want to talk about what I do as a curator and then from that also talk a bit about the kinds of history that I think museums are particularly good at creating and communicating.&nbsp;<br />我想谈谈我作为策展人的工作，然后基于此也谈谈我认为博物馆特别擅长创造和传播的历史类型。<br />I think this is something I would really like to discuss because it is not necessarily very well understood is that I think museums, as Dave insisted by putting up my quote in his slide, create a very particular kind of history.&nbsp;<br />我认为这是一个非常值得讨论的话题，因为并不是所有人都充分理解这一点，即我认为博物馆（正如Dave在他的幻灯片中引用我的话所坚持的那样）创造了一种非常特殊的历史。<br />It&rsquo;s not the kind of history that gets created in books or in dating films or in compositions, it&rsquo;s a very particular kind of history that grows out of the fact that museums are centrally interested and defined by their collections.&nbsp;<br />这种历史不是书中、约会电影或作品中创造的那种历史，而是一种非常特殊的由博物馆对其藏品的核心兴趣和定义中产生的历史。<br />I should say that is not an uncontested view of museums but it is certainly my view of museums.&nbsp;<br />应该指出的是，这不是对博物馆没有争议的看法，但这确实是我的看法。<br />Curators try to understand material culture as evidence of other people&rsquo;s lives as a means to try to understand other people - what they look like, what they did, how they made a living, what they hoped for in their lives, how they tried to construct their world and why they made particular choices.&nbsp;<br />策展人尝试将物质文化理解为他人生活证据的一种方式，以试图理解其他人&mdash;&mdash;他们的长相、他们做了什么、他们如何谋生、他们在生活中希望得到什么、他们如何试图构建自己的世界以及为什么做出特定的选择。<br />One way in which curators differ from other historians is therefore in terms of how we interrogate the past, what elements we use to communicate the past.&nbsp;<br />因此，策展人与其他历史学家的一个不同之处在于我们如何审视过去，以及我们使用哪些元素来传达过去。<br />Most academic historians are trained very much in the discipline of words and they concentrate on words still today, although it is changing a little bit.&nbsp;<br />大多数学术历史学家受过严格的文字训练，并且直到今天仍然专注于文字，尽管这种情况正在发生一点变化。<br />If you go through university history primarily you are encouraged to draw on things like archival accounts, manuscripts and now oral histories, and most of that work is actually promulgated in the form of books.&nbsp;<br />如果你学习大学历史，主要被鼓励利用档案记录、手稿，现在还有口述历史等资源，而且大部分研究成果实际上是以书籍的形式传播的。<br />There are also other kinds of historians. Obviously, filmmakers and photographers concentrate on creating images of the world and arranging them in meaningful sequences, but curators attend to objects.&nbsp;<br />也有其他类型的历史学家。显然，电影制作者和摄影师专注于创建世界的图像并将它们排列成有意义的序列，但策展人关注的是物品。<br />We look at objects as evidence of the past and try to arrange objects in meaningful ways called exhibitions.&nbsp;<br />我们将物品视为过去的证据，并尝试以被称为展览的有意义的方式安排这些物品。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693067/a6f38701ceaa4203ace15d85bcaab75e.mp3", "kws": ["curators", "evidence", "historians", "museums", "objects", "people", "understand", "academic", "arrange", "collections"]}, {"id": 4447, "name": "Development of genes", "ref": "The lecture discusses the rapid evolution of human cognitive function over the past 500,000 years. This fast development only occurs through changes in a small number of genes, because requiring multiple gene changes makes such rapid evolution impossible. Consequently, the genetic differences between ancient humans and modern people remain relatively small. Ultimately, a limited number of genes are responsible for endowing humans with powerful cognitive abilities.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693670/69e4eb4019fd4255b0ce0fef616d8c05.mp3\"></audio></div><br /><br />The pace, the pace of which that the human minds have evolved over the last half million years and more recently the last 200,000 years has been so frighteningly rapid that the evolution of cognitive function and perception in different ways, can only happen to the actions of a small number of genes.<br />人类心智在过去五十万年，尤其是最近二十万年的进化速度如此惊人，以至于认知功能和感知以不同方式的演化，只可能依赖少量基因的作用。<br />If one needed to adapt a dozen of genes changes and concert, in order to acquire the penetrating minds that we now have, which our ancestors 500,000 years ago didn&#39;t have, the evolution could not have taken, could not have occurred so quickly.<br />如果为了获得我们现在拥有的深刻心智而必须同时改变十几个基因，而我们的五十万年前的祖先并不具备这些心智，那么这种进化不可能发生得如此迅速。<br />And for that reason alone, one begins to suspect that the genetic differences between people who lived 500,000 years ago sever that cognitive functions than ours are not so large.<br />仅凭这一点，人们就会怀疑，五十万年前的人与我们在认知功能上的基因差异并不大。<br />Therefore, a rather small number of genes, maybe responsible for comforting us that powerful minds which we now, which the most of us now processed.<br />因此，可能只有少量基因负责塑造我们现在的大脑，使我们拥有如此强大的心智。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693670/a937d5e8c5b74337ac2aaa610ab4d062.mp3", "kws": ["changes", "cognitive", "evolution", "genes", "humans", "number", "rapid", "small", "abilities", "ancient"]}, {"id": 4450, "name": "Devolution of power", "ref": "The lecture discusses the concept of devolution, which involves moving governmental power from the federal to the state level. While Republicans support this approach to bring power closer to the people, the speaker argues that it actually moves power away from citizens. This is because a hidden part of the power system, specifically private power, remains unknown to the public.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693678/2f3e0dd1916149c28d63ce3ec494f55b.mp3\"></audio></div><br /><br />Well, that&rsquo;s one aspect of what&rsquo;s called, reducing government - modifying government, to be more precise.<br />嗯，这就是所谓&ldquo;缩减政府&rdquo;的一个方面&mdash;&mdash;更准确地说，是对政府进行调整。<br />Another aspect of it is what&rsquo;s called &ldquo;devolution&rdquo; - reducing - moving governmental power from the Federal to the State level.<br />另一个方面是所谓的&ldquo;权力下放&rdquo;&mdash;&mdash;将政府权力从联邦转移到州一级。<br />And that has a kind of a rationale which you hear all over the time - place.<br />这种做法有一种你随处可听到的理由。<br />For example, there was an op-ed a couple of weeks ago in the New York Times by John Cogan - Hoover Institute at Stanford, who has pointed out what he called a philosophical issue that divides the Democrats from the Republicans.<br />例如，几周前，《纽约时报》刊登了斯坦福胡佛研究所的约翰&middot;科根的评论文章，他指出了一个哲学问题，这个问题划分了民主党和共和党。<br />The philosophical issue is that the Democrats believe in big government and entitlements, and the Republicans believe in getting power down closer to the people, to the States, because they&rsquo;re kind of populist types.<br />这个哲学问题是，民主党相信大政府和福利权利，而共和党则相信将权力下放给人民，更靠近各州，因为他们偏向民粹主义。<br />Well, it takes about maybe three seconds&rsquo; thought to realize that moving power down to the States, in funding and so on, is just moving it away from the people, for a perfectly elementary reason: there&rsquo;s a hidden part of the system - of the power system that you&rsquo;re not supposed to know about, or think about, and that&rsquo;s private power.<br />其实，只需三秒钟就能意识到，将权力下放到各州&mdash;&mdash;包括资金等&mdash;&mdash;只是将权力从人民手中移开，原因很简单：系统中存在一个隐藏部分&mdash;&mdash;你不应该知道或考虑的权力部分，那就是私人权力。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693678/e503c508e4d445bbb26798aec4cbcb1e.mp3", "kws": ["power", "actually", "approach", "argues", "away", "because", "bring", "citizens", "closer", "concept"]}, {"id": 2130, "name": "Dialects", "ref": "The lecture discusses the differences between dialects and accents, emphasizing the influence of geography, society, family, and education in shaping dialects. It highlights the dynamic nature of language by noting that speakers of Received Pronunciation may integrate words from other dialects. The lecture provides a comprehensive analysis of the influential role of dialects and accents in communication and cultural preservation, showcasing the diverse and evolving nature of language.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678651/7bd863bff80941eea09af9b593bd5ac4.mp3\"></audio></div><br />The lecture delivers a detailed exploration of the distinctions between dialects and accents.<br />讲座详细探讨了方言与口音之间的区别。<br />It underscores the shaping of dialects by diverse influences such as geography, society, family, and education.<br />它强调了地理、社会、家庭和教育等多种因素对方言形成的影响。<br />It is particularly notable that even speakers of Received Pronunciation may integrate words from other dialects, highlighting the dynamic nature of language.<br />值得注意的是，即使是标准发音的使用者也可能融入来自其他方言的词汇，突显了语言的动态特性。<br />This underscores the adaptability and interconnectedness of dialects within our linguistic landscape.<br />这进一步强调了在我们的语言环境中，方言所具有的适应性及其相互关联的特性。<br />Overall, the lecture presents a comprehensive analysis of the nuanced differences between dialects and accents, bringing to light their influential role in shaping communication and preserving cultural identities.<br />总体而言，讲座对方言与口音之间细微差别的分析，揭示了它们在塑造交流方式和保护文化身份方面的重要作用。<br />It shines a spotlight on the diverse and evolving nature of language, and how it intricately reflects our individual and collective experiences.<br />讲座也聚焦于语言多样且不断演变的本质，以及它如何深刻反映了我们个人与集体的经历。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678651/197d3bf048df412eb723f576aea84447.mp3", "kws": ["dialects", "accents", "language", "lecture", "nature", "analysis", "between", "communication", "comprehensive", "cultural"]}, {"id": 4448, "name": "Drug ads", "ref": "The lecture discusses the increase in pharmaceutical TV advertising and its impact on consumers. Although the information is technically accurate, researchers find the ads misleading. They exaggerate the negative impact of health conditions and suggest that medication magically restores life control. Furthermore, these advertisements ignore lifestyle changes that help treat conditions, highlighting that prescription drug marketing differs significantly from ordinary product promotion.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693671/cc0d06d3178f4f73b96b13b26ee7b3da.mp3\"></audio></div><br /><br />The amount of money drug companies spend on TV ads has doubled in recent years.<br />近年来，制药公司在电视广告上的支出已翻了一番。<br />And it&#39;s no wonder: studies show the commercials&#39; work: consumers go to their doctors with a suggestion for a prescription drug they saw advertised on TV.<br />这不足为奇：研究显示这些广告确实有效&mdash;&mdash;消费者会带着在电视上看到的处方药建议去看医生。<br />Now a study in the Annals of Family Medicine raises questions about the message these ads promote, NPR&#39;s Patty Neighmond reports.<br />据NPR的帕蒂&middot;奈蒙德报道，《家庭医学年鉴》的一项研究对这些广告传递的信息提出了质疑。<br />You&#39;re most likely to see drug ads during prime time, especially around the news.<br />你最有可能在黄金时段看到药品广告，尤其是在新闻时段附近。<br />Researchers analyzed 38 ads aimed at people with conditions like hypertension, herpes, high cholesterol, depression, arthritis, and allergies.<br />研究人员分析了38则针对高血压、疱疹、高胆固醇、抑郁症、关节炎和过敏等疾病患者的广告。<br />The drug industry says the ads arm consumers with information.<br />制药行业称这些广告为消费者提供了信息。<br />But researchers found that though the information was technically accurate, the tone was misleading.<br />但研究人员发现，尽管信息在技术上是准确的，其语气却具有误导性。<br />UCLA psychologist Dominick Frosch headed the study.<br />加州大学洛杉矶分校心理学家多米尼克&middot;弗罗施主持了这项研究。<br />&quot;What we would see in these ads is that before taking the prescription drug, the character&#39;s life was out of control and the loss of control really extended beyond just the impact of the health condition,&quot;<br />&ldquo;我们在这些广告中看到的是，在服用处方药之前，角色的生活失控，而这种失控远远超出了健康状况本身的影响，&rdquo;<br />For example, herpes patients were portrayed as being incapacitated for days, insomniacs utterly out of synch on the job and depressed patients friendless and boring at parties.<br />例如，疱疹患者被描绘成几天无法正常生活，失眠者在工作中完全失去节奏，抑郁患者在聚会上孤单无趣。<br />&quot;When the character is then shown taking the drug, he then magically regains complete control of his life.&quot;<br />&ldquo;当广告中角色服药后，他就神奇地完全掌控了自己的生活。&rdquo;<br />None of the ads, of course, mentioned lifestyle changes that could also help treat the condition.<br />当然，这些广告都没有提到可能有助于治疗疾病的生活方式改变。<br />After all, it&#39;s mass marketing.<br />毕竟，这是大众营销。<br />But in this case, Frosch says, prescription medications are not like soap.<br />但弗罗施表示，在这种情况下，处方药可不像香皂。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693671/cc9481aecafb4e9c860d593bbf98d849.mp3", "kws": ["conditions", "impact", "accurate", "advertisements", "advertising", "although", "changes", "consumers", "control", "differs"]}, {"id": 4445, "name": "Einstein", "ref": "The lecture explains the evolution of the universe concept. Traditionally, people view space as a completely fixed and unchangeable stage for celestial bodies. However, Einstein transforms this perspective by predicting that space itself undergoes continuous dynamic change. Furthermore, the astronomer Edwin Hubble makes the crucial discovery that confirms his prediction, proving that the universe is truly dynamic rather than static.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693664/2c4427d2f1b349af937da8d86fdd7ba8.mp3\"></audio></div><br />For thousands of years, philosophers and astronomers and thinkers of all sorts have imagined that the universe, the space around us, was rather like this floor in front of us.<br />几千年来，哲学家、天文学家以及各种思想家一直认为宇宙&mdash;&mdash;我们周围的空间&mdash;&mdash;就像我们面前的地板一样。<br />It was fixed and unchangeable, and things happen on it, just as people walk around.<br />它是固定且不变的，事件发生在其上，就像人们在地板上行走一样。<br />So the stars, the comets, and the planets, and the other heavenly bodies moved around and traced down their parts on this completely unchanging stage of space.<br />因此，恒星、彗星、行星以及其他天体在这个完全不变的空间舞台上移动并演绎它们的轨迹。<br />In the 20th century, as the result of Einstein&rsquo;s work, that view of the universe was completely transformed.<br />20世纪，由于爱因斯坦的工作，这种对宇宙的看法被彻底改变。<br />We began to understand that there was no absolutely fixed stage of space at all on which all celestial notions were played out.<br />我们开始明白，根本不存在一个绝对固定的空间舞台来承载所有天体的活动。<br />But in some sense, on the larger scale in the universe, the space itself was in this state of a continuous dynamic change.<br />但从某种意义上说，在宇宙的更大尺度上，空间本身处于持续动态变化的状态。<br />That was a prediction made by Einstein.<br />这是爱因斯坦所做的一个预测。<br />But it was the astronomer Edwin Hubble who is the owner of the honor of making the discovery that our universe was really like that.<br />但发现我们的宇宙确实如此的荣誉属于天文学家埃德温&middot;哈勃（Edwin Hubble）。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693664/b44c4c30aa5340068ffe6941389057a0.mp3", "kws": ["astronomers", "the universe", "a floor", "fixed and unchangeable", "the 20th century", "Einstein’s work", "space", "continuous dynamic change", "a prediction"]}, {"id": 2138, "name": "Enough sleep", "ref": "Several studies have found that not getting enough sleep can cause serious problems. One particular study showed that lack of sleep makes it more difficult to complete tasks and more difficult to concentrate on simple tasks. This means that getting too little sleep can be dangerous and expensive. lt&#39;s become clear that not getting enough sleep has negative effects on how people do things at work and at home.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658775/55f63fed9db5470fadd6fa4e06c4fe11.mp3\"></audio></div><br />Several recent studies from researchers around the world all suggest that not getting enough sleep causes people more serious problems than they might think.<br />来自世界各地研究人员最近的几项研究都表明，睡眠不足给人们带来的问题比他们想象的要严重得多。<br />One interesting study carried out last year has shown that not getting enough sleep, so less than 7 hours a night, makes it twice as difficult to complete a task which requires you to do several different things in a specific order.<br />去年进行的一项有趣的研究表明，睡眠不足，即每晚睡眠少于 7 小时，会使完成需要按特定顺序执行多项任务的工作难度增加一倍。<br />Even more interesting is the result that you&#39;ll find it three times as difficult to concentrate on a simple task if you&#39;ve had too little sleep.<br />更令人惊讶的是，如果你睡眠不足，你会发现专注于一项简单的任务的难度会增加两倍。<br />Those are amazing results, and they mean that if you aren&#39;t sleeping enough, you basically need to take care all of the time because you could easily make mistakes which put you in danger or cost you a lot of money.<br />这些结果令人震惊，这意味着如果你睡眠不足，基本上需要时刻小心，因为你很容易犯下可能让你身处险境或损失大量金钱的错误。<br />For the first time, we&#39;re seeing very clearly that not getting enough sleep has very negative effects on people&#39;s ability to perform, both at work and in the home.<br />我们首次非常清楚地看到，睡眠不足对人们在工作和家庭中的表现能力都有非常负面的影响。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658775/771665f267b047f28b286914ef60770b.mp3", "kws": ["sleep", "getting", "difficult", "enough", "tasks", "become", "cause", "clear", "complete", "concentrate"]}, {"id": 3803, "name": "Experiment on climate change", "ref": "Climate change is one of the challenges facing our world today. In the 1930s, when people first noticed climate change, they have been trying to deal with it, but it is difficult to observe changes in climate from area to area. Although scientists have different views on climate change, cutting greenhouse gas emissions, saving energy, and driving fewer miles may help keep the earth cooler in the future.", "ana": "Humans are faced with many challenges, one of which is climate change.<br />人类面临着许多挑战，其中之一就是气候变化。<br />An experiment was conducted on the environment and climate in the 1930s when people first noticed climate change.<br />在20世纪30年代，当人们首次注意到气候变化时，曾开展过相关的环境与气候实验。<br />Humans have been trying to change their lifestyles to deal with it, but the observation of climate change is difficult from area to area.<br />人类一直在尝试改变生活方式以应对气候变化，但从地区到地区，对气候变化的观察却十分困难。<br />A method is introduced to help understand the mechanism of the climate system.<br />为了解决这个问题，一种方法被引入，用以帮助理解气候系统的机制。<br />Researchers predict that temperatures will increase about two to 10 degrees Fahrenheit by the end of the century.<br />研究人员预测，到本世纪末，全球气温将上升约2至10华氏度。<br />What&#39;s less certain is what rising temperatures mean for the planet.<br />目前尚不确定的是，气温上升究竟会对地球意味着什么。<br />Some climate models predict subtle changes.<br />一些气候模型预测变化将是温和的。<br />Others forecast rising sea levels, which could flood coastal areas around the world.<br />另一些则预测海平面将上升，可能淹没全球沿海地区。<br />Weather patterns could change, making hurricanes more frequent.<br />天气模式也可能发生变化，使飓风更加频繁。<br />Severe droughts could become more common in warm areas, and species unable to adapt to the changing conditions would face extinction, although much remains to be learned about global warming.<br />严重干旱可能在温暖地区变得更加常见，而无法适应变化的物种将面临灭绝，尽管关于全球变暖仍有许多未知之处。<br />Many organizations advocate cutting greenhouse gas emissions to reduce the impact of global warming.<br />许多组织提倡减少温室气体排放，以减轻全球变暖的影响。<br />Consumers can help by saving energy around the house, switching to compact fluorescent light bulbs, and driving fewer miles in the car each week.<br />消费者也可以做出贡献，比如在家节约能源、改用紧凑型荧光灯泡，以及每周减少驾车行驶的里程。<br />These simple changes may help keep the earth cooler in the future.<br />这些简单的改变可能有助于在未来让地球保持更凉爽。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691719/b572ab058a1f4494b40d0926ab105f57.mp3", "kws": ["climate", "change", "area", "although", "challenges", "changes", "cooler", "cutting", "deal", "different"]}, {"id": 4462, "name": "Free sugars", "ref": "Both fruits and milk contain sugar, and this sugar is a healthy sugar. Unhealthy sugar is normally found in desserts and ice cream. It&#39;s much easier to consume excess sugar from foods and drinks that contain &quot;free sugars&quot;. Free sugars in this case have been removed from their naturally occurring source. In addition, directly eating fruits is better because the human body can process them easily.", "ana": "Both fruits and milk contain sugar, and this sugar is healthy sugar.&nbsp;<br />水果和牛奶都含有糖分，这种糖属于健康的糖。<br />Many people have heard that sugar is bad, and think that this must also therefore apply to fruits.&nbsp;<br />许多人听说过糖对健康有害，因此认为水果中的糖也一定是有害的。<br />Unhealthy sugar is normally found in desserts, ice cream etc.&nbsp;<br />不健康的糖通常存在于甜点、冰淇淋等食物中。<br />It&#39;s much easier to consume excess sugar from foods and drinks that contain &quot;free sugars&quot;.&nbsp;<br />从含有&ldquo;游离糖&rdquo;的食物和饮料中更容易摄入过量的糖分。<br />Free sugars include these same sugars, but in this case they have been removed from their naturally occurring source, rather than being eaten as natural parts of fruits, dairy products, and some vegetables and grains.&nbsp;<br />游离糖包含同样的糖分，但它们已经被从原本天然存在的来源中分离出来，而不是像水果、乳制品以及一些蔬菜和谷物那样作为天然成分被摄入。<br />This includes sugar that is added to food and drinks by food companies, cooks or consumers.&nbsp;<br />这包括由食品公司、厨师或消费者添加到食物和饮料中的糖。<br />Many people drink juices, and this is a healthy approach.&nbsp;<br />很多人喝果汁，这被认为是一种健康的方式。<br />But directly eating fruits is better, because the human body can process it easily.&nbsp;<br />但直接吃水果更好，因为人体更容易处理完整的水果。<br />It is better to eat a small piece of fruit, which our bodies can digest better rather than drink smoothies or more than half a cup of fruit juice because it is the same as drinking soft drinks.&nbsp;<br />吃一小块水果对我们来说更健康，因为身体更容易消化吸收，而不是喝果昔或超过半杯的果汁，因为那实际上和喝软饮料没什么区别。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693060/1301c3b555204c7e8abeb2c5c62cb4a6.mp3", "kws": ["sugar", "contain", "free", "fruits", "quot", "sugars", "addition", "because", "better", "body"]}, {"id": 4452, "name": "Globalization", "ref": "The lecture defines globalization from two perspectives. First, it refers to the proliferation of cross-border transactions, including increased international trade, communication, and multinational companies. Second, it functions as an integrated economic system characterized by a global division between producing and consuming goods. Ultimately, this mutual dependence among countries represents a new stage of economic progression compared to past industrial economies.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693684/58fc3feba6e24f0592fb36d5d0b63863.mp3\"></audio></div><br /><br />Globalization, what is globalization?<br />全球化，什么是全球化？<br />I think that it takes on a few different definitions in one sense of the word.<br />我认为这个词在某种意义上有几种不同的定义。<br />Globalization means proliferation of transactions across country.<br />全球化意味着跨国交易的增加。<br />So, one way of thinking about globalization is a way to describe, increase international communications, more trade happening between countries and be less self-sufficient in providing goods and services to their people and more companies that have offices in multiple countries, which we call multinationals.<br />因此，一种看待全球化的方式是描述国际交流的增加、国家之间贸易的增多、在为本国人民提供商品和服务方面的自给自足减少，以及更多在多个国家设有办公室的公司，这些公司被称为跨国公司。<br />So, the source of growth in travel and communication and corporate trade across borders.<br />所以，旅行、通信和跨境企业贸易是增长的来源。<br />And this way of thinking about globalization is the continuation of thinking that has been around for a long time, such as when the Europeans went to the Orient, to find spices, which was also an example of global trade and communication.<br />这种看待全球化的方式是长期以来思维方式的延续，比如欧洲人前往东方寻找香料，这也是全球贸易和交流的一个例子。<br />Another way to think of globalization though, is an economic system.<br />然而，另一种看待全球化的方式是将其视为一种经济体系。<br />It is a system in which countries become integrated in a way that never had been before.<br />这是一个各国以前从未有过的整合体系。<br />In this system, we see a global split in the process between consuming and producing goods.<br />在这个体系中，我们看到全球范围内消费与生产商品的分工。<br />Some countries produce goods, some countries consume goods, and then these countries in different areas of the globe depend on each other in a kind of organic solidarity rather than having an economic system being just inside your country.<br />一些国家生产商品，一些国家消费商品，这些分布在全球不同地区的国家相互依赖，以一种有机的团结方式，而不是仅在本国内部运行经济体系。<br />The system is the way economy in your country functions depends on economy of another country.<br />这个体系意味着一个国家的经济运作依赖于另一个国家的经济。<br />And in fact this way of thinking about globalization represents a new area of economic progression.<br />事实上，这种看待全球化的方式代表了一种新的经济发展领域。<br />The past industrialist economy has been a global issue.<br />过去的工业经济就是一个全球性的问题。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693684/01ad1f4ca2904cca99fccb1b969b60ed.mp3", "kws": ["a global village", "instant communications", "the internet", "shrinking", "distance", "speed", "globalization", "detraditionalization", "the erosion of traditional culture and conventional ways of doing things", "young people", "rejecting the culture in which they grew up", "imitating the Hollywood models"]}, {"id": 4454, "name": "Governments use tricks", "ref": "The lecture highlights the fundamental importance of well-informed citizens and strongly criticizes governments that deliberately withhold information. Instead of providing the truth, these regimes use various deceptive tricks to cover up their mistakes. Specifically, they deny actual events, fabricate false ones, and spin undeniable facts. Ultimately, these strategies aim to mislead the public and distract the world from their wrongdoings.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693687/9b0ba61596884123ae19d98dd7e5f51b.mp3\"></audio></div><br /><br />I suppose it&#39;s the truism to point out that citizens need to be well-informed.<br />我想，说公民需要充分知情可能是句老生常谈。<br />Maybe it&#39;s something we take for granted in our liberal western democracies.<br />在我们自由的西方民主国家，这或许是被视为理所当然的事情。<br />But there will be plenty of societies, well, that is run counter to explicit government policy.<br />但是在许多社会中，这却与政府的明确政策背道而驰。<br />Many areas of the world still suffer from the reverie of the deliberate missing information.<br />世界上许多地方仍然遭受着&ldquo;刻意遗漏信息&rdquo;的梦魇。<br />Governments, especially the unelected ones, but also some elected ones, have denied the events that have ever taken place.<br />政府，尤其是未经选举产生的政府，但也包括一些经过选举产生的政府，会否认曾经发生过的事件。<br />They pretend that other events did take place.<br />他们假装其他事件确实发生过。<br />They would help spin what they cannot deny.<br />他们会编造他们无法否认的事实。<br />Ensure they&#39;ve used every trick of the book, to pull the eyes of the world, and in an attempt to cover up their mistakes.<br />可以肯定的是，他们会使出浑身解数，欺骗全世界，企图掩盖自己的错误。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693687/c66ab146085f49b2883c4c45fd647efc.mp3", "kws": ["actual", "citizens", "cover", "criticizes", "deceptive", "deliberately", "deny", "distract", "events", "fabricate"]}, {"id": 4464, "name": "Hook sentence", "ref": "An essay is a chance to identify your read and learned. If you want to wow your teacher and attract readers&rsquo; attention, polish the introduction by adding an essay hook. A hook is a catchy sentence or paragraph in the introduction, which is engaging and interesting. Some popular hook choices include using an interesting quote or a statistic.", "ana": "An essay is a chance to identify your read and learned.&nbsp;<br />写一篇文章是展示你所阅读和所学到内容的机会。<br />As a writer, you first need to collect many materials, then write an essay in four or five paragraphs, structures and quotes.&nbsp;<br />作为一名作者，你首先要收集大量资料，然后按照四到五段的结构，并引用相关语句来撰写文章。<br />If someone is searching for a book or article to read, he or she will decide from the very beginning whether this work is worth attention.&nbsp;<br />如果有人在寻找一本书或一篇文章来阅读，他或她会在一开始就能决定这部作品是否值得关注。<br />If you want to wow your teacher, polish the introduction, especially the first couple of sentences.&nbsp;<br />如果你想给老师留下深刻印象，就要打磨好引言部分，尤其是前两句话。<br />Add an essay hook &mdash; something interesting, funny, shocking, or intriguing to win the reader&#39;s attention.&nbsp;<br />加入一个吸引人的开头&mdash;&mdash;一些有趣、幽默、令人震惊或引人入胜的内容，以赢得读者的注意力。<br />Build an emotional connection with your reader right from the start.&nbsp;<br />从一开始就与读者建立情感联系。<br />A hook in the essay is a catchy sentence or paragraph in the impressive introduction which serves as an attention element and an important part.&nbsp;<br />文章中的&ldquo;吸睛句&rdquo;是一段引人注目的引言中的一句抓人眼球的句子或段落，它起到了吸引注意的作用，是非常重要的组成部分。<br />An excellent hook sentence is engaging and interesting; it is a perfect method to start an argumentative or persuasive essay.&nbsp;<br />一个出色的吸睛句应当具有吸引力和趣味性；它是开始一篇议论文或说服文的理想方式。<br />The hook for your essay often appears in the first sentence.&nbsp;<br />你文章的吸睛句通常出现在第一句话中。<br />The opening paragraph includes a thesis sentence.&nbsp;<br />开篇段落应包含论点句（主旨句）。<br />Some popular hook choices can include using an interesting quote, a little-known fact, famous last words, or a statistic.&nbsp;<br />一些常见的吸睛句选择包括使用有趣的引语、鲜为人知的事实、名人的临终遗言，或者一个有冲击力的统计数据。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693062/3e1641c96107478eabd7d410b519ad6f.mp3", "kws": ["the statistics", "a hook", "writing a persuasive essay", "the reader's attention", "the first paragraph", "four or five sentences in length", "emotional interest", "statistics and facts"]}, {"id": 2142, "name": "Iconoclast", "ref": "An iconoclast is someone who challenges established ideas and beliefs. This can be seen as a negative but in business it should be valued. lconoclasts ask the simple question &ldquo;Why?&rdquo; and they will not accept things like other people do. In fact, they spot changes that can be made to make a business more efficient. Businesses should listen to them and not try to change them.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658781/ab431b08ef944667bb8eaf86c2482989.mp3\"></audio></div><br />So moving on with our studies on innovative thinkers, let&#39;s now consider the iconoclast.<br />那么，继续我们对创新思想家的研究，现在
