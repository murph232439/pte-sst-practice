r and Airbnb are getting Americans to trust each other again.<br />我着迷于像Uber和Airbnb这样的共享经济平台在多大程度上让美国人重新开始彼此信任。<br />Over the last 40 years, the level of trust in society has fallen quite dramatically.<br />在过去40年里，社会中的信任水平急剧下降。<br />Less than 1 in 5 Americans under the age of 35 today feel that people are trustworthy in general.<br />如今，不到五分之一的35岁以下美国人认为总体上人们是值得信赖的。<br />But in parallel, we&#39;ve developed a heightened level of trust in strangers who we meet through a digital interface.<br />但与此同时，我们对通过数字界面认识的陌生人建立了更高水平的信任。<br />There&#39;s a generation that has grown up reading Yelp reviews, reading Amazon reviews, making their consumption choices based on what strangers on a digital platform say.<br />有一代人是在阅读Yelp评论、阅读亚马逊评论的环境中成长起来的，他们根据数字平台上陌生人的评价做出消费选择。<br />And so someone who we interact with who comes accompanied by online reviews, a Facebook and LinkedIn profile, and other digital cues seems to be someone we&#39;ll trust at the level of friends and family.<br />因此，当我们与某人互动时，如果这个人附有在线评论、Facebook和LinkedIn资料以及其他数字线索，我们会倾向于像信任朋友和家人一样信任他们。<br />What excites me about this transition is that through history every time society has created a new basis for trust, it has expanded the economy dramatically.<br />让我感到兴奋的是，在历史上，每当社会创造出一种新的信任基础时，它都极大地推动了经济的发展。<br />So I&#39;m looking forward to seeing, as we trust our Uber drivers more, how this expands the world&#39;s economic activities and the possibilities for trade.<br />因此，我期待看到，随着我们越来越信任Uber司机，这将如何扩大世界经济活动以及贸易的可能性。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691714/41cb136a16d5432bb3f9f07c63944920.mp3", "kws": ["trust", "dramatically", "economy", "level", "society", "activities", "again", "americans", "basis", "created"]}, {"id": 3793, "name": "Tutorial", "ref": "Before tutorials, students need to read articles and write notes. In tutorials, students discuss ideas and give feedback in small groups. It&rsquo;s easier to get support from the tutors in tutorials because there are fewer students than lectures. Students can improve their skills, teamwork, and confidence in tutorials. In the end, the speaker&rsquo;s advice is that do the readings before tutorials and be active in tutorials.", "ana": "If we need help before the tutorial, we can email any of the tutors and they will provide us with help.<br />如果我们在课前遇到问题，可以给任何一位导师发邮件寻求帮助，他们会为我们提供支持。<br />The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students, whereas in tutorials it&#39;s about five to 15 students,<br />讲座和辅导课的主要区别在于人数：讲座通常有大约200到300名学生参加，而辅导课一般只有5到15人，<br />which allows you to discuss matters, put your hand up and talk to your tutors about any difficulties you may have with the subject.<br />这种小班教学使你能够讨论问题、举手发言，并向导师请教你在学习中遇到的困难。<br />The skills that I have developed through participating in these tutorials include time management, critical thinking, being able to work better in a group and improving my confidence to speak up in a group.<br />通过参与这些辅导课，我培养了时间管理能力、批判性思维能力，提升了小组合作能力和在群体中发言的信心。<br />At the end of a tutorial, each group will have to give feedback on what they&#39;ve been discussing throughout the tutorial.<br />在每节辅导课结束时，每个小组都要对课堂上讨论的内容进行反馈总结，<br />So this may consist of having to present to the rest of the students in the class and it allows me to improve my group working skills<br />这意味着你需要向全班同学做展示，这有助于提高我的小组协作能力，<br />and also working in a group allows us to generate more ideas and discuss the topic in more depth.<br />同时小组合作也能激发更多创意，并对主题进行更深入的探讨。<br />The advice I have for potential University of Edinburgh students to make the most out of your tutorial sessions is to complete the reading that you&#39;re given by your tutors beforehand.<br />我想给未来爱丁堡大学学生的建议是：要想充分利用辅导课的时间，最好提前完成导师布置的阅读任务。<br />This will enable you to discuss more in groups and generate more ideas.<br />这样你可以更好地参与小组讨论，提出更多观点。<br />It&#39;s also beneficial to raise your hand and develop your confidence so that you can have better discussions in class.<br />此外，积极举手发言也有助于增强自信，让你在课堂上拥有更深入的交流体验。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691721/0dd9b2056b08481093188a6a3dba899c.mp3", "kws": ["tutorials", "students", "before", "rsquo", "active", "advice", "articles", "because", "confidence", "discuss"]}, {"id": 3801, "name": "Underestimated women", "ref": "Women tend to underestimate their own abilities, and they do not negotiate for themselves in the workforce. And most importantly, men attribute their success to themselves and women attribute it to other external factors. In conclusion, it is important for women to understand their own success, and they deserve their success.", "ana": "Women systematically underestimate their own abilities.<br />女性普遍低估了自己的能力。<br />If you test men and women and you ask them questions on totally objective criteria, like GPAs, men get it wrong slightly high, and women get it wrong slightly low.<br />如果你对男性和女性进行测试，并请他们根据完全客观的标准（比如平均绩点）来评估自己，男性往往会略微高估自己，而女性则往往会略微低估自己。<br />Women do not negotiate for themselves in the workforce.<br />女性在职场中不会为自己争取利益。<br />A study in the last two years of people entering the workforce out of college showed that 57 percent of boys entering or men, I guess, are negotiating for salary, and only 7 percent of women.<br />最近两年有一项关于大学毕业生进入职场的研究显示，大约57%的男生或者说男性会在求职时谈判薪资，而只有7%的女性会这么做。<br />And most importantly, men attribute their success to themselves and women attribute it to other external factors.<br />最重要的是，男性倾向于将成功归因于自己，而女性则更倾向于将其归因于外部因素。<br />If you ask men why they did a good job, they&#39;ll say, I&#39;m awesome. If you ask, obviously. Why are you even asking?<br />如果你问男性为什么工作表现很好，他们会说：&ldquo;我太厉害了。&rdquo;显然，你问这个问题本身就很奇怪。<br />If you ask women why they did a good job? What they&#39;ll say is someone helped them they got lucky, they worked really hard.<br />但如果你问女性为什么工作表现好，她们会说：&ldquo;有人帮了我&rdquo;、&ldquo;我只是运气好&rdquo;或者&ldquo;我很努力&rdquo;。<br />Why does this matter? Boy, it matters a lot.<br />这有多重要呢？非常重要。<br />Because no one gets to the corner office by sitting on the side, not at the table, and no one gets the promotion if they don&#39;t think they deserve their success, or they don&#39;t even understand their own success.<br />因为没有人能坐在角落里、远离会议桌就坐上高管办公室；如果一个人不认为自己配得上成功，甚至都不理解自己的成功，那也不可能获得晋升。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691715/7f4a0d79a23c4b87a2a0654184ba1fc2.mp3", "kws": ["success", "women", "attribute", "themselves", "abilities", "conclusion", "deserve", "external", "factors", "important"]}, {"id": 4449, "name": "Vitamin D", "ref": "The lecture introduces Vitamin D, known as the &quot;sunshine vitamin,&quot; because adequate sunlight eliminates the dietary need for it. Since foods lack natural abundance of Vitamin D, milk is fortified, which may remain insufficient in non-tropical climates. Furthermore, human evolution in tropical regions provides enough sun exposure, but migration to other areas creates a dietary need for Vitamin D due to inadequate sunlight.", "ana": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693677/d18e4128039b4f0e9ec4e8c428f0372d.mp3\"></audio></div><br /><br />So today we&#39;re going to finish talking about the fat-soluble vitamins.<br />今天我们将结束对脂溶性维生素的讲解。<br />I&#39;m going to start with Vitamin D.<br />我将从维生素D开始。<br />And I think probably most of you know that Vitamin D is called the &ldquo;sunshine vitamin&rdquo;.<br />我想大多数人都知道，维生素D被称为&ldquo;阳光维生素&rdquo;。<br />And it&#39;s called that because there&#39;s absolutely no dietary need for vitamin D if you get adequate sunshine.<br />之所以这么称呼，是因为如果你有足够的阳光照射，实际上不需要从饮食中获取维生素D。<br />And the real important word there is &ldquo;it&rdquo; because it turns out that in climates which aren&#39;t near the equator there&#39;s a big question as to whether or not using these you get adequate sunshine.<br />这里真正重要的词是&ldquo;有足够阳光&rdquo;，因为事实证明，在非赤道地区的气候中，人们是否能获得足够阳光是一个大问题。<br />And that&#39;s important because foods are not naturally abundant in vitamin D.<br />这很重要，因为食物中天然含有维生素D的量并不多。<br />And that&#39;s why milk is fortified but the fortification may not be enough.<br />这也是为什么牛奶会被强化维生素D，但这种强化可能仍不足够。<br />So again just exposure to sunlight is adequate, no need for vitamin D.<br />因此，仅仅晒太阳就足够了，不需要额外摄入维生素D。<br />So Vitamin D really isn&#39;t the Vitamin, it&#39;s a prohormone when human beings evolve, we evolved in tropical climates and ran around naked.<br />所以维生素D实际上并不是维生素，它是一种前激素。在人类进化过程中，我们生活在热带气候中，赤身裸体地活动。<br />There was plenty of skin exposure to sunlight and so there was no dietary need for Vitamin D.<br />皮肤有大量阳光照射，因此不需要从饮食中获取维生素D。<br />As humans migrated away from that tropical regions, they actually created a need for Vitamin D in food because sunlight was inadequate, particularly during the winter.<br />当人类从热带地区迁移开时，由于阳光不足，尤其是冬季，饮食中维生素D的需求才真正产生。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693677/d0285a69386540b5a6ef320bc5dd6f7f.mp3", "kws": ["Vitamin D", "the sunshine vitamin", "adequate sunshine", "dietary need", "a prohormone", "tropical climates", "sufficient skin exposure to sunlight", "migration away from equatorial regions", "winter"]}];
var CUR=null, TIMER=null, LEFT=510;
var SIGNAL=['however','but','although','while','whereas','because','due to','lead to','therefore','as a result','for example','for instance','such as','according to','research','studies','scientists','more than','the most','especially','finally','in addition','moreover',' furthermore'];
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function hlSignals(s){
  var out=esc(s);
  SIGNAL.forEach(function(w){
    var re=new RegExp('\\b('+w.replace(/ /g,'\\s+')+')\\b','ig');
    out=out.replace(re,'<mark>$1</mark>');
  });
  return out;
}
function renderList(kw){
  kw=(kw||'').toLowerCase();
  var arr=D.filter(x=>!kw||x.name.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML = arr.map(x=>
    '<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">官方音频 · 参考范文 · 中英对照</div></div><div class="go">开始 →</div></div>'
  ).join('') || '<div style="text-align:center;color:#98a0ae;padding:40px">没有找到题目</div>';
}
function stimerReset(){ if(TIMER){clearInterval(TIMER);TIMER=null;} LEFT=510; pint(); }
function pint(){ var m=Math.floor(LEFT/60), s=LEFT%60; var el=document.getElementById('timer'); if(!el)return; el.textContent=('0'+m).slice(-2)+':'+('0'+s).slice(-2); el.className='timer'+(LEFT<=60?' warn':''); }
function stoggle(id){ var el=document.getElementById(id); if(!el)return; el.classList.toggle('on'); }
function sPlay(url, btn){
  if(CUR){try{CUR.pause()}catch(e){}}
  CUR=new Audio(url);
  CUR.onended=function(){btn.textContent='▶ 播放音频'};
  btn.textContent='❚❚ 播放中';
  CUR.play().catch(function(){btn.textContent='▶ 播放音频';alert('音频加载失败，请检查网络')});
}
function renderPractice(item){
  var kws=(item.kws||[]).map(k=>'<span class="kw">'+esc(k)+'</span>').join('');
  // 中英文分行
  var ana=esc(item.ana).replace(/&lt;br\s*\/?&gt;/gi,'\n').replace(/\n{2,}/g,'\n');
  var html='<span class="back" id="back">← 返回题库</span>'+
  '<div class="panel"><div class="ptitle">'+esc(item.name)+'</div>'+
  '<div class="row"><button class="bigbtn" id="playBtn">▶ 播放音频</button><span class="timer" id="timer">08:30</span><button class="bigbtn ghost" id="startBtn">开始计时</button></div>'+
  '<div class="tips">先听音频，再写摘要。写完点下面的按钮对照范文。</div></div>'+
  '<div class="panel"><textarea id="ans" placeholder="在这里写你的摘要（50-70 词）..."></textarea><div class="wc" id="wc">0 词</div></div>'+
  '<div class="panel"><div class="row"><button class="bigbtn ghost" data-sec="refSec">看参考范文</button><button class="bigbtn ghost" data-sec="anaSec">看中文对照</button><button class="bigbtn ghost" data-sec="kwSec">看关键词</button></div>'+
  '<div class="sec" id="refSec"><h3>参考范文</h3><div class="ref">'+hlSignals(item.ref)+'</div></div>'+
  '<div class="sec" id="anaSec"><h3>中文对照</h3><div class="ana">'+ana+'</div></div>'+
  '<div class="sec" id="kwSec"><h3>关键词</h3><div class="kws">'+kws+'</div><div class="tips">听到这些词就要记下来。</div></div></div>';
  document.getElementById('list').innerHTML=html;
  document.getElementById('playBtn').onclick=function(){ sPlay(item.audio, this); };
  document.getElementById('startBtn').onclick=function(){
    if(TIMER){clearInterval(TIMER);TIMER=null;this.textContent='开始计时';return;}
    this.textContent='暂停';
    TIMER=setInterval(function(){ LEFT--; pint(); if(LEFT<=0){clearInterval(TIMER);TIMER=null;document.getElementById('startBtn').textContent='开始计时';} },1000);
  };
  document.getElementById('ans').oninput=function(){
    var n=(this.value.trim().match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length;
    var el=document.getElementById('wc'); el.textContent=n+' 词'; el.className='wc'+(n>=50&&n<=70?' ok':'');
  };
  document.getElementById('back').onclick=function(){ if(TIMER){clearInterval(TIMER);TIMER=null;} renderList(document.getElementById('q').value); };
  document.querySelectorAll('[data-sec]').forEach(function(b){ b.onclick=function(){ stoggle(this.dataset.sec); }; });
  stimerReset();
}
document.getElementById('q').oninput=function(){ renderList(this.value); };
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null;
  if(c){ var id=+c.dataset.id; var item=D.find(x=>x.id===id); if(item) renderPractice(item); }
};
renderList('');
</script></body></html>
