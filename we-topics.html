<footer>立场 + 两条扣题理由句 + 关键展开 + 写法</footer>
<script>
var D=[{"id": "4344", "name": "After-class activities", "stance": "整体有益", "reasons": [{"en": "Taking part in after-class activities helps students develop social skills and teamwork, because they have to cooperate with classmates in clubs and sports teams.", "zh": "参加课外活动能帮学生培养社交和团队能力，因为他们必须在社团和运动队里和同学合作。", "expand": "举例：社团、运动队、志愿活动"}, {"en": "These activities also give students a break from academic pressure, which keeps them mentally healthy and improves their concentration in class.", "zh": "这些活动也让学生从学业压力中解脱出来，保持心理健康，也能提高课堂专注度。", "expand": "对比：只学习 vs 有活动"}], "writing": "两个理由各配一个例子，用 First of all / Besides 连接，结尾重申课外活动的重要性。"}, {"id": "1720", "name": "Age restrictions", "stance": "支持合理年龄限制（以驾驶为例，18 岁）", "reasons": [{"en": "I believe the minimum age for driving should be 18, because younger teenagers are not mature enough to judge risks and react quickly in dangerous situations.", "zh": "我认为开车的最低年龄应该是 18 岁，因为更小的青少年不够成熟，无法判断风险或在危险中快速反应。", "expand": "举例：交通事故率、反应能力"}, {"en": "At 18, people are usually more responsible and can understand the legal consequences of dangerous driving.", "zh": "18 岁时人们通常更有责任感，能理解危险驾驶的法律后果。", "expand": "对比：未成年 vs 18 岁"}], "writing": "先选定一个活动（驾驶），明确给出年龄，再用两个理由支撑，最后用个人经历补充。"}, {"id": "4342", "name": "AI translation", "stance": "仍然需要学外语", "reasons": [{"en": "I still think learning a foreign language is necessary, because AI translation cannot capture tone, humour or cultural meaning in a real conversation.", "zh": "我仍然认为学外语是必要的，因为 AI 翻译无法捕捉真实对话中的语气、幽默和文化含义。", "expand": "举例：和外国人聊天、谈判"}, {"en": "Speaking a language yourself opens up job opportunities and helps you build personal relationships that a translation app never can.", "zh": "自己会说一门语言能带来工作机会，也能帮你建立翻译软件无法建立的个人关系。", "expand": "个人经历：工作中用外语"}], "writing": "先亮立场（仍然必要），两个理由分别讲'翻译的局限'和'语言的价值'，结尾用个人经验收束。"}, {"id": "3503", "name": "Air travel", "stance": "利大于弊", "reasons": [{"en": "I believe air travel brings more benefits, because it connects countries, boosts tourism and allows people to work and study abroad.", "zh": "我认为航空旅行利大于弊，因为它连接国家、促进旅游业，让人们能出国工作学习。", "expand": "举例：旅游、留学、国际贸易"}, {"en": "Although it produces carbon emissions, airlines are now investing in cleaner fuels and more efficient planes, so the negative impact can be reduced.", "zh": "虽然它产生碳排放，但航空公司正在投资更清洁的燃料和更高效的飞机，负面影响可以减轻。", "expand": "让步 + 反驳"}], "writing": "用 Although 句先承认缺点，再反驳，最后表态——这种'让步+反驳'是 WE 高分结构。"}, {"id": "1792", "name": "Art galleries ", "stance": "实体画廊更好", "reasons": [{"en": "I agree that viewing art in a gallery is better, because you can see the real size, texture and brushwork of a painting, which a screen can never show.", "zh": "我同意在画廊看艺术更好，因为你能看到画作的真实尺寸、质感和笔触，屏幕无法呈现。", "expand": "具体描述：尺寸、质感、光线"}, {"en": "Galleries also create a quiet, focused environment where visitors can slow down and think about the work, while digital viewing is often distracted and rushed.", "zh": "画廊还营造安静专注的环境，让参观者慢下来思考作品，而数字化观看常常分心匆忙。", "expand": "对比：专注 vs 分心"}], "writing": "先表态同意，两个理由分别讲'感官体验'和'专注环境'，最后让步一句（数字化也有便利）。"}, {"id": "3500", "name": "Assessing own products", "stance": "有利有弊，需配套机制", "reasons": [{"en": "One advantage is that workers who assess their own products take more responsibility for quality, because they can spot problems early and fix them.", "zh": "一个优势是员工评估自己的产品会对质量更负责，因为他们能及早发现问题并解决。", "expand": "举例：生产线质检"}, {"en": "However, the disadvantage is that employees may be too lenient with their own work, so mistakes can be missed without an independent check.", "zh": "但缺点是员工可能对自己的工作太宽容，没有独立检查就可能漏掉错误。", "expand": "举例：客户投诉、返工"}], "writing": "Discuss 题两面都要写，正文两段分别讲优缺点，结尾给平衡观点：可以自查，但要配合独立审核。"}, {"id": "4359", "name": "Bid to host sports events", "stance": "双刃剑，但利大于弊", "reasons": [{"en": "Hosting sports events can boost the local economy and improve a city's international image, because it attracts tourists and investment.", "zh": "举办体育赛事能提振当地经济、提升城市国际形象，因为它吸引游客和投资。", "expand": "举例：奥运会、世界杯"}, {"en": "However, hosting can also be a curse, because building stadiums and infrastructure may cost far more than the event earns.", "zh": "但举办也可能是诅咒，因为建场馆和基础设施的花费可能远超赛事收入。", "expand": "对比：收入 vs 成本"}], "writing": "题目问 blessing or curse，正文一段写 blessing、一段写 curse，结尾给出自己的判断。"}, {"id": "3506", "name": "Celebrities' privacy", "stance": "不应完全放弃，但要有限度", "reasons": [{"en": "I do not think celebrities should give up all privacy, because they are still ordinary people who deserve a private life with their families.", "zh": "我认为名人不应放弃所有隐私，因为他们仍是普通人，应该享有与家人在一起的私人生活。", "expand": "举例：狗仔跟拍、家人受影响"}, {"en": "However, when their behaviour affects public interest, some information should be reported, so the line depends on the situation.", "zh": "但当他们的行为涉及公共利益时，一些信息应该被报道，所以界线取决于具体情况。", "expand": "让步 + 界定标准"}], "writing": "不要一边倒。先说不应全放弃（理由：也是普通人），再给限定（涉及公共利益例外），结尾重申原则。"}, {"id": "1730", "name": "Cheaper public transportation", "stance": "利大于弊，但要配套措施", "reasons": [{"en": "Cheaper public transport benefits ordinary people, because it reduces commuting costs and encourages more people to leave their cars at home.", "zh": "更便宜的公共交通对普通人有好处，因为它降低通勤成本，鼓励更多人不开车。", "expand": "举例：月票降价、上班族受益"}, {"en": "However, lower fares can lead to overcrowding and put pressure on government budgets, so the service may become less reliable.", "zh": "但票价降低会导致拥挤，也给政府预算带来压力，服务可能变得不那么可靠。", "expand": "对比：收入减少 vs 需求增加"}], "writing": "题目要 advantages + problems。正文一段写好处（省钱、环保），一段写问题（拥挤、财政），结尾给出自己的判断。"}, {"id": "4346", "name": "Children education", "stance": "同意，两者同等重要", "reasons": [{"en": "I agree that parents are as important as teachers, because children learn values, habits and attitudes at home before they even start school.", "zh": "我同意父母和老师同样重要，因为孩子在上学前就在家里学到价值观、习惯和态度。", "expand": "举例：礼貌、阅读习惯"}, {"en": "Teachers provide knowledge and structure, while parents give emotional support, and the two together produce better results.", "zh": "老师提供知识和结构，父母提供情感支持，两者结合效果更好。", "expand": "对比：知识 vs 情感"}], "writing": "agree/disagree 题先明确立场。两个理由分别从'家庭打底'和'家校互补'展开，结尾总结两者缺一不可。"}, {"id": "4361", "name": "Choose university", "stance": "各有利弊", "reasons": [{"en": "Studying near home is cheaper and safer, because students can save on rent and meals and still receive family support.", "zh": "在离家近的地方上学更便宜也更安全，因为学生可以省下房租和餐费，还能得到家人支持。", "expand": "举例：房租、饮食开销"}, {"en": "However, studying away from home develops independence and social skills, since students must manage their time, money and daily life on their own.", "zh": "但离家上学能培养独立性和社交能力，因为学生必须自己管理时间、金钱和日常生活。", "expand": "举例：自己做饭、打理生活"}], "writing": "题目问 both sides 的优缺点，正文分成两段，一段写近、一段写远，结尾可以说'取决于学生性格'。"}, {"id": "3514", "name": "City", "stance": "以积极为主，但需规划", "reasons": [{"en": "I think urbanisation is largely positive, because cities offer more job opportunities, better education and easier access to healthcare.", "zh": "我认为城市化整体是积极的，因为城市提供更多工作机会、更好的教育和更便利的医疗。", "expand": "举例：就业、学校、医院"}, {"en": "However, rapid urban growth also brings overcrowding, pollution and high housing prices, so governments need careful planning.", "zh": "但城市快速扩张也带来拥挤、污染和高房价，所以政府需要仔细规划。", "expand": "让步 + 提条件"}], "writing": "positive/negative 题要选边。先写积极面（机会多），再承认问题（拥挤、房价），结尾给出'需要规划'的条件。"}, {"id": "4340", "name": "Compulsory learning", "stance": "同意必修，但要灵活", "reasons": [{"en": "I agree that learning a foreign language should be compulsory, because it gives every student a basic skill for future study and work.", "zh": "我同意外语应该是必修，因为它给每个学生未来学习和工作的基本技能。", "expand": "举例：英语在工作中的用处"}, {"en": "However, schools should not force every student to reach the same level, because students have different interests and abilities.", "zh": "但学校不应该要求每个学生达到同样水平，因为学生的兴趣和能力不同。", "expand": "让步 + 建议"}], "writing": "先同意（基础技能人人需要），再补充条件（不强求统一水平），这样立场就不是一边倒。"}, {"id": "4363", "name": "Creativity", "stance": "可以培养，天赋也有影响", "reasons": [{"en": "I believe creativity can be developed, because training, practice and a supportive environment help people generate new ideas.", "zh": "我认为创造力可以培养，因为训练、练习和支持性环境能帮人产生新想法。", "expand": "举例：艺术课、头脑风暴"}, {"en": "However, natural talent also plays a role, since some people are born with stronger imagination or curiosity.", "zh": "但天赋也有作用，因为有些人天生想象力或好奇心更强。", "expand": "让步"}], "writing": "这是'天生 vs 培养'的对立题，两方面都要写，结尾可以偏向'可培养'，因为这样更符合教育意义。"}, {"id": "2555", "name": "Dangerous activities", "stance": "支持，但强调安全", "reasons": [{"en": "I am in favour of dangerous activities to some extent, because they give people excitement, confidence and a sense of achievement.", "zh": "我在一定程度上支持危险活动，因为它们给人刺激、自信和成就感。", "expand": "举例：跳伞、登山"}, {"en": "However, participants must follow strict safety rules and receive proper training, otherwise the risks outweigh the benefits.", "zh": "但参与者必须遵守严格的安全规则并接受适当训练，否则风险大于收益。", "expand": "让步 + 条件"}], "writing": "用 to some extent 表示有条件的支持，先写价值（成长、成就感），再写条件（安全、训练）。"}, {"id": "3511", "name": "Differential education", "stance": "有利有弊", "reasons": [{"en": "One advantage of splitting students by ability is that teachers can match the pace and materials to each group, so both strong and weak students improve faster.", "zh": "按能力分班的一个好处是老师能根据每组调整进度和材料，让强和弱的学生都进步更快。", "expand": "举例：快班拓展、慢班补基础"}, {"en": "However, it can also label students and lower the confidence of those in lower groups, which may widen the gap instead of closing it.", "zh": "但它也可能给学生贴标签，降低低分组学生的自信，可能拉大而不是缩小差距。", "expand": "举例：心理影响"}], "writing": "Discuss 题写两面。优点从'因材施教'讲，缺点从'贴标签'讲，结尾给平衡结论。"}, {"id": "1763", "name": "Extreme sports", "stance": "有利有弊，需做好防护", "reasons": [{"en": "Extreme sports give participants a strong sense of achievement and help them overcome fear, which builds confidence that carries over into daily life.", "zh": "极限运动给参与者强烈的成就感，帮他们克服恐惧，这种自信会延续到日常生活中。", "expand": "举例：跳伞、攀岩后的变化"}, {"en": "However, the risk of serious injury is high, and medical costs and long recovery periods can affect a person's work and family life.", "zh": "但严重受伤的风险很高，医疗费用和漫长的恢复期会影响工作和家庭生活。", "expand": "举例：受伤案例、医疗费用"}], "writing": "题目只要 advantages and disadvantages，正文两段分别展开，结尾加一句建议（做好防护和专业训练）。"}, {"id": "4339", "name": "Financial learning", "stance": "同意", "reasons": [{"en": "I agree that financial management should be taught at school, because young people need to budget, save and avoid debt when they start working.", "zh": "我同意学校应该教理财，因为年轻人开始工作时需要做预算、存钱和避免负债。", "expand": "举例：助学贷款、信用卡"}, {"en": "Learning about money early also prevents serious mistakes later, since habits formed in childhood are hard to change.", "zh": "早点学理财也能避免以后的严重错误，因为童年形成的习惯很难改变。", "expand": "对比：有/无理财教育"}], "writing": "agree 题先表态，两个理由从'实用技能'和'习惯养成'展开，结尾建议纳入学校课程。"}, {"id": "4360", "name": "Good handwriting", "stance": "仍重要，但形式在变化", "reasons": [{"en": "I still think handwriting is important, because writing by hand helps people remember information and organise their thoughts more effectively.", "zh": "我仍然认为手写重要，因为手写能帮人更好地记忆信息和组织思路。", "expand": "举例：记笔记、考试"}, {"en": "However, typing is now more practical for work and study, so handwriting is becoming a personal skill rather than a daily necessity.", "zh": "但现在打字在工作和学习中更实用，手写正在变成个人技能而不是日常必需。", "expand": "让步 + 界定"}], "writing": "不要简单说重要或不重要。表态'仍重要'，再承认打字的实用性，这样显得有层次。"}, {"id": "4343", "name": "Government fund", "stance": "优先教育和公共健康", "reasons": [{"en": "I think education deserves the largest share of government funding, because it improves people's skills and benefits the economy in the long term.", "zh": "我认为教育应该获得最多的政府资金，因为它提升人们的技能，长期看有利于经济。", "expand": "举例：学校建设、奖学金"}, {"en": "Public health is equally important, since a healthy population reduces the burden on hospitals and helps the country develop.", "zh": "公共健康同样重要，因为健康的人口能减轻医院负担，帮助国家发展。", "expand": "举例：医保、疫苗"}], "writing": "题目问 which areas，选 1-2 个领域讲清楚，每个理由配一个例子，不要泛泛而谈。"}, {"id": "1719", "name": "Home to workplace", "stance": "整体积极", "reasons": [{"en": "I think it has a positive impact, because living close to work saves commuting time and reduces daily stress.", "zh": "我认为这是积极的影响，因为住得近能省下通勤时间，减少日常压力。", "expand": "举例：早上多睡、准时到岗"}, {"en": "However, it may also blur the line between work and personal life, since people can easily go back to the office after hours.", "zh": "但也可能模糊工作与生活的界限，因为人们下班后很容易回办公室。", "expand": "让步"}], "writing": "positive/negative 题选边（积极），再用 however 承认一个潜在问题，结尾重申整体是好的。"}, {"id": "4354", "name": "Human activities", "stance": "同意，并给解决方案", "reasons": [{"en": "I agree that human activities are the main cause, because burning fossil fuels and cutting down forests release huge amounts of carbon dioxide.", "zh": "我同意人类活动是主因，因为燃烧化石燃料和砍伐森林释放大量二氧化碳。", "expand": "举例：工厂、汽车、森林砍伐"}, {"en": "To solve this, governments should invest in renewable energy and encourage people to use public transport and recycle.", "zh": "为了解决这个问题，政府应该投资可再生能源，鼓励人们使用公共交通和回收。", "expand": "举例：太阳能、电动车"}], "writing": "这题有两个任务（agree + solutions），正文一段表同意、一段给方案，两边都要写足。"}, {"id": "4348", "name": "Immigration", "stance": "有利有弊", "reasons": [{"en": "Living in a foreign country gives people new opportunities, because they can study at better universities, find higher-paying jobs and experience a different culture.", "zh": "在国外生活给人新机会，因为他们能上更好的大学、找到更高薪的工作、体验不同的文化。", "expand": "举例：留学、海外工作"}, {"en": "However, immigrants often face language barriers and homesickness, and adjusting to a new culture can be stressful.", "zh": "但移民常面临语言障碍和思乡，适应新文化也可能很有压力。", "expand": "举例：语言、孤独感"}], "writing": "题目要求 advantages and disadvantages，正文各一段，结尾可以用个人经历或见闻补充。"}, {"id": "1797", "name": "International languages", "stance": "很重要", "reasons": [{"en": "I believe this matters, because every language carries unique knowledge, stories and ways of understanding the world.", "zh": "我认为这很重要，因为每种语言都承载着独特的知识、故事和理解世界的方式。", "expand": "举例：土著语言、传统知识"}, {"en": "Losing a language also means losing part of human cultural diversity, which cannot be recovered once it disappears.", "zh": "一种语言消失也意味着人类文化多样性的一部分消失，一旦失去就无法挽回。", "expand": "对比：消失前 vs 消失后"}], "writing": "先明确表态（matters），两个理由从'知识载体'和'文化多样性'展开，结尾建议保护小语种。"}, {"id": "4353", "name": "Job satisfaction", "stance": "不现实，但可以改善", "reasons": [{"en": "I do not think it is realistic for everyone, because many people simply cannot find work that matches both their interests and their financial needs.", "zh": "我认为对每个人来说都不太现实，因为很多人根本找不到既符合兴趣又满足经济需求的工作。", "expand": "举例：毕业生、转行的人"}, {"en": "Still, people can improve their satisfaction by developing skills, changing their attitude, or finding meaning in the work they do.", "zh": "不过，人们可以通过提升技能、改变心态或从工作中找到意义来提升满意度。", "expand": "举例：培训、业余项目"}], "writing": "先给否定判断（不现实），再用 Still 转折给出积极出路，这样立场不消极。"}, {"id": "3513", "name": "Life choices", "stance": "两者需要平衡", "reasons": [{"en": "Focusing on study or work builds professional skills and financial stability, which young people need before they can explore the world.", "zh": "专注学习或工作能建立专业技能和经济基础，这是年轻人探索世界之前需要的。", "expand": "举例：考证、职业起步"}, {"en": "However, travel and volunteering broaden people's horizons and develop soft skills, so they should not be ignored.", "zh": "但旅行和志愿活动能拓宽视野、培养软技能，所以不应该被忽视。", "expand": "举例：海外志愿、实习"}], "writing": "这题是两个观点的对比，正文各写一段，结尾给平衡建议：先打好基础，再适度拓展。"}, {"id": "4358", "name": "Life experience or education", "stance": "部分同意，两者结合最好", "reasons": [{"en": "I partly agree that experience is a good teacher, because real-life challenges teach practical skills and judgment that books cannot provide.", "zh": "我部分同意经验是好老师，因为现实中的挑战能教出书本无法提供的实用技能和判断力。", "expand": "举例：工作中学会沟通"}, {"en": "However, formal education gives people systematic knowledge and theory, which helps them understand why things work, not just how.", "zh": "但正规教育给人系统的知识和理论，帮人们理解事情背后的原因，而不只是怎么操作。", "expand": "对比：理论 vs 实践"}], "writing": "How far 题要用部分同意（partly agree），两边都要写，结论是理论和经验互补。"}, {"id": "4356", "name": "Looking for a job", "stance": "工作条件更重要，但薪水也重要", "reasons": [{"en": "Salary matters, because a higher income provides financial security and allows people to support their families and plan for the future.", "zh": "薪水重要，因为高收入能带来经济保障，让人们养家并为未来做规划。", "expand": "举例：房贷、家庭开销"}, {"en": "However, working conditions matter more in the long run, since a supportive environment and reasonable hours affect daily happiness and health.", "zh": "但长期来看工作条件更重要，因为支持性的环境和合理的工时影响每天的幸福和健康。", "expand": "对比：高薪高压 vs 平衡"}], "writing": "Which one 题要求表态。可以先写薪水的合理性，再说明工作条件更持久，最后给出自己的选择。"}, {"id": "3502", "name": "Maximum wage", "stance": "弊大于利，建议用累进税代替", "reasons": [{"en": "I do not think a maximum wage is a good idea, because it may discourage talented people from working hard or taking risky jobs.", "zh": "我认为最高工资不是好主意，因为它可能打击优秀人才努力工作或承担高风险工作的积极性。", "expand": "举例：医生、创业者"}, {"en": "However, extremely high pay gaps can cause social unfairness, so progressive tax is a better solution than a fixed cap.", "zh": "但极高的收入差距会造成社会不公，所以累进税比固定上限更合适。", "expand": "对比：最高工资 vs 累进税"}], "writing": "先反对（会打击积极性），再承认问题（差距过大），最后提出替代方案（税收调节）。"}, {"id": "1718", "name": "Media violence", "stance": "需要重视，但不该全面禁止", "reasons": [{"en": "I think media violence should be taken seriously, because repeated exposure may make young people less sensitive to real violence.", "zh": "我认为媒体暴力应该被认真对待，因为反复接触可能让年轻人对真实的暴力变得不敏感。", "expand": "举例：游戏、影视作品"}, {"en": "However, banning it completely is not practical, so age ratings and parental guidance are better solutions.", "zh": "但完全禁止不现实，所以分级制度和家长指导是更好的办法。", "expand": "建议：分级、家长陪同"}], "writing": "先承认问题（可能有负面影响），再说完全禁止不现实，最后给出可行方案。"}, {"id": "4349", "name": "National \nhappiness \nindex", "stance": "应该作为补充指标", "reasons": [{"en": "I think the happiness index is valuable, because economic growth does not always mean people live better lives.", "zh": "我认为幸福指数有价值，因为经济增长并不总意味着人们生活得更好。", "expand": "举例：高 GDP 但压力大的国家"}, {"en": "However, economic growth still matters, since without it governments cannot fund healthcare, education or housing.", "zh": "但经济增长仍然重要，因为没它政府无法支撑医疗、教育或住房。", "expand": "举例：公共服务的资金来源"}], "writing": "这题有两问（怎么看 + 怎么衡量）。正文一段评观点，一段给衡量指标（健康、教育、环境、人际关系）。"}, {"id": "4355", "name": "Nature and Nurture", "stance": "后天影响更大", "reasons": [{"en": "I believe nurture has a greater influence, because family, education and culture shape how people think and behave.", "zh": "我认为后天影响更大，因为家庭、教育和文化塑造了人的思维和行为。", "expand": "举例：不同环境长大的双胞胎"}, {"en": "However, nature also plays a role, since genes affect personality, talent and even health.", "zh": "但先天也有作用，因为基因影响性格、天赋甚至健康。", "expand": "让步"}], "writing": "Which one 题要选边（后天更大），但必须承认先天的作用，否则显得片面。"}, {"id": "1796", "name": "Online teaching", "stance": "部分同意，不能完全取代", "reasons": [{"en": "I partly agree, because online teaching is flexible and gives students access to courses and teachers they could not reach otherwise.", "zh": "我部分同意，因为线上教学灵活，让学生能接触到原本无法获得的课程和老师。", "expand": "举例：偏远地区、录播课"}, {"en": "However, it cannot fully replace traditional classrooms, because face-to-face discussion and immediate feedback are difficult to achieve online.", "zh": "但它无法完全取代传统课堂，因为面对面的讨论和即时反馈在线上很难实现。", "expand": "对比：课堂互动 vs 屏幕"}], "writing": "How far 题用部分同意（partly agree），两边都写，结论是线上线下结合。"}, {"id": "3504", "name": "Over-competitive", "stance": "有利有弊", "reasons": [{"en": "One advantage is that competition pushes people to work harder and improve their skills, which raises overall performance.", "zh": "一个优势是竞争推动人们更努力、提升技能，从而提高整体表现。", "expand": "举例：职场、升学"}, {"en": "However, being over-competitive can cause stress, damage relationships and lead to unethical behaviour.", "zh": "但过度竞争会造成压力、损害人际关系，还可能导致不道德行为。", "expand": "举例：作弊、人际关系紧张"}], "writing": "题目问 advantages and disadvantages，正文各一段，结尾给平衡建议（适度竞争，重在自我提升）。"}, {"id": "4352", "name": "Overcrowding", "stance": "给出两个解决方案", "reasons": [{"en": "The most effective solution is to improve public transport, because when more people take the subway and buses, the number of private cars drops.", "zh": "最有效的办法是改善公共交通，因为当更多人坐地铁和公交，私家车数量会减少。", "expand": "举例：地铁扩建、票价优惠"}, {"en": "Governments should also develop satellite towns, so that people can live and work outside the city centre.", "zh": "政府还应该发展卫星城，让人们能在市中心以外生活和工作。", "expand": "举例：新区、通勤铁路"}], "writing": "题目只要 solutions，正文直接给两个方案，每个配一句解释和一个例子，不需要表态。"}, {"id": "1741", "name": "Paying teachers for student achievements", "stance": "部分同意，需多指标评价", "reasons": [{"en": "I partly agree, because linking pay to results can motivate teachers to focus more on student progress.", "zh": "我部分同意，因为把薪水与结果挂钩能激励老师更关注学生的进步。", "expand": "举例：进步奖励"}, {"en": "However, it may also encourage teachers to focus only on test scores and ignore creativity or students with difficulties.", "zh": "但也可能让老师只盯着考试分数，忽略创造力和有困难的学生。", "expand": "对比：分数 vs 全面发展"}], "writing": "先给部分同意，再指出风险，最后建议用多指标（进步、参与、创造力）来评价，而不是只看分数。"}, {"id": "4357", "name": "Public \ntransportation \nsystem", "stance": "有优势也有不足", "reasons": [{"en": "The main strength is that it is affordable and environmentally friendly, since one full bus can replace dozens of private cars.", "zh": "主要优势是便宜且环保，因为一辆满载的公交车能替代几十辆私家车。", "expand": "举例：票价、碳排放"}, {"en": "The weakness is that in peak hours buses and trains are crowded and often delayed.", "zh": "缺点是高峰时段公交和地铁拥挤，还经常晚点。", "expand": "举例：早高峰、晚点"}], "writing": "strengths and weaknesses 题各写一段，结尾给一句改进建议（增加班次、改善准点率）。"}, {"id": "3510", "name": "Public open space", "stance": "同意", "reasons": [{"en": "I agree, because public open spaces give people a place to exercise, relax and escape from the noise of the city.", "zh": "我同意，因为公共开放空间给人们运动、放松和远离城市噪音的地方。", "expand": "举例：公园、广场"}, {"en": "They also bring different groups together, which builds a stronger sense of community.", "zh": "它们还把不同群体聚在一起，建立更强的社区感。", "expand": "举例：社区活动"}], "writing": "To what extent 题先明确同意，两个理由从'个人健康'和'社区关系'展开，结尾承认需要考虑维护成本。"}, {"id": "1789", "name": "Purpose of education", "stance": "两者兼顾", "reasons": [{"en": "I think education should prepare people for work, because practical skills help them support themselves and contribute to society.", "zh": "我认为教育应该为工作做准备，因为实用技能帮他们养活自己并为社会做贡献。", "expand": "举例：职业培训"}, {"en": "However, education should also help people fulfil their potential, since a job alone cannot give everyone a meaningful life.", "zh": "但教育也应该帮人实现潜能，因为只有一份工作无法给每个人有意义的人生。", "expand": "举例：艺术、人文课程"}], "writing": "这题是两个观点的对比，正文各写一段，结尾给出平衡观点：工作准备和自我实现并不冲突。"}, {"id": "4341", "name": "Restorations of buildings", "stance": "部分同意，需要平衡", "reasons": [{"en": "I partly agree that too much is spent on restoration, because historical buildings do preserve culture and attract tourists.", "zh": "我部分同意修复花费过多，因为历史建筑确实保存文化、吸引游客。", "expand": "举例：古城、地标建筑"}, {"en": "However, modern housing is also essential, since many people still lack affordable places to live.", "zh": "但现代住房同样重要，因为很多人仍缺乏负担得起的住房。", "expand": "对比：旅游收益 vs 居住需求"}], "writing": "To what extent 题用部分同意，两方面都写，结论是资金应该在文化遗产和住房之间平衡。"}, {"id": "1799", "name": "Robots", "stance": "提高生活质量，但需处理就业", "reasons": [{"en": "I think robots will increase our quality of life, because they can handle dangerous, repetitive or precise tasks faster and more accurately than humans.", "zh": "我认为机器人会提高生活质量，因为它们能比人类更快更准地处理危险、重复或精密的任务。", "expand": "举例：工厂、手术、救援"}, {"en": "However, they may reduce jobs in some industries, so governments need to retrain workers for new roles.", "zh": "但它们可能减少某些行业的岗位，所以政府需要为工人提供再培训。", "expand": "让步 + 解决"}], "writing": "increase/decrease 题选边（提高），但要正面处理'就业'这个反方论点，给出解决方式。"}, {"id": "1784", "name": "Scientific subject", "stance": "选择生物学", "reasons": [{"en": "I would choose biology, because it explains how living things work and connects directly to health, food and the environment.", "zh": "我会选生物学，因为它解释生物如何运作，直接关系到健康、食物和环境。", "expand": "举例：疾病、基因、生态"}, {"en": "Biology also opens up many career paths, from medicine and research to environmental protection.", "zh": "生物学也打开很多职业路径，从医学、研究到环境保护。", "expand": "举例：医生、科研人员"}], "writing": "题目要你选一个学科，不能泛泛而谈。选定生物学后，两个理由分别讲'和生活相关'和'职业前景'。"}, {"id": "1795", "name": "Selecting specialist areas of study", "stance": "有利有弊", "reasons": [{"en": "One benefit is that students can focus on subjects they enjoy and develop deeper knowledge in their specialist area.", "zh": "一个好处是学生能专注自己喜欢的科目，在专业领域学得更深。", "expand": "举例：艺术、理科专长者"}, {"en": "However, choosing too early may limit their options, because teenagers often do not know what they really want to do.", "zh": "但选得太早可能限制他们的选择，因为青少年常常不知道自己真正想做什么。", "expand": "对比：早定 vs 晚定"}], "writing": "benefits + disadvantages 各一段，结尾给建议：可以提供专业方向，但要保留转换的灵活性。"}, {"id": "3507", "name": "Short working weeks", "stance": "有利有弊，部分适用成人", "reasons": [{"en": "One advantage is that shorter weeks can preserve jobs, because the same amount of work is shared among more employees.", "zh": "一个优势是缩短工作周能保住岗位，因为同样的工作量由更多员工分担。", "expand": "举例：经济低迷期的企业"}, {"en": "However, it may reduce income for workers and increase costs for companies, since they need more staff to cover the same tasks.", "zh": "但可能减少员工收入、增加公司成本，因为需要更多人完成同样的任务。", "expand": "对比：员工收入 vs 企业成本"}], "writing": "题目有两问（优缺点 + 是否适用成人），正文要先讲优缺点，最后单独回答成人是否适用。"}, {"id": "3501", "name": "Studying plays", "stance": "有益也有问题", "reasons": [{"en": "One benefit is that classic plays develop students' language, imagination and understanding of history and human nature.", "zh": "一个好处是经典戏剧能提升学生的语言、想象力，以及对历史和人性理解。", "expand": "举例：莎士比亚作品"}, {"en": "However, the old-fashioned language can be hard to understand, which may discourage students and reduce their interest.", "zh": "但过时的语言很难理解，可能让学生受挫、失去兴趣。", "expand": "举例：阅读困难"}], "writing": "题目只要 problems and benefits，正文各一段，结尾用个人经历补充，并建议配合现代解读。"}, {"id": "4362", "name": "Subject choosing", "stance": "部分同意，兴趣和就业要平衡", "reasons": [{"en": "I partly agree that students should choose subjects they are interested in, because interest keeps them motivated and helps them get better results.", "zh": "我部分同意学生应该选感兴趣的科目，因为兴趣能保持动力，也帮他们拿到更好的成绩。", "expand": "举例：喜欢历史所以成绩好"}, {"en": "However, employment prospects should not be ignored, since students need practical skills to support themselves after graduation.", "zh": "但就业前景也不应忽视，因为学生毕业后需要实用技能来养活自己。", "expand": "举例：就业率高的专业"}], "writing": "先用 partly agree 表态，再说明为什么就业也要考虑，结尾建议在两者之间找交集。"}, {"id": "4364", "name": "Successful people", "stance": "环境有影响，但个人努力更重要", "reasons": [{"en": "The place where people grow up can shape their opportunities, because access to education, role models and resources varies greatly.", "zh": "成长的地方会影响机会，因为教育、榜样和资源的可及性差异很大。", "expand": "举例：选择一个具体成功人物"}, {"en": "However, personal effort and determination matter more, since many successful people came from difficult backgrounds.", "zh": "但个人努力和决心更重要，因为很多成功人士出身艰难。", "expand": "举例：同一人物的早年经历"}], "writing": "题目要求选一个成功人物贯穿全文，两个理由都要落在这个人身上，不要泛泛举例。"}, {"id": "1790", "name": "Taking part in sport", "stance": "同意", "reasons": [{"en": "I agree, because regular exercise keeps adults physically healthy and reduces the risk of heart disease and obesity.", "zh": "我同意，因为规律运动让成年人保持身体健康，降低心脏病和肥胖的风险。", "expand": "举例：跑步、游泳"}, {"en": "Sport also improves mental health, since it relieves stress and helps people feel happier and more confident.", "zh": "运动也改善心理健康，因为它减压，让人更快乐、更自信。", "expand": "举例：团队运动、社交"}], "writing": "To what extent 题先表态同意，两个理由从'身体'和'心理'两个层面展开，各配一个例子。"}, {"id": "4351", "name": "Taking part in Sports", "stance": "同意", "reasons": [{"en": "I agree, because team sports teach cooperation, communication and how to handle both winning and losing.", "zh": "我同意，因为团队运动教合作、沟通，以及如何面对输赢。", "expand": "举例：足球队、接力赛"}, {"en": "Individual sports also build self-discipline and time management, since athletes must train regularly on their own.", "zh": "个人运动也培养自律和时间管理，因为运动员必须自己规律训练。", "expand": "举例：游泳、长跑"}], "writing": "how far 题表态同意，两个理由分别讲'团队技能'和'个人品质'，各配一个例子。"}, {"id": "1794", "name": "Tax on high-sugar products", "stance": "部分同意，但不是唯一办法", "reasons": [{"en": "I partly agree, because higher prices can discourage people from buying sugary drinks and reduce consumption.", "zh": "我部分同意，因为更高的价格能阻止人们购买含糖饮料，减少消费。", "expand": "举例：其他国家的糖税效果"}, {"en": "However, a tax alone is not enough, since education about healthy eating and clear food labels are also important.", "zh": "但仅靠税收不够，因为健康饮食教育和清晰的食品标签同样重要。", "expand": "对比：单一措施 vs 综合措施"}], "writing": "题目里有 only way 这个绝对说法，用 partly agree 反驳，说明糖税有用但不充分。"}, {"id": "1791", "name": "Team sports", "stance": "部分同意", "reasons": [{"en": "I partly agree that team sports are more beneficial, because players learn to cooperate, communicate and support each other toward a common goal.", "zh": "我部分同意团队运动更有益，因为球员要学会合作、沟通和互相支持，才能达成共同目标。", "expand": "举例：比赛中的配合"}, {"en": "However, individual sports also have value, since they build self-discipline and teach people to rely on themselves.", "zh": "但个人运动也有价值，因为它们能培养自律，教会人们依靠自己。", "expand": "举例：游泳、长跑"}], "writing": "invariably 是绝对词，回答时用 partly agree，既认可团队运动，也承认个人运动的价值。"}, {"id": "1798", "name": "Technology and creativity", "stance": "取决于使用方式", "reasons": [{"en": "I think there is some reason to worry, because spending hours passively watching screens leaves less time for imaginative play and hands-on creation.", "zh": "我认为担忧有一定道理，因为长时间被动看屏幕，留给想象和动手创作的时间就少了。", "expand": "举例：刷短视频 vs 画画"}, {"en": "However, technology can also support creativity, since people can use apps to draw, compose music, edit videos and share ideas worldwide.", "zh": "但科技也能促进创造力，因为人们可以用应用画画、作曲、剪视频，并与全世界分享想法。", "expand": "举例：设计软件、编程"}], "writing": "题目问 should we be worried，要给条件性的回答：关键看是被动消费还是主动创造。"}, {"id": "3512", "name": "Technology used for space travel", "stance": "优先民生，但兼顾航天", "reasons": [{"en": "I partly agree that governments should focus on people's lives, because problems like healthcare, education and housing affect millions of people every day.", "zh": "我部分同意政府应关注民生，因为医疗、教育和住房问题每天都影响数百万人。", "expand": "举例：医院、学校"}, {"en": "However, space technology also brings long-term benefits, since satellites improve communication, weather forecasting and navigation.", "zh": "但航天技术也带来长期好处，因为卫星改善通信、天气预报和导航。", "expand": "举例：GPS、气象"}], "writing": "to what extent 题用 partly agree，两边都写，结尾给出合理的资源分配建议。"}, {"id": "1793", "name": "Tertiary education", "stance": "在两者之间", "reasons": [{"en": "Tertiary education should prepare students for the workplace, because practical skills and internships help them find jobs after graduation.", "zh": "大学教育应该为学生进入职场做准备，因为实用技能和实习能帮他们毕业后找到工作。", "expand": "举例：实习、职业课程"}, {"en": "However, university should also prepare students for life, since critical thinking and broad knowledge help them make better decisions.", "zh": "但大学也应该为学生的人生做准备，因为批判性思维和广博知识帮他们做更好的决定。", "expand": "举例：通识课程"}], "writing": "题目 explicit 地要求说明你的位置（where your opinion lies），所以要明确表态：两边都重要，但侧重哪边。"}, {"id": "1752", "name": "The Digital Age", "stance": "整体是进步，但要注意依赖", "reasons": [{"en": "I think the digital age has made us more knowledgeable, because we can access information, courses and global news within seconds.", "zh": "我认为数字时代让我们更有知识，因为我们能在几秒内获取信息、课程和全球新闻。", "expand": "举例：在线学习、搜索"}, {"en": "However, it can also make us lazier, since people rely on search engines instead of memorising or thinking deeply.", "zh": "但它也可能让人变懒，因为人们依赖搜索引擎，不再记忆或深入思考。", "expand": "对比：主动使用 vs 被动依赖"}], "writing": "Discuss both opinions 题两面都写，最后给出自己的立场（整体进步，但要避免依赖）。"}, {"id": "4347", "name": "The purpose of education", "stance": "两者兼顾", "reasons": [{"en": "I think education should prepare people to contribute to society, because a country needs skilled workers and responsible citizens.", "zh": "我认为教育应该培养人贡献社会，因为国家需要熟练的工人和负责任的公民。", "expand": "举例：职业培训、公民教育"}, {"en": "However, it should also help individuals fulfil their lives, since personal interests and happiness matter as much as economic contribution.", "zh": "但它也应该帮个人实现人生，因为个人兴趣和幸福和经济贡献同样重要。", "expand": "举例：艺术、志愿服务"}], "writing": "题目是二选一，但可以给'两者兼顾'的答案，并说明为什么两者不冲突。"}, {"id": "3499", "name": "The value of humanities", "stance": "仍然重要", "reasons": [{"en": "I think the humanities are still valuable, because subjects like history and literature develop critical thinking and help people understand different perspectives.", "zh": "我认为人文学科仍然有价值，因为历史和文学等学科培养批判性思维，帮人理解不同观点。", "expand": "举例：分析文本、讨论伦理"}, {"en": "They also benefit careers, since communication, empathy and ethical judgment are important in law, business and medicine.", "zh": "它们对职业也有帮助，因为沟通、同理心和伦理判断在法律、商业和医学中都很重要。", "expand": "举例：医生需要同理心"}], "writing": "题目暗示'人文学科被冷落'，回答时要正面反驳这个说法，从思维和职业两个角度说明价值。"}, {"id": "4345", "name": "Tuition fee", "stance": "部分同意，需要资助配套", "reasons": [{"en": "I partly agree, because students benefit personally from higher salaries after graduation, so they should contribute to the cost.", "zh": "我部分同意，因为学生毕业后获得更高薪水，个人受益，所以应该分担费用。", "expand": "举例：毕业后的薪资差异"}, {"en": "However, paying the full cost would exclude poor students, so scholarships and loans are necessary to keep education fair.", "zh": "但全额付费会把贫困学生排除在外，所以需要奖学金和贷款来保证教育公平。", "expand": "对比：公平 vs 效率"}], "writing": "agree/disagree 题用 partly agree，先承认合理之处，再指出公平问题，给出资助方案。"}, {"id": "3515", "name": "Unhealthy lifestyles", "stance": "列问题 + 给政府建议", "reasons": [{"en": "Two common unhealthy lifestyles are sitting for long hours and eating too much fast food, both of which can lead to obesity and heart disease.", "zh": "两种常见的不健康生活方式是长时间久坐和吃太多快餐，这两者都会导致肥胖和心脏病。", "expand": "举例：办公室工作、外卖"}, {"en": "Governments can help by funding public sports facilities, offering free health checks and taxing sugary drinks.", "zh": "政府可以通过资助公共运动设施、提供免费体检和对含糖饮料征税来帮助。", "expand": "举例：社区健身房、免费体检"}], "writing": "题目有两个任务（列生活方式 + 政府服务），正文两段各答一问，不要只写一边。"}, {"id": "3508", "name": "Wearing uniforms", "stance": "应该有，但不要过严", "reasons": [{"en": "I think schools should have uniform rules, because they reduce peer pressure about clothes and create a sense of equality.", "zh": "我认为学校应该有校服规定，因为它们减少衣着上的攀比，营造平等感。", "expand": "举例：不同家庭背景的学生"}, {"en": "However, the rules should not be too strict, since students should have some freedom to express themselves on special days.", "zh": "但规定不应该太严，因为学生应该在特殊日子有一些表达自我的自由。", "expand": "让步：主题活动日"}], "writing": "Should 题给出'应该有但要有度'的回答，先讲好处，再给条件，避免走极端。"}, {"id": "3509", "name": "Women raise a family", "stance": "给个人和国家两层的建议", "reasons": [{"en": "On a personal level, women can share housework and childcare with their partners, so that family duties do not fall only on them.", "zh": "在个人层面，女性可以和伴侣分担家务和育儿，这样家庭责任不会只落在她们身上。", "expand": "举例：家务分工、家人帮忙"}, {"en": "At the national level, governments should provide affordable childcare and flexible working arrangements, so that mothers can stay in work.", "zh": "在国家层面，政府应该提供可负担的托儿服务和灵活的工作安排，让妈妈们能继续工作。", "expand": "举例：托儿补贴、弹性工作"}], "writing": "题目 explicit 要求 personal level 和 national level，正文分两段，每段一个层面。"}, {"id": "3505", "name": "Working less time", "stance": "部分同意，但变化不均衡", "reasons": [{"en": "I partly agree, because automation and AI can take over repetitive tasks, so people may need to work fewer hours.", "zh": "我部分同意，因为自动化和 AI 能接手重复性工作，人们可能工作时间更少。", "expand": "举例：工厂自动化、远程办公"}, {"en": "However, some industries still need long hours, and not all workers can benefit equally, so the change may be uneven.", "zh": "但有些行业仍需要长时间工作，不是所有工人都能平等受益，所以变化可能不均衡。", "expand": "对比：知识型 vs 服务型"}], "writing": "to what extent 用 partly agree，说明趋势存在但要指出不均衡，最后给个人经验的例子。"}, {"id": "4350", "name": "Works of literature", "stance": "不同意", "reasons": [{"en": "I disagree, because literature develops language skills, imagination and the ability to see the world through other people's eyes.", "zh": "我不同意，因为文学作品提升语言能力、想象力，以及从他人视角看世界的能力。", "expand": "举例：阅读小说带来的改变"}, {"en": "It also preserves culture and history, since classic works reflect the values and struggles of their time.", "zh": "它也保存文化和历史，因为经典作品反映那个时代的价值观和困境。", "expand": "举例：经典作品"}], "writing": "disagree 题先明确否定（文学作品不是浪费时间），两个理由从语言和文化展开。"}, {"id": "1800", "name": "Zoos", "stance": "有条件地有益", "reasons": [{"en": "I think zoos can benefit society, because they protect endangered species and support breeding programmes.", "zh": "我认为动物园能造福社会，因为它们保护濒危物种，支持繁育计划。", "expand": "举例：大熊猫繁育"}, {"en": "However, zoos must provide proper living conditions, otherwise animals suffer and the educational value is limited.", "zh": "但动物园必须提供合适的生活条件，否则动物受罪，教育价值也有限。", "expand": "让步 + 条件"}], "writing": "题目有两问（benefit + conservation role），正文分别回答，结尾给出条件（动物福利）。"}];
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function list(kw){
  kw=(kw||'').toLowerCase();
  var a=D.filter(x=>!kw||x.name.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=a.map(x=>'<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">2 条理由句 · 含展开和写法</div></div><div class="go">看 →</div></div>').join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到</div>';
}
function show(it){
  var h='<span class="back" id="back">← 返回列表</span><div class="panel"><div class="ptitle">'+esc(it.name)+'</div><div class="lbl">建议立场</div><span class="stance">'+esc(it.stance)+'</span></div>';
  it.reasons.forEach(function(r,i){
    h+='<div class="panel"><div class="lbl">理由 '+(i+1)+'</div><div class="rs"><div class="en">'+esc(r.en)+'</div><div class="zh">'+esc(r.zh)+'</div><div class="ex">关键展开：'+esc(r.expand)+'</div></div></div>';
  });
  h+='<div class="panel"><div class="lbl">写法建议</div><div class="wr">'+esc(it.writing)+'</div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>list(document.getElementById('q').value);
}
document.getElementById('q').oninput=function(){list(this.value)};
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null; if(!c)return;
  var it=D.find(x=>String(x.id)===c.dataset.id); if(it)show(it);
};
list('');
</script></body></html>
