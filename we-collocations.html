var DATA=[{"id":"fn-01","kind":"function","group":"effect","en":"lead to","zh":"导致；带来","pattern":"lead to + noun / doing","example":"Excessive screen time can lead to poor concentration and sleep problems.","note":"强调自然结果，后面接名词或动名词。"},{"id":"fn-02","kind":"function","group":"effect","en":"result in","zh":"造成；导致","pattern":"result in + noun","example":"A lack of public funding may result in poorer public services.","note":"常用于正式写作，结果通常是客观后果。"},{"id":"fn-03","kind":"function","group":"effect","en":"give rise to","zh":"引发；引起","pattern":"give rise to + noun","example":"The rapid use of AI has given rise to concerns about privacy.","note":"多接问题、争论、担忧等抽象名词。"},{"id":"fn-04","kind":"function","group":"effect","en":"stem from","zh":"源于；来自","pattern":"stem from + noun","example":"Many health problems stem from unhealthy daily habits.","note":"说明问题的来源，常和健康、贫困、教育等话题搭配。"},{"id":"fn-05","kind":"function","group":"effect","en":"be attributed to","zh":"归因于","pattern":"be attributed to + noun","example":"The rise in obesity can be attributed to processed food and sedentary lifestyles.","note":"比 because of 更正式，常用于分析原因。"},{"id":"fn-06","kind":"function","group":"effect","en":"have a significant impact on","zh":"对……有重大影响","pattern":"have a significant impact on + noun","example":"Government policy can have a significant impact on public health.","note":"把 impact 换成 positive / negative 可以表达立场。"},{"id":"fn-07","kind":"function","group":"effect","en":"contribute to","zh":"促成；加剧","pattern":"contribute to + noun / doing","example":"Regular exercise contributes to both physical and mental well-being.","note":"既可用于积极结果，也可用于问题加剧。"},{"id":"fn-08","kind":"function","group":"effect","en":"come at the expense of","zh":"以牺牲……为代价","pattern":"come at the expense of + noun","example":"Economic growth should not come at the expense of the environment.","note":"常用于讨论利弊冲突和长期代价。"},{"id":"fn-09","kind":"function","group":"evaluate","en":"outweigh","zh":"超过；大于","pattern":"A outweigh B","example":"The benefits of public transport outweigh its short-term costs.","note":"比较利弊时直接接宾语，不用 more。"},{"id":"fn-10","kind":"function","group":"evaluate","en":"do more harm than good","zh":"弊大于利","pattern":"do more harm than good","example":"Strict rules can do more harm than good if they limit personal freedom.","note":"比只说 bad 更具体，立场也更清楚。"},{"id":"fn-11","kind":"function","group":"evaluate","en":"be beneficial to","zh":"对……有益","pattern":"be beneficial to + noun","example":"Access to public libraries is beneficial to low-income families.","note":"比 good for 更正式，适合 WE 主体段。"},{"id":"fn-12","kind":"function","group":"evaluate","en":"have more advantages than disadvantages","zh":"利大于弊","pattern":"have more advantages than disadvantages","example":"Working from home has more advantages than disadvantages for many employees.","note":"适合利弊题的直接表态。"},{"id":"fn-13","kind":"function","group":"evaluate","en":"strike a balance between","zh":"在……之间取得平衡","pattern":"strike a balance between A and B","example":"Schools should strike a balance between academic study and physical activity.","note":"适合给出折中立场。"},{"id":"fn-14","kind":"function","group":"evaluate","en":"be superior to","zh":"优于；比……更好","pattern":"be superior to + noun","example":"Online learning is not always superior to face-to-face teaching.","note":"后面用 to，不用 than。"},{"id":"fn-15","kind":"function","group":"evaluate","en":"pale in comparison with","zh":"与……相比显得逊色","pattern":"pale in comparison with + noun","example":"The convenience of digital art pales in comparison with seeing a painting in person.","note":"适合强烈比较，注意语气较强。"},{"id":"fn-16","kind":"function","group":"evaluate","en":"take a balanced approach to","zh":"对……采取平衡做法","pattern":"take a balanced approach to + noun / doing","example":"Governments should take a balanced approach to economic growth and environmental protection.","note":"适合结尾给出兼顾双方的方案。"},{"id":"fn-17","kind":"function","group":"solution","en":"take effective measures to","zh":"采取有效措施做……","pattern":"take effective measures to + verb","example":"Governments should take effective measures to reduce air pollution.","note":"措施类题目开头很好用。"},{"id":"fn-18","kind":"function","group":"solution","en":"play a vital role in","zh":"在……中发挥关键作用","pattern":"play a vital role in + noun / doing","example":"Public libraries play a vital role in equal access to knowledge.","note":"把 vital 换成 important 也可以调节强度。"},{"id":"fn-19","kind":"function","group":"solution","en":"be responsible for","zh":"对……负责","pattern":"be responsible for + noun / doing","example":"Both governments and individuals are responsible for protecting the environment.","note":"适合明确责任主体。"},{"id":"fn-20","kind":"function","group":"solution","en":"invest in","zh":"投资于；投入","pattern":"invest in + noun","example":"Countries need to invest in renewable energy and public transport.","note":"多用于政府、企业、教育投入。"},{"id":"fn-21","kind":"function","group":"solution","en":"provide access to","zh":"提供获得……的机会","pattern":"provide access to + noun","example":"Schools should provide access to free mental health support.","note":"比 help students get 更正式。"},{"id":"fn-22","kind":"function","group":"solution","en":"raise awareness of","zh":"提高对……的意识","pattern":"raise awareness of + noun","example":"Campaigns can raise awareness of the risks of unhealthy eating.","note":"常和 public / environmental / health 搭配。"},{"id":"fn-23","kind":"function","group":"solution","en":"impose restrictions on","zh":"对……施加限制","pattern":"impose restrictions on + noun","example":"Some cities have imposed restrictions on private car use.","note":"适合讨论政府监管和公共政策。"},{"id":"fn-24","kind":"function","group":"solution","en":"give priority to","zh":"优先考虑","pattern":"give priority to + noun","example":"Policymakers should give priority to public health and education.","note":"后面接名词或动名词。"},{"id":"fn-25","kind":"function","group":"growth","en":"develop skills in","zh":"培养……方面的技能","pattern":"develop skills in + noun / doing","example":"Students can develop skills in communication and problem-solving.","note":"把 skills 换成 ability 时，介词通常也要调整。"},{"id":"fn-26","kind":"function","group":"growth","en":"gain experience in","zh":"获得……方面的经验","pattern":"gain experience in + noun / doing","example":"Young people gain experience in teamwork through volunteer work.","note":"适合个人经历和职业发展题。"},{"id":"fn-27","kind":"function","group":"growth","en":"broaden one's horizons","zh":"开阔某人的视野","pattern":"broaden one's horizons","example":"Studying abroad can broaden one's horizons and increase cultural awareness.","note":"注意 one's 要随主语变化。"},{"id":"fn-28","kind":"function","group":"growth","en":"have the opportunity to","zh":"有机会做……","pattern":"have the opportunity to + verb","example":"Many workers now have the opportunity to work remotely.","note":"比 can 更正式，适合描述机会。"},{"id":"fn-29","kind":"function","group":"growth","en":"be equipped with","zh":"具备；配备有","pattern":"be equipped with + noun","example":"Graduates should be equipped with practical skills for the job market.","note":"常接 skills、knowledge、tools。"},{"id":"fn-30","kind":"function","group":"growth","en":"foster a sense of","zh":"培养……感","pattern":"foster a sense of + noun","example":"Team sports can foster a sense of belonging among teenagers.","note":"后面常接 belonging、responsibility、community。"},{"id":"fn-31","kind":"function","group":"growth","en":"build self-confidence","zh":"建立自信","pattern":"build self-confidence","example":"Public speaking helps students build self-confidence.","note":"可以换成 boost / develop self-confidence。"},{"id":"fn-32","kind":"function","group":"growth","en":"reach one's full potential","zh":"发挥全部潜力","pattern":"reach one's full potential","example":"Education should help every child reach their full potential.","note":"主语是人时比 achieve success 更具体。"},{"id":"fn-33","kind":"function","group":"relation","en":"rely on","zh":"依赖；依靠","pattern":"rely on + noun","example":"Modern societies rely on reliable public services.","note":"强调必要性，后接名词或代词的宾格。"},{"id":"fn-34","kind":"function","group":"relation","en":"depend on","zh":"取决于；依赖于","pattern":"depend on + noun","example":"The success of the policy depends on public cooperation.","note":"既可以表示依赖，也可以表示取决于。"},{"id":"fn-35","kind":"function","group":"relation","en":"benefit from","zh":"从……中受益","pattern":"benefit from + noun / doing","example":"Small businesses can benefit from lower taxes.","note":"主语通常是受益的一方。"},{"id":"fn-36","kind":"function","group":"relation","en":"be exposed to","zh":"接触到；暴露于","pattern":"be exposed to + noun","example":"Children are exposed to advertising from an early age.","note":"可接 media、risk、language、pressure。"},{"id":"fn-37","kind":"function","group":"relation","en":"be associated with","zh":"与……相关","pattern":"be associated with + noun","example":"A sedentary lifestyle is associated with heart disease.","note":"学术写作中比 related to 更正式。"},{"id":"fn-38","kind":"function","group":"relation","en":"have access to","zh":"能够获得；有机会使用","pattern":"have access to + noun","example":"Everyone should have access to clean water and basic healthcare.","note":"适合公共资源、教育、医疗等话题。"},{"id":"fn-39","kind":"function","group":"relation","en":"be vulnerable to","zh":"容易受到……影响","pattern":"be vulnerable to + noun","example":"Older people may be more vulnerable to online fraud.","note":"后面常接 disease、attack、pressure、exploitation。"},{"id":"fn-40","kind":"function","group":"relation","en":"be committed to","zh":"致力于；坚定投入","pattern":"be committed to + noun / doing","example":"The government should be committed to reducing social inequality.","note":"后面接动名词时用 doing。"},{"id":"fn-41","kind":"function","group":"trend","en":"a wide range of","zh":"广泛的；各种各样的","pattern":"a wide range of + plural noun","example":"Schools offer a wide range of after-class activities.","note":"后面接可数名词复数。"},{"id":"fn-42","kind":"function","group":"trend","en":"an increasing number of","zh":"越来越多的","pattern":"an increasing number of + plural noun","example":"An increasing number of people work from home.","note":"修饰可数名词复数。"},{"id":"fn-43","kind":"function","group":"trend","en":"to a large extent","zh":"在很大程度上","pattern":"to a large extent","example":"Public health depends to a large extent on daily habits.","note":"放在句首或句中都可以。"},{"id":"fn-44","kind":"function","group":"trend","en":"play an increasingly important role in","zh":"在……中发挥越来越重要的作用","pattern":"play an increasingly important role in + noun / doing","example":"Technology plays an increasingly important role in education.","note":"适合描述趋势和长期变化。"},{"id":"fn-45","kind":"function","group":"trend","en":"be more likely to","zh":"更可能做……","pattern":"be more likely to + verb","example":"Students who read regularly are more likely to write clearly.","note":"比较结构和概率表达都很自然。"},{"id":"fn-46","kind":"function","group":"trend","en":"have a tendency to","zh":"倾向于；往往会","pattern":"have a tendency to + verb","example":"People have a tendency to ignore long-term risks.","note":"比 often 更正式，适合分析行为趋势。"},{"id":"fn-47","kind":"function","group":"trend","en":"by no means","zh":"绝不；并不","pattern":"by no means","example":"Technology is by no means a replacement for teachers.","note":"放在 be 动词后或助动词前，语气较强。"},{"id":"fn-48","kind":"function","group":"trend","en":"on a large scale","zh":"大规模地","pattern":"on a large scale","example":"Recycling needs to be carried out on a large scale.","note":"常和 introduce、use、carry out 等动词搭配。"},{"id":"tp-01","kind":"topic","group":"education","en":"access to education","zh":"接受教育的机会","pattern":"have access to education","example":"Access to education should not depend on family income.","note":"可搭配 equal / free / universal access to education。"},{"id":"tp-02","kind":"topic","group":"education","en":"equal educational opportunities","zh":"平等的教育机会","pattern":"provide equal educational opportunities","example":"Governments should provide equal educational opportunities for all children.","note":"教育公平话题的高频搭配。"},{"id":"tp-03","kind":"topic","group":"education","en":"academic performance","zh":"学业表现","pattern":"improve academic performance","example":"Regular sleep can improve students' academic performance.","note":"常和 improve、affect、measure 搭配。"},{"id":"tp-04","kind":"topic","group":"education","en":"critical thinking skills","zh":"批判性思维能力","pattern":"develop critical thinking skills","example":"Discussion-based classes help students develop critical thinking skills.","note":"高等教育和课堂方式题的常用表达。"},{"id":"tp-05","kind":"topic","group":"technology","en":"technological advances","zh":"技术进步","pattern":"technological advances in","example":"Technological advances have changed the way people communicate.","note":"可搭配 rapid / recent / major technological advances。"},{"id":"tp-06","kind":"topic","group":"technology","en":"the digital divide","zh":"数字鸿沟","pattern":"bridge the digital divide","example":"Free internet access can help bridge the digital divide.","note":"适合讨论网络、设备和教育公平。"},{"id":"tp-07","kind":"topic","group":"technology","en":"data privacy","zh":"数据隐私","pattern":"protect data privacy","example":"Companies should do more to protect users' data privacy.","note":"常和 online platforms、social media 搭配。"},{"id":"tp-08","kind":"topic","group":"technology","en":"online safety","zh":"网络安全","pattern":"improve online safety","example":"Schools should teach children about online safety.","note":"可以和 digital literacy 一起使用。"},{"id":"tp-09","kind":"topic","group":"environment","en":"carbon emissions","zh":"碳排放","pattern":"reduce carbon emissions","example":"Public transport can help reduce carbon emissions in cities.","note":"常和 cut、reduce、lower 搭配。"},{"id":"tp-10","kind":"topic","group":"environment","en":"renewable energy","zh":"可再生能源","pattern":"invest in renewable energy","example":"Governments should invest more in renewable energy.","note":"包括 solar、wind、hydroelectric 等形式。"},{"id":"tp-11","kind":"topic","group":"environment","en":"natural habitats","zh":"自然栖息地","pattern":"protect natural habitats","example":"Building new roads can destroy natural habitats.","note":"野生动物保护话题常见。"},{"id":"tp-12","kind":"topic","group":"environment","en":"environmental sustainability","zh":"环境可持续性","pattern":"promote environmental sustainability","example":"Long-term planning is essential for environmental sustainability.","note":"适合结尾总结长期目标。"},{"id":"tp-13","kind":"topic","group":"health","en":"public health","zh":"公共卫生","pattern":"improve public health","example":"Clean water and sanitation are essential for public health.","note":"常和 protect、improve、risk 搭配。"},{"id":"tp-14","kind":"topic","group":"health","en":"mental well-being","zh":"心理健康与幸福感","pattern":"support mental well-being","example":"Flexible working can support employees' mental well-being.","note":"比 mental health 更强调积极状态。"},{"id":"tp-15","kind":"topic","group":"health","en":"sedentary lifestyle","zh":"久坐生活方式","pattern":"lead a sedentary lifestyle","example":"A sedentary lifestyle increases the risk of heart disease.","note":"常和 physical inactivity 一起出现。"},{"id":"tp-16","kind":"topic","group":"health","en":"healthcare services","zh":"医疗服务","pattern":"provide healthcare services","example":"Rural areas need better healthcare services.","note":"可搭配 affordable / quality / accessible。"},{"id":"tp-17","kind":"topic","group":"work","en":"job opportunities","zh":"就业机会","pattern":"create job opportunities","example":"New industries can create job opportunities for young people.","note":"常和 create、provide、expand 搭配。"},{"id":"tp-18","kind":"topic","group":"work","en":"work-life balance","zh":"工作与生活平衡","pattern":"maintain work-life balance","example":"Flexible hours can help employees maintain work-life balance.","note":"常和 improve、achieve、damage 搭配。"},{"id":"tp-19","kind":"topic","group":"work","en":"career prospects","zh":"职业前景","pattern":"improve career prospects","example":"Practical experience can improve graduates' career prospects.","note":"适合就业和教育题。"},{"id":"tp-20","kind":"topic","group":"work","en":"workplace productivity","zh":"职场生产力","pattern":"increase workplace productivity","example":"A healthy working environment can increase workplace productivity.","note":"常和 improve、reduce、measure 搭配。"},{"id":"tp-21","kind":"topic","group":"society","en":"social inequality","zh":"社会不平等","pattern":"reduce social inequality","example":"Education is one of the most effective ways to reduce social inequality.","note":"适合教育、税收、公共服务等话题。"},{"id":"tp-22","kind":"topic","group":"society","en":"public services","zh":"公共服务","pattern":"provide public services","example":"Governments should provide reliable public services for everyone.","note":"常和 fund、improve、access 搭配。"},{"id":"tp-23","kind":"topic","group":"society","en":"cultural exchange","zh":"文化交流","pattern":"promote cultural exchange","example":"International events can promote cultural exchange.","note":"适合旅行、留学、体育赛事等话题。"},{"id":"tp-24","kind":"topic","group":"society","en":"social cohesion","zh":"社会凝聚力","pattern":"strengthen social cohesion","example":"Shared public spaces can strengthen social cohesion.","note":"常用于讨论社区、公平和社会稳定。"}];
var GROUPS={"effect":{"name":"因果与影响","desc":"解释原因、结果和影响"},"evaluate":{"name":"利弊与比较","desc":"比较利弊、表达平衡观点"},"solution":{"name":"措施与责任","desc":"提出建议、说明责任和行动"},"growth":{"name":"能力与发展","desc":"描述学习、成长和个人发展"},"relation":{"name":"关系与依赖","desc":"表达依赖、关联和受影响"},"trend":{"name":"程度与趋势","desc":"描述趋势、程度和可能性"},"education":{"name":"教育","desc":"教育场景常用词伙"},"technology":{"name":"科技","desc":"科技场景常用词伙"},"environment":{"name":"环境","desc":"环境场景常用词伙"},"health":{"name":"健康","desc":"健康场景常用词伙"},"work":{"name":"工作","desc":"工作场景常用词伙"},"society":{"name":"社会","desc":"社会场景常用词伙"}};
var KEY="pte_we_collocations_v1";
var MODE="review", QUEUE=[], QI=0, SEARCH="";
var INTERVALS=[1,3,7,14,30];
function esc(s){return String(s||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function today(){var d=new Date();return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
var P=load();
function save(){localStorage.setItem(KEY,JSON.stringify(P))}
function state(id){if(!P[id])P[id]={level:0,due:today(),last:""};return P[id]}
function groupName(id){return GROUPS[id]?GROUPS[id].name:id}
function itemById(id){return DATA.find(function(x){return x.id===id})}
function hasProgress(x){return !!(P[x.id]&&P[x.id].last)}
function isDue(x){var s=P[x.id];return hasProgress(x)&&s.due<=today()}
function isMastered(x){var s=P[x.id];return !!s&&s.level>=4}
function isLearning(x){var s=P[x.id];return !!s&&s.level>0&&s.level<4}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function groupsFor(kind){return Object.keys(GROUPS).filter(function(g){return DATA.some(function(x){return x.group===g&&x.kind===kind})})}
function groupItems(g){return DATA.filter(function(x){return x.group===g})}
function counts(){var due=DATA.filter(isDue).length,n=DATA.filter(function(x){return !hasProgress(x)}).length,learning=DATA.filter(isLearning).length,mastered=DATA.filter(isMastered).length;return {due:due,n:n,learning:learning,mastered:mastered}}
function reviewQueue(){var due=DATA.filter(isDue).sort(function(a,b){return (P[a.id].due||"").localeCompare(P[b.id].due||"")});var fresh=shuffle(DATA.filter(function(x){return !hasProgress(x)}));return due.concat(fresh).slice(0,10)}
function mark(id,result){var s=state(id);if(result==="again"){s.level=0;s.due=addDays(1)}else{var step=result==="easy"?2:1;s.level=Math.min(4,(s.level||0)+step);var idx=Math.min(s.level,INTERVALS.length-1);s.due=addDays(INTERVALS[idx])}s.last=today();save()}
function renderStats(){var c=counts();return '<div class="stats"><div class="stat"><div class="num">'+c.due+'</div><div class="lbl">待复习</div></div><div class="stat"><div class="num">'+c.n+'</div><div class="lbl">新词</div></div><div class="stat"><div class="num">'+c.learning+'</div><div class="lbl">学习中</div></div><div class="stat"><div class="num">'+c.mastered+'</div><div class="lbl">已掌握</div></div></div>'}
function renderList(items){return items.map(function(x){return '<div class="listItem"><div class="en">'+esc(x.en)+'</div><div class="zh">'+esc(x.zh)+' · '+esc(x.pattern)+'</div><div class="ex">'+esc(x.example)+'</div></div>'}).join("")}
function renderGroups(kind){var html="";groupsFor(kind).forEach(function(g){var all=groupItems(g);var mastered=all.filter(isMastered).length;html+='<div class="group" data-g="'+g+'"><div><div class="gname">'+esc(GROUPS[g].name)+'</div><div class="gdesc">'+esc(GROUPS[g].desc)+'</div></div><div class="gcount">'+mastered+' / '+all.length+'</div></div>'});return html}
function renderReview(){var q=reviewQueue();var c=counts();return renderStats()+'<div class="panel"><h2>今天练 10 个词伙</h2><p>待复习 '+c.due+' 个，新词 '+c.n+' 个。复习完成后，下次会根据掌握程度在 1、3、7、14 或 30 天后出现。</p></div><button class="primary" id="startReview">开始今日复习</button>'}
function renderStudy(){if(!QUEUE.length){return renderReview()}var x=QUEUE[QI];var html='<span class="back" id="back">← 返回</span><div class="study"><div><span class="tag">'+esc(groupName(x.group))+'</span><span class="tag">'+(x.kind==="function"?"功能词伙":"主题词伙")+'</span></div><div class="prompt">'+esc(x.zh)+'</div><div class="pattern">'+esc(x.pattern)+'</div><div class="answer" id="answer"><div class="phrase">'+esc(x.en)+'</div><div class="example">'+esc(x.example)+'</div><div class="note">'+esc(x.note||"")+'</div></div><button class="ghost" id="showAnswer" style="margin-top:12px">显示答案</button><div class="marks" id="marks" style="display:none"><button class="again" data-r="again">还要练</button><button class="good" data-r="good">记住了</button><button class="easy" data-r="easy">很熟</button></div></div><div class="stats" style="margin-top:12px"><div class="stat"><div class="num">'+(QI+1)+'</div><div class="lbl">当前</div></div><div class="stat"><div class="num">'+QUEUE.length+'</div><div class="lbl">本轮</div></div><div class="stat"><div class="num">'+counts().mastered+'</div><div class="lbl">已掌握</div></div></div>';return html}
function render(){var app=document.getElementById("app");var html="";if(MODE==="study")html=renderStudy();else if(MODE==="function")html=renderGroups("function");else if(MODE==="topic")html=renderGroups("topic");else if(MODE==="all")html='<input class="search" id="search" placeholder="搜索英文、中文或例句" value="'+esc(SEARCH)+'"><div id="allList">'+renderList(DATA.filter(function(x){var k=SEARCH.toLowerCase();return !k||(x.en+" "+x.zh+" "+x.example+" "+groupName(x.group)).toLowerCase().indexOf(k)>=0}))+'</div>';else html=renderReview();app.innerHTML=html;bind()}
function bind(){var back=document.getElementById("back");if(back)back.onclick=function(){MODE="review";QI=0;QUEUE=[];render()};var start=document.getElementById("startReview");if(start)start.onclick=function(){QUEUE=reviewQueue();QI=0;MODE="study";render()};var search=document.getElementById("search");if(search)search.oninput=function(){SEARCH=this.value;render();document.getElementById("search").focus()};document.querySelectorAll(".group").forEach(function(el){el.onclick=function(){QUEUE=shuffle(groupItems(el.dataset.g)).slice(0,10);QI=0;MODE="study";render()}});var show=document.getElementById("showAnswer");if(show)show.onclick=function(){document.getElementById("answer").classList.add("on");document.getElementById("marks").style.display="grid"};document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){mark(QUEUE[QI].id,b.dataset.r);QI++;if(QI>=QUEUE.length){MODE="review";QI=0;QUEUE=[]}render()}})}
document.getElementById("tabs").onclick=function(e){if(e.target.tagName!=="BUTTON")return;MODE=e.target.dataset.m;QI=0;QUEUE=[];document.querySelectorAll(".tabs button").forEach(function(b){b.className=b.dataset.m===MODE?"on":""});render()};
render();
</script></body></html>
