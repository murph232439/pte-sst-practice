var CUR=null,ORDER=[],IDX=0,SCORE=0,ANSWERED=false,AUDIO=null;
var SPRITE_URL='audio/sst/phrases.m4a';
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function normalize(s){return String(s||'').replace(/[’‘]/g,"'").toLowerCase().replace(/[^a-z0-9']+/g,' ').replace(/\s+/g,' ').trim()}
function tokens(s){return normalize(s).split(' ').filter(Boolean)}
function lcs(a,b){var row=new Array(b.length+1).fill(0);for(var i=1;i<=a.length;i++){var prev=0;for(var j=1;j<=b.length;j++){var old=row[j];row[j]=a[i-1]===b[j-1]?prev+1:Math.max(row[j],row[j-1]);prev=old}}return row[b.length]}
function list(filter){
  filter=(filter||'').toLowerCase();
  var rows=DATA.filter(function(x){return !filter||x.name.toLowerCase().indexOf(filter)>=0});
  document.getElementById('list').innerHTML=rows.map(function(x){
    return '<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">'+x.phrases.length+' 个原文词组</div></div><div class="go">开始 →</div></div>';
  }).join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到题目</div>';
}
function fallbackSpeech(rate,text){
  if(!window.speechSynthesis){alert('音频加载失败，请检查网络后重试');return}
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=rate||0.85;
  window.speechSynthesis.speak(u);
}
function stopAudio(){if(AUDIO){try{AUDIO.pause()}catch(e){}}if(window.speechSynthesis)window.speechSynthesis.cancel()}
function prepareAudio(){
  if(!AUDIO){AUDIO=new Audio(SPRITE_URL);AUDIO.preload='auto';AUDIO.load()}
  return AUDIO;
}
function speak(rate){
  var p=ORDER[IDX];if(!p)return;
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  var audio=prepareAudio();
  function playRange(){
    try{audio.pause()}catch(e){}
    audio.currentTime=p.start;
    audio.playbackRate=rate||0.9;
    audio.ontimeupdate=function(){if(audio.currentTime>=p.end){audio.pause();audio.ontimeupdate=null}};
    var promise=audio.play();
    if(promise&&promise.catch)promise.catch(function(){fallbackSpeech(rate,p.en)});
  }
  if(audio.readyState>=1)playRange();
  else audio.addEventListener('loadedmetadata',playRange,{once:true});
}
function openItem(id){
  stopAudio();
  prepareAudio();
  CUR=DATA.find(function(x){return x.id===id});
  if(!CUR)return;
  ORDER=CUR.phrases.slice().sort(function(){return Math.random()-.5});
  IDX=0;SCORE=0;renderQuestion();
}
function renderQuestion(){
  var p=ORDER[IDX];
  if(!p){renderSummary();return}
  ANSWERED=false;
  document.getElementById('list').innerHTML='<span class="back" id="back">← 返回题目</span>'+
  '<div class="panel"><div class="ptitle">'+esc(CUR.name)+'</div><div class="counter">第 '+(IDX+1)+' / '+ORDER.length+' 个词组 · 已答对 '+SCORE+' 个</div>'+
  '<div class="playRow"><button class="btn" id="play">播放词组</button><button class="btn ghost" id="slow">慢速播放</button></div>'+
  '<input class="answer" id="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="听到什么，就输入什么">'+
  '<div class="actions"><button class="btn" id="check">检查</button><button class="btn ghost" id="next" disabled>下一个</button></div>'+
  '<div class="fb" id="fb"></div></div>';
  document.getElementById('back').onclick=function(){stopAudio();list(document.getElementById('q').value)};
  document.getElementById('play').onclick=function(){speak(.9)};
  document.getElementById('slow').onclick=function(){speak(.65)};
  document.getElementById('check').onclick=check;
  document.getElementById('next').onclick=next;
  document.getElementById('answer').addEventListener('keydown',function(e){if(e.key==='Enter'){if(ANSWERED)next();else check()}});
  document.getElementById('answer').focus();
}
function check(){
  if(ANSWERED)return;
  var user=document.getElementById('answer').value;
  if(!normalize(user)){document.getElementById('answer').focus();return}
  ANSWERED=true;
  var p=ORDER[IDX],a=tokens(user),b=tokens(p.en);
  var same=normalize(user)===normalize(p.en);
  var common=lcs(a,b),ratio=(a.length+b.length)?(2*common/(a.length+b.length)):0;
  var fb=document.getElementById('fb');
  var cls=same?'good':ratio>=.72?'warn':'bad';
  if(same||ratio>=.9)SCORE++;
  fb.className='fb on '+cls;
  fb.innerHTML='<div class="label">'+(same?'完全正确':ratio>=.72?'很接近，再核对细小拼写':'先看正确词组')+'</div><div class="correct">'+esc(p.en)+'</div><div class="zh">'+esc(p.zh)+'</div>';
  document.getElementById('next').disabled=false;
  document.getElementById('next').focus();
}
function next(){
  if(!ANSWERED)return;
  stopAudio();
  IDX++;
  if(IDX>=ORDER.length)renderSummary();else renderQuestion();
}
function renderSummary(){
  var pct=Math.round(SCORE/ORDER.length*100);
  document.getElementById('list').innerHTML='<span class="back" id="back">← 返回题目</span><div class="panel summary"><div class="counter">'+esc(CUR.name)+'</div><div class="score">'+SCORE+' / '+ORDER.length+'</div><div class="counter">正确率 '+pct+'%</div><div class="actions" style="justify-content:center"><button class="btn" id="again">再练一遍</button><button class="btn ghost" id="back2">返回题目</button></div></div>';
  document.getElementById('again').onclick=function(){openItem(CUR.id)};
  document.getElementById('back2').onclick=function(){stopAudio();list(document.getElementById('q').value)};
}
document.getElementById('q').oninput=function(){list(this.value)};
document.getElementById('list').onclick=function(e){var c=e.target.closest?e.target.closest('.card'):null;if(c)openItem(+c.dataset.id)};
if(window.speechSynthesis)window.speechSynthesis.onvoiceschanged=function(){};
list('');
</script></body></html>
