of the fact that museums are centrally interested and defined by their collections. I should say that is not an uncontested view of museums but it is certainly my view of museums. Curators try to understand material culture as evidence of other people’s lives as a means to try to understand other people - what they look like, what they did, how they made a living, what they hoped for in their lives, how they tried to construct their world and why they made particular choices. —— One way in which curators differ from other historians is therefore in terms of how we interrogate the past, what elements we use to communicate the past. Most academic historians are trained very much in the discipline of words and they concentrate on words still today, although it is changing a little bit. If you go through university history primarily you are encouraged to draw on things like archival accounts, manuscripts and now oral histories, and most of that work is actually promulgated in the form of books. There are also other kinds of historians. Obviously, filmmakers and photographers concentrate on creating images of the world and arranging them in meaningful sequences, but curators attend to objects. We look at objects as evidence of the past and try to arrange objects in meaningful ways called exhibitions.", "ref": "This topic is about practices, techniques and methods of curators. Museums are good at creating and communicating history where museums are defined by their collections. Curators understand material culture as evidence of people&#39;s life to understand people. Curators are different from other historians. Academic historians concentrated on words and photographers concentrate on images, while curators deal with objects that are evidence of the past. They arrange objects into exhibitions.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693067/a6f38701ceaa4203ace15d85bcaab75e.mp3", "phrases2": [{"en": "what I do as a curator", "zh": "我作为策展人的工作"}, {"en": "curatorial practices, tools and methods", "zh": "策展实践、工具和方法"}, {"en": "museums create a particular kind of history", "zh": "博物馆创造一种特殊的历史"}, {"en": "defined by their collections", "zh": "由他们的藏品定义"}, {"en": "curators understand material culture", "zh": "策展人理解物质文化"}, {"en": "how curators differ from other historians", "zh": "策展人如何区别于其他历史学家"}, {"en": "academic historians concentrate on words", "zh": "学术历史学家专注文字"}, {"en": "curators attend to objects in exhibitions", "zh": "策展人关注展览中的物品"}]}], "rl": [{"id": 1568, "name": "Double pendulum", "phrases": ["the chaos physics equation", "a double pendulum", "coupled differential equations", "the equation", "the pendulum bob", "the initial angles", "the double pendulum intriguing", "initial conditions", "the smallest deviation", "the starting position"], "eng": "The chaos physics equation for a double pendulum is a fascinating topic that explores the intricate dynamics of this system. The equation involves a set of coupled differential equations that describe the motion of the two linked pendulums. Factors such as the length of each arm, the mass of the pendulum bob, and the initial angles of displacement all contribute to the complexity of the equation. What makes the double pendulum intriguing is its sensitivity to initial conditions. Even the smallest deviation in the starting position or velocity can lead to drastically different outcomes. This phenomenon, commonly known as the butterfly effect, highlights the chaotic nature of the double pendulum's motion. The chaos physics equation for the double pendulum has practical relevance in various fields, such as robotics and physics education. Researchers use computer simulations and physical models to experiment with this system, gaining insights into its nonlinear behavior. In conclusion, the chaos physics equation for the double pendulum showcases the complexity and unpredictability of its motion. This system serves as an intriguing example of chaos theory, reminding us of the intricate dynamics hidden within seemingly simple physical systems.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658427/2b4947078d7e4ecca968da81ed05e6dc.mp3\"></audio></div><br />The chaos physics equation for a double pendulum explores the unpredictability and complexity of its motion. Even minor differences in initial conditions can lead to significant variations in behavior, known as the butterfly effect. Researchers use computer simulations and physical models to study this system, gaining insights into its nonlinear dynamics. The double pendulum serves as an intriguing example of chaos theory and highlights the intricate dynamics of seemingly simple physical systems.<br />双摆的混沌物理方程探讨了其运动的不可预测性和复杂性。即使初始条件存在微小差异，也会导致行为上的显著变化，这种现象被称为&ldquo;蝴蝶效应&rdquo;。研究人员通过计算机模拟和物理模型来研究这一系统，从而深入了解其非线性动力学特性。双摆是混沌理论的一个引人入胜的例子，它揭示了看似简单的物理系统所具有的复杂动力学行为。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658427/5d8f2912274c4f4b8d02d506016825e9.mp3", "phrases2": [{"en": "the chaos physics equation", "zh": ""}, {"en": "a double pendulum", "zh": ""}, {"en": "coupled differential equations", "zh": ""}, {"en": "the equation", "zh": ""}, {"en": "the pendulum bob", "zh": ""}, {"en": "the initial angles", "zh": ""}, {"en": "the double pendulum intriguing", "zh": ""}, {"en": "initial conditions", "zh": ""}, {"en": "the smallest deviation", "zh": ""}, {"en": "the starting position", "zh": ""}]}, {"id": 1569, "name": "Leadership", "phrases": ["an executive order", "an interesting idea", "the coercive threat", "quiet persuasion", "martin Luther King Jr", "a charismatic leader", "the power", "the leader wields", "a spectrum", "the United States"], "eng": "A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. · · We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\"; more often, however, top leaders have been quite visible in their exercise of power. · “ ” Women (as well as some men) have provided casual, low-key leadership behind the scenes. But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678142/d4abd4be242542e2bbb883d39b51f7a8.mp3\"></audio></div><br />The lecture mainly talks about leaders. Firstly, a leader can define goals and mobilize people&#39;s energies. Secondly, we can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. Thirdly, authoritative leadership has generally been exhibited by men. Finally, women have provided casual, low-key leadership behind the scenes, but this pattern has been changing.<br />这一讲座主要讲述了领导者。首先，领导者可以定义目标并调动人们的精力。其次，我们可以将领导力视为一个谱系，既包括领导者的可见性，也包括领导者所拥有的权力。第三，权威型领导角色长期由男性担任。最后，女性一直在幕后提供非正式、低调的领导力，但这种传统格局正在发生转变。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678142/53e49702dca24eee846ba436449246b6.mp3", "phrases2": [{"en": "an executive order", "zh": ""}, {"en": "an interesting idea", "zh": ""}, {"en": "the coercive threat", "zh": ""}, {"en": "quiet persuasion", "zh": ""}, {"en": "martin Luther King Jr", "zh": ""}, {"en": "a charismatic leader", "zh": ""}, {"en": "the power", "zh": ""}, {"en": "the leader wields", "zh": ""}, {"en": "a spectrum", "zh": ""}, {"en": "the United States", "zh": ""}]}, {"id": 1570, "name": "Globalization", "phrases": ["the world", "40 years", "a remote village", "a global pandemic", "the global economic system", "thirty years", "the miracle", "the planet", "bad stuff", "the stuff"], "eng": "I've been thinking a lot about the world recently and how it's changed over the last 20, 30, 40 years. 20 30 40 Twenty or thirty years ago, if a chicken caught a cold and sneezed and died in a remote village in East Asia, it would have been a tragedy for the chicken and its closest relatives, but I don't think there was much possibility of us fearing a global pandemic and the deaths of millions. Twenty or thirty years ago, if a bank in North America lent too much money to some people who couldn't afford to pay it back and the bank went bust, that was bad for the lender and bad for the borrower, but we didn't imagine it would bring the global economic system to its knees for nearly a decade. This is globalization. This is the miracle that has enabled us to transship our bodies and our minds and our words and our pictures and our ideas and our teaching and our learning around the planet ever faster and ever cheaper. It's brought a lot of bad stuff, like the stuff that I just described, but it's also brought a lot of good stuff. A lot of us are not aware of the extraordinary successes of the Millennium Development Goals, several of which have achieved their targets long before the due date. That proves that this species of humanity is capable of achieving extraordinary progress if it really acts together and it really tries hard.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678143/6e9352ed403446edb32ac4e5079dcc81.mp3\"></audio></div><br />This is globalization about the example of chicken died and bank bust. This is the miracle enabled us to transship our bodies and our minds around the planet ever faster and ever cheaper. There is a lot of bad stuff and good stuff. A lot of extraordinary successes of the Millennium Development Goals. Humanity is capable of achieving extraordinary progress if acts together and tries hard.<br />这一讲座讲述了全球化的例子，包括鸡的死亡和银行的破产。全球化是一个奇迹，使我们能够以更快、更经济的方式将我们的身体和思想传递到地球的各个角落。全球化既带来了许多坏事，也伴随着许多好事。千年发展目标取得了许多非凡的成就。人类如果共同努力、全力以赴，完全有能力取得非凡的进展。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678143/1640b3caebe340d3a589b857864c3bf5.mp3", "phrases2": [{"en": "the world", "zh": ""}, {"en": "40 years", "zh": ""}, {"en": "a remote village", "zh": ""}, {"en": "a global pandemic", "zh": ""}, {"en": "the global economic system", "zh": ""}, {"en": "thirty years", "zh": ""}, {"en": "the miracle", "zh": ""}, {"en": "the planet", "zh": ""}, {"en": "bad stuff", "zh": ""}, {"en": "the stuff", "zh": ""}]}, {"id": 1571, "name": "Measuring food", "phrases": ["clinical weight-loss", "portion size", "real-world settings", "good way", "some scales", "objective way", "hands-on approach", "primary school maths", "the dimensions", "the geometric volume formulas"], "eng": "I'm a dietitian and I work in clinical weight-loss recently. Accurately estimating portion size is critical in research or real-world settings. For example, if you're trying to watch your weight and you're out to dinner and you're presented with a bowl of food, there's no really good way to actually estimate how much you're eating unless you're gonna whip some scales out of your bag. So we wanted to find a more objective way for people to quantify what they're eating when they're out and about. I came up with a more hands-on approach. We got people to measure the dimensions of the food using the width of their fingers and remembering back to primary school maths. We use the geometric volume formulas to estimate the weight of the food. To show you how this works, I've ordered a piece of lasagna. And that's my box, a glass of wine and that's my cylinder. —— And I'm feeling pretty healthy, so I order some watermelon for dessert. And that's my wedge. So this was I know it's seven by five, by four fingers. In the future, I see this method be incorporated into smartphone applications. So you put your finger, it's in along with your height and your weight. And the app will do all of the calculations for you. And then you've got a more accurate way to estimate the portion size.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678144/1163c8dfa5fb4e829bee66d3a99b7666.mp3\"></audio></div><br />This lecture talks about accurately estimating portion size. Firstly, the speaker works in clinical weight-loss as a dietitian and thinks accurately estimating portion size is critical because there&rsquo;s no good way to measure food when dinning out. Secondly, the speaker mentions a more objective way to quantify food: using the width of fingers to measure the dimensions of food. Thirdly, the speaker mentions smartphone applications that will do all the calculations to make a more accurate estimation. In conclusion, fingers and apps can help estimate the portion size in the future.<br />这一讲座讨论了如何准确估算食物份量。首先，讲者作为一名临床减肥的营养师，认为准确估算食物份量至关重要，因为外出就餐时没有一个好的方法来衡量食物的量。其次，讲者提到了一种更客观的量化食物的方法：利用手指宽度作为测量单位来测量食物的尺寸。第三，讲者还提到了智能手机应用程序，这些应用程序在未来能够配合手指做出所有计算，从而提供更准确的估算。总之，在未来，人们可以利用手指和应用程序估算食物份量。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678144/1163c8dfa5fb4e829bee66d3a99b7666.mp3", "phrases2": [{"en": "clinical weight-loss", "zh": ""}, {"en": "portion size", "zh": ""}, {"en": "real-world settings", "zh": ""}, {"en": "good way", "zh": ""}, {"en": "some scales", "zh": ""}, {"en": "objective way", "zh": ""}, {"en": "hands-on approach", "zh": ""}, {"en": "primary school maths", "zh": ""}, {"en": "the dimensions", "zh": ""}, {"en": "the geometric volume formulas", "zh": ""}]}, {"id": 1572, "name": "Innovation and invention", "phrases": ["innovation equals invention", "the same thing", "innovation equals", "the world", "some great satisfaction", "an invention", "a technology", "innovation equals invention times commercialization", "a new idea", "innovation something"], "eng": "He says innovation equals invention. Let me just stop here. Innovation equals invention often people mistake these two things for the same thing. Innovation equals invention, they are not. Innovation is something that generates value for the world. It makes something faster, better, cheaper. It gives someone some great satisfaction. An invention is an idea, a technology, a patent. In and of itself, it does not generate value. So these two are not the same thing. And sometimes you see them interchange. And that's not correct. So innovation equals invention times commercialization. So and when we look at this equation of innovation something of value, it requires a new idea and then it requires someone or some organization that is going to commercialize that idea and to make it a value to the world. ——", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678146/d41dbd6cbbff49289eae21b09d395a4e.mp3\"></audio></div><br />This lecture talks about the relationship between innovation and invention. Firstly, the speaker mentions that people think innovation equals invention but it&rsquo;s not correct. Secondly, the speaker mentions that innovation generates value for the world and gives people satisfaction, but the invention is an idea that does not generate value. Thirdly, the speaker mentions that innovation equals invention times commercialization. In conclusion, innovation equals to commercializing a new idea to make value.<br />这一讲座讨论了创新与发明之间的关系。首先，讲者提到人们认为创新等同于发明，但这是不正确的。其次，讲者提到创新为世界创造了价值并带给人们满足感，而发明本身只是一个没有产生价值的想法。第三，讲者提到创新等于发明乘以商业化。总的来说，创新是发明与商业化的结合，从而创造价值。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678146/d41dbd6cbbff49289eae21b09d395a4e.mp3", "phrases2": [{"en": "innovation equals invention", "zh": ""}, {"en": "the same thing", "zh": ""}, {"en": "innovation equals", "zh": ""}, {"en": "the world", "zh": ""}, {"en": "some great satisfaction", "zh": ""}, {"en": "an invention", "zh": ""}, {"en": "a technology", "zh": ""}, {"en": "innovation equals invention times commercialization", "zh": ""}, {"en": "a new idea", "zh": ""}, {"en": "innovation something", "zh": ""}]}, {"id": 1573, "name": "Three types of questionnaires", "phrases": ["the steps", "own questionnaires", "a few terms", "three types", "level measurement", "category-type questions", "nominal questions", "ethnic origin", "ordinal-type questions", "category questions"], "eng": "What I've decided to provide is the steps that I take when analyzing my own questionnaires. However, before I begin, it would be useful to remind you of a few terms we use when talking about questionnaires. Questions can be divided into three types. This is sometimes called level measurement. Firstly, we have category-type questions, which are also known as nominal questions. These are when participants select from a list of categories for their response, such as male or female or they may include ethnic origin. Secondly, we have ordinal-type questions. These are similar to category questions. But instead of the categories being independent, there is some sort of order between them. If we ask people to indicate their age in categories, this is an ordinal type question. Thirdly, we have continuous questions. These are any questions that can be answered by a number. It could be an open-ended question asking participants to tell you how many times they attended lectures or how often they used a VLE. VLE Or it could involve asking them to rate the importance or intensity of some experience.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678147/18483b5ca1b44afca9357861ed80a405.mp3\"></audio></div><br />In the questionnaires, questions can be divided into three types, called level measurement. Firstly, we have category type questions. It means participants select from a list of categories for their response. Secondly, we have ordinal type questions. These are similar to category questions, but there is some sort of order between them. Thirdly, we have continuous questions. These are any questions that can be answered by a number.<br />在问卷调查中，问题可以分为三种类型，称为测量等级。首先，我们有类别型问题。这意味着参与者从一系列类别中选择他们的回答。其次，我们有顺序型问题。这些问题与类别型问题相似，但选项之间存在某种顺序关系。第三，我们有连续型问题。这些问题是任何可以通过数字回答的问题。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678147/c33aa756f07348dc84850d29451ee2d3.mp3", "phrases2": [{"en": "the steps", "zh": ""}, {"en": "own questionnaires", "zh": ""}, {"en": "a few terms", "zh": ""}, {"en": "three types", "zh": ""}, {"en": "level measurement", "zh": ""}, {"en": "category-type questions", "zh": ""}, {"en": "nominal questions", "zh": ""}, {"en": "ethnic origin", "zh": ""}, {"en": "ordinal-type questions", "zh": ""}, {"en": "category questions", "zh": ""}]}, {"id": 1574, "name": "Discovering the port of Roman London", "phrases": ["the port", "the historical records", "roman London", "the first century", "third century", "the late third century", "the fourth century", "the history", "the archaeological evidence", "the material evidence"], "eng": "But what we are going to discuss today is how the port of London was discovered and what we discovered about it. Now if you look at the historical records of Roman London, there is only about 14 actual references to London in antiquity and contemporary references. 14 And all those only one is in the first century, there are none at all at the second or third century. There is only one in the late third century and there are four in the fourth century. So if you are a historian trying to write the history of Roman London, it's really difficult. You don't have much data, you're going to depend on the archaeological evidence, the material evidence of the port and indeed the town to have any understanding of what happened then. And so, what we're looking at here is how did we discover about the port of London, there is no historical documentation, no customs books, no tariffs, no idea of the taxes. We have to understand the port entirely from the archaeological evidence. So that's what we are going to do today. So, if we move on to the next slide, I love live streaming. Thank you very much.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678148/f4cb7a84d1314f38a5c4228605e7bf11.mp3\"></audio></div><br />This lecture is about the historical records of Roman London. There are few records of its history in both antiquity and contemporary references. If the historian try to write the history of Roman London, it&#39;s really difficult because of the lack of data. And so, the port of London was discovered with no historical documentation, like custom books. We have to understand the port entirely from archaeological evidence.<br />这节讲座讲的是罗马时期伦敦的历史记录。无论是古代还是当时的文献资料，关于这段历史的记载都非常少。如果历史学家试图撰写罗马伦敦的历史，会非常困难，因为缺乏相关数据。因此，伦敦港口的发现就没有历史文献的记载，比如海关书籍。我们只能完全依靠考古证据来了解这个港口。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678148/b0873f2b92844c50b8b276a2e60bdbf2.mp3", "phrases2": [{"en": "the port", "zh": ""}, {"en": "the historical records", "zh": ""}, {"en": "roman London", "zh": ""}, {"en": "the first century", "zh": ""}, {"en": "third century", "zh": ""}, {"en": "the late third century", "zh": ""}, {"en": "the fourth century", "zh": ""}, {"en": "the history", "zh": ""}, {"en": "the archaeological evidence", "zh": ""}, {"en": "the material evidence", "zh": ""}]}, {"id": 1575, "name": "Licking and grooming", "phrases": ["the stress reactivity", "the study", "LG LG refers", "the level", "the experiment", "moderate stress reactivity", "the findings", "significant implications", "a nurturing", "an increased stress reactivity"], "eng": "The study explores the impact of maternal licking and grooming (LG) on the stress reactivity of adult rats. LG LG refers to the level of attention and care provided by mother rats to their offspring through licking and grooming behaviors. LG The experiment examined the effects of high and low levels of LG on the stress reactivity of the rats as they grow into adulthood. LG The findings reveal that high LG leads to a more moderate stress reactivity in the rats. LG This has significant implications as it suggests that a nurturing and attentive environment during infancy can potentially reduce the risk of poor development and diseases later in life. On the other hand, low LG results in an increased stress reactivity in the rats. LG This, in turn, elevates the risk for various health conditions such as heart disease, type II diabetes, alcoholism, affective disorders, and brain aging. Ⅱ These findings highlight the crucial role of maternal care and attention in shaping the stress response system in offspring. It demonstrates that early experiences and maternal care can have long-lasting effects on an individual's stress reactivity and overall health. This study underscores the importance of providing nurturing and supportive environments for infants to promote optimal development and reduce the risk of various health issues in adulthood.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658437/6d11b02bd0f04717b4f79c31725fd44f.mp3\"></audio></div><br />Differences in stress reactivity of adult rats are determined by maternal licking and grooming (LG) during infancy. L means licking and G means grooming.The experiment tested on high and low level of licking and grooming that mother rats give to their children, to test out its effect on the children&rsquo;s stress reactivity. High LG will bring modest stress reactivity, which can reduce the risk for poor development and diseases. Low LG will increase the stress reactivity, which can increase the risk for heart disease, type II diabetes, alcoholism, affective disorders and brain aging, etc.<br />这项实验探讨了母鼠在婴儿期舔舐和梳理（LG）对成年大鼠应激反应的影响。L代表舔舐，G代表梳理。实验测试了母鼠对幼鼠舔舐和梳理的高低水平，来检验这些行为对幼鼠应激反应的影响。高水平的舔舐和梳理（高LG）会导致温和的应激反应，这有助于降低发育不良和疾病的风险。低水平的舔舐和梳理（低LG）则会增加应激反应，从而增加罹患心脏病、Ⅱ型糖尿病、酗酒、情感障碍和大脑衰老等的风险。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658437/9d4e88b3ff544def9c2191c9eb1ed2b0.mp3", "phrases2": [{"en": "the stress reactivity", "zh": ""}, {"en": "the study", "zh": ""}, {"en": "LG LG refers", "zh": ""}, {"en": "the level", "zh": ""}, {"en": "the experiment", "zh": ""}, {"en": "moderate stress reactivity", "zh": ""}, {"en": "the findings", "zh": ""}, {"en": "significant implications", "zh": ""}, {"en": "a nurturing", "zh": ""}, {"en": "an increased stress reactivity", "zh": ""}]}, {"id": 1576, "name": "Politics and international relations", "phrases": ["an in-depth understanding", "the exciting disciplines", "the complex field", "the workings", "public policy", "public administration", "four compulsory units", "two majors", "a wide choice", "national security studies"], "eng": "This course provides students with an in-depth understanding of the exciting disciplines of politics and international relations. Students will learn about the workings of political institutions in countries around the world and explore the complex field of relations between nations. Topics in governance, public policy, public administration, national security and border control ensure that students receive a broad and current education in the range of issues which are covered under the label of politics and international relations. Students will undertake four compulsory units and two majors, one in politics and international relations and the other in governance and policy. They will also choose an elective major from a wide choice of options including political communication, international studies, international business and national security studies. In addition to acquiring specialist knowledge and competencies in Politics and International Relations and Commerce, students will graduate with a range of generic skills such as critical thinking, enhanced communication abilities, problem-solving and strong capacities to work with others. They will also develop ethically based and socially responsible attitudes and behaviors.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678149/3a3a0e730b7c46f987cd49b38bb460af.mp3\"></audio></div><br />The lecture is about the course. Students can have an understanding of the exciting disciplines of politics and international relations. The topics are covered under the label of politics and international relations. Students will undertake four compulsory units and two majors. They will also choose an elective major from a wide choice of options. Students will graduate with a range of generic skills. They will also develop ethically based and socially responsible attitudes and behaviors.<br />这一讲座讲述了课程内容。学生可以深入了解政治学和国际关系这一令人兴奋的学科。课程涵盖了政治学和国际关系的各个主题。学生将修读四门必修课程和两个主修课程，并从广泛的选项中选择一门选修主修课程。学生毕业时将具备一系列通用技能，并且培养以伦理为基础的社会责任感和行为。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678149/ea90fda305dc4116aabe237d49d1dd21.mp3", "phrases2": [{"en": "an in-depth understanding", "zh": ""}, {"en": "the exciting disciplines", "zh": ""}, {"en": "the complex field", "zh": ""}, {"en": "the workings", "zh": ""}, {"en": "public policy", "zh": ""}, {"en": "public administration", "zh": ""}, {"en": "four compulsory units", "zh": ""}, {"en": "two majors", "zh": ""}, {"en": "a wide choice", "zh": ""}, {"en": "national security studies", "zh": ""}]}, {"id": 1578, "name": "Technology erode privacy", "phrases": ["an informed debate", "a society", "a human right", "the Universal Declaration", "the physical world", "all kinds", "obscured glass", "the real world", "the privacy", "automatic number plate recognition"], "eng": "So that creates tensions and that's what I want to talk about. Because I think it’s important we are as a society able to have an informed debate about how much privacy is enough but not too much, how much security is enough but not too much. Privacy is a human right that simply quoting the Universal Declaration. In the physical world, we’ve got all kinds of protections. There is evidence that we care about our privacy: we’ve got doors, we’ve got obscured glass, we’ve got locks, we wear clothes, we put up shutters. And technology continues to erode the privacy that exists in the real world in the three spatial dimensions. Security cameras, automatic number plate recognition take away anonymity. Long lenses paparazzi take away distance and the privacy that used to create. And body scanners are increasingly being used to see through clothes, for example. This process isn’t going to slow down and the new quantum technologies are actually being able to do gravitational sensing and that’s advancing at a remarkable rate and you can’t shield gravity. So some of the new quantum technologies are able already to see through walls and will, and there are technologies also for seeing round corners now using scattered light from lasers. Technology continues to erode privacy.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678151/aa2cd8190cb84052a359f53a7987c7df.mp3\"></audio></div><br />This lecture is about tensions between technology and privacy and as a society we need to argue about the amount of privacy and security we have. Firstly, privacy is a human right, which we care about, and we have many protections. Secondly, however, technology continues to erode privacy in three spatial dimensions, including security cameras, long lenses and body scanners. Thirdly, this process won&rsquo;t slow down because of the quantum technologies. In conclusion, technology continues to erode our privacy.<br />这一讲座讨论了技术与隐私之间的紧张关系，作为一个社会，我们需要讨论我们拥有的隐私和安全的程度。首先，隐私是我们关心的人权，我们拥有许多保护措施。其次，然而，技术在三个空间维度上持续侵蚀隐私，包括监控摄像头、长焦镜头和身体扫描仪。第三，这一进程不会因量子技术而放缓。总结来说，技术继续侵蚀我们的隐私。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678151/41d4181bbe9246e8a6de1ab07b59d315.mp3", "phrases2": [{"en": "an informed debate", "zh": ""}, {"en": "a society", "zh": ""}, {"en": "a human right", "zh": ""}, {"en": "the Universal Declaration", "zh": ""}, {"en": "the physical world", "zh": ""}, {"en": "all kinds", "zh": ""}, {"en": "obscured glass", "zh": ""}, {"en": "the real world", "zh": ""}, {"en": "the privacy", "zh": ""}, {"en": "automatic number plate recognition", "zh": ""}]}, {"id": 1579, "name": "Tutorial", "phrases": ["a second year", "evie Carroll", "degree subject", "independent learning", "each tutorial", "a reading list", "each annals", "every tutorial", "15 students", "the tutorial"], "eng": "My name is Evie Carroll. Evie Carroll I’m a second year studying international business. My degree subject is made up of tutorials, lectures and independent learning. And today I’m going to speak about tutorials. Before each tutorial, we’re asked to prepare in advance. We’re usually given a reading list, which we have to complete before each tutorial. We are given websites to look at, each annals to look at and we have to prepare by writing our notes down. In every tutorial, there is about 5 to 15 students and these are led by the tutors which are usually masters or PhD students. 5 15 And then when we come into the tutorial we are put into small groups. I’m asked to discuss our ideas, generate new ideas and then feedback to the class. During our tutorials, there’s lots of support given. Our tutors are there so that we can ask questions at any time. We also have our peers there, to which we can also ask questions. If we need help before the tutorial, we can email any of the tutors and they’ll provide you with help. The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students whereas in tutorials are about 5 to 15 students, 200 300 5 15 which allows you to discuss matters, put your hands up and talk to your tutors about any difficulties you may have with a subject.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678152/7d3861af38f0465ca4f7b63514d66964.mp3\"></audio></div><br />The general topic of this lecture is about tutorials. Firstly, the speaker mentioned that students were asked to prepare tutorials in advance by giving them a reading list. Then the speaker said that students are led by tutors, who are usually master or PhD students. Finally, the speaker mentioned that the difference between lectures and tutorials is that the size of tutorial is relatively small, which is usually about 5 to 15 students.<br />这一讲座的主题关于辅导课。首先，讲者提到学生们被要求提前准备辅导课，通过提供阅读清单来进行准备。接着，讲者表示，辅导课是由导师带领的，通常导师是硕士或博士生。最后，讲者提到，讲座和辅导课的区别在于辅导课的规模相对较小，通常有5到15个学生。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678152/36c7598f05c344acab1231ff490628c4.mp3", "phrases2": [{"en": "a second year", "zh": ""}, {"en": "evie Carroll", "zh": ""}, {"en": "degree subject", "zh": ""}, {"en": "independent learning", "zh": ""}, {"en": "each tutorial", "zh": ""}, {"en": "a reading list", "zh": ""}, {"en": "each annals", "zh": ""}, {"en": "every tutorial", "zh": ""}, {"en": "15 students", "zh": ""}, {"en": "the tutorial", "zh": ""}]}, {"id": 1580, "name": "Biology", "phrases": ["first tutorial", "many different topics", "a whole bunch", "first video", "the first thing", "the definition", "the study", "a certain point", "all right", "the scientific definition"], "eng": "Welcome to your very first tutorial in biology. Now, in this video series what I want to do is I want to talk to you guys about many different topics concerning biology. For example, I want to talk to you guys about DNA and genetics in cells, in bacteria, in life and a whole bunch of interesting stuff. DNA But since this is the very first video, I think what we should do in this video is just stick with the very basics. And the first thing I want to do is talk to you guys about what is biology. So, let's go ahead and answer that question. And the definition of biology is this: the study of life in living organisms. All right, that makes sense up to a certain point up until organisms because you may have heard of organisms before. “ ” And you may have your own definition but the scientific definition of an organism is a living thing. Well, that's easy. We know what living things are. I'm a living thing, plants, grass is a living thing. My puppy named Old Dan, cutest puppy ever, by the way, is a living thing but whenever we talk about living things. Old Dan Believe it or not, things get rid of complicated because then you have to ask yourself 'what is life'. “ ” Well, of course, if you ask your grandma or your best friend or even if you ask a philosopher 'what is life', everyone is going to give you kind of a different definition of their outlook on life. “ ” However, whenever scientists and biologists were first deciding, you know what, what is life? That's the problem that they had everyone had their own separate definition of life itself. So, what they need to do before biology was even invented, which is of course the study of life, is scientists needed to agree on the definition of life.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678153/1dfeaa6eb6444a539fd39e8ee8d65f71.mp3\"></audio></div><br />The lecture is about biology. Firstly, the speaker talks about DNA and genetics in cells, in bacteria, and in other stuff. The speaker also talks about the definition of biology. That is the study of life in living organisms. Everyone has different ideas about what is life, for example, your grandma or your best friend or even a philosopher will have different answers. Therefore, in the study of life, scientists needed to agree on the definition of life.<br />这一讲座是关于生物学的。首先，讲者讨论了细胞中的DNA和遗传学，包括细菌以及其他生物体中的遗传物质。讲者还谈到了生物学的定义&mdash;&mdash;即研究生命和生物体。每个人对什么是生命有不同的看法，例如你的奶奶、最好的朋友，甚至一个哲学家都会给出不同的答案。因此，在研究生命时，科学家们需要就生命的定义达成共识。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678153/37052472409644a6a7e84b6b6affebbb.mp3", "phrases2": [{"en": "first tutorial", "zh": ""}, {"en": "many different topics", "zh": ""}, {"en": "a whole bunch", "zh": ""}, {"en": "first video", "zh": ""}, {"en": "the first thing", "zh": ""}, {"en": "the definition", "zh": ""}, {"en": "the study", "zh": ""}, {"en": "a certain point", "zh": ""}, {"en": "all right", "zh": ""}, {"en": "the scientific definition", "zh": ""}]}, {"id": 1581, "name": "London taxi drivers", "phrases": ["the Great Exhibition", "the world ’", "a great public outcry", "the London Authority", "a short walk", "penton Street", "all major taxi drivers", "the responsibility", "all taxi drivers", "the London knowledge"], "eng": "But we can really thank the Great Exhibition of 1851 for giving us the world’s premier taxi service, 1851 for it was going to this exhibition, and this fabulous exhibition inventions from all around the four corners of the Empire that the visitors were appalled, dismayed and vexed by their journeys to this exhibition because the cabbies of the day and their horse-drawn carts were absolutely terrible and could not find their way to this exhibition. And, so, a great public outcry, the London Authority sets up Public Carriage Office, which is an organization that still exists. And you can take a short walk to Penton Street up the road. Penton And this Public Carriage office took on the responsibility of licensing all major taxi drivers in London. All taxi drivers from 1851 onwards had to pass what is now known as the London knowledge, 1851 “ ” which is phenomenal knowledge of London. What is the London knowledge? It’s the ability to remember the 25,000 streets, have it all interconnected and all the main arterial roads in and out of London. 25,000 Cabbies need to know all this plus a thousand points of specific interest cafes, bars, public offices. They need to know them all as part of their training.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678154/56731de993cc4e9ca6eccac8b9b5fc7c.mp3\"></audio></div><br />The Great Exhibition of 1851 gives us the world&rsquo;s premier taxi service. The London Authority sets up Public Carriage Office and it still exists. London Knowledge is the ability to remember 25,000 streets and have them all interconnected within London. Cabbies also need to know things like cafes or bars that as they are parts of their training.<br />1851年的大博览会为我们带来了世界上最著名的出租车服务。伦敦当局设立了公共运输办公室，它至今仍然存在。伦敦知识是指能够记住伦敦25000条街道，并将它们互相连接起来的能力。出租车司机还需要了解像咖啡馆或酒吧这样的地点，这些也都是他们培训的一部分。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678154/fd98b116e0ae4412907f935f5bf14581.mp3", "phrases2": [{"en": "the Great Exhibition", "zh": ""}, {"en": "the world ’", "zh": ""}, {"en": "a great public outcry", "zh": ""}, {"en": "the London Authority", "zh": ""}, {"en": "a short walk", "zh": ""}, {"en": "penton Street", "zh": ""}, {"en": "all major taxi drivers", "zh": ""}, {"en": "the responsibility", "zh": ""}, {"en": "all taxi drivers", "zh": ""}, {"en": "the London knowledge", "zh": ""}]}, {"id": 1582, "name": "London fog", "phrases": ["the earliest pictures", "the 1835 painting", "a trueborn Londoner", "an atmospheric pollution", "the central element", "the bridge", "the steam", "both sides", "a shot-tower", "smoking industries"], "eng": "Turner, not surprisingly, painted one of the earliest pictures of London’s fog, in the 1835 painting of The Thames above Waterloo Bridge. 1835 Turner is a trueborn Londoner, is advertising his familiarity with London’s air problem by putting smoke, an atmospheric pollution at its center. —— —— And as you can see, in here, the bridge is the central element, which is a theme that’s later taken up by Monet. And it’s partly obscured by the steam and smoke, which rises from both sides of the river. Here, we see a shot-tower. I think you can just about to see, which was constructed in 1826. 1826 Do you know what shot-towers are? They produce shot for guns, ammunition. And they were very smoky, one of the most smoking industries. But it’s barely visible, as you can see, as are the various industries on the Lambeth side of the river. There’s, on this side, there’s a steamship about to dock or preparing to leave. Its black smoke thrusting up to join the kind of swirling arc of smoke there. William Rodner sees this painting as a potent essay on the energy and complexity of modern polluted urbanism. · Smoke, I think, here represents a flourishing economy, which brings employment and food on tables, but also the dirt and pollution associated with the fumes all seems to be tainted by sulfurous yellow.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678155/2d720036a1af485da3a2c7ef329111c3.mp3\"></audio></div><br />Turner painted one of the earliest pictures of London&rsquo;s fog in the 1835. Turner is familiar with London&rsquo;s air problem by putting smoke at its center. The bridge is the central elements, and it is a theme that&rsquo;s later taken up by Monet. We see a shot-tower and a steamship. They were very smoky and barely visible. The speaker thinks they represent for a flourishing economy, but also the dirt and pollution.<br />Turner在1835年画了伦敦雾霾的最早画作之一。通过将烟雾作为画面的中心，透纳展现了伦敦的空气问题。桥梁是画作的核心元素，这一主题后来被莫奈所延续。画面中我们可以看到烟塔和蒸汽船，它们都被浓烟笼罩，几乎无法看清。讲者认为这些元素代表了一个繁荣的经济，但同时也象征着脏乱和污染。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678155/9100f34b3814419f92226fc349fa7c91.mp3", "phrases2": [{"en": "the earliest pictures", "zh": ""}, {"en": "the 1835 painting", "zh": ""}, {"en": "a trueborn Londoner", "zh": ""}, {"en": "an atmospheric pollution", "zh": ""}, {"en": "the central element", "zh": ""}, {"en": "the bridge", "zh": ""}, {"en": "the steam", "zh": ""}, {"en": "both sides", "zh": ""}, {"en": "a shot-tower", "zh": ""}, {"en": "smoking industries", "zh": ""}]}, {"id": 1583, "name": "Cosmic Civilization", "phrases": ["every year", "new stars", "the planets", "the necessary criteria", "all planets", "the chances", "other cosmic civilizations", "the search", "the vast expanse", "the universe"], "eng": "It begins by stating that every year, seven new stars are formed. However, most of the planets orbiting these stars are either too hot or too cold to sustain life. Only around 20% of all planets meet the necessary criteria to have the possibility of hosting life. 20% Despite these favorable conditions, the chances of life actually appearing are incredibly small, almost close to zero. This has made the search for other cosmic civilizations extremely difficult. Scientists have been tirelessly exploring the vast expanse of the universe, using various methods such as radio signals and telescope observations, in the hope of finding evidence of extraterrestrial life. While the lecture does not provide concrete proof of the existence of other civilizations, it emphasizes the importance of continuing the search. The quest to discover other cosmic civilizations not only helps us understand the universe better but also raises fundamental questions about the origins of life and our place in the cosmos.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658438/97d5568b10c04cc78d8b7f3dfec2be97.mp3\"></audio></div><br />The lecture talks about the possibility of existence of other cosmic civilizations. Every year, 7 stars are formed, but most planets around them are either too hot or too cold to appear life. Only 20% of all planets meet all necessary criteria that have chance to have life. However, the chance of appearance of life is very small, which is close to zero. Even though it is important to continue the search, it is very hard to find other cosmic civilizations.<br />讲座讨论了其他宇宙文明存在的可能性。每年有7颗新恒星形成，但围绕它们的大多数行星要么太热，要么太冷，无法孕育生命。只有20%的行星满足所有必要条件，才有机会存在生命。然而，生命出现的可能性非常小，几乎接近于零。尽管继续探索其他宇宙文明非常重要，但要找到它们却非常困难。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658438/573e79e98df548d9956c33e945291b0d.mp3", "phrases2": [{"en": "every year", "zh": ""}, {"en": "new stars", "zh": ""}, {"en": "the planets", "zh": ""}, {"en": "the necessary criteria", "zh": ""}, {"en": "all planets", "zh": ""}, {"en": "the chances", "zh": ""}, {"en": "other cosmic civilizations", "zh": ""}, {"en": "the search", "zh": ""}, {"en": "the vast expanse", "zh": ""}, {"en": "the universe", "zh": ""}]}, {"id": 1584, "name": "Early Robot", "phrases": ["the term robot", "first robots", "rossum ’", "universal Robots", "hollywood depictions kind", "absolute political turmoil", "the First World War", "a devastating impact", "the Ford manufacturing production line", "a production line"], "eng": "This is a kind of object that you’re probably all familiar with when you had the term robot, but I’m gonna show you the very, very first robots. These were the very first robots. They were characters in a play in the 1920s called Rossum’s Universal Robots, and the play was written by Czech writer called Karel Capek. 1920 · And basically, these robots, you know, people tend to think of robots as kind of cute cuddly toys or, you know, Hollywood depictions kind of devoid of politics. But the first robots were actually created and imagined in a time of absolute political turmoil. You just had the First World War, you know, it finished had a devastating impact across Europe and so people were kind and people are kind of reflecting on what does it mean to be human, what makes us human, those kinds of question. And this kind of context is what inspired Capek to kind of write this play. And interestingly, these robots being human, they are actually in the play assembled on a production line, a bit like the Ford manufacturing production line. “ ” So even though they are human, they are assembled and these robots are designed to labor, and that is their primary purpose in society. “ ”", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678157/d7dd38595db4418aaede26e9a7b7f7c6.mp3\"></audio></div><br />The first robots were characters in a play in the 1920s called Rossum&rsquo;s Universal Robots, and the writer was Karel Capek. People tend to thinks of robots as cute cuddly toys. But the first robots were actually created and imagined in a time of absolute political turmoil, which was the First World War. The robots are actually in the play assembled on a production line. Even even though they are human, they are assembled and these robots are designed to labour, and that is their primary purpose in society.<br />第一次机器人出现在1920年代的一部名为《罗萨姆的万能机器人》（Rossum&#39;s Universal Robots）的戏剧中，作者是卡雷尔&middot;恰佩克。人们通常把机器人看作是可爱、温顺的玩具。但实际上，最初的机器人是在第一次世界大战这一极端政治动荡的时期被创造和构思出来的。戏剧中的机器人实际上是通过生产线组装的。尽管它们是人类外形，但它们是被组装出来的，设计的主要目的是劳动，这也是它们在社会中的首要角色。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678157/8b84bcb1405349f499bac35f651dbd42.mp3", "phrases2": [{"en": "the term robot", "zh": ""}, {"en": "first robots", "zh": ""}, {"en": "rossum ’", "zh": ""}, {"en": "universal Robots", "zh": ""}, {"en": "hollywood depictions kind", "zh": ""}, {"en": "absolute political turmoil", "zh": ""}, {"en": "the First World War", "zh": ""}, {"en": "a devastating impact", "zh": ""}, {"en": "the Ford manufacturing production line", "zh": ""}, {"en": "a production line", "zh": ""}]}, {"id": 1585, "name": "Universal philosophy", "phrases": ["the big benefit", "a universal philosophy", "206 countries", "the world", "liberal theory", "some value", "the United Nations", "the Universal Declaration", "human Rights", "the idea"], "eng": "Okay. So this is the big benefit of a universal philosophy. It says it applies to everybody. Well, looks that doesn't, you know, 205 or 206 countries in the world. And you've got something that applies to everybody. That's a bit strange, isn't it? 205 206 No, says liberal theory. There are some value structures that apply to all of us. “ ” “ ” You couldn't have the United Nations without it. It couldn't tell you that the Universal Declaration of Human Rights without this idea of values that apply to all of us just because we are humans. “ ” Now, the idea is to test that as well. Why is sport universal? Why does everybody play football? It's because the values are specified at a very thin level at the top. There are these rules and we all have to abide by just these rules. But there are lots of things about football that aren't rules specified. So Brazilian football is different from Italian football, from British football, from German football, from Spanish football. It's culturally specific, but acknowledges that there are these universal general rules to apply to everybody.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658439/888d273f418b43feabe9d89266e9fedf.mp3\"></audio></div><br />The lecture talks about a universal philosophy. According to the lecture, there are some value structures that apply to all of us. Now, the idea is to test that as well. Sport is universal because the values are specified at a very thin level at the top. There are these rules and we all have to abide by just these rules. But there are lots of things about football that aren&#39;t rules specified. In conclusion, there are these universal rules to apply to everybody.<br />这一讲座讲述了关于普遍哲学的内容。根据讲座，有一些价值结构适用于我们所有人。现在，研究的目标是验证这一点。体育是普遍的，因为其价值观在顶层有非常明确的规定。有这些规则，我们所有人都必须遵守这些规则。但是，足球中有很多方面并没有明确的规则。总之，存在一些普遍适用于每个人的基本规则。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658439/4841ef77930c4700bc7bcd5e99ecfac6.mp3", "phrases2": [{"en": "the big benefit", "zh": ""}, {"en": "a universal philosophy", "zh": ""}, {"en": "206 countries", "zh": ""}, {"en": "the world", "zh": ""}, {"en": "liberal theory", "zh": ""}, {"en": "some value", "zh": ""}, {"en": "the United Nations", "zh": ""}, {"en": "the Universal Declaration", "zh": ""}, {"en": "human Rights", "zh": ""}, {"en": "the idea", "zh": ""}]}, {"id": 1586, "name": "Gas giants", "phrases": ["the gas giants", "two theories", "the same theory", "core accretion", "disk instability", "the reason", "a metallic core", "a certain pressure", "the insides", "metallic cores"], "eng": "So there are two theories for how the gas giants formed. One is the same theory I showed you just now — core accretion, right? And the other is called disk instability, and one of our colleagues at DTM has done a lot of work on that. DTM And so it's unclear exactly how they formed but you're right — what we're trying to do, the reason we're trying to get the higher and higher pressure in the lab is because we are trying to understand more about the pressure inside the gas giants. —— It's thought that the gas giants also have a metallic core, but maybe a metallic core is not made of iron. Hydrogen, for example, becomes metallic at a certain pressure, ok? So it's very possible that the insides of these planets could have metallic cores, could have hydrogen cores, could have rocky portions. We're not sure. But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and the exoplanets that are so big.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658440/75f7d38151bb44e4a3c1d0126f1d7f0e.mp3\"></audio></div><br />The lecture talks about two theories for how the gas giants formed. According to the lecture, one theory is called core accretion, and the other is called disk instability. It&#39;s unclear exactly how they formed but you&#39;re right what we&#39;re trying to do. So it&#39;s very possible that the insides of these planets could have metallic cores, hydrogen cores, and rocky portions. But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and exoplanets that are so big.<br />这一讲座讲述了关于气态巨行星形成的两种理论。根据讲座，一种理论叫做核吸积理论，另一种叫做星盘不稳定理论。目前还不完全清楚它们到底是如何形成的，但我们正在努力探索。气态巨行星的内部很可能具有金属核心、氢核心和岩石部分。不过，我们在实验室中能获得的更高压力，能够帮助我们更接近理解气态巨行星和如此庞大的系外行星的内部结构。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658440/8c03da842ca047eba622a00c59ccba20.mp3", "phrases2": [{"en": "the gas giants", "zh": ""}, {"en": "two theories", "zh": ""}, {"en": "the same theory", "zh": ""}, {"en": "core accretion", "zh": ""}, {"en": "disk instability", "zh": ""}, {"en": "the reason", "zh": ""}, {"en": "a metallic core", "zh": ""}, {"en": "a certain pressure", "zh": ""}, {"en": "the insides", "zh": ""}, {"en": "metallic cores", "zh": ""}]}, {"id": 1587, "name": "Three principles", "phrases": ["the guiding principles", "three principles", "the works", "a number", "ross My choice", "word equity", "no policy", "the policy", "the time", "the benefits"], "eng": "From reading philosophy, I came up with three principles as the guiding principles for a just city, of the principles of equity, democracy, and diversity. Of these were derived from the works of a number of philosophers, most preeminently I supposed on Ross. Ross My choice of word equity rather than equality is in fact based on Ross's argument that a policy ought to distribute benefits to people where the worst off become better off. “ ” equity “ ” equality So the worst off don't have to become equal to everybody else but no policy should in fact make those who are most disadvantaged, more disadvantaged. And it means that we have to talk about the policy at the time it's being enacted. To say, while we have to make our city more competitive because sometime and by and by, the benefits will trickle down to those people who were worst off doesn't justify making them worst off at that time. “ ” We have a lot of examples in the world of people whose homes were destroyed in the name of the greater good and say eventually they will benefit. “ ” But equity means that you do not in fact take advantage of those people who are weakest. “ ”", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678137/ab2e8d565fa745b0a152bc3f13001e55.mp3\"></audio></div><br />The lecture talks about equity. That is one of the guiding principles for a just city. According to the lecture, his choice of word equity is in fact based on Ross&#39;s argument that a policy ought to distribute benefits to people where the worst off become better off. In addition, we have to talk about the policy at the time it&#39;s being enacted, and equity means that you do not in fact take advantage of those people who are weakest.<br />这一讲座讲述了公平，这是一个公正城市的指导原则之一。根据讲座，演讲者选择使用&ldquo;公平&rdquo;这个词实际上是基于罗斯的论点，即政策应当分配利益，使得最处于困境的人变得更好。此外，我们还需要讨论政策实施时的情况，而公平意味着你不能利用那些最弱势的人群。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678137/e8700bf2ff264ab190f0d27487a7e279.mp3", "phrases2": [{"en": "the guiding principles", "zh": ""}, {"en": "three principles", "zh": ""}, {"en": "the works", "zh": ""}, {"en": "a number", "zh": ""}, {"en": "ross My choice", "zh": ""}, {"en": "word equity", "zh": ""}, {"en": "no policy", "zh": ""}, {"en": "the policy", "zh": ""}, {"en": "the time", "zh": ""}, {"en": "the benefits", "zh": ""}]}, {"id": 1588, "name": "Four fundamental forces", "phrases": ["fundamental forces", "the universe", "everyday life", "the four forces", "the surface", "the earth", "the electromagnetic force", "another force", "the force", "the electricity"], "eng": "There are four fundamental forces at work in the universe. Some of them are very familiar from everyday life. Some of them are not. So we all know about gravity. That's one of the four forces. It's what keeps our ankles to the surface of the earth, and keeps the Earth in orbit around the Sun. There is another force that we're very familiar with, which is the electromagnetic force. That is the force that is responsible for the electricity, electric currents for light, for the sun's light, that's electromagnetic radiation coming from the Sun to the Earth. —— There are two other forces though that are somewhat less familiar. They are the nuclear forces. They are forces that are at work within the nuclear atoms. One of those forces is called the strong nuclear force. That really is the force that bides protons to protons, bides the quarks inside of the protons and neutrons keeping them from flying out. The other nuclear force is called the weak nuclear force. And that's a force that predominantly we know of because it's responsible for radioactivity and radioactive decay. So those four forces—strong nuclear force, weak nuclear force, electromagnetic force and gravitational force—those are the forces that work in the universe. —— ——", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678138/ec8b6d16bd024171be2b857ec7006d15.mp3\"></audio></div><br />The lecture talks about four fundamental forces that work in the universe. According to the lecture, gravity is one of the four forces. It&#39;s what keeps our ankles to the surface of the earth, and keeps the Earth in orbit around the Sun. Another force is the electromagnetic force. That is the force that is responsible for the electricity, electric currents for light. There are two other forces that we&#39;re less familiar with, one of those forces is called the strong nuclear force. The other nuclear force is called the weak nuclear force.<br />这一讲座讲述了宇宙中四种基本力。根据讲座，引力是其中一种力。它使我们的双脚稳稳站在地球表面，并能使地球围绕太阳转。另一种力是电磁力。这种力与电流、光以及电力的作用息息相关。还有两种我们不太熟悉的力，其中一种叫做强核力。另一种核力叫做弱核力。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678138/5ec50bc10090411e92a2a7499f5ccb1d.mp3", "phrases2": [{"en": "fundamental forces", "zh": ""}, {"en": "the universe", "zh": ""}, {"en": "everyday life", "zh": ""}, {"en": "the four forces", "zh": ""}, {"en": "the surface", "zh": ""}, {"en": "the earth", "zh": ""}, {"en": "the electromagnetic force", "zh": ""}, {"en": "another force", "zh": ""}, {"en": "the force", "zh": ""}, {"en": "the electricity", "zh": ""}]}, {"id": 1589, "name": "Dietary guidance", "phrases": ["the cause", "fat versus sugar", "recent debate", "a big problem", "the metabolic consequences", "public guidance", "an important step", "the same time", "a wider view"], "eng": "I think there are a lot of confusing messages about health and food out there that don't really help the cause. Look at the most recent debate, fat versus sugar, two things that we know scientifically are of concern. And I think a big problem is that in the field of nutrition science, we look at individual nutrients like fat, carbohydrate, protein, etc., to figure out the metabolic consequences of food. And so when we're putting out public guidance about what we should be eating, we talk in terms of nutrients instead of converting those nutrients into foods like fish, fruit, cookies, and so on. But I think talking about foods rather than nutrients is an important step we need to take. At the same time, we don't have to say to people, you can eat this or you can't eat that, but we should help give people a wider view of the relative proportions of various food groups and dietary patterns on the whole.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2657000-2658000/2657057/20e292dbf7cc4fde8985497458b43330.mp3\"></audio></div><br />The speaker said that some health messages about food are confusing. For example, there are debates about whether fat or sugar is bad for you, when in fact both are problematic. She said that dietary guidance to the public should shift away from a focus on individual nutrients, such as protein and carbohydrate towards guidelines relating to actual food, for example, meat, vegetables or biscuits. Moreover, the issue isn&#39;t about deciding which foods to eat or to abstain from. Instead, it&#39;s about eating patterns as a whole and the proportions of the different foods in relation to each other.<br />演讲者提到，一些关于食物的健康信息令人困惑。例如，人们争论脂肪或糖哪一种有害，而实际上两者皆有问题。她认为，向公众提供的饮食指导应该从关注蛋白质、碳水化合物等单一营养素，转变为关于实际食物的指导，比如肉类、蔬菜或饼干。此外，问题的关键不在于决定哪些食物该吃还是该戒掉，而是在于整体的饮食模式以及不同食物之间的比例关系。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657057/20e292dbf7cc4fde8985497458b43330.mp3", "phrases2": [{"en": "the cause", "zh": ""}, {"en": "fat versus sugar", "zh": ""}, {"en": "recent debate", "zh": ""}, {"en": "a big problem", "zh": ""}, {"en": "the metabolic consequences", "zh": ""}, {"en": "public guidance", "zh": ""}, {"en": "an important step", "zh": ""}, {"en": "the same time", "zh": ""}, {"en": "a wider view", "zh": ""}]}, {"id": 1590, "name": "Salience", "phrases": ["the vast amount", "do consumers", "a key role", "the perspective", "consumers attention", "certain characteristics", "some characteristics", "other words", "high levels", "the salience"], "eng": "How do consumers process the vast amount of information and multitude of possibilities presented to them? Well, from the perspective of behavioral economics, a concept called salience plays a key role in this. So salience is when consumers attention is attracted to certain characteristics. That's because to work efficiently, our brains try to take shortcuts by prioritizing some characteristics. In other words, items with high levels of salience stand out, meaning we'll be more likely to choose them. The salience of a product can be increased in a number of ways. Firstly, items can become more salient by appealing to one of our physical senses, for example, the inviting smell of freshly baked bread in a grocery store. Alternatively, products can also have higher salience when they're presented in a way that is somehow cognitively unusual. Advertisements which include shocking humor, usually attract consumers attention, and of course, sometimes a particular characteristic becomes more salient simply because our individual needs have evolved. A person who has recently become a parent may well start considering whether the items that they used to purchase without any hesitation are in fact child friendly.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658431/abf66b8f33f24842850fe25f685fbf35.mp3\"></audio></div><br />Consumers are faced with a wide range of options, so the brain needs to find efficient ways to filter out much of this information by prioritizing certain things, items, or characteristics which attract our attention said to be salient or have higher levels of salience and as a result, are more likely to be purchased because they stand out. Products tend to have more salient when they appeal to one of our physical senses or do not conform to our expectations. Finally, the salience of a product may change over time as our individual needs or interests change.<br />消费者面临着广泛的选择，因此大脑需要找到有效的方法，通过优先考虑某些吸引我们注意力的被认为是突出的或具有更高显著性的事物、物品或特征来过滤掉大部分信息，因此，更有可能被购买，因为它们很突出。当产品吸引我们的身体感官或不符合我们的期望时，它们往往更具显著性。最后，产品的突出性可能会随着我们个人需求或兴趣的变化而改变。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658431/eaf54f2a95d244f2b6bfd81ff25ec730.mp3", "phrases2": [{"en": "the vast amount", "zh": ""}, {"en": "do consumers", "zh": ""}, {"en": "a key role", "zh": ""}, {"en": "the perspective", "zh": ""}, {"en": "consumers attention", "zh": ""}, {"en": "certain characteristics", "zh": ""}, {"en": "some characteristics", "zh": ""}, {"en": "other words", "zh": ""}, {"en": "high levels", "zh": ""}, {"en": "the salience", "zh": ""}]}, {"id": 1592, "name": "Canned laughter", "phrases": ["a feature", "TV production", "a studio audience", "the finished product", "several reasons", "canned laughter", "live studio audiences", "technical aspects", "the wrong places", "some individuals"], "eng": "Today's session is about a feature of TV production called Canned Laughter. A recording of a studio audience laughing inserted into a program so the finished product sounds as if the studio audience is laughing along as the action unfolds. There are several reasons for the use of canned laughter, which we can divide into technical reasons and creative ones. In terms of technical aspects, canned laughter compensates for the unpredictability of live studio audiences. For instance, some individuals might laugh too loudly or in what producers consider to be the wrong places, or they might even clap and cheer, all of which can interfere with the scene. And of course, canned laughter is also needed when scenes take place outside a studio. However, canned laughter is also believed to enhance the program itself. Research has shown that the inclusion of canned laughter can actually change people's perceptions of what they're watching. It's been demonstrated that viewers are more likely to laugh or have a favorable impression of a scene when they can hear other people laughing. So canned laughter is great news for television executives that crave high ratings. Of course, as viewers' tastes in comedy have changed, many shows have moved away from the use of canned laughter. Nevertheless, it remains an effective and familiar aspect of TV comedy.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658433/2ff93ecdc2f04647bef4b34c3f78ed91.mp3\"></audio></div><br />Canned laughter is a sound recording of people&#39;s laughter, which is added to make it appear as if a live audience is responding directly to the scene, As studio audiences can behave in unexpected ways, canned laughter is a way of getting laughter in the right places and is also used when a scene is shot away from a studio. Research has shown that canned laughter can also make a program seem funnier to viewers. People are more likely to laugh when they hear canned laughter during a program, Use of canned laughter is becoming less common, but it&#39;s still an important element of TV comedy in many countries.<br />罐装笑声是人们笑声的录音，它被添加以使其看起来像是现场观众直接对现场做出反应，因为工作室观众可以以意想不到的方式表现。罐头笑声是一种在正确的地方获得笑声的方式，也可以在场景从工作室拍摄出来时使用。研究表明，罐装笑声还可以使节目对观众来说更有趣。当人们在节目中听到罐装的笑声时，他们更有可能发笑，罐装的笑声正在变得越来越少，但在许多国家，它仍然是电视喜剧的重要组成部分。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658433/c8d040019331450284e2b12df458a18b.mp3", "phrases2": [{"en": "a feature", "zh": ""}, {"en": "TV production", "zh": ""}, {"en": "a studio audience", "zh": ""}, {"en": "the finished product", "zh": ""}, {"en": "several reasons", "zh": ""}, {"en": "canned laughter", "zh": ""}, {"en": "live studio audiences", "zh": ""}, {"en": "technical aspects", "zh": ""}, {"en": "the wrong places", "zh": ""}, {"en": "some individuals", "zh": ""}]}, {"id": 1593, "name": "Baby brain", "phrases": ["a quarter", "final size", "a baby start", "an adult", "the baby listens", "the beginning", "some parents", "the baby", "many times", "an exciting moment"], "eng": "When a baby is born, its brain is already a quarter of its final size. But when does a baby start to learn? Well, experts believe that a baby is learning even before it is born. When it is born, though, it will start learning very quickly, much more quickly than an adult. At the beginning, the baby listens and watches all the skills being performed that it needs to learn, such as speaking, walking, playing, eating, and singing. Some parents think that their baby isn't learning, but it is. The baby has to watch and listen to something many times before it can do that thing. For parents, an exciting moment is their baby's first smile. This happens at around 6 weeks old. 6 Another important moment is when baby takes its first step. The earliest this can happen is when the baby is about 9 months old. 9", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658434/630dfaa7b25e412481fd3f7dfad13b3f.mp3\"></audio></div><br />The lecture is about babies and how they learn. When a baby is born, its brain is already relatively large and the baby immediately starts learning. It has to learn many skills, such as talking, walking, and playing. It can&#39;t do these things until it has watched and listened to someone doing them many times. There are important moments for parents of young babies like the first smile at about six weeks and starting to walk after about 9 months.<br />讲座是关于婴儿以及他们如何学习的。当婴儿出生时，它的大脑已经相对较大，婴儿立即开始学习。它必须学习许多技能，如说话、走路和玩耍。它不能做这些事情，直到它多次观察和听取别人做这些事情。对于年幼婴儿的父母来说，有一些重要的时刻，比如大约六周时的第一次微笑，大约九个月后开始走路。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658434/ad4d1cf9de4949dfa7f2015a04d8c323.mp3", "phrases2": [{"en": "a quarter", "zh": ""}, {"en": "final size", "zh": ""}, {"en": "a baby start", "zh": ""}, {"en": "an adult", "zh": ""}, {"en": "the baby listens", "zh": ""}, {"en": "the beginning", "zh": ""}, {"en": "some parents", "zh": ""}, {"en": "the baby", "zh": ""}, {"en": "many times", "zh": ""}, {"en": "an exciting moment", "zh": ""}]}, {"id": 1594, "name": "Health problem", "phrases": ["the world today", "big problems", "the first problem", "enough exercise", "much electricity", "electricity causes pollution", "the process", "an exercise bike", "a solution", "the exercise problem"], "eng": "So now I want to look at two big problems in the world today and something that someone has invented to solve these problems. The first problem is that people don't get enough exercise, which is obviously bad for people's health. The second is that people are using too much electricity. The process of making electricity causes pollution, which is also bad for our health as well as being bad for the environment. So here we might have a solution, an exercise bike perhaps. You were thinking, well, that solves problem number one, the exercise problem, but what about problem two? Well, this is where the idea for the invention comes from. What if you could solve the pollution and health problems at the same time? So how about an exercise bike that can create electricity? You can then use that electricity for power in your home.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658435/78a65cf137894ba79a4c39f6f32907a3.mp3\"></audio></div><br />There are two big problems in the world. These are that people don&#39;t get enough exercise and that they use too much electricity. There is a way to solve both these problems with a special kind of exercise bike which someone has invented. If you use the bike, you can get fit and you can also create electricity and use it in your home.<br />世界上有两大问题。这些是人们没有得到足够的锻炼，并且他们使用太多的电。有一种方法可以用某人发明的一种特殊的健身车来解决这两个问题。如果你使用自行车，你可以变得健康，也可以发电并在家里使用。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658435/ebd57d6fd97e4b4e97e6963d4a51e936.mp3", "phrases2": [{"en": "the world today", "zh": ""}, {"en": "big problems", "zh": ""}, {"en": "the first problem", "zh": ""}, {"en": "enough exercise", "zh": ""}, {"en": "much electricity", "zh": ""}, {"en": "electricity causes pollution", "zh": ""}, {"en": "the process", "zh": ""}, {"en": "an exercise bike", "zh": ""}, {"en": "a solution", "zh": ""}, {"en": "the exercise problem", "zh": ""}]}, {"id": 1595, "name": "Start in university", "phrases": ["a new student", "a good start", "all students", "a video recording", "the lecture online", "university life", "much time", "the important facts", "the lecture", "lecture notes"], "eng": "As a new student, there are many things that you can do to get a good start at university. Attending lectures is something that we expect all students to do. If you miss a lecture though, or didn't quite understand the topic, or simply want to hear it again, you can watch a video recording of the lecture online. However, university life is very busy and you won't have much time, so it's better to concentrate and take good notes when you do attend a lecture. If you make notes, it helps you to think about the important facts and ideas in the lecture, and writing these things down can help you to remember them again. There may be lecture notes available online, but making your own notes is much more valuable.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658436/5823fea68d114b96a6caaf735a1311c0.mp3\"></audio></div><br />The lecture tells new students at university what they should do. The speaker says that students should go to lectures, but if they can&#39;t go to one, they can see a video of it online. It&#39;s better to go to lectures and take notes, though, because taking notes can help students remember important things from the lectures.<br />讲座告诉大学新生他们应该做什么。演讲者说学生应该去听课，但如果他们不能去听课，他们可以在网上看到讲座的视频。最好去听课并记笔记，因为记笔记可以帮助学生记住讲座中重要的事情。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658436/87636b245c2a44cd8f7ee27a931e3f31.mp3", "phrases2": [{"en": "a new student", "zh": ""}, {"en": "a good start", "zh": ""}, {"en": "all students", "zh": ""}, {"en": "a video recording", "zh": ""}, {"en": "the lecture online", "zh": ""}, {"en": "university life", "zh": ""}, {"en": "much time", "zh": ""}, {"en": "the important facts", "zh": ""}, {"en": "the lecture", "zh": ""}, {"en": "lecture notes", "zh": ""}]}, {"id": 1596, "name": "Savings", "phrases": ["the greatest economic successes", "the enormous rise", "the middle classes", "the economies", "the new middle class", "the savings habits", "savings decisions", "the country", "the richer people", "business owners"], "eng": "The enormous rise of the middle class in certain developing countries is one of the greatest economic successes of the late 20th and early 21st centuries. 20 21 This is excellent for the economies of those countries because the middle classes usually earn more than they need to live on, and thus they can save money. It's important that economists understand how these processes work, and thus they need to understand the savings habits of the new middle class. Our research therefore aimed to investigate patterns of savings and reasons for savings decisions. The country we chose to focus on was India. We found that, not surprisingly, it was the richer people, especially business owners, who tended to save more. As for the reasons for saving, the number one reason was to provide an income after retirement. Having an income after becoming too old to work was important for savers who wanted to be able to enjoy their older years. And the second most important reason was for family purposes, such as the education and weddings of their children.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2656000-2657000/2656693/7ee25f9051c243e5b19a4ab10442ce5c.mp3\"></audio></div><br />The middle classes in some developing countries have grown considerably from the last part of the previous century. This has benefited those economies greatly, but economists need to further investigate some of the details, such as p<span style=\"font-size:14px;\">atterns of savings and the reasons for saving. The researchers mentioned here carried out their studies in India. Their conclusions included the fact that, unsurprisingly, richer people and business owners tended to save more. T</span>he most important reason for saving was to provide for retirement, and the second was to provide their children with things like education and marriage ceremonies, which presumably are expensive in India.<br />中产阶级在一些发展中国家自上个世纪后期以来有了显著的增长。这对这些国家的经济带来了极大的益处，但经济学家需要进一步研究一些细节，如储蓄模式和储蓄的原因。这里提到的研究者们在印度进行了他们的研究。他们的结论包括一个毫不意外的事实，即较富有的人和企业主倾向于储蓄更多。储蓄的最重要原因是为退休后的生活提供保障，其次是为了给子女提供诸如教育和婚礼等事宜，这些在印度通常是昂贵的。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656693/607e43cb7cd64dada7c11eebff59c904.mp3", "phrases2": [{"en": "the greatest economic successes", "zh": ""}, {"en": "the enormous rise", "zh": ""}, {"en": "the middle classes", "zh": ""}, {"en": "the economies", "zh": ""}, {"en": "the new middle class", "zh": ""}, {"en": "the savings habits", "zh": ""}, {"en": "savings decisions", "zh": ""}, {"en": "the country", "zh": ""}, {"en": "the richer people", "zh": ""}, {"en": "business owners", "zh": ""}]}, {"id": 1597, "name": "Moon launch base", "phrases": ["the first Moon landings", "space travel", "1969 Lunar programs", "a good place", "a Moon launch base", "difficult aspect", "the journey time", "the Moon", "the cost difference", "20 times"], "eng": "Since before the first Moon landings of 1969, there has been interest in space travel to the Moon. 1969 Lunar programs are expensive and difficult, but there are several reasons why the Moon might be a good place to launch further space exploration. Firstly, a Moon launch base would eliminate the most difficult aspect of space travel, namely getting a rocket through the Earth's gravity. The journey time between, say, going to Mars from Earth rather than from the Moon is not significant. However, the cost difference would be immense, as it would take 20 times less fuel to launch a spacecraft from the Moon than from the Earth due to there being less gravity on the Moon. 20 There would not need to be a drain on the Earth's resources, as the Moon is rich in all the necessary minerals such as aluminum and silicon, which would mean that the entire infrastructure needed to enable spacecraft launch from the Moon could be done robotically using the materials already present.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2656000-2657000/2656714/4fd2e02997bd42dd878073275f356365.mp3\"></audio></div><br />The Moon could be a good base to launch spacecraft that would explore the Solar System further. Although some of the same issues would apply as when launching a spacecraft from Earth, it would be easier from the Moon because of less gravity. It would be cheaper because less fuel would be needed, and all the materials required to build the necessary infrastructure are already on the Moon naturally.<br />月球可能是发射进一步探索太阳系的航天器的良好基地。尽管可能会遇到一些与从地球发射航天器时相同的问题，但由于重力较小，从月球发射航天器会更容易。这会更便宜，因为需要的燃料更少，而且建造必要基础设施所需的所有材料已经在月球上天然存在了。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656714/3566326442774c0fad172af1a307e52b.mp3", "phrases2": [{"en": "the first Moon landings", "zh": ""}, {"en": "space travel", "zh": ""}, {"en": "1969 Lunar programs", "zh": ""}, {"en": "a good place", "zh": ""}, {"en": "a Moon launch base", "zh": ""}, {"en": "difficult aspect", "zh": ""}, {"en": "the journey time", "zh": ""}, {"en": "the Moon", "zh": ""}, {"en": "the cost difference", "zh": ""}, {"en": "20 times", "zh": ""}]}, {"id": 1598, "name": "Roman London", "phrases": ["the oth
