<script>
var D={"cards": {"sst": [{"id": 2122, "name": "Transportation network in Paris", "phrases": ["most cities", "a great way", "the city", "the Eiffel Tower", "a good hour", "great public transport links", "the subway system", "the metro", "big underground network", "RER Tickets"], "eng": "As with most cities, we recommend getting about on foot. Besides being eco-friendly, it's a great way to get a feel for the city. Just bear in mind that Paris is big, like really big. A walk from the Eiffel Tower to Notre Dame would take a good hour. Fortunately, if you're strapped for time, there are great public transport links. The subway system is split into the metro and RER lines. RER Tickets will work across both, so you can treat it as one big underground network. In our experience, it served a purpose, which was to get us around quickly. It's just not the cleanest. The Metro has 16 lines, each with a different color. 16 The five RER lines are labeled with the letters A B C D E. 5 RER A B C D E RER and metro trains run every day from 6:00 a.m. until half past midnight. RER 6 As for tickets, a single journey is 1.90 euro. 1.90 We bought a book of 10 for 14.50 euro. 10 14.50 Now there are weekly or monthly passes available. But in my opinion, they're just a farce. We need a passport photo and everything else.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678215/dab162e55f594de7b18dc6000cd83ebb.mp3"}, {"id": 2123, "name": "Children directors", "phrases": ["social skills", "an individual", "an individual needs", "social interactions", "an understanding", "social difficulties", "particular risks", "young people", "strong relationships", "a high school"], "eng": "Social skills are vital in enabling an individual to have and maintain positive interactions with others. Many of these skills are crucial in making and sustaining friendships. Social interactions do not always run smoothly and an individual needs to be able to implement appropriate strategies, such as conflict resolution when difficulties in interactions arise. It is also important for individuals to have 'empathy' as it allows them to respond in an understanding and caring way to how others are feeling. Children are facing social difficulties with particular risks. Young people who do not have strong relationships with the adults in their family are even more at risk. In an experiment in a high school, which lasted for 8 to 12 weeks, the students were told to be a movie director and to choose their own story structure. 8 12 The students worked with each other, which involved lots of different skills, and social interactivity. The movies they had made were actually cool. Then, the researchers tested the intervention effect, finding this can improve their self-regulation, and they found this can improve their self-regulation and critical thinking skills.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678653/496d77f31adf4eb9ac1de87a37790035.mp3"}, {"id": 2124, "name": "Bees waggle dance", "phrases": ["a unique way", "the waggle dance", "a good source", "a warning signal", "a headbutt", "a feeding station", "a source", "potential dangers", "the station", "the dancing bees"], "eng": "Honeybees have a unique way of communicating with each other—the waggle dance. —— When a bee finds a good source of nectar, it will perform a waggle dance to inform other bees about it. However, this dance can be interrupted by a headbutt from another bee, which researchers have discovered is actually a warning signal. To study this behavior, scientists set up a feeding station in the lab to mimic a source of nectar. They then introduced foraging bees to potential dangers at the station, such as competition from rival colonies. When the foragers returned to the hive, they were observed stopping the dancing bees. This led the researchers to believe that the headbutt serves as a warning to the dancers about the dangerous source of nectar. The lecture also mentioned that bees can use their dance and sounds to describe different flowers and the environment. This study sheds light on the complex communication system of honeybees and the way they work together to ensure the safety of the colony and the success of their foraging efforts.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678216/884ce7b0e60b48f8b9e21953869a972c.mp3"}, {"id": 2125, "name": "Cosmology and maths", "phrases": ["the intricate relationship", "the speaker", "the lecturer", "a career", "the power", "the mysteries", "a fascinating realization", "an omnipresent force", "the universe", "a complex web"], "eng": "The speaker is discussing the intricate relationship between mathematics and cosmology. Back in the 1970s, the lecturer pursued a career in physics while actively engaging in the field of cosmology. 20 70 Throughout this period, scientists passionately sought to harness the power of mathematics as a means to unravel the mysteries of the universe. According to the speaker, this quest for mathematical understanding led them to a fascinating realization: mathematics is an omnipresent force in the natural world. In the speaker's perspective, mathematics is not just a tool used by scientists to explain the universe; rather, it is an inherent and fundamental aspect of nature itself. Nature, cosmology, and mathematics are all interconnected, forming a complex web of relationships that shape our understanding of the cosmos. As the speaker delves into the heart of their argument, they emphasize that mathematics can be found virtually everywhere in nature. From the graceful spiral of a seashell to the precise orbits of celestial bodies, mathematical patterns and principles underpin the very fabric of our world. These mathematical foundations allow us to comprehend and interpret the workings of the universe, making it an indispensable language for cosmologists. In conclusion, the speaker asserts that mathematics is the underlying system that enables us to explain the universe and nature. It is not merely a tool but a fundamental aspect of the cosmos itself. This profound connection between mathematics, nature, and cosmology has guided scientists in their pursuit of knowledge and continues to shape our understanding of the universe's grand design.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678217/2e0843e5401d4966b5e07fb41a80158c.mp3"}, {"id": 2126, "name": "Singapore", "phrases": ["unique relationship", "the successful blend", "powerful island nation", "a University", "chicago professor", "potential future city models", "the forefront", "various academic perspectives", "a well-rounded discussion", "the complex dynamics"], "eng": "In today's lecture, I explored Singapore's unique relationship with globalization. We started by examining its diverse population and the successful blend of cultures thriving within this small yet powerful island nation. I also referenced insights from a University of Chicago professor who has studied Singapore's economic strategies extensively. Later, we delved into potential future city models and how they might manifest in places like Singapore, which continues to be at the forefront of urban development and planning. The lecture concluded by citing various academic perspectives to offer a well-rounded discussion; names of notable professors were mentioned to credit their contributions to our understanding of globalization and its impact on Singapore. As we scrutinize the examples set by Singapore, it becomes clear that this nation exemplifies the complex dynamics of globalization, standing as a beacon of multiculturalism and forward-thinking urban planning.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678647/b6e3f591e0124fe2a33d11ca619fb5fa.mp3"}, {"id": 2127, "name": "International trading system", "phrases": ["the international trading system", "the World Trade Organization", "increased international trade", "the keystone", "foreign trade", "the ramifications", "every facet", "a broader range", "a result", "unprecedented consumer benefits"], "eng": "In our exploration of the international trading system, we acknowledge the significant changes since the inception of the World Trade Organization (WTO). WTO As countries opened up, an era of increased international trade commenced. Globalization has been the keystone, prompting nations to welcome foreign trade by opening their ports, fostering a globally connected economy. The ramifications of this shift touch every facet of commerce. As a result, consumers around the world now enjoy a broader range of products, competitive pricing, and improved quality. This trend has ushered in an era of unprecedented consumer benefits and widespread economic growth. To conclude from my perspective, the decision to engage in open trade has been immensely positive. Trading across borders should not just be seen as a strategic economic move, but as a force that enriches societies by exposing them to new ideas, technologies, and opportunities for development. It's a conviction of mine that trade openness is indeed a boon to global prosperity.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678648/c48c1a5d574643fcbdda540cb0b32080.mp3"}, {"id": 2128, "name": "Sound of words", "phrases": ["the lecture", "the importance", "a crucial role", "the speaker", "the broad capacity", "high school graduates", "the mention", "phone numbers", "the profound influence"], "eng": "The lecture emphasizes the importance of words and the impact of their sound. According to the speaker, the sound of words plays a crucial role in cognitive processes, aiding in the representation of the world and self-perception. Furthermore, the lecture highlights the broad capacity of words to express a multitude of concepts, underscoring their significance in communication and cognitive development. The speaker also uses the example of high school graduates to illustrate the importance of words in conveying complex ideas and information. Additionally, the mention of phone numbers suggests that words and their sounds are integral to memory and recall processes. Overall, the lecture underscores the profound influence of words and their sound on cognitive functions and communication, informing how individuals perceive and interact with the world.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678649/f9cd6cf04e2f4bb0b551299463faa250.mp3"}, {"id": 2129, "name": "Multiculturalism & cultural diversity", "phrases": ["an important aspect", "the diverse", "the idea", "the differences", "dominant culture", "multiculturalism encourages", "cultural diversity", "harmonious society", "a melting pot", "“ ” Embracing multiculturalism"], "eng": "Multiculturalism is an important aspect of our society, as it encourages us to embrace and appreciate the diverse cultures that make up our world. This concept promotes the idea that we should not only tolerate, but also celebrate and learn from the differences in our society. Rather than expecting everyone to conform to one dominant culture, multiculturalism encourages respect for individual traditions and beliefs. By recognizing and valuing cultural diversity, we can create a more inclusive and harmonious society. This is in contrast to the idea of a melting pot, where diversity is expected to disappear as everyone assimilates into one homogeneous culture. “ ” Embracing multiculturalism allows us to broaden our understanding of the world and fosters a sense of unity and acceptance amongst different groups. Ultimately, it is through respecting and celebrating our differences that we can create a more vibrant and enriching society for all.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678650/8cc1069e3a2349dda333a7b33ea0d798.mp3"}, {"id": 2130, "name": "Dialects", "phrases": ["a detailed exploration", "the lecture", "the shaping", "diverse influences", "the dynamic nature", "received Pronunciation", "the adaptability", "linguistic landscape", "a comprehensive analysis", "the nuanced differences"], "eng": "The lecture delivers a detailed exploration of the distinctions between dialects and accents. It underscores the shaping of dialects by diverse influences such as geography, society, family, and education. It is particularly notable that even speakers of Received Pronunciation may integrate words from other dialects, highlighting the dynamic nature of language. This underscores the adaptability and interconnectedness of dialects within our linguistic landscape. Overall, the lecture presents a comprehensive analysis of the nuanced differences between dialects and accents, bringing to light their influential role in shaping communication and preserving cultural identities. It shines a spotlight on the diverse and evolving nature of language, and how it intricately reflects our individual and collective experiences.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678651/197d3bf048df412eb723f576aea84447.mp3"}, {"id": 2131, "name": "International law", "phrases": ["a historical perspective", "the pivotal role", "the painful lesson", "a new set", "the lecture", "the significance", "the United States", "the roles", "international law", "incessant wars"], "eng": "This lecture provides a historical perspective on the establishment of international law, emphasizing the pivotal role it played in ending protracted conflicts. It begins by highlighting the painful lesson learned from prolonged periods of war, prompting the creation of a new set of rules governing the behavior between states. The lecture underscores the significance of this development, particularly in the context of prolonged conflicts with no peace for 30 or even 100 years. Additionally, the roles of powerful nations such as the United States and Australia in shaping international law are discussed. It is noted that international law was formally established in 1648 as a means to end incessant wars between states and alleviate the strains of military force. 1648 Overall, the lecture emphasizes the implication function and power dynamics of international law, shedding light on its historical significance and its role in curbing conflicts and promoting stability among nations.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678652/2f80cb191ad24163b9a0d4cbc53a3a07.mp3"}, {"id": 2132, "name": "Coffee", "phrases": ["the second largest commodity", "the world", "east Africa", "the Pacific", "the Dutch", "a number", "the coffee", "a variety", "the one plant", "the low side"], "eng": "As you probably know, coffee is the second largest commodity by traded value in the world after oil. You probably also know that it's grown in Brazil, but you may not realize that it's not native to that country. It originated in East Africa. So if it came from there, how did it cross the Pacific? Well, the Dutch took coffee to a number of different places around the world, including South America, where it thrived. Nowadays, all the coffee cultivated in Brazil comes from that one seedling, which was of a variety called Robusta. Robusta Now, because it all comes from the one plant, genetically, Robusta isn't particularly varied, Robusta which unfortunately means its resistance to disease is, well, rather on the low side. And well, this is exactly what has happened recently. A pathogen called coffee rust is ravaging coffee crops across South America. So what it looks like is that the price of coffee is, well, going to skyrocket on the wholesale market, unless production is increased dramatically in a short space of time in other countries such as, you know, Vietnam, which seems rather unlikely. So in short, there's a good chance that your morning coffee is going to become, well, quite pricey and pretty soon at that.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656875/cca7644f97e043108c257f4fa094be96.mp3"}, {"id": 2133, "name": "Street art", "phrases": ["an underground art form", "mainstream recognition", "the graffiti trend", "the 1960s", "public spaces", "an expression", "social frustration", "the decades", "street art", "a wide variety"], "eng": "Streetheart developed from an underground art form into something which has achieved mainstream recognition and acceptance. It has its origins in the graffiti trend, which became popular in cities in the 1960s. 20 60 At that time, adding graffiti to public spaces was most definitely considered to be an act of vandalism. Indeed, it was hardly viewed as art at all, but rather as an expression of social frustration. However, over the decades, street art has developed artistically. Street artists have taken their inspiration from a wide variety of cultural influences, including hip hop music and graphic design trends. Nowadays, many urban centers have colorful, large scale wall paintings displaying uplifting or socially responsible messages. For this reason, street art is now viewed as part of the urban landscape and in some cases is a source of local pride. The street art projects I've just mentioned are, of course, officially approved schemes. However, some designs still appear on the sides of buildings without legal permission, and that's why street art is still a controversial art form. Nevertheless, it is now broadly accepted to the extent that some street artists have even achieved the same level of fame as celebrated artists in other creative fields.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658782/5d110e64bb194d0096a1fb931bd44cc4.mp3"}, {"id": 2134, "name": "Loss leader strategy", "phrases": ["a profit", "the goods", "the case", "the loss leader", "a strategy", "“ ” Basically", "new products", "introductory price", "the idea", "the low price"], "eng": "Now, as we all know, companies usually set out to make a profit on the goods and services they sell. However, that's not always the case. So today we're going to look at a strategy called the loss leader and why companies may decide to use it. “ ” Basically, a loss leader is a product or service that the company is willing to sell at a very low price, even though it will lead to a financial loss. “ ” For instance, brand new products are often sold at a special promotional or introductory price. introductory price The idea is that this low price will help spread the word about the product, so in essence, it serves as a form of marketing. The low price will tempt people to at least try it once, and then if the products are hit, there will be enough loyal customers that will continue to purchase it even once the company has increased the price. So the rationale is that the short-term loss is worth the potential long term gain. However, it should be noted that this strategy is of course highly risky. After all, there's nothing stopping customers from switching to other brands once the introductory price disappears. And obviously any decision which involves a financial loss has to be carefully calculated. Large companies may have the financial power to take this sort of risk, but for a new or small company, the financial implications are huge.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658783/73539a3ce85d46bf922c3b1b795c50f5.mp3"}, {"id": 2135, "name": "Sources of protein", "phrases": ["current way", "the environment", "total greenhouse gas emissions", "food system", "the agricultural land", "cook food", "flexible approach", "damaging effect", "the greenhouse gas emissions", "more plant-based foods"], "eng": "Our current way of eating is not sustainable, neither for our health nor the environment. Our food system, which relies on the production of meat, eggs and dairy products as sources of protein, generates 15% of total greenhouse gas emissions globally. 15% It also requires 70% of the agricultural land on Earth. 70% We need to change how we produce, transport and cook food. Studies show that taking a more flexible approach to the way we obtain protein can allow our diets to have a significantly less damaging effect on the environment. Specifically, it can bring the greenhouse gas emissions down by more than 50%, 50% and we can do this easily by having more plant-based foods and less meat. This should be viable as more and more alternatives to traditional sources of protein are becoming more widely available. Beans, wheat, nuts, and even insects all have a lower impact on the environment and along with the promising development of meat grown in labs, they give us the opportunity to dramatically reduce greenhouse gas emissions compared with those produced by meat production, as long as they are both readily available and affordable for the public, we should be able to flexibly switch between traditional and alternative sources of protein.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657019/8c9699300ea44b499ca43f0a0b0ec423.mp3"}, {"id": 2136, "name": "Question Bank", "phrases": ["the relationship", "the interior", "several ways", "an office", "a working environment", "the simplicity", "knock-on effects", "increased productivity", "minimum cost", "office space"], "eng": "We need to consider more closely the relationship between the interior of a building and its influence on an individual, because interior designers should evaluate the direct outcome their proposals can have on an employee. Design can affect them in several ways. Firstly, setting aside spaces for plants in an office is linked to worker well-being and performance. Research has shown that the simplicity of having plants in a working environment positively affects air quality. Air that is more filtered than has knock-on effects such as increased productivity, greater concentration and a reduction in stress. This clearly shows that at minimum cost to companies, working performance can be improved. The second one is not as cost effectively, it concerns office space. While an open plan office is seen to promote interaction and boost communication and productivity, this isn't always true. I think it has now been proven that it can go the opposite way. Open plan offices lead to a lack of face-to-face communication and an over-reliance on electronic interactions as staff feel vulnerable and exposed and less inclined to share ideas. Finally, it seems clear that the interior of a building directly affects performance at work. Therefore, we should not underestimate how work culture is affected by office design.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657239/a6d707af7a0e41d397907c8d3c5521ac.mp3"}, {"id": 2137, "name": "Skill-based curriculum", "phrases": ["a broad agreement", "the skills", "many people", "cross-disciplinary skills", "an incredible rate", "no one individual", "the biggest challenges", "the school syllabus", "most assessments", "knowledge content"], "eng": "There's a broad agreement that the skills that children will need in the future are different from those that their parents needed in the past. And many people now believe that cross-disciplinary skills, things like critical thinking or collaboration or problem-solving are going to be necessary to survive in the future. We can already see that information and knowledge are increasing at an incredible rate, such a rate, in fact, that no one individual can ever hope to learn everything they need to know about every subject and stay truly up to date. What they need are the skills to locate knowledge, and then use that knowledge in jobs. Bear in mind that those jobs may not even exist yet. Now, this may be the case, but one of the biggest challenges with delivering cross-disciplinary skills in the school syllabus is that many teachers were trained to teach knowledge, facts rather than skills. Most assessments work with knowledge content. If we are to change the skills that children leave school with, we need to go through a phase of transition that some of those in the education profession feel deeply uncomfortable with.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658773/fb4440efe7034cc18c7d22c1b0818793.mp3"}, {"id": 2139, "name": "Child-rearing", "phrases": ["many people", "the development", "a recent research study", "the case", "the home", "the children", "the research", "no difference", "a small number", "a situation"], "eng": "Many people believe that it's always better for the development of very young children under the age of three to be cared for within the home. But a recent research study in the us suggests that this is not always the case. Being cared for outside the home can actually bring benefits if the children can build relationships with the workers who look after them and they have the opportunity to develop skills. The research also suggests that it makes no difference if one child is looked after by one person or if they're part of a group of children in a place that's similar to a sure. And we can say for sure that a situation where each member of staff looks after a small number of children is often very positive for the children involved.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658776/654b306f1a8c43b19887f90dc1ce0a66.mp3"}, {"id": 2141, "name": "Smart skin", "phrases": ["the development", "stretchable electronics", "an electronic skin", "various bodily processes", "clear real time monitoring", "elite athletes", "one thing", "electrolyte levels", "the body", "multiple functions"], "eng": "So the development of stretchable electronics or smart skin has long been dreamed of, but it's now become a reality. It is basically an electronic skin that can be worn in order to monitor various bodily processes. It's proving particularly popular with elite athletes during training as it allows clear real time monitoring. One thing that athletes particularly like to monitor is their electrolyte levels. Electrolytes are minerals in the body that have multiple functions in keeping our bodies running healthily. So it's very important to maintain their levels. The smart skin is able to analyze these from a person's sweat. If levels are low, then athletes need to take care and slow down. This instant analysis means that a person has the information at their fingertips, so to speak, and can make decisions before there's an adverse effect on their health. Another way the smart skin is being used is to monitor a person's heartbeat by showing a visual wave, rather like having a heart monitor strapped to your arm, but a lot more portable and comfortable. These are just two applications, but scientists are already starting to explore the myriad uses for this technology.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658779/a0035877a5fa4c3ca287baa6b28e7077.mp3"}, {"id": 2142, "name": "Iconoclast", "phrases": ["innovative thinkers", "the iconoclast", "the term iconoclast", "vital question", "a business context", "the fact", "a company", "average person", "continued exposure"], "eng": "So moving on with our studies on innovative thinkers, let's now consider the iconoclast. “ ” An iconoclast can be defined someone who challenges established ideas and beliefs. Put simply, it's someone who hasn't stopped asking that vital question, why the term iconoclast is often used negatively. “ ” “ ” But in a business context, an iconoclast can be indispensable. The fact that they ask this question of established procedures and methods means that they may be able to uncover chinks in a company's armor and find efficiencies that their colleagues are oblivious to. It has long been known that your average person tends to stop questioning something if they are increasingly exposed to it. Iconoclasts may see through this with searing clarity and are unlikely to tolerate continued exposure. Rather than force them to conform, businesses do well to listen to them.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658781/a3676c7b1f8a4acc82ef108e322ad851.mp3"}, {"id": 3787, "name": "Bees' genes and Darwin", "phrases": ["A healthy hive", "the egg-laying machine", "the queen", "2500 eggs", "the worker bees", "the bulk", "a typical hive", "30000 bees", "100 Drones", "the workers"], "eng": "A healthy hive of honeybees functions like a perfect and fluid organism; at the center of all activity is the queen, the egg-laying machine. —— The queen is actually a slave to her duties, laying up to 2500 eggs a day, as many as two million in her lifetime. 2500 200 The worker bees are all female and make up the bulk of the colony. In a typical hive of 30000 bees, only about 100 are males called drones, with oversized eyes and bulky bodies. 100 Drones are not equipped to gather pollen or nectar and must rely on the workers to feed them. The invaluable work bees do takes its toll in the summer. Workers only live around 30 days, literally work to death. 30 “ ” But the hive is constantly replenished with new generations of bees ready to go to work from the moment they hatch.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691666/f00e8f53ad104a42923abaf13654a0c4.mp3"}, {"id": 3788, "name": "Credit card experiment", "phrases": ["inactive credit card users", "A recent study", "the other group", "one group", "the potential loss", "the potential benefits", "a stronger motivator", "the fear", "important implications", "inactive customers"], "eng": "A recent study on customer behavior investigated the impact of different messaging strategies on inactive credit card users. One group was presented with a message emphasizing the benefits they could enjoy by using their cards, while the other group received a communication implying a penalty for non-use. Surprisingly, the results revealed that customers were more influenced by the potential loss of not using the card than the potential benefits of using it. “ ” “ ” This suggests that the fear of missing out or facing a penalty may be a stronger motivator for customer action than the promise of rewards. These findings have important implications for businesses and marketers seeking to engage inactive customers, indicating that messaging focusing on potential losses or penalties may be more effective in encouraging customer activity. Further research in this area could lead to a better understanding of consumer decision-making and the psychological factors driving behavior.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691680/c5b7e21242ed45fbb17babb92050becd.mp3"}, {"id": 3789, "name": "Journalism and internet", "phrases": ["the New Mexico Independent", "an online news site", "some great benefits", "new Mexico", "the Internet", "amazing medium", "some time", "other things", "a newspaper", "all online"], "eng": "David Olivia Garcia is a co-host of New Mexico in Focus and is also the managing editor for the New Mexico Independent, which is an online news site. · · New Mexico in Focus “ ” New Mexico Independent He says that the Internet has some great benefits for journalism. The Internet is this new, amazing medium. Not so new: it's been around quite some time now. But it's maturing as, among other things, a place for journalism. In a sense, the Internet allows you to tell stories better than in a newspaper or on television. For this reason, you can do it all online: you can have the written word, you can have still photographs, you can have video. You can link and kind of connect to the other journalism that has been done on a given topic. So it's not like you're in a vacuum. The Internet has had a negative impact on these papers. However, John Fleck, who is a columnist for the Albuquerque Journal and also has his own blog, says that he doesn't think that's entirely the case. Albuquerque Journal · It really makes me more efficient as a journalist in terms of information gathering, confirmation, helping me get the background necessary to write a story. So it's really good for that.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691682/67f174d0fbc64dd0aaac9c49ad92d8fb.mp3"}, {"id": 3790, "name": "Sleep", "phrases": ["a new discovery", "a good thing", "a bad thing", "the memory", "the information", "good things", "bad things", "the save button", "the brain", "a dry sponge"], "eng": "This is a new discovery about learning and memory. It is a good thing for you to get enough sleep, and a bad thing for you if not. People need to sleep before learning, and people also need to sleep after learning. When you are asleep, the memory can consolidate all the information into your brain. From this point, it may only get worse. Not only will I tell you about the wonderfully good things that happen when you get sleep, but the alarmingly bad things that happen when you don't get enough both for your brain and your body. Let me start with the brain and the functions of learning and memory, because what we've discovered over the past 10 or so years is that you need sleep after learning to essentially hit the save button on those new memories so that you don't forget. “ ” But recently, we discovered that you also need sleep before learning and now to actually prepare your brain almost like a dry sponge, ready to initially soak up new information. And without sleep, the memory circuits of the brain essentially become waterlogged, as it were. And you can't absorb new memories.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691683/fff7d4700ed84c6b9b5b52ba52ce04f6.mp3"}, {"id": 3791, "name": "Telescope", "phrases": ["a little bit", "a telescope", "a couple", "good things", "larger telescopes", "quantum mechanical effects", "a little telescope", "the other thing", "modern digital detectors", "the same sensitivity"], "eng": "So let's just talk a little bit about a telescope. Our eye is the telescope we all are used to. It's a little tiny five millimeter telescope, and it serves us very well. But if we make telescopes bigger, we get a couple of good things. We have larger telescopes and they collect a lot more light so we can see things that are fainter. But it turns out they greatly improve detail. And that's because of the nature that light is a wave, and wave effects are what we call quantum mechanical effects, meaning that when you use a little telescope to look at waves, it becomes blurry through what we call diffraction. “ ” And so larger telescopes are extremely useful to improve detail. The other thing that telescopes allow us to do is to put modern digital detectors behind them. Our eye is about the same sensitivity as a photographic plate. A photographic plate can be sat there and it can look at the sky for an hour so it can see fainter. But modern digital detectors are almost 100 times more efficient than our eyes at collecting light. 100 And so you can improve things by a factor of 100. 100 That's like building a telescope ten times bigger. 10 And so that improvement has been one of the things that's allowed astronomy to do so much in the optical regime in the last 30 years. 30", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691687/aa4905fb2e8c4da485dafb8801dfb653.mp3"}, {"id": 3792, "name": "Australian immigration", "phrases": ["the present indigenous people", "the first inhabitants", "several successive waves", "distinct peoples", "time frame places presence", "the upper range", "the closing stages", "the Pleistocene epoch", "some 100 –", "extended glaciation"], "eng": "The first inhabitants in Australia were the ancestors of the present indigenous people. Whether these first migrations involved one or several successive waves and distinct peoples is still subject to academic debate, as is its timing. The minimum widely accepted time frame places presence of humans in Australia at 40,000 to 43,000 years Before Present, while the upper range supported by others is 60,000 to 70,000 years BP. 4 4 3 6 7 In any event, this migration was achieved during the closing stages of the Pleistocene epoch, when sea levels were typically much lower than they are today. Repeated episodes of extended glaciation resulted in decreases of sea levels by some 100–150 m. 100 150 The continental coastline therefore extended much further out into the Timor Sea than it does today, and Australia and New Guinea formed a single landmass (known as Sahul), connected by an extensive land bridge across the Arafura Sea, Gulf of Carpentaria and Torres Strait. “ ” The ancestral Australian Aboriginal peoples were thus long established and continued to develop, diversify and settle through much of the continent. As the sea levels again rose at the terminus of the most recent glacial period some 10,000 years ago, the Australian continent once more became a separated landmass. However, the newly formed 150 km wide Torres Strait with its chain of islands still provided the means for cultural contact and trade between New Guinea and the northern Cape York Peninsula. 150 During the 1970s and 1980s around 120,000 southern Asian refugees migrated to Australia. 20 70 80 12 During that twenty years, Australia first began to adopt a policy of what Minister of Immigration Al Grassby termed \"multiculturalism\". · “ ” In 2004–05, Australia accepted 123,000 new settlers, a 40% increase over the past 10 years. 2004 2005 12.3 40% The largest number of immigrants (40,000 in 2004–05) moved to Sydney. 2004–05 4 The majority of immigrants came from Asia, led by China and India.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691689/5d47bce3664d4b28a389d76a23a1b8d7.mp3"}, {"id": 3793, "name": "Tutorial", "phrases": ["the tutors", "the difference", "300 students", "the skills", "time management", "each group", "the tutorial", "the rest", "the students", "the advice"], "eng": "If we need help before the tutorial, we can email any of the tutors and they will provide us with help. The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students, whereas in tutorials it's about five to 15 students, 200 300 5 15 which allows you to discuss matters, put your hand up and talk to your tutors about any difficulties you may have with the subject. The skills that I have developed through participating in these tutorials include time management, critical thinking, being able to work better in a group and improving my confidence to speak up in a group. At the end of a tutorial, each group will have to give feedback on what they've been discussing throughout the tutorial. So this may consist of having to present to the rest of the students in the class and it allows me to improve my group working skills and also working in a group allows us to generate more ideas and discuss the topic in more depth. The advice I have for potential University of Edinburgh students to make the most out of your tutorial sessions is to complete the reading that you're given by your tutors beforehand. This will enable you to discuss more in groups and generate more ideas. It's also beneficial to raise your hand and develop your confidence so that you can have better discussions in class.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691721/0dd9b2056b08481093188a6a3dba899c.mp3"}, {"id": 3794, "name": "Implicit and explicit memory", "phrases": ["a little bit", "different systems", "the memory", "everyday life", "the bulk", "procedural memory", "social norms", "a certain thing", "a classroom", "all things"], "eng": "So I'm going to talk a little bit briefly about different systems of memory. And in fact, much of the memory that influences and guides our everyday life actually kind of hides in the background. You actually don't know that you're using the bulk of your memory. And this is called implicit or procedural memory. This includes things like cultural and social norms. So kind of understanding how you're supposed to behave in a classroom or expecting a certain thing to happen when you walk into a restaurant. These are all things that we've learned and acquired over our years, but it's not necessarily something that we think about. Language also, in many aspects, is something that is fairly automatic and that we've acquired and use very naturally, and other learned skills such as reading or driving. These are things that might have been effortful at one time, but now they just come very easily and automatically to us. And in fact, if you actually try to describe to somebody how you drive or how to drive, you actually kind of mix you up. So these are in a lot of cases, consciousness kind of gets in the way of a lot of these aspects of implicit memory. Now, when we're talking about our memory, so for instance, people tell me a lot that their memories are bad. “ ” When people are saying when they talk about their memory, they're usually talking about explicit or episodic memory. And these are very different from implicit memories. These are memories that have a very specific tag of space and time. These are highly personal memories, usually. So this could be everything from remembering what you ate for breakfast to what you did on your last vacation, or remembering a significant birthday that you had several years ago, or... Or just an answer to a multiple choice question on a test. ……", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691690/82afaea0935c441ba323b7e59285e036.mp3"}, {"id": 3795, "name": "Biggish city", "phrases": ["a biggish city", "the problems", "another lecture", "the population", "the thousands", "the earliest theorists", "an ideal city", "the same figures", "leonardo da Vinci", "thousand inhabitants"], "eng": "We have briefly looked at some of the problems involved in running a biggish city like, say, Melbourne, keeping the road and rail systems running, policing, providing food and housing, and so on. In another lecture, I'm going to deal with what we must now call megalopolis-cities with populations of ten million or more. “ ” —— However, first I want to go back in history to when the population of cities could be numbered in the thousands rather than millions. One of the earliest theorists of the city was, of course, Plato, who created an ideal city in his text, The Republic. The population of this city would be around twenty-five to thirty thousand at most. Oddly enough, the same figures were chosen by Leonardo da Vinci for his ideal cities. · · Now, of these twenty-five to thirty thousand inhabitants, only about five thousand would be citizens. A reason for this might be that it is the largest number that could be addressed publicly at one time and by one person, and makes a voting system much easier to manage. Also, perhaps the numbers are kept deliberately low because a large population would be harder to control, or because, in practical terms, fewer inhabitants are easier to feed from local supplies without having to depend on outside sources.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691694/829404ecaf9e4b748ec0d14937d3ff28.mp3"}, {"id": 3796, "name": "Organizational study", "phrases": ["some organization studies", "a management specialist", "leadership skills", "leadership Development", "the interpersonal competencies", "the public sector", "the private sector", "everyone needs", "strategic goal", "organization studies courses"], "eng": "It's really recommended that everybody take some organization studies courses even if you're not planning to become a management specialist. These courses will provide leadership skills that we've got courses such as Rosens' Leadership Development. They're going to give you the interpersonal competencies and skills to advance in your career. So I think org (organisation) studies give people a place to go into a number of different careers, be it in the public sector, the private sector or a nonprofit. I think everyone needs to understand how organizations are structured, how they function and how people interact. And then to get to your strategic goal. It's really important to take organization studies courses. And I know it's a bit of a hard sell for a lot of students who are appearing in it. But over and over, alumni come back to me and say, you know what, the most important course I've ever taken was organization studies. “ ” And I really wish I took it more because those are the skills that really help me move up in my career. So those are the competencies or political skills for understanding myself for knowing how to work with difficult people, for knowing how to manage my boss, knowing how to structure the organization, knowing how to create sustainable competitive advantage. And those are the skills that really differentiate people who are going to have long term successful careers.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691704/ea2895ae34c941a68ee5f446fa1ec559.mp3"}, {"id": 3797, "name": "Leadership", "phrases": ["an executive order", "an interesting idea", "the coercive threat", "quiet persuasion", "martin Luther King Jr", "a charismatic leader", "the power", "the leader wields", "a spectrum", "the United States"], "eng": "A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. · · We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\" more often, however, top leaders have been quite visible in their exercise of power. · “ ” Women (as well as some men) have provided casual, low-key leadership behind the scenes. But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691706/4f9828223de242e4801b4278efe062e8.mp3"}, {"id": 3798, "name": "Population growth", "phrases": ["population matters", "the world", "the kind", "the population", "obvious point", "the world population", "million people", "global climate change", "a challenge", "all problems"], "eng": "I hereby do not even need to elaborate too much why I think it is that population matters in the world. These are the kind of topics which are normally cited when thinking about the population, its challenges, its problems, its opportunities, and its own problems. After all, pressure on resources is a very obvious point. When the world population has now reached 7 billion and is increasing by 7 to 8 million people per year, a diminishing number of course. 70 700 800 But nonetheless it's still quite a challenge, particularly when global population is almost certain to add another 3 billion to that 6 billion with all kinds of questions as to the adequacy of resources, water, particularly in global climate change, but also food and other aspects of resources. 60 30 These are all problems of security because this growth will not be equally distributed between different parts of the world. Some parts of the world will grow. Other parts of the world will shrink. The balance of power, therefore, will correspondingly change for demographic reasons, as we will see. Urban growth is remarkable. We already have megacities of 20 million people. These are going to grow even further in due course. 2000 One wonders just how far they can grow before certain aspects of the infrastructure start breaking down.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691707/710547712b92434399f9d43e15b77389.mp3"}, {"id": 3799, "name": "Climate change in Australia", "phrases": ["sea levels", "the consequences", "every hundred years", "several times", "climate change", "“ ” Climates", "more drought", "the biggest issue", "the biggest concern", "the larger cities"], "eng": "Sea levels are rising and the consequences could be huge. By the end of this century, areas that only flood once every hundred years could start to flood several times every year. The rising sea is the sleeping giant of climate change. “ ” Climates may change, you might have more drought, and you might have more rain. But I think for me, the biggest issue, the biggest concern is what we'll do in the coming centuries. Unfortunately, many of the megacities in the world, and that also applies to the larger cities in Australia, have been built in low-lying areas. That means much of the world's population will eventually have to deal with sea-level rise. The question is, how high will the waters get? Well, we go to the remote northwest of Australia and make a disturbing discovery. According to this geologist's work. Sea levels could ultimately go up by a staggering nine meters.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691712/0c9d23d1985a4ec5abe19da7d8a491f2.mp3"}, {"id": 3800, "name": "Trust levels", "phrases": ["the extent", "economy platforms", "the last 40 years", "uber Airbnb", "5 Americans", "35 today", "a heightened level", "a digital interface", "a digital platform", "a generation"], "eng": "I'm fascinated by the extent to which sharing economy platforms like Uber and Airbnb are getting Americans to trust each other again. Uber Airbnb Over the last 40 years, the level of trust in society has fallen quite dramatically. 40 Less than 1 in 5 Americans under the age of 35 today feel that people are trustworthy in general. 35 But in parallel, we've developed a heightened level of trust in strangers who we meet through a digital interface. There's a generation that has grown up reading Yelp reviews, reading Amazon reviews, making their consumption choices based on what strangers on a digital platform say. Yelp And so someone who we interact with who comes accompanied by online reviews, a Facebook and LinkedIn profile, and other digital cues seems to be someone we'll trust at the level of friends and family. Facebook LinkedIn What excites me about this transition is that through history every time society has created a new basis for trust, it has expanded the economy dramatically. So I'm looking forward to seeing, as we trust our Uber drivers more, how this expands the world's economic activities and the possibilities for trade. Uber", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691714/41cb136a16d5432bb3f9f07c63944920.mp3"}, {"id": 3801, "name": "Underestimated women", "phrases": ["own abilities", "objective criteria", "the workforce", "the last two years", "other external factors", "a good job", "the corner office", "the side"], "eng": "Women systematically underestimate their own abilities. If you test men and women and you ask them questions on totally objective criteria, like GPAs, men get it wrong slightly high, and women get it wrong slightly low. Women do not negotiate for themselves in the workforce. A study in the last two years of people entering the workforce out of college showed that 57 percent of boys entering or men, I guess, are negotiating for salary, and only 7 percent of women. 57% 7% And most importantly, men attribute their success to themselves and women attribute it to other external factors. If you ask men why they did a good job, they'll say, I'm awesome. If you ask, obviously. Why are you even asking? “ ” If you ask women why they did a good job? What they'll say is someone helped them they got lucky, they worked really hard. “ ” “ ” “ ” Why does this matter? Boy, it matters a lot. Because no one gets to the corner office by sitting on the side, not at the table, and no one gets the promotion if they don't think they deserve their success, or they don't even understand their own success.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691715/7f4a0d79a23c4b87a2a0654184ba1fc2.mp3"}, {"id": 3802, "name": "Basic social values", "phrases": ["many basic social values", "a nutshell", "a great deal", "the kind", "basic level", "the world", "the unloving side", "different ways", "traumatic social problems", "the AIDS epidemic"], "eng": "But I think just to put it in a nutshell, that many basic social values are passed on unconsciously, already in babyhood. Adults convey a great deal to babies about the kind of society they're living in. And, you know, the most basic level, for example, whether the world is supportive and safe or challenging and dangerous. And all of us in different ways are working with the unloving side of society in a way and trying to find ways to offer a more caring response. And particularly those people who are working in Africa are often doing really cutting-edge work in dealing with traumatic social problems such as the AIDS epidemic, the aftermath of war, homelessness and so on. Whilst probably the majority of you who've actually made it here today are putting your creative energy into, I'm sure, wonderful, but probably more tried and tested kind of projects.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691718/3c2e77f6064d4fa58337cd83a5480abe.mp3"}, {"id": 3803, "name": "Experiment on climate change", "phrases": ["many challenges", "climate change", "noticed climate change", "an experiment", "30 Humans", "the observation", "the climate system", "A method", "10 degrees", "the century"], "eng": "Humans are faced with many challenges, one of which is climate change. An experiment was conducted on the environment and climate in the 1930s when people first noticed climate change. 20 30 Humans have been trying to change their lifestyles to deal with it, but the observation of climate change is difficult from area to area. A method is introduced to help understand the mechanism of the climate system. Researchers predict that temperatures will increase about two to 10 degrees Fahrenheit by the end of the century. 2 10 What's less certain is what rising temperatures mean for the planet. Some climate models predict subtle changes. Others forecast rising sea levels, which could flood coastal areas around the world. Weather patterns could change, making hurricanes more frequent. Severe droughts could become more common in warm areas, and species unable to adapt to the changing conditions would face extinction, although much remains to be learned about global warming. Many organizations advocate cutting greenhouse gas emissions to reduce the impact of global warming. Consumers can help by saving energy around the house, switching to compact fluorescent light bulbs, and driving fewer miles in the car each week. These simple changes may help keep the earth cooler in the future.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691719/b572ab058a1f4494b40d0926ab105f57.mp3"}, {"id": 4442, "name": "Stock market and business", "phrases": ["the stock market", "a public company", "the supermarket", "a brokerage account", "the major stock market indexes", "the term", "some different uses", "the 18th century", "the market", "traditional companies"], "eng": "The stock market is where investors connect to buy and sell investments - most commonly, stocks, which are shares of ownership in a public company. When you need groceries, you go to the supermarket. When you're ready to buy stocks or mutual funds, you'll usually buy them online through the stock market, which anyone can access with a brokerage account or employee retirement plan. The term 'stock market' often refers to one of the major stock market indexes. “ ” However, there are some different uses of the stock market before and after. In the 18th century, manufacturing companies came into the market. Traditional companies used stocks to raise money, and input money into companies, while modern companies used stocks to output money. 18 From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently. 19 20 The stock market also inclined to put money into big companies.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693053/2aa766ab77a5453fb30c5b4831898e08.mp3"}, {"id": 4443, "name": "Citizenship curriculum", "phrases": ["a subject report", "last month", "the citizenship curriculum", "the report", "a long way", "national curriculum requirements", "appropriate provision", "the curriculum", "other subjects", "the progress"], "eng": "Last month I published alongside my annual report a subject report on the development of citizenship in schools. The report celebrates the success of some schools in implementing the citizenship curriculum. It praises those schools where there have been substantial developments in the subject, and which now go a long way towards fulfilling national curriculum requirements. In the report, we are critical of schools which have not taken citizenship seriously, either through reluctance or lack of capacity to make appropriate provision in the curriculum. Citizenship is marginalized in the curriculum in one-fifth of schools. It is less well established in the curriculum than other subjects, and less well taught, and some critics have seized on this as a reason for wanting to step back from supporting it. Yet, the progress made to date by the more committed schools suggests that the reasons for introducing citizenship are both worthwhile and can be fulfilled, given the time and resources. Indeed, those reasons are given added weight by national and global events of the past few months. While not claiming too much, citizenship can address core skills, attitudes, and values that young people need to consider as they come to terms with a changing world. The main problems standing in the way of implementation of citizenship continue to be: the lack of commitment on the part of many school leaders; and insufficient amount of initial and in-service training provision to ensure that every school can call upon teachers with subject expertise; and its uncertain place in the curriculum.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693662/79481a8bee0f464592ed1dc62a56b48a.mp3"}, {"id": 4444, "name": "Amory Lovins", "phrases": ["amory Lovins", "an unusual character", "a wide range", "outside Snowmass", "the side", "iconic plastic oddball genius", "elizabeth Kolbert", "some time", "· Elizabeth Kolbert ·"], "eng": "Who knows who Amory Lovins is? · Amory Lovins Nobody. Amory Lovins is an unusual character. · He is something of polymath. Just to say, he is sort of him of knowledge across a wide range of fields. He’s not an academic. He has a consulting company which he runs off until huge recently out of his home in Colorado. He is outside Snowmass in a house built into the side of the mountain that has no furnace. For that 30 years, he has been kind of iconic plastic oddball genius, thinking of ways to save energy, thinking of ways to solve problems using technology that already exists. 30 And he has demonstrated several of them. He also offers he is something that he is such of oddballs that people tend to think he is kind of crazy. Anyway, Elizabeth Kolbert, went to spend some time with Amory Lovins. · Elizabeth Kolbert · And so he has written his pieces called Mr. Green. Mr. Green", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693663/18d72b305df8407fbaf00ef56d462ec1.mp3"}, {"id": 4445, "name": "Einstein", "phrases": ["all sorts", "the universe", "the other heavenly bodies", "the stars", "einstein ’ s work", "the 20th century", "all celestial notions", "a continuous dynamic change", "the larger scale", "a prediction"], "eng": "For thousands of years, philosophers and astronomers and thinkers of all sorts have imagined that the universe, the space around us, was rather like this floor in front of us. —— —— It was fixed and unchangeable, and things happen on it, just as people walk around. So the stars, the comets, and the planets, and the other heavenly bodies moved around and traced down their parts on this completely unchanging stage of space. In the 20th century, as the result of Einstein’s work, that view of the universe was completely transformed. 20 We began to understand that there was no absolutely fixed stage of space at all on which all celestial notions were played out. But in some sense, on the larger scale in the universe, the space itself was in this state of a continuous dynamic change. That was a prediction made by Einstein. But it was the astronomer Edwin Hubble who is the owner of the honor of making the discovery that our universe was really like that. · Edwin Hubble", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693664/b44c4c30aa5340068ffe6941389057a0.mp3"}, {"id": 4446, "name": "International environmental law", "phrases": ["international environmental law", "the sovereign states", "“ ” United Kingdom", "the environmentalists", "the main concern", "the reign", "detailed legislative controls", "all areas", "any appropriate enforcement", "little practical effect"], "eng": "Before we consider international environmental law and climate change we need to consider domestic legislation, as it is within the sovereign states that international law is put into practice. This reflects the environmentalists' maxim, 'think globally act locally.' “ ” United Kingdom legislative control over the impacts of man's activity on the environment is not new. As long ago as the reign of Charles II the main concern was the production of smoke from the burning of sea coal. Almost all areas of trade and industry were subject to very detailed legislative controls at that time, although some were governed by 'self-regulation' in the form of guilds, which regulated both supply and methods of production. “ ” However, the measures implemented were mostly ineffective because then, as now, the specifying of legal duties and standards without providing any appropriate enforcement merely indicated good intentions but were of little practical effect. The next stage was prompted by the Industrial Revolution with the urbanization of society and its profound effects on the environment. Local industrialists used the Adam Smith model to maximize their economic benefit, but this was to the detriment of the local environment with the operation of 'Gresham's Law' that is, the bad drives out the good. · “ ” Those industrialists who were concerned for either the health of their employees or the local environment faced higher costs than their competitors. The result was the need for increasingly comprehensive statutory controls on the discharge of pollutants into various receiving media.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693669/c30f61d5f398497abcf3cc4e7b004942.mp3"}, {"id": 4447, "name": "Development of genes", "phrases": ["the last 200,000 years", "the human minds", "genes changes", "the penetrating", "the genetic differences", "500,000 years", "small number", "powerful minds"], "eng": "The pace, the pace of which that the human minds have evolved over the last half million years and more recently the last 200,000 years has been so frighteningly rapid that the evolution of cognitive function and perception in different ways, can only happen to the actions of a small number of genes. If one needed to adapt a dozen of genes changes and concert, in order to acquire the penetrating minds that we now have, which our ancestors 500,000 years ago didn't have, the evolution could not have taken, could not have occurred so quickly. And for that reason alone, one begins to suspect that the genetic differences between people who lived 500,000 years ago sever that cognitive functions than ours are not so large. Therefore, a rather small number of genes, maybe responsible for comforting us that powerful minds which we now, which the most of us now processed.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693670/a937d5e8c5b74337ac2aaa610ab4d062.mp3"}, {"id": 4448, "name": "Drug ads", "phrases": ["money drug companies", "the amount", "a prescription drug", "no wonder", "patty Neighmond reports", "the Annals", "drug ads", "prime time", "high cholesterol", "the drug industry"], "eng": "The amount of money drug companies spend on TV ads has doubled in recent years. And it's no wonder: studies show the commercials' work: consumers go to their doctors with a suggestion for a prescription drug they saw advertised on TV. —— Now a study in the Annals of Family Medicine raises questions about the message these ads promote, NPR's Patty Neighmond reports. NPR · You're most likely to see drug ads during prime time, especially around the news. Researchers analyzed 38 ads aimed at people with conditions like hypertension, herpes, high cholesterol, depression, arthritis, and allergies. 38 The drug industry says the ads arm consumers with information. But researchers found that though the information was technically accurate, the tone was misleading. UCLA psychologist Dominick Frosch headed the study. · \"What we would see in these ads is that before taking the prescription drug, the character's life was out of control and the loss of control really extended beyond just the impact of the health condition,\" “ ” For example, herpes patients were portrayed as being incapacitated for days, insomniacs utterly out of synch on the job and depressed patients friendless and boring at parties. \"When the character is then shown taking the drug, he then magically regains complete control of his life.\" “ ” None of the ads, of course, mentioned lifestyle changes that could also help treat the condition. After all, it's mass marketing. But in this case, Frosch says, prescription medications are not like soap.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693671/cc9481aecafb4e9c860d593bbf98d849.mp3"}, {"id": 4449, "name": "Vitamin D", "phrases": ["the fat-soluble vitamins", "vitamin D", "the “ sunshine vitamin ”", "no dietary need", "the real important word", "a big question", "the fortification", "D So Vitamin D", "the Vitamin", "skin exposure"], "eng": "So today we're going to finish talking about the fat-soluble vitamins. I'm going to start with Vitamin D. D And I think probably most of you know that Vitamin D is called the “sunshine vitamin”. D “ ” And it's called that because there's absolutely no dietary need for vitamin D if you get adequate sunshine. D And the real important word there is “it” because it turns out that in climates which aren't near the equator there's a big question as to whether or not using these you get adequate sunshine. “ ” And that's important because foods are not naturally abundant in vitamin D. D And that's why milk is fortified but the fortification may not be enough. D So again just exposure to sunlight is adequate, no need for vitamin D. D So Vitamin D really isn't the Vitamin, it's a prohormone when human beings evolve, we evolved in tropical climates and ran around naked. D There was plenty of skin exposure to sunlight and so there was no dietary need for Vitamin D. D As humans migrated away from that tropical regions, they actually created a need for Vitamin D in food because sunlight was inadequate, particularly during the winter. D", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693677/d0285a69386540b5a6ef320bc5dd6f7f.mp3"}, {"id": 4450, "name": "Devolution of power", "phrases": ["one aspect", "modifying government", "“ devolution ”", "the State level", "a rationale", "the time", "the New York Times", "a philosophical issue", "the Democrats", "a hidden part"], "eng": "Well, that’s one aspect of what’s called, reducing government - modifying government, to be more precise. “ ” —— Another aspect of it is what’s called “devolution” - reducing - moving governmental power from the Federal to the State level. “ ”—— And that has a kind of a rationale which you hear all over the time - place. For example, there was an op-ed a couple of weeks ago in the New York Times by John Cogan - Hoover Institute at Stanford, who has pointed out what he called a philosophical issue that divides the Democrats from the Republicans. · The philosophical issue is that the Democrats believe in big government and entitlements, and the Republicans believe in getting power down closer to the people, to the States, because they’re kind of populist types. Well, it takes about maybe three seconds’ thought to realize that moving power down to the States, in funding and so on, is just moving it away from the people, for a perfectly elementary reason: there’s a hidden part of the system - of the power system that you’re not supposed to know about, or think about, and that’s private power. —— —— ——", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693678/e503c508e4d445bbb26798aec4cbcb1e.mp3"}, {"id": 4451, "name": "A female novelist", "phrases": ["a novelist", "a little detour", "the intention", "the right thing", "a great novelist", "a big influence", "the time", "every time", "deep breath", "the first chapter"], "eng": "I have been writing non-fiction for years actually, but secretly wanting to be a novelist. When I first started writing at the age of 30, it was with the intention of writing fiction, but I took a little detour for 10 or 12 years, and write non-fiction which I absolutely have no regret about at all. 30 I think it's exactly the right thing for me to do. But there's this dream tucked away inside of me to do this. Now I was remembering reading something that wrote, who is a great novelist from Mississippi who had a big influence on me actually. She said, \"no art ever came out of not risking your neck.\" “ ” And I think she's absolutely right about that. It felt that way to me at the time; it actually feels that way every time I sit down to write something. Finally, in the early 90s, I took my deep breath and started writing fiction. 90 It felt risky to me at the time to do that. And one of the very first things that I wrote was, what I thought was going to be the first chapter of a novel, called \"The Secret Life of Bees.\" I wrote it in 1992, and it is actually essentially the first chapter of the novel as it is now. 1992", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693679/72316ba707434484812af152cc66af73.mp3"}, {"id": 4452, "name": "Globalization", "phrases": ["a few different definitions", "one sense", "international communications", "more trade", "the source", "corporate trade", "a long time", "the continuation", "an economic system", "another way"], "eng": "Globalization, what is globalization? I think that it takes on a few different definitions in one sense of the word. Globalization means proliferation of transactions across country. So, one way of thinking about globalization is a way to describe, increase international communications, more trade happening between countries and be less self-sufficient in providing goods and services to their people and more companies that have offices in multiple countries, which we call multinationals. So, the source of growth in travel and communication and corporate trade across borders. And this way of thinking about globalization is the continuation of thinking that has been around for a long time, such as when the Europeans went to the Orient, to find spices, which was also an example of global trade and communication. Another way to think of globalization though, is an economic system. It is a system in which countries become integrated in a way that never had been before. In this system, we see a global split in the process between consuming and producing goods. Some countries produce goods, some countries consume goods, and then these countries in different areas of the globe depend on each other in a kind of organic solidarity rather than having an economic system being just inside your country. The system is the way economy in your country functions depends on economy of another country. And in fact this way of thinking about globalization represents a new area of economic progression. The past industrialist economy has been a global issue.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693684/01ad1f4ca2904cca99fccb1b969b60ed.mp3"}, {"id": 4453, "name": "A mother’s loan", "phrases": ["43 years", "student loans", "the loans", "the rock slide", "one loan", "“ ” Fifteen years", "sheer horror", "monthly student loan payment", "car payment", "college degree"], "eng": "I'm 43 years old, and I owe tens of thousands of dollars in student loans. 43 Oh sure, I knew the loans were piling up as I went through school. But with one loan coming from here, another from there, I had no idea of the rock slide that was building. “ ” Fifteen years later, I still experience moments of sheer horror regarding my family’s financial situation. My monthly student loan payment is more than triple my car payment. OK, so without my college degree, I would not have been able to get my current job. For that I'm grateful but at what cost? My loans have been accruing at a rate of 10 percent, and now they have burgeoned to well. 10% I'm an English major; you do the math. I don't think they'll ever get paid off. We’re in debt way past our eyeballs, and there's no hope in sight. I'm being kept in class a financial class of graduates whose only hope for attending college meant borrowing money from the government. “ ” Because of our mounting credit card debt and monthly payments that far exceed our family’s income, my kids will also join the class of citizens who can’t rely on their parents for college support. Do I wish I'd chosen another educational route? You bet.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693686/2ea949fda7234e748923c149349cddc7.mp3"}, {"id": 4454, "name": "Governments use tricks", "phrases": ["the truism", "liberal western democracies", "government policy", "many areas", "the world", "“ ” Governments", "the unelected ones", "other events", "every trick", "the book"], "eng": "I suppose it's the truism to point out that citizens need to be well-informed. Maybe it's something we take for granted in our liberal western democracies. But there will be plenty of societies, well, that is run counter to explicit government policy. Many areas of the world still suffer from the reverie of the deliberate missing information. “ ” Governments, especially the unelected ones, but also some elected ones, have denied the events that have ever taken place. They pretend that other events did take place. They would help spin what they cannot deny. Ensure they've used every trick of the book, to pull the eyes of the world, and in an attempt to cover up their mistakes.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693687/c66ab146085f49b2883c4c45fd647efc.mp3"}, {"id": 4456, "name": "Negative bias", "phrases": ["negative emotions", "negative expression", "the blood flow", "the blood", "a result", "a weapon", "the action", "the other hand", "the major center", "the brain"], "eng": "Next, let's look at a positive and negative emotions and positive and negative expression of these emotions. No one can see positive and negative. “ ” “ ” I mentioned earlier that there is a range of feelings that we there's a range of expressions that we feel ranging from anger, sadness, shame, frustration or depression, disgust, love, calm or happiness or sadness. So if I'm looking at these emotions, I can broadly categorize all of them in either being positive or negative. So let's take, for instance, anger and fear. So if I'm feeling angry, what happens is all the blood, the blood flow is increased towards my hands. As a result, it makes it easier for me to grasp a weapon or to make a strike. And that is a lot of adrenaline that is released, which increases energy necessary for the action. On the other hand, if I'm feeling happy, if I'm feeling calm. The major center is the brain for a lot of activity, and this inhibits negative emotions as feeling negative or negative emotions from entering our mind. So this is what happens. It has a lot to do with hormones. It has a lot to do with. This is a reason why they see that it was in an impulse. “ ” I happened to slap the person, but I didn't mean it. When I'm angry, I don't realize that I end up hitting the person. So this has a lot to do with your hormones. Once you have once you know what you're feeling, once you are aware, you have labeled your feelings really well. This is exactly what happens when there's blood flow rushing through your own hands. And then it makes it easier for you to make a strike, to grasp something or to defend yourself. This is exactly what happens when we're talking about positive and negative expression of our feelings. This is positive and negative. Next, we look at the healthy and the unhealthy ways of expressing ourselves.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693054/db5a01603f974e3980613bebb950f1b
