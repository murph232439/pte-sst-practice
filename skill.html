<style>
*{box-sizing:border-box;margin:0;padding:0}

<script>
var D={"cards": {"sst": [{"id": 2122, "name": "Transportation network in Paris", "phrases": ["an extensive public transportation system", "the metro", "16 lines", "6:00 a.m", "a single journey", "90 euros", "10 tickets", "a passport photo", "monthly passes"], "ref": "Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo."}, {"id": 2123, "name": "Children directors", "phrases": ["social difficulties", "particular risks", "a high school", "a movie director", "the students", "different skills", "the movies", "the intervention effect", "critical thinking skills"], "ref": "Children are facing social difficulties with particular risks. In an experiment in a high school, the students were told to be a movie director and to choose their story structure. The students worked with each other, which involved lots of different skills. The movies they had made were actually cool. Then, the researchers tested the intervention effect, and they found this can improve their self-regulation and critical thinking skills."}, {"id": 2124, "name": "Bees waggle dance", "phrases": ["a waggle dance", "nectar sources", "the dance", "a headbutt", "a nectar source", "the hive", "the intricate communication system", "collaborative efforts"], "ref": "Honeybees communicate using a waggle dance to share nectar sources. Researchers found that the dance can be interrupted by a headbutt, which serves as a warning. Scientists mimicked a nectar source in a lab and observed foraging bees returning to the hive to stop dancing bees when potential dangers were present. This behavior study sheds light on the intricate communication system and collaborative efforts of honeybees."}, {"id": 2125, "name": "Cosmology and maths", "phrases": ["the profound connection", "an inherent part", "the natural world", "the omnipresence", "a fundamental aspect", "the speaker"], "ref": "In this lecture, the speaker explores the profound connection between mathematics and cosmology, arguing that mathematics is an inherent part of nature itself, not just a tool for explanation. They emphasize the omnipresence of mathematical patterns in the natural world, linking them to the workings of the universe. The speaker concludes that mathematics is a fundamental aspect of the cosmos, shaping our understanding and enabling us to interpret the universe."}, {"id": 2126, "name": "Singapore", "phrases": ["s dynamic approach", "the lecture", "chicago professor ’ s work", "singapore ’ s", "innovative urban planning", "the global context"], "ref": "In the lecture, we analyzed Singapore’s dynamic approach to globalization, noting its multicultural population and economic prowess. Citing a University of Chicago professor’s work, we discussed Singapore’s global strategy before exploring its pioneering role in future urban development. By highlighting academic opinions, the talk concluded that Singapore is a model of multiculturalism and innovative urban planning within the global context."}, {"id": 2127, "name": "International trading system", "phrases": ["the international trading system", "open trade policies", "access diverse", "high-quality products", "economic growth", "cross-border exchange", "the speaker", "open trade"], "ref": "The international trading system has evolved significantly since the WTO's establishment, with globalization driving open trade policies and expanded commerce. Countries opening ports enabled consumers worldwide to access diverse, high-quality products at competitive prices. This interconnected system fosters economic growth by facilitating cross-border exchange of ideas, technologies, and opportunities for development. The speaker believes that open trade is a boon to global prosperity."}, {"id": 2128, "name": "Sound of words", "phrases": ["the lecture", "the significance", "the sound", "cognitive processes", "the broad capacity", "high school graduates", "the mention", "phone numbers", "the influence"], "ref": "The lecture explains the significance of words and their sound. It discusses how the sound of words is crucial for cognitive processes, representing the world and self-perception. It also emphasizes the broad capacity of words to express concepts, using high school graduates as an example. The mention of phone numbers suggests words are vital for memory. Overall, it underscores the influence of words and sound on cognitive functions and communication"}, {"id": 2129, "name": "Multiculturalism & cultural diversity", "phrases": ["diverse cultures", "melting pot", "cultural identities", "the world"], "ref": "Multiculturalism promotes acceptance of diverse cultures, fostering inclusivity and harmony by celebrating differences rather than enforcing assimilation. It contrasts with the \"melting pot\" model, preserving cultural identities to enrich societal coexistence. By embracing multiculturalism, societies can broaden understanding of the world and fosters a sense of unity and acceptance. In this way, we can create a more vibrant and enriching society for all."}, {"id": 2130, "name": "Dialects", "phrases": ["the lecture", "the differences", "the dynamic nature", "received Pronunciation", "a comprehensive analysis", "the influential role"], "ref": "The lecture discusses the differences between dialects and accents, emphasizing the influence of geography, society, family, and education in shaping dialects. It highlights the dynamic nature of language by noting that speakers of Received Pronunciation may integrate words from other dialects. The lecture provides a comprehensive analysis of the influential role of dialects and accents in communication and cultural preservation, showcasing the diverse and evolving nature of language."}, {"id": 2131, "name": "International law", "phrases": ["the historical significance", "the lecture", "the impact", "prolonged periods", "the establishment", "international law"], "ref": "The lecture discusses the historical significance of international law, particularly its role in ending prolonged conflicts. It emphasizes the impact of prolonged periods of war, leading to the creation of new rules governing the behavior between states. Additionally, it highlights the establishment of international law in 1648 and underscores its implications function and power dynamics in promoting stability among nations."}, {"id": 2132, "name": "Coffee", "phrases": ["east Africa", "one individual plant", "the crops", "the current outbreak", "south American crops"], "ref": "Although coffee originated in east Africa, much of it is now grown in Brazil. The crops there all stem from one individual plant, which means that they are vulnerable to contagion. As a result, the current outbreak of a disease called coffee rust is wiping out South American crops. This will probably lead to raised prices unless production elsewhere, such as in Vietnam, can be increased rapidly."}, {"id": 2133, "name": "Street art", "phrases": ["many different influences", "street art", "a common feature", "many cities", "public perceptions", "famous street artists areas", "inconventional creative fields"], "ref": "Street art has developed as a form of expression ever since its graffiti origins and has many different influences. lt's now a common feature in many cities and sometimes conveys quite positive messages. However, street art still remains somewhat controversial and can actually be illegal. Nevertheless, public perceptions of it have gradually become more accepting. Indeed, now some of the most famous street artists areas respected as their counterparts working inconventional creative fields."}, {"id": 2134, "name": "Loss leader strategy", "phrases": ["A loss leader", "an unprofitable price", "the loss leader strategy", "a loyal customer base", "a potential risk"], "ref": "A loss leader is when companies intentionally sell their products at an unprofitable price in order to attract new customers. The aim of the loss leader strategy is usually for companies to build a loyal customer base so that when they eventually increase their prices, they will make a profit. However, the loss leader strategy is a potential risk especially for small companies."}, {"id": 2135, "name": "Sources of protein", "phrases": ["current food system", "global greenhouse gas emissions", "a large proportion", "plant-based foods", "lab-grown meat"], "ref": "Our current food system is unsustainable, especially our ways of sourcing protein. This contributes to global greenhouse gas emissions and takes up a large proportion of land for agricultural purposes. We can, however, reduce these negative effects by getting more of our protein from plant-based foods and lab-grown meat, provided that the public can easily access and afford them."}, {"id": 2136, "name": "Question Bank", "phrases": ["the interior design", "work performance", "inexpensive method", "the office", "office space", "open-plan offices", "office design therefore", "important effects"], "ref": "Employees' work performance is directly affected by the interior design of their workplace. One inexpensive method for improving performance is placing plants around the office, because they can affect employee productivity and well-being, as well as reducing stress. Another is redesigning office space as open-plan offices can reduce communication by making staff feel reluctant to share ideas openly. Office design therefore has important effects on work culture."}, {"id": 2137, "name": "Skill-based curriculum", "phrases": ["future job markets", "a curriculum", "the other cross-disciplinary skills", "the education system"], "ref": "Although knowledge will be less valued in future job markets, people are still not keen on introducing a curriculum based on skills. This is because the education system is not ready to teach or assess critical thinking collaboration or the other cross-disciplinary skills that businesses value."}, {"id": 2138, "name": "Enough sleep", "phrases": ["several studies", "serious problems", "one particular study", "simple tasks", "enough sleep", "negative effects"], "ref": "Several studies have found that not getting enough sleep can cause serious problems. One particular study showed that lack of sleep makes it more difficult to complete tasks and more difficult to concentrate on simple tasks. This means that getting too little sleep can be dangerous and expensive. lt's become clear that not getting enough sleep has negative effects on how people do things at work and at home."}, {"id": 2139, "name": "Child-rearing", "phrases": ["many people", "small children", "each staff member", "a small number"], "ref": "Although many people think that small children should be cared for at home, being looked after outside the home can also have positive effects if the children can build relationships and learn skills. There's no evidence that it's better if one child is looked after by one person or if they are cared for in a group, but children benefit if each staff member is only responsible for a small number of them."}, {"id": 2140, "name": "AI", "phrases": ["all sections", "the people", "the content", "biased attitudes"], "ref": "Al is not automatically fair to all sections of society; it is as biased as the people who create it or the texts it considers. It learns from the content of these texts, so may learn biased attitudes. Procedures are therefore needed to ensure that what Al learns is fair to all sections of society."}, {"id": 2141, "name": "Smart skin", "phrases": ["an electronic skin", "a smart skin", "real-time information", "various things", "the skin", "a person", "the numerous different uses"], "ref": "There is now an electronic skin called a smart skin that can be worn to monitor bodily processes. Athletes like it because it gives them real-time information about their bodies as they are training. lt can monitor various things by analysing their sweat. The skin can also show a person's heartbeat. The smart skin is very portable and scientists are exploring the numerous different uses it could have."}, {"id": 2142, "name": "Iconoclast", "phrases": ["an iconoclast", "the simple question “", "other people", "a business"], "ref": "An iconoclast is someone who challenges established ideas and beliefs. This can be seen as a negative but in business it should be valued. lconoclasts ask the simple question “Why?” and they will not accept things like other people do. In fact, they spot changes that can be made to make a business more efficient. Businesses should listen to them and not try to change them."}, {"id": 3787, "name": "Bees' genes and Darwin", "phrases": ["A healthy honeybee", "the queen ’", "a small number", "the majority", "’ tireless efforts", "the worker"], "ref": "A healthy honeybee hive revolves around the queen’s egg-laying capacity of up to 2500 eggs a day. The majority of the colony comprises female workers, while a small number of male drones rely on the workers for sustenance. The worker bees’ tireless efforts in gathering resources take a toll, as they live for approximately 30 days, but the hive is continually replenished by new generations."}, {"id": 3788, "name": "Credit card experiment", "phrases": ["inactive credit card users", "the other group", "a potential loss", "the result"], "ref": "In an experiment on customers’ behaviors, one group of inactive credit card users received a message offering benefits that they could gain by using the cards, while the other group received a message implying a penalty if it’s not used. The result shows that customers are more motivated by a potential loss when not using this card than the benefit they could gain by using the card."}, {"id": 3789, "name": "Journalism and internet", "phrases": ["the New Mexico Independent", "david Olivia Garcia", "the Albuquerque Journal", "john Fleck"], "ref": "David Olivia Garcia, co-host of New Mexico in Focus and managing editor for the New Mexico Independent, believes that the Internet has great benefits for journalism, offering various mediums to tell stories and connect with other journalistic work. However, John Fleck, a columnist for the Albuquerque Journal, argues that the Internet actually makes journalists more efficient in terms of gathering information and confirming facts."}, {"id": 3790, "name": "Sleep", "phrases": ["enough sleep", "the brain", "sleep impairs memory", "learning processes", "a dry sponge", "memory circuits", "the absorption"], "ref": "Sleep is essential for learning and memory. Getting enough sleep before and after learning helps consolidate information in the brain. Lack of sleep impairs memory and learning processes. Sleep prepares the brain to absorb new information, acting like a dry sponge. Without sleep, memory circuits become overwhelmed, hindering the absorption of new memories."}, {"id": 3791, "name": "Telescope", "phrases": ["a tiny five-millimeter telescope", "larger telescopes", "the nature", "mechanical effects", "modern digital detectors", "100 times", "the optical regime", "such improvement"], "ref": "Our eye is a tiny five-millimeter telescope. When we have larger telescopes that collect more light, we can see things fainter but it greatly improves detail. This is because the nature of light is a wave which has quantum mechanical effects. Telescopes also allow us to put modern digital detectors behind them, which are 100 times more efficient. Such improvement allowed astronomy to do so much in the optical regime."}, {"id": 3792, "name": "Australian immigration", "phrases": ["the first inhabitants", "the indigenous people", "the Pleistocene epoch", "sea levels", "a land bridge", "new Guinea", "a separate landmass", "recent years", "significant immigration"], "ref": "The first inhabitants of Australia were the ancestors of the indigenous people. Their migration occurred during the Pleistocene epoch when sea levels were lower. Australia and New Guinea were connected by a land bridge known as Sahul. As sea levels rose 10,000 years ago, Australia became a separate landmass. In recent years, Australia has experienced significant immigration, with the majority coming from Asia, particularly China and India."}, {"id": 3793, "name": "Tutorial", "phrases": ["write notes", "small groups", "the tutors", "fewer students", "the speaker ’ s advice", "the readings"], "ref": "Before tutorials, students need to read articles and write notes. In tutorials, students discuss ideas and give feedback in small groups. It’s easier to get support from the tutors in tutorials because there are fewer students than lectures. Students can improve their skills, teamwork, and confidence in tutorials. In the end, the speaker’s advice is that do the readings before tutorials and be active in tutorials."}, {"id": 3794, "name": "Implicit and explicit memory", "phrases": ["implicit memory", "explicit memory", "procedural memory", "social background", "personal life experiences"], "ref": "Implicit memory and explicit memory are the two main types of memory. Implicit memory is also called procedural memory and cannot be consciously recalled. Implicit memory is about cultural and social background, such as using language naturally or driving automatically. Explicit memory is also known as episodic memory, related to personal life experiences. It is about time and space, such as remembering birthdays or answering questions in a test."}, {"id": 3795, "name": "Biggish city", "phrases": ["the lecture talks", "the population", "the speaker", "the same figures", "both Plato", "a small population", "the number"], "ref": "The lecture talks about the population of cities in the past. According to the speaker, the population of cities in history could be numbered in thousands rather than millions. Interestingly enough, both Plato and Leonardo chose the same figures, twenty-five to thirty thousand inhabitants, for their ideal cities. Now, the number of citizens is kept deliberately low because a small population would be easier to manage."}, {"id": 3796, "name": "Organizational study", "phrases": ["organisation courses", "leadership skills", "the boss", "learn organisation courses", "long terms"], "ref": "This lecture is mainly about organisation courses. Firstly, organisation courses are very important. Organisation courses will help us to get leadership skills in our careers. Those skills that are supplied by organisation courses will be helpful to our careers. People can learn how to satisfy the boss. People had better learn organisation courses if they want to get long terms of successful careers."}, {"id": 3797, "name": "Leadership", "phrases": ["the lecture talks", "various means", "executive orders", "visible leadership roles", "authoritative leadership"], "ref": "The lecture talks about leadership. Leaders can define or clarify goals through various means such as issuing memos, executive orders, or laws, as well as using charisma, rhetoric, and example. Leadership can range from highly visible and authoritative to casual and low-key. Historically, authoritative leadership has been predominantly exhibited by men, but this pattern is changing as more women take up visible leadership roles."}, {"id": 3798, "name": "Population growth", "phrases": ["the speech talks", "the population", "a challenge", "billion people", "other resources", "all problems", "the growth", "the balance", "urban growth"], "ref": "The speech talks about the population. The growing population is a challenge. It brings pressure on resources. Now we have 7 billion people, and they all need water, food, and other resources. These are all problems of security because the growth will not be equally distributed. This population growth will impact the balance of power. Urban growth is remarkable."}, {"id": 3799, "name": "Climate change in Australia", "phrases": ["the sea levels", "the sea level", "the consequences", "more floods", "climate change", "more rain", "the sea level rising", "many mega cities"], "ref": "This lecture mainly talks about the sea levels of Australia. When the sea level is rising, the consequences may well be huge. This is because there will be more floods. Also, climate change will mean more rain and droughts. Many mega cities are likely to be affected by the sea level rising, and this means more people have to deal with it."}, {"id": 3800, "name": "Trust levels", "phrases": ["economy platforms", "the last 40 years", "a heightened level", "every time society", "a new basis"], "ref": "Sharing economy platforms are getting Americans to trust each other again. Over the last 40 years, the level of trust in society has fallen quite dramatically but we've developed a heightened level of trust in strangers on digital interface. Every time society has created a new basis for trust, it has expanded the economy dramatically, so this will expand economic activities and possibilities for trade."}, {"id": 3801, "name": "Underestimated women", "phrases": ["own abilities", "the workforce", "other external factors", "own success"], "ref": "Women tend to underestimate their own abilities, and they do not negotiate for themselves in the workforce. And most importantly, men attribute their success to themselves and women attribute it to other external factors. In conclusion, it is important for women to understand their own success, and they deserve their success."}, {"id": 3802, "name": "Basic social values", "phrases": ["basic social values", "the lecture", "many basic social values", "the speaker", "the unloving side", "traumatic social problems"], "ref": "The lecture is mainly about basic social values. According to the speaker, many basic social values are passed on unconsciously, already in babyhood. And most people in different ways are working with the unloving side of society in a way and trying to find ways to provide a more caring response, especially those working in Africa who often deal with traumatic social problems."}, {"id": 4442, "name": "Stock market and business", "phrases": ["the stock market", "public companies", "a brokerage account", "retirement plan", "modern companies", "use stocks", "large companies.From"], "ref": "The stock market is where investors buy and sell stocks, which represent shares of ownership in public companies. It can be accessed online through a brokerage account or retirement plan. In the past, companies used stocks to raise money, but now modern companies like Apple and Google earn money and use stocks differently. The stock market also tends to invest in large companies.From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently."}, {"id": 4443, "name": "Citizenship curriculum", "phrases": ["the lecture", "a report", "the curriculum", "the subject", "some challenges", "citizenship education", "insufficient teacher training", "an uncertain position"], "ref": "The lecture discusses a report on the development of citizenship education in schools. While it praises schools that successfully implement the curriculum, it criticizes those where the subject is marginalized. Despite some challenges, citizenship education remains valuable for developing students' core skills and values. However, its implementation faces major obstacles, including a lack of leadership commitment, insufficient teacher training, and an uncertain position in the curriculum."}, {"id": 4444, "name": "Amory Lovins", "phrases": ["an eccentric genius", "the lecture", "energy conservation", "a mountain house", "a furnace", "attract public attention", "journalist Elizabeth Kolbert"], "ref": "The lecture introduces Amory Lovins, a polymath and consultant regarded as an eccentric genius. He dedicates himself to energy conservation and solving problems using existing technology. He demonstrates his ideas practically by living in a mountain house without a furnace. His remarkable dedication and unconventional approach attract public attention, inspiring journalist Elizabeth Kolbert to write a profile about him titled \"Mr. Green.\""}, {"id": 4445, "name": "Einstein", "phrases": ["the universe concept", "the lecture", "unchangeable stage", "celestial bodies", "continuous dynamic change", "the astronomer Edwin Hubble", "the crucial discovery"], "ref": "The lecture explains the evolution of the universe concept. Traditionally, people view space as a completely fixed and unchangeable stage for celestial bodies. However, Einstein transforms this perspective by predicting that space itself undergoes continuous dynamic change. Furthermore, the astronomer Edwin Hubble makes the crucial discovery that confirms his prediction, proving that the universe is truly dynamic rather than static."}, {"id": 4446, "name": "International environmental law", "phrases": ["the crucial role", "international environmental law", "the history", "environmental controls", "the Industrial Revolution", "environmental damage", "comprehensive statutory controls", "effective environmental protection"], "ref": "The lecture highlights the crucial role of domestic legislation in implementing international environmental law. It traces the history of UK environmental controls and explains that early regulations lack proper enforcement, which makes them ineffective. Additionally, the Industrial Revolution worsens environmental damage because industrialists prioritize economic profit. Therefore, comprehensive statutory controls on pollutant discharge become essential for effective environmental protection."}, {"id": 4447, "name": "Development of genes", "phrases": ["the past 500,000 years", "the rapid evolution", "a small number", "multiple gene changes", "the genetic differences", "ancient humans", "a limited number", "powerful cognitive abilities"], "ref": "The lecture discusses the rapid evolution of human cognitive function over the past 500,000 years. This fast development only occurs through changes in a small number of genes, because requiring multiple gene changes makes such rapid evolution impossible. Consequently, the genetic differences between ancient humans and modern people remain relatively small. Ultimately, a limited number of genes are responsible for endowing humans with powerful cognitive abilities."}, {"id": 4448, "name": "Drug ads", "phrases": ["pharmaceutical TV advertising", "the lecture", "the ads misleading", "the information", "the negative impact", "health conditions", "prescription drug marketing differs", "ordinary product promotion"], "ref": "The lecture discusses the increase in pharmaceutical TV advertising and its impact on consumers. Although the information is technically accurate, researchers find the ads misleading. They exaggerate the negative impact of health conditions and suggest that medication magically restores life control. Furthermore, these advertisements ignore lifestyle changes that help treat conditions, highlighting that prescription drug marketing differs significantly from ordinary product promotion."}, {"id": 4449, "name": "Vitamin D", "phrases": ["the dietary need", "the lecture", "natural abundance", "vitamin D", "enough sun exposure"], "ref": "The lecture introduces Vitamin D, known as the \"sunshine vitamin,\" because adequate sunlight eliminates the dietary need for it. Since foods lack natural abundance of Vitamin D, milk is fortified, which may remain insufficient in non-tropical climates. Furthermore, human evolution in tropical regions provides enough sun exposure, but migration to other areas creates a dietary need for Vitamin D due to inadequate sunlight."}, {"id": 4450, "name": "Devolution of power", "phrases": ["the state level", "the lecture", "republicans support", "power closer", "a hidden part", "the power system"], "ref": "The lecture discusses the concept of devolution, which involves moving governmental power from the federal to the state level. While Republicans support this approach to bring power closer to the people, the speaker argues that it actually moves power away from citizens. This is because a hidden part of the power system, specifically private power, remains unknown to the public."}, {"id": 4451, "name": "A female novelist", "phrases": ["the speaker shares", "personal journey", "the belief", "true art", "the first chapter", "the Secret Life"], "ref": "The speaker shares her personal journey from writing non-fiction to fulfilling her dream of becoming a novelist. Inspired by the belief that true art requires taking risks, she finally began writing fiction in the early 1990s. As a result, she drafted the first chapter of her acclaimed novel, \"The Secret Life of Bees,\" in 1992, which remains largely unchanged in the final published version."}, {"id": 4452, "name": "Globalization", "phrases": ["the lecture", "two perspectives", "the proliferation", "cross-border transactions", "a global division", "economic system", "a new stage", "economic progression"], "ref": "The lecture defines globalization from two perspectives. First, it refers to the proliferation of cross-border transactions, including increased international trade, communication, and multinational companies. Second, it functions as an integrated economic system characterized by a global division between producing and consuming goods. Ultimately, this mutual dependence among countries represents a new stage of economic progression compared to past industrial economies."}, {"id": 4453, "name": "A mother’s loan", "phrases": ["the speaker shares", "severe financial struggle", "high interest rates", "college degree", "educational choice", "future college education", "government loans"], "ref": "The speaker shares her severe financial struggle caused by massive student loans. Although her college degree helps her secure a job, high interest rates make the debt unpayable, and monthly payments exceed her family income. Consequently, she deeply regrets her educational choice. Furthermore, this heavy financial burden forces her children to rely on government loans for their future college education."}, {"id": 4454, "name": "Governments use tricks", "phrases": ["the fundamental importance", "the lecture", "various deceptive tricks", "the truth", "actual events", "false ones", "the public", "the world"], "ref": "The lecture highlights the fundamental importance of well-informed citizens and strongly criticizes governments that deliberately withhold information. Instead of providing the truth, these regimes use various deceptive tricks to cover up their mistakes. Specifically, they deny actual events, fabricate false ones, and spin undeniable facts. Ultimately, these strategies aim to mislead the public and distract the world from their wrongdoings."}, {"id": 4455, "name": "Indian peasants' debt", "phrases": ["the severe debt crisis", "the high costs", "a continuous cycle", "the seed"], "ref": "The lecture explains the severe debt crisis among Indian peasants caused by the high costs of commercial seeds and pesticides. Driven by globalization, farmers lack capital and must borrow money to buy these expensive agricultural materials. Consequently, the seed and pesticide companies act as both sellers and major creditors, trapping the peasants in a continuous cycle of debt."}, {"id": 4456, "name": "Negative bias", "phrases": ["the physical expressions", "the passage", "anger increases blood flow", "the hands", "the influence", "a forthcoming discussion"], "ref": "The passage explains that emotions can be categorized as positive or negative, and provides examples of the physical expressions associated with anger and happiness. It discusses how anger increases blood flow to the hands and releases adrenaline, while happiness and calmness inhibit negative emotions. It acknowledges the influence of hormones on our actions. The passage also mentions a forthcoming discussion on healthy and unhealthy expressions of emotions."}, {"id": 4457, "name": "Los Angeles", "phrases": ["the Los Angeles River", "los Angeles", "the city ’ s development", "A new water source", "the Los Angeles Aqueduct", "the creation", "the Water Department", "the perfect candidate"], "ref": "Since Los Angeles was established in 1781, the rapidly increasing population puts strain on the Los Angeles River. A new water source has to be found for the city’s development as an urban center. The creation of the Los Angeles Aqueduct led to tragedies and draining of important landmarks. The Water Department eventually settled on Owens Lake as the perfect candidate to supply Los Angeles with water for expansion."}, {"id": 4458, "name": "Neolithic stones", "phrases": ["historical objects", "mathematical significance", "the first examples", "the concept", "the intriguing things", "the speaker", "a great subject", "the technology"], "ref": "Historical objects have quite a lot of mathematical significance. These Neolithic stones are probably the first examples of humans exploring the concept of symmetry. One of the intriguing things about these stones is that we don't actually know what they're for, and that's why the speaker likes them. Mathematics is a great subject, created the technology around us, but mathematicians create our mathematical objects for the joy and the beauty."}, {"id": 4459, "name": "Poetry", "phrases": ["an important part", "the oldest form", "the English language", "literary expressions", "literature knowledge"], "ref": "Poetry is an important part of art and culture. Poetry is from the oldest form of literature. The English language in poems and poetry is difficult to understand, making it hard for readers to enjoy poetry, because poems use literary expressions. However, you should learn to simply enjoy it to know more about literature knowledge."}, {"id": 4460, "name": "The internet requires energy", "phrases": ["the Internet", "the Internet comprises devices", "data centers", "five percent", "global electricity", "greenhouse gas emissions", "the electricity", "other sectors"], "ref": "This lecture mainly talks about the Internet. The Internet comprises devices, data centers, and communication lines. It consumes about five percent of global electricity, with data centers using one or two percent. Most of the electricity comes from burning fossil fuels, resulting in greenhouse gas emissions. Compared to other sectors, the Internet's contribution to global emissions is around two percent."}, {"id": 4461, "name": "Andrew Carnegie", "phrases": ["scotland-born Andrew Carnegie", "a fabric mill", "telegraph office", "successful steel factory", "the steel company"], "ref": "Scotland-born Andrew Carnegie and his family moved to America when he was 13. He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. Later he built the most successful steel factory and made great fortunes in the steel company, but he gave 90 percent of money away to worthy causes."}, {"id": 4462, "name": "Free sugars", "phrases": ["milk contain sugar", "a healthy sugar", "unhealthy sugar", "ice cream", "excess sugar", "free sugars", "the human body"], "ref": "Both fruits and milk contain sugar, and this sugar is a healthy sugar. Unhealthy sugar is normally found in desserts and ice cream. It's much easier to consume excess sugar from foods and drinks that contain \"free sugars\". Free sugars in this case have been removed from their naturally occurring source. In addition, directly eating fruits is better because the human body can process them easily."}, {"id": 4463, "name": "Boys and girls", "phrases": ["english results", "brain mechanisms", "a greater awareness", "whereas girls", "different teaching approaches", "the need"], "ref": "Research shows that girls tend to outperform boys in English results due to differences in learning styles and brain mechanisms. Boys demonstrate a greater awareness of developments in physics and technology, whereas girls tend to be more interested in sociable fields. This finding suggests the need for teachers to adopt different teaching approaches for boys and girls to enhance their learning experiences."}, {"id": 4464, "name": "Hook sentence", "phrases": ["an essay", "a chance", "an essay hook", "attract readers", "a catchy sentence", "the introduction", "some popular hook choices", "an interesting quote"], "ref": "An essay is a chance to identify your read and learned. If you want to wow your teacher and attract readers’ attention, polish the introduction by adding an essay hook. A hook is a catchy sentence or paragraph in the introduction, which is engaging and interesting. Some popular hook choices include using an interesting quote or a statistic."}, {"id": 4465, "name": "Paper rejection", "phrases": ["a disappointing experience", "the career path", "the chance", "another journal", "the same time", "young researchers"], "ref": "Rejection can be a disappointing experience. The chance of getting a paper published is becoming smaller and smaller, but rejections will lead to better results and will be good for the career path. Use this feedback to improve your paper for submission to another journal. Also, publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time."}, {"id": 4466, "name": "The stability of mood", "phrases": ["emotional stability varies", "a delicate balance", "a natural ebb", "emotional well-being"], "ref": "Emotional stability varies between individuals. Research indicates that the key to happinessis maintaining a delicate balance of emotional containment and resilience, allowing for a natural ebb and flow of emotions. Finding this equilibrium is essential for emotional well-being and health, ultimately granting individuals a sense of contentment, and happiness."}, {"id": 4467, "name": "A good engineer", "phrases": ["a complicated system", "personal life experience", "reliable outcomes", "a reliable system", "the risks"], "ref": "Engineers should know how to work with a complicated system, and sometimes, the inspirations are from their personal life experience. A complicated system cannot see, so engineering is to help virtualize it by using systems. As complicated systems are becoming reliable, engineers should deliver reliable outcomes as well. To develop a reliable system, engineers need to consider the risks, potential, predictability and accuracy."}, {"id": 4468, "name": "Luxury brand", "phrases": ["a luxury brand forms", "a luxury brand", "standard business", "some luxury brands", "huge quantity", "the speaker", "both cases", "the reason", "business community"], "ref": "How a luxury brand forms is hard to explain. For standard business, a luxury brand is about the exclusivity through high prices and low stock. However, some luxury brands are characterized by huge quantity in sales and low prices. The speaker thinks both cases are relative. Therefore, the reason to explain the formation of a luxury brand is complicated. In business community, it refers to the more expensive brands."}, {"id": 4469, "name": "Curator", "phrases": ["material culture", "other historians", "academic historians", "the past"], "ref": "This topic is about practices, techniques and methods of curators. Museums are good at creating and communicating history where museums are defined by their collections. Curators understand material culture as evidence of people's life to understand people. Curators are different from other historians. Academic historians concentrated on words and photographers concentrate on images, while curators deal with objects that are evidence of the past. They arrange objects into exhibitions."}], "rl": [{"id": 1568, "name": "Double pendulum", "phrases": ["the chaos physics equation", "a double pendulum", "the butterfly effect", "minor differences", "computer simulations", "physical models", "the double pendulum serves", "an intriguing example"], "ref": "The chaos physics equation for a double pendulum explores the unpredictability and complexity of its motion. Even minor differences in initial conditions can lead to significant variations in behavior, known as the butterfly effect. Researchers use computer simulations and physical models to study this system, gaining insights into its nonlinear dynamics. The double pendulum serves as an intriguing example of chaos theory and highlights the intricate dynamics of seemingly simple physical systems. 双摆的混沌物理方程探讨了其运动的不可预测性和复杂性。即使初始条件存在微小差异，也会导致行为上的显著变化，这种现象被称为“蝴蝶效应”。研究人员通过计算机模拟和物理模型来研究这一系统，从而深入了解其非线性动力学特性。双摆是混沌理论的一个引人入胜的例子，它揭示了看似简单的物理系统所具有的复杂动力学行为。"}, {"id": 1569, "name": "Leadership", "phrases": ["the lecture", "a leader", "the leader wields", "a spectrum", "authoritative leadership", "low-key leadership", "the scenes"], "ref": "The lecture mainly talks about leaders. Firstly, a leader can define goals and mobilize people's energies. Secondly, we can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. Thirdly, authoritative leadership has generally been exhibited by men. Finally, women have provided casual, low-key leadership behind the scenes, but this pattern has been changing. 这一讲座主要讲述了领导者。首先，领导者可以定义目标并调动人们的精力。其次，我们可以将领导力视为一个谱系，既包括领导者的可见性，也包括领导者所拥有的权力。第三，权威型领导角色长期由男性担任。最后，女性一直在幕后提供非正式、低调的领导力，但这种传统格局正在发生转变。"}, {"id": 1570, "name": "Globalization", "phrases": ["the example", "bank bust", "the miracle", "the planet", "bad stuff", "good stuff", "the Millennium Development Goals", "extraordinary successes", "extraordinary progress"], "ref": "This is globalization about the example of chicken died and bank bust. This is the miracle enabled us to transship our bodies and our minds around the planet ever faster and ever cheaper. There is a lot of bad stuff and good stuff. A lot of extraordinary successes of the Millennium Development Goals. Humanity is capable of achieving extraordinary progress if acts together and tries hard. 这一讲座讲述了全球化的例子，包括鸡的死亡和银行的破产。全球化是一个奇迹，使我们能够以更快、更经济的方式将我们的身体和思想传递到地球的各个角落。全球化既带来了许多坏事，也伴随着许多好事。千年发展目标取得了许多非凡的成就。人类如果共同努力、全力以赴，完全有能力取得非凡的进展。"}, {"id": 1571, "name": "Measuring food", "phrases": ["portion size", "no good way", "the speaker", "objective way", "the speaker mentions", "the calculations", "the future"], "ref": "This lecture talks about accurately estimating portion size. Firstly, the speaker works in clinical weight-loss as a dietitian and thinks accurately estimating portion size is critical because there’s no good way to measure food when dinning out. Secondly, the speaker mentions a more objective way to quantify food: using the width of fingers to measure the dimensions of food. Thirdly, the speaker mentions smartphone applications that will do all the calculations to make a more accurate estimation. In conclusion, fingers and apps can help estimate the portion size in the future. 这一讲座讨论了如何准确估算食物份量。首先，讲者作为一名临床减肥的营养师，认为准确估算食物份量至关重要，因为外出就餐时没有一个好的方法来衡量食物的量。其次，讲者提到了一种更客观的量化食物的方法：利用手指宽度作为测量单位来测量食物的尺寸。第三，讲者还提到了智能手机应用程序，这些应用程序在未来能够配合手指做出所有计算，从而提供更准确的估算。总之，在未来，人们可以利用手指和应用程序估算食物份量。"}, {"id": 1572, "name": "Innovation and invention", "phrases": ["the relationship", "the speaker mentions", "innovation equals invention", "the world", "equals invention times commercialization", "a new idea", "innovation equals"], "ref": "This lecture talks about the relationship between innovation and invention. Firstly, the speaker mentions that people think innovation equals invention but it’s not correct. Secondly, the speaker mentions that innovation generates value for the world and gives people satisfaction, but the invention is an idea that does not generate value. Thirdly, the speaker mentions that innovation equals invention times commercialization. In conclusion, innovation equals to commercializing a new idea to make value. 这一讲座讨论了创新与发明之间的关系。首先，讲者提到人们认为创新等同于发明，但这是不正确的。其次，讲者提到创新为世界创造了价值并带给人们满足感，而发明本身只是一个没有产生价值的想法。第三，讲者提到创新等于发明乘以商业化。总的来说，创新是发明与商业化的结合，从而创造价值。"}, {"id": 1573, "name": "Three types of questionnaires", "phrases": ["the questionnaires", "three types", "category type questions", "ordinal type questions", "category questions", "some sort", "continuous questions", "any questions", "a number"], "ref": "In the questionnaires, questions can be divided into three types, called level measurement. Firstly, we have category type questions. It means participants select from a list of categories for their response. Secondly, we have ordinal type questions. These are similar to category questions, but there is some sort of order between them. Thirdly, we have continuous questions. These are any questions that can be answered by a number. 在问卷调查中，问题可以分为三种类型，称为测量等级。首先，我们有类别型问题。这意味着参与者从一系列类别中选择他们的回答。其次，我们有顺序型问题。这些问题与类别型问题相似，但选项之间存在某种顺序关系。第三，我们有连续型问题。这些问题是任何可以通过数字回答的问题。"}, {"id": 1574, "name": "Discovering the port of Roman London", "phrases": ["the historical records", "roman London", "few records", "both antiquity", "the historian try", "the history", "no historical documentation", "the port", "archaeological evidence"], "ref": "This lecture is about the historical records of Roman London. There are few records of its history in both antiquity and contemporary references. If the historian try to write the history of Roman London, it's really difficult because of the lack of data. And so, the port of London was discovered with no historical documentation, like custom books. We have to understand the port entirely from archaeological evidence. 这节讲座讲的是罗马时期伦敦的历史记录。无论是古代还是当时的文献资料，关于这段历史的记载都非常少。如果历史学家试图撰写罗马伦敦的历史，会非常困难，因为缺乏相关数据。因此，伦敦港口的发现就没有历史文献的记载，比如海关书籍。我们只能完全依靠考古证据来了解这个港口。"}, {"id": 1575, "name": "Licking and grooming", "phrases": ["stress reactivity", "adult rats", "s stress reactivity", "grooming.The experiment", "modest stress reactivity", "the risk"], "ref": "Differences in stress reactivity of adult rats are determined by maternal licking and grooming (LG) during infancy. L means licking and G means grooming.The experiment tested on high and low level of licking and grooming that mother rats give to their children, to test out its effect on the children’s stress reactivity. High LG will bring modest stress reactivity, which can reduce the risk for poor development and diseases. Low LG will increase the stress reactivity, which can increase the risk for heart disease, type II diabetes, alcoholism, affective disorders and brain aging, etc. 这项实验探讨了母鼠在婴儿期舔舐和梳理（LG）对成年大鼠应激反应的影响。L代表舔舐，G代表梳理。实验测试了母鼠对幼鼠舔舐和梳理的高低水平，来检验这些行为对幼鼠应激反应的影响。高水平的舔舐和梳理（高LG）会导致温和的应激反应，这有助于降低发育不良和疾病的风险。低水平的舔舐和梳理（低LG）则会增加应激反应，从而增加罹患心脏病、Ⅱ型糖尿病、酗酒、情感障碍和大脑衰老等的风险。"}, {"id": 1577, "name": "Three stages of brain development V2", "phrases": ["the lecture", "the brain builds", "basic circuits", "the reciprocal relationship", "the interaction", "the brain", "multiple sections"], "ref": "The lecture is about brain. The brain builds basic circuits that are responsible for basic skills and it is prepared to be shaped by experience. The interaction between genetics and experience that shapes brain architecture is embedded in the reciprocal relationship, the relationships that children have with the adults in their lives. In addition, the brain has multiple sections and the sections relate to cognitive function, the process of emotion and involve in scene and hearing. 这一讲座讲述了大脑。大脑构建了负责基本技能的基础神经回路，并且为经验的塑造做好准备。遗传和经验之间的互动塑造大脑结构，这一过程嵌入在儿童与生活中成人之间的相互关系中。此外，大脑有多个区域，这些区域与认知功能、情感处理以及视觉和听觉等过程相关联。"}, {"id": 1578, "name": "Technology erode privacy", "phrases": ["a society", "the amount", "a human right", "many protections", "spatial dimensions", "security cameras", "the quantum technologies"], "ref": "This lecture is about tensions between technology and privacy and as a society we need to argue about the amount of privacy and security we have. Firstly, privacy is a human right, which we care about, and we have many protections. Secondly, however, technology continues to erode privacy in three spatial dimensions, including security cameras, long lenses and body scanners. Thirdly, this process won’t slow down because of the quantum technologies. In conclusion, technology continues to erode our privacy. 这一讲座讨论了技术与隐私之间的紧张关系，作为一个社会，我们需要讨论我们拥有的隐私和安全的程度。首先，隐私是我们关心的人权，我们拥有许多保护措施。其次，然而，技术在三个空间维度上持续侵蚀隐私，包括监控摄像头、长焦镜头和身体扫描仪。第三，这一进程不会因量子技术而放缓。总结来说，技术继续侵蚀我们的隐私。"}, {"id": 1580, "name": "Biology", "phrases": ["the lecture", "the speaker talks", "other stuff", "the speaker", "the definition", "the study", "living organisms", "different ideas", "best friend"], "ref": "The lecture is about biology. Firstly, the speaker talks about DNA and genetics in cells, in bacteria, and in other stuff. The speaker also talks about the definition of biology. That is the study of life in living organisms. Everyone has different ideas about what is life, for example, your grandma or your best friend or even a philosopher will have different answers. Therefore, in the study of life, scientists needed to agree on the definition of life. 这一讲座是关于生物学的。首先，讲者讨论了细胞中的DNA和遗传学，包括细菌以及其他生物体中的遗传物质。讲者还谈到了生物学的定义——即研究生命和生物体。每个人对什么是生命有不同的看法，例如你的奶奶、最好的朋友，甚至一个哲学家都会给出不同的答案。因此，在研究生命时，科学家们需要就生命的定义达成共识。"}, {"id": 1582, "name": "London fog", "phrases": ["the earliest pictures", "london ’", "air problem", "the central elements", "the bridge", "a shot-tower", "a steamship", "a flourishing economy", "the speaker"], "ref": "Turner painted one of the earliest pictures of London’s fog in the 1835. Turner is familiar with London’s air problem by putting smoke at its center. The bridge is the central elements, and it is a theme that’s later taken up by Monet. We see a shot-tower and a steamship. They were very smoky and barely visible. The speaker thinks they represent for a flourishing economy, but also the dirt and pollution. Turner在1835年画了伦敦雾霾的最早画作之一。通过将烟雾作为画面的中心，透纳展现了伦敦的空气问题。桥梁是画作的核心元素，这一主题后来被莫奈所延续。画面中我们可以看到烟塔和蒸汽船，它们都被浓烟笼罩，几乎无法看清。讲者认为这些元素代表了一个繁荣的经济，但同时也象征着脏乱和污染。"}, {"id": 1583, "name": "Cosmic Civilization", "phrases": ["the lecture talks", "other cosmic civilizations", "every year", "most planets", "all necessary criteria", "all planets", "the chance", "the search"], "ref": "The lecture talks about the possibility of existence of other cosmic civilizations. Every year, 7 stars are formed, but most planets around them are either too hot or too cold to appear life. Only 20% of all planets meet all necessary criteria that have chance to have life. However, the chance of appearance of life is very small, which is close to zero. Even though it is important to continue the search, it is very hard to find other cosmic civilizations. 讲座讨论了其他宇宙文明存在的可能性。每年有7颗新恒星形成，但围绕它们的大多数行星要么太热，要么太冷，无法孕育生命。只有20%的行星满足所有必要条件，才有机会存在生命。然而，生命出现的可能性非常小，几乎接近于零。尽管继续探索其他宇宙文明非常重要，但要找到它们却非常困难。"}, {"id": 1584, "name": "Early Robot", "phrases": ["the first robots", "rossum ’", "the First World War", "a production line", "the robots", "primary purpose"], "ref": "The first robots were characters in a play in the 1920s called Rossum’s Universal Robots, and the writer was Karel Capek. People tend to thinks of robots as cute cuddly toys. But the first robots were actually created and imagined in a time of absolute political turmoil, which was the First World War. The robots are actually in the play assembled on a production line. Even even though they are human, they are assembled and these robots are designed to labour, and that is their primary purpose in society. 第一次机器人出现在1920年代的一部名为《罗萨姆的万能机器人》（Rossum's Universal Robots）的戏剧中，作者是卡雷尔·恰佩克。人们通常把机器人看作是可爱、温顺的玩具。但实际上，最初的机器人是在第一次世界大战这一极端政治动荡的时期被创造和构思出来的。戏剧中的机器人实际上是通过生产线组装的。尽管它们是人类外形，但它们是被组装出来的，设计的主要目的是劳动，这也是它们在社会中的首要角色。"}, {"id": 1585, "name": "Universal philosophy", "phrases": ["the lecture talks", "a universal philosophy", "the lecture", "some value", "the idea", "the values", "thin level"], "ref": "The lecture talks about a universal philosophy. According to the lecture, there are some value structures that apply to all of us. Now, the idea is to test that as well. Sport is universal because the values are specified at a very thin level at the top. There are these rules and we all have to abide by just these rules. But there are lots of things about football that aren't rules specified. In conclusion, there are these universal rules to apply to everybody. 这一讲座讲述了关于普遍哲学的内容。根据讲座，有一些价值结构适用于我们所有人。现在，研究的目标是验证这一点。体育是普遍的，因为其价值观在顶层有非常明确的规定。有这些规则，我们所有人都必须遵守这些规则。但是，足球中有很多方面并没有明确的规则。总之，存在一些普遍适用于每个人的基本规则。"}, {"id": 1586, "name": "Gas giants", "phrases": ["the lecture talks", "the gas giants", "the lecture", "one theory", "the insides", "metallic cores", "the higher pressure"], "ref": "The lecture talks about two theories for how the gas giants formed. According to the lecture, one theory is called core accretion, and the other is called disk instability. It's unclear exactly how they formed but you're right what we're trying to do. So it's very possible that the insides of these planets could have metallic cores, hydrogen cores, and rocky portions. But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and exoplanets that are so big. 这一讲座讲述了关于气态巨行星形成的两种理论。根据讲座，一种理论叫做核吸积理论，另一种叫做星盘不稳定理论。目前还不完全清楚它们到底是如何形成的，但我们正在努力探索。气态巨行星的内部很可能具有金属核心、氢核心和岩石部分。不过，我们在实验室中能获得的更高压力，能够帮助我们更接近理解气态巨行星和如此庞大的系外行星的内部结构。"}, {"id": 1587, "name": "Three principles", "phrases": ["the lecture talks", "the guiding principles", "the lecture", "word equity", "the policy", "the time"], "ref": "The lecture talks about equity. That is one of the guiding principles for a just city. According to the lecture, his choice of word equity is in fact based on Ross's argument that a policy ought to distribute benefits to people where the worst off become better off. In addition, we have to talk about the policy at the time it's being enacted, and equity means that you do not in fact take advantage of those people who are weakest. 这一讲座讲述了公平，这是一个公正城市的指导原则之一。根据讲座，演讲者选择使用“公平”这个词实际上是基于罗斯的论点，即政策应当分配利益，使得最处于困境的人变得更好。此外，我们还需要讨论政策实施时的情况，而公平意味着你不能利用那些最弱势的人群。"}, {"id": 1589, "name": "Dietary guidance", "phrases": ["some health messages", "the speaker", "carbohydrate towards guidelines", "dietary guidance", "the issue", "the different foods", "the proportions"], "ref": "The speaker said that some health messages about food are confusing. For example, there are debates about whether fat or sugar is bad for you, when in fact both are problematic. She said that dietary guidance to the public should shift away from a focus on individual nutrients, such as protein and carbohydrate towards guidelines relating to actual food, for example, meat, vegetables or biscuits. Moreover, the issue isn't about deciding which foods to eat or to abstain from. Instead, it's about eating patterns as a whole and the proportions of the different foods in relation to each other. 演讲者提到，一些关于食物的健康信息令人困惑。例如，人们争论脂肪或糖哪一种有害，而实际上两者皆有问题。她认为，向公众提供的饮食指导应该从关注蛋白质、碳水化合物等单一营养素，转变为关于实际食物的指导，比如肉类、蔬菜或饼干。此外，问题的关键不在于决定哪些食物该吃还是该戒掉，而是在于整体的饮食模式以及不同食物之间的比例关系。"}, {"id": 1590, "name": "Salience", "phrases": ["a wide range", "the brain", "physical senses", "the salience", "a product"], "ref": "Consumers are faced with a wide range of options, so the brain needs to find efficient ways to filter out much of this information by prioritizing certain things, items, or characteristics which attract our attention said to be salient or have higher levels of salience and as a result, are more likely to be purchased because they stand out. Products tend to have more salient when they appeal to one of our physical senses or do not conform to our expectations. Finally, the salience of a product may change over time as our individual needs or interests change. 消费者面临着广泛的选择，因此大脑需要找到有效的方法，通过优先考虑某些吸引我们注意力的被认为是突出的或具有更高显著性的事物、物品或特征来过滤掉大部分信息，因此，更有可能被购买，因为它们很突出。当产品吸引我们的身体感官或不符合我们的期望时，它们往往更具显著性。最后，产品的突出性可能会随着我们个人需求或兴趣的变化而改变。"}, {"id": 1591, "name": "Bystander effect", "phrases": ["the bystander effect", "no action", "the number", "the probability", "such situations", "another person", "the influence", "the key principle", "the only person"], "ref": "The bystander effect is when people who witness something that they could and should prevent end up taking no action at all. Research suggests that the higher the number of witnesses, the lower the probability that someone will try to intervene. Psychologists attribute this to diffusion of responsibility because in such situations, everyone is waiting for another person to take action. There are ways that we can reduce the influence of the bystander effect. The key principle is to encourage people to imagine that they are the only person who can take action in a situation. 旁观者效应是指那些目睹了他们可以而且应该阻止的事情的人最终没有采取任何行动。研究表明，证人数量越多，有人试图干预的可能性就越低。心理学家将此归因于责任的分散，因为在这种情况下，每个人都在等待另一个人采取行动。有一些方法可以减少旁观者效应的影响。关键原则是鼓励人们想象自己是唯一能够在某种情况下采取行动的人。"}, {"id": 1592, "name": "Canned laughter", "phrases": ["a sound recording", "a live audience", "canned laughter", "a program", "an important element"], "ref": "Canned laughter is a sound recording of people's laughter, which is added to make it appear as if a live audience is responding directly to the scene, As studio audiences can behave in unexpected ways, canned laughter is a way of getting laughter in the right places and is also used when a scene is shot away from a studio. Research has shown that canned laughter can also make a program seem funnier to viewers. People are more likely to laugh when they hear canned laughter during a program, Use of canned laughter is becoming less common, but it's still an important element of TV comedy in many countries. 罐装笑声是人们笑声的录音，它被添加以使其看起来像是现场观众直接对现场做出反应，因为工作室观众可以以意想不到的方式表现。罐头笑声是一种在正确的地方获得笑声的方式，也可以在场景从工作室拍摄出来时使用。研究表明，罐装笑声还可以使节目对观众来说更有趣。当人们在节目中听到罐装的笑声时，他们更有可能发笑，罐装的笑声正在变得越来越少，但在许多国家，它仍然是电视喜剧的重要组成部分。"}, {"id": 1593, "name": "Baby brain", "phrases": ["the lecture", "the baby", "many skills", "many times", "the first smile", "important moments"], "ref": "The lecture is about babies and how they learn. When a baby is born, its brain is already relatively large and the baby immediately starts learning. It has to learn many skills, such as talking, walking, and playing. It can't do these things until it has watched and listened to someone doing them many times. There are important moments for parents of young babies like the first smile at about six weeks and starting to walk after about 9 months. 讲座是关于婴儿以及他们如何学习的。当婴儿出生时，它的大脑已经相对较大，婴儿立即开始学习。它必须学习许多技能，如说话、走路和玩耍。它不能做这些事情，直到它多次观察和听取别人做这些事情。对于年幼婴儿的父母来说，有一些重要的时刻，比如大约六周时的第一次微笑，大约九个月后开始走路。"}, {"id": 1594, "name": "Health problem", "phrases": ["big problems", "the world", "enough exercise", "much electricity", "a special kind", "exercise bike", "the bike"], "ref": "There are two big problems in the world. These are that people don't get enough exercise and that they use too much electricity. There is a way to solve both these problems with a special kind of exercise bike which someone has invented. If you use the bike, you can get fit and you can also create electricity and use it in your home. 世界上有两大问题。这些是人们没有得到足够的锻炼，并且他们使用太多的电。有一种方法可以用某人发明的一种特殊的健身车来解决这两个问题。如果你使用自行车，你可以变得健康，也可以发电并在家里使用。"}, {"id": 1595, "name": "Start in university", "phrases": ["the lecture", "new students", "the speaker", "important things", "the lectures"], "ref": "The lecture tells new students at university what they should do. The speaker says that students should go to lectures, but if they can't go to one, they can see a video of it online. It's better to go to lectures and take notes, though, because taking notes can help students remember important things from the lectures. 讲座告诉大学新生他们应该做什么。演讲者说学生应该去听课，但如果他们不能去听课，他们可以在网上看到讲座的视频。最好去听课并记笔记，因为记笔记可以帮助学生记住讲座中重要的事情。"}, {"id": 1596, "name": "Savings", "phrases": ["the middle classes", "the last part", "the details", "p atterns", "the researchers", "the fact", "richer people", "important reason", "the second"], "ref": "The middle classes in some developing countries have grown considerably from the last part of the previous century. This has benefited those economies greatly, but economists need to further investigate some of the details, such as p atterns of savings and the reasons for saving. The researchers mentioned here carried out their studies in India. Their conclusions included the fact that, unsurprisingly, richer people and business owners tended to save more. T he most important reason for saving was to provide for retirement, and the second was to provide their children with things like education and marriage ceremonies, which presumably are expensive in India. 中产阶级在一些发展中国家自上个世纪后期以来有了显著的增长。这对这些国家的经济带来了极大的益处，但经济学家需要进一步研究一些细节，如储蓄模式和储蓄的原因。这里提到的研究者们在印度进行了他们的研究。他们的结论包括一个毫不意外的事实，即较富有的人和企业主倾向于储蓄更多。储蓄的最重要原因是为退休后的生活提供保障，其次是为了给子女提供诸如教育和婚礼等事宜，这些在印度通常是昂贵的。"}, {"id": 1597, "name": "Moon launch base", "phrases": ["a good base", "the Solar System", "the same issues", "a spacecraft", "the necessary infrastructure", "less fuel"], "ref": "The Moon could be a good base to launch spacecraft that would explore the Solar System further. Although some of the same issues would apply as when launching a spacecraft from Earth, it would be easier from the Moon because of less gravity. It would be cheaper because less fuel would be needed, and all the materials required to build the necessary infrastructure are already on the Moon naturally. 月球可能是发射进一步探索太阳系的航天器的良好基地。尽管可能会遇到一些与从地球发射航天器时相同的问题，但由于重力较小，从月球发射航天器会更容易。这会更便宜，因为需要的燃料更少，而且建造必要基础设施所需的所有材料已经在月球上天然存在了。"}, {"id": 1598, "name": "Roman London", "phrases": ["roman London", "the fact", "different inscriptions", "the Roman army"], "ref": "Writing was very important in Roman London, despite the fact that literacy rates then would have been much lower than they are today. Over 500 wooden writing tablets have survived with a lot of different inscriptions. These are related to business and commerce, with many written to the Roman army. Writing at that time was a tool of power. 在罗马时期的伦敦，尽管当时的识字率远低于今天，书写仍然非常重要。现存有500多块木质书写板，上面刻有各种不同的铭文。这些铭文与商业和贸易有关，其中许多是写给罗马军队的。在当时，书写是一种权力的工具。"}, {"id": 1599, "name": "Salt mining", "phrases": ["main ways", "a traditional method", "solar evaporation", "the salt", "solution mining", "underground rocks", "deep shaft mining collects"], "ref": "Salt has always been important throughout history. There are three main ways to extract salt. Solar evaporation is a traditional method. In this method, sun and wind dry out seawater, which has been collected in pools. The salt that remains can then be collected and processed. Solution mining uses liquid to extract and transport salt from underground rocks. Similarly, deep shaft mining collects salt from rocks, but by drilling and removing pieces of rock, which can then be processed. 盐在历史上一直很重要。提取盐主要有三种方法。太阳蒸发是一种传统的方法。在这种方法中，阳光和风使收集在池中的海水变干。剩下的盐可以被收集和处理。溶液采矿使用液体从地下岩石中提取和运输盐。类似地，深井采矿从岩石中收集盐，但是通过钻孔和移除岩石块，然后可以对其进行加工。"}, {"id": 1600, "name": "Higher education and further education", "phrases": ["main options", "further education", "an academic degree", "higher education", "many different professional contexts", "various skills", "further education train students", "a specific vocation", "practical work experience"], "ref": "Students who wish to continue their education after finishing school have two main options, namely higher or further education. Higher education involves studying for an academic degree. Students develop various skills that can be applied to many different professional contexts, so degrees are valued by employers. However, they are time consuming and expensive. By contrast, further education train students for a specific vocation. Students get practical work experience and learn the skills they need for a specific job. Although they might not be able to transfer these skills into other professions later. 希望在完成学业后继续接受教育的学生有两种主要选择，即高等教育或继续教育。高等教育包括攻读学位。学生培养各种技能，可以应用于许多不同的职业环境，因此学位受到雇主的重视。然而，它们既耗时又昂贵。相比之下，继续教育可以基于特定的职业需求对学生进行培养。学生获得实际工作经验，学习特定工作所需的技能。虽然他们以后可能无法将这些技能转移到其他职业中。"}, {"id": 1601, "name": "Paper marbling", "phrases": ["paper marbling", "unique Turkish styles", "turkish marbling designs", "the 17th century", "any slight damage", "marbled paper", "special classes", "social media"], "ref": "Paper marbling is a form of art which is thought to have originated in China and Japan. It later spread to Turkey, where unique Turkish styles of paper marbling became popular. Turkish marbling designs became very popular across Europe in the 17th century and especially in England where they were used extensively in the publishing industry. Marbled paper was used in books to cover up any slight damage to a book. Nowadays, this traditional art is far less common, but there are attempts to revive it by encouraging people to take special classes and by promoting it via social media. 石纹纸染是一种被认为起源于中国和日本的艺术形式。它后来传播到土耳其，在那里独特的土耳其风格的石纹纸染变得流行起来。土耳其石纹设计在17世纪在整个欧洲变得非常流行，特别是在英国，它们被广泛用于出版业。石纹纸染被用来掩盖书本上的任何轻微损坏。如今，这种传统艺术已经不那么常见了，但有人试图通过鼓励人们参加特殊课程并通过社交媒体推广来复兴它。"}, {"id": 1602, "name": "Typography", "phrases": ["A typography", "the style", "a research", "invented words", "the content", "the quality"], "ref": "Typography is about how you organize letters and text on a page. The aim is to do this so that it's easy to read and looks nice. A typography is important because we're very good at looking at the style and appearance of a document and making judgments about its purpose. This a research has provided proof of this. People were given pages written using invented words. Although they couldn't understand the content, they were still able to make judgments about the quality of the information from how it was presented in the document. 排版是关于如何在页面上组织字母和文本。目的是这样做，以便它易于阅读并且看起来漂亮。排版很重要，因为我们非常擅长查看文档的风格和外观，并对其目的做出判断。这项研究为此提供了证据。人们被给予用虚构的词语书写的页面。尽管他们无法理解内容，但他们仍然能够根据信息在文档中的呈现方式来判断信息的质量。"}, {"id": 1603, "name": "Cave paintings", "phrases": ["the world", "first artists", "40000 years", "hand prints", "cave walls", "a French cave", "both men", "the artists", "smaller hands"], "ref": "The world's first artists did cave paintings. They lived maybe as long as 40000 years ago. Instead of people, they painted animals. Animals were important because they used them for food and clothes. They also made hand prints on cave walls by painting around their hands. Research on paintings in a French cave showed that both men and women did them. People used to think the artists were usually men, but women have smaller hands than men, and most handprints in that cave were smaller ones. This is important because we now have to think again about who those early artists were. 世界上最早的艺术家创作了洞穴壁画。他们大概生活在40000年前。他们画的不是人，而是动物。动物很重要，因为它们用它们做食物和衣服。他们还通过在洞穴墙壁上画上手印。对法国一个洞穴中绘画的研究表明，男人和女人都进行过绘画。人们过去认为艺术家通常是男性，但女性的手比男性小，并且那个洞穴中的大多数手印都是较小的。这很重要，因为我们现在必须重新思考那些早期艺术家是谁。"}, {"id": 2551, "name": "A successful entrepreneur", "phrases": ["the lecture", "good ideas", "a great idea", "great ideas", "unique ideas", "basic things"], "ref": "The lecture mainly talks about good ideas. According to the lecture, a great idea should have several features. Firstly, the great idea should be various and novel. Secondly, the great idea should be unique, which means no one has thought about it. Thirdly, great ideas need to be transformative and productive. Finally, unique ideas are inspired by basic things. 这一讲座主要讲述了伟大创意。根据讲座，一个伟大的创意应该具备几个特点。首先，它应该是多样的和新颖的。其次，它应该是独特的，这意味着没有人曾想到过它。第三，伟大的创意需要兼具变革力量和生产潜力。最后，独特的创意往往受到基本事物的启发。"}, {"id": 2552, "name": "File a patent", "phrases": ["a patent", "presentation clickers", "every single clicker", "a decent amount", "the million-word version", "100 % chance"], "ref": "This lecture is mainly about patent. It would be impossible to get a patent on presentation clickers, since they have been used for a while. However, if we are able to get a patent on them, it would be incredibly valuable. Every single clicker that was made after that point would infringe, and we could collect $1-2 each. That would be added up to be a decent amount of money. If we choose the million-word version, we have almost 100% chance of getting that patent, but the value of that patent would be close to zero. 这一讲座主要讲述专利。如果我们能够为点击器获得专利，那将是非常有价值的。从那时起，每一个制造的点击器都会侵权，而制造每个点击器可能都需支付一两美元。最终，累积起来会成为一笔相当可观的金额。如果我们要申请的专利是极尽详细的百万字版本，我们几乎有100%的机会获得专利，但这个专利的价值几乎为零。"}, {"id": 2553, "name": "Alaska", "phrases": ["the lecture talks", "social issues", "the lecture", "native Alaskans", "the Native Americans", "poor conditions", "alaskan natives", "cultural identities"], "ref": "The lecture talks about social issues. According to the lecture, native Alaskans are suffering from a lack of mental and emotional well-being. This is because many of the Native Americans are living under poor conditions, and alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. In conclusion, Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods. 这一讲座讲述了社会问题。根据讲座，阿拉斯加土著人正遭受心理和情感健康的困扰。这是因为许多土著美国人在恶劣生存条件下挣扎，酗酒、家庭暴力、凶杀和自杀在他们当中频繁发生，这当然导致家庭破裂。总之，阿拉斯加土著人正在失去他们的社区、文化身份，以及最重要的童年。"}, {"id": 2554, "name": "Tobacco", "phrases": ["the lecture talks", "cigarette advertising", "the past few months", "all advertising outlets", "the tobacco industry", "the cigarette box", "the government", "plain packaging"], "ref": "The lecture talks about cigarette advertising. According to the lecture, over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. The tobacco industry argues that the cigarette box is not a form of advertising, while the speaker believes that the cigarette box has actually become iconic to each brand. So she hopes that the government will introduce plain packaging, and the UK will stop cigarette companies from using their box as a form of advertising. 讲座讨论了香烟广告问题。根据讲座内容，过去几个月来，政府一直在推动取消烟草行业的所有广告渠道，特别是推行统一包装（plain packaging）。烟草行业认为香烟盒本身并不是一种广告形式，但主讲人则认为，香烟盒实际上已经成为各个品牌的重要标志。因此，她希望政府能推行统一包装政策，从而在英国阻止烟草公司利用烟盒作为广告手段。"}, {"id": 3347, "name": "Music and well-being", "phrases": ["the lecture", "an intuitive part", "the next step", "the music", "many levels"], "ref": "The lecture mainly focuses on well-being, which includes health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. In addition, everybody has a level of well-being. The speaker also emphasizes that music so often forms an intuitive part of our well-being management, and the research takes the next step in the understanding of the power of music in human life. In conclusion, the music already works for us on so many levels, but there is no reason to stop here. 这次讲座主要关注幸福感，包括健康、幸福、成就感和满足感，以及人们能够茁壮成长的身心状态。此外，每个人都有自己的幸福感水平。讲者还强调，音乐天然融入人类对幸福感的追求，研究也在理解音乐在人类生活中力量的基础上迈出了下一步。总之，音乐已经在许多层面上为我们发挥作用，但没有理由止步于此。"}, {"id": 3348, "name": "Animal behavior V2", "phrases": ["the reason", "animal behavior", "conservation biologists", "a complete overhaul", "the entire field", "john tells", "an afield", "new developments"], "ref": "The reason why we study animal behavior is because we are interested in understanding why animals do what they do. Conservation biologists need to know what animals do if they’re going to save them. Fernando started out a research and it led to a complete overhaul of the entire field of neurobiology. And John tells you how fast an afield animal behavior is in his book. There are lots of new developments. 我们研究动物行为的原因是因为我们有兴趣理解动物为何会做出某种行为。保护生物学家如果要拯救动物，就需要知道它们的行为。费尔南多开始了他的研究，并促使了整个神经生物学领域的彻底改革。约翰在他的书中讲述了动物行为领域发展有多么迅速，事实上，这个领域有许多新的进展。"}, {"id": 3349, "name": "Arctic and Antarctic", "phrases": ["the polar regions", "the lecture", "the Greek word", "the earth", "the Greek hypothesize", "the speaker mentions", "big ocean", "本讲座主要探讨了位于地球两端的极地地区 — — 北极与南极。这两片区域分别坐落于地球的顶端与底端，其中"], "ref": "The lecture mainly talks about the polar regions, including Arctic and Antarctic. Moreover, they located at the top and bottom of the earth, and so the Arctic was named after the Greek word for bear. The lecture also mentions that now the Greek hypothesize that there would be the Anti-arctic, and these regions are opposite in many ways other than just their names and their location. Finally, the speaker mentions that the north pole isn’t on land, but it is one big ocean. 本讲座主要探讨了位于地球两端的极地地区——北极与南极。这两片区域分别坐落于地球的顶端与底端，其中\"北极\"的名称源于希腊语中的\"熊\"一词。讲座还提到，根据古希腊人的推测，应当存在一个与北极相对的区域，即\"南极\"。这两个地区除了名称和地理位置相对之外，在许多其他方面也呈现出对立特征。最后，讲者特别指出北极点并非位于陆地上，而是一片广阔的海洋。"}, {"id": 3350, "name": "Sugar", "phrases": ["the lecture", "other places", "the food labels", "the ingredient", "’ t eat something", "other food"], "ref": "The lecture is about sugar. There is sugar in a lot of foods where you don’t expect it. Besides, there are also other places where you see sugar and you don’t necessarily expect it. For example, sugar is the ingredient of peanut and beef stew, and you will not know this after you have read the food labels. Other food like fresh potatoes and carrots contain sugar, and you wouldn’t eat something like beef stew and expect to find this to be the case. 这堂讲座讲述的是糖。许多食物中都有糖，很多时候你并不预料到。例如，糖是花生酱和牛肉炖菜的成分之一，读了食品标签你才会知道这一点。像新鲜土豆和胡萝卜这类食物也含有糖，而你不会想到在牛肉炖菜中会发现糖的存在。"}, {"id": 3351, "name": "Taxonomy", "phrases": ["the lecture", "different groups", "the characteristics", "the US Postal Service", "an example", "a specific level", "street number", "the same way", "a taxonomy chart"], "ref": "The lecture is about taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. An example is the US Postal Service. In this service, people can address it to a specific level, to their city and then to their street number. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world. 这堂讲座讲述的是分类学。分类学是科学家根据有共同特征的生物将它们分入不同的组别。例如，美国邮政服务就是一个例子。在这个服务中，人们可以按照一定的层级来寄信，先是地址到所在的城市，然后到具体的街道号码。同样，科学家使用分类学图表来精确定位生物和有机体，并了解它们与世界上其他事物的关系。"}, {"id": 3352, "name": "Immigration control", "phrases": ["all immigration controls", "the world economy", "a typical immigrant", "the countries", "gain money", "informal channels", "the money", "clean water"], "ref": "The economists calculated that removing all immigration controls would double the size of the world economy or would lead to disproportionately big gains. A study found that a typical immigrant who arrives in US ends up with $20,000 a year. The countries they come from gain money as well. People send money back to their countries in formal and informal channels. The money is directly paid for food, clean water, and medicines. 经济学家计算出，取消所有移民控制将使全球经济规模翻倍，或者至少会带来不成比例的大幅增长。一项研究发现，典型的移民到达美国后每年收入为20,000美元。移民原籍的国家也会从中获益。移民通过正式和非正式渠道将钱汇回家乡。这些资金直接用于民生需求，如食品、净水和药品。"}, {"id": 3353, "name": "Civilization and art", "phrases": ["a civilization", "the production", "the producers", "the social structure", "the vehicle", "the world"], "ref": "This lecture talks about civilization and art. It is impossible to have a civilization without art. Civilization reflects the production of culture and the producers of art and culture should mirror back to the core of the society. People themselves and individuals are relating to the social structure at that time. Art is the vehicle through which we understand that were you to take away art, and it also reflects that how people look at the world in different ways. 这节课讲述了文明与艺术的关系。没有艺术就不可能有文明。文明反映了文化的生产，而艺术和文化的生产者应该将社会的核心反映出来。人们自身以及个体与当时的社会结构之间的关系也在其中体现。艺术是我们理解这一切的媒介。如果没有艺术，我们将无法看到人们如何以不同的方式看待世界。"}, {"id": 3354, "name": "Shy fish", "phrases": ["A new study", "shy individuals", "the scientists", "the fish", "the bold fish", "such tendencies"], "ref": "A new study shows that shy individuals actually prefer to follow fish that are similarly timid. The scientists separated the fish into two groups, found that shy individuals actually prefer to follow fish that are similarly timid. That’s because the bold fish initiated more trips, regardless of who might be tailing them. If such tendencies also hold true in humans, when Americans decide who they’ll follow in November. 一项新的研究表明，胆小的个体实际上更喜欢跟随性格相似的胆小鱼。科学家将鱼分为两组，发现胆小的个体确实更喜欢跟随性格相似的胆小鱼。这是因为大胆的鱼发起了更多的出行，无论是谁在尾随它们。如果这种趋势在人类中也成立，那么当美国人在11月决定跟随谁时，可能会有类似的现象。"}, {"id": 3355, "name": "Animal behavior", "phrases": ["fundamental questions", "animal behavior", "proximate questions", "the mechanisms", "the ultimate questions", "the evolution", "the behavior develop", "two sub-questions", "the behavior evolve"], "ref": "Two fundamental questions about animal behavior are referred to as proximate and ultimate. Proximate questions are those concerned with the mechanisms that bring about behavior. The ultimate questions are those concerned with the evolution of behavior. Two sub-questions are how does the behavior develop, and secondly what causes the behavior. For ultimate, you can ask how did the behavior evolve, and what is the adaptive significance of the behavior. Together these comprise four questions about animal behavior. 关于动物行为有两个基本问题，分别被称为近因问题和远因问题。近因问题关注的是导致行为发生的机制，而远因问题则关注行为的演化。近因问题的两个子问题是：行为是如何发展的？其次，是什么导致了这种行为？对于远因问题，可以问：这种行为是如何演化来的？以及这种行为的适应意义是什么？这四个问题合起来构成了关于动物行为的四个基本问题。"}, {"id": 3356, "name": "Early spring", "phrases": ["the spring time phenomena", "the lecture", "the first cause", "urban light pollution", "the ecosystem", "early bud burst", "smarter lighting"], "ref": "The lecture mainly talks about the spring time phenomena, which means that first blooms of flowers are getting earlier. The first cause if the rising temperature and another reason is urban light pollution, which pushed bud burst earlier, and way beyond what rising temperatures could achieve. The lecture also mentions that this disruptive timing can ripple through the ecosystem such as caterpillars and birds. However, smarter lighting could help with
