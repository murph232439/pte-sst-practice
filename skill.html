er thing", "the fact", "the context", "roman Britain", "many other inscriptions", "500 examples", "an awful lot", "the Roman army", "a society", "fancy metal inkwells"], "eng": "The other thing that this tablet tells us a little about, about, as I've mentioned, is the fact that writing is hugely important in Roman London. And it's something which really marks it out within the context of Roman Britain. Here we have in excess of 500 examples of wooden writing tablet surviving, many, many other inscriptions. 500 An awful lot of them are tool with this whole kind of idea of commerce, of business transaction, an awful lot of it. Written texts are tool of the Roman army, and that's precisely because writing in a society that where literacy rates would have been significantly lower than they were today was really a tool of power. And things like these rather fancy metal inkwells, which have been found in a number of sites in London, I think really reflect that. And in fact, they're within Britain. They're quite heavily concentrated here.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2657000-2658000/2657205/1ff8b6bea72b47529fff9cef6f5cb66a.mp3\"></audio></div><br />Writing was very important in Roman London, despite the fact that literacy rates then would have been much lower than they are today. Over 500 wooden writing tablets have survived with a lot of different inscriptions. These are related to business and commerce, with many written to the Roman army. Writing at that time was a tool of power.<br />在罗马时期的伦敦，尽管当时的识字率远低于今天，书写仍然非常重要。现存有500多块木质书写板，上面刻有各种不同的铭文。这些铭文与商业和贸易有关，其中许多是写给罗马军队的。在当时，书写是一种权力的工具。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657205/1ff8b6bea72b47529fff9cef6f5cb66a.mp3", "phrases2": [{"en": "the other thing", "zh": ""}, {"en": "the fact", "zh": ""}, {"en": "the context", "zh": ""}, {"en": "roman Britain", "zh": ""}, {"en": "many other inscriptions", "zh": ""}, {"en": "500 examples", "zh": ""}, {"en": "an awful lot", "zh": ""}, {"en": "the Roman army", "zh": ""}, {"en": "a society", "zh": ""}, {"en": "fancy metal inkwells", "zh": ""}]}, {"id": 1599, "name": "Salt mining", "phrases": ["the salt trade", "greater role", "salt mining", "important today", "the earliest method", "solar evaporation", "shallow pools", "the sea water dries", "A newer technique", "solution mining"], "eng": "The salt trade has existed for thousands of years and arguably has played an even greater role in shaping the world's economic and social history than products like silk, cotton, or spices. Salt mining is still hugely important today, and there are three basic ways that salt can be extracted from oceans or underground sources. So starting with probably the earliest method, which is solar evaporation. —— This method is used to extract salt from seawater. Basically, seawater is collected in shallow pools. The sea water dries out when it's exposed to sun and wind. When this happens, a layer of salt is left behind, which can be cleaned and harvested. A newer technique is solution mining. This method uses a water solution to extract salt from underground rock sources. Water is injected into the rock and absorbs the salt. The salty liquid is then pumped back to the surface where the salt can be extracted at a processing plant. Finally, deep shaft mining is similar to other types of mineral mining. Here, pieces of rock containing the salt are drilled away from the mine shaft. These pieces are then crushed into smaller chunks and transported to the top for processing.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2657000-2658000/2657568/72bd10d5eef54a3eb2ba10dc89b62abc.mp3\"></audio></div><br />Salt has always been important throughout history. There are three main ways to extract salt. Solar evaporation is a traditional method. In this method, sun and wind dry out seawater, which has been collected in pools. The salt that remains can then be collected and processed. Solution mining uses liquid to extract and transport salt from underground rocks. Similarly, deep shaft mining collects salt from rocks, but by drilling and removing pieces of rock, which can then be processed.<br />盐在历史上一直很重要。提取盐主要有三种方法。太阳蒸发是一种传统的方法。在这种方法中，阳光和风使收集在池中的海水变干。剩下的盐可以被收集和处理。溶液采矿使用液体从地下岩石中提取和运输盐。类似地，深井采矿从岩石中收集盐，但是通过钻孔和移除岩石块，然后可以对其进行加工。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657568/54bddc08978f409192c6d980c59b4881.mp3", "phrases2": [{"en": "the salt trade", "zh": ""}, {"en": "greater role", "zh": ""}, {"en": "salt mining", "zh": ""}, {"en": "important today", "zh": ""}, {"en": "the earliest method", "zh": ""}, {"en": "solar evaporation", "zh": ""}, {"en": "shallow pools", "zh": ""}, {"en": "the sea water dries", "zh": ""}, {"en": "A newer technique", "zh": ""}, {"en": "solution mining", "zh": ""}]}, {"id": 1600, "name": "Higher education and further education", "phrases": ["the study options", "main choices", "a university degree", "higher education", "detailed study", "the skills students", "many different careers", "degree courses", "further education", "practical skills"], "eng": "Today, we're looking at the study options available to students after completing school, and the two main choices are higher education and further education. Higher education basically means studying for a university degree. This involves detailed study and is usually theoretical in nature. That said, the skills students learn can be used in many different careers, so companies are eager to hire graduates. However, remember that degree courses are long and costly. Conversely, further education focuses more on practical skills rather than theoretical knowledge. These courses prepare students for a specific job, such as training to be a chef and offer great practical work experience opportunities. However, as the skills learnt on further education courses tend to be more specialized, they can not be transferred to other types of career very easily. As you can see, it's important to compare the pros and cons of higher and further education carefully before making a decision.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2657000-2658000/2657206/d7fabf9f4bea4f23807e476a2b99d686.mp3\"></audio></div><br />Students who wish to continue their education after finishing school have two main options, namely higher or further education. Higher education involves studying for an academic degree. Students develop various skills that can be applied to many different professional contexts, so degrees are valued by employers. However, they are time consuming and expensive. By contrast, further education train students for a specific vocation. Students get practical work experience and learn the skills they need for a specific job. Although they might not be able to transfer these skills into other professions later.<br />希望在完成学业后继续接受教育的学生有两种主要选择，即高等教育或继续教育。高等教育包括攻读学位。学生培养各种技能，可以应用于许多不同的职业环境，因此学位受到雇主的重视。然而，它们既耗时又昂贵。相比之下，继续教育可以基于特定的职业需求对学生进行培养。学生获得实际工作经验，学习特定工作所需的技能。虽然他们以后可能无法将这些技能转移到其他职业中。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657206/b7c9b04bddc64340bfe39090d33bcaf6.mp3", "phrases2": [{"en": "the study options", "zh": ""}, {"en": "main choices", "zh": ""}, {"en": "a university degree", "zh": ""}, {"en": "higher education", "zh": ""}, {"en": "detailed study", "zh": ""}, {"en": "the skills students", "zh": ""}, {"en": "many different careers", "zh": ""}, {"en": "degree courses", "zh": ""}, {"en": "further education", "zh": ""}, {"en": "practical skills", "zh": ""}]}, {"id": 1601, "name": "Paper marbling", "phrases": ["paper marbling", "the name", "special water", "detailed designs", "the history", "the origins", "turkish paper marbling", "own particular styles", "the 17th century", "the publishing industry"], "eng": "Today I am going to talk about the art of paper marbling, which, as the name suggests, is about adding beautiful, colorful designs onto paper. It involves putting a piece of paper onto a tray of special water and paint in order to create unique and detailed designs. As for the history of this art, the origins are not entirely known, although it is believed to have begun in China or Japan. Paper marbling subsequently became very popular in Turkey. Indeed, Turkish paper marbling developed its own particular styles, characterized by brighter colors. This type of marbling gained a lot of popularity in Europe in the 17th century and was used extensively in the publishing industry for book covers, especially in England. 17 It was an attractive and effective way of hiding any minor damage to a book. Nowadays, the art of paper marbling is in decline for various reasons. However, there are attempts to encourage a new generation to discover paper marbling and social media is a great way to promote it to a new audience. Paper marbling classes are also starting to appear, so perhaps there is hope for this art.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658428/76ef70d575054ab2b2fdf5ebb7f9201c.mp3\"></audio></div><br />Paper marbling is a form of art which is thought to have originated in China and Japan. It later spread to Turkey, where unique Turkish styles of paper marbling became popular. Turkish marbling designs became very popular across Europe in the 17th century and especially in England where they were used extensively in the publishing industry. Marbled paper was used in books to cover up any slight damage to a book. Nowadays, this traditional art is far less common, but there are attempts to revive it by encouraging people to take special classes and by promoting it via social media.<br />石纹纸染是一种被认为起源于中国和日本的艺术形式。它后来传播到土耳其，在那里独特的土耳其风格的石纹纸染变得流行起来。土耳其石纹设计在17世纪在整个欧洲变得非常流行，特别是在英国，它们被广泛用于出版业。石纹纸染被用来掩盖书本上的任何轻微损坏。如今，这种传统艺术已经不那么常见了，但有人试图通过鼓励人们参加特殊课程并通过社交媒体推广来复兴它。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658428/fb74543142da4d19ab6bdd72d8fb7260.mp3", "phrases2": [{"en": "paper marbling", "zh": ""}, {"en": "the name", "zh": ""}, {"en": "special water", "zh": ""}, {"en": "detailed designs", "zh": ""}, {"en": "the history", "zh": ""}, {"en": "the origins", "zh": ""}, {"en": "turkish paper marbling", "zh": ""}, {"en": "own particular styles", "zh": ""}, {"en": "the 17th century", "zh": ""}, {"en": "the publishing industry", "zh": ""}]}, {"id": 1602, "name": "Typography", "phrases": ["a visual world", "a document", "an immediate judgment", "some common assumptions readers", "recent research", "the text", "important decisions", "the information", "a possible use", "the content"], "eng": "Typography is the art and technique of arranging letters and text on a page so that readers can read it easily and it looks attractive. So people want to read it. Why does typography matter? Well, we live in a visual world, we're used to figuring out the aim of a document by looking at its style and appearance even before we start reading it. Whenever we see a document, we form an immediate judgment. We're experts at doing this. Recent research into readers' responses to different types of print designs has revealed some common assumptions readers make when they first see a document. Subjects were presented with carefully designed pages, but couldn't read any of the text because it contained words which don't actually exist. Despite this, they could still make important decisions based on how the information was presented. They quickly decided how accurate the content was and a possible use of the document. They also looked at the boxes of texts and images to decide how serious the text might be. If the text boxes were in lots of different colors, shapes and sizes, then these were related to negative qualities. These results confirm that readers respond to how something is designed as soon as they see it.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658429/5b73e38eebb74113a7459ba14276f31f.mp3\"></audio></div><br />Typography is about how you organize letters and text on a page. The aim is to do this so that it&#39;s easy to read and looks nice. A typography is important because we&#39;re very good at looking at the style and appearance of a document and making judgments about its purpose. This a research has provided proof of this. People were given pages written using invented words. Although they couldn&#39;t understand the content, they were still able to make judgments about the quality of the information from how it was presented in the document.<br />排版是关于如何在页面上组织字母和文本。目的是这样做，以便它易于阅读并且看起来漂亮。排版很重要，因为我们非常擅长查看文档的风格和外观，并对其目的做出判断。这项研究为此提供了证据。人们被给予用虚构的词语书写的页面。尽管他们无法理解内容，但他们仍然能够根据信息在文档中的呈现方式来判断信息的质量。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658429/7d2172a86cfa4e2c88753003c6141f5c.mp3", "phrases2": [{"en": "a visual world", "zh": ""}, {"en": "a document", "zh": ""}, {"en": "an immediate judgment", "zh": ""}, {"en": "some common assumptions readers", "zh": ""}, {"en": "recent research", "zh": ""}, {"en": "the text", "zh": ""}, {"en": "important decisions", "zh": ""}, {"en": "the information", "zh": ""}, {"en": "a possible use", "zh": ""}, {"en": "the content", "zh": ""}]}, {"id": 1603, "name": "Cave paintings", "phrases": ["the world", "first artists", "human beings", "the walls", "the animals", "the cave walls", "the second question", "the paintings", "a long time", "the artists"], "eng": "The world's first artists were ancient people who lived 40000 years ago or more and did cave paintings. 40000 But what did they paint? And who exactly were these early artists? Well, they didn't paint human beings. Instead, they painted animals on the walls of their caves. That's because animals were very important to them. After all, the animals provided them with food and clothing, as well as animals. They put their hands against the cave walls and painted around them. And it's these handprints which may help us to answer the second question, who did the paintings? For a long time, it was believed that it was mostly men. However, research done on paintings in a cave in France has shown that the artists were often women and not just men. We know this because the size of women's hands is smaller than men's hands. In fact, the majority of the hand prints in the French cave were smaller ones. This has made us think again about who the world's first artists really were.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2658000-2659000/2658430/b682a32130054f5b99a15425e2a0fc34.mp3\"></audio></div><br />The world&#39;s first artists did cave paintings. They lived maybe as long as 40000 years ago. Instead of people, they painted animals. Animals were important because they used them for food and clothes. They also made hand prints on cave walls by painting around their hands. Research on paintings in a French cave showed that both men and women did them. People used to think the artists were usually men, but women have smaller hands than men, and most handprints in that cave were smaller ones. This is important because we now have to think again about who those early artists were.<br />世界上最早的艺术家创作了洞穴壁画。他们大概生活在40000年前。他们画的不是人，而是动物。动物很重要，因为它们用它们做食物和衣服。他们还通过在洞穴墙壁上画上手印。对法国一个洞穴中绘画的研究表明，男人和女人都进行过绘画。人们过去认为艺术家通常是男性，但女性的手比男性小，并且那个洞穴中的大多数手印都是较小的。这很重要，因为我们现在必须重新思考那些早期艺术家是谁。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658430/dd33a669d39b4a04b9c74769a6f5b5e6.mp3", "phrases2": [{"en": "the world", "zh": ""}, {"en": "first artists", "zh": ""}, {"en": "human beings", "zh": ""}, {"en": "the walls", "zh": ""}, {"en": "the animals", "zh": ""}, {"en": "the cave walls", "zh": ""}, {"en": "the second question", "zh": ""}, {"en": "the paintings", "zh": ""}, {"en": "a long time", "zh": ""}, {"en": "the artists", "zh": ""}]}, {"id": 2551, "name": "A successful entrepreneur", "phrases": ["a good idea varies", "a successful entrepreneur", "great idea", "several features", "great ideas", "other smaller ideas", "all ideas", "a concept stand", "the individuality", "the basic idea"], "eng": "To be a successful entrepreneur, you should have good ideas, but the definition of a good idea varies depending on whom you ask. “ ” A great idea should have several features. Firstly, the great idea should be various and novel. Secondly, the great idea should be unique, which means no one has thought about it. Thirdly, it is essential for great ideas to be transformative and productive. All ideas are essentially a combination of other smaller ideas, but this doesn't mean they can't be unique. Merely copying doesn't make anything idiosyncratic, it's the individuality that one puts in which makes a concept stand out. Constant innovation leaves no room for stagnation and thus, adds on to the basic idea, effectively making it unique. Unique ideas are inspired by basic things, they are simply extensions of pre-existing notions. And, an idea or a concept is unique only when it transcends its predecessor and serves its purpose in a better and more precise way.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678141/6a8108b335b44a26a46c536ca8056d61.mp3\"></audio></div><br />The lecture mainly talks about good ideas. According to the lecture, a great idea should have several features. Firstly, the great idea should be various and novel. Secondly, the great idea should be unique, which means no one has thought about it. Thirdly, great ideas need to be transformative and productive. Finally, unique ideas are inspired by basic things.<br />这一讲座主要讲述了伟大创意。根据讲座，一个伟大的创意应该具备几个特点。首先，它应该是多样的和新颖的。其次，它应该是独特的，这意味着没有人曾想到过它。第三，伟大的创意需要兼具变革力量和生产潜力。最后，独特的创意往往受到基本事物的启发。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678141/0dd508cd6ab24ab1b7a08544d3286531.mp3", "phrases2": [{"en": "a good idea varies", "zh": ""}, {"en": "a successful entrepreneur", "zh": ""}, {"en": "great idea", "zh": ""}, {"en": "several features", "zh": ""}, {"en": "great ideas", "zh": ""}, {"en": "other smaller ideas", "zh": ""}, {"en": "all ideas", "zh": ""}, {"en": "a concept stand", "zh": ""}, {"en": "the individuality", "zh": ""}, {"en": "the basic idea", "zh": ""}]}, {"id": 2552, "name": "File a patent", "phrases": ["a patent", "the patent office", "the patent officer", "the clicker", "presentation clickers", "a 0 % chance", "every single clicker", "two dollars", "a decent amount", "the other end"], "eng": "We’re thinking about this and we’re trying to say, alright, well, let’s file on a patent on this clicker. If I were to go to the patent office and say, alright, I want a patent on a clicker, period. The patent officer would just laugh. You know, the clicker has been around for a while. Presentation clickers have been around for a while. And so there would be a 0% chance that you would actually get that. If we were to somehow convince the patent office that we should be able to get on a patent on clicker, period. It would, however, be incredibly valuable. Every single clicker that was made after this point would infringe. And when it infringes, maybe we take one or two dollars each. That would be added up to be a decent amount of money. On the other end of the spectrum, let’s go to the million-word version. I go to the patent office and I say, I want a patent on this exact thing. And those million words describe every single radius, every single material, every single thing about this. And the patent officer says, yeah, we've never seen that before. Go ahead and take it. Almost 100% of chance of getting that patent, but the value of that patent would be close to zero. 100%", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678145/a1b32a79179b4522ad5cbdc92889bfbb.mp3\"></audio></div><br />This lecture is mainly about patent. It would be impossible to get a patent on presentation clickers, since they have been used for a while. However, if we are able to get a patent on them, it would be incredibly valuable. Every single clicker that was made after that point would infringe, and we could collect $1-2 each. That would be added up to be a decent amount of money. If we choose the million-word version, we have almost 100% chance of getting that patent, but the value of that patent would be close to zero.<br />这一讲座主要讲述专利。如果我们能够为点击器获得专利，那将是非常有价值的。从那时起，每一个制造的点击器都会侵权，而制造每个点击器可能都需支付一两美元。最终，累积起来会成为一笔相当可观的金额。如果我们要申请的专利是极尽详细的百万字版本，我们几乎有100%的机会获得专利，但这个专利的价值几乎为零。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678145/a1b32a79179b4522ad5cbdc92889bfbb.mp3", "phrases2": [{"en": "a patent", "zh": ""}, {"en": "the patent office", "zh": ""}, {"en": "the patent officer", "zh": ""}, {"en": "the clicker", "zh": ""}, {"en": "presentation clickers", "zh": ""}, {"en": "a 0 % chance", "zh": ""}, {"en": "every single clicker", "zh": ""}, {"en": "two dollars", "zh": ""}, {"en": "a decent amount", "zh": ""}, {"en": "the other end", "zh": ""}]}, {"id": 2553, "name": "Alaska", "phrases": ["the social issues", "the native Alaskans", "the Native Americans", "poor conditions", "the cases", "alcohol abuse", "domestic violence", "many children", "a matter", "the children"], "eng": "One of the social issues faced by the state of Alaska is the lack of mental and emotional well-being of the native Alaskans. It is very unfortunate that many of the Native Americans are living under poor conditions throughout the country. In the cases of native Alaskans, even virtually entire villages are suffering from a lack of mental and emotional well-being, which includes continuing poor physical and mental health. Alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. It is tragic to see that many children are abused and not educated properly. As a matter of fact, the children themselves are abusing alcohol and other chemicals, and the rate is increasing over time. Since parents are suffering from mental illnesses and alcohol abuse, they can't take care of their children. So many children are being taken care of by others or simply neglected. Therefore, we can conclude that Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods. So you can see how serious the issue is. Plus, rather than making a living for themselves, they are depending on public services and subsidies. They have lost control of and responsibility for their economy and governing institutions.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678139/032df2ea03a1410fbc5e8294de157fe1.mp3\"></audio></div><br />The lecture talks about social issues. According to the lecture, native Alaskans are suffering from a lack of mental and emotional well-being. This is because many of the Native Americans are living under poor conditions, and alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. In conclusion, Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods.<br />这一讲座讲述了社会问题。根据讲座，阿拉斯加土著人正遭受心理和情感健康的困扰。这是因为许多土著美国人在恶劣生存条件下挣扎，酗酒、家庭暴力、凶杀和自杀在他们当中频繁发生，这当然导致家庭破裂。总之，阿拉斯加土著人正在失去他们的社区、文化身份，以及最重要的童年。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678139/187d73a6c491475792b6d7fcd6fd0283.mp3", "phrases2": [{"en": "the social issues", "zh": ""}, {"en": "the native Alaskans", "zh": ""}, {"en": "the Native Americans", "zh": ""}, {"en": "poor conditions", "zh": ""}, {"en": "the cases", "zh": ""}, {"en": "alcohol abuse", "zh": ""}, {"en": "domestic violence", "zh": ""}, {"en": "many children", "zh": ""}, {"en": "a matter", "zh": ""}, {"en": "the children", "zh": ""}]}, {"id": 2554, "name": "Tobacco", "phrases": ["the past few months", "all advertising outlets", "the tobacco industry", "the cigarette box", "the last 50 years", "cigarette advertising", "the social aspects", "the present day", "each brand", "a smoker"], "eng": "Over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. The tobacco industry, however, is against this and they in particular argue that the cigarette box is not a form of advertising. Michaela has been doing her Ph.D. looking at cigarette advertising and how it's changed over the last 50 years. 50 Basically, I've accessed advertising from the tobacco industry since the 1950s and just analyze the images and looked at the use of the cigarette box within the adverts. 20 50 In the very early adverts, the cigarette box is a very small part of the adverts and they focus much more on the social aspects of smoking. However, as you move through the decades and get closer to the present day, the cigarette box became more and more of a focal point in the adverts. My argument is that the cigarette box has actually become iconic to each brand. So when a smoker takes a box out of their pocket, they are actually advertising that brand. So what we hope will come out of this is that the government will introduce plain packaging. And like Australia which has already introduced its policy and Ireland which is again beginning to introduce its policy, we hope that the UK will stop cigarette companies from using their box as a form of advertising.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2678000-2679000/2678140/02b0625eb3ee4286bfaecdb30b0748f6.mp3\"></audio></div><br />The lecture talks about cigarette advertising. According to the lecture, over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. The tobacco industry argues that the cigarette box is not a form of advertising, while the speaker believes that the cigarette box has actually become iconic to each brand. So she hopes that the government will introduce plain packaging, and the UK will stop cigarette companies from using their box as a form of advertising.<br />讲座讨论了香烟广告问题。根据讲座内容，过去几个月来，政府一直在推动取消烟草行业的所有广告渠道，特别是推行统一包装（plain packaging）。烟草行业认为香烟盒本身并不是一种广告形式，但主讲人则认为，香烟盒实际上已经成为各个品牌的重要标志。因此，她希望政府能推行统一包装政策，从而在英国阻止烟草公司利用烟盒作为广告手段。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678140/c9f68c45e69046d2a1a9e01404e04e61.mp3", "phrases2": [{"en": "the past few months", "zh": ""}, {"en": "all advertising outlets", "zh": ""}, {"en": "the tobacco industry", "zh": ""}, {"en": "the cigarette box", "zh": ""}, {"en": "the last 50 years", "zh": ""}, {"en": "cigarette advertising", "zh": ""}, {"en": "the social aspects", "zh": ""}, {"en": "the present day", "zh": ""}, {"en": "each brand", "zh": ""}, {"en": "a smoker", "zh": ""}]}, {"id": 3347, "name": "Music and well-being", "phrases": ["extraordinary challenges", "personal circumstances", "an intuitive part", "well-being management", "the next step", "intuitive application", "many levels", "personal endeavours"], "eng": "So what do we mean by well-being? Health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. Well-being is not something that is purely limited to people who are facing extraordinary challenges in their lifestyle, health or personal circumstances, everybody here has a level of well-being. Music so often forms an intuitive part of our well-being management, music to pick us up, music to calm us down, music to heal our sorrows. Our aim through research is to move from this level of intuitive application of music through to informed use in our communities to take the next step in the understanding of the power of music in human life. Music already works for us on so many levels whether it’s soothing and teaching our infants, bringing people and communities together, adding spirit to our work and personal endeavours, but there is no reason to stop here.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690232/151cfbcb6cff491590ac0aa2fee62223.mp3\"></audio></div><br />The lecture mainly focuses on well-being, which includes health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. In addition, everybody has a level of well-being. The speaker also emphasizes that music so often forms an intuitive part of our well-being management, and the research takes the next step in the understanding of the power of music in human life. In conclusion, the music already works for us on so many levels, but there is no reason to stop here.<br />这次讲座主要关注幸福感，包括健康、幸福、成就感和满足感，以及人们能够茁壮成长的身心状态。此外，每个人都有自己的幸福感水平。讲者还强调，音乐天然融入人类对幸福感的追求，研究也在理解音乐在人类生活中力量的基础上迈出了下一步。总之，音乐已经在许多层面上为我们发挥作用，但没有理由止步于此。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690232/16d473f22cd9449ebacf84efb9aaaef3.mp3", "phrases2": [{"en": "extraordinary challenges", "zh": ""}, {"en": "personal circumstances", "zh": ""}, {"en": "an intuitive part", "zh": ""}, {"en": "well-being management", "zh": ""}, {"en": "the next step", "zh": ""}, {"en": "intuitive application", "zh": ""}, {"en": "many levels", "zh": ""}, {"en": "personal endeavours", "zh": ""}]}, {"id": 3348, "name": "Animal behavior V2", "phrases": ["animal behavior", "other reasons", "conservation biologists", "much space", "many mates", "the outcome", "the research", "fernando Nottebohm", "a complete overhaul", "the entire field"], "eng": "Why should we bother studying animal behavior? Well, first and foremost, because we are interested in understanding why animals do what they do. There are lots of other reasons for studying animal behavior. Conservation biologists need to know what animals do if they’re going to save them. Are those animals social or solitary? How much space do they need and how many mates do they have? Sometimes you can’t predict the outcome of the research. Fernando Nottebohm started out being interested in how birds know what to sing. · Yet his research eventually led to a complete overhaul of the entire field of neurobiology, a totally unanticipated yet utterly monumental effect. And this is the course textbook by John Alcock the fact that this is in its ninth edition tells you how fast an afield animal behavior is. · John Alcock There are lots of new developments.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690235/b41850b13cc74212b46c69d511c99077.mp3\"></audio></div><br />The reason why we study animal behavior is because we are interested in understanding why animals do what they do. Conservation biologists need to know what animals do if they&rsquo;re going to save them. Fernando started out a research and it led to a complete overhaul of the entire field of neurobiology. And John tells you how fast an afield animal behavior is in his book. There are lots of new developments.<br />我们研究动物行为的原因是因为我们有兴趣理解动物为何会做出某种行为。保护生物学家如果要拯救动物，就需要知道它们的行为。费尔南多开始了他的研究，并促使了整个神经生物学领域的彻底改革。约翰在他的书中讲述了动物行为领域发展有多么迅速，事实上，这个领域有许多新的进展。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690235/5e1b588016bb4a6792d1a71d6366e8f7.mp3", "phrases2": [{"en": "animal behavior", "zh": ""}, {"en": "other reasons", "zh": ""}, {"en": "conservation biologists", "zh": ""}, {"en": "much space", "zh": ""}, {"en": "many mates", "zh": ""}, {"en": "the outcome", "zh": ""}, {"en": "the research", "zh": ""}, {"en": "fernando Nottebohm", "zh": ""}, {"en": "a complete overhaul", "zh": ""}, {"en": "the entire field", "zh": ""}]}, {"id": 3349, "name": "Arctic and Antarctic", "phrases": ["the polar regions", "the Greek word", "the Arctic", "the polar bears", "great bear constellations", "the name Antarctica", "the Greeks", "the Arctic first", "many ways", "’ t realize"], "eng": "So, when we talk about the polar regions, just to clarify exactly what we mean. And we have first of all the Arctic at the top of the earth and the Antarctic at the bottom, and so the Arctic was named after the Greek word for bear. “ ” Now surprisingly it’s not after the polar bears that live in the Antarctic or live in the Arctic and based on it’s after the little and great bear constellations that can be seen in the sky. Now the Greeks also hypothesize that there would be the Anti-arctic, which is how we get the name Antarctica and of course it wasn’t discovered until much later on. “ ” “ ” Now these regions are opposite in many ways other than just their names and their location on the globe, and so if we look at the Arctic first of all, and the Arctic is actually ocean surrounded by land, and so you can see here this is the UK down here and this kind of Russia and then American Canada around here, and so there is a bit of land cover in our ice on the top in the Arctic, which is Greenland here and Macie all this area here. Surprisingly a lot of people don’t realize that this isn’t actually land. The north pole isn’t on land. It’s just one big ocean.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690237/8ea37ec85eda4010ae51b83da823690e.mp3\"></audio></div><br />The lecture mainly talks about the polar regions, including Arctic and Antarctic. Moreover, they located at the top and bottom of the earth, and so the Arctic was named after the Greek word for bear. The lecture also mentions that now the Greek hypothesize that there would be the Anti-arctic, and these regions are opposite in many ways other than just their names and their location. Finally, the speaker mentions that the north pole isn&rsquo;t on land, but it is one big ocean.<br />本讲座主要探讨了位于地球两端的极地地区&mdash;&mdash;北极与南极。这两片区域分别坐落于地球的顶端与底端，其中&quot;北极&quot;的名称源于希腊语中的&quot;熊&quot;一词。讲座还提到，根据古希腊人的推测，应当存在一个与北极相对的区域，即&quot;南极&quot;。这两个地区除了名称和地理位置相对之外，在许多其他方面也呈现出对立特征。最后，讲者特别指出北极点并非位于陆地上，而是一片广阔的海洋。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690237/2e62defb91714f708f773dc24b6a5fd3.mp3", "phrases2": [{"en": "the polar regions", "zh": ""}, {"en": "the Greek word", "zh": ""}, {"en": "the Arctic", "zh": ""}, {"en": "the polar bears", "zh": ""}, {"en": "great bear constellations", "zh": ""}, {"en": "the name Antarctica", "zh": ""}, {"en": "the Greeks", "zh": ""}, {"en": "the Arctic first", "zh": ""}, {"en": "many ways", "zh": ""}, {"en": "’ t realize", "zh": ""}]}, {"id": 3350, "name": "Sugar", "phrases": ["’ s lots", "ice cream", "an example", "peanut butter", "skippy Peanut Butter", "common ingredient", "the reading food labels", "any food labels", "another example", "beef stew"], "eng": "There’s sugar in a lot of foods where you don’t expect it. Of course there’s lots of sugar in donuts, ice cream, pastries, or other things that are sweet; candy of course, but there are other places where you see it and you don’t necessarily expect it. So as an example: peanut butter. Here’s a list of ingredients from Skippy Peanut Butter and you see that sugar is the second most common ingredient. Skippy So that you may know from the reading food labels that these ingredients in any food labels that are listed in order of how much there is in the food itself, so sugar comes right after peanuts. Here’s another example, Beef stew, you wouldn’t necessarily expect to find sugar in beef stew but it’s there. Now it’s down the list of ingredients, it’s actually toward the end, but if you look at the marketing of this and food at the can, it says, there’s fresh potatoes and carrots, but actually there’s more sugar in this than there is carrots. And so you wouldn’t eat something like beef stew and expect to find this to be the case.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690238/891916d14b6b4a2c924946dff16c4f6d.mp3\"></audio></div><br />The lecture is about sugar. There is sugar in a lot of foods where you don&rsquo;t expect it. Besides, there are also other places where you see sugar and you don&rsquo;t necessarily expect it. For example, sugar is the ingredient of peanut and beef stew, and you will not know this after you have read the food labels. Other food like fresh potatoes and carrots contain sugar, and you wouldn&rsquo;t eat something like beef stew and expect to find this to be the case.<br />这堂讲座讲述的是糖。许多食物中都有糖，很多时候你并不预料到。例如，糖是花生酱和牛肉炖菜的成分之一，读了食品标签你才会知道这一点。像新鲜土豆和胡萝卜这类食物也含有糖，而你不会想到在牛肉炖菜中会发现糖的存在。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690238/6b75263b858b4b0eabd4b9f4e3686e51.mp3", "phrases2": [{"en": "’ s lots", "zh": ""}, {"en": "ice cream", "zh": ""}, {"en": "an example", "zh": ""}, {"en": "peanut butter", "zh": ""}, {"en": "skippy Peanut Butter", "zh": ""}, {"en": "common ingredient", "zh": ""}, {"en": "the reading food labels", "zh": ""}, {"en": "any food labels", "zh": ""}, {"en": "another example", "zh": ""}, {"en": "beef stew", "zh": ""}]}, {"id": 3351, "name": "Taxonomy", "phrases": ["different groups", "the characteristics", "the US Postal Service", "a good way", "a letter", "the nation", "costa Rica", "specific level", "south Carolina", "a phylum"], "eng": "Welcome to today's lesson. We're continuing with our study of taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. So, for instance, a good way to think about taxonomy is the US Postal Service. If we want to send a letter to someone, we first start off by addressing it to the nation they are in. By default, we usually assume that's America but it doesn't have to be a treat in England or Costa Rica or Spain. You put their nation or their kingdom. Then within that kingdom, you address it to a slightly more specific level, their states. So, for instance, South Carolina would be the same as a phylum. “ ” And within that state, you would address it to their city and then to their street number, the street they live on. Then you would address it to say their apartment complex and within that complex, you'd address it by their last name to their family and then finally their first name to the specific person you want to get it to. And in that way we're able to weed out all the 400 million people we don't want to send our letter to in America and pinpoint the exact person we want the letter to reach. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690239/8357fbf9f7234d2abf2e9f139d27a921.mp3\"></audio></div><br />The lecture is about taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. An example is the US Postal Service. In this service, people can address it to a specific level, to their city and then to their street number. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world.<br />这堂讲座讲述的是分类学。分类学是科学家根据有共同特征的生物将它们分入不同的组别。例如，美国邮政服务就是一个例子。在这个服务中，人们可以按照一定的层级来寄信，先是地址到所在的城市，然后到具体的街道号码。同样，科学家使用分类学图表来精确定位生物和有机体，并了解它们与世界上其他事物的关系。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690239/dad3f696ada3470399597876bb175165.mp3", "phrases2": [{"en": "different groups", "zh": ""}, {"en": "the characteristics", "zh": ""}, {"en": "the US Postal Service", "zh": ""}, {"en": "a good way", "zh": ""}, {"en": "a letter", "zh": ""}, {"en": "the nation", "zh": ""}, {"en": "costa Rica", "zh": ""}, {"en": "specific level", "zh": ""}, {"en": "south Carolina", "zh": ""}, {"en": "a phylum", "zh": ""}]}, {"id": 3352, "name": "Immigration control", "phrases": ["the envelope calculation", "all immigration controls", "an ethical point", "a policy", "the famous Rand Study reckons", "a typical immigrant", "the migrants", "the countries", "poor countries", "the neat"], "eng": "Now the economists calculated, it’s a back of the envelope calculation, that removing all immigration controls would double the size of the world economy, and even a small relaxation of immigration controls would lead to disproportionately big gains. Now for an ethical point of view, it’s hard to argue against a policy that will do so much to help people that are much poorer than ourselves. The famous Rand Study reckons that a typical immigrant who arrives in the US ends up with $20,000 a year, that’s rough. 2 It’s not just the migrants themselves who gain, it’s the countries they come from. Already, the migrants working for poor countries working in rich countries send home around 200 billion dollars a year, through formal channels, and about twice as that through informal channels. 2000 And that compares to the neat a hundred million dollars that Western governments give in aid. 1 These remittances are not wasted on weapons or siphoned off into Swiss bank accounts; they go straight into the pockets of local people. They pay for food, clean water, and medicines, they help kids in school, they help start up new businesses.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690241/97e541c59ce7479dbdf5c68583251a3c.mp3\"></audio></div><br />The economists calculated that removing all immigration controls would double the size of the world economy or would lead to disproportionately big gains. A study found that a typical immigrant who arrives in US ends up with $20,000 a year. The countries they come from gain money as well. People send money back to their countries in formal and informal channels. The money is directly paid for food, clean water, and medicines.<br />经济学家计算出，取消所有移民控制将使全球经济规模翻倍，或者至少会带来不成比例的大幅增长。一项研究发现，典型的移民到达美国后每年收入为20,000美元。移民原籍的国家也会从中获益。移民通过正式和非正式渠道将钱汇回家乡。这些资金直接用于民生需求，如食品、净水和药品。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690241/963b665def424a9ba85eb60884d10666.mp3", "phrases2": [{"en": "the envelope calculation", "zh": ""}, {"en": "all immigration controls", "zh": ""}, {"en": "an ethical point", "zh": ""}, {"en": "a policy", "zh": ""}, {"en": "the famous Rand Study reckons", "zh": ""}, {"en": "a typical immigrant", "zh": ""}, {"en": "the migrants", "zh": ""}, {"en": "the countries", "zh": ""}, {"en": "poor countries", "zh": ""}, {"en": "the neat", "zh": ""}]}, {"id": 3353, "name": "Civilization and art", "phrases": ["the great civilizations", "a civilization", "a great production", "a society", "the producers", "the social structure", "the vehicle", "the time", "the Impressionists", "pre-cinematography Pierre"], "eng": "I have said before that you can’t have a civilization that doesn’t have art when we think about the great civilizations historically. All of them had a great production of culture and art because a society has built to observe itself and the sophistication of the great civilizations was their ability to look at themselves. And what allows a society to do that are the producers of art and culture with mirror back to the core of the society exactly. What is being produced at that moment? How people are thinking of themselves and how individuals are relating to the social structure at that time. Art is the vehicle through which we understand that. Were you to take away art, what would be that mirror? How would we see what we were about? How would we understand what was going on in Paris at the time of the Impressionists when people were learning to see in a completely different way? Pre-cinematography Pierre all of these things are just emerging and here are people looking at the world in a very different way, which was considered so radical at that time.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690242/8e99180028fd44e7b390b0d6f0a85527.mp3\"></audio></div><br />This lecture talks about civilization and art. It is impossible to have a civilization without art. Civilization reflects the production of culture and the producers of art and culture should mirror back to the core of the society. People themselves and individuals are relating to the social structure at that time. Art is the vehicle through which we understand that were you to take away art, and it also reflects that how people look at the world in different ways.<br />这节课讲述了文明与艺术的关系。没有艺术就不可能有文明。文明反映了文化的生产，而艺术和文化的生产者应该将社会的核心反映出来。人们自身以及个体与当时的社会结构之间的关系也在其中体现。艺术是我们理解这一切的媒介。如果没有艺术，我们将无法看到人们如何以不同的方式看待世界。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690242/df80ca77fd2247cda72fbf8724adcdd6.mp3", "phrases2": [{"en": "the great civilizations", "zh": ""}, {"en": "a civilization", "zh": ""}, {"en": "a great production", "zh": ""}, {"en": "a society", "zh": ""}, {"en": "the producers", "zh": ""}, {"en": "the social structure", "zh": ""}, {"en": "the vehicle", "zh": ""}, {"en": "the time", "zh": ""}, {"en": "the Impressionists", "zh": ""}, {"en": "pre-cinematography Pierre", "zh": ""}]}, {"id": 3354, "name": "Shy fish", "phrases": ["a leader", "an individual", "a new study", "shy individuals", "some plastic plants", "the fish", "a bold fish", "a shy fish", "other groups", "the researchers"], "eng": "When you think of a leader, you may think of an individual who is above all bold. But a new study of fish called sticklebacks shows that shy individuals actually prefer to follow fish that are similarly timid. Researchers had trios of sticklebacks with known personalities play follow the leader. “ ” The fish were placed in a tank that had some plastic plants at one end and some food hidden at the other. In some of the groups, a bold fish and a shy fish acted as leaders, while another shy fish followed. And in other groups, it was a bold fish that did the following. The researchers recorded whether the follower sallied forth more frequently with the fish that was behaviorally similar or the one that was different. What they found is that shy fish were more likely to emerge from undercover when an equally wary fellow was already out there. Bold follower fish did not seem to care which leader they followed. Of course, no matter which fish a stickleback chose to stick with, the bold fish did lead more expeditions over the course of the experiment than their more retiring friends. That’s because the bold fish initiated more trips, regardless of who might be tailing them. The findings are in the journal Biology Letters. The researchers write that “when offered a choice of leaders, sticklebacks prefer to follow individuals whose personality matches their own, but bolder individuals may, nevertheless, be able to impose their leadership, even among shy followers, simply through greater effort.” “ ” We may soon see if such tendencies also hold true in humans, when Americans decide who they’ll follow in November. 11 Unless, of course, something fishy happens. —— “ ”", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690243/46246aa24e7f43559c0a775119888e25.mp3\"></audio></div><br />A new study shows that shy individuals actually prefer to follow fish that are similarly timid. The scientists separated the fish into two groups, found that shy individuals actually prefer to follow fish that are similarly timid. That&rsquo;s because the bold fish initiated more trips, regardless of who might be tailing them. If such tendencies also hold true in humans, when Americans decide who they&rsquo;ll follow in November.<br />一项新的研究表明，胆小的个体实际上更喜欢跟随性格相似的胆小鱼。科学家将鱼分为两组，发现胆小的个体确实更喜欢跟随性格相似的胆小鱼。这是因为大胆的鱼发起了更多的出行，无论是谁在尾随它们。如果这种趋势在人类中也成立，那么当美国人在11月决定跟随谁时，可能会有类似的现象。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690243/be4603e3ccb7403ba3626950d583b9e0.mp3", "phrases2": [{"en": "a leader", "zh": ""}, {"en": "an individual", "zh": ""}, {"en": "a new study", "zh": ""}, {"en": "shy individuals", "zh": ""}, {"en": "some plastic plants", "zh": ""}, {"en": "the fish", "zh": ""}, {"en": "a bold fish", "zh": ""}, {"en": "a shy fish", "zh": ""}, {"en": "other groups", "zh": ""}, {"en": "the researchers", "zh": ""}]}, {"id": 3355, "name": "Animal behavior", "phrases": ["fundamental questions", "animal behavior", "proximate questions", "the mechanisms", "the proximate", "ultimate questions", "the behavior develop", "the behavior", "the behavior evolve", "the adaptive significance"], "eng": "We can ask two fundamental questions about animal behavior, they referred to as proximate and ultimate. Proximate questions are those concerned with the mechanisms that bring about behavior, ultimate questions are those concerned with the evolution of behavior. We can divide the proximate and ultimate questions into two sub-questions. For proximate, how does the behavior develop, and secondly what causes the behavior. For ultimate, you can ask how did the behavior evolve, and secondly what is the adaptive significance of the behavior, what’s the purpose. Together these comprise what are called Tinbergen's four questions about animal behavior. Niko Tinbergen was one of the founding fathers of the study of animal behavior. · These questions represent the different ways of studying animal behavior and understanding the difference between those four questions are fundamental to understanding behavior and indeed the whole of biology. How do we study animal behavior well that depends on the type of question we’re hoping to answer.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690244/565c6d8f8f974d93a893df9a95e45aad.mp3\"></audio></div><br />Two fundamental questions about animal behavior are referred to as proximate and ultimate. Proximate questions are those concerned with the mechanisms that bring about behavior. The ultimate questions are those concerned with the evolution of behavior. Two sub-questions are how does the behavior develop, and secondly what causes the behavior. For ultimate, you can ask how did the behavior evolve, and what is the adaptive significance of the behavior. Together these comprise four questions about animal behavior.<br />关于动物行为有两个基本问题，分别被称为近因问题和远因问题。近因问题关注的是导致行为发生的机制，而远因问题则关注行为的演化。近因问题的两个子问题是：行为是如何发展的？其次，是什么导致了这种行为？对于远因问题，可以问：这种行为是如何演化来的？以及这种行为的适应意义是什么？这四个问题合起来构成了关于动物行为的四个基本问题。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690244/31209e7b2b0d403b9a04d7ac80861df5.mp3", "phrases2": [{"en": "fundamental questions", "zh": ""}, {"en": "animal behavior", "zh": ""}, {"en": "proximate questions", "zh": ""}, {"en": "the mechanisms", "zh": ""}, {"en": "the proximate", "zh": ""}, {"en": "ultimate questions", "zh": ""}, {"en": "the behavior develop", "zh": ""}, {"en": "the behavior", "zh": ""}, {"en": "the behavior evolve", "zh": ""}, {"en": "the adaptive significance", "zh": ""}]}, {"id": 3356, "name": "Early spring", "phrases": ["the Earth", "the first bloom", "phenomena —", "the only factor", "urban light pollution", "“ ” Richard Ffrench-Constant", "a double whammy", "the first bud burst", "13 years", "a full week"], "eng": "The Earth's temperature is rising. And as it does, springtime phenomena—like the first bloom of flowers—are getting earlier and earlier. But rising temperatures aren't the only factor. Urban light pollution is also quickening the coming of spring. \"So temperature and light are really contributing to a double whammy of making everything earlier.\" “ ” Richard Ffrench-Constant, an entomologist at the University of Exeter. · - He and his colleagues compiled 13 years of data from citizen scientists in the U.K., who tracked the first bud burst of four common trees. 13 Turns out, light pollution from streetlights in cities, and along roads pushed bud burst a full week earlier. Way beyond what rising temperatures could achieve. This disruptive timing can ripple through the ecosystem. \"The caterpillars that feed on trees are trying to match the hatching of their eggs to the timing of bud burst.\" “ ” \"Because the caterpillars want to feed on the juiciest and least chemically protected leaves.\" “ ” \"And it's not just the caterpillars, of course, that are important.\" “ ” \"But the knock-on effect is on nesting birds, which are also trying to hatch their chicks at the same time that there's the maximum number of caterpillars.\" “ ” So earlier buds could ultimately affect the survival of birds, and beyond. The findings are in the Proceedings of the Royal Society B. B The world's becoming increasingly urbanized, and light pollution is growing which Ffrench-Constant says could trick trees into budding earlier and earlier. - But smarter lighting like LEDs that dial down certain wavelengths could help. LED \"Perhaps the exciting thing is, if we understand more about how light affects this bud burst, we might be able to devise smarter sort of streetlighting that has less red components, and therefore less early bud burst.\" “ ” Thus keeping springtime an actual springtime phenomenon.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690246/1bf515254a094b9d80b8c77d36265f7d.mp3\"></audio></div><br />The lecture mainly talks about the spring time phenomena, which means that first blooms of flowers are getting earlier. The first cause if the rising temperature and another reason is urban light pollution, which pushed bud burst earlier, and way beyond what rising temperatures could achieve. The lecture also mentions that this disruptive timing can ripple through the ecosystem such as caterpillars and birds. However, smarter lighting could help with reducing early bud burst.<br />本次讲座重点探讨了春季物候提前现象，即植物开花期普遍提早的趋势。该现象主要由两大因素驱动：其一是持续上升的气温，其二是城市光污染&mdash;&mdash;后者对花芽提前萌发的促进作用甚至远超温度变化的影响。讲座进一步指出，这种物候时序的紊乱会在生态系统中产生连锁反应，波及毛毛虫与鸟类等生物。不过研究也表明，通过优化城市照明方案能够有效缓解花芽过早萌发的问题。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690246/66d213bd36de4fceb12a4e8bb30cd346.mp3", "phrases2": [{"en": "the Earth", "zh": ""}, {"en": "the first bloom", "zh": ""}, {"en": "phenomena —", "zh": ""}, {"en": "the only factor", "zh": ""}, {"en": "urban light pollution", "zh": ""}, {"en": "“ ” Richard Ffrench-Constant", "zh": ""}, {"en": "a double whammy", "zh": ""}, {"en": "the first bud burst", "zh": ""}, {"en": "13 years", "zh": ""}, {"en": "a full week", "zh": ""}]}, {"id": 3357, "name": "Fire safety", "phrases": ["a worldwide reputation", "fire safety products", "a broad range", "dedicated labs", "the CE mark requirements", "the European market", "the market access regulations", "most countries", "the BSI Kitemark", "a British superbrand"], "eng": "With over 40 years unrivaled experience and a worldwide reputation, BSI leads the way in testing and certification of fire safety products. 40 BSI Based on our dedicated labs in Hemel Hempstead, our team provides BSI Kitemark and CE testing and certification for a broad range of products, including fire extinguishers, hoses, alarm panels, and heat and smoke detectors. BSI CE We help clients to gain access into the European market by ensuring that products meet all the CE mark requirements. CE And we are familiar with the market access regulations of most countries across the world, enabling customers to enter markets globally. The BSI Kitemark is categorized as a British superbrand and acknowledged the world over as a symbol of trust, integrity, and quality. BSI It provides the reassurance that vital product safety and performance requirements have been met. Our team subjects each product to a rigorous set of tests along with robust production control audits designed specifically to ensure that they conform to required standards of safety and quality. We test for compatibility of fire detection and fire alarm system components to ensure that they're compatible and connectable. This service meets the growing requirement of European regulatory authorities to meet national installation guidelines. We also perform tests on individual detection components. Fire suppression products such as fire extinguishers are subjected to rigorous tests designed to ensure that they're effective, safe and capable of performing in environments and conditions in which they're stored and used. The symbols for BSI Kitemark and CE certification represent quality, safety, and trust. BSI CE For specifiers, they demonstrate a commitment to best practice procurement. And for the public, they provide the reassurance that fire safety products are effective and reliable.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690247/bd76231ca4424f8e95af7957b6674780.mp3\"></audio></div><br />BSI leads the way in testing and certification of fire safety products, including fire extinguishers, hoses, and alarm panels. They help clients to gain access into the European market. They test for compatibility of fire detection and fire alarm system components.They also perform tests on individual detection components. For the public, they provide the reassurance that fire safety products are effective and reliable.<br />BSI在消防安全产品的测试和认证方面处于领先地位，包括灭火器、消防水带和报警面板。他们帮助客户进入欧洲市场，并测试火灾探测和报警系统组件的兼容性。他们还对单独的探测组件进行测试。对于公众来说，他们提供了消防安全产品有效性和可靠性的保证。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690247/b22ff7495a7a4db488f1acd452996075.mp3", "phrases2": [{"en": "a worldwide reputation", "zh": ""}, {"en": "fire safety products", "zh": ""}, {"en": "a broad range", "zh": ""}, {"en": "dedicated labs", "zh": ""}, {"en": "the CE mark requirements", "zh": ""}, {"en": "the European market", "zh": ""}, {"en": "the market access regulations", "zh": ""}, {"en": "most countries", "zh": ""}, {"en": "the BSI Kitemark", "zh": ""}, {"en": "a British superbrand", "zh": ""}]}, {"id": 3358, "name": "Smartphone apps", "phrases": ["computer scientist Shwetak Patel", "the initial focus", "shwetak Patel", "a new generation", "a home ’", "personal health monitoring", "industrial applications", "patel ‘ So", "a signal interest", "the users"], "eng": "Computer scientist Shwetak Patel and his team are developing new sensing systems. Shwetak Patel The initial focus was really around energy and water monitoring. They built a new generation of smart sensors that monitor electronic interference on a home’s power line or water pressure changes in the plumbing. Most of this technology has already found industrial applications, and Patel and his team turned their attention to adapting the technology for personal health monitoring. Patel ‘So how do we take this noise and make it into a signal interest was hard to us, hard to us in the core of what we did for many years and we’re taking that work and applying it to other domains.’ “ ‘ ’ ” They’re looking to take advantage of all the functionality built in our smartphones. With the users’ permission, this app can use the microphone built into most smartphones to listen to background noises, such as coughing searching for patterns that suggest a trip to the doctor might be an order. ‘We've constructed these models that try and understand how sound works, how it, what its patterns are and we give it a whole bunch of examples of different kinds of audio, things like people talking, things like people laughing, sneezing and of course coughing.’ “ ” This app uses a phone’s camera to check hemoglobin levels in blood by analyzing the color of capillary fluid through the skin. Generally, what happens is if you’re anemic, your bloods maybe a little less red and we take advantage of that by putting your finger over a camera of a phone, the camera of the phone can actually see the coloration of the blood. and this test uses the camera to tell parents worried about jaundice in newborn infants. ‘Now, jaundice is something that doctors who have seen tons of babies. He just can figure out on a very basic level of it. Is this baby, do they need to get treatment or are they in a good condition, while the first-time parent has no idea necessarily what jaundice might look like.’ “ ” The researchers say the built-in sensors found in smartphones are already commonplace, but their applications and their implications for our health and well-being may be more far-reaching than we ever imagined.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690248/ca2f2516bb3a4b32a5a1642c9695f4c5.mp3\"></audio></div><br />Computer scientist and his team are developing new sensing systems. The initial focus was on energy and water monitoring. They paid attention to adapting the technology for personal health monitoring. They took advantage of all the functions built in our smartphones. The applications and their implications for our health and well-being may be more far-reaching than we ever imagined.<br />计算机科学家和他的团队正在开发新的传感系统。最初的重点是能源和用水监测。后来他们将注意力转向将这项技术应用于个人健康监测。他们充分利用了智能手机中内置的各种功能。这些应用及其对我们健康与福祉的影响，可能比我们曾经想象的更加深远。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690248/70c26b7708eb426092b253dbbe79c29f.mp3", "phrases2": [{"en": "computer scientist Shwetak Patel", "zh": ""}, {"en": "the initial focus", "zh": ""}, {"en": "shwetak Patel", "zh": ""}, {"en": "a new generation", "zh": ""}, {"en": "a home ’", "zh": ""}, {"en": "personal health monitoring", "zh": ""}, {"en": "industrial applications", "zh": ""}, {"en": "patel ‘ So", "zh": ""}, {"en": "a signal interest", "zh": ""}, {"en": "the users", "zh": ""}]}, {"id": 3359, "name": "The politics of happiness", "phrases": ["the Gross National Happiness", "tiny little Bhutan", "sophisticated way", "the effects", "the only country", "white paper policy analyses", "other countries", "great Britain", "regular statistics", "different advanced countries"], "eng": "As Joanne pointed out, only one country, tiny little Bhutan, wedged between China and India,has adopted the Gross National Happiness as the central index of government policy, and actually has a good deal of success in education and in health and in economic growth and in environmental preservation. They have a rather sophisticated way of measuring the effects of different policies on people's happiness. They are the only country to go that far. But you are now beginning to get other countries interested enough to do kind of white paper policy analyses of happiness research what effects would it have if we used it more for public policy? You are beginning to get countries like Australia, France, Great Britain, that are considering publishing regular statistics on happiness. So it is beginning to become a subject of greater interest for policymakers and legislators in different advanced countries.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690249/b710a54ed5434bb1a50ea1e1c143af50.mp3\"></audio></div><br />More countries are becoming interested in happiness research for policy making. Governments are exploring how public policies might change if they used happiness as an important measurement. Several developed nations including Australia, France and Britain are taking concrete actions by planning to regularly publish official happiness statistics. This development indicates that happiness is gradually becoming a significant consideration for policymakers in advanced economies, potentially shaping future governance approaches.<br />当前越来越多的国家开始将幸福研究纳入政策制定考量。各国政府正在探索，若将幸福感作为重要衡量指标，公共政策应如何相应调整。澳大利亚、法国和英国等发达国家已付诸实际行动，计划定期发布国民幸福指数官方统计。这一发展趋势表明，在发达经济体的政策制定过程中，幸福度正逐渐成为关键考量要素，未来可能深刻影响治理模式的变革。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690249/bd16521835364c6f93661e5460d6f0e1.mp3", "phrases2": [{"en": "the Gross National Happiness", "zh": ""}, {"en": "tiny little Bhutan", "zh": ""}, {"en": "sophisticated way", "zh": ""}, {"en": "the effects", "zh": ""}, {"en": "the only country", "zh": ""}, {"en": "white paper policy analyses", "zh": ""}, {"en": "other countries", "zh": ""}, {"en": "great Britain", "zh": ""}, {"en": "regular statistics", "zh": ""}, {"en": "different advanced countries", "zh": ""}]}, {"id": 3360, "name": "Soot emission", "phrases": ["the little things", "big things happen", "the plague", "nuclear bombs", "diminutive leaders", "world history", "black carbon", "diesel fuel", "million premature deaths", "los Angeles"], "eng": "Sometimes it's the little things that can make big things happen. Fleas and the plague, atoms and nuclear bombs. Diminutive leaders in world history. Soot is one of these little things. Soot also known as black carbon is released when you burn dung, coal, diesel fuel and wood. From Los Angeles to Mumbai, soot causes respiratory illnesses like lung cancer and asthma and contributes to one point six million premature deaths every year. 160 Mostly among the poor. And it gets worse. Atmospheric currents carry soot thousands of miles from where it is produced, to the Himalayas and the Arctic. Black carbon being black, absorbs sunlight, so even a little soot on snow makes it melt faster. And when snow melts global sea levels rise, threatening our freshwater indigenous communities and polar bears who hunt on the Arctic ice. Climate Change has been a big thing for a while and carbon dioxide has been its main cause. Scientists estimate that soot causes twenty five percent of human-caused global warming. 25% It's the second leading cause of Arctic warming after carbon dioxide. Let's not underestimate the impact of this tiny particle. But there's good news, reducing black carbon may be the fastest way to slow global warming. Buy time for the Arctic. Yes even more so than changing a light bulb. Since black carbon only stays in the atmosphere for a couple of weeks, reducing it will produce results immediately. Of course, reducing soot alone won't solve global warming, but solving our soot problem now will help buy time for the Arctic and allow us to deal with the bigger problem of carbon dioxide. We have the cleaner industries,cook stoves,and diesel now we have to use them. In developed nations, we've significantly reduced our black carbon, but we still have much more to do. We need to tighten our standards at home and invest in cleaner technologies in developing nations. But if you urge the US government and the European Union to take the lead on black carbon reduction, you can make a big difference. Go to www. stopsoot. org www.stopsoot.org And help stop these little things from causing big trouble.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690250/e3c81df03f5846c1839beb9f67d248a1.mp3\"></audio></div><br />The lecture discusses the major impact of soot, or black carbon, on health and climate. Soot comes from burning materials like coal and wood, causing respiratory diseases and millions of deaths yearly. It also contributes significantly to global warming. The speaker highlights that reducing soot is a fast solution because it leaves the atmosphere quickly. While not a complete fix, cutting soot emissions can buy time to address CO2. The talk ends by urging public action and policy changes to tackle this problem.<br />本次讲座重点探讨了煤烟（又称黑碳）对健康与气候的重大影响。煤烟产生于煤炭、木料等物质的燃烧过程，不仅会引发呼吸系统疾病，更导致全球每年数百万人死亡，同时还显著加剧全球变暖。讲者特别强调，减少煤烟排放是一项收效迅速的气候对策，因其能快速脱离大气层。尽管这并非根本解决方案，但控制煤烟排放能为应对二氧化碳问题争取宝贵时间。讲座最后呼吁公众行动与政策改革共同应对这一环境挑战。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690250/05ba74a3fd0647f4991b061ba46b44d2.mp3", "phrases2": [{"en": "the little things", "zh": ""}, {"en": "big things happen", "zh": ""}, {"en": "the plague", "zh": ""}, {"en": "nuclear bombs", "zh": ""}, {"en": "diminutive leaders", "zh": ""}, {"en": "world history", "zh": ""}, {"en": "black carbon", "zh": ""}, {"en": "diesel fuel", "zh": ""}, {"en": "million premature deaths", "zh": ""}, {"en": "los Angeles", "zh": ""}]}, {"id": 3361, "name": "Government Blogging", "phrases": ["a two-way interaction", "the blogger", "the White House", "the case", "the comment area", "rude online", "the governor blog", "the government", "the comment", "the original intention"], "eng": "We normally see blogging as a two-way interaction, in which the blogger creates the content and the readers interact or challenge the author. But the case will be much difficult when it comes to government, such as the White House. Because people will become more coarse and rude online, especially in the comment area. Hence the governor blog may go wild and chaotic. So the government will have to administrate the comment. Once the government starts administrating the comment, citizens may find the government manipulating what should be said and what should be shown, which contradicts the original intention.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690252/16fe44dc7e0244869a19d07bcea78f6c.mp3\"></audio></div><br />The lecture discusses challenges of government blogging compared to regular blogs. Normally, blogs allow two-way interaction where readers comment or challenge the author. However, when government bodies like the White House blog, online comments often turn hostile or disrespectful, leading to chaos. To manage this, governments may need to moderate comments. But citizens might feel the government is controlling free speech. This creates a conflict: maintaining order or preserving open dialogue, which undermines the original purpose of blog interaction.<br />讲座讨论了政府博客与普通博客相比所面临的挑战。通常，博客允许双向互动，读者可以评论或挑战作者。然而，在政府机构，例如白宫博客下，网上评论往往变得充满敌意或不尊重，导致混乱。为了解决这个问题，政府可能需要缓和言论。但公民可能会觉得政府在控制言论自由。这就产生了一种冲突：维持秩序还是保留公开对话，而后者破坏了博客互动的初衷。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690252/a128c98b3b574fe7848b448f8395a8c5.mp3", "phrases2": [{"en": "a two-way interaction", "zh": ""}, {"en": "the blogger", "zh": ""}, {"en": "the White House", "zh": ""}, {"en": "the case", "zh": ""}, {"en": "the comment area", "zh": ""}, {"en": "rude online", "zh": ""}, {"en": "the governor blog", "zh": ""}, {"en": "the government", "zh": ""}, {"en": "the comment", "zh": ""}, {"en": "the original intention", "zh": ""}]}, {"id": 3362, "name": "Linguists", "phrases": ["the communities", "the authority", "a career woman", "the class", "narrow areas", "the bottom line", "the dominance", "rocket science", "the first place", "language revival"], "eng": "But when we move into working with communities, we have to recognize that the communities have to be the authority in their language. Actually a woman in the class I'm teaching at Sydney at the moment, a career woman, expressed this very nicely, although she was talking about something else, she was distinguishing expertise from authority. And certainly linguists because of our training we do have expertise in certain very narrow areas of language, but we don't have the authority over what to do with that knowledge or what to do with other knowledge that the community produces. I guess for me the bottom line is languages are lost because of the dominance of one people over another. That's not rocket science, it's not hard to work that out. But then what that means is if in working with language revival we continue to hold the authority, we actually haven't done anything towards undoing how languages are lost in the first place, so in a sense the languages are still lost if the authority is still lost.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690253/a385d21989ea42afbcbf9d57a0585260.mp3\"></audio></div><br />The lecture emphasizes that communities, not linguists, should hold authority over their languages. While linguists have expertise in narrow language areas, they lack the right to control how communities use or develop their knowledge. The speaker explains that languages disappear due to cultural dominance. Even if the language is technically revived, it remains &quot;lost&quot; if communities don&rsquo;t regain control. A Sydney student&rsquo;s example highlights this: expertise unequal to authority. True revival requires returning decision-making power to the community.<br />该讲座强调，应该对自己的语言拥有权威的是社区，而不是语言学家。虽然语言学家在狭窄的语言领域拥有专业知识，但他们缺乏控制社区如何使用或发展他们的知识的权利。演讲者解释说，语言的消失是由于文化的支配。即使这种语言在技术上得到了复兴，如果社区不重新获得控制权，它仍然是&ldquo;失落的&rdquo;。一位悉尼学生的例子凸显了这一点：专业知识不等于权威。真正的复兴需要将决策权归还给社区。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690253/461d5971326240d586101cebb39cf969.mp3", "phrases2": [{"en": "the communities", "zh": ""}, {"en": "the authority", "zh": ""}, {"en": "a career woman", "zh": ""}, {"en": "the class", "zh": ""}, {"en": "narrow areas", "zh": ""}, {"en": "the bottom line", "zh": ""}, {"en": "the dominance", "zh": ""}, {"en": "rocket science", "zh": ""}, {"en": "the first place", "zh": ""}, {"en": "language revival", "zh": ""}]}, {"id": 3363, "name": "Venus", "phrases": ["the space age", "the planet Venus", "an earlier space mission", "a nice water cycle", "“ ” Okay", "a brief comparison"], "eng": "There is a picture, sort of artist's impression, before the space age of what Venus might be like on its surface and so this was looking at the planet Venus, it was science fiction and science fact all the way up to 56 before the start of the space age but it wasn't completely disproved, 56 this idea of a really sort of lush environment on Venus until 1967, which is when the first measurements in detail were done at Venus. 1967 So Mariner four and Mariner five confirmed the feeling from an earlier space mission that in fact the surface of Venus was not like this at all, but extremely hot and, and also that the clouds were made of sulfuric acid so there wasn't a nice water cycle like is going on in this picture and so, that it had to wait for these in situ measurements by space craft to actually do that and so Venus turned out not to be quite as Earth like as we thought and I'll sort of tell you about some of the latest results from Venus Express, which, which they actually there are some Earth like features, but to a large extent, it's not like the Earth. “ ” Okay, so a brief comparison between.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690254/55975a173e024ffebc9e0358adebbbbb.mp3\"></audio></div><br />The lecture discusses how our understanding of Venus evolved from science fiction to scientific reality. Before the space age, people imagined Venus as a lush, Earth-like planet. However, in 1967, NASA&rsquo;s Mariner 4 and 5 missions revealed its true nature: extreme heat and sulfuric acid clouds, making it uninhabitable. These findings disproved earlier assumptions. Recent data from the Venus Express mission shows some Earth-like features, but Venus remains vastly different from our planet.<br />讲座讨论了我们对金星的理解是如何从科幻小说演变成科学现实的。在太空时代之前，人们把金星想象成一个郁郁葱葱的类地行星。然而，在1967年，美国宇航局的水手4号和5号任务揭示了它的真实性质：极端的高温和硫酸云，使它不适合居住。这些发现推翻了早先的假设。来自金星快车任务的最新数据显示了一些类似地球的特征，但金星与我们的星球仍然有很大的不同。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690254/bbd432fe383e455b81bc64a8023dd8d1.mp3", "phrases2": [{"en": "the space age", "zh": ""}, {"en": "the planet Venus", "zh": ""}, {"en": "an earlier space mission", "zh": ""}, {"en": "a nice water cycle", "zh": ""}, {"en": "“ ” Okay", "zh": ""}, {"en": "a brief comparison", "zh": ""}]}, {"id": 3364, "name": "Rice", "phrases": ["the Green Revolution", "the International Rice Research Institute", "1943 “ ”", "1962 IR8 IR8", "a real impact", "the technology", "the genes", "traditional rice varieties", "1962 IR8", "optimal conditions"], "eng": "In 1943, what became known as the Green Revolution began when Mexico, unable to feed its growing population, shouted for help. 1943 “ ” Within a few years, the Ford and Rockefeller Foundations founded the International Rice Research Institute in Asia, and by 1962, a new strain of rice called IR8 was feeding people all over the world. 1962 IR8 IR8 was the first really big modified crop to make a real impact on world hunger. IR8 In 1962 the technology did not yet exist to directly manipulate the genes of plants, and so IR8 was created by carefully crossing existing varieties: selecting the best from each generation, further modifying them, and finally finding the best. 1962 IR8 Here is the power of modified crops: IR8, with no fertilizer, straight out of the box, produced five times the yield of traditional rice varieties. IR8 In optimal conditions with nitrogen, it produced ten times the yield of traditional varieties. By 1980, IR36 resisted pests and grew fast enough to allow two crops a year instead of just one, doubling the yield. 1980 IR36 And by 1990, using more advanced genetic manipulation techniques, IR72 was outperforming even IR36. The Green Revolution saw worldwide crop yields explode from 1960 through 2000. 1990 IR72 IR36 1960 2000", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690255/d1474b0721dd4f1aa24df352c9f2d0dc.mp3\"></audio></div><br />The lecture explains the Green Revolution, starting in 1943 when Mexico faced food shortages. To solve this, Research institutes were built in Asia. By 1962, they developed IR8, a highyield rice variety that produced five times more rice than traditional types without fertilizer, and ten times more with nitrogen. Later, IR36 resisted pests and allowed two crops yearly, doubling yields. By 1990, IR72 improved further with advanced genetic techniques. From 1960 to 2000, these modified crops dramatically increased global food production, reducing hunger worldwide.<br />本次讲座解析了始于1943年的&quot;绿色革命&quot;。当时墨西哥面临粮食危机，为应对此问题，科研机构在亚洲建立了实验基地。到1962年，科学家成功培育出IR8高产水稻品种&mdash;&mdash;在不使用化肥的情况下产量达到传统水稻的五倍，施用氮肥后更可增产十倍。随后问世的IR36品种兼具抗虫特性并能实现一年两熟，使产量再度翻番。至1990年，通过先进遗传技术培育的IR72品种进一步提升了作物性能。在1960至2000年间，这些改良作物推动全球粮食产量大幅增长，有效缓解了世界范围的饥荒问题。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690255/d384c0d225f04b2da3e123a5651a577c.mp3", "phrases2": [{"en": "the Green Revolution", "zh": ""}, {"en": "the International Rice Research Institute", "zh": ""}, {"en": "1943 “ ”", "zh": ""}, {"en": "1962 IR8 IR8", "zh": ""}, {"en": "a real impact", "zh": ""}, {"en": "the technology", "zh": ""}, {"en": "the genes", "zh": ""}, {"en": "traditional rice varieties", "zh": ""}, {"en": "1962 IR8", "zh": ""}, {"en": "optimal conditions", "zh": ""}]}, {"id": 3365, "name": "Aristotle", "phrases": ["the reason", "rhetoric influence", "the rebel", "the dressing", "the body", "the spirit", "the soul", "the truth", "some kind", "most people"], "eng": "But Aristotle says the reason we need rhetoric is we have to be able to use it. We have to be able to use rhetoric influence, basically, the rebel, and the morons. We try to get them to understand truth. Truth is suggested, is different than rhetoric. Rhetoric is the dressing, is the body, right? Truth is the spirit, is the soul, is abstract. It doesn't have a body. It's not particular. If you wanna get somebody to the truth, you migh
