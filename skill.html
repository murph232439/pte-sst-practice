t have to use some kind of tricks. Right? Because most people are not sound and can't see the truth. That's what we think. Most people are ramble. Really. Only the educated be erudite are actually capable of seeing the truth. If you wanna get the general mass there, you may have to do fable a little bit. So Aristotle that is rhetoric. Rhetoric is something that is used to influence people. Right? And it's a kind of mentally promised a logic.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690256/e750402f584e4178a4c18e019b5850b4.mp3\"></audio></div><br />The lecture explains Aristotle&rsquo;s view on rhetoric. He argues that rhetoric is necessary because most people can&rsquo;t grasp abstract truth directly. Truth is like a soul&mdash;intangible and universal&mdash;while rhetoric acts as the body or tool to present it. According to Aristotle, only educated individuals can understand truth independently. For the general public, who are irrational or easily confused, persuasion techniques like stories or simplified ideas are needed to guide them toward truth.<br />讲座解释了亚里士多德的修辞学观点。他认为修辞是必要的，因为大多数人不能直接掌握抽象的真理。真理就像灵魂，无形而普遍，而修辞则是呈现它的身体或工具。亚里士多德认为，只有受过教育的人才能独立地理解真理。对于不理性或容易迷惑的普通大众来说，需要故事或简化想法等说服技巧来引导他们走向真理。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690256/f1c59e5851b7491da9ac0f485d6c5265.mp3", "phrases2": [{"en": "the reason", "zh": ""}, {"en": "rhetoric influence", "zh": ""}, {"en": "the rebel", "zh": ""}, {"en": "the dressing", "zh": ""}, {"en": "the body", "zh": ""}, {"en": "the spirit", "zh": ""}, {"en": "the soul", "zh": ""}, {"en": "the truth", "zh": ""}, {"en": "some kind", "zh": ""}, {"en": "most people", "zh": ""}]}, {"id": 3366, "name": "Clouds", "phrases": ["every cloud drop", "the center", "a cloud drop", "a particle", "the key question", "the ocean", "sea spray", "good chance", "sea salt", "all kinds"], "eng": "There is a lot of interesting. What forms these clouds, why are these clouds there, why do they sort of stick around? At the center, every cloud drop has a particle. You can't grow a cloud drop without having a particle there for the water to condense on. The key question that people not directly address until very recently is what actually forms these clouds. So for once you're looking out at over the ocean, turns out sea spray, sea salt is a very effective nucleus for forming clouds. So it's a really good chance that those are loaded with sea salt. But if you go inland, you start to have pollution come from all kinds of places, and so different sources form clouds more effectively than others, and we're trying to unravel which sources are actually contributing to the clouds. The clouds are incredibly important players in climate change, and that they reflective the white, they reflect the light back into space and so they're keeping things much, much cooler than they would be if they weren't there. They also play huge role in regional weather, so in actual we're starting to see shifts where having more pollution input into the clouds is affecting weather patterns, in particular, is actually reducing the precipitation so we're starting to see drought in areas with super high levels of air pollution.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690257/0937fe79895d4abf84e7c376becb7263.mp3\"></audio></div><br />The lecture is about clouds.There are a lot of interesting things about clouds.The key question that people not directly address until very recently is what actually forms these clouds.The clouds are incredibly important players in climate change, and that they reflective the white, they reflect the light back into space and so they&rsquo;re keeping things much, much cooler than they would be if they weren&rsquo;t there.They also play a huge role in regional weather.<br />这个讲座是关于云的。关于云有很多有趣的事情。人们直到最近才直接提出的关键问题是，这些云究竟是什么形成的。云在气候变化中扮演着非常重要的角色，它们反射白光，它们将光反射回太空，所以它们使温度比没有它们时低得多。它们在地区天气中也起着巨大的作用。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690257/71d5f54d9b334282be62307c4b7292c7.mp3", "phrases2": [{"en": "every cloud drop", "zh": ""}, {"en": "the center", "zh": ""}, {"en": "a cloud drop", "zh": ""}, {"en": "a particle", "zh": ""}, {"en": "the key question", "zh": ""}, {"en": "the ocean", "zh": ""}, {"en": "sea spray", "zh": ""}, {"en": "good chance", "zh": ""}, {"en": "sea salt", "zh": ""}, {"en": "all kinds", "zh": ""}]}, {"id": 3367, "name": "Superhuman", "phrases": ["incredible physical power", "an accident victim", "a fact-based look", "an adrenalin-charged person", "a temporary boost", "proper terminology", "the majority", "many cases", "large body", "anecdotal evidence"], "eng": "Today we're going to recount heroic tales of superhuman feats of strength, when in the face of disaster, some people are said to have summoned up incredible physical power to lift a car off of an accident victim, move giant rocks, or like Big John of song, single-handedly hold up a collapsing beam to let the other miners escape. Are such stories true? There are many anecdotes supporting the idea, but we're going to take a fact-based look at whether or not it truly is possible for an adrenalin-charged person to temporarily gain massive strength. In proper terminology, such a temporary boost of physical power would be called hysterical strength. The majority of them are anecdotal, and interestingly not repeatable; in many cases, the person who summoned the superstrength later tried it again only to find that they couldn't do it. Basically, what we have is a respectably large body of anecdotal evidence that suggests that in times of crisis, danger, or fear, some people have the ability to temporarily exercise superhuman strength.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690258/efb7e27f3cd1457e8cdf905d85239429.mp3\"></audio></div><br />The lecture mainly talks about superhuman strength. It is said that some people have incredible power to lift a car or move giant rocks when facing disaster. There is a heated debate on whether these stories are true. According to a large body of anecdotal evidence, in a time of crisis or fear, it is possible for a person to temporarily gain massive strength, but late they couldn&rsquo;t do it again.<br />这个讲座主要讲超人的力量。据说，有些人在面对灾难时，有不可思议的力量举起汽车或移动巨大的岩石。关于这些故事是否真实存在着激烈的争论。根据大量的轶事证据，在危机或恐惧的时候，一个人有可能暂时获得巨大的力量，但后来他们就不能再这样做了。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690258/2a7f252f738c42ba9331e470146dad42.mp3", "phrases2": [{"en": "incredible physical power", "zh": ""}, {"en": "an accident victim", "zh": ""}, {"en": "a fact-based look", "zh": ""}, {"en": "an adrenalin-charged person", "zh": ""}, {"en": "a temporary boost", "zh": ""}, {"en": "proper terminology", "zh": ""}, {"en": "the majority", "zh": ""}, {"en": "many cases", "zh": ""}, {"en": "large body", "zh": ""}, {"en": "anecdotal evidence", "zh": ""}]}, {"id": 3368, "name": "Bees talks", "phrases": ["a waggle dance", "honey bees", "a headbutt", "another bee", "a warning signal", "A feeding station", "a source", "the hive", "a dangerous source", "the behaviour"], "eng": "Honey bees do a waggle dance to direct other bees to the sources of nectar. The dancing bees like this one can be halted by a headbutt from another bee. Now research has found that this headbutt is actually a warning signal. A feeding station was set up in the lab to mimic a source of nectar, then foraging bees were introduced to the dangers at the station, such as competition from rival colonies. When foragers returned to the hive they stopped bees dancing. Scientists think the behaviour warns dancers of a dangerous source of nectar.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690259/9109a338f98748e6a9e9ebc7e1eef685.mp3\"></audio></div><br />Bees perform this strange ritual when they encounter aggressive rival bees, for example, or predatory spiders hanging out at favored foraging spots. When they return to the hive, they headbutt hive mates performing the famous &ldquo;waggle dance&rdquo; that directs would-be foragers to rich sources of nectar. By halting their hive mates mid-dance, the scouting bees save them from perilous excursions.<br />例如，当蜜蜂遇到有攻击性的对手蜜蜂或在自己喜欢的觅食地点闲逛的掠食性蜘蛛时，它们就会进行这种奇怪的仪式。当它们回到蜂巢时，它们会用头撞着蜂巢同伴，表演著名的&ldquo;摇摆舞&rdquo;，引导潜在的觅食者找到丰富的花蜜来源。通过阻止正在跳舞的同伴，侦察的蜜蜂将他们从危险的短途旅行中解救出来。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690259/8630016574f74b9b8f3e6747724e45a6.mp3", "phrases2": [{"en": "a waggle dance", "zh": ""}, {"en": "honey bees", "zh": ""}, {"en": "a headbutt", "zh": ""}, {"en": "another bee", "zh": ""}, {"en": "a warning signal", "zh": ""}, {"en": "A feeding station", "zh": ""}, {"en": "a source", "zh": ""}, {"en": "the hive", "zh": ""}, {"en": "a dangerous source", "zh": ""}, {"en": "the behaviour", "zh": ""}]}, {"id": 3369, "name": "Library", "phrases": ["the service desk", "each floor", "the internet", "library catalogues", "the orange signs", "the instructions", "the printers", "student cards", "the card"], "eng": "You'll see the service desk after entering the library and you can have these services at the service desk. There are computers on each floor. You can use computers to access the internet, check emails and library catalogues. Follow the orange signs to find printers. Follow the instructions to use the printers. Remember to bring student cards. You can charge the card to use printers.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690260/7eff6682d290434997a90f003e0684c7.mp3\"></audio></div><br />This lecture is an introduction of a library. It talks about functional areas and services in the library. Every level of the library has computers, and students can use it to process the problems and send and receive emails. It also talks about the location of the printers in the library. Students can use their student cards and when they need help, they can ask the staff at the front desk.<br />这个讲座是关于图书馆的介绍。它讨论了图书馆的功能区域和服务。图书馆的每一层都有电脑，学生可以用它来处理问题和收发电子邮件。它还谈到了图书馆中打印机的位置。学生可以使用他们的学生卡，当他们需要帮助时，他们可以问前台的工作人员", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690260/b794ce656c3a456dacb91eb84627d942.mp3", "phrases2": [{"en": "the service desk", "zh": ""}, {"en": "each floor", "zh": ""}, {"en": "the internet", "zh": ""}, {"en": "library catalogues", "zh": ""}, {"en": "the orange signs", "zh": ""}, {"en": "the instructions", "zh": ""}, {"en": "the printers", "zh": ""}, {"en": "student cards", "zh": ""}, {"en": "the card", "zh": ""}]}, {"id": 3370, "name": "A ship", "phrases": ["a great ship", "the future", "any before", "a wise course", "every reef", "many shipwrecks", "the only one left", "the vessel", "the next few years", "all creatures"], "eng": "\"Our civilization, which subsumes most of its predecessors, is a great ship steaming at speed into the future. “ It travels faster, further, and more laden than any before. We may not be able to foresee every reef and hazard, but by reading her compass bearing and headway, by understanding her design, her safety record, and the abilities of her crew, we can, I think, plot a wise course between the narrows and bergs looming ahead. And I believe we must do this without delay, because there are too many shipwrecks behind us. The vessel we are now aboard is not merely the biggest of all time; it is also the only one left. The future of everything we have accomplished since our intelligence evolved will depend on the wisdom of our actions over the next few years. Like all creatures, humans have made their way in the world so far by trial and error; unlike other creatures, we have a presence so colossal that error is a luxury we can no longer afford. The world has grown too small to forgive us any big mistakes.\" \"", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690261/f3e50ef330104efe97b6c7eae1326bb1.mp3\"></audio></div><br />This lecture talks about human&rsquo;s civilization, which is a ship driving into the future. Firstly, by understanding the features of the ship, including compass and crew, people should find a wise course without delay. Secondly, the civilization ship is the biggest and the only one in our time. Human&rsquo;s future depends on the wisdom of our actions. Thirdly, humans make achievements through trial and error like other creatures, but unlike creatures, humans cannot afford errors now. In conclusion, the world is small and humans cannot afford big mistakes.<br />这个讲座讲的是人类的文明，这是一艘驶向未来的船。首先，通过了解船的特点，包括指南针和船员，人们应该找到一个明智的路线，而不是拖延。第二，这艘文明船是我们这个时代最大的也是唯一的一艘。人类的未来取决于我们行动的智慧。第三，人类像其他生物一样通过试错来取得成就，但与其他生物不同的是，人类现在不能承受错误。总之，世界很小，人类不能犯大错误。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690261/591d4fa40876480ab950000b3d3f2ec1.mp3", "phrases2": [{"en": "a great ship", "zh": ""}, {"en": "the future", "zh": ""}, {"en": "any before", "zh": ""}, {"en": "a wise course", "zh": ""}, {"en": "every reef", "zh": ""}, {"en": "many shipwrecks", "zh": ""}, {"en": "the only one left", "zh": ""}, {"en": "the vessel", "zh": ""}, {"en": "the next few years", "zh": ""}, {"en": "all creatures", "zh": ""}]}, {"id": 3371, "name": "Psychologist", "phrases": ["sigmund Freud", "a famous psychologist", "the answer", "a profound influence", "some biographical information", "the beginning", "world War", "any single discovery", "famous scholars", "the development"], "eng": "For better or worse, we live in a world profoundly affected by Sigmund Freud. ・ If I had to ask you to name a famous psychologist, the answer of most of you would be Freud. He's the most famous psychologist ever and he's had a profound influence on the 20th and 21st century. 20 21 Some biographical information: he was born in the 1850s. 19 50 He spent most of his life in Vienna, Austria, but he died in London and he escaped to London soon after retreating there at the beginning of World War Two as the Nazis began to occupy where he lived. He's one of the most famous scholars ever but he's not known for any single discovery. Instead, he's known for the development of and encompassing theory of mind, one that he developed over the span of many decades.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690262/080f251daf5b4f31993f5785cbf8a192.mp3\"></audio></div><br />The lecture is about psychologist Sigmund Freud. He is the most famous psychologist that has a profound influence on the 20th and 21st century. He spent most of his life in Vienna and died in London. At the beginning of world war two, the Nazis occupied where he lived. He is known for the development of and encompassing theory of mind.<br />这堂课是关于心理学家西格蒙德&middot;弗洛伊德的。他是20世纪和21世纪最著名的影响深远的心理学家。他在维也纳度过了大半生，在伦敦去世。第二次世界大战开始时，纳粹占领了他住的地方。他以发展和包罗万象的心智理论而闻名。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690262/4e05feda69d1476cbe7cc23415824332.mp3", "phrases2": [{"en": "sigmund Freud", "zh": ""}, {"en": "a famous psychologist", "zh": ""}, {"en": "the answer", "zh": ""}, {"en": "a profound influence", "zh": ""}, {"en": "some biographical information", "zh": ""}, {"en": "the beginning", "zh": ""}, {"en": "world War", "zh": ""}, {"en": "any single discovery", "zh": ""}, {"en": "famous scholars", "zh": ""}, {"en": "the development", "zh": ""}]}, {"id": 3372, "name": "Teaching", "phrases": ["graduate students", "some inventions", "the result", "the learning process", "the end product", "the subject", "an intelligent group", "a vehicle", "the teaching-research results", "uncovered many interesting research problems"], "eng": "All of my research and that I conducted was my 60 plus graduate students, was motivated by their need to learn, so that we can teach. 60 Of course, in some inventions happened along the way but I've always considered the end the result. And I always consider that this invention to be byproduct, byproducts of the learning process. The end product for me was always better understanding or when one really succeeded in unifying theory that can help us in teaching the subject. I've also looked at teaching as a vehicle to try new ideas, of new ways to doing things on an intelligent group of learners. That is as the vehicle for the teaching-research results. And in my experience, this kind of teaching is the most stimulated and motivating to students. I am also uncovered many interesting research problems is the cause of teaching subject. It is this unity of research and teaching their close connection and the benefits gathered by exercising and the interplay that to be characterised the successful professor.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690263/0d68e13214ed40bd86bb83ceb4f17bf8.mp3\"></audio></div><br />This lecture is about teaching and learning. Firstly, teaching is motivated by students&#39; needs of learning. Secondly, it is important to consider the result and byproducts of the learning process. Thirdly, new ideas can stimulate and motivate students. Finally, the unity of research and teaching close connection, exercising as well as interplay help speaker become a successful professor.<br />这个讲座是关于教与学的。首先，教学的动机是学生的学习需要。其次，重要的是要考虑学习过程的结果和副产品。第三，新的想法可以刺激和激励学生。最后，科研与教学的结合、紧密的联系、锻炼与互动有助于演讲者成为一名成功的教授。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690263/fdb1c52d74b84380a86a3cad88265de4.mp3", "phrases2": [{"en": "graduate students", "zh": ""}, {"en": "some inventions", "zh": ""}, {"en": "the result", "zh": ""}, {"en": "the learning process", "zh": ""}, {"en": "the end product", "zh": ""}, {"en": "the subject", "zh": ""}, {"en": "an intelligent group", "zh": ""}, {"en": "a vehicle", "zh": ""}, {"en": "the teaching-research results", "zh": ""}, {"en": "uncovered many interesting research problems", "zh": ""}]}, {"id": 3373, "name": "Wilson", "phrases": ["a different world", "the focal point", "a board mainstream", "american culture", "modern literature", "an abstract sense", "TS Eliot", "ordinary people", "the division", "the brows"], "eng": "Wilson came from a different world. And he became the focal point of a board mainstream. American culture that thought that modern literature and wanted modern literature to be able to be read and appreciated by ordinary people. They were not modernists in an abstract sense. And certainly, some of them like TS Eliot and Faulkner were too difficult for some of their writings to be read by ordinary people. ・ But this was a world before the division between the brows or between a lead or whatever had established itself as a part of our consciousness. “ ” “ ” Wilson was a major player in the successful effort of his generation to establish at the heart of American life and innovative literature that would equal the great cultures of Europe. And he knew that the great cultures of Europe were there. He was not a product of a narrow American Studies kind of training at all. He joined a high artistic standard with an openness to all experience and a belief that literature was as much of a part of life for everyone as conversation. He thought the Proust and Joyce and Yeats and Eliot could and should be read by ordinary Americans and helped that to happen. Wilson was a very various man. Over a period of almost 50 years, he was a dedicated, a literary journalist, and an investigative reporter, a brilliant memoirist, and dedicated journal keeper. 50", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690264/7ca2f346462c4c999b8d7cf900df3974.mp3\"></audio></div><br />Wilson is a famous writer in the US, who have a profound impact on American culture. He thought modern literature should be read and appreciated by ordinary people. Although some writers&rsquo; work is difficult to read. Wilson made effort to establish American life and innovative literature, which is as equally great as Europe. He thought literature is a part of life for everyone, and encourage people to read more.<br />威尔逊是美国著名的作家，对美国文化产生了深远的影响。他认为现代文学应该被普通人阅读和欣赏。虽然有些作家的作品很难读。威尔逊努力建立起与欧洲同等伟大的美国生活和创新文学。他认为文学是每个人生活的一部分，并鼓励人们多读书。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690264/d0b2c20b9332455f90d3c0df2eccd2e9.mp3", "phrases2": [{"en": "a different world", "zh": ""}, {"en": "the focal point", "zh": ""}, {"en": "a board mainstream", "zh": ""}, {"en": "american culture", "zh": ""}, {"en": "modern literature", "zh": ""}, {"en": "an abstract sense", "zh": ""}, {"en": "TS Eliot", "zh": ""}, {"en": "ordinary people", "zh": ""}, {"en": "the division", "zh": ""}, {"en": "the brows", "zh": ""}]}, {"id": 3374, "name": "Chest X-Ray", "phrases": ["one picture", "some personal experience", "a chest x-ray", "a radiologist", "a good example", "a physical principle", "the large bright", "some parts", "good eyesight", "the distance"], "eng": "This is one picture that you probably you all know what it is when you see it. It's a familiar looking image. It's something that probably we all have some personal experience with,right? This is a chest x-ray that would be taken in your doctor's office, for example, or a radiologist's office. X And it is a good example of Biomedical Engineering and that it takes a physical principle, that is how do x-rays interact with the tissues of your body, and it uses that physics, that physical principle to develop a picture of what's inside your body, so to look inside and see things that you couldn't see without this device. X And you'll recognize some parts of the image, you can see the ribcage here, the bones you can see the heart is the large bright object down here. If you, have good eyesight from the distance,you can seethe vessels leading out of the heart and into the lungs, and the lungs are darker spaces within the ribcage.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690265/45570c2b97c048e685096a3ab3abca0c.mp3\"></audio></div><br />The picture of the x-ray is a good example using the biomedical technology. The x-ray can go through our body, and doctor can look into our bodies, which they cannot do it without the help of x-ray. We can see bones, organs in the x-ray. The doctor can diagnose it, and know what&rsquo;s wrong with our body. It shows the integration of biomedical technology.<br />x射线的图片是使用生物医学技术的一个很好的例子。x光可以穿过我们的身体，医生可以检查我们的身体，没有x光的帮助他们无法做到这一点。我们可以在x光片中看到骨头和器官。医生可以诊断，知道我们的身体出了什么问题。它展示了生物医学技术的融合。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690265/a5a2692e5bf94f8d8b40aa37cd16d15a.mp3", "phrases2": [{"en": "one picture", "zh": ""}, {"en": "some personal experience", "zh": ""}, {"en": "a chest x-ray", "zh": ""}, {"en": "a radiologist", "zh": ""}, {"en": "a good example", "zh": ""}, {"en": "a physical principle", "zh": ""}, {"en": "the large bright", "zh": ""}, {"en": "some parts", "zh": ""}, {"en": "good eyesight", "zh": ""}, {"en": "the distance", "zh": ""}]}, {"id": 3375, "name": "Trade-offs triangle", "phrases": ["a win-win solution", "economic growth", "the argument", "the developed", "industrialized countries", "wildlife conservation society", "a government"], "eng": "Well, it's about whether you can achieve a win-win solution, whether you can achieve economic growth which brings wealth in order to cut poverty without damaging the biodiversity. And the argument is that if you want to protect the biodiversity, you have to focus on that as a goal, but if you do that, you run the risk of hurting the poor and you also run the risk of inconvenience and reducing the economic growth. We use the developed and industrialized countries to see this argument this axis argues about.. We let us say, a government wishing to start drilling for oil in place X, which is for the wildlife under wildlife conservation society, urging them not to on the grounds that it's a wilderness. X", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690266/5a5857016a2e4083a24773705c12ee05.mp3\"></audio></div><br />Poor people should not pay the price for the biodiversity protection. There is a debate about whether you can keep economic growth which can solve the poverty issues without damaging biodiversity. The answer is that it is impossible to reach a win-win solution among conservation, development and poverty. If you set bio-diversity as your goal, you run the risk of hurting the poor and the economy.<br />穷人不应该为保护生物多样性付出代价。人们争论的焦点是，能否在不破坏生物多样性的情况下保持经济增长，从而解决贫困问题。答案是不可能在保护、发展和贫困之间达成双赢的解决方案。如果把生物多样性作为目标，就有可能伤害穷人和经济。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690266/ba1310fd58114f1cb9d3901e2515f846.mp3", "phrases2": [{"en": "a win-win solution", "zh": ""}, {"en": "economic growth", "zh": ""}, {"en": "the argument", "zh": ""}, {"en": "the developed", "zh": ""}, {"en": "industrialized countries", "zh": ""}, {"en": "wildlife conservation society", "zh": ""}, {"en": "a government", "zh": ""}]}, {"id": 3376, "name": "Australian city", "phrases": ["the world", "international trade", "a broad territory", "all towns", "a huge expense", "the government", "large amount", "the Australian people", "five cities", "isolated cities"], "eng": "Australia's location is important for the world's export, and its international trade is also very important. Since Australia has a broad territory, all towns are scattered around. There is a huge expense for transportation for trains and ferries. The government also pays large amount for its telecommunication to build up the connection among regions. The Australian people are mainly living in five cities, and they are Melbourne, Sydney, Perth, Brisbane and so on. The most special one is Perth, which is one of the most isolated cities in the world. —— However, this does not affect its status to be the largest city in Australia. Most large companies, like the two leading companies, Telstra and Qantas, are all based in Perth. Telstra Qantas", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690267/fb28acaa93864385ad9bc6f540506eaf.mp3\"></audio></div><br />This lecture talks about Australia. According to the speaker, he has mentioned some points of view. Australia&rsquo;s location is important for the world&rsquo;s export. Its international trade is also important. Since Australia has a broad territory. The Australian people are mainly living in 5 cities which are Melbourne, Sydney, Brisbane, Perth and so on. Perth is one of the most isolated city in the world and there are two leading companies such as Telstra and Qantas which are based in Perth.<br />本讲座的主题是澳大利亚。演讲者提到了一些观点。澳大利亚的地理位置对世界出口非常重要。其国际贸易也很重要。澳大利亚幅员辽阔。澳大利亚人主要居住在墨尔本、悉尼、布里斯班、珀斯等五个城市。珀斯是世界上最偏僻的城市之一，有两家领先的公司，如 Telstra 和 Qantas 都设在珀斯。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690267/3549e9fd5cc44347879277505f8a533a.mp3", "phrases2": [{"en": "the world", "zh": ""}, {"en": "international trade", "zh": ""}, {"en": "a broad territory", "zh": ""}, {"en": "all towns", "zh": ""}, {"en": "a huge expense", "zh": ""}, {"en": "the government", "zh": ""}, {"en": "large amount", "zh": ""}, {"en": "the Australian people", "zh": ""}, {"en": "five cities", "zh": ""}, {"en": "isolated cities", "zh": ""}]}, {"id": 3377, "name": "Narratives", "phrases": ["the comics", "different kinds", "a situation", "visual description", "the scenario", "the Second World War", "the shelter", "more visual evidence"], "eng": "The comics I show you with lots of people chatting around in a room is a form of description. —— —— We use different kinds of methods to describe a situation. Sometimes we have to use visual description, particularly when we do not witness the scenario. I was born during the Second World War and my hometown is X... X... For example when I asked my mother about the war, I always ask her \"you have mentioned this or that when you talked to me\"... \"...\" When you asked her about the shelter, I asked her \"what the shelter looks like\" and \"when did you go to the shelter\". \" \" \" \" From her response I could get more visual evidence as I can to write my book.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690268/c841ba8c219548fb8e3c5b52b942c2ec.mp3\"></audio></div><br />This lecture is about visual description. Firstly, the speaker mentions about the comics with many people chatting in a room and it is a form of description. Secondly, the speaker mentions that people use different kinds of methods to describe a situation. Thirdly the speaker mentions that people have to use visual description when they don&rsquo;t see the scene. He used own experience as an example describing the second war, his home town and the shelter his mother went to. In conclusion, in such way the speaker gets visual evidence to write his book.<br />本讲座的主题是视觉描述。首先，主讲人提到了许多人在一个房间里聊天的漫画，这是一种描述形式。其次，演讲者提到人们使用不同的方法来描述情境。第三，他提到人们在没有看到场景时必须使用视觉描述。他以自己的经历为例，描述了第二次世界大战、他的家乡和他母亲去的避难所。总之，作者通过这种方式获得了写作本书的视觉证据。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690268/415198dd01fb44d3a3b0f962c71c4b21.mp3", "phrases2": [{"en": "the comics", "zh": ""}, {"en": "different kinds", "zh": ""}, {"en": "a situation", "zh": ""}, {"en": "visual description", "zh": ""}, {"en": "the scenario", "zh": ""}, {"en": "the Second World War", "zh": ""}, {"en": "the shelter", "zh": ""}, {"en": "more visual evidence", "zh": ""}]}, {"id": 3378, "name": "Climate change", "phrases": ["some adverse effects", "climate changes", "some lands", "the near future", "climate change", "less production", "financial status", "many people", "world economy", "the tropical areas"], "eng": "Some adverse effects of climate changes to agricultural productions. Some lands are unsuitable for growing crops. There will be millions of people facing hunger in Africa in the near future. Climate change will result in less production and less food. It is difficult for developing countries to deal with climate change due to their financial status and other issues. There are many people living in hunger especially in Africa. The climate change has devastating effects on world economy. The tropical areas on earth are dry and hot, and are originally not suitable for food production. The change of climate leads to extreme weather conditions such as floods and hurricanes, which exacerbates the food production. As a result, it leads to a continuous decline in food supply annually around 10 to 17%. 10%-17% And this trend is perceived to be continuing in the future by 2070. 2070 The regions suffering the most will be some African countries.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690269/a019efaa8f9543d99fb4389747760282.mp3\"></audio></div><br />This lecture talks about the influence of climate change. According to the speaker, he has mentioned some points of view. Climate change will make less production and less food. It is difficult for developing countries to deal with climate change due to their financial status and other issues. There are many people living in hungry, especially in Africa. The climate change will also have negative effects on the world economy.<br />本讲座讲述了气候变化的影响。演讲者提到了一些观点。气候变化将导致减产和粮食减少。由于发展中国家的财政状况和其他问题，它们很难应对气候变化。许多人生活在饥饿之中，尤其是在非洲。气候变化还会对世界经济产生负面影响。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690269/4a34ee05632f44a18a5c11ccd26b2b02.mp3", "phrases2": [{"en": "some adverse effects", "zh": ""}, {"en": "climate changes", "zh": ""}, {"en": "some lands", "zh": ""}, {"en": "the near future", "zh": ""}, {"en": "climate change", "zh": ""}, {"en": "less production", "zh": ""}, {"en": "financial status", "zh": ""}, {"en": "many people", "zh": ""}, {"en": "world economy", "zh": ""}, {"en": "the tropical areas", "zh": ""}]}, {"id": 3379, "name": "Shuttle", "phrases": ["a space truck", "a multi-purpose vehicle", "a tremendous number", "different things", "versatile space vehicle", "the space lab", "the space station", "the Mir space station", "the useful life", "the new international space station"], "eng": "The shuttle was designed to be a space truck — it's a multi-purpose vehicle. \" \"—— We've done a tremendous number of different things with it. It's the most versatile space vehicle that has ever been built. We've used it to launch satellites. We've used it to repair satellites in orbit and put them back into orbit. We've used it to capture satellites and bring them back to Earth for repair. We've outfitted it with the space lab built by our European partners and used it before the era of the space station to do scientific research. We used it as part of our partnership with the Russians, which is still continuing, first as part of the Mir space station, \" \" —— where we actually prolonged the useful life of Mir by several years through logistical supply visits with the shuttle. And now, of course, we're using it to build the new international space station, which is a huge international partnership.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690270/9fdc9ace67074e49852fe3afcdfccc99.mp3\"></audio></div><br />The shuttle was a space truck. It&#39;s a multi-purpose vehicle. The shuttle is the most versatile space vehicle that has ever been built. People used it to launch and repair satellites and outfitted it with the space lab and used it to do scientific research. People used it as part of the partnership with the Russians, which is still continuing. People will use it to build the new international space station, which is a huge international partnership.<br />航天飞机是一辆太空卡车，它是一种多功能飞行器。航天飞机是有史以来用途最广的太空交通工具。人们用它来发射和维修卫星，用它来装备太空实验室，用它来进行科学研究。人们用它作为与俄罗斯人合作的一部分，这种合作仍在继续。人们将用它来建造新的国际空间站，这是一个巨大的国际伙伴关系。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690270/d65fc72778f14fdea1ca164873aaeb7a.mp3", "phrases2": [{"en": "a space truck", "zh": ""}, {"en": "a multi-purpose vehicle", "zh": ""}, {"en": "a tremendous number", "zh": ""}, {"en": "different things", "zh": ""}, {"en": "versatile space vehicle", "zh": ""}, {"en": "the space lab", "zh": ""}, {"en": "the space station", "zh": ""}, {"en": "the Mir space station", "zh": ""}, {"en": "the useful life", "zh": ""}, {"en": "the new international space station", "zh": ""}]}, {"id": 3380, "name": "A survey with 100 CEO", "phrases": ["a hundred CEOs", "an acquisition", "frequent response", "information technology", "the IT issues", "a significant impact", "a clear understanding", "the consequences", "the one hand", "other areas"], "eng": "In our survey, over a hundred CEOs who had recently been through an acquisition or merger were asked which areas of their activities needed the most effort. As you can see, the most frequent response to this question was that information technology requires the most integration effort. According to 58 of those we surveyed, IT was the most time-consuming and needed the most work. 58 IT This is understandable as many of the IT issues are extremely complex and the consequences of any change in IT can have a significant impact. IT IT The key is how quickly and effectively IT integration can be achieved. IT And there has to be a clear understanding of the consequences there may be of not getting it right. The two other areas requiring significant attention: sales, marketing and business development on the one hand, and financial management on the other both were selected by 49 of the respondents. —— / / 49 49 ——", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2690000-2691000/2690271/9f4d19936e0a4f7a9ba14f34af8bfeb0.mp3\"></audio></div><br />The lecture mainly talks about a survey with 100 CEO. In the beginning of the lecture, the speaker mentioned that the survey is about which area of activity should contribute most effort. He further discussed that the result from the survey is IT, because IT make a huge influence on our society. And it is time consuming and complex. At the end of the lectures, he concluded that other two are marketing of sales and financial management and they are equally important.<br />讲座主要讲述了一项针对 100 名 CEO 的调查。讲座一开始，主讲人就提到，这项调查是关于哪个领域的活动应做出最大努力。他进一步谈到，调查的结果是信息技术，因为信息技术对我们的社会影响巨大。而这是一项耗时且复杂的工作。讲座结束时，他总结说，其他两个领域是销售市场和财务管理，它们同样重要。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690271/a820745fa5fe4298881ec0ead310ca81.mp3", "phrases2": [{"en": "a hundred CEOs", "zh": ""}, {"en": "an acquisition", "zh": ""}, {"en": "frequent response", "zh": ""}, {"en": "information technology", "zh": ""}, {"en": "the IT issues", "zh": ""}, {"en": "a significant impact", "zh": ""}, {"en": "a clear understanding", "zh": ""}, {"en": "the consequences", "zh": ""}, {"en": "the one hand", "zh": ""}, {"en": "other areas", "zh": ""}]}, {"id": 4273, "name": "King", "phrases": ["the king", "a kingdom", "the Middle Ages", "the king come", "the previous king", "other people", "the key currency", "“ duckie ”", "the duke", "the agricultural production"], "eng": "At the top, you would have a king. Now the king would rule over a kingdom. Now, this is not so easy to govern especially during the Middle Ages. And the king might owe many people, things especially people who help the king come to power, helped him dispose the previous king or to conquer this land. And so in exchange for that and to help govern, he might grant land or fiefs to other people. And the key currency in the Middle Ages under the feudal system is land. And land in exchange for loyalty and service. So this whole thing is a kingdom. Now right over here, this is a duchy. And a duchy will be controlled by a duke. I guess I didn't call it duckie because that just doesn't sound as serious. “duckie” So the king might grant a duchy, a duchy to a duke and in exchange, the duke would provide loyalty pledged their fealty. If the kingdom is threatened, the duke will fight alongside. The duke would provide their own troops if the king wants to go conquer other territories, same thing, and also provide the king with taxes which might be in the form of coinage depending on what time and region we are in the Middle Ages or it might be in the form of a percentage of the agricultural production from this duchy.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693304/2f9ad36fc894404dbad95abd846571d5.mp3\"></audio></div><br />In the Middle Ages, a king ruled over a kingdom. To govern, he granted land or fiefs to others in exchange for loyalty and service. Land was the key currency. For example, a duchy was controlled by a duke. The duke provided loyalty, pledged fealty, supplied troops, and paid taxes, either in coinage or as a percentage of agricultural production.<br />在中世纪，国王统治着一个王国。为了治理国家，他会把土地或封地赐予他人，以换取忠诚和服务。土地是关键货币。例如，一个公国由公爵控制。公爵提供忠诚、宣誓效忠、提供军队并缴纳税款，税款可能是铸币形式，也可能是公国农业产出的百分比。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693304/9c3cc58aab304ef9b069bc3a5e8541e7.mp3", "phrases2": [{"en": "the king", "zh": ""}, {"en": "a kingdom", "zh": ""}, {"en": "the Middle Ages", "zh": ""}, {"en": "the king come", "zh": ""}, {"en": "the previous king", "zh": ""}, {"en": "other people", "zh": ""}, {"en": "the key currency", "zh": ""}, {"en": "“ duckie ”", "zh": ""}, {"en": "the duke", "zh": ""}, {"en": "the agricultural production", "zh": ""}]}, {"id": 4274, "name": "Knee", "phrases": ["a cracking knee", "the sound", "most people", "“ ” Omer Inan", "an electrical engineer", "some real information", "“ ” Inan", "a high-end audio company", "the next day", "georgia Tech"], "eng": "The sound of a cracking knee isn't particularly pleasant. But it gets worse when you listen up close. \"It does for most people. But for me, it actually just makes me excited.\" “ ” Omer Inan, an electrical engineer at Georgia Tech. Omer Inan \"I actually feel like there's some real information in them that can be exploited for the purposes of helping people with rehab.\" “ ” Inan's experience with cracking knees goes back to his days as an undergrad at Stanford, where he threw discus. Inan \"If I had a really hard workout, then the next day, of course, I'd be sore, but I'd also sometimes feel that I would feel this basically catching or popping or creaking every now and then in my knee.\" “ ” A few years later, he found himself building tiny microphones at a high-end audio company. So when he got to Georgia Tech and heard the Defense Advanced Research Projects Agency, DARPA, wanted better tech for knee injuries, he thought: Why not strap tiny microphones to people's knees, to eavesdrop as their legs bend? DARPA \"What we think it is, is the cartilage and bone rubbing against each other, the surfaces inside the knee rubbing against each other, during those movements.\" “ ” He and a team of physiologists and engineers built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. And preliminary tests on athletes suggest the squishy sounds the device picks up are more erratic, and more irregular, in an injured knee than in a healthy one. Which Inan says might allow patients and doctors to track healing after surgery. Inan Details appear in the IEEE Transactions on Biomedical Engineering. IEEE \"The primary application we're targeting at first is to give people a decision aid during rehabilitation, following an acute knee injury, to help them understand when they can perform particular activities, and when they can move to different intensities of particular activities.\" “ ” A useful thing to take a crack at.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693306/35cf1cc606ed4f1abb478dc5c1528949.mp3\"></audio></div><br />The sound of a cracking knee isn&#39;t particularly pleasant. An electrical engineer was building tiny microphones at a high-end audio company to listen up to the knee cracking sound. He and his team built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. The primary application they are targeting at first is to give people a decision aid during rehabilitation.<br />膝盖咔嚓作响的声音听起来并不悦耳。一位电气工程师在一家高端音响公司研发微型麦克风，专门捕捉这种膝盖发出的声响。他和团队用弹性运动胶带、几枚微型麦克风和皮肤传感器制作出原型设备。该设备的首要应用目标是为康复治疗中的患者提供决策辅助。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693306/eac184f172c542d4a517bc61ea5ab68a.mp3", "phrases2": [{"en": "a cracking knee", "zh": ""}, {"en": "the sound", "zh": ""}, {"en": "most people", "zh": ""}, {"en": "“ ” Omer Inan", "zh": ""}, {"en": "an electrical engineer", "zh": ""}, {"en": "some real information", "zh": ""}, {"en": "“ ” Inan", "zh": ""}, {"en": "a high-end audio company", "zh": ""}, {"en": "the next day", "zh": ""}, {"en": "georgia Tech", "zh": ""}]}, {"id": 4275, "name": "Smell of books", "phrases": ["a historic library", "the smell", "another historical library", "saint Paul ’", "an intensive smell", "the first time", "the library", "an important message", "an important way", "the environment"], "eng": "Indeed, the library. We’ve all been to a historic library. We’ve all enjoyed the smell of a historic library. But what is it? And what does it mean? When we’ve recently, when at UCL Center for Sustainable Heritage, we’ve recently been asked to access the environment at another historical library at Saint Paul’s Cathedral, the Wren library, an incredible place. UCL —— And it has such an intensive smell of old books, and we were also asked for the first time really I was actually taken aback by the brief, and we were asked why we should preserve the smell. It is so important to our audience. It is so important how people perceive the library. So, that is, that was quite an important message in our research. And indeed smell is an important way of how we communicate with the environment. This piece of research was done by an advertising company because advertisers are so interested in how we, how we interact with each other and the environment. And we see that the majority of people use sight obviously to interact with the environment, but in the second place, we see the smell is also very, very important.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693307/aa058600c105466799afda27bcfa8ccd.mp3\"></audio></div><br />We&rsquo;ve all been to a historic library. Most historic libraries have such an intensive smell of old books. People are asked to perceive the library. Indeed, the smell is an important way of how we communicate with the environment. The majority of people use sight to interact with the environment, but on the second place, the smell is also very, very important.<br />我们都去过历史悠久的图书馆。在大多数历史悠久的图书馆里，都有一种强烈的旧书味。人们通过感官体验来认识图书馆。事实上，气味是我们与环境交流的重要方式之一。大多数人通过视觉与环境互动，但其次，气味也非常非常重要。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693307/49ac17c87b4e4e93b9785d5217f679de.mp3", "phrases2": [{"en": "a historic library", "zh": ""}, {"en": "the smell", "zh": ""}, {"en": "another historical library", "zh": ""}, {"en": "saint Paul ’", "zh": ""}, {"en": "an intensive smell", "zh": ""}, {"en": "the first time", "zh": ""}, {"en": "the library", "zh": ""}, {"en": "an important message", "zh": ""}, {"en": "an important way", "zh": ""}, {"en": "the environment", "zh": ""}]}, {"id": 4276, "name": "Melatonin", "phrases": ["the stuff", "the hormone", "the Pineal Gland", "the synthesis", "the size", "the corpus", "the site", "a rhythm", "the opposite", "the cortisol"], "eng": "I'm just going to take on the stuff where left off. The hormone I want to now talk about it's called melatonin. The synthesis is in the Pineal Gland, which is very small. It is the size of a pea in your brain. The corpus is the site of the soul, and it is where melatonin is made. “ ” And it has a rhythm as well. And in this sense, it is the opposite of the cortisol. It peaks at night. We call it the darkness hormone. “ ” In every species that we studied, melatonin occurs at night. And it's a hormone that prepares you for the things, that your species, does at night. So, of course, in humans we sleep, but animals, like rodents, they are awake. It's a hormone that is related to darkness behavior.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693308/695c7b71d4924bb08aa66e0886833b96.mp3\"></audio></div><br />The lecture talks about melatonin. This hormone is synthesized in the Pineal Gland. It is very small, the size of a pea in your brain. This is where melatonin is made. It has a rhythm and it is the opposite of cortisol. It peaks at night, so we call it the darkness hormone. In every species studied, melatonin occurs at night. It prepares you for what your species does at night. Humans sleep, but animals like rodents are awake. It is a hormone related to darkness behavior.<br />这场讲座讲的是褪黑素。这种激素在松果体中合成。它非常小，在你大脑中只有豌豆大小。这里是制造褪黑素的地方。它有节律性，并且与皮质醇相反。它在夜间达到峰值，所以我们称它为黑暗激素。在每一个被研究的物种中，褪黑素都在夜间出现。它为你在夜间要做的事情做准备。人类在夜间睡觉，但像啮齿动物这样的动物在夜间是清醒的。它是一种与黑暗行为相关的激素。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693308/0b2271b1ee83493dbbab0bc7e215cc36.mp3", "phrases2": [{"en": "the stuff", "zh": ""}, {"en": "the hormone", "zh": ""}, {"en": "the Pineal Gland", "zh": ""}, {"en": "the synthesis", "zh": ""}, {"en": "the size", "zh": ""}, {"en": "the corpus", "zh": ""}, {"en": "the site", "zh": ""}, {"en": "a rhythm", "zh": ""}, {"en": "the opposite", "zh": ""}, {"en": "the cortisol", "zh": ""}]}, {"id": 4277, "name": "A survey", "phrases": ["the survey", "the people", "a few years", "the Internet", "the website globalandmail.com", "frequent users", "a biased sample"], "eng": "Let's say if I'm asking which source do you often use to get your information—newspaper? Radio? TV? —— The survey shows 62 of the people chose the Internet. 62% You might be thinking I’m going to say, how important the Internet is or how quickly it has changed the world for a few years. But what if I tell you this survey is conducted on the website globalandmail.com? globalandmail.com Our answer will be different. Because the people who did this survey on this website must be frequent users of Internet. This sample is a biased sample. So we have to pay attention to how a survey is conducted.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693309/12337e3938704fa3ad6ed5a8eae84d56.mp3\"></audio></div><br />The lecture uses a hypothetical survey to illustrate sampling bias. While 62% of respondents in an online poll chose &ldquo;Internet&rdquo; as their primary news source, the survey&rsquo;s design (conducted on globalandmail.com) means results only reflect heavy Internet users, not the general population. This highlights the critical role of methodology in ensuring valid conclusions.<br />讲座通过一个假设性调查案例阐释样本偏差问题。尽管在线调查显示62%的受访者将&ldquo;互联网&rdquo;作为主要新闻来源，但由于调查仅在globalandmail.com网站进行，结果仅反映重度互联网用户的行为，无法代表整体人群。这凸显了研究方法对结论可靠性的关键影响。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693309/b5696af004094ded8773570f49f357dc.mp3", "phrases2": [{"en": "the survey", "zh": ""}, {"en": "the people", "zh": ""}, {"en": "a few years", "zh": ""}, {"en": "the Internet", "zh": ""}, {"en": "the website globalandmail.com", "zh": ""}, {"en": "frequent users", "zh": ""}, {"en": "a biased sample", "zh": ""}]}, {"id": 4278, "name": "A new instrument", "phrases": ["accessible musical instrument", "the Skoog", "special needs", "an instrument", "own sounds", "traditional instruments", "the shape", "a plucked string", "a string", "an object"], "eng": "The Skoog is a new universally accessible musical instrument. It is designed to use by children or adults with special needs or in fact be used by anyone. It's soft, it's easy to play, it's robust and it can be customized to suit anyone's abilities. The Skoog helps students with special needs by allowing them to get involved in making music themselves. Skoog It's an instrument that they can play it and they can take ownership of and start creating their own sounds and music. Traditional instruments are the shape and size and made of the materials they are because of the sound that they need to make. If you want to make a sound like a plucked string, you need a string and it needs to be under tension, whereas with a Skoog, because it's a mixture of software and a sensor, then thus the computer can handle making the sound. Skoog And so we can design an object that's designed to be touched and designed to be played with. In developing the screen and working with kids in the schools and in the classrooms, it's really helped us make the Skoog something that's usable by the children themselves. Skoog They've informed us massively on how it needs to work and they've given their opinions on colours and designs. And just the feedback they've given to us has been just marvellous. It's just so enriching and it's really inspiring to actually work with these kids, particularly when you can provide them with an ability to start to playing their own music as opposed to just taking part through listening and listening to other musicians and really learning from them.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693310/012ceece7c8f408c99da2f4fe23115d9.mp3\"></audio></div><br />The lecture talks about the Skoog, a new universally accessible musical instrument. It is soft, easy to play, and customizable for anyone, especially children with special needs. Unlike traditional instruments, the Skoog uses software and sensors, so the computer makes the sound. Therefore, it is designed to be touched and played with. It was developed with feedback from kids in schools. This helps them create their own music instead of just listening.<br />这场讲座讲的是Skoog，一种全新的通用无障碍乐器。它柔软、易于演奏，并且可以为任何人定制，特别是有特殊需要的儿童。与传统乐器不同，Skoog使用软件和传感器，所以由电脑来发出声音。因此，它被专门设计成用于触摸和弹奏。它是在学校孩子们的反馈下开发出来的。这帮助他们创作自己的音乐，而不仅仅是聆听。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693310/601c3a3d0ba241029ae8b342aff1b3c7.mp3", "phrases2": [{"en": "accessible musical instrument", "zh": ""}, {"en": "the Skoog", "zh": ""}, {"en": "special needs", "zh": ""}, {"en": "an instrument", "zh": ""}, {"en": "own sounds", "zh": ""}, {"en": "traditional instruments", "zh": ""}, {"en": "the shape", "zh": ""}, {"en": "a plucked string", "zh": ""}, {"en": "a string", "zh": ""}, {"en": "an object", "zh": ""}]}, {"id": 4279, "name": "Bilingual kids", "phrases": ["the arising concern", "the preschool year", "the reason", "the parents", "two languages", "one language", "parent role", "a good idea", "the separate speaker", "each language"], "eng": "The arising concern that a lot of people have about raising children bilingually, especially the preschool year is based on the conceptualization that the human brain at birth is essentially monolingual. And the reason why come to this occasion. Because often the parents will ask me if they use two languages at home will their child be confused, because they hearing two languages. And parents often ask my advice about whether they should use one language on parent role which is widely known that parents who are raising children bilingually. And the reason why most people think this is a good idea is that it will help to reduce the risks of the children being confused. Because they were able to associate each language with the separate speaker. The fear is that both parents use both languages, especially they use both languages interchangeable within the same conversation within the same sentences. The child will not be able to separate the languages.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693311/da26a573dc1d46dcb3a133434552d7d9.mp3\"></audio></div><br />The lecture discusses concerns about raising children bilingually, especially during preschool years. Many believe infants&rsquo; brains are inherently monolingual, leading parents to worry that hearing two languages at home might confuse their child. To reduce confusion, each parent can consistently uses one language. This helps children associate each language with a specific speaker.<br />讲座讨论了双语抚养孩子的问题，特别是在学龄前时期。许多人认为婴儿的大脑天生是单语的，这导致父母担心在家里听到两种语言可能会让他们的孩子感到困惑。为了减少混淆，每个家长可以始终使用一种语言。这有助于孩子们将每种语言与特定的说话者联系起来。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693311/8b26cdc9a4e449cab876248cbb81c953.mp3", "phrases2": [{"en": "the arising concern", "zh": ""}, {"en": "the preschool year", "zh": ""}, {"en": "the reason", "zh": ""}, {"en": "the parents", "zh": ""}, {"en": "two languages", "zh": ""}, {"en": "one language", "zh": ""}, {"en": "parent role", "zh": ""}, {"en": "a good idea", "zh": ""}, {"en": "the separate speaker", "zh": ""}, {"en": "each language", "zh": ""}]}, {"id": 4280, "name": "Stem cells", "phrases": ["a specific job", "stem cells", "muscle cells contract", "any specific structures", "all other kinds", "worn-out cells", "every four days", "the lining", "own body parts", "stem cell researchers"], "eng": "Stem cells are cells that are undifferentiated, meaning they do not have a specific job or function. While skin cells protect your body, muscle cells contract and nerve cells send signals, stem cells do not have any specific structures or functions. Stem cells do have the potential to become all other kinds of cells in your body. Your body uses stem cells to replace worn-out cells when they die. For example, you completely replace the lining of your intestines every four days. Stem cells beneath the lining of your intestines replace these cells as they wear out. Scientists hope that stem cells could be used to create a very special kind of personalized medicine, in which we could replace your own body parts with, well, your own body parts. Stem cell researchers are working hard to find ways in which to use stem cells to create new tissue to replace the parts of organs that are damaged by injury or disease. Using stem cells to replace damaged bodily tissue is called regenerative medicine. For example, scientists currently use stem cells to treat patients with blood diseases such as leukemia. Leukemia is a form of cancer that affects your bone marrow. Bone marrow is the spongy tissue inside your bones where your blood cells are created. In leukemia, some of the cells inside your bone marrow grow uncontrollably, crowding out the healthy stem cells that form your blood cells. Some leukemia patients can receive a stem cell transplant. These new stem cells will create the blood cells needed by the patient's body. There are actually multiple kinds of stem cells that scientists can use for medical treatments and research. Adult stem cells or tissue-specific stem cells are found in small numbers in most of your body's tissues.", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693312/87314bce0bd64088bc74e9f816c5c124.mp3\"></audio></div><br />The lecture talks about stem cells. They are undifferentiated cells without specific functions. However, they have the potential to become all other kinds of cells to replace worn-out cells. Scientists hope to use them for regenerative medicine to replace damaged tissue or organs. For example, stem cell transplants can treat patients with blood diseases like leukemia. There are multiple kinds of stem cells used for medical treatments and research.<br />这场讲座讲的是干细胞。它们是未分化的细胞，没有特定的功能。然而，它们有潜力变成所有其他种类的细胞，以替换衰老的细胞。科学家希望将它们用于再生医学，以替换受损的组织或器官。例如，干细胞移植可以治疗像白血病这样的血液疾病患者。目前有多种干细胞被用于医疗治疗和科学研究中。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693312/07e57124a8b949c98d1a6f9b25d0f6d4.mp3", "phrases2": [{"en": "a specific job", "zh": ""}, {"en": "stem cells", "zh": ""}, {"en": "muscle cells contract", "zh": ""}, {"en": "any specific structures", "zh": ""}, {"en": "all other kinds", "zh": ""}, {"en": "worn-out cells", "zh": ""}, {"en": "every four days", "zh": ""}, {"en": "the lining", "zh": ""}, {"en": "own body parts", "zh": ""}, {"en": "stem cell researchers", "zh": ""}]}, {"id": 4281, "name": "Dimension", "phrases": ["the notion", "a dimension", "many numbers", "the surface", "the earth", "a hang glider", "the space", "no reason", "three dimensions", "A four-dimensional space"], "eng": "So, let me begin with the notion of a dimension. “ ” A dimension is simply how many numbers you need to specify a location. So, if we think about the surface of the earth, the equator is one-dimensional: you need to specify only one number to specify a location on the equator, namely the longitude. —— The surface of the earth, altogether, is of course two-dimensional: you need to specify two numbers—latitude and longitude—to specify a location on the earth. —— The space above the earth is three-dimensional: if I want to tell you the location of a hang glider, I need to give you the latitude, longitude, and altitude. —— But mathematically, there’s no reason to stop at three dimensions. A four-dimensional space is simply a space in which you need to specify four numbers to specify a location in that space. A five-dimensional space would be one in which you need to specify five numbers, etc. In fact, I claim you already know an example of a four-dimensional space. So let's define an event: just to be an occurrence that happens in a small region of space at a definite time. “ ” In other words, an event is like a snap of your fingers or a clap of your hands. And now, the collection of all events—if I want to specify an event, I need to give you four numbers: I need to tell you where it happens in space and when it happens in time. ——", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693315/287224d2f16a4370a3c099bdbec48449.mp3\"></audio></div><br />A dimension is defined by the number of numbers needed to specify a location. For example, the Earth&rsquo;s equator is one-dimensional because only longitude is required to pinpoint a location there. The Earth&rsquo;s surface and the space above the Earth is two and three-dimensional respectively. Mathematically, dimensions aren&rsquo;t limited to three&mdash;four-dimensional space needs four numbers, five-dimensional space needs five, and so on. An event, like a finger snap, requires four numbers to specify&mdash;three for its spatial location and one for the time it occurs.<br />维度由确定一个位置所需的数字数量来定义。例如，地球的赤道是一维的，因为只需经度就能确定那里的一个位置。地球表面和地球上方的空间分别是二维和三维的。从数学角度而言，维度并不局限于三维 &mdash;&mdash; 四维空间需要四个数字，五维空间需要五个数字，依此类推。像打响指这样的事件，确定它需要四个数字 &mdash;&mdash; 三个用于表示其空间位置，一个用于表示其发生时间。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693315/61acafb6d55a4482a8d44ec2acead956.mp3", "phrases2": [{"en": "the notion", "zh": ""}, {"en": "a dimension", "zh": ""}, {"en": "many numbers", "zh": ""}, {"en": "the surface", "zh": ""}, {"en": "the earth", "zh": ""}, {"en": "a hang glider", "zh": ""}, {"en": "the space", "zh": ""}, {"en": "no reason", "zh": ""}, {"en": "three dimensions", "zh": ""}, {"en": "A four-dimensional space", "zh": ""}]}, {"id": 4282, "name": "Architecture", "phrases": ["visible manifestation", "a series", "a second Augustus", "the Emperor Augustus", "the case", "napoleon III", "the old 18th-century oil lamps", "some 20,000 gas lamps", "the chestnut trees", "50,000 trees"], "eng": "The most visible manifestation of this wealth was a series of grand projects begun by Napoleon III, mainly in Paris. Soon after he came to power in the 1850s, he said, “I want to be a second Augustus,” making reference to the Emperor Augustus's claim that he'd found Rome a city of brick and left it one of marble. 19 50 “ ” In the case of Napoleon III, he found Paris in 1851 a city of cobblestones and twisting medieval streets, and he left it one of asphalt and macadam. 1851 Because what he began doing was bulldozing Old Paris—the ancient, medieval part of Paris—and replacing it with wide new boulevards: 85 miles of them, which he lit with some 20,000 gas lamps (which took out all the old 18th-century oil lamps, replacing them with gas, which gave a much cleaner, brighter, regular light). —— —— 85 2 18 Also, 50,000 trees are planted alongside them—many of them the chestnut trees that we now think of as synonymous with Paris. 5 —— And he drained the streets with 200 miles of sewers: these new, famous Parisian sewers beneath the streets, thereby making the city a much safer, more pleasant place to wander, to stroll, to people-watch, to have coffee or absinthe in the cafés. 200 ——", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693314/c56ec070c19a46e89299635c078dcc94.mp3\"></audio></div><br />The lecture discusses Napoleon III&#39;s grand projects to transform Paris in the 1850s. He wanted to be like Emperor Augustus, turning a city of cobblestones into one of asphalt. He replaced old medieval streets with 85 miles of wide new boulevards. These were lit by 20,000 gas lamps and lined with 50,000 trees. He also built 200 miles of sewers. As a result, Paris became a much safer and more pleasant place for people to stroll and enjoy caf&eacute; life.<br />这场讲座讨论了拿破仑三世在19世纪50年代改造巴黎的宏伟工程。他想效仿奥古斯都皇帝，将一座鹅卵石城市变成沥青城市。他用85英里宽阔的新大道取代了古老的中世纪街道。这些大道由2万盏煤气灯照明，并种植了5万棵树。他还修建了200英里的下水道。因此，巴黎变成了一个更安全、更宜人的地方，供人们漫步和享受咖啡馆生活。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693314/c2d49812f36444ef99f493891523c914.mp3", "phrases2": [{"en": "visible manifestation", "zh": ""}, {"en": "a series", "zh": ""}, {"en": "a second Augustus", "zh": ""}, {"en": "the Emperor Augustus", "zh": ""}, {"en": "the case", "zh": ""}, {"en": "napoleon III", "zh": ""}, {"en": "the old 18th-century oil lamps", "zh": ""}, {"en": "some 20,000 gas lamps", "zh": ""}, {"en": "the chestnut trees", "zh": ""}, {"en": "50,000 trees", "zh": ""}]}, {"id": 4283, "name": "Thermodynamics and kinetic theory", "phrases": ["the 19th century", "kinetic theory", "material things respond", "19 Thermodynamics", "the laws", "random motion", "valid absolute", "unusual times", "all right"], "eng": "Coming out of the 19th century with all that happened and so quickly, some of these ideas, some of these theories like thermodynamics and kinetic theory, they didn't blend the way they should have. 19 Thermodynamics has its roots in matter how material things respond to heat and temperature and so forth. The laws of thermodynamics were thought to be absolute. Now take kinetic theory: if matter consists of atoms in random motion and that's what matter is, then you open up the possibility that there will be fluctuations in samples of matter such that the laws of thermodynamics can momentarily be violated. Are the laws of thermodynamics valid absolute? Are they obeyed statistically? On average they're obeyed but they can be violated during unusual times, all right?", "ref": "<div class=\"ckeditor-audio\"><audio controls=\"controls\" controlslist=\"nodownload\" src=\"/upload/ti/sardine/2693000-2694000/2693313/786f2696f6db4d49bd9a17122ede2485.mp3\"></audio></div><br />After the 19th century, thermodynamics and kinetic theory didn&rsquo;t blend properly. Thermodynamics has its roots in how material things respond to heat and temperature, whose laws were thought to be absolute. But kinetic theory states matter consists of atoms in random motion, creating fluctuations where thermodynamics laws can be violated. This raises questions. The lecture concludes thermodynamics laws are obeyed on average but can be violated during unusual fluctuations.<br />19世纪以后，热力学与动力学理论未能很好地融合。热力学源于物质对热量和温度的响应，其定律曾被认为是绝对的。但动力学理论认为，物质由处于随机运动中的原子组成，这种运动会产生涨落，使得热力学定律在某些情况下可能被打破。这引发了一系列问题。讲座最后指出，热力学定律总体上是成立的，但在异常涨落期间可能被暂时违反。", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693313/0986b6b1b368425f9689bf06e03fe3ae.mp3", "phrases2": [{"en": "the 19th century", "zh": ""}, {"en": "kinetic theory", "zh": ""}, {"en": "material things respond", "zh": ""}, {"en": "19 Thermodynamics", "zh": ""}, {"en": "the laws", "zh": ""}, {"en": "random motion", "zh": ""}, {"en": "valid absolute", "zh": ""}, {"en": "unusual times", "zh": ""}, {"en": "all right", "zh": ""}]}]}, "errors": [{"part": "SST", "name": "Transportation network in Paris", "bad": "Paris has an extensive public transoprtation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo.", "good": "Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by var MODE='card',PART='sst',FIXIDX=0,FIXORDER=[],CUR=null;
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function hdr(){document.getElementById('subtabs').style.display=(MODE==='fix')?'none':''}
function renderList(kw){
  kw=(kw||'').toLowerCase();
  var arr=D.cards[PART].filter(x=>!kw||x.name.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=arr.map(x=>'<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">'+x.phrases2.length+' 个原文词组 · 含音频</div></div><div class="go">开始 →</div></div>').join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到</div>';
}
function playAudio(url,btn){ if(CUR){try{CUR.pause()}catch(e){}} CUR=new Audio(url); btn.textContent='❚❚ 播放中'; CUR.onended=()=>btn.textContent='▶ 播放原文音频'; CUR.play().catch(()=>{btn.textContent='▶ 播放原文音频';alert('音频加载失败')}); }
function cardMode(item){
  var h='<span class="back" id="back">← 返回</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div>'+
  '<div class="row"><button class="bigbtn" id="playBtn">▶ 播放原文音频</button></div>'+
  '<div style="font-size:13px;color:#98a0ae">先听音频，看着下面的词组回忆原文；再听一遍，试着用这些词组把整段说出来。</div></div>'+
  '<div class="panel"><div class="lbl" style="font-size:12.5px;color:#98a0ae;margin-bottom:6px">听力原文关键词组（按出现顺序）</div><ol class="phlist">'+item.phrases2.map(p=>'<li>'+esc(p.en)+(p.zh?'<span class=zhph>'+esc(p.zh)+'</span>':'')+'</li>').join('')+'</ol>'+
  '<div class="row" style="margin-top:6px"><button class="bigbtn ghost" id="showRef">看听力原文</button><button class="bigbtn ghost" id="showTpl">复述模板</button></div><div class="ans" id="tpl"><div class="lbl">RL 复述模板</div><div class="ref">The lecture is mainly about ______.<br><br>First, the speaker mentions that ______.<br>Second, ______.<br>Third, ______.<br><br>So, in conclusion, ______.</div><div class="lbl" style="margin-top:10px">使用顺序</div><div class="ref">1. 先听音频，不看文字<br>2. 看着关键词组记笔记<br>3. 用模板把笔记串成话<br>4. 最后再点「看听力原文」核对</div></div>'+
  '<div class="ans" id="ans"><div class="lbl">听力原文</div><div class="ref">'+esc(item.eng)+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>{if(CUR){CUR.pause()}renderList(document.getElementById('q').value)};
  document.getElementById('playBtn').onclick=function(){playAudio(item.audio,this)};
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
document.getElementById('showTpl').onclick=()=>document.getElementById('tpl').classList.toggle('on');
}
function buildMode(item){
  var h='<span class="back" id="back">← 返回</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div>'+
  '<div class="row"><button class="bigbtn" id="playBtn">▶ 播放原文音频</button></div>'+
  '<div style="font-size:13px;color:#98a0ae">用下面全部词组，写一段完整的话（SST 写摘要 / RL 讲出来），写完点看范文对照。</div></div>'+
  '<div class="panel"><ol class="phlist">'+item.phrases2.map(p=>'<li>'+esc(p.en)+(p.zh?'<span class=zhph>'+esc(p.zh)+'</span>':'')+'</li>').join('')+'</ol></div>'+
  '<div class="panel"><textarea id="ta" placeholder="用上面的词组写成一段话..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showRef">看参考范文</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">参考范文</div><div class="ref">'+esc(item.ref)+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>{if(CUR){CUR.pause()}renderList(document.getElementById('q').value)};
  document.getElementById('playBtn').onclick=function(){playAudio(item.audio,this)};
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
document.getElementById('showTpl').onclick=()=>document.getElementById('tpl').classList.toggle('on');
}
function fixMode(){
  if(!FIXORDER.length){FIXORDER=shuffle(D.errors.map((_,i)=>i));FIXIDX=0;}
  var e=D.errors[FIXORDER[FIXIDX]];
  var angles=[...new Set(D.errors.filter(x=>x.name===e.name).map(x=>x.type))];
  var h='<div class="counter">第 '+(FIXIDX+1)+' / '+FIXORDER.length+' 段　'+e.part+' · '+esc(e.name)+'</div>'+
  '<div class="panel"><div class="errbad">'+esc(e.bad)+'</div>'+
  '<div style="font-size:13px;color:#98a0ae;margin-bottom:8px">下面是参考范文里的一段，请把错误改过来，改完点看答案。</div>'+
  '<textarea id="ta" placeholder="写出改正后的段落..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showAns">看答案</button><button class="bigbtn" id="next">下一段 →</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">改错角度</div><div class="angle">'+angles.map(a=>'<span>'+esc(a)+'</span>').join('')+'</div>'+
  '<div class="lbl">正确段落（绿色是改动处）</div><div class="diff">'+e.diff+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('showAns').onclick=()=>document.getElementById('ans').classList.add('on');
  document.getElementById('next').onclick=()=>{FIXIDX=(FIXIDX+1)%FIXORDER.length;fixMode();};
}
document.getElementById('tabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  MODE=e.target.dataset.m;
  document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.m===MODE?'on':''));
  hdr();
  if(MODE==='fix'){FIXORDER=[];fixMode();}else renderList(document.getElementById('q').value);
};
document.getElementById('subtabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  PART=e.target.dataset.p;
  document.getElementById('subtabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.p===PART?'on':''));
  renderList(document.getElementById('q').value);
};
document.getElementById('q').oninput=function(){if(MODE!=='fix')renderList(this.value)};
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null; if(!c)return;
  var it=D.cards[PART].find(x=>x.id===+c.dataset.id); if(!it)return;
  if(MODE==='card')cardMode(it);else buildMode(it);
};
hdr();renderList('');
</script></body></html>
