var MODE='card', PART='sst', FIXIDX=0, FIXORDER=[];
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function hdr(){document.getElementById('subtabs').style.display=(MODE==='fix')?'none':''}
/* 列表 */
function renderList(kw){
  kw=(kw||'').toLowerCase();
  var arr=D.cards[PART].filter(x=>!kw||x.name.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=arr.map(x=>'<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">'+x.kws.length+' 个关键词'+(MODE==='card'?' · 点击卡片看例句':' · 用这些词造句')+'</div></div><div class="go">开始 →</div></div>').join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到</div>';
}
/* 背关键词 */
function cardMode(item){
  var h='<span class="back" id="back">← 返回</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div><div style="font-size:13px;color:#98a0ae">先自己想这个词怎么用，点开看范文原句。</div></div>';
  item.kws.forEach(function(k,i){
    var ex=k.ex?k.ex.replace(new RegExp('(\b'+k.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\w*\b)','ig'),'<b>$1</b>'):'（范文里没有找到例句）';
    h+='<div class="fc" data-i="'+i+'"><div class="w">'+esc(k.w)+'</div><div class="hint">点击看范文原句</div><div class="ex">'+ex+'</div></div>';
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=function(){renderList(document.getElementById('q').value)};
  document.querySelectorAll('.fc').forEach(function(c){c.onclick=function(){this.classList.toggle('open')}});
}
/* 组句子 */
function buildMode(item){
  var ks=shuffle(item.kws.map(k=>k.w)).slice(0,5);
  var h='<span class="back" id="back">← 返回</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div><div class="kws">'+ks.map(k=>'<span class="kw">'+esc(k)+'</span>').join('')+'</div>'+
  '<textarea id="ta" placeholder="用上面这几个词写 1-2 句话，尽量说清楚一个意思..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showRef">看范文原句</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">范文里的相关句子</div><div class="good" id="reftext"></div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=function(){renderList(document.getElementById('q').value)};
  document.getElementById('showRef').onclick=function(){
    var refs=item.kws.filter(k=>ks.indexOf(k.w)>=0).map(k=>k.ex).filter(Boolean);
    document.getElementById('reftext').innerHTML=refs.map(r=>esc(r)).join('<br><br>')||'（这道题暂缺例句）';
    document.getElementById('ans').classList.add('on');
  };
}
/* 改错 */
function fixMode(){
  if(!FIXORDER.length){FIXORDER=shuffle(D.errors.map((_,i)=>i));FIXIDX=0;}
  var e=D.errors[FIXORDER[FIXIDX]];
  var parts=e.good.split(/\s+/), bads=e.bad.split(/\s+/), diff=[];
  for(var i=0;i<parts.length;i++){
    if(parts[i]!==bads[i]) diff.push('<del>'+esc(bads[i]||'')+'</del> <ins>'+esc(parts[i])+'</ins>');
    else diff.push(esc(parts[i]));
  }
  var h='<div class="counter">第 '+(FIXIDX+1)+' / '+FIXORDER.length+' 题　'+e.part+' · '+esc(e.name)+'</div>'+
  '<div class="panel"><div class="errtype">'+esc(e.type)+'</div><div class="errbad">'+esc(e.bad)+'</div>'+
  '<div style="font-size:13px;color:#98a0ae;margin-bottom:8px">把上面这句话的错误改过来，改完点看答案。</div>'+
  '<textarea id="ta" placeholder="写出正确的句子..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showAns">看答案</button><button class="bigbtn" id="next">下一题 →</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">正确句子（绿色是改对的部分）</div><div class="diff">'+diff.join(' ')+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('showAns').onclick=function(){document.getElementById('ans').classList.add('on')};
  document.getElementById('next').onclick=function(){FIXIDX=(FIXIDX+1)%FIXORDER.length; fixMode();};
}
document.getElementById('tabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  MODE=e.target.dataset.m;
  document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.m===MODE?'on':''));
  hdr();
  if(MODE==='fix'){FIXORDER=[];fixMode();} else renderList(document.getElementById('q').value);
};
document.getElementById('subtabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  PART=e.target.dataset.p;
  document.getElementById('subtabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.p===PART?'on':''));
  renderList(document.getElementById('q').value);
};
document.getElementById('q').oninput=function(){ if(MODE!=='fix') renderList(this.value); };
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null;
  if(!c)return;
  var item=D.cards[PART].find(x=>x.id===+c.dataset.id);
  if(!item)return;
  if(MODE==='card')cardMode(item); else buildMode(item);
};
