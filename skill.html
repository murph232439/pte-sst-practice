of security", "zh": "安全问题"}, {"en": "urban growth is remarkable", "zh": "城市增长惊人"}, {"en": "megacities of 20 million people", "zh": "2000 万人口的超大城市"}, {"en": "infrastructure start breaking down", "zh": "基础设施开始崩溃"}]}, {"id": 3799, "name": "Climate change in Australia", "phrases": ["sea levels", "the consequences", "every hundred years", "several times", "climate change", "“ ” Climates", "more drought", "the biggest issue", "the biggest concern", "the larger cities"], "eng": "Sea levels are rising and the consequences could be huge. By the end of this century, areas that only flood once every hundred years could start to flood several times every year. The rising sea is the sleeping giant of climate change. “ ” Climates may change, you might have more drought, and you might have more rain. But I think for me, the biggest issue, the biggest concern is what we'll do in the coming centuries. Unfortunately, many of the megacities in the world, and that also applies to the larger cities in Australia, have been built in low-lying areas. That means much of the world's population will eventually have to deal with sea-level rise. The question is, how high will the waters get? Well, we go to the remote northwest of Australia and make a disturbing discovery. According to this geologist's work. Sea levels could ultimately go up by a staggering nine meters.", "ref": "This lecture mainly talks about the sea levels of Australia. When the sea level is rising, the consequences may well be huge. This is because there will be more floods. Also, climate change will mean more rain and droughts. Many mega cities are likely to be affected by the sea level rising, and this means more people have to deal with it.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691712/0c9d23d1985a4ec5abe19da7d8a491f2.mp3", "phrases2": [{"en": "sea levels are rising", "zh": "海平面正在上升"}, {"en": "flood once every hundred years", "zh": "百年一遇的洪水"}, {"en": "the sleeping giant of climate change", "zh": "气候变化的沉睡巨人"}, {"en": "more drought and more rain", "zh": "更多干旱和降雨"}, {"en": "megacities built in low-lying areas", "zh": "超大城市建在低洼地区"}, {"en": "deal with sea-level rise", "zh": "应对海平面上升"}, {"en": "the remote northwest of Australia", "zh": "澳大利亚偏远的西北部"}, {"en": "sea levels could go up by nine meters", "zh": "海平面可能上升 9 米"}]}, {"id": 3800, "name": "Trust levels", "phrases": ["the extent", "economy platforms", "the last 40 years", "uber Airbnb", "5 Americans", "35 today", "a heightened level", "a digital interface", "a digital platform", "a generation"], "eng": "I'm fascinated by the extent to which sharing economy platforms like Uber and Airbnb are getting Americans to trust each other again. Uber Airbnb Over the last 40 years, the level of trust in society has fallen quite dramatically. 40 Less than 1 in 5 Americans under the age of 35 today feel that people are trustworthy in general. 35 But in parallel, we've developed a heightened level of trust in strangers who we meet through a digital interface. There's a generation that has grown up reading Yelp reviews, reading Amazon reviews, making their consumption choices based on what strangers on a digital platform say. Yelp And so someone who we interact with who comes accompanied by online reviews, a Facebook and LinkedIn profile, and other digital cues seems to be someone we'll trust at the level of friends and family. Facebook LinkedIn What excites me about this transition is that through history every time society has created a new basis for trust, it has expanded the economy dramatically. So I'm looking forward to seeing, as we trust our Uber drivers more, how this expands the world's economic activities and the possibilities for trade. Uber", "ref": "Sharing economy platforms are getting Americans to trust each other again. Over the last 40 years, the level of trust in society has fallen quite dramatically but we&#39;ve developed a heightened level of trust in strangers on digital interface. Every time society has created a new basis for trust, it has expanded the economy dramatically, so this will expand economic activities and possibilities for trade.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691714/41cb136a16d5432bb3f9f07c63944920.mp3", "phrases2": [{"en": "sharing economy platforms like Uber and Airbnb", "zh": "Uber 和 Airbnb 等共享经济平台"}, {"en": "the level of trust has fallen dramatically", "zh": "信任水平大幅下降"}, {"en": "less than 1 in 5 Americans under 35", "zh": "35 岁以下不到五分之一"}, {"en": "trust in strangers through a digital interface", "zh": "通过数字界面信任陌生人"}, {"en": "reading Yelp and Amazon reviews", "zh": "看 Yelp 和亚马逊评论"}, {"en": "online reviews and digital cues", "zh": "在线评论和数字线索"}, {"en": "trust at the level of friends and family", "zh": "像朋友家人一样的信任"}, {"en": "a new basis for trust expands the economy", "zh": "新的信任基础扩大经济"}]}, {"id": 3801, "name": "Underestimated women", "phrases": ["own abilities", "objective criteria", "the workforce", "the last two years", "other external factors", "a good job", "the corner office", "the side"], "eng": "Women systematically underestimate their own abilities. If you test men and women and you ask them questions on totally objective criteria, like GPAs, men get it wrong slightly high, and women get it wrong slightly low. Women do not negotiate for themselves in the workforce. A study in the last two years of people entering the workforce out of college showed that 57 percent of boys entering or men, I guess, are negotiating for salary, and only 7 percent of women. 57% 7% And most importantly, men attribute their success to themselves and women attribute it to other external factors. If you ask men why they did a good job, they'll say, I'm awesome. If you ask, obviously. Why are you even asking? “ ” If you ask women why they did a good job? What they'll say is someone helped them they got lucky, they worked really hard. “ ” “ ” “ ” Why does this matter? Boy, it matters a lot. Because no one gets to the corner office by sitting on the side, not at the table, and no one gets the promotion if they don't think they deserve their success, or they don't even understand their own success.", "ref": "Women tend to underestimate their own abilities, and they do not negotiate for themselves in the workforce. And most importantly, men attribute their success to themselves and women attribute it to other external factors. In conclusion, it is important for women to understand their own success, and they deserve their success.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691715/7f4a0d79a23c4b87a2a0654184ba1fc2.mp3", "phrases2": [{"en": "women underestimate their own abilities", "zh": "女性低估自己的能力"}, {"en": "questions on objective criteria like GPAs", "zh": "基于 GPA 等客观标准"}, {"en": "men get it slightly high, women slightly low", "zh": "男性偏高、女性偏低"}, {"en": "women do not negotiate for themselves", "zh": "女性不为自己谈判"}, {"en": "57 percent of men negotiating for salary", "zh": "57% 的男性为薪资谈判"}, {"en": "only 7 percent of women", "zh": "女性只有 7%"}, {"en": "men attribute success to themselves", "zh": "男性把成功归因于自己"}, {"en": "women attribute it to external factors", "zh": "女性归因于外部因素"}]}, {"id": 3802, "name": "Basic social values", "phrases": ["many basic social values", "a nutshell", "a great deal", "the kind", "basic level", "the world", "the unloving side", "different ways", "traumatic social problems", "the AIDS epidemic"], "eng": "But I think just to put it in a nutshell, that many basic social values are passed on unconsciously, already in babyhood. Adults convey a great deal to babies about the kind of society they're living in. And, you know, the most basic level, for example, whether the world is supportive and safe or challenging and dangerous. And all of us in different ways are working with the unloving side of society in a way and trying to find ways to offer a more caring response. And particularly those people who are working in Africa are often doing really cutting-edge work in dealing with traumatic social problems such as the AIDS epidemic, the aftermath of war, homelessness and so on. Whilst probably the majority of you who've actually made it here today are putting your creative energy into, I'm sure, wonderful, but probably more tried and tested kind of projects.", "ref": "The lecture is mainly about basic social values. According to the speaker, many basic social values are passed on unconsciously, already in babyhood. And most people in different ways are working with the unloving side of society in a way and trying to find ways to provide a more caring response, especially those working in Africa who often deal with traumatic social problems.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691718/3c2e77f6064d4fa58337cd83a5480abe.mp3", "phrases2": [{"en": "basic social values passed on unconsciously", "zh": "基本社会价值观无意识传递"}, {"en": "already in babyhood", "zh": "在婴儿期就已开始"}, {"en": "adults convey a great deal to babies", "zh": "大人向婴儿传递很多"}, {"en": "whether the world is supportive and safe", "zh": "世界是支持安全还是危险"}, {"en": "the unloving side of society", "zh": "社会缺少关爱的一面"}, {"en": "a more caring response", "zh": "更有爱心的回应"}, {"en": "cutting-edge work in Africa", "zh": "在非洲的前沿工作"}, {"en": "traumatic social problems like AIDS", "zh": "艾滋病等创伤性社会问题"}]}, {"id": 3803, "name": "Experiment on climate change", "phrases": ["many challenges", "climate change", "noticed climate change", "an experiment", "30 Humans", "the observation", "the climate system", "A method", "10 degrees", "the century"], "eng": "Humans are faced with many challenges, one of which is climate change. An experiment was conducted on the environment and climate in the 1930s when people first noticed climate change. 20 30 Humans have been trying to change their lifestyles to deal with it, but the observation of climate change is difficult from area to area. A method is introduced to help understand the mechanism of the climate system. Researchers predict that temperatures will increase about two to 10 degrees Fahrenheit by the end of the century. 2 10 What's less certain is what rising temperatures mean for the planet. Some climate models predict subtle changes. Others forecast rising sea levels, which could flood coastal areas around the world. Weather patterns could change, making hurricanes more frequent. Severe droughts could become more common in warm areas, and species unable to adapt to the changing conditions would face extinction, although much remains to be learned about global warming. Many organizations advocate cutting greenhouse gas emissions to reduce the impact of global warming. Consumers can help by saving energy around the house, switching to compact fluorescent light bulbs, and driving fewer miles in the car each week. These simple changes may help keep the earth cooler in the future.", "ref": "Climate change is one of the challenges facing our world today. In the 1930s, when people first noticed climate change, they have been trying to deal with it, but it is difficult to observe changes in climate from area to area. Although scientists have different views on climate change, cutting greenhouse gas emissions, saving energy, and driving fewer miles may help keep the earth cooler in the future.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691719/b572ab058a1f4494b40d0926ab105f57.mp3", "phrases2": [{"en": "humans are faced with climate change", "zh": "人类面临气候变化"}, {"en": "an experiment conducted in the 1930s", "zh": "1930 年代做的实验"}, {"en": "change their lifestyles to deal with it", "zh": "改变生活方式来应对"}, {"en": "the observation of climate change is difficult", "zh": "观察气候变化很难"}, {"en": "temperatures will increase about two to 10 degrees", "zh": "气温将上升 2 到 10 度"}, {"en": "rising sea levels could flood coastal areas", "zh": "海平面上升可能淹没沿海"}, {"en": "hurricanes more frequent", "zh": "飓风更频繁"}, {"en": "species face extinction", "zh": "物种面临灭绝"}]}, {"id": 4442, "name": "Stock market and business", "phrases": ["the stock market", "a public company", "the supermarket", "a brokerage account", "the major stock market indexes", "the term", "some different uses", "the 18th century", "the market", "traditional companies"], "eng": "The stock market is where investors connect to buy and sell investments - most commonly, stocks, which are shares of ownership in a public company. When you need groceries, you go to the supermarket. When you're ready to buy stocks or mutual funds, you'll usually buy them online through the stock market, which anyone can access with a brokerage account or employee retirement plan. The term 'stock market' often refers to one of the major stock market indexes. “ ” However, there are some different uses of the stock market before and after. In the 18th century, manufacturing companies came into the market. Traditional companies used stocks to raise money, and input money into companies, while modern companies used stocks to output money. 18 From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently. 19 20 The stock market also inclined to put money into big companies.", "ref": "The stock market is where investors buy and sell stocks, which represent shares of ownership in public companies. It can be accessed online through a brokerage account or retirement plan. In the past, companies used stocks to raise money, but now modern companies like Apple and Google earn money and use stocks differently. The stock market also tends to invest in large companies.From 19th to 20th century, however, modern companies, such as Apple, Google and Microsoft are big enough to earn money, and use stocks differently.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693053/2aa766ab77a5453fb30c5b4831898e08.mp3", "phrases2": [{"en": "the stock market is where investors buy and sell", "zh": "股票市场是投资者买卖的地方"}, {"en": "stocks are shares of ownership", "zh": "股票是所有权份额"}, {"en": "buy them online through the stock market", "zh": "通过股票市场在线购买"}, {"en": "a brokerage account or retirement plan", "zh": "经纪账户或退休计划"}, {"en": "major stock market indexes", "zh": "主要股票市场指数"}, {"en": "in the 18th century, manufacturing companies", "zh": "18 世纪的制造公司"}, {"en": "traditional companies used stocks to raise money", "zh": "传统公司用股票筹资"}, {"en": "modern companies like Apple, Google and Microsoft", "zh": "苹果、谷歌、微软等现代公司"}]}, {"id": 4443, "name": "Citizenship curriculum", "phrases": ["a subject report", "last month", "the citizenship curriculum", "the report", "a long way", "national curriculum requirements", "appropriate provision", "the curriculum", "other subjects", "the progress"], "eng": "Last month I published alongside my annual report a subject report on the development of citizenship in schools. The report celebrates the success of some schools in implementing the citizenship curriculum. It praises those schools where there have been substantial developments in the subject, and which now go a long way towards fulfilling national curriculum requirements. In the report, we are critical of schools which have not taken citizenship seriously, either through reluctance or lack of capacity to make appropriate provision in the curriculum. Citizenship is marginalized in the curriculum in one-fifth of schools. It is less well established in the curriculum than other subjects, and less well taught, and some critics have seized on this as a reason for wanting to step back from supporting it. Yet, the progress made to date by the more committed schools suggests that the reasons for introducing citizenship are both worthwhile and can be fulfilled, given the time and resources. Indeed, those reasons are given added weight by national and global events of the past few months. While not claiming too much, citizenship can address core skills, attitudes, and values that young people need to consider as they come to terms with a changing world. The main problems standing in the way of implementation of citizenship continue to be: the lack of commitment on the part of many school leaders; and insufficient amount of initial and in-service training provision to ensure that every school can call upon teachers with subject expertise; and its uncertain place in the curriculum.", "ref": "The lecture discusses a report on the development of citizenship education in schools. While it praises schools that successfully implement the curriculum, it criticizes those where the subject is marginalized. Despite some challenges, citizenship education remains valuable for developing students&#39; core skills and values. However, its implementation faces major obstacles, including a lack of leadership commitment, insufficient teacher training, and an uncertain position in the curriculum.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693662/79481a8bee0f464592ed1dc62a56b48a.mp3", "phrases2": [{"en": "a subject report on citizenship in schools", "zh": "关于学校公民课的学科报告"}, {"en": "success in implementing the citizenship curriculum", "zh": "成功实施公民课程"}, {"en": "fulfilling national curriculum requirements", "zh": "满足国家课程要求"}, {"en": "citizenship is marginalized in one-fifth of schools", "zh": "公民课在五分之一学校被边缘化"}, {"en": "less well established and less well taught", "zh": "建立和教学都不够好"}, {"en": "introducing citizenship is worthwhile", "zh": "引入公民课是值得的"}, {"en": "core skills, attitudes and values", "zh": "核心技能、态度和价值观"}, {"en": "a lack of commitment from school leaders", "zh": "学校领导缺乏投入"}]}, {"id": 4444, "name": "Amory Lovins", "phrases": ["amory Lovins", "an unusual character", "a wide range", "outside Snowmass", "the side", "iconic plastic oddball genius", "elizabeth Kolbert", "some time", "· Elizabeth Kolbert ·"], "eng": "Who knows who Amory Lovins is? · Amory Lovins Nobody. Amory Lovins is an unusual character. · He is something of polymath. Just to say, he is sort of him of knowledge across a wide range of fields. He’s not an academic. He has a consulting company which he runs off until huge recently out of his home in Colorado. He is outside Snowmass in a house built into the side of the mountain that has no furnace. For that 30 years, he has been kind of iconic plastic oddball genius, thinking of ways to save energy, thinking of ways to solve problems using technology that already exists. 30 And he has demonstrated several of them. He also offers he is something that he is such of oddballs that people tend to think he is kind of crazy. Anyway, Elizabeth Kolbert, went to spend some time with Amory Lovins. · Elizabeth Kolbert · And so he has written his pieces called Mr. Green. Mr. Green", "ref": "The lecture introduces Amory Lovins, a polymath and consultant regarded as an eccentric genius. He dedicates himself to energy conservation and solving problems using existing technology. He demonstrates his ideas practically by living in a mountain house without a furnace. His remarkable dedication and unconventional approach attract public attention, inspiring journalist Elizabeth Kolbert to write a profile about him titled &quot;Mr. Green.&quot;", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693663/18d72b305df8407fbaf00ef56d462ec1.mp3", "phrases2": [{"en": "an unusual character", "zh": "一个不同寻常的人"}, {"en": "something of a polymath", "zh": "有点像博学家"}, {"en": "a consulting company", "zh": "一家咨询公司"}, {"en": "a house built into the side of the mountain", "zh": "建在山边的房子"}, {"en": "a house with no furnace", "zh": "没有炉子的房子"}, {"en": "iconic oddball genius", "zh": "标志性的古怪天才"}, {"en": "thinking of ways to save energy", "zh": "思考节能的方法"}, {"en": "solve problems using existing technology", "zh": "用现有技术解决问题"}]}, {"id": 4445, "name": "Einstein", "phrases": ["all sorts", "the universe", "the other heavenly bodies", "the stars", "einstein ’ s work", "the 20th century", "all celestial notions", "a continuous dynamic change", "the larger scale", "a prediction"], "eng": "For thousands of years, philosophers and astronomers and thinkers of all sorts have imagined that the universe, the space around us, was rather like this floor in front of us. —— —— It was fixed and unchangeable, and things happen on it, just as people walk around. So the stars, the comets, and the planets, and the other heavenly bodies moved around and traced down their parts on this completely unchanging stage of space. In the 20th century, as the result of Einstein’s work, that view of the universe was completely transformed. 20 We began to understand that there was no absolutely fixed stage of space at all on which all celestial notions were played out. But in some sense, on the larger scale in the universe, the space itself was in this state of a continuous dynamic change. That was a prediction made by Einstein. But it was the astronomer Edwin Hubble who is the owner of the honor of making the discovery that our universe was really like that. · Edwin Hubble", "ref": "The lecture explains the evolution of the universe concept. Traditionally, people view space as a completely fixed and unchangeable stage for celestial bodies. However, Einstein transforms this perspective by predicting that space itself undergoes continuous dynamic change. Furthermore, the astronomer Edwin Hubble makes the crucial discovery that confirms his prediction, proving that the universe is truly dynamic rather than static.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693664/b44c4c30aa5340068ffe6941389057a0.mp3", "phrases2": [{"en": "philosophers and astronomers imagined the universe", "zh": "哲学家和天文学家想象宇宙"}, {"en": "the universe was like this floor", "zh": "宇宙像这块地板"}, {"en": "fixed and unchangeable", "zh": "固定不变"}, {"en": "the space was an unchanging stage", "zh": "空间是不变的舞台"}, {"en": "Einstein's work transformed that view", "zh": "爱因斯坦的工作改变了这一观点"}, {"en": "no absolutely fixed stage of space", "zh": "没有绝对固定的空间舞台"}, {"en": "space itself was in continuous dynamic change", "zh": "空间本身在持续动态变化"}, {"en": "the astronomer Edwin Hubble made the discovery", "zh": "天文学家哈勃做出了发现"}]}, {"id": 4446, "name": "International environmental law", "phrases": ["international environmental law", "the sovereign states", "“ ” United Kingdom", "the environmentalists", "the main concern", "the reign", "detailed legislative controls", "all areas", "any appropriate enforcement", "little practical effect"], "eng": "Before we consider international environmental law and climate change we need to consider domestic legislation, as it is within the sovereign states that international law is put into practice. This reflects the environmentalists' maxim, 'think globally act locally.' “ ” United Kingdom legislative control over the impacts of man's activity on the environment is not new. As long ago as the reign of Charles II the main concern was the production of smoke from the burning of sea coal. Almost all areas of trade and industry were subject to very detailed legislative controls at that time, although some were governed by 'self-regulation' in the form of guilds, which regulated both supply and methods of production. “ ” However, the measures implemented were mostly ineffective because then, as now, the specifying of legal duties and standards without providing any appropriate enforcement merely indicated good intentions but were of little practical effect. The next stage was prompted by the Industrial Revolution with the urbanization of society and its profound effects on the environment. Local industrialists used the Adam Smith model to maximize their economic benefit, but this was to the detriment of the local environment with the operation of 'Gresham's Law' that is, the bad drives out the good. · “ ” Those industrialists who were concerned for either the health of their employees or the local environment faced higher costs than their competitors. The result was the need for increasingly comprehensive statutory controls on the discharge of pollutants into various receiving media.", "ref": "The lecture highlights the crucial role of domestic legislation in implementing international environmental law. It traces the history of UK environmental controls and explains that early regulations lack proper enforcement, which makes them ineffective. Additionally, the Industrial Revolution worsens environmental damage because industrialists prioritize economic profit. Therefore, comprehensive statutory controls on pollutant discharge become essential for effective environmental protection.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693669/c30f61d5f398497abcf3cc4e7b004942.mp3", "phrases2": [{"en": "domestic legislation within sovereign states", "zh": "主权国家的国内立法"}, {"en": "think globally act locally", "zh": "全球思考，本地行动"}, {"en": "legislative control over man's activity", "zh": "对人类活动的立法控制"}, {"en": "the reign of Charles II", "zh": "查理二世统治时期"}, {"en": "self-regulation in the form of guilds", "zh": "行会形式的自我监管"}, {"en": "measures were mostly ineffective", "zh": "措施大多无效"}, {"en": "the Industrial Revolution and urbanization", "zh": "工业革命与城市化"}, {"en": "statutory controls on pollutants", "zh": "对污染物的法定管控"}]}, {"id": 4447, "name": "Development of genes", "phrases": ["the last 200,000 years", "the human minds", "genes changes", "the penetrating", "the genetic differences", "500,000 years", "small number", "powerful minds"], "eng": "The pace, the pace of which that the human minds have evolved over the last half million years and more recently the last 200,000 years has been so frighteningly rapid that the evolution of cognitive function and perception in different ways, can only happen to the actions of a small number of genes. If one needed to adapt a dozen of genes changes and concert, in order to acquire the penetrating minds that we now have, which our ancestors 500,000 years ago didn't have, the evolution could not have taken, could not have occurred so quickly. And for that reason alone, one begins to suspect that the genetic differences between people who lived 500,000 years ago sever that cognitive functions than ours are not so large. Therefore, a rather small number of genes, maybe responsible for comforting us that powerful minds which we now, which the most of us now processed.", "ref": "The lecture discusses the rapid evolution of human cognitive function over the past 500,000 years. This fast development only occurs through changes in a small number of genes, because requiring multiple gene changes makes such rapid evolution impossible. Consequently, the genetic differences between ancient humans and modern people remain relatively small. Ultimately, a limited number of genes are responsible for endowing humans with powerful cognitive abilities.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693670/a937d5e8c5b74337ac2aaa610ab4d062.mp3", "phrases2": [{"en": "the pace of human minds evolving", "zh": "人类心智进化的速度"}, {"en": "the last 200,000 years", "zh": "过去 20 万年"}, {"en": "the evolution of cognitive function and perception", "zh": "认知功能和感知的进化"}, {"en": "the actions of a small number of genes", "zh": "少量基因的作用"}, {"en": "a dozen gene changes in concert", "zh": "十几个基因协同变化"}, {"en": "the penetrating minds that we now have", "zh": "我们现在拥有的敏锐心智"}, {"en": "our ancestors 500,000 years ago", "zh": "50 万年前的祖先"}, {"en": "the genetic differences are not so large", "zh": "基因差异并不大"}]}, {"id": 4448, "name": "Drug ads", "phrases": ["money drug companies", "the amount", "a prescription drug", "no wonder", "patty Neighmond reports", "the Annals", "drug ads", "prime time", "high cholesterol", "the drug industry"], "eng": "The amount of money drug companies spend on TV ads has doubled in recent years. And it's no wonder: studies show the commercials' work: consumers go to their doctors with a suggestion for a prescription drug they saw advertised on TV. —— Now a study in the Annals of Family Medicine raises questions about the message these ads promote, NPR's Patty Neighmond reports. NPR · You're most likely to see drug ads during prime time, especially around the news. Researchers analyzed 38 ads aimed at people with conditions like hypertension, herpes, high cholesterol, depression, arthritis, and allergies. 38 The drug industry says the ads arm consumers with information. But researchers found that though the information was technically accurate, the tone was misleading. UCLA psychologist Dominick Frosch headed the study. · \"What we would see in these ads is that before taking the prescription drug, the character's life was out of control and the loss of control really extended beyond just the impact of the health condition,\" “ ” For example, herpes patients were portrayed as being incapacitated for days, insomniacs utterly out of synch on the job and depressed patients friendless and boring at parties. \"When the character is then shown taking the drug, he then magically regains complete control of his life.\" “ ” None of the ads, of course, mentioned lifestyle changes that could also help treat the condition. After all, it's mass marketing. But in this case, Frosch says, prescription medications are not like soap.", "ref": "The lecture discusses the increase in pharmaceutical TV advertising and its impact on consumers. Although the information is technically accurate, researchers find the ads misleading. They exaggerate the negative impact of health conditions and suggest that medication magically restores life control. Furthermore, these advertisements ignore lifestyle changes that help treat conditions, highlighting that prescription drug marketing differs significantly from ordinary product promotion.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693671/cc9481aecafb4e9c860d593bbf98d849.mp3", "phrases2": [{"en": "money on TV ads has doubled", "zh": "电视广告支出翻倍"}, {"en": "consumers ask doctors for advertised drugs", "zh": "消费者向医生要广告中的药"}, {"en": "a study in the Annals of Family Medicine", "zh": "家庭医学年刊的研究"}, {"en": "drug ads during prime time", "zh": "黄金时段的药品广告"}, {"en": "researchers analyzed 38 ads", "zh": "研究者分析了 38 个广告"}, {"en": "the tone was misleading", "zh": "语气具有误导性"}, {"en": "the character's life was out of control", "zh": "角色的生活失控"}, {"en": "none mentioned lifestyle changes", "zh": "都没提到生活方式的改变"}]}, {"id": 4449, "name": "Vitamin D", "phrases": ["the fat-soluble vitamins", "vitamin D", "the “ sunshine vitamin ”", "no dietary need", "the real important word", "a big question", "the fortification", "D So Vitamin D", "the Vitamin", "skin exposure"], "eng": "So today we're going to finish talking about the fat-soluble vitamins. I'm going to start with Vitamin D. D And I think probably most of you know that Vitamin D is called the “sunshine vitamin”. D “ ” And it's called that because there's absolutely no dietary need for vitamin D if you get adequate sunshine. D And the real important word there is “it” because it turns out that in climates which aren't near the equator there's a big question as to whether or not using these you get adequate sunshine. “ ” And that's important because foods are not naturally abundant in vitamin D. D And that's why milk is fortified but the fortification may not be enough. D So again just exposure to sunlight is adequate, no need for vitamin D. D So Vitamin D really isn't the Vitamin, it's a prohormone when human beings evolve, we evolved in tropical climates and ran around naked. D There was plenty of skin exposure to sunlight and so there was no dietary need for Vitamin D. D As humans migrated away from that tropical regions, they actually created a need for Vitamin D in food because sunlight was inadequate, particularly during the winter. D", "ref": "The lecture introduces Vitamin D, known as the &quot;sunshine vitamin,&quot; because adequate sunlight eliminates the dietary need for it. Since foods lack natural abundance of Vitamin D, milk is fortified, which may remain insufficient in non-tropical climates. Furthermore, human evolution in tropical regions provides enough sun exposure, but migration to other areas creates a dietary need for Vitamin D due to inadequate sunlight.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693677/d0285a69386540b5a6ef320bc5dd6f7f.mp3", "phrases2": [{"en": "fat-soluble vitamins", "zh": "脂溶性维生素"}, {"en": "Vitamin D is called the sunshine vitamin", "zh": "维生素 D 被称为阳光维生素"}, {"en": "no dietary need if you get adequate sunshine", "zh": "阳光充足就无需从饮食摄取"}, {"en": "in climates not near the equator", "zh": "在远离赤道的气候中"}, {"en": "milk is fortified", "zh": "牛奶被强化"}, {"en": "Vitamin D is a prohormone", "zh": "维生素 D 是一种激素原"}, {"en": "migration away from tropical regions created a need", "zh": "离开热带地区产生了需求"}, {"en": "particularly during the winter", "zh": "尤其在冬天"}]}, {"id": 4450, "name": "Devolution of power", "phrases": ["one aspect", "modifying government", "“ devolution ”", "the State level", "a rationale", "the time", "the New York Times", "a philosophical issue", "the Democrats", "a hidden part"], "eng": "Well, that’s one aspect of what’s called, reducing government - modifying government, to be more precise. “ ” —— Another aspect of it is what’s called “devolution” - reducing - moving governmental power from the Federal to the State level. “ ”—— And that has a kind of a rationale which you hear all over the time - place. For example, there was an op-ed a couple of weeks ago in the New York Times by John Cogan - Hoover Institute at Stanford, who has pointed out what he called a philosophical issue that divides the Democrats from the Republicans. · The philosophical issue is that the Democrats believe in big government and entitlements, and the Republicans believe in getting power down closer to the people, to the States, because they’re kind of populist types. Well, it takes about maybe three seconds’ thought to realize that moving power down to the States, in funding and so on, is just moving it away from the people, for a perfectly elementary reason: there’s a hidden part of the system - of the power system that you’re not supposed to know about, or think about, and that’s private power. —— —— ——", "ref": "The lecture discusses the concept of devolution, which involves moving governmental power from the federal to the state level. While Republicans support this approach to bring power closer to the people, the speaker argues that it actually moves power away from citizens. This is because a hidden part of the power system, specifically private power, remains unknown to the public.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693678/e503c508e4d445bbb26798aec4cbcb1e.mp3", "phrases2": [{"en": "reducing and modifying government", "zh": "缩减和调整政府"}, {"en": "devolution: moving power from Federal to State", "zh": "权力下放：从联邦到州"}, {"en": "an op-ed in the New York Times", "zh": "纽约时报的专栏"}, {"en": "the Hoover Institute at Stanford", "zh": "斯坦福胡佛研究所"}, {"en": "a philosophical issue dividing Democrats and Republicans", "zh": "分裂两党的哲学问题"}, {"en": "Democrats believe in big government", "zh": "民主党信奉大政府"}, {"en": "Republicans want power closer to the people", "zh": "共和党希望权力更贴近人民"}, {"en": "a hidden part: private power", "zh": "隐藏的部分：私人权力"}]}, {"id": 4451, "name": "A female novelist", "phrases": ["a novelist", "a little detour", "the intention", "the right thing", "a great novelist", "a big influence", "the time", "every time", "deep breath", "the first chapter"], "eng": "I have been writing non-fiction for years actually, but secretly wanting to be a novelist. When I first started writing at the age of 30, it was with the intention of writing fiction, but I took a little detour for 10 or 12 years, and write non-fiction which I absolutely have no regret about at all. 30 I think it's exactly the right thing for me to do. But there's this dream tucked away inside of me to do this. Now I was remembering reading something that wrote, who is a great novelist from Mississippi who had a big influence on me actually. She said, \"no art ever came out of not risking your neck.\" “ ” And I think she's absolutely right about that. It felt that way to me at the time; it actually feels that way every time I sit down to write something. Finally, in the early 90s, I took my deep breath and started writing fiction. 90 It felt risky to me at the time to do that. And one of the very first things that I wrote was, what I thought was going to be the first chapter of a novel, called \"The Secret Life of Bees.\" I wrote it in 1992, and it is actually essentially the first chapter of the novel as it is now. 1992", "ref": "The speaker shares her personal journey from writing non-fiction to fulfilling her dream of becoming a novelist. Inspired by the belief that true art requires taking risks, she finally began writing fiction in the early 1990s. As a result, she drafted the first chapter of her acclaimed novel, &quot;The Secret Life of Bees,&quot; in 1992, which remains largely unchanged in the final published version.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693679/72316ba707434484812af152cc66af73.mp3", "phrases2": [{"en": "writing non-fiction for years", "zh": "写了多年非虚构"}, {"en": "secretly wanting to be a novelist", "zh": "私下想当小说家"}, {"en": "started writing at the age of 30", "zh": "30 岁开始写作"}, {"en": "took a detour for 10 or 12 years", "zh": "绕道了 10 到 12 年"}, {"en": "a great novelist from Mississippi", "zh": "来自密西西比的伟大小说家"}, {"en": "no art ever came out of not risking your neck", "zh": "不冒险就出不了艺术"}, {"en": "in the early 90s, started writing fiction", "zh": "90 年代初开始写小说"}, {"en": "The Secret Life of Bees", "zh": "蜜蜂的秘密生活"}]}, {"id": 4452, "name": "Globalization", "phrases": ["a few different definitions", "one sense", "international communications", "more trade", "the source", "corporate trade", "a long time", "the continuation", "an economic system", "another way"], "eng": "Globalization, what is globalization? I think that it takes on a few different definitions in one sense of the word. Globalization means proliferation of transactions across country. So, one way of thinking about globalization is a way to describe, increase international communications, more trade happening between countries and be less self-sufficient in providing goods and services to their people and more companies that have offices in multiple countries, which we call multinationals. So, the source of growth in travel and communication and corporate trade across borders. And this way of thinking about globalization is the continuation of thinking that has been around for a long time, such as when the Europeans went to the Orient, to find spices, which was also an example of global trade and communication. Another way to think of globalization though, is an economic system. It is a system in which countries become integrated in a way that never had been before. In this system, we see a global split in the process between consuming and producing goods. Some countries produce goods, some countries consume goods, and then these countries in different areas of the globe depend on each other in a kind of organic solidarity rather than having an economic system being just inside your country. The system is the way economy in your country functions depends on economy of another country. And in fact this way of thinking about globalization represents a new area of economic progression. The past industrialist economy has been a global issue.", "ref": "The lecture defines globalization from two perspectives. First, it refers to the proliferation of cross-border transactions, including increased international trade, communication, and multinational companies. Second, it functions as an integrated economic system characterized by a global division between producing and consuming goods. Ultimately, this mutual dependence among countries represents a new stage of economic progression compared to past industrial economies.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693684/01ad1f4ca2904cca99fccb1b969b60ed.mp3", "phrases2": [{"en": "globalization has a few definitions", "zh": "全球化有几个定义"}, {"en": "proliferation of transactions across countries", "zh": "跨国交易激增"}, {"en": "increased international communications", "zh": "国际交流增加"}, {"en": "less self-sufficient in providing goods", "zh": "提供商品时自给自足程度降低"}, {"en": "companies with offices in multiple countries", "zh": "在多个国家设办公室的公司"}, {"en": "Europeans went to the Orient to find spices", "zh": "欧洲人去东方找香料"}, {"en": "a global split between consuming and producing", "zh": "消费与生产的全球分工"}, {"en": "organic solidarity", "zh": "有机团结"}]}, {"id": 4453, "name": "A mother’s loan", "phrases": ["43 years", "student loans", "the loans", "the rock slide", "one loan", "“ ” Fifteen years", "sheer horror", "monthly student loan payment", "car payment", "college degree"], "eng": "I'm 43 years old, and I owe tens of thousands of dollars in student loans. 43 Oh sure, I knew the loans were piling up as I went through school. But with one loan coming from here, another from there, I had no idea of the rock slide that was building. “ ” Fifteen years later, I still experience moments of sheer horror regarding my family’s financial situation. My monthly student loan payment is more than triple my car payment. OK, so without my college degree, I would not have been able to get my current job. For that I'm grateful but at what cost? My loans have been accruing at a rate of 10 percent, and now they have burgeoned to well. 10% I'm an English major; you do the math. I don't think they'll ever get paid off. We’re in debt way past our eyeballs, and there's no hope in sight. I'm being kept in class a financial class of graduates whose only hope for attending college meant borrowing money from the government. “ ” Because of our mounting credit card debt and monthly payments that far exceed our family’s income, my kids will also join the class of citizens who can’t rely on their parents for college support. Do I wish I'd chosen another educational route? You bet.", "ref": "The speaker shares her severe financial struggle caused by massive student loans. Although her college degree helps her secure a job, high interest rates make the debt unpayable, and monthly payments exceed her family income. Consequently, she deeply regrets her educational choice. Furthermore, this heavy financial burden forces her children to rely on government loans for their future college education.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693686/2ea949fda7234e748923c149349cddc7.mp3", "phrases2": [{"en": "43 years old and owes student loans", "zh": "43 岁还欠着学生贷款"}, {"en": "loans were piling up", "zh": "贷款不断累积"}, {"en": "monthly loan payment is triple my car payment", "zh": "月供是车贷的三倍"}, {"en": "without my degree, no current job", "zh": "没有学位就没有现在的工作"}, {"en": "loans accruing at 10 percent", "zh": "贷款以 10% 累积"}, {"en": "an English major", "zh": "英语专业"}, {"en": "my kids will also join the class", "zh": "我的孩子也会加入这个阶层"}, {"en": "can't rely on their parents for college", "zh": "无法依靠父母上大学"}]}, {"id": 4454, "name": "Governments use tricks", "phrases": ["the truism", "liberal western democracies", "government policy", "many areas", "the world", "“ ” Governments", "the unelected ones", "other events", "every trick", "the book"], "eng": "I suppose it's the truism to point out that citizens need to be well-informed. Maybe it's something we take for granted in our liberal western democracies. But there will be plenty of societies, well, that is run counter to explicit government policy. Many areas of the world still suffer from the reverie of the deliberate missing information. “ ” Governments, especially the unelected ones, but also some elected ones, have denied the events that have ever taken place. They pretend that other events did take place. They would help spin what they cannot deny. Ensure they've used every trick of the book, to pull the eyes of the world, and in an attempt to cover up their mistakes.", "ref": "The lecture highlights the fundamental importance of well-informed citizens and strongly criticizes governments that deliberately withhold information. Instead of providing the truth, these regimes use various deceptive tricks to cover up their mistakes. Specifically, they deny actual events, fabricate false ones, and spin undeniable facts. Ultimately, these strategies aim to mislead the public and distract the world from their wrongdoings.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693687/c66ab146085f49b2883c4c45fd647efc.mp3", "phrases2": [{"en": "citizens need to be well-informed", "zh": "公民需要充分知情"}, {"en": "liberal western democracies take it for granted", "zh": "西方民主国家视为理所当然"}, {"en": "the deliberate missing information", "zh": "故意缺失的信息"}, {"en": "governments, especially unelected ones", "zh": "政府，尤其是非民选的"}, {"en": "denied the events that took place", "zh": "否认发生过的事件"}, {"en": "pretend other events did take place", "zh": "假装其他事件发生过"}, {"en": "spin what they cannot deny", "zh": "粉饰无法否认的事"}, {"en": "every trick of the book", "zh": "用尽一切手段"}]}, {"id": 4456, "name": "Negative bias", "phrases": ["negative emotions", "negative expression", "the blood flow", "the blood", "a result", "a weapon", "the action", "the other hand", "the major center", "the brain"], "eng": "Next, let's look at a positive and negative emotions and positive and negative expression of these emotions. No one can see positive and negative. “ ” “ ” I mentioned earlier that there is a range of feelings that we there's a range of expressions that we feel ranging from anger, sadness, shame, frustration or depression, disgust, love, calm or happiness or sadness. So if I'm looking at these emotions, I can broadly categorize all of them in either being positive or negative. So let's take, for instance, anger and fear. So if I'm feeling angry, what happens is all the blood, the blood flow is increased towards my hands. As a result, it makes it easier for me to grasp a weapon or to make a strike. And that is a lot of adrenaline that is released, which increases energy necessary for the action. On the other hand, if I'm feeling happy, if I'm feeling calm. The major center is the brain for a lot of activity, and this inhibits negative emotions as feeling negative or negative emotions from entering our mind. So this is what happens. It has a lot to do with hormones. It has a lot to do with. This is a reason why they see that it was in an impulse. “ ” I happened to slap the person, but I didn't mean it. When I'm angry, I don't realize that I end up hitting the person. So this has a lot to do with your hormones. Once you have once you know what you're feeling, once you are aware, you have labeled your feelings really well. This is exactly what happens when there's blood flow rushing through your own hands. And then it makes it easier for you to make a strike, to grasp something or to defend yourself. This is exactly what happens when we're talking about positive and negative expression of our feelings. This is positive and negative. Next, we look at the healthy and the unhealthy ways of expressing ourselves.", "ref": "The passage explains that emotions can be categorized as positive or negative, and provides examples of the physical expressions associated with anger and happiness. It discusses how anger increases blood flow to the hands and releases adrenaline, while happiness and calmness inhibit negative emotions. It acknowledges the influence of hormones on our actions. The passage also mentions a forthcoming discussion on healthy and unhealthy expressions of emotions.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693054/db5a01603f974e3980613bebb950f1b1.mp3", "phrases2": [{"en": "positive and negative emotions", "zh": "积极和消极情绪"}, {"en": "a range of expressions", "zh": "一系列的表达"}, {"en": "anger, sadness, shame, frustration", "zh": "愤怒、悲伤、羞耻、沮丧"}, {"en": "categorize them as positive or negative", "zh": "分为积极或消极"}, {"en": "blood flow increased towards my hands", "zh": "血流向手部增加"}, {"en": "easier to grasp a weapon or make a strike", "zh": "更容易抓武器或出手"}, {"en": "adrenaline is released, increasing energy", "zh": "释放肾上腺素，增加能量"}, {"en": "happiness and calm inhibit negative emotions", "zh": "快乐平静抑制消极情绪"}]}, {"id": 4457, "name": "Los Angeles", "phrases": ["1781 Los Angeles", "los Angeles", "sixty-five years", "the discovery", "a fortune begin", "the rush", "the small town", "the Los Angeles River", "a recent two years", "a new water source"], "eng": "In 1781 Los Angeles is established and named Pablo de la Renta de Los Angeles by forty-four families from Mexico as a fort for soldiers. 1781 “ · · · ” More than sixty-five years later, the discovery of gold and silver medal draws settlers from across the country to northern California. After the rush for gold dies down, Americans had flocked to Northern California for a fortune begin to disperse and settle parts of Southern California. By 1870, the small town of Los Angeles has gained more than five thousand six hundred residents, which multiplies nearly 20 times by the turn of the century. 1870 20 The rapidly increasing population puts additional strain on the Los Angeles River, the city's main source of water, which has not been helped by a recent two years of drought. —— —— In order to avoid tragedy, a new water source has to be found. The city of Los Angeles is a development as an urban center and a growing thirst for water facilitated the triumph of the creation of the Los Angeles Aqueduct, but simultaneously led to the tragedies of St. Francis Dam and the draining of important landmarks like Mono Lake and Owen Zone. In the year 1900, the city of Los Angeles is growing faster than its water resources, a need for the city is as clear as the water they need. 1900 In 1902, Irish American civil engineer William Holland was named superintendent of the Los Angeles Water Department. 1902 · Soon after the department began considering options to quench the city of Los Angeles's growing thirst, they eventually settled on a lake.", "ref": "Since Los Angeles was established in 1781, the rapidly increasing population puts strain on the Los Angeles River. A new water source has to be found for the city&rsquo;s development as an urban center. The creation of the Los Angeles Aqueduct led to tragedies and draining of important landmarks. The Water Department eventually settled on Owens Lake as the perfect candidate to supply Los Angeles with water for expansion.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693055/72ca6701588d44ae88732b21f6a27a51.mp3", "phrases2": [{"en": "1781 Los Angeles established", "zh": "1781 年洛杉矶建立"}, {"en": "forty-four families from Mexico", "zh": "来自墨西哥的 44 个家庭"}, {"en": "the discovery of gold and silver", "zh": "金银矿的发现"}, {"en": "by 1870, over 5,600 residents", "zh": "到 1870 年超过 5600 居民"}, {"en": "the rapidly increasing population", "zh": "人口的快速增长"}, {"en": "strain on the Los Angeles River", "zh": "洛杉矶河的压力"}, {"en": "the Los Angeles Aqueduct", "zh": "洛杉矶输水渠"}, {"en": "the draining of Mono Lake", "zh": "莫诺湖的干涸"}]}, {"id": 4458, "name": "Neolithic stones", "phrases": ["a mathematician", "a museum", "the first examples", "5,000 years", "a practicing mathematician", "a symmetrical manner", "a connection", "the intriguing things", "divination —", "the future"], "eng": "I suppose you wouldn't expect perhaps to find a mathematician in a museum of historical objects, but actually, the objects that I've been drawn to in this museum have quite a lot of mathematical significance. These Neolithic stones, discovered in Scotland, dating back 5,000 years, are probably the first examples of humans exploring the concept of symmetry. And that's what I do as a practicing mathematician. I spend my life trying to understand what symmetries are possible, in nature and in mathematics and abstractly. And here I've got a connection, going back 5,000 years, to people who are already trying to understand–how can I arrange patches on the side of these stone balls in a symmetrical manner? —— One of the intriguing things about these stones is that we don't actually know what they're for. They might have been for divination—trying to predict the future. —— They might have been part of a game. They look very much like dice, but we don't really think there is any game associated with them. Maybe they were just for chucking around, they're very nice in the hand when you hold them. Or maybe they were symbols of power in the clan. I suppose that's why I like them because we don't really know what they are. —— If I had a theory about why they were doing this it would be that actually, they were starting to be mathematicians, and that here we see the first example of abstract thought at work. That these weren't for a purpose. Mathematics is a great subject, created a lot of the technology around us, but mathematicians we create our mathematical objects for the joy and the beauty, so it will be lovely to think that these didn't actually have a use, that they were just really a celebration of what's possible. “ ”", "ref": "Historical objects have quite a lot of mathematical significance. These Neolithic stones are probably the first examples of humans exploring the concept of symmetry. One of the intriguing things about these stones is that we don&#39;t actually know what they&#39;re for, and that&#39;s why the speaker likes them. Mathematics is a great subject, created the technology around us, but mathematicians create our mathematical objects for the joy and the beauty.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693056/3403a847be504bb4a643d219020342c7.mp3", "phrases2": [{"en": "Neolithic stones discovered in Scotland", "zh": "在苏格兰发现的新石器石头"}, {"en": "dating back 5,000 years", "zh": "可追溯到 5000 年前"}, {"en": "the first examples of exploring symmetry", "zh": "探索对称性的最早例子"}, {"en": "arranging patches symmetrically", "zh": "对称地排列斑块"}, {"en": "we don't know what they're for", "zh": "我们不知道它们的用途"}, {"en": "might have been for divination", "zh": "可能用于占卜"}, {"en": "symbols of power in the clan", "zh": "氏族权力的象征"}, {"en": "the first example of abstract thought", "zh": "抽象思维的最早例子"}]}, {"id": 4459, "name": "Poetry", "phrases": ["an important part", "the knowledge", "the literature", "the oldest form", "the origin", "epic poems", "the stories", "the English language", "a feeling", "poems use"], "eng": "Today, poetry means an important part of art and culture. We often talk about the knowledge about the literature in poems. Poetry is from the oldest form of literature, probably predates the origin of writing itself. The oldest written manuscripts we have are poems. Mostly epic poems tell the stories of ancient mythology. The English language in poems and poetry is difficult to understand, often giving readers a feeling of frustration, making it hard for readers to enjoy poetry. This is because poems use literary expressions. Poetry was once written according to fairly strict rules of meter and rhyme, and each culture has its own rule. Some poems incorporate rhyme schemes with two or more lines that end in like-sounding words. You should learn to simply enjoy it to know more about literature knowledge.", "ref": "Poetry is an important part of art and culture. Poetry is from the oldest form of literature. The English language in poems and poetry is difficult to understand, making it hard for readers to enjoy poetry, because poems use literary expressions. However, you should learn to simply enjoy it to know more about literature knowledge.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693057/3cdfec5af93147168d993979edc59b95.mp3", "phrases2": [{"en": "poetry is an important part of art", "zh": "诗歌是艺术的重要部分"}, {"en": "the oldest form of literature", "zh": "最古老的文学形式"}, {"en": "predates the origin of writing", "zh": "早于文字的起源"}, {"en": "the oldest written manuscripts are poems", "zh": "最古老的手稿是诗歌"}, {"en": "epic poems tell stories of mythology", "zh": "史诗讲述神话故事"}, {"en": "the English language in poems is difficult", "zh": "诗歌中的英语很难"}, {"en": "strict rules of meter and rhyme", "zh": "严格的格律和押韵规则"}, {"en": "rhyme schemes with like-sounding words", "zh": "押韵方案"}]}, {"id": 4460, "name": "The internet requires energy", "phrases": ["the other bits", "the Internet", "cell phone towers", "massive data centers", "— — Today", "billion things", "every credit card reader", "every cell phone", "a single phone", "a laptop"], "eng": "The Internet is pretty great, this wouldn't be a thing without it, but getting this video and all the other bits of the Internet to you uses a lot of energy. What we call the Internet is made up of a lot of things, wires traversing the ocean, satellites and cell phone towers, massive data centers sending packets of information all over, and devices — so many devices! —— Today, there are more than 30 billion things connected to the Internet. 300 That's every cell phone, laptop, and tablet, but also every credit card reader, creepy, all-hearing speaker, newfangled fridge with a TV on the front end, and more things coming online every day. Every single one of these devices requires electricity. Charging a single phone or a laptop doesn't use that much energy, but powering billions of Internet-connected devices adds up. It's hard to estimate exactly how much because things are changing too fast, even count. But in total, Internet-connected devices probably use in the neighborhood of five percent of the world's electricity. Once you've got your Internet portal charged and ready to go, streaming a video or posting a pic on Instagram, draws on power from data centers distributed around the world. Instagram After devices, data centers are the Internet's next biggest energy hog, using around one or two percent of the world's total electricity. 1% 2% And most of this electricity comes from burning fossil fuels, which release greenhouse gases into the atmosphere. But when compared to all the other things that produce greenhouse gases like transportation, which causes almost a quarter of global emissions, the unit is doing all right. —— —— In total, it contributes only around two percent of global emissions. 2%", "ref": "This lecture mainly talks about the Internet. The Internet comprises devices, data centers, and communication lines. It consumes about five percent of global electricity, with data centers using one or two percent. Most of the electricity comes from burning fossil fuels, resulting in greenhouse gas emissions. Compared to other sectors, the Internet&#39;s contribution to global emissions is around two percent.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693058/6f123563eaa84765bca0c39220f16fa8.mp3", "phrases2": [{"en": "the Internet uses a lot of energy", "zh": "互联网耗电很多"}, {"en": "wires traversing the ocean", "zh": "横跨海洋的电缆"}, {"en": "satellites and cell phone towers", "zh": "卫星和手机基站"}, {"en": "massive data centers", "zh": "大型数据中心"}, {"en": "more than 30 billion things connected", "zh": "超过 300 亿台设备联网"}, {"en": "devices use five percent of world's electricity", "zh": "设备用掉全球 5% 的电"}, {"en": "data centers use one or two percent", "zh": "数据中心用 1 到 2%"}, {"en": "the internet contributes two percent of emissions", "zh": "互联网产生 2% 的排放"}]}, {"id": 4461, "name": "Andrew Carnegie", "phrases": ["andrew Carnegie", "a fabric mill", "telegraph office", "the railroad system", "an oil company", "the money", "investment return", "american steel", "a huge steel factory", "million dollars"], "eng": "Andrew Carnegie was born in Scotland in 1835. · 1835 His family moved to America when he was 13 and settled in Pittsburgh. 13 He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. He was known to make improvements to any job he held. While working for the telegraph office, he began studying the railroad system, and he soon became the superintendent. He took the money he had saved and invested in an oil company. His investment return was good and then he went to England to learn how to make steel. He wanted to make steel that was cheaper and more durable than American steel. He came back with his knowledge and built a huge steel factory. Carnegie's factory was very successful and he sold it for 480 million dollars. 4.8 Carnegie was a very wealthy man but he was more interested in philanthropy than spending his money on himself. He spent the rest of his life giving his money away to worthy causes. Reading and learning were very important to him, so he built many libraries. He also established universities and research institutes. Carnegie built hospitals, museums, and theaters. One of the most recognizable buildings he built was Carnegie Hall in New York City. Carnegie Hall hosts many concerts and symphonies each year and is an important part of New York City culture. Andrew Carnegie passed away at the age of 83. · 83 In his lifetime he gave away 90% of his fortune. 90% He is known as a man who was selfless and wanted to do good for others.", "ref": "Scotland-born Andrew Carnegie and his family moved to America when he was 13. He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. Later he built the most successful steel factory and made great fortunes in the steel company, but he gave 90 percent of money away to worthy causes.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693059/428cef8ba0674fa784fee768a4dc47a1.mp3", "phrases2": [{"en": "born in Scotland in 1835", "zh": "1835 年生于苏格兰"}, {"en": "family moved to America at 13", "zh": "13 岁移居美国"}, {"en": "worked in a fabric mill and telegraph office", "zh": "在纺织厂和电报局工作"}, {"en": "became superintendent of the railroad", "zh": "成为铁路主管"}, {"en": "went to England to learn how to make steel", "zh": "去英国学炼钢"}, {"en": "sold his factory for 480 million dollars", "zh": "以 4.8 亿美元卖掉工厂"}, {"en": "more interested in philanthropy", "zh": "更热衷于慈善"}, {"en": "gave away 90% of his fortune", "zh": "捐出 90% 的财产"}]}, {"id": 4462, "name": "Free sugars", "phrases": ["milk contain sugar", "both fruits", "many people", "ice cream etc", "unhealthy sugar", "excess sugar", "free sugars", "natural parts", "food companies", "a healthy approach"], "eng": "Both fruits and milk contain sugar, and this sugar is healthy sugar. Many people have heard that sugar is bad, and think that this must also therefore apply to fruits. Unhealthy sugar is normally found in desserts, ice cream etc. It's much easier to consume excess sugar from foods and drinks that contain \"free sugars\". “ ” Free sugars include these same sugars, but in this case they have been removed from their naturally occurring source, rather than being eaten as natural parts of fruits, dairy products, and some vegetables and grains. This includes sugar that is added to food and drinks by food companies, cooks or consumers. Many people drink juices, and this is a healthy approach. But directly eating fruits is better, because the human body can process it easily. It is better to eat a small piece of fruit, which our bodies can digest better rather than drink smoothies or more than half a cup of fruit juice because it is the same as drinking soft drinks.", "ref": "Both fruits and milk contain sugar, and this sugar is a healthy sugar. Unhealthy sugar is normally found in desserts and ice cream. It&#39;s much easier to consume excess sugar from foods and drinks that contain &quot;free sugars&quot;. Free sugars in this case have been removed from their naturally occurring source. In addition, directly eating fruits is better because the human body can process them easily.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693060/1301c3b555204c7e8abeb2c5c62cb4a6.mp3", "phrases2": [{"en": "fruits and milk contain healthy sugar", "zh": "水果和牛奶含健康的糖"}, {"en": "unhealthy sugar in desserts and ice cream", "zh": "甜点和冰淇淋中的不健康糖"}, {"en": "excess sugar from free sugars", "zh": "游离糖带来的过量糖分"}, {"en": "removed from their natural source", "zh": "从天然来源中分离出来"}, {"en": "sugar added by food companies", "zh": "食品公司添加的糖"}, {"en": "drinking juices vs eating fruits", "zh": "喝果汁与吃水果"}, {"en": "the body can process fruit easily", "zh": "身体能轻松处理水果"}, {"en": "smoothies are like soft drinks", "zh": "冰沙等同于软饮料"}]}, {"id": 4463, "name": "Boys and girls", "phrases": ["a higher level", "the same class", "male students", "the developments", "the content analysis results", "female students", "the passive social role", "the general social structure", "the fact", "previous studies"], "eng": "The research shows that girls have a higher level of English results than boys in the same class, because boys and girls are different in learning styles, and their brain functions are different in mechanisms. Male students were detected to be significantly more aware of the developments in the field of physics than female students. According to the content analysis results concerning this finding, unlike female students male students were more interested in technological developments. This finding is not surprising when the passive social role of females and the general social structure in which they tend to more sociable fields are considered. This finding may have occurred due to the fact that males are generally more interested in technology than females. Previous studies support this finding. Boys are more simplified, and teachers' teaching style normally suits girls better than boys. Teachers should find different teaching approaches respectively for boys and girls.", "ref": "Research shows that girls tend to outperform boys in English results due to differences in learning styles and brain mechanisms. Boys demonstrate a greater awareness of developments in physics and technology, whereas girls tend to be more interested in sociable fields. This finding suggests the need for teachers to adopt different teaching approaches for boys and girls to enhance their learning experiences.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693061/18deb212f44a4680b6c42a0a77b1e05a.mp3", "phrases2": [{"en": "girls have higher English results", "zh": "女生英语成绩更高"}, {"en": "different learning styles", "zh": "不同的学习风格"}, {"en": "brain functions differ in mechanisms", "zh": "大脑功能机制不同"}, {"en": "males more aware of physics developments", "zh": "男生更关注物理发展"}, {"en": "males more interested in technology", "zh": "男生对技术更感兴趣"}, {"en": "the passive social role of females", "zh": "女性的被动社会角色"}, {"en": "teachers' style suits girls better", "zh": "老师风格更适合女生"}, {"en": "different teaching approaches", "zh": "不同的教学方法"}]}, {"id": 4464, "name": "Hook sentence", "phrases": ["an essay", "a chance", "a writer", "many materials", "worth attention", "the first couple", "the introduction", "the reader", "— — Build", "an emotional connection"], "eng": "An essay is a chance to identify your read and learned. As a writer, you first need to collect many materials, then write an essay in four or five paragraphs, structures and quotes. If someone is searching for a book or article to read, he or she will decide from the very beginning whether this work is worth attention. If you want to wow your teacher, polish the introduction, especially the first couple of sentences. Add an essay hook — something interesting, funny, shocking, or intriguing to win the reader's attention. —— Build an emotional connection with your reader right from the start. A hook in the essay is a catchy sentence or paragraph in the impressive introduction which serves as an attention element and an important part. “ ” An excellent hook sentence is engaging and interesting; it is a perfect method to start an argumentative or persuasive essay. The hook for your essay often appears in the first sentence. The opening paragraph includes a thesis sentence. Some popular hook choices can include using an interesting quote, a little-known fact, famous last words, or a statistic.", "ref": "An essay is a chance to identify your read and learned. If you want to wow your teacher and attract readers&rsquo; attention, polish the introduction by adding an essay hook. A hook is a catchy sentence or paragraph in the introduction, which is engaging and interesting. Some popular hook choices include using an interesting quote or a statistic.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693062/3e1641c96107478eabd7d410b519ad6f.mp3", "phrases2": [{"en": "an essay is a chance to show what you learned", "zh": "作文是展示所学"}, {"en": "write in four or five paragraphs", "zh": "写四到五段"}, {"en": "polish the introduction", "zh": "打磨引言"}, {"en": "add an essay hook", "zh": "加一个钩子句"}, {"en": "interesting, funny, shocking or intriguing", "zh": "有趣、好笑、震撼或引人入胜"}, {"en": "build an emotional connection with the reader", "zh": "与读者建立情感联系"}, {"en": "an attention element", "zh": "吸引注意的元素"}, {"en": "using a quote or statistic", "zh": "用引语或数据"}]}, {"id": 4465, "name": "Paper rejection", "phrases": ["a disappointing experience", "some advice", "young researchers", "a troubling issue", "many things", "the chance", "the beginning", "a better result", "the career path", "another journal"], "eng": "Rejection happens to all of us, and it can be a disappointing experience. I will now give some advice for young researchers. Many things have changed today, which can be a troubling issue. The chance of getting a paper published is becoming smaller and smaller. Although it never is easy to take, rejection is particularly hard at the beginning of your career. But rejections will lead to a better result and will be good for the career path. Use this feedback to improve your paper for submission to another journal as well as your next, more robust study of the topic. Usually, several individuals with expertise in the topic have donated substantial time to provide detailed advice to advance your paper and future work. Also, remember that publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time.", "ref": "Rejection can be a disappointing experience. The chance of getting a paper published is becoming smaller and smaller, but rejections will lead to better results and will be good for the career path. Use this feedback to improve your paper for submission to another journal. Also, publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693063/ae72bdecb2c448bca190034b63971eda.mp3", "phrases2": [{"en": "rejection happens to all of us", "zh": "拒稿人人都会遇到"}, {"en": "advice for young researchers", "zh": "给年轻研究者的建议"}, {"en": "the chance of being published is smaller", "zh": "发表机会变小"}, {"en": "rejection is hard at the beginning of your career", "zh": "生涯初期拒稿很难"}, {"en": "rejections lead to a better result", "zh": "拒稿带来更好的结果"}, {"en": "use feedback to improve your paper", "zh": "用反馈改进论文"}, {"en": "submit to another journal", "zh": "投稿到另一个期刊"}, {"en": "publication does not mean funding", "zh": "发表不等于获得资助"}]}, {"id": 4466, "name": "The stability of mood", "phrases": ["a unique trait", "emotional stability", "a roller coaster ride", "some individuals", "a certain level", "happiness lies", "a delicate balance", "the natural ebb", "the optimal emotional state", "a moderate level"], "eng": "Emotional stability is a unique trait that differs from person to person. For some individuals, their moods fluctuate dramatically, resembling a roller coaster ride, while others present a consistently composed and relaxed demeanor. Studies have suggested that the key to achieving happiness lies in maintaining a certain level of emotional containment. It is a delicate balance between maintaining a sense of control while also allowing for the natural ebb and flow of emotions. The optimal emotional state appears to be characterized by a point of equilibrium, wherein there is a moderate level of emotional containment and resilience. Essentially, the secret to emotional well-being involves finding this balance. It means navigating between intense and loose emotions, striving for a state of gentle containment coupled with a poised resilience. This harmonious emotional state ultimately grants an individual a sense of contentment and well-being. Therefore, understanding and achieving this delicate equilibrium is essential for emotional health and happiness.", "ref": "Emotional stability varies between individuals. Research indicates that the key to happinessis maintaining a delicate balance of emotional containment and resilience, allowing for a natural ebb and flow of emotions. Finding this equilibrium is essential for emotional well-being and health, ultimately granting individuals a sense of contentment, and happiness.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693064/27ea476b5d51424ba6f5f1fe72bafdcf.mp3", "phrases2": [{"en": "emotional stability differs from person to person", "zh": "情绪稳定性因人而异"}, {"en": "moods fluctuate like a roller coaster", "zh": "情绪像过山车一样波动"}, {"en": "a composed and relaxed demeanor", "zh": "沉着放松的举止"}, {"en": "the key to happiness is emotional containment", "zh": "幸福的关键是情绪克制"}, {"en": "a delicate balance", "zh": "微妙的平衡"}, {"en": "a point of equilibrium", "zh": "一个平衡点"}, {"en": "a state of gentle containment", "zh": "温和克制的状态"}, {"en": "a sense of contentment and well-being", "zh": "满足和幸福的感觉"}]}, {"id": 4467, "name": "A good engineer", "phrases": ["a complicated system", "the engineering course", "the answers", "personal life experience", "daily life", "the common everyday life", "the tiny things", "microsoft systems", "the system", "the new outcomes"], "eng": "Today, this course you are going to take is about what engineering is and how to work with a complicated system. “ ” “ ” You guys should know the answers, because all of you guys are from the engineering course. Especially, when you design, build, debug and develop something new, during these process, you are working with the complicated system. How to program complicated systems and how would you know it actually works before producing it. Inspirations are from your daily life, you probably need to consider your personal life experience. And from the common everyday life to the tiny things that you cannot see virtually, and the inspirations normally exist in the tiny levels. A complicated system such as your laptops running Microsoft systems. That means the system is not able to see, which means you guys have to virtualize it. Engineering is here to help virtualize by using systems. Nowadays, the complicated systems are relatively reliable, and you guys work upon these and need to deliver the new outcomes which are reliable as well. This is what we do now and we are good at. Engineering is to help virtualize by using systems. In order to develop and produce a reliable system, you need to consider more on the risks, potential, predictability and accuracy.", "ref": "Engineers should know how to work with a complicated system, and sometimes, the inspirations are from their personal life experience. A complicated system cannot see, so engineering is to help virtualize it by using systems. As complicated systems are becoming reliable, engineers should deliver reliable outcomes as well. To develop a reliable system, engineers need to consider the risks, potential, predictability and accuracy.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693065/28e1c1f7fe244e7ea3561558d7a2b50c.mp3", "phrases2": [{"en": "what engineering is", "zh": "工程是什么"}, {"en": "work with a complicated system", "zh": "处理复杂系统"}, {"en": "design, build, debug and develop", "zh": "设计、构建、调试和开发"}, {"en": "inspirations from daily life", "zh": "灵感来自日常生活"}, {"en": "a complicated system like laptops", "zh": "像笔记本这样的复杂系统"}, {"en": "virtualize it", "zh": "将它虚拟化"}, {"en": "the complicated systems are relatively reliable", "zh": "复杂系统相对可靠"}, {"en": "risks, predictability and accuracy", "zh": "风险、可预测性和准确性"}]}, {"id": 4468, "name": "Luxury brand", "phrases": ["the question today", "a luxury brand", "the standard business response", "high price", "small amounts", "the standard output", "the reality", "the only way", "one color television", "two televisions"], "eng": "The question today is, what makes a luxury brand a luxury brand and how do we distinguish it is very hard to answer. “ ” “ ” The standard business response is to say, 'they are more exclusive'. “ ” And we get exclusivity by having high price and relatively small amounts of the product available. The reality, however, of luxury brands is that they are sold in their millions, and in some cases, are not priced that much higher than the standard output. The only way I can really answer your question is to say, it is all relative. As you said in your introduction, it wasn’t that long ago in Australia that we would have considered two televisions to be a luxury, or even further back, one color television. And you can make a strong argument, for example, that Starbucks in China, right now, is a luxury purchase – because of its cost, because of how frequently it is purchased by many people. —— So, I think the long answer is a complicated one, but the answer is, it depends who you talk to. I think in the business community what we would say, is that there is a small cluster of 'more expensive brands' which have a distinct strategy that we would identify as being 'luxury brands' and they start with the Rolls Royces and the Tiffanys and the Louis Vuittons of the world. “ ” “ ” And, I think that tends to be how we see them.", "ref": "How a luxury brand forms is hard to explain. For standard business, a luxury brand is about the exclusivity through high prices and low stock. However, some luxury brands are characterized by huge quantity in sales and low prices. The speaker thinks both cases are relative. Therefore, the reason to explain the formation of a luxury brand is complicated. In business community, it refers to the more expensive brands.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693066/561a9a9de48a40a3ac25945f303d10ec.mp3", "phrases2": [{"en": "what makes a luxury brand", "zh": "什么造就奢侈品牌"}, {"en": "the standard business response", "zh": "标准的商业回答"}, {"en": "they are more exclusive", "zh": "它们更排他"}, {"en": "exclusivity by high price", "zh": "通过高价实现排他"}, {"en": "sold in their millions", "zh": "以百万计的销量"}, {"en": "it is all relative", "zh": "都是相对的"}, {"en": "Starbucks in China is a luxury purchase", "zh": "星巴克在中国是奢侈消费"}, {"en": "a small cluster of more expensive brands", "zh": "一小群更贵的品牌"}]}, {"id": 4469, "name": "Curator", "phrases": ["the National Museum", "extension history courses", "a curator", "the kinds", "particular kind", "the kind", "an uncontested view", "material culture", "other people", "other historians"], "eng": "I am going to talk today mostly about what I do as a curator here at the National Museum of Australia but I want to draw some generalities from that in terms of a series of curatorial practices, tools, techniques and methods that I think could be of interest to your students and to you in developing extension history courses. I want to talk about what I do as a curator and then from that also talk a bit about the kinds of history that I think museums are particularly good at creating and communicating. I think this is something I would really like to discuss because it is not necessarily very well understood is that I think museums, as Dave insisted by putting up my quote in his slide, create a very particular kind of history. Dave It’s not the kind of history that gets created in books or in dating films or in compositions, it’s a very particular kind of history that grows out
