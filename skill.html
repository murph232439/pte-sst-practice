<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f4f6f9;color:#1f2430;font-size:15px;line-height:1.6}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e7ee;padding:11px 16px 9px;z-index:10}

main{padding:14px 16px 60px;max-width:840px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(20,30,50,.06);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}

.errbad{font-size:15px;line-height:1.8;background:#fff8f8;border-left:3px solid #e35d5d;padding:12px 14px;border-radius:6px;margin-bottom:12px}

.angle span{font-size:12.5px;background:#eef3fb;color:#2456a6;border-radius:12px;padding:3px 11px}

<script>
var D={"cards": {"sst": [{"id": 2122, "name": "Transportation network in Paris", "phrases": ["most cities", "a great way", "the city", "the Eiffel Tower", "a good hour", "great public transport links", "the subway system", "the metro", "big underground network", "RER Tickets"], "eng": "As with most cities, we recommend getting about on foot. Besides being eco-friendly, it's a great way to get a feel for the city. Just bear in mind that Paris is big, like really big. A walk from the Eiffel Tower to Notre Dame would take a good hour. Fortunately, if you're strapped for time, there are great public transport links. The subway system is split into the metro and RER lines. RER Tickets will work across both, so you can treat it as one big underground network. In our experience, it served a purpose, which was to get us around quickly. It's just not the cleanest. The Metro has 16 lines, each with a different color. 16 The five RER lines are labeled with the letters A B C D E. 5 RER A B C D E RER and metro trains run every day from 6:00 a.m. until half past midnight. RER 6 As for tickets, a single journey is 1.90 euro. 1.90 We bought a book of 10 for 14.50 euro. 10 14.50 Now there are weekly or monthly passes available. But in my opinion, they're just a farce. We need a passport photo and everything else.", "ref": "Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m. to half past midnight. Tickets for a single journey are 1. 90 euros, or you can purchase a book of 10 tickets for 14. 50 euros. Weekly or monthly passes are offered but require a passport photo.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678215/dab162e55f594de7b18dc6000cd83ebb.mp3", "phrases2": [{"en": "getting about on foot", "zh": "步行出行"}, {"en": "a walk from the Eiffel Tower to Notre Dame", "zh": "从埃菲尔铁塔走到圣母院"}, {"en": "great public transport links", "zh": "便捷的公共交通"}, {"en": "split into the metro and RER lines", "zh": "分为 metro 和 RER 两条线"}, {"en": "tickets work across both", "zh": "车票两者通用"}, {"en": "the Metro has 16 lines", "zh": "地铁有 16 条线"}, {"en": "run from 6:00 a.m. to half past midnight", "zh": "早上 6 点运营到午夜"}, {"en": "a single journey is 1.90 euro", "zh": "单程票价 1.90 欧"}]}, {"id": 2123, "name": "Children directors", "phrases": ["social skills", "an individual", "an individual needs", "social interactions", "an understanding", "social difficulties", "particular risks", "young people", "strong relationships", "a high school"], "eng": "Social skills are vital in enabling an individual to have and maintain positive interactions with others. Many of these skills are crucial in making and sustaining friendships. Social interactions do not always run smoothly and an individual needs to be able to implement appropriate strategies, such as conflict resolution when difficulties in interactions arise. It is also important for individuals to have 'empathy' as it allows them to respond in an understanding and caring way to how others are feeling. Children are facing social difficulties with particular risks. Young people who do not have strong relationships with the adults in their family are even more at risk. In an experiment in a high school, which lasted for 8 to 12 weeks, the students were told to be a movie director and to choose their own story structure. 8 12 The students worked with each other, which involved lots of different skills, and social interactivity. The movies they had made were actually cool. Then, the researchers tested the intervention effect, finding this can improve their self-regulation, and they found this can improve their self-regulation and critical thinking skills.", "ref": "Children are facing social difficulties with particular risks. In an experiment in a high school, the students were told to be a movie director and to choose their story structure. The students worked with each other, which involved lots of different skills. The movies they had made were actually cool. Then, the researchers tested the intervention effect, and they found this can improve their self-regulation and critical thinking skills.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678653/496d77f31adf4eb9ac1de87a37790035.mp3", "phrases2": [{"en": "social skills are vital", "zh": "社交技能很重要"}, {"en": "maintaining positive interactions", "zh": "维持积极的互动"}, {"en": "making and sustaining friendships", "zh": "建立并维持友谊"}, {"en": "conflict resolution", "zh": "冲突解决"}, {"en": "empathy", "zh": "同理心"}, {"en": "an experiment in a high school lasting 8 to 12 weeks", "zh": "高中里持续 8 到 12 周的实验"}, {"en": "choose their own story structure", "zh": "自己选择故事结构"}, {"en": "improve self-regulation and critical thinking", "zh": "提升自我调节和批判性思维"}]}, {"id": 2124, "name": "Bees waggle dance", "phrases": ["a unique way", "the waggle dance", "a good source", "a warning signal", "a headbutt", "a feeding station", "a source", "potential dangers", "the station", "the dancing bees"], "eng": "Honeybees have a unique way of communicating with each other—the waggle dance. —— When a bee finds a good source of nectar, it will perform a waggle dance to inform other bees about it. However, this dance can be interrupted by a headbutt from another bee, which researchers have discovered is actually a warning signal. To study this behavior, scientists set up a feeding station in the lab to mimic a source of nectar. They then introduced foraging bees to potential dangers at the station, such as competition from rival colonies. When the foragers returned to the hive, they were observed stopping the dancing bees. This led the researchers to believe that the headbutt serves as a warning to the dancers about the dangerous source of nectar. The lecture also mentioned that bees can use their dance and sounds to describe different flowers and the environment. This study sheds light on the complex communication system of honeybees and the way they work together to ensure the safety of the colony and the success of their foraging efforts.", "ref": "Honeybees communicate using a waggle dance to share nectar sources. Researchers found that the dance can be interrupted by a headbutt, which serves as a warning. Scientists mimicked a nectar source in a lab and observed foraging bees returning to the hive to stop dancing bees when potential dangers were present. This behavior study sheds light on the intricate communication system and collaborative efforts of honeybees.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678216/884ce7b0e60b48f8b9e21953869a972c.mp3", "phrases2": [{"en": "the waggle dance", "zh": "摇摆舞"}, {"en": "a good source of nectar", "zh": "好的花蜜来源"}, {"en": "inform other bees", "zh": "通知其他蜜蜂"}, {"en": "interrupted by a headbutt", "zh": "被头撞打断"}, {"en": "a warning signal", "zh": "一个警告信号"}, {"en": "set up a feeding station", "zh": "设置喂食站"}, {"en": "competition from rival colonies", "zh": "来自竞争蜂群的竞争"}, {"en": "the complex communication system", "zh": "复杂的交流系统"}]}, {"id": 2125, "name": "Cosmology and maths", "phrases": ["the intricate relationship", "the speaker", "the lecturer", "a career", "the power", "the mysteries", "a fascinating realization", "an omnipresent force", "the universe", "a complex web"], "eng": "The speaker is discussing the intricate relationship between mathematics and cosmology. Back in the 1970s, the lecturer pursued a career in physics while actively engaging in the field of cosmology. 20 70 Throughout this period, scientists passionately sought to harness the power of mathematics as a means to unravel the mysteries of the universe. According to the speaker, this quest for mathematical understanding led them to a fascinating realization: mathematics is an omnipresent force in the natural world. In the speaker's perspective, mathematics is not just a tool used by scientists to explain the universe; rather, it is an inherent and fundamental aspect of nature itself. Nature, cosmology, and mathematics are all interconnected, forming a complex web of relationships that shape our understanding of the cosmos. As the speaker delves into the heart of their argument, they emphasize that mathematics can be found virtually everywhere in nature. From the graceful spiral of a seashell to the precise orbits of celestial bodies, mathematical patterns and principles underpin the very fabric of our world. These mathematical foundations allow us to comprehend and interpret the workings of the universe, making it an indispensable language for cosmologists. In conclusion, the speaker asserts that mathematics is the underlying system that enables us to explain the universe and nature. It is not merely a tool but a fundamental aspect of the cosmos itself. This profound connection between mathematics, nature, and cosmology has guided scientists in their pursuit of knowledge and continues to shape our understanding of the universe's grand design.", "ref": "In this lecture, the speaker explores the profound connection between mathematics and cosmology, arguing that mathematics is an inherent part of nature itself, not just a tool for explanation. They emphasize the omnipresence of mathematical patterns in the natural world, linking them to the workings of the universe. The speaker concludes that mathematics is a fundamental aspect of the cosmos, shaping our understanding and enabling us to interpret the universe.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678217/2e0843e5401d4966b5e07fb41a80158c.mp3", "phrases2": [{"en": "the relationship between mathematics and cosmology", "zh": "数学与宇宙学的关系"}, {"en": "pursued a career in physics", "zh": "从事物理学研究"}, {"en": "harness the power of mathematics", "zh": "利用数学的力量"}, {"en": "unravel the mysteries of the universe", "zh": "解开宇宙的奥秘"}, {"en": "mathematics is omnipresent in nature", "zh": "数学在自然界无处不在"}, {"en": "the spiral of a seashell", "zh": "海螺的螺旋"}, {"en": "the precise orbits of celestial bodies", "zh": "天体的精确轨道"}, {"en": "mathematics is the underlying system", "zh": "数学是底层系统"}]}, {"id": 2126, "name": "Singapore", "phrases": ["unique relationship", "the successful blend", "powerful island nation", "a University", "chicago professor", "potential future city models", "the forefront", "various academic perspectives", "a well-rounded discussion", "the complex dynamics"], "eng": "In today's lecture, I explored Singapore's unique relationship with globalization. We started by examining its diverse population and the successful blend of cultures thriving within this small yet powerful island nation. I also referenced insights from a University of Chicago professor who has studied Singapore's economic strategies extensively. Later, we delved into potential future city models and how they might manifest in places like Singapore, which continues to be at the forefront of urban development and planning. The lecture concluded by citing various academic perspectives to offer a well-rounded discussion; names of notable professors were mentioned to credit their contributions to our understanding of globalization and its impact on Singapore. As we scrutinize the examples set by Singapore, it becomes clear that this nation exemplifies the complex dynamics of globalization, standing as a beacon of multiculturalism and forward-thinking urban planning.", "ref": "In the lecture, we analyzed Singapore&rsquo;s dynamic approach to globalization, noting its multicultural population and economic prowess. Citing a University of Chicago professor&rsquo;s work, we discussed Singapore&rsquo;s global strategy before exploring its pioneering role in future urban development. By highlighting academic opinions, the talk concluded that Singapore is a model of multiculturalism and innovative urban planning within the global context.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678647/b6e3f591e0124fe2a33d11ca619fb5fa.mp3", "phrases2": [{"en": "Singapore's unique relationship with globalization", "zh": "新加坡与全球化的独特关系"}, {"en": "its diverse population", "zh": "它多元的人口"}, {"en": "the successful blend of cultures", "zh": "文化的成功融合"}, {"en": "a University of Chicago professor", "zh": "芝加哥大学教授"}, {"en": "Singapore's economic strategies", "zh": "新加坡的经济策略"}, {"en": "potential future city models", "zh": "未来城市模型"}, {"en": "at the forefront of urban development", "zh": "处于城市发展的前沿"}, {"en": "a beacon of multiculturalism", "zh": "多元文化的典范"}]}, {"id": 2127, "name": "International trading system", "phrases": ["the international trading system", "the World Trade Organization", "increased international trade", "the keystone", "foreign trade", "the ramifications", "every facet", "a broader range", "a result", "unprecedented consumer benefits"], "eng": "In our exploration of the international trading system, we acknowledge the significant changes since the inception of the World Trade Organization (WTO). WTO As countries opened up, an era of increased international trade commenced. Globalization has been the keystone, prompting nations to welcome foreign trade by opening their ports, fostering a globally connected economy. The ramifications of this shift touch every facet of commerce. As a result, consumers around the world now enjoy a broader range of products, competitive pricing, and improved quality. This trend has ushered in an era of unprecedented consumer benefits and widespread economic growth. To conclude from my perspective, the decision to engage in open trade has been immensely positive. Trading across borders should not just be seen as a strategic economic move, but as a force that enriches societies by exposing them to new ideas, technologies, and opportunities for development. It's a conviction of mine that trade openness is indeed a boon to global prosperity.", "ref": "The international trading system has evolved significantly since the WTO&#39;s establishment, with globalization driving open trade policies and expanded commerce. Countries opening ports enabled consumers worldwide to access diverse, high-quality products at competitive prices. This interconnected system fosters economic growth by facilitating cross-border exchange of ideas, technologies, and opportunities for development. The speaker believes that open trade is a boon to global prosperity.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678648/c48c1a5d574643fcbdda540cb0b32080.mp3", "phrases2": [{"en": "the international trading system", "zh": "国际贸易体系"}, {"en": "changes since the World Trade Organization", "zh": "自世贸组织以来的变化"}, {"en": "an era of increased international trade", "zh": "国际贸易增长的时代"}, {"en": "globalization as the keystone", "zh": "全球化是基石"}, {"en": "opening their ports", "zh": "开放港口"}, {"en": "a broader range of products and competitive pricing", "zh": "更广的产品范围和竞争价格"}, {"en": "unprecedented consumer benefits", "zh": "前所未有的消费者利益"}, {"en": "a boon to global prosperity", "zh": "促进全球繁荣"}]}, {"id": 2128, "name": "Sound of words", "phrases": ["the lecture", "the importance", "a crucial role", "the speaker", "the broad capacity", "high school graduates", "the mention", "phone numbers", "the profound influence"], "eng": "The lecture emphasizes the importance of words and the impact of their sound. According to the speaker, the sound of words plays a crucial role in cognitive processes, aiding in the representation of the world and self-perception. Furthermore, the lecture highlights the broad capacity of words to express a multitude of concepts, underscoring their significance in communication and cognitive development. The speaker also uses the example of high school graduates to illustrate the importance of words in conveying complex ideas and information. Additionally, the mention of phone numbers suggests that words and their sounds are integral to memory and recall processes. Overall, the lecture underscores the profound influence of words and their sound on cognitive functions and communication, informing how individuals perceive and interact with the world.", "ref": "The lecture explains the significance of words and their sound. It discusses how the sound of words is crucial for cognitive processes, representing the world and self-perception. It also emphasizes the broad capacity of words to express concepts, using high school graduates as an example. The mention of phone numbers suggests words are vital for memory. Overall, it underscores the influence of words and sound on cognitive functions and communication", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678649/f9cd6cf04e2f4bb0b551299463faa250.mp3", "phrases2": [{"en": "the importance of words and their sound", "zh": "词汇及其发音的重要性"}, {"en": "the sound of words in cognitive processes", "zh": "发音在认知过程中的作用"}, {"en": "the representation of the world", "zh": "对世界的表征"}, {"en": "self-perception", "zh": "自我认知"}, {"en": "express a multitude of concepts", "zh": "表达大量概念"}, {"en": "the example of high school graduates", "zh": "高中毕业生的例子"}, {"en": "integral to memory and recall", "zh": "对记忆和回忆很重要"}, {"en": "the profound influence on cognitive functions", "zh": "对认知功能的深远影响"}]}, {"id": 2129, "name": "Multiculturalism & cultural diversity", "phrases": ["an important aspect", "the diverse", "the idea", "the differences", "dominant culture", "multiculturalism encourages", "cultural diversity", "harmonious society", "a melting pot", "“ ” Embracing multiculturalism"], "eng": "Multiculturalism is an important aspect of our society, as it encourages us to embrace and appreciate the diverse cultures that make up our world. This concept promotes the idea that we should not only tolerate, but also celebrate and learn from the differences in our society. Rather than expecting everyone to conform to one dominant culture, multiculturalism encourages respect for individual traditions and beliefs. By recognizing and valuing cultural diversity, we can create a more inclusive and harmonious society. This is in contrast to the idea of a melting pot, where diversity is expected to disappear as everyone assimilates into one homogeneous culture. “ ” Embracing multiculturalism allows us to broaden our understanding of the world and fosters a sense of unity and acceptance amongst different groups. Ultimately, it is through respecting and celebrating our differences that we can create a more vibrant and enriching society for all.", "ref": "Multiculturalism promotes acceptance of diverse cultures, fostering inclusivity and harmony by celebrating differences rather than enforcing assimilation. It contrasts with the &quot;melting pot&quot; model, preserving cultural identities to enrich societal coexistence. By embracing multiculturalism, societies can broaden understanding of the world and fosters a sense of unity and acceptance. In this way, we can create a more vibrant and enriching society for all.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678650/8cc1069e3a2349dda333a7b33ea0d798.mp3", "phrases2": [{"en": "multiculturalism is important", "zh": "多元文化主义很重要"}, {"en": "embrace and appreciate diverse cultures", "zh": "接纳并欣赏多元文化"}, {"en": "celebrate and learn from differences", "zh": "欣赏并从差异中学习"}, {"en": "respect for individual traditions and beliefs", "zh": "尊重个人传统和信仰"}, {"en": "a more inclusive and harmonious society", "zh": "更包容和谐的社会"}, {"en": "in contrast to the melting pot", "zh": "与大熔炉的对比"}, {"en": "broaden our understanding of the world", "zh": "拓宽对世界的理解"}, {"en": "a more vibrant and enriching society", "zh": "更有活力的社会"}]}, {"id": 2130, "name": "Dialects", "phrases": ["a detailed exploration", "the lecture", "the shaping", "diverse influences", "the dynamic nature", "received Pronunciation", "the adaptability", "linguistic landscape", "a comprehensive analysis", "the nuanced differences"], "eng": "The lecture delivers a detailed exploration of the distinctions between dialects and accents. It underscores the shaping of dialects by diverse influences such as geography, society, family, and education. It is particularly notable that even speakers of Received Pronunciation may integrate words from other dialects, highlighting the dynamic nature of language. This underscores the adaptability and interconnectedness of dialects within our linguistic landscape. Overall, the lecture presents a comprehensive analysis of the nuanced differences between dialects and accents, bringing to light their influential role in shaping communication and preserving cultural identities. It shines a spotlight on the diverse and evolving nature of language, and how it intricately reflects our individual and collective experiences.", "ref": "The lecture discusses the differences between dialects and accents, emphasizing the influence of geography, society, family, and education in shaping dialects. It highlights the dynamic nature of language by noting that speakers of Received Pronunciation may integrate words from other dialects. The lecture provides a comprehensive analysis of the influential role of dialects and accents in communication and cultural preservation, showcasing the diverse and evolving nature of language.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678651/197d3bf048df412eb723f576aea84447.mp3", "phrases2": [{"en": "the distinctions between dialects and accents", "zh": "方言与口音的区别"}, {"en": "shaped by geography, society, family and education", "zh": "受地理、社会、家庭和教育影响"}, {"en": "speakers of Received Pronunciation", "zh": "标准发音的使用者"}, {"en": "integrate words from other dialects", "zh": "融入其他方言的词"}, {"en": "the dynamic nature of language", "zh": "语言的动态性"}, {"en": "the adaptability of dialects", "zh": "方言的适应性"}, {"en": "preserving cultural identities", "zh": "保存文化身份"}, {"en": "the diverse and evolving nature of language", "zh": "语言不断演变"}]}, {"id": 2131, "name": "International law", "phrases": ["a historical perspective", "the pivotal role", "the painful lesson", "a new set", "the lecture", "the significance", "the United States", "the roles", "international law", "incessant wars"], "eng": "This lecture provides a historical perspective on the establishment of international law, emphasizing the pivotal role it played in ending protracted conflicts. It begins by highlighting the painful lesson learned from prolonged periods of war, prompting the creation of a new set of rules governing the behavior between states. The lecture underscores the significance of this development, particularly in the context of prolonged conflicts with no peace for 30 or even 100 years. Additionally, the roles of powerful nations such as the United States and Australia in shaping international law are discussed. It is noted that international law was formally established in 1648 as a means to end incessant wars between states and alleviate the strains of military force. 1648 Overall, the lecture emphasizes the implication function and power dynamics of international law, shedding light on its historical significance and its role in curbing conflicts and promoting stability among nations.", "ref": "The lecture discusses the historical significance of international law, particularly its role in ending prolonged conflicts. It emphasizes the impact of prolonged periods of war, leading to the creation of new rules governing the behavior between states. Additionally, it highlights the establishment of international law in 1648 and underscores its implications function and power dynamics in promoting stability among nations.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678652/2f80cb191ad24163b9a0d4cbc53a3a07.mp3", "phrases2": [{"en": "the establishment of international law", "zh": "国际法的建立"}, {"en": "the pivotal role in ending protracted conflicts", "zh": "在结束长期冲突中的关键作用"}, {"en": "the painful lesson from prolonged wars", "zh": "长期战争的痛苦教训"}, {"en": "a new set of rules governing states", "zh": "规范国家行为的新规则"}, {"en": "conflicts with no peace for 30 or 100 years", "zh": "30 年甚至 100 年无和平"}, {"en": "the roles of the United States and Australia", "zh": "美国和澳大利亚的作用"}, {"en": "formally established in 1648", "zh": "1648 年正式确立"}, {"en": "curbing conflicts and promoting stability", "zh": "遏制冲突、促进稳定"}]}, {"id": 2132, "name": "Coffee", "phrases": ["the second largest commodity", "the world", "east Africa", "the Pacific", "the Dutch", "a number", "the coffee", "a variety", "the one plant", "the low side"], "eng": "As you probably know, coffee is the second largest commodity by traded value in the world after oil. You probably also know that it's grown in Brazil, but you may not realize that it's not native to that country. It originated in East Africa. So if it came from there, how did it cross the Pacific? Well, the Dutch took coffee to a number of different places around the world, including South America, where it thrived. Nowadays, all the coffee cultivated in Brazil comes from that one seedling, which was of a variety called Robusta. Robusta Now, because it all comes from the one plant, genetically, Robusta isn't particularly varied, Robusta which unfortunately means its resistance to disease is, well, rather on the low side. And well, this is exactly what has happened recently. A pathogen called coffee rust is ravaging coffee crops across South America. So what it looks like is that the price of coffee is, well, going to skyrocket on the wholesale market, unless production is increased dramatically in a short space of time in other countries such as, you know, Vietnam, which seems rather unlikely. So in short, there's a good chance that your morning coffee is going to become, well, quite pricey and pretty soon at that.", "ref": "Although coffee originated in east Africa, much of it is now grown in Brazil. The crops there all stem from one individual plant, which means that they are vulnerable to contagion. As a result, the current outbreak of a disease called coffee rust is wiping out South American crops. This will probably lead to raised prices unless production elsewhere, such as in Vietnam, can be increased rapidly.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656875/cca7644f97e043108c257f4fa094be96.mp3", "phrases2": [{"en": "the second largest commodity by traded value", "zh": "交易额第二大的商品"}, {"en": "originated in East Africa", "zh": "起源于东非"}, {"en": "the Dutch took coffee around the world", "zh": "荷兰人把咖啡带到世界各地"}, {"en": "all Brazilian coffee from one seedling", "zh": "巴西咖啡都来自一株幼苗"}, {"en": "a variety called Robusta", "zh": "一个叫 Robusta 的品种"}, {"en": "its resistance to disease is low", "zh": "它的抗病性很低"}, {"en": "coffee rust is ravaging crops", "zh": "咖啡锈病正在毁坏作物"}, {"en": "the price will skyrocket", "zh": "价格将暴涨"}]}, {"id": 2133, "name": "Street art", "phrases": ["an underground art form", "mainstream recognition", "the graffiti trend", "the 1960s", "public spaces", "an expression", "social frustration", "the decades", "street art", "a wide variety"], "eng": "Streetheart developed from an underground art form into something which has achieved mainstream recognition and acceptance. It has its origins in the graffiti trend, which became popular in cities in the 1960s. 20 60 At that time, adding graffiti to public spaces was most definitely considered to be an act of vandalism. Indeed, it was hardly viewed as art at all, but rather as an expression of social frustration. However, over the decades, street art has developed artistically. Street artists have taken their inspiration from a wide variety of cultural influences, including hip hop music and graphic design trends. Nowadays, many urban centers have colorful, large scale wall paintings displaying uplifting or socially responsible messages. For this reason, street art is now viewed as part of the urban landscape and in some cases is a source of local pride. The street art projects I've just mentioned are, of course, officially approved schemes. However, some designs still appear on the sides of buildings without legal permission, and that's why street art is still a controversial art form. Nevertheless, it is now broadly accepted to the extent that some street artists have even achieved the same level of fame as celebrated artists in other creative fields.", "ref": "Street art has developed as a form of expression ever since its graffiti origins and has many different influences. lt&#39;s now a common feature in many cities and sometimes conveys quite positive messages. However, street art still remains somewhat controversial and can actually be illegal. Nevertheless, public perceptions of it have gradually become more accepting. Indeed, now some of the most famous street artists areas respected as their counterparts working inconventional creative fields.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658782/5d110e64bb194d0096a1fb931bd44cc4.mp3", "phrases2": [{"en": "developed from an underground art form", "zh": "从地下艺术发展而来"}, {"en": "achieved mainstream recognition", "zh": "获得主流认可"}, {"en": "its origins in the graffiti trend", "zh": "起源于涂鸦潮流"}, {"en": "considered an act of vandalism", "zh": "被视为破坏行为"}, {"en": "an expression of social frustration", "zh": "社会不满的表达"}, {"en": "inspired by hip hop and graphic design", "zh": "受嘻哈和平面设计启发"}, {"en": "large scale wall paintings", "zh": "大型墙面绘画"}, {"en": "still a controversial art form", "zh": "仍是有争议的艺术形式"}]}, {"id": 2134, "name": "Loss leader strategy", "phrases": ["a profit", "the goods", "the case", "the loss leader", "a strategy", "“ ” Basically", "new products", "introductory price", "the idea", "the low price"], "eng": "Now, as we all know, companies usually set out to make a profit on the goods and services they sell. However, that's not always the case. So today we're going to look at a strategy called the loss leader and why companies may decide to use it. “ ” Basically, a loss leader is a product or service that the company is willing to sell at a very low price, even though it will lead to a financial loss. “ ” For instance, brand new products are often sold at a special promotional or introductory price. introductory price The idea is that this low price will help spread the word about the product, so in essence, it serves as a form of marketing. The low price will tempt people to at least try it once, and then if the products are hit, there will be enough loyal customers that will continue to purchase it even once the company has increased the price. So the rationale is that the short-term loss is worth the potential long term gain. However, it should be noted that this strategy is of course highly risky. After all, there's nothing stopping customers from switching to other brands once the introductory price disappears. And obviously any decision which involves a financial loss has to be carefully calculated. Large companies may have the financial power to take this sort of risk, but for a new or small company, the financial implications are huge.", "ref": "A loss leader is when companies intentionally sell their products at an unprofitable price in order to attract new customers. The aim of the loss leader strategy is usually for companies to build a loyal customer base so that when they eventually increase their prices, they will make a profit. However, the loss leader strategy is a potential risk especially for small companies.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658783/73539a3ce85d46bf922c3b1b795c50f5.mp3", "phrases2": [{"en": "a strategy called the loss leader", "zh": "一种叫引流品的策略"}, {"en": "sold at a very low price", "zh": "以极低价格出售"}, {"en": "leading to a financial loss", "zh": "导致财务损失"}, {"en": "a special introductory price", "zh": "特别的新品价"}, {"en": "serves as a form of marketing", "zh": "起到营销作用"}, {"en": "tempt people to try it once", "zh": "吸引人们尝试一次"}, {"en": "build enough loyal customers", "zh": "培养足够的忠实顾客"}, {"en": "the short-term loss is worth the long-term gain", "zh": "短期损失值得长期收益"}]}, {"id": 2135, "name": "Sources of protein", "phrases": ["current way", "the environment", "total greenhouse gas emissions", "food system", "the agricultural land", "cook food", "flexible approach", "damaging effect", "the greenhouse gas emissions", "more plant-based foods"], "eng": "Our current way of eating is not sustainable, neither for our health nor the environment. Our food system, which relies on the production of meat, eggs and dairy products as sources of protein, generates 15% of total greenhouse gas emissions globally. 15% It also requires 70% of the agricultural land on Earth. 70% We need to change how we produce, transport and cook food. Studies show that taking a more flexible approach to the way we obtain protein can allow our diets to have a significantly less damaging effect on the environment. Specifically, it can bring the greenhouse gas emissions down by more than 50%, 50% and we can do this easily by having more plant-based foods and less meat. This should be viable as more and more alternatives to traditional sources of protein are becoming more widely available. Beans, wheat, nuts, and even insects all have a lower impact on the environment and along with the promising development of meat grown in labs, they give us the opportunity to dramatically reduce greenhouse gas emissions compared with those produced by meat production, as long as they are both readily available and affordable for the public, we should be able to flexibly switch between traditional and alternative sources of protein.", "ref": "Our current food system is unsustainable, especially our ways of sourcing protein. This contributes to global greenhouse gas emissions and takes up a large proportion of land for agricultural purposes. We can, however, reduce these negative effects by getting more of our protein from plant-based foods and lab-grown meat, provided that the public can easily access and afford them.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657019/8c9699300ea44b499ca43f0a0b0ec423.mp3", "phrases2": [{"en": "our current way of eating is not sustainable", "zh": "当前的饮食方式不可持续"}, {"en": "relies on meat, eggs and dairy", "zh": "依赖肉、蛋、奶"}, {"en": "generates 15% of greenhouse gas emissions", "zh": "产生 15% 的温室气体"}, {"en": "requires 70% of agricultural land", "zh": "占用 70% 的农业用地"}, {"en": "a more flexible approach to protein", "zh": "更灵活的蛋白质获取方式"}, {"en": "reduce emissions by more than 50%", "zh": "减少 50% 以上排放"}, {"en": "more plant-based foods and less meat", "zh": "更多植物性食物、更少肉"}, {"en": "alternatives like beans, nuts and insects", "zh": "豆类、坚果、昆虫等替代品"}]}, {"id": 2136, "name": "Question Bank", "phrases": ["the relationship", "the interior", "several ways", "an office", "a working environment", "the simplicity", "knock-on effects", "increased productivity", "minimum cost", "office space"], "eng": "We need to consider more closely the relationship between the interior of a building and its influence on an individual, because interior designers should evaluate the direct outcome their proposals can have on an employee. Design can affect them in several ways. Firstly, setting aside spaces for plants in an office is linked to worker well-being and performance. Research has shown that the simplicity of having plants in a working environment positively affects air quality. Air that is more filtered than has knock-on effects such as increased productivity, greater concentration and a reduction in stress. This clearly shows that at minimum cost to companies, working performance can be improved. The second one is not as cost effectively, it concerns office space. While an open plan office is seen to promote interaction and boost communication and productivity, this isn't always true. I think it has now been proven that it can go the opposite way. Open plan offices lead to a lack of face-to-face communication and an over-reliance on electronic interactions as staff feel vulnerable and exposed and less inclined to share ideas. Finally, it seems clear that the interior of a building directly affects performance at work. Therefore, we should not underestimate how work culture is affected by office design.", "ref": "Employees&#39; work performance is directly affected by the interior design of their workplace. One inexpensive method for improving performance is placing plants around the office, because they can affect employee productivity and well-being, as well as reducing stress. Another is redesigning office space as open-plan offices can reduce communication by making staff feel reluctant to share ideas openly. Office design therefore has important effects on work culture.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657239/a6d707af7a0e41d397907c8d3c5521ac.mp3", "phrases2": [{"en": "the relationship between building interior and employees", "zh": "建筑内部与员工的关系"}, {"en": "interior design affects employee performance", "zh": "室内设计影响员工表现"}, {"en": "plants in an office linked to well-being", "zh": "办公室绿植与幸福感相关"}, {"en": "positively affects air quality", "zh": "改善空气质量"}, {"en": "increased productivity and concentration", "zh": "提高生产力和专注度"}, {"en": "open plan offices promote interaction", "zh": "开放式办公室促进互动"}, {"en": "a lack of face-to-face communication", "zh": "缺乏面对面交流"}, {"en": "an over-reliance on electronic interactions", "zh": "过度依赖电子交流"}]}, {"id": 2137, "name": "Skill-based curriculum", "phrases": ["a broad agreement", "the skills", "many people", "cross-disciplinary skills", "an incredible rate", "no one individual", "the biggest challenges", "the school syllabus", "most assessments", "knowledge content"], "eng": "There's a broad agreement that the skills that children will need in the future are different from those that their parents needed in the past. And many people now believe that cross-disciplinary skills, things like critical thinking or collaboration or problem-solving are going to be necessary to survive in the future. We can already see that information and knowledge are increasing at an incredible rate, such a rate, in fact, that no one individual can ever hope to learn everything they need to know about every subject and stay truly up to date. What they need are the skills to locate knowledge, and then use that knowledge in jobs. Bear in mind that those jobs may not even exist yet. Now, this may be the case, but one of the biggest challenges with delivering cross-disciplinary skills in the school syllabus is that many teachers were trained to teach knowledge, facts rather than skills. Most assessments work with knowledge content. If we are to change the skills that children leave school with, we need to go through a phase of transition that some of those in the education profession feel deeply uncomfortable with.", "ref": "Although knowledge will be less valued in future job markets, people are still not keen on introducing a curriculum based on skills. This is because the education system is not ready to teach or assess critical thinking collaboration or the other cross-disciplinary skills that businesses value.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658773/fb4440efe7034cc18c7d22c1b0818793.mp3", "phrases2": [{"en": "the skills children need in the future", "zh": "孩子未来需要的技能"}, {"en": "cross-disciplinary skills", "zh": "跨学科技能"}, {"en": "critical thinking and problem-solving", "zh": "批判性思维和解决问题"}, {"en": "information is increasing at an incredible rate", "zh": "信息以惊人速度增长"}, {"en": "the skills to locate knowledge", "zh": "定位知识的技能"}, {"en": "jobs may not even exist yet", "zh": "工作可能还不存在"}, {"en": "teachers trained to teach facts", "zh": "老师被训练教事实"}, {"en": "a phase of transition", "zh": "一个过渡阶段"}]}, {"id": 2139, "name": "Child-rearing", "phrases": ["many people", "the development", "a recent research study", "the case", "the home", "the children", "the research", "no difference", "a small number", "a situation"], "eng": "Many people believe that it's always better for the development of very young children under the age of three to be cared for within the home. But a recent research study in the us suggests that this is not always the case. Being cared for outside the home can actually bring benefits if the children can build relationships with the workers who look after them and they have the opportunity to develop skills. The research also suggests that it makes no difference if one child is looked after by one person or if they're part of a group of children in a place that's similar to a sure. And we can say for sure that a situation where each member of staff looks after a small number of children is often very positive for the children involved.", "ref": "Although many people think that small children should be cared for at home, being looked after outside the home can also have positive effects if the children can build relationships and learn skills. There&#39;s no evidence that it&#39;s better if one child is looked after by one person or if they are cared for in a group, but children benefit if each staff member is only responsible for a small number of them.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658776/654b306f1a8c43b19887f90dc1ce0a66.mp3", "phrases2": [{"en": "children under three cared for at home", "zh": "三岁以下在家照顾"}, {"en": "a recent research study in the US", "zh": "美国最近的一项研究"}, {"en": "cared for outside the home brings benefits", "zh": "在外照顾也有好处"}, {"en": "build relationships with the workers", "zh": "与工作人员建立关系"}, {"en": "the opportunity to develop skills", "zh": "发展技能的机会"}, {"en": "one person or a group of children", "zh": "一个人照顾还是一群孩子"}, {"en": "each member of staff looks after a small number", "zh": "每位员工照看少量孩子"}, {"en": "positive for the children involved", "zh": "对孩子有积极影响"}]}, {"id": 2141, "name": "Smart skin", "phrases": ["the development", "stretchable electronics", "an electronic skin", "various bodily processes", "clear real time monitoring", "elite athletes", "one thing", "electrolyte levels", "the body", "multiple functions"], "eng": "So the development of stretchable electronics or smart skin has long been dreamed of, but it's now become a reality. It is basically an electronic skin that can be worn in order to monitor various bodily processes. It's proving particularly popular with elite athletes during training as it allows clear real time monitoring. One thing that athletes particularly like to monitor is their electrolyte levels. Electrolytes are minerals in the body that have multiple functions in keeping our bodies running healthily. So it's very important to maintain their levels. The smart skin is able to analyze these from a person's sweat. If levels are low, then athletes need to take care and slow down. This instant analysis means that a person has the information at their fingertips, so to speak, and can make decisions before there's an adverse effect on their health. Another way the smart skin is being used is to monitor a person's heartbeat by showing a visual wave, rather like having a heart monitor strapped to your arm, but a lot more portable and comfortable. These are just two applications, but scientists are already starting to explore the myriad uses for this technology.", "ref": "There is now an electronic skin called a smart skin that can be worn to monitor bodily processes. Athletes like it because it gives them real-time information about their bodies as they are training. lt can monitor various things by analysing their sweat. The skin can also show a person&#39;s heartbeat. The smart skin is very portable and scientists are exploring the numerous different uses it could have.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658779/a0035877a5fa4c3ca287baa6b28e7077.mp3", "phrases2": [{"en": "the development of stretchable electronics", "zh": "可拉伸电子设备的发展"}, {"en": "an electronic skin that can be worn", "zh": "可以穿戴的电子皮肤"}, {"en": "monitor various bodily processes", "zh": "监测各种身体过程"}, {"en": "popular with elite athletes", "zh": "受精英运动员欢迎"}, {"en": "real time monitoring", "zh": "实时监测"}, {"en": "monitor electrolyte levels from sweat", "zh": "从汗液监测电解质水平"}, {"en": "monitor a person's heartbeat", "zh": "监测心跳"}, {"en": "the myriad uses for this technology", "zh": "这项技术的多种用途"}]}, {"id": 2142, "name": "Iconoclast", "phrases": ["innovative thinkers", "the iconoclast", "the term iconoclast", "vital question", "a business context", "the fact", "a company", "average person", "continued exposure"], "eng": "So moving on with our studies on innovative thinkers, let's now consider the iconoclast. “ ” An iconoclast can be defined someone who challenges established ideas and beliefs. Put simply, it's someone who hasn't stopped asking that vital question, why the term iconoclast is often used negatively. “ ” “ ” But in a business context, an iconoclast can be indispensable. The fact that they ask this question of established procedures and methods means that they may be able to uncover chinks in a company's armor and find efficiencies that their colleagues are oblivious to. It has long been known that your average person tends to stop questioning something if they are increasingly exposed to it. Iconoclasts may see through this with searing clarity and are unlikely to tolerate continued exposure. Rather than force them to conform, businesses do well to listen to them.", "ref": "An iconoclast is someone who challenges established ideas and beliefs. This can be seen as a negative but in business it should be valued. lconoclasts ask the simple question &ldquo;Why?&rdquo; and they will not accept things like other people do. In fact, they spot changes that can be made to make a business more efficient. Businesses should listen to them and not try to change them.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658781/a3676c7b1f8a4acc82ef108e322ad851.mp3", "phrases2": [{"en": "innovative thinkers", "zh": "创新思考者"}, {"en": "an iconoclast challenges established ideas", "zh": "反传统者挑战既定观念"}, {"en": "someone who keeps asking why", "zh": "不断问为什么的人"}, {"en": "indispensable in a business context", "zh": "在商业环境中不可或缺"}, {"en": "uncover chinks in a company's armor", "zh": "发现公司的弱点"}, {"en": "find efficiencies colleagues are oblivious to", "zh": "发现同事忽略的效率"}, {"en": "people stop questioning when repeatedly exposed", "zh": "反复接触后不再质疑"}, {"en": "businesses do well to listen to them", "zh": "企业应该倾听他们"}]}, {"id": 3787, "name": "Bees' genes and Darwin", "phrases": ["A healthy hive", "the egg-laying machine", "the queen", "2500 eggs", "the worker bees", "the bulk", "a typical hive", "30000 bees", "100 Drones", "the workers"], "eng": "A healthy hive of honeybees functions like a perfect and fluid organism; at the center of all activity is the queen, the egg-laying machine. —— The queen is actually a slave to her duties, laying up to 2500 eggs a day, as many as two million in her lifetime. 2500 200 The worker bees are all female and make up the bulk of the colony. In a typical hive of 30000 bees, only about 100 are males called drones, with oversized eyes and bulky bodies. 100 Drones are not equipped to gather pollen or nectar and must rely on the workers to feed them. The invaluable work bees do takes its toll in the summer. Workers only live around 30 days, literally work to death. 30 “ ” But the hive is constantly replenished with new generations of bees ready to go to work from the moment they hatch.", "ref": "A healthy honeybee hive revolves around the queen&rsquo;s egg-laying capacity of up to 2500 eggs a day. The majority of the colony comprises female workers, while a small number of male drones rely on the workers for sustenance. The worker bees&rsquo; tireless efforts in gathering resources take a toll, as they live for approximately 30 days, but the hive is continually replenished by new generations.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691666/f00e8f53ad104a42923abaf13654a0c4.mp3", "phrases2": [{"en": "a healthy hive functions like an organism", "zh": "健康的蜂巢像一个有机体"}, {"en": "at the center is the queen", "zh": "中心是蜂后"}, {"en": "laying up to 2500 eggs a day", "zh": "每天最多产 2500 个卵"}, {"en": "worker bees are all female", "zh": "工蜂都是雌性"}, {"en": "a typical hive of 30000 bees", "zh": "典型蜂巢有 3 万只蜜蜂"}, {"en": "only about 100 are male drones", "zh": "只有约 100 只是雄蜂"}, {"en": "workers only live around 30 days", "zh": "工蜂只能活约 30 天"}, {"en": "constantly replenished with new generations", "zh": "不断补充新一代"}]}, {"id": 3788, "name": "Credit card experiment", "phrases": ["inactive credit card users", "A recent study", "the other group", "one group", "the potential loss", "the potential benefits", "a stronger motivator", "the fear", "important implications", "inactive customers"], "eng": "A recent study on customer behavior investigated the impact of different messaging strategies on inactive credit card users. One group was presented with a message emphasizing the benefits they could enjoy by using their cards, while the other group received a communication implying a penalty for non-use. Surprisingly, the results revealed that customers were more influenced by the potential loss of not using the card than the potential benefits of using it. “ ” “ ” This suggests that the fear of missing out or facing a penalty may be a stronger motivator for customer action than the promise of rewards. These findings have important implications for businesses and marketers seeking to engage inactive customers, indicating that messaging focusing on potential losses or penalties may be more effective in encouraging customer activity. Further research in this area could lead to a better understanding of consumer decision-making and the psychological factors driving behavior.", "ref": "In an experiment on customers&rsquo; behaviors, one group of inactive credit card users received a message offering benefits that they could gain by using the cards, while the other group received a message implying a penalty if it&rsquo;s not used. The result shows that customers are more motivated by a potential loss when not using this card than the benefit they could gain by using the card.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691680/c5b7e21242ed45fbb17babb92050becd.mp3", "phrases2": [{"en": "a study on customer behavior", "zh": "一项顾客行为研究"}, {"en": "the impact of messaging strategies", "zh": "信息策略的影响"}, {"en": "emphasizing the benefits of using cards", "zh": "强调用卡的好处"}, {"en": "implying a penalty for non-use", "zh": "暗示不使用的惩罚"}, {"en": "influenced by the potential loss", "zh": "受潜在损失影响"}, {"en": "the fear of missing out", "zh": "错失恐惧"}, {"en": "a stronger motivator than rewards", "zh": "比奖励更强的动力"}, {"en": "implications for businesses and marketers", "zh": "对企业与营销人员的启示"}]}, {"id": 3789, "name": "Journalism and internet", "phrases": ["the New Mexico Independent", "an online news site", "some great benefits", "new Mexico", "the Internet", "amazing medium", "some time", "other things", "a newspaper", "all online"], "eng": "David Olivia Garcia is a co-host of New Mexico in Focus and is also the managing editor for the New Mexico Independent, which is an online news site. · · New Mexico in Focus “ ” New Mexico Independent He says that the Internet has some great benefits for journalism. The Internet is this new, amazing medium. Not so new: it's been around quite some time now. But it's maturing as, among other things, a place for journalism. In a sense, the Internet allows you to tell stories better than in a newspaper or on television. For this reason, you can do it all online: you can have the written word, you can have still photographs, you can have video. You can link and kind of connect to the other journalism that has been done on a given topic. So it's not like you're in a vacuum. The Internet has had a negative impact on these papers. However, John Fleck, who is a columnist for the Albuquerque Journal and also has his own blog, says that he doesn't think that's entirely the case. Albuquerque Journal · It really makes me more efficient as a journalist in terms of information gathering, confirmation, helping me get the background necessary to write a story. So it's really good for that.", "ref": "David Olivia Garcia, co-host of New Mexico in Focus and managing editor for the New Mexico Independent, believes that the Internet has great benefits for journalism, offering various mediums to tell stories and connect with other journalistic work. However, John Fleck, a columnist for the Albuquerque Journal, argues that the Internet actually makes journalists more efficient in terms of gathering information and confirming facts.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691682/67f174d0fbc64dd0aaac9c49ad92d8fb.mp3", "phrases2": [{"en": "the Internet has great benefits for journalism", "zh": "互联网对新闻业有很大好处"}, {"en": "tell stories better than newspapers", "zh": "比报纸更好地讲故事"}, {"en": "the written word, stills and video", "zh": "文字、图片和视频"}, {"en": "link to other journalism on a topic", "zh": "链接到该话题的其他报道"}, {"en": "the Internet has had a negative impact", "zh": "互联网带来了负面影响"}, {"en": "more efficient as a journalist", "zh": "作为记者更高效"}, {"en": "information gathering and confirmation", "zh": "信息收集和核实"}, {"en": "getting the background to write a story", "zh": "获取写报道的背景"}]}, {"id": 3790, "name": "Sleep", "phrases": ["a new discovery", "a good thing", "a bad thing", "the memory", "the information", "good things", "bad things", "the save button", "the brain", "a dry sponge"], "eng": "This is a new discovery about learning and memory. It is a good thing for you to get enough sleep, and a bad thing for you if not. People need to sleep before learning, and people also need to sleep after learning. When you are asleep, the memory can consolidate all the information into your brain. From this point, it may only get worse. Not only will I tell you about the wonderfully good things that happen when you get sleep, but the alarmingly bad things that happen when you don't get enough both for your brain and your body. Let me start with the brain and the functions of learning and memory, because what we've discovered over the past 10 or so years is that you need sleep after learning to essentially hit the save button on those new memories so that you don't forget. “ ” But recently, we discovered that you also need sleep before learning and now to actually prepare your brain almost like a dry sponge, ready to initially soak up new information. And without sleep, the memory circuits of the brain essentially become waterlogged, as it were. And you can't absorb new memories.", "ref": "Sleep is essential for learning and memory. Getting enough sleep before and after learning helps consolidate information in the brain. Lack of sleep impairs memory and learning processes. Sleep prepares the brain to absorb new information, acting like a dry sponge. Without sleep, memory circuits become overwhelmed, hindering the absorption of new memories.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691683/fff7d4700ed84c6b9b5b52ba52ce04f6.mp3", "phrases2": [{"en": "a new discovery about learning and memory", "zh": "关于学习和记忆的新发现"}, {"en": "need sleep before and after learning", "zh": "学习前后都需要睡眠"}, {"en": "the memory consolidates information", "zh": "记忆巩固信息"}, {"en": "hit the save button on new memories", "zh": "为新记忆按下保存键"}, {"en": "prepare your brain like a dry sponge", "zh": "让大脑像干海绵"}, {"en": "soak up new information", "zh": "吸收新信息"}, {"en": "memory circuits become waterlogged", "zh": "记忆回路被水浸透"}, {"en": "can't absorb new memories", "zh": "无法吸收新记忆"}]}, {"id": 3791, "name": "Telescope", "phrases": ["a little bit", "a telescope", "a couple", "good things", "larger telescopes", "quantum mechanical effects", "a little telescope", "the other thing", "modern digital detectors", "the same sensitivity"], "eng": "So let's just talk a little bit about a telescope. Our eye is the telescope we all are used to. It's a little tiny five millimeter telescope, and it serves us very well. But if we make telescopes bigger, we get a couple of good things. We have larger telescopes and they collect a lot more light so we can see things that are fainter. But it turns out they greatly improve detail. And that's because of the nature that light is a wave, and wave effects are what we call quantum mechanical effects, meaning that when you use a little telescope to look at waves, it becomes blurry through what we call diffraction. “ ” And so larger telescopes are extremely useful to improve detail. The other thing that telescopes allow us to do is to put modern digital detectors behind them. Our eye is about the same sensitivity as a photographic plate. A photographic plate can be sat there and it can look at the sky for an hour so it can see fainter. But modern digital detectors are almost 100 times more efficient than our eyes at collecting light. 100 And so you can improve things by a factor of 100. 100 That's like building a telescope ten times bigger. 10 And so that improvement has been one of the things that's allowed astronomy to do so much in the optical regime in the last 30 years. 30", "ref": "Our eye is a tiny five-millimeter telescope. When we have larger telescopes that collect more light, we can see things fainter but it greatly improves detail. This is because the nature of light is a wave which has quantum mechanical effects. Telescopes also allow us to put modern digital detectors behind them, which are 100 times more efficient. Such improvement allowed astronomy to do so much in the optical regime.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691687/aa4905fb2e8c4da485dafb8801dfb653.mp3", "phrases2": [{"en": "our eye is a tiny telescope", "zh": "我们的眼睛是个小望远镜"}, {"en": "larger telescopes collect more light", "zh": "更大的望远镜收集更多光"}, {"en": "see things that are fainter", "zh": "看到更暗的物体"}, {"en": "greatly improve detail", "zh": "大幅提升细节"}, {"en": "light is a wave", "zh": "光是波"}, {"en": "blurry through diffraction", "zh": "因衍射而模糊"}, {"en": "modern digital detectors", "zh": "现代数字探测器"}, {"en": "100 times more efficient than our eyes", "zh": "比眼睛高效 100 倍"}]}, {"id": 3792, "name": "Australian immigration", "phrases": ["the present indigenous people", "the first inhabitants", "several successive waves", "distinct peoples", "time frame places presence", "the upper range", "the closing stages", "the Pleistocene epoch", "some 100 –", "extended glaciation"], "eng": "The first inhabitants in Australia were the ancestors of the present indigenous people. Whether these first migrations involved one or several successive waves and distinct peoples is still subject to academic debate, as is its timing. The minimum widely accepted time frame places presence of humans in Australia at 40,000 to 43,000 years Before Present, while the upper range supported by others is 60,000 to 70,000 years BP. 4 4 3 6 7 In any event, this migration was achieved during the closing stages of the Pleistocene epoch, when sea levels were typically much lower than they are today. Repeated episodes of extended glaciation resulted in decreases of sea levels by some 100–150 m. 100 150 The continental coastline therefore extended much further out into the Timor Sea than it does today, and Australia and New Guinea formed a single landmass (known as Sahul), connected by an extensive land bridge across the Arafura Sea, Gulf of Carpentaria and Torres Strait. “ ” The ancestral Australian Aboriginal peoples were thus long established and continued to develop, diversify and settle through much of the continent. As the sea levels again rose at the terminus of the most recent glacial period some 10,000 years ago, the Australian continent once more became a separated landmass. However, the newly formed 150 km wide Torres Strait with its chain of islands still provided the means for cultural contact and trade between New Guinea and the northern Cape York Peninsula. 150 During the 1970s and 1980s around 120,000 southern Asian refugees migrated to Australia. 20 70 80 12 During that twenty years, Australia first began to adopt a policy of what Minister of Immigration Al Grassby termed \"multiculturalism\". · “ ” In 2004–05, Australia accepted 123,000 new settlers, a 40% increase over the past 10 years. 2004 2005 12.3 40% The largest number of immigrants (40,000 in 2004–05) moved to Sydney. 2004–05 4 The majority of immigrants came from Asia, led by China and India.", "ref": "The first inhabitants of Australia were the ancestors of the indigenous people. Their migration occurred during the Pleistocene epoch when sea levels were lower. Australia and New Guinea were connected by a land bridge known as Sahul. As sea levels rose 10,000 years ago, Australia became a separate landmass. In recent years, Australia has experienced significant immigration, with the majority coming from Asia, particularly China and India.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691689/5d47bce3664d4b28a389d76a23a1b8d7.mp3", "phrases2": [{"en": "the first inhabitants in Australia", "zh": "澳大利亚最早的居民"}, {"en": "ancestors of the indigenous people", "zh": "原住民的祖先"}, {"en": "the minimum time frame 40,000 years", "zh": "至少 4 万年前"}, {"en": "sea levels much lower than today", "zh": "海平面比现在低得多"}, {"en": "Australia and New Guinea formed one landmass", "zh": "澳新曾是一块陆地"}, {"en": "an extensive land bridge", "zh": "一座广阔的陆桥"}, {"en": "around 120,000 Asian refugees", "zh": "约 12 万亚洲难民"}, {"en": "a policy of multiculturalism", "zh": "多元文化政策"}]}, {"id": 3793, "name": "Tutorial", "phrases": ["the tutors", "the difference", "300 students", "the skills", "time management", "each group", "the tutorial", "the rest", "the students", "the advice"], "eng": "If we need help before the tutorial, we can email any of the tutors and they will provide us with help. The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students, whereas in tutorials it's about five to 15 students, 200 300 5 15 which allows you to discuss matters, put your hand up and talk to your tutors about any difficulties you may have with the subject. The skills that I have developed through participating in these tutorials include time management, critical thinking, being able to work better in a group and improving my confidence to speak up in a group. At the end of a tutorial, each group will have to give feedback on what they've been discussing throughout the tutorial. So this may consist of having to present to the rest of the students in the class and it allows me to improve my group working skills and also working in a group allows us to generate more ideas and discuss the topic in more depth. The advice I have for potential University of Edinburgh students to make the most out of your tutorial sessions is to complete the reading that you're given by your tutors beforehand. This will enable you to discuss more in groups and generate more ideas. It's also beneficial to raise your hand and develop your confidence so that you can have better discussions in class.", "ref": "Before tutorials, students need to read articles and write notes. In tutorials, students discuss ideas and give feedback in small groups. It&rsquo;s easier to get support from the tutors in tutorials because there are fewer students than lectures. Students can improve their skills, teamwork, and confidence in tutorials. In the end, the speaker&rsquo;s advice is that do the readings before tutorials and be active in tutorials.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691721/0dd9b2056b08481093188a6a3dba899c.mp3", "phrases2": [{"en": "email the tutors for help", "zh": "邮件联系导师求助"}, {"en": "lectures have 200 to 300 students", "zh": "讲座有 200 到 300 名学生"}, {"en": "tutorials have five to 15 students", "zh": "辅导课有 5 到 15 名学生"}, {"en": "skills like time management and critical thinking", "zh": "时间管理和批判性思维等技能"}, {"en": "work better in a group", "zh": "更好的团队合作"}, {"en": "improve confidence to speak up", "zh": "提升发言自信"}, {"en": "give feedback on the discussion", "zh": "对讨论给出反馈"}, {"en": "complete the reading beforehand", "zh": "提前完成阅读"}]}, {"id": 3794, "name": "Implicit and explicit memory", "phrases": ["a little bit", "different systems", "the memory", "everyday life", "the bulk", "procedural memory", "social norms", "a certain thing", "a classroom", "all things"], "eng": "So I'm going to talk a little bit briefly about different systems of memory. And in fact, much of the memory that influences and guides our everyday life actually kind of hides in the background. You actually don't know that you're using the bulk of your memory. And this is called implicit or procedural memory. This includes things like cultural and social norms. So kind of understanding how you're supposed to behave in a classroom or expecting a certain thing to happen when you walk into a restaurant. These are all things that we've learned and acquired over our years, but it's not necessarily something that we think about. Language also, in many aspects, is something that is fairly automatic and that we've acquired and use very naturally, and other learned skills such as reading or driving. These are things that might have been effortful at one time, but now they just come very easily and automatically to us. And in fact, if you actually try to describe to somebody how you drive or how to drive, you actually kind of mix you up. So these are in a lot of cases, consciousness kind of gets in the way of a lot of these aspects of implicit memory. Now, when we're talking about our memory, so for instance, people tell me a lot that their memories are bad. “ ” When people are saying when they talk about their memory, they're usually talking about explicit or episodic memory. And these are very different from implicit memories. These are memories that have a very specific tag of space and time. These are highly personal memories, usually. So this could be everything from remembering what you ate for breakfast to what you did on your last vacation, or remembering a significant birthday that you had several years ago, or... Or just an answer to a multiple choice question on a test. ……", "ref": "Implicit memory and explicit memory are the two main types of memory. Implicit memory is also called procedural memory and cannot be consciously recalled. Implicit memory is about cultural and social background, such as using language naturally or driving automatically. Explicit memory is also known as episodic memory, related to personal life experiences. It is about time and space, such as remembering birthdays or answering questions in a test.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691690/82afaea0935c441ba323b7e59285e036.mp3", "phrases2": [{"en": "different systems of memory", "zh": "不同的记忆系统"}, {"en": "memory hides in the background", "zh": "记忆隐藏于背景中"}, {"en": "implicit or procedural memory", "zh": "内隐或程序性记忆"}, {"en": "cultural and social norms", "zh": "文化和社会规范"}, {"en": "learned skills like reading or driving", "zh": "阅读或驾驶等技能"}, {"en": "consciousness gets in the way", "zh": "意识会干扰"}, {"en": "explicit or episodic memory", "zh": "外显或情景记忆"}, {"en": "a specific tag of space and time", "zh": "特定的时间和空间标记"}]}, {"id": 3795, "name": "Biggish city", "phrases": ["a biggish city", "the problems", "another lecture", "the population", "the thousands", "the earliest theorists", "an ideal city", "the same figures", "leonardo da Vinci", "thousand inhabitants"], "eng": "We have briefly looked at some of the problems involved in running a biggish city like, say, Melbourne, keeping the road and rail systems running, policing, providing food and housing, and so on. In another lecture, I'm going to deal with what we must now call megalopolis-cities with populations of ten million or more. “ ” —— However, first I want to go back in history to when the population of cities could be numbered in the thousands rather than millions. One of the earliest theorists of the city was, of course, Plato, who created an ideal city in his text, The Republic. The population of this city would be around twenty-five to thirty thousand at most. Oddly enough, the same figures were chosen by Leonardo da Vinci for his ideal cities. · · Now, of these twenty-five to thirty thousand inhabitants, only about five thousand would be citizens. A reason for this might be that it is the largest number that could be addressed publicly at one time and by one person, and makes a voting system much easier to manage. Also, perhaps the numbers are kept deliberately low because a large population would be harder to control, or because, in practical terms, fewer inhabitants are easier to feed from local supplies without having to depend on outside sources.", "ref": "The lecture talks about the population of cities in the past. According to the speaker, the population of cities in history could be numbered in thousands rather than millions. Interestingly enough, both Plato and Leonardo chose the same figures, twenty-five to thirty thousand inhabitants, for their ideal cities. Now, the number of citizens is kept deliberately low because a small population would be easier to manage.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691694/829404ecaf9e4b748ec0d14937d3ff28.mp3", "phrases2": [{"en": "problems of running a biggish city", "zh": "管理大城市的难题"}, {"en": "keeping road and rail systems running", "zh": "维持道路和铁路运行"}, {"en": "cities with ten million or more", "zh": "人口千万以上的城市"}, {"en": "Plato created an ideal city", "zh": "柏拉图创造了理想城邦"}, {"en": "his text, The Republic", "zh": "他的著作理想国"}, {"en": "twenty-five to thirty thousand at most", "zh": "最多 2.5 到 3 万人"}, {"en": "only about five thousand would be citizens", "zh": "只有约 5000 人是公民"}, {"en": "the largest number addressed publicly", "zh": "能公开演讲的最大人数"}]}, {"id": 3796, "name": "Organizational study", "phrases": ["some organization studies", "a management specialist", "leadership skills", "leadership Development", "the interpersonal competencies", "the public sector", "the private sector", "everyone needs", "strategic goal", "organization studies courses"], "eng": "It's really recommended that everybody take some organization studies courses even if you're not planning to become a management specialist. These courses will provide leadership skills that we've got courses such as Rosens' Leadership Development. They're going to give you the interpersonal competencies and skills to advance in your career. So I think org (organisation) studies give people a place to go into a number of different careers, be it in the public sector, the private sector or a nonprofit. I think everyone needs to understand how organizations are structured, how they function and how people interact. And then to get to your strategic goal. It's really important to take organization studies courses. And I know it's a bit of a hard sell for a lot of students who are appearing in it. But over and over, alumni come back to me and say, you know what, the most important course I've ever taken was organization studies. “ ” And I really wish I took it more because those are the skills that really help me move up in my career. So those are the competencies or political skills for understanding myself for knowing how to work with difficult people, for knowing how to manage my boss, knowing how to structure the organization, knowing how to create sustainable competitive advantage. And those are the skills that really differentiate people who are going to have long term successful careers.", "ref": "This lecture is mainly about organisation courses. Firstly, organisation courses are very important. Organisation courses will help us to get leadership skills in our careers. Those skills that are supplied by organisation courses will be helpful to our careers. People can learn how to satisfy the boss. People had better learn organisation courses if they want to get long terms of successful careers.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691704/ea2895ae34c941a68ee5f446fa1ec559.mp3", "phrases2": [{"en": "take organization studies courses", "zh": "修组织研究课程"}, {"en": "leadership skills", "zh": "领导力技能"}, {"en": "interpersonal competencies", "zh": "人际能力"}, {"en": "careers in public, private or nonprofit", "zh": "公共、私营或非营利职业"}, {"en": "how organizations are structured and function", "zh": "组织的构建与运作"}, {"en": "political skills", "zh": "政治技能"}, {"en": "how to work with difficult people", "zh": "如何与难相处的人共事"}, {"en": "manage my boss", "zh": "管理上司"}]}, {"id": 3797, "name": "Leadership", "phrases": ["an executive order", "an interesting idea", "the coercive threat", "quiet persuasion", "martin Luther King Jr", "a charismatic leader", "the power", "the leader wields", "a spectrum", "the United States"], "eng": "A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. · · We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\" more often, however, top leaders have been quite visible in their exercise of power. · “ ” Women (as well as some men) have provided casual, low-key leadership behind the scenes. But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership.", "ref": "The lecture talks about leadership. Leaders can define or clarify goals through various means such as issuing memos, executive orders, or laws, as well as using charisma, rhetoric, and example. Leadership can range from highly visible and authoritative to casual and low-key. Historically, authoritative leadership has been predominantly exhibited by men, but this pattern is changing as more women take up visible leadership roles.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691706/4f9828223de242e4801b4278efe062e8.mp3", "phrases2": [{"en": "a leader can define or clarify goals", "zh": "领导者能定义或明确目标"}, {"en": "mobilize people's energies", "zh": "调动人们的能量"}, {"en": "subtle, quiet persuasion", "zh": "微妙安静的劝说"}, {"en": "a charismatic leader like Martin Luther King Jr.", "zh": "像马丁·路德·金这样的魅力领袖"}, {"en": "leadership as a spectrum", "zh": "领导力是一个谱系"}, {"en": "authoritative leaders like the president", "zh": "像总统这样的权威领袖"}, {"en": "casual, low-key leadership", "zh": "随意低调的领导"}, {"en": "women have taken up visible leadership", "zh": "女性开始担任显性领导"}]}, {"id": 3798, "name": "Population growth", "phrases": ["population matters", "the world", "the kind", "the population", "obvious point", "the world population", "million people", "global climate change", "a challenge", "all problems"], "eng": "I hereby do not even need to elaborate too much why I think it is that population matters in the world. These are the kind of topics which are normally cited when thinking about the population, its challenges, its problems, its opportunities, and its own problems. After all, pressure on resources is a very obvious point. When the world population has now reached 7 billion and is increasing by 7 to 8 million people per year, a diminishing number of course. 70 700 800 But nonetheless it's still quite a challenge, particularly when global population is almost certain to add another 3 billion to that 6 billion with all kinds of questions as to the adequacy of resources, water, particularly in global climate change, but also food and other aspects of resources. 60 30 These are all problems of security because this growth will not be equally distributed between different parts of the world. Some parts of the world will grow. Other parts of the world will shrink. The balance of power, therefore, will correspondingly change for demographic reasons, as we will see. Urban growth is remarkable. We already have megacities of 20 million people. These are going to grow even further in due course. 2000 One wonders just how far they can grow before certain aspects of the infrastructure start breaking down.", "ref": "The speech talks about the population. The growing population is a challenge. It brings pressure on resources. Now we have 7 billion people, and they all need water, food, and other resources. These are all problems of security because the growth will not be equally distributed. This population growth will impact the balance of power. Urban growth is remarkable.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2691000-2692000/2691707/710547712b92434399f9d43e15b77389.mp3", "phrases2": [{"en": "pressure on resources", "zh": "资源压力"}, {"en": "the world population has reached 7 billion", "zh": "世界人口已达 70 亿"}, {"en": "increasing by 7 to 8 million per year", "zh": "每年增加 700 到 800 万"}, {"en": "adequacy of resources, water and food", "zh": "资源、水和食物的充足性"}, {"en": "problems
