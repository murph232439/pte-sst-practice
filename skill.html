 reducing early bud burst. 本次讲座重点探讨了春季物候提前现象，即植物开花期普遍提早的趋势。该现象主要由两大因素驱动：其一是持续上升的气温，其二是城市光污染——后者对花芽提前萌发的促进作用甚至远超温度变化的影响。讲座进一步指出，这种物候时序的紊乱会在生态系统中产生连锁反应，波及毛毛虫与鸟类等生物。不过研究也表明，通过优化城市照明方案能够有效缓解花芽过早萌发的问题。"}, {"id": 3357, "name": "Fire safety", "phrases": ["fire safety products", "fire extinguishers", "the European market", "fire alarm system components.They", "individual detection components", "the public", "the reassurance"], "ref": "BSI leads the way in testing and certification of fire safety products, including fire extinguishers, hoses, and alarm panels. They help clients to gain access into the European market. They test for compatibility of fire detection and fire alarm system components.They also perform tests on individual detection components. For the public, they provide the reassurance that fire safety products are effective and reliable. BSI在消防安全产品的测试和认证方面处于领先地位，包括灭火器、消防水带和报警面板。他们帮助客户进入欧洲市场，并测试火灾探测和报警系统组件的兼容性。他们还对单独的探测组件进行测试。对于公众来说，他们提供了消防安全产品有效性和可靠性的保证。"}, {"id": 3358, "name": "Smartphone apps", "phrases": ["computer scientist", "the initial focus", "water monitoring", "personal health monitoring", "the technology", "the functions", "the applications"], "ref": "Computer scientist and his team are developing new sensing systems. The initial focus was on energy and water monitoring. They paid attention to adapting the technology for personal health monitoring. They took advantage of all the functions built in our smartphones. The applications and their implications for our health and well-being may be more far-reaching than we ever imagined. 计算机科学家和他的团队正在开发新的传感系统。最初的重点是能源和用水监测。后来他们将注意力转向将这项技术应用于个人健康监测。他们充分利用了智能手机中内置的各种功能。这些应用及其对我们健康与福祉的影响，可能比我们曾经想象的更加深远。"}, {"id": 3359, "name": "The politics of happiness", "phrases": ["more countries", "happiness research", "an important measurement", "public policies", "publish official happiness statistics", "concrete actions", "a significant consideration", "future governance approaches"], "ref": "More countries are becoming interested in happiness research for policy making. Governments are exploring how public policies might change if they used happiness as an important measurement. Several developed nations including Australia, France and Britain are taking concrete actions by planning to regularly publish official happiness statistics. This development indicates that happiness is gradually becoming a significant consideration for policymakers in advanced economies, potentially shaping future governance approaches. 当前越来越多的国家开始将幸福研究纳入政策制定考量。各国政府正在探索，若将幸福感作为重要衡量指标，公共政策应如何相应调整。澳大利亚、法国和英国等发达国家已付诸实际行动，计划定期发布国民幸福指数官方统计。这一发展趋势表明，在发达经济体的政策制定过程中，幸福度正逐渐成为关键考量要素，未来可能深刻影响治理模式的变革。"}, {"id": 3360, "name": "Soot emission", "phrases": ["the major impact", "the lecture", "respiratory diseases", "global warming", "the speaker highlights", "a fast solution", "a complete fix", "soot emissions", "the talk"], "ref": "The lecture discusses the major impact of soot, or black carbon, on health and climate. Soot comes from burning materials like coal and wood, causing respiratory diseases and millions of deaths yearly. It also contributes significantly to global warming. The speaker highlights that reducing soot is a fast solution because it leaves the atmosphere quickly. While not a complete fix, cutting soot emissions can buy time to address CO2. The talk ends by urging public action and policy changes to tackle this problem. 本次讲座重点探讨了煤烟（又称黑碳）对健康与气候的重大影响。煤烟产生于煤炭、木料等物质的燃烧过程，不仅会引发呼吸系统疾病，更导致全球每年数百万人死亡，同时还显著加剧全球变暖。讲者特别强调，减少煤烟排放是一项收效迅速的气候对策，因其能快速脱离大气层。尽管这并非根本解决方案，但控制煤烟排放能为应对二氧化碳问题争取宝贵时间。讲座最后呼吁公众行动与政策改革共同应对这一环境挑战。"}, {"id": 3361, "name": "Government Blogging", "phrases": ["the lecture", "regular blogs", "two-way interaction", "the author", "the White House blog", "government bodies", "the government", "free speech", "the original purpose"], "ref": "The lecture discusses challenges of government blogging compared to regular blogs. Normally, blogs allow two-way interaction where readers comment or challenge the author. However, when government bodies like the White House blog, online comments often turn hostile or disrespectful, leading to chaos. To manage this, governments may need to moderate comments. But citizens might feel the government is controlling free speech. This creates a conflict: maintaining order or preserving open dialogue, which undermines the original purpose of blog interaction. 讲座讨论了政府博客与普通博客相比所面临的挑战。通常，博客允许双向互动，读者可以评论或挑战作者。然而，在政府机构，例如白宫博客下，网上评论往往变得充满敌意或不尊重，导致混乱。为了解决这个问题，政府可能需要缓和言论。但公民可能会觉得政府在控制言论自由。这就产生了一种冲突：维持秩序还是保留公开对话，而后者破坏了博客互动的初衷。"}, {"id": 3362, "name": "Linguists", "phrases": ["the lecture", "narrow language areas", "the right", "the speaker", "cultural dominance", "’ t regain control", "the language", "A Sydney student ’", "example highlights"], "ref": "The lecture emphasizes that communities, not linguists, should hold authority over their languages. While linguists have expertise in narrow language areas, they lack the right to control how communities use or develop their knowledge. The speaker explains that languages disappear due to cultural dominance. Even if the language is technically revived, it remains \"lost\" if communities don’t regain control. A Sydney student’s example highlights this: expertise unequal to authority. True revival requires returning decision-making power to the community. 该讲座强调，应该对自己的语言拥有权威的是社区，而不是语言学家。虽然语言学家在狭窄的语言领域拥有专业知识，但他们缺乏控制社区如何使用或发展他们的知识的权利。演讲者解释说，语言的消失是由于文化的支配。即使这种语言在技术上得到了复兴，如果社区不重新获得控制权，它仍然是“失落的”。一位悉尼学生的例子凸显了这一点：专业知识不等于权威。真正的复兴需要将决策权归还给社区。"}, {"id": 3363, "name": "Venus", "phrases": ["the lecture", "science fiction", "the space age", "earth-like planet", "sulfuric acid clouds", "5 missions", "earlier assumptions", "the Venus Express mission", "some Earth-like features"], "ref": "The lecture discusses how our understanding of Venus evolved from science fiction to scientific reality. Before the space age, people imagined Venus as a lush, Earth-like planet. However, in 1967, NASA’s Mariner 4 and 5 missions revealed its true nature: extreme heat and sulfuric acid clouds, making it uninhabitable. These findings disproved earlier assumptions. Recent data from the Venus Express mission shows some Earth-like features, but Venus remains vastly different from our planet. 讲座讨论了我们对金星的理解是如何从科幻小说演变成科学现实的。在太空时代之前，人们把金星想象成一个郁郁葱葱的类地行星。然而，在1967年，美国宇航局的水手4号和5号任务揭示了它的真实性质：极端的高温和硫酸云，使它不适合居住。这些发现推翻了早先的假设。来自金星快车任务的最新数据显示了一些类似地球的特征，但金星与我们的星球仍然有很大的不同。"}, {"id": 3364, "name": "Rice", "phrases": ["the Green Revolution", "the lecture", "research institutes", "a highyield rice variety", "five times", "two crops", "advanced genetic techniques", "global food production", "hunger worldwide"], "ref": "The lecture explains the Green Revolution, starting in 1943 when Mexico faced food shortages. To solve this, Research institutes were built in Asia. By 1962, they developed IR8, a highyield rice variety that produced five times more rice than traditional types without fertilizer, and ten times more with nitrogen. Later, IR36 resisted pests and allowed two crops yearly, doubling yields. By 1990, IR72 improved further with advanced genetic techniques. From 1960 to 2000, these modified crops dramatically increased global food production, reducing hunger worldwide. 本次讲座解析了始于1943年的\"绿色革命\"。当时墨西哥面临粮食危机，为应对此问题，科研机构在亚洲建立了实验基地。到1962年，科学家成功培育出IR8高产水稻品种——在不使用化肥的情况下产量达到传统水稻的五倍，施用氮肥后更可增产十倍。随后问世的IR36品种兼具抗虫特性并能实现一年两熟，使产量再度翻番。至1990年，通过先进遗传技术培育的IR72品种进一步提升了作物性能。在1960至2000年间，这些改良作物推动全球粮食产量大幅增长，有效缓解了世界范围的饥荒问题。"}, {"id": 3365, "name": "Aristotle", "phrases": ["the lecture", "aristotle ’", "t grasp abstract truth", "most people", "a soul —", "universal —", "the general public", "persuasion techniques"], "ref": "The lecture explains Aristotle’s view on rhetoric. He argues that rhetoric is necessary because most people can’t grasp abstract truth directly. Truth is like a soul—intangible and universal—while rhetoric acts as the body or tool to present it. According to Aristotle, only educated individuals can understand truth independently. For the general public, who are irrational or easily confused, persuasion techniques like stories or simplified ideas are needed to guide them toward truth. 讲座解释了亚里士多德的修辞学观点。他认为修辞是必要的，因为大多数人不能直接掌握抽象的真理。真理就像灵魂，无形而普遍，而修辞则是呈现它的身体或工具。亚里士多德认为，只有受过教育的人才能独立地理解真理。对于不理性或容易迷惑的普通大众来说，需要故事或简化想法等说服技巧来引导他们走向真理。"}, {"id": 3367, "name": "Superhuman", "phrases": ["the lecture", "superhuman strength", "move giant rocks", "some people", "a heated debate", "a large body", "anecdotal evidence"], "ref": "The lecture mainly talks about superhuman strength. It is said that some people have incredible power to lift a car or move giant rocks when facing disaster. There is a heated debate on whether these stories are true. According to a large body of anecdotal evidence, in a time of crisis or fear, it is possible for a person to temporarily gain massive strength, but late they couldn’t do it again. 这个讲座主要讲超人的力量。据说，有些人在面对灾难时，有不可思议的力量举起汽车或移动巨大的岩石。关于这些故事是否真实存在着激烈的争论。根据大量的轶事证据，在危机或恐惧的时候，一个人有可能暂时获得巨大的力量，但后来他们就不能再这样做了。"}, {"id": 3368, "name": "Bees talks", "phrases": ["aggressive rival bees", "predatory spiders", "the hive", "hive mates", "hive mates mid-dance", "perilous excursions"], "ref": "Bees perform this strange ritual when they encounter aggressive rival bees, for example, or predatory spiders hanging out at favored foraging spots. When they return to the hive, they headbutt hive mates performing the famous “waggle dance” that directs would-be foragers to rich sources of nectar. By halting their hive mates mid-dance, the scouting bees save them from perilous excursions. 例如，当蜜蜂遇到有攻击性的对手蜜蜂或在自己喜欢的觅食地点闲逛的掠食性蜘蛛时，它们就会进行这种奇怪的仪式。当它们回到蜂巢时，它们会用头撞着蜂巢同伴，表演著名的“摇摆舞”，引导潜在的觅食者找到丰富的花蜜来源。通过阻止正在跳舞的同伴，侦察的蜜蜂将他们从危险的短途旅行中解救出来。"}, {"id": 3369, "name": "Library", "phrases": ["an introduction", "a library", "functional areas", "every level", "the location", "the printers", "the front desk", "student cards"], "ref": "This lecture is an introduction of a library. It talks about functional areas and services in the library. Every level of the library has computers, and students can use it to process the problems and send and receive emails. It also talks about the location of the printers in the library. Students can use their student cards and when they need help, they can ask the staff at the front desk. 这个讲座是关于图书馆的介绍。它讨论了图书馆的功能区域和服务。图书馆的每一层都有电脑，学生可以用它来处理问题和收发电子邮件。它还谈到了图书馆中打印机的位置。学生可以使用他们的学生卡，当他们需要帮助时，他们可以问前台的工作人员"}, {"id": 3370, "name": "A ship", "phrases": ["human ’ s civilization", "a ship driving", "a wise course", "the features", "the civilization ship", "the only one", "the wisdom", "other creatures", "the world"], "ref": "This lecture talks about human’s civilization, which is a ship driving into the future. Firstly, by understanding the features of the ship, including compass and crew, people should find a wise course without delay. Secondly, the civilization ship is the biggest and the only one in our time. Human’s future depends on the wisdom of our actions. Thirdly, humans make achievements through trial and error like other creatures, but unlike creatures, humans cannot afford errors now. In conclusion, the world is small and humans cannot afford big mistakes. 这个讲座讲的是人类的文明，这是一艘驶向未来的船。首先，通过了解船的特点，包括指南针和船员，人们应该找到一个明智的路线，而不是拖延。第二，这艘文明船是我们这个时代最大的也是唯一的一艘。人类的未来取决于我们行动的智慧。第三，人类像其他生物一样通过试错来取得成就，但与其他生物不同的是，人类现在不能承受错误。总之，世界很小，人类不能犯大错误。"}, {"id": 3371, "name": "Psychologist", "phrases": ["psychologist Sigmund Freud", "the lecture", "a profound influence", "famous psychologist", "the beginning", "world war", "the development"], "ref": "The lecture is about psychologist Sigmund Freud. He is the most famous psychologist that has a profound influence on the 20th and 21st century. He spent most of his life in Vienna and died in London. At the beginning of world war two, the Nazis occupied where he lived. He is known for the development of and encompassing theory of mind. 这堂课是关于心理学家西格蒙德·弗洛伊德的。他是20世纪和21世纪最著名的影响深远的心理学家。他在维也纳度过了大半生，在伦敦去世。第二次世界大战开始时，纳粹占领了他住的地方。他以发展和包罗万象的心智理论而闻名。"}, {"id": 3372, "name": "Teaching", "phrases": ["the learning process", "the result", "new ideas", "interplay help speaker", "a successful professor"], "ref": "This lecture is about teaching and learning. Firstly, teaching is motivated by students' needs of learning. Secondly, it is important to consider the result and byproducts of the learning process. Thirdly, new ideas can stimulate and motivate students. Finally, the unity of research and teaching close connection, exercising as well as interplay help speaker become a successful professor. 这个讲座是关于教与学的。首先，教学的动机是学生的学习需要。其次，重要的是要考虑学习过程的结果和副产品。第三，新的想法可以刺激和激励学生。最后，科研与教学的结合、紧密的联系、锻炼与互动有助于演讲者成为一名成功的教授。"}, {"id": 3373, "name": "Wilson", "phrases": ["a famous writer", "a profound impact", "modern literature", "ordinary people", "some writers", "american life", "innovative literature"], "ref": "Wilson is a famous writer in the US, who have a profound impact on American culture. He thought modern literature should be read and appreciated by ordinary people. Although some writers’ work is difficult to read. Wilson made effort to establish American life and innovative literature, which is as equally great as Europe. He thought literature is a part of life for everyone, and encourage people to read more. 威尔逊是美国著名的作家，对美国文化产生了深远的影响。他认为现代文学应该被普通人阅读和欣赏。虽然有些作家的作品很难读。威尔逊努力建立起与欧洲同等伟大的美国生活和创新文学。他认为文学是每个人生活的一部分，并鼓励人们多读书。"}, {"id": 3374, "name": "Chest X-Ray", "phrases": ["a good example", "the biomedical technology", "the x-ray", "the help", "the doctor", "the integration"], "ref": "The picture of the x-ray is a good example using the biomedical technology. The x-ray can go through our body, and doctor can look into our bodies, which they cannot do it without the help of x-ray. We can see bones, organs in the x-ray. The doctor can diagnose it, and know what’s wrong with our body. It shows the integration of biomedical technology. x射线的图片是使用生物医学技术的一个很好的例子。x光可以穿过我们的身体，医生可以检查我们的身体，没有x光的帮助他们无法做到这一点。我们可以在x光片中看到骨头和器官。医生可以诊断，知道我们的身体出了什么问题。它展示了生物医学技术的融合。"}, {"id": 3375, "name": "Trade-offs triangle", "phrases": ["the biodiversity protection", "poor people", "the poverty issues", "a debate", "a win-win solution", "the answer", "the risk", "the economy"], "ref": "Poor people should not pay the price for the biodiversity protection. There is a debate about whether you can keep economic growth which can solve the poverty issues without damaging biodiversity. The answer is that it is impossible to reach a win-win solution among conservation, development and poverty. If you set bio-diversity as your goal, you run the risk of hurting the poor and the economy. 穷人不应该为保护生物多样性付出代价。人们争论的焦点是，能否在不破坏生物多样性的情况下保持经济增长，从而解决贫困问题。答案是不可能在保护、发展和贫困之间达成双赢的解决方案。如果把生物多样性作为目标，就有可能伤害穷人和经济。"}, {"id": 3376, "name": "Australian city", "phrases": ["the speaker", "some points", "australia ’ s location", "the world ’", "international trade", "a broad territory", "the Australian people", "5 cities", "isolated city"], "ref": "This lecture talks about Australia. According to the speaker, he has mentioned some points of view. Australia’s location is important for the world’s export. Its international trade is also important. Since Australia has a broad territory. The Australian people are mainly living in 5 cities which are Melbourne, Sydney, Brisbane, Perth and so on. Perth is one of the most isolated city in the world and there are two leading companies such as Telstra and Qantas which are based in Perth. 本讲座的主题是澳大利亚。演讲者提到了一些观点。澳大利亚的地理位置对世界出口非常重要。其国际贸易也很重要。澳大利亚幅员辽阔。澳大利亚人主要居住在墨尔本、悉尼、布里斯班、珀斯等五个城市。珀斯是世界上最偏僻的城市之一，有两家领先的公司，如 Telstra 和 Qantas 都设在珀斯。"}, {"id": 3377, "name": "Narratives", "phrases": ["visual description", "the speaker mentions", "the comics", "different kinds", "the second war", "own experience", "such way", "the speaker"], "ref": "This lecture is about visual description. Firstly, the speaker mentions about the comics with many people chatting in a room and it is a form of description. Secondly, the speaker mentions that people use different kinds of methods to describe a situation. Thirdly the speaker mentions that people have to use visual description when they don’t see the scene. He used own experience as an example describing the second war, his home town and the shelter his mother went to. In conclusion, in such way the speaker gets visual evidence to write his book. 本讲座的主题是视觉描述。首先，主讲人提到了许多人在一个房间里聊天的漫画，这是一种描述形式。其次，演讲者提到人们使用不同的方法来描述情境。第三，他提到人们在没有看到场景时必须使用视觉描述。他以自己的经历为例，描述了第二次世界大战、他的家乡和他母亲去的避难所。总之，作者通过这种方式获得了写作本书的视觉证据。"}, {"id": 3378, "name": "Climate change", "phrases": ["the influence", "climate change", "the speaker", "some points", "less production", "financial status", "many people", "the world economy"], "ref": "This lecture talks about the influence of climate change. According to the speaker, he has mentioned some points of view. Climate change will make less production and less food. It is difficult for developing countries to deal with climate change due to their financial status and other issues. There are many people living in hungry, especially in Africa. The climate change will also have negative effects on the world economy. 本讲座讲述了气候变化的影响。演讲者提到了一些观点。气候变化将导致减产和粮食减少。由于发展中国家的财政状况和其他问题，它们很难应对气候变化。许多人生活在饥饿之中，尤其是在非洲。气候变化还会对世界经济产生负面影响。"}, {"id": 3379, "name": "Shuttle", "phrases": ["a space truck", "the shuttle", "a multi-purpose vehicle", "versatile space vehicle", "the space lab", "scientific research", "the partnership", "the Russians", "the new international space station"], "ref": "The shuttle was a space truck. It's a multi-purpose vehicle. The shuttle is the most versatile space vehicle that has ever been built. People used it to launch and repair satellites and outfitted it with the space lab and used it to do scientific research. People used it as part of the partnership with the Russians, which is still continuing. People will use it to build the new international space station, which is a huge international partnership. 航天飞机是一辆太空卡车，它是一种多功能飞行器。航天飞机是有史以来用途最广的太空交通工具。人们用它来发射和维修卫星，用它来装备太空实验室，用它来进行科学研究。人们用它作为与俄罗斯人合作的一部分，这种合作仍在继续。人们将用它来建造新的国际空间站，这是一个巨大的国际伙伴关系。"}, {"id": 3380, "name": "A survey with 100 CEO", "phrases": ["the lecture", "a survey", "the beginning", "a huge influence", "the result", "the lectures", "financial management"], "ref": "The lecture mainly talks about a survey with 100 CEO. In the beginning of the lecture, the speaker mentioned that the survey is about which area of activity should contribute most effort. He further discussed that the result from the survey is IT, because IT make a huge influence on our society. And it is time consuming and complex. At the end of the lectures, he concluded that other two are marketing of sales and financial management and they are equally important. 讲座主要讲述了一项针对 100 名 CEO 的调查。讲座一开始，主讲人就提到，这项调查是关于哪个领域的活动应做出最大努力。他进一步谈到，调查的结果是信息技术，因为信息技术对我们的社会影响巨大。而这是一项耗时且复杂的工作。讲座结束时，他总结说，其他两个领域是销售市场和财务管理，它们同样重要。"}, {"id": 4273, "name": "King", "phrases": ["the Middle Ages", "a kingdom", "the key currency", "the duke", "a percentage"], "ref": "In the Middle Ages, a king ruled over a kingdom. To govern, he granted land or fiefs to others in exchange for loyalty and service. Land was the key currency. For example, a duchy was controlled by a duke. The duke provided loyalty, pledged fealty, supplied troops, and paid taxes, either in coinage or as a percentage of agricultural production. 在中世纪，国王统治着一个王国。为了治理国家，他会把土地或封地赐予他人，以换取忠诚和服务。土地是关键货币。例如，一个公国由公爵控制。公爵提供忠诚、宣誓效忠、提供军队并缴纳税款，税款可能是铸币形式，也可能是公国农业产出的百分比。"}, {"id": 4274, "name": "Knee", "phrases": ["a cracking knee", "the sound", "a high-end audio company", "an electrical engineer", "a few tiny mics", "stretchy athletic tape", "the primary application", "a decision aid"], "ref": "The sound of a cracking knee isn't particularly pleasant. An electrical engineer was building tiny microphones at a high-end audio company to listen up to the knee cracking sound. He and his team built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. The primary application they are targeting at first is to give people a decision aid during rehabilitation. 膝盖咔嚓作响的声音听起来并不悦耳。一位电气工程师在一家高端音响公司研发微型麦克风，专门捕捉这种膝盖发出的声响。他和团队用弹性运动胶带、几枚微型麦克风和皮肤传感器制作出原型设备。该设备的首要应用目标是为康复治疗中的患者提供决策辅助。"}, {"id": 4275, "name": "Smell of books", "phrases": ["a historic library", "most historic libraries", "an intensive smell", "the library", "an important way", "the smell", "the second place", "the majority"], "ref": "We’ve all been to a historic library. Most historic libraries have such an intensive smell of old books. People are asked to perceive the library. Indeed, the smell is an important way of how we communicate with the environment. The majority of people use sight to interact with the environment, but on the second place, the smell is also very, very important. 我们都去过历史悠久的图书馆。在大多数历史悠久的图书馆里，都有一种强烈的旧书味。人们通过感官体验来认识图书馆。事实上，气味是我们与环境交流的重要方式之一。大多数人通过视觉与环境互动，但其次，气味也非常非常重要。"}, {"id": 4276, "name": "Melatonin", "phrases": ["the lecture talks", "the Pineal Gland", "the size", "a rhythm", "the opposite", "the darkness hormone", "every species", "melatonin occurs", "a hormone"], "ref": "The lecture talks about melatonin. This hormone is synthesized in the Pineal Gland. It is very small, the size of a pea in your brain. This is where melatonin is made. It has a rhythm and it is the opposite of cortisol. It peaks at night, so we call it the darkness hormone. In every species studied, melatonin occurs at night. It prepares you for what your species does at night. Humans sleep, but animals like rodents are awake. It is a hormone related to darkness behavior. 这场讲座讲的是褪黑素。这种激素在松果体中合成。它非常小，在你大脑中只有豌豆大小。这里是制造褪黑素的地方。它有节律性，并且与皮质醇相反。它在夜间达到峰值，所以我们称它为黑暗激素。在每一个被研究的物种中，褪黑素都在夜间出现。它为你在夜间要做的事情做准备。人类在夜间睡觉，但像啮齿动物这样的动物在夜间是清醒的。它是一种与黑暗行为相关的激素。"}, {"id": 4277, "name": "A survey", "phrases": ["a hypothetical survey", "the lecture", "the survey ’ s design", "an online poll", "the critical role", "valid conclusions", "讲座通过一个假设性调查案例阐释样本偏差问题。尽管在线调查显示62 %"], "ref": "The lecture uses a hypothetical survey to illustrate sampling bias. While 62% of respondents in an online poll chose “Internet” as their primary news source, the survey’s design (conducted on globalandmail.com) means results only reflect heavy Internet users, not the general population. This highlights the critical role of methodology in ensuring valid conclusions. 讲座通过一个假设性调查案例阐释样本偏差问题。尽管在线调查显示62%的受访者将“互联网”作为主要新闻来源，但由于调查仅在globalandmail.com网站进行，结果仅反映重度互联网用户的行为，无法代表整体人群。这凸显了研究方法对结论可靠性的关键影响。"}, {"id": 4278, "name": "A new instrument", "phrases": ["the lecture talks", "accessible musical instrument", "special needs", "traditional instruments", "the Skoog", "own music"], "ref": "The lecture talks about the Skoog, a new universally accessible musical instrument. It is soft, easy to play, and customizable for anyone, especially children with special needs. Unlike traditional instruments, the Skoog uses software and sensors, so the computer makes the sound. Therefore, it is designed to be touched and played with. It was developed with feedback from kids in schools. This helps them create their own music instead of just listening. 这场讲座讲的是Skoog，一种全新的通用无障碍乐器。它柔软、易于演奏，并且可以为任何人定制，特别是有特殊需要的儿童。与传统乐器不同，Skoog使用软件和传感器，所以由电脑来发出声音。因此，它被专门设计成用于触摸和弹奏。它是在学校孩子们的反馈下开发出来的。这帮助他们创作自己的音乐，而不仅仅是聆听。"}, {"id": 4279, "name": "Bilingual kids", "phrases": ["the lecture", "preschool years", "’ brains", "leading parents", "each parent", "one language", "a specific speaker", "each language"], "ref": "The lecture discusses concerns about raising children bilingually, especially during preschool years. Many believe infants’ brains are inherently monolingual, leading parents to worry that hearing two languages at home might confuse their child. To reduce confusion, each parent can consistently uses one language. This helps children associate each language with a specific speaker. 讲座讨论了双语抚养孩子的问题，特别是在学龄前时期。许多人认为婴儿的大脑天生是单语的，这导致父母担心在家里听到两种语言可能会让他们的孩子感到困惑。为了减少混淆，每个家长可以始终使用一种语言。这有助于孩子们将每种语言与特定的说话者联系起来。"}, {"id": 4280, "name": "Stem cells", "phrases": ["the lecture talks", "stem cells", "undifferentiated cells", "specific functions", "all other kinds", "the potential", "regenerative medicine", "damaged tissue", "stem cell transplants"], "ref": "The lecture talks about stem cells. They are undifferentiated cells without specific functions. However, they have the potential to become all other kinds of cells to replace worn-out cells. Scientists hope to use them for regenerative medicine to replace damaged tissue or organs. For example, stem cell transplants can treat patients with blood diseases like leukemia. There are multiple kinds of stem cells used for medical treatments and research. 这场讲座讲的是干细胞。它们是未分化的细胞，没有特定的功能。然而，它们有潜力变成所有其他种类的细胞，以替换衰老的细胞。科学家希望将它们用于再生医学，以替换受损的组织或器官。例如，干细胞移植可以治疗像白血病这样的血液疾病患者。目前有多种干细胞被用于医疗治疗和科学研究中。"}, {"id": 4281, "name": "Dimension", "phrases": ["A dimension", "the number", "the Earth ’ s equator", "only longitude", "the Earth ’", "the space", "four-dimensional space", "four numbers", "a finger snap"], "ref": "A dimension is defined by the number of numbers needed to specify a location. For example, the Earth’s equator is one-dimensional because only longitude is required to pinpoint a location there. The Earth’s surface and the space above the Earth is two and three-dimensional respectively. Mathematically, dimensions aren’t limited to three—four-dimensional space needs four numbers, five-dimensional space needs five, and so on. An event, like a finger snap, requires four numbers to specify—three for its spatial location and one for the time it occurs. 维度由确定一个位置所需的数字数量来定义。例如，地球的赤道是一维的，因为只需经度就能确定那里的一个位置。地球表面和地球上方的空间分别是二维和三维的。从数学角度而言，维度并不局限于三维 —— 四维空间需要四个数字，五维空间需要五个数字，依此类推。像打响指这样的事件，确定它需要四个数字 —— 三个用于表示其空间位置，一个用于表示其发生时间。"}, {"id": 4282, "name": "Architecture", "phrases": ["the lecture", "napoleon III", "emperor Augustus", "old medieval streets", "wide new boulevards", "20,000 gas lamps", "50,000 trees", "200 miles", "a result"], "ref": "The lecture discusses Napoleon III's grand projects to transform Paris in the 1850s. He wanted to be like Emperor Augustus, turning a city of cobblestones into one of asphalt. He replaced old medieval streets with 85 miles of wide new boulevards. These were lit by 20,000 gas lamps and lined with 50,000 trees. He also built 200 miles of sewers. As a result, Paris became a much safer and more pleasant place for people to stroll and enjoy café life. 这场讲座讨论了拿破仑三世在19世纪50年代改造巴黎的宏伟工程。他想效仿奥古斯都皇帝，将一座鹅卵石城市变成沥青城市。他用85英里宽阔的新大道取代了古老的中世纪街道。这些大道由2万盏煤气灯照明，并种植了5万棵树。他还修建了200英里的下水道。因此，巴黎变成了一个更安全、更宜人的地方，供人们漫步和享受咖啡馆生活。"}, {"id": 4283, "name": "Thermodynamics and kinetic theory", "phrases": ["kinetic theory didn ’ t", "the 19th century", "material things respond", "kinetic theory states", "random motion", "the lecture", "thermodynamics laws"], "ref": "After the 19th century, thermodynamics and kinetic theory didn’t blend properly. Thermodynamics has its roots in how material things respond to heat and temperature, whose laws were thought to be absolute. But kinetic theory states matter consists of atoms in random motion, creating fluctuations where thermodynamics laws can be violated. This raises questions. The lecture concludes thermodynamics laws are obeyed on average but can be violated during unusual fluctuations. 19世纪以后，热力学与动力学理论未能很好地融合。热力学源于物质对热量和温度的响应，其定律曾被认为是绝对的。但动力学理论认为，物质由处于随机运动中的原子组成，这种运动会产生涨落，使得热力学定律在某些情况下可能被打破。这引发了一系列问题。讲座最后指出，热力学定律总体上是成立的，但在异常涨落期间可能被暂时违反。"}]}, "errors": [{"part": "SST", "name": "Transportation network in Paris", "bad": "Paris has an extensive public transporiation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m.", "good": "Paris has an extensive public transportation system with the metro and RER trains. The metro has 16 lines distinguished by different colors, while the RER has five lines labeled ABCDE. Trains operate from 6:00 a.m.", "type": "拼写", "hint": "找出拼错的单词 var MODE='card',PART='sst',FIXIDX=0,FIXORDER=[];
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function hdr(){document.getElementById('subtabs').style.display=(MODE==='fix')?'none':''}
function renderList(kw){
  kw=(kw||'').toLowerCase();
  var arr=D.cards[PART].filter(x=>!kw||x.name.toLowerCase().includes(kw));
  document.getElementById('list').innerHTML=arr.map(x=>'<div class="card" data-id="'+x.id+'"><div><div class="cname">'+esc(x.name)+'</div><div class="cmeta">'+x.phrases.length+' 个关键词组</div></div><div class="go">开始 →</div></div>').join('')||'<div style="text-align:center;color:#98a0ae;padding:40px">没有找到</div>';
}
function cardMode(item){
  var h='<span class="back" id="back">← 返回</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div><div style="font-size:13px;color:#98a0ae">用这些词组把整篇内容串起来，先说一遍，再看范文。</div></div>'+
  '<div class="panel"><ol class="phlist">'+item.phrases.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ol>'+
  '<div class="row" style="margin-top:6px"><button class="bigbtn ghost" id="showRef">看范文</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">参考范文</div><div class="ref">'+esc(item.ref)+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>renderList(document.getElementById('q').value);
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
}
function buildMode(item){

  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');

function fixMode(){
  if(!FIXORDER.length){FIXORDER=shuffle(D.errors.map((_,i)=>i));FIXIDX=0;}
  var e=D.errors[FIXORDER[FIXIDX]];
  var angles=[...new Set(D.errors.filter(x=>x.name===e.name).map(x=>x.type))];
  var h='<div class="counter">第 '+(FIXIDX+1)+' / '+FIXORDER.length+' 段　'+e.part+' · '+esc(e.name)+'</div>'+
  '<div class="panel"><div class="errbad">'+esc(e.bad)+'</div>'+
  '<div style="font-size:13px;color:#98a0ae;margin-bottom:8px">把这段里的错误改过来，改完点看答案。</div>'+
  '<textarea id="ta" placeholder="写出改正后的段落..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showAns">看答案</button><button class="bigbtn" id="next">下一段 →</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">改错角度</div><div class="angle">'+angles.map(a=>'<span>'+esc(a)+'</span>').join('')+'</div>'+
  '<div class="lbl">正确段落（绿色是改对的部分）</div><div class="diff">'+e.diff+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('showAns').onclick=()=>document.getElementById('ans').classList.add('on');
  document.getElementById('next').onclick=()=>{FIXIDX=(FIXIDX+1)%FIXORDER.length;fixMode();};
}
document.getElementById('tabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;

};
document.getElementById('subtabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;

};

};
