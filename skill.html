1.mp3"}, {"id": 4457, "name": "Los Angeles", "phrases": ["1781 Los Angeles", "los Angeles", "sixty-five years", "the discovery", "a fortune begin", "the rush", "the small town", "the Los Angeles River", "a recent two years", "a new water source"], "eng": "In 1781 Los Angeles is established and named Pablo de la Renta de Los Angeles by forty-four families from Mexico as a fort for soldiers. 1781 “ · · · ” More than sixty-five years later, the discovery of gold and silver medal draws settlers from across the country to northern California. After the rush for gold dies down, Americans had flocked to Northern California for a fortune begin to disperse and settle parts of Southern California. By 1870, the small town of Los Angeles has gained more than five thousand six hundred residents, which multiplies nearly 20 times by the turn of the century. 1870 20 The rapidly increasing population puts additional strain on the Los Angeles River, the city's main source of water, which has not been helped by a recent two years of drought. —— —— In order to avoid tragedy, a new water source has to be found. The city of Los Angeles is a development as an urban center and a growing thirst for water facilitated the triumph of the creation of the Los Angeles Aqueduct, but simultaneously led to the tragedies of St. Francis Dam and the draining of important landmarks like Mono Lake and Owen Zone. In the year 1900, the city of Los Angeles is growing faster than its water resources, a need for the city is as clear as the water they need. 1900 In 1902, Irish American civil engineer William Holland was named superintendent of the Los Angeles Water Department. 1902 · Soon after the department began considering options to quench the city of Los Angeles's growing thirst, they eventually settled on a lake.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693055/72ca6701588d44ae88732b21f6a27a51.mp3"}, {"id": 4458, "name": "Neolithic stones", "phrases": ["a mathematician", "a museum", "the first examples", "5,000 years", "a practicing mathematician", "a symmetrical manner", "a connection", "the intriguing things", "divination —", "the future"], "eng": "I suppose you wouldn't expect perhaps to find a mathematician in a museum of historical objects, but actually, the objects that I've been drawn to in this museum have quite a lot of mathematical significance. These Neolithic stones, discovered in Scotland, dating back 5,000 years, are probably the first examples of humans exploring the concept of symmetry. And that's what I do as a practicing mathematician. I spend my life trying to understand what symmetries are possible, in nature and in mathematics and abstractly. And here I've got a connection, going back 5,000 years, to people who are already trying to understand–how can I arrange patches on the side of these stone balls in a symmetrical manner? —— One of the intriguing things about these stones is that we don't actually know what they're for. They might have been for divination—trying to predict the future. —— They might have been part of a game. They look very much like dice, but we don't really think there is any game associated with them. Maybe they were just for chucking around, they're very nice in the hand when you hold them. Or maybe they were symbols of power in the clan. I suppose that's why I like them because we don't really know what they are. —— If I had a theory about why they were doing this it would be that actually, they were starting to be mathematicians, and that here we see the first example of abstract thought at work. That these weren't for a purpose. Mathematics is a great subject, created a lot of the technology around us, but mathematicians we create our mathematical objects for the joy and the beauty, so it will be lovely to think that these didn't actually have a use, that they were just really a celebration of what's possible. “ ”", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693056/3403a847be504bb4a643d219020342c7.mp3"}, {"id": 4459, "name": "Poetry", "phrases": ["an important part", "the knowledge", "the literature", "the oldest form", "the origin", "epic poems", "the stories", "the English language", "a feeling", "poems use"], "eng": "Today, poetry means an important part of art and culture. We often talk about the knowledge about the literature in poems. Poetry is from the oldest form of literature, probably predates the origin of writing itself. The oldest written manuscripts we have are poems. Mostly epic poems tell the stories of ancient mythology. The English language in poems and poetry is difficult to understand, often giving readers a feeling of frustration, making it hard for readers to enjoy poetry. This is because poems use literary expressions. Poetry was once written according to fairly strict rules of meter and rhyme, and each culture has its own rule. Some poems incorporate rhyme schemes with two or more lines that end in like-sounding words. You should learn to simply enjoy it to know more about literature knowledge.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693057/3cdfec5af93147168d993979edc59b95.mp3"}, {"id": 4460, "name": "The internet requires energy", "phrases": ["the other bits", "the Internet", "cell phone towers", "massive data centers", "— — Today", "billion things", "every credit card reader", "every cell phone", "a single phone", "a laptop"], "eng": "The Internet is pretty great, this wouldn't be a thing without it, but getting this video and all the other bits of the Internet to you uses a lot of energy. What we call the Internet is made up of a lot of things, wires traversing the ocean, satellites and cell phone towers, massive data centers sending packets of information all over, and devices — so many devices! —— Today, there are more than 30 billion things connected to the Internet. 300 That's every cell phone, laptop, and tablet, but also every credit card reader, creepy, all-hearing speaker, newfangled fridge with a TV on the front end, and more things coming online every day. Every single one of these devices requires electricity. Charging a single phone or a laptop doesn't use that much energy, but powering billions of Internet-connected devices adds up. It's hard to estimate exactly how much because things are changing too fast, even count. But in total, Internet-connected devices probably use in the neighborhood of five percent of the world's electricity. Once you've got your Internet portal charged and ready to go, streaming a video or posting a pic on Instagram, draws on power from data centers distributed around the world. Instagram After devices, data centers are the Internet's next biggest energy hog, using around one or two percent of the world's total electricity. 1% 2% And most of this electricity comes from burning fossil fuels, which release greenhouse gases into the atmosphere. But when compared to all the other things that produce greenhouse gases like transportation, which causes almost a quarter of global emissions, the unit is doing all right. —— —— In total, it contributes only around two percent of global emissions. 2%", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693058/6f123563eaa84765bca0c39220f16fa8.mp3"}, {"id": 4461, "name": "Andrew Carnegie", "phrases": ["andrew Carnegie", "a fabric mill", "telegraph office", "the railroad system", "an oil company", "the money", "investment return", "american steel", "a huge steel factory", "million dollars"], "eng": "Andrew Carnegie was born in Scotland in 1835. · 1835 His family moved to America when he was 13 and settled in Pittsburgh. 13 He found jobs working in a fabric mill and telegraph office. Carnegie always did well at whatever he set his mind to. He was known to make improvements to any job he held. While working for the telegraph office, he began studying the railroad system, and he soon became the superintendent. He took the money he had saved and invested in an oil company. His investment return was good and then he went to England to learn how to make steel. He wanted to make steel that was cheaper and more durable than American steel. He came back with his knowledge and built a huge steel factory. Carnegie's factory was very successful and he sold it for 480 million dollars. 4.8 Carnegie was a very wealthy man but he was more interested in philanthropy than spending his money on himself. He spent the rest of his life giving his money away to worthy causes. Reading and learning were very important to him, so he built many libraries. He also established universities and research institutes. Carnegie built hospitals, museums, and theaters. One of the most recognizable buildings he built was Carnegie Hall in New York City. Carnegie Hall hosts many concerts and symphonies each year and is an important part of New York City culture. Andrew Carnegie passed away at the age of 83. · 83 In his lifetime he gave away 90% of his fortune. 90% He is known as a man who was selfless and wanted to do good for others.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693059/428cef8ba0674fa784fee768a4dc47a1.mp3"}, {"id": 4462, "name": "Free sugars", "phrases": ["milk contain sugar", "both fruits", "many people", "ice cream etc", "unhealthy sugar", "excess sugar", "free sugars", "natural parts", "food companies", "a healthy approach"], "eng": "Both fruits and milk contain sugar, and this sugar is healthy sugar. Many people have heard that sugar is bad, and think that this must also therefore apply to fruits. Unhealthy sugar is normally found in desserts, ice cream etc. It's much easier to consume excess sugar from foods and drinks that contain \"free sugars\". “ ” Free sugars include these same sugars, but in this case they have been removed from their naturally occurring source, rather than being eaten as natural parts of fruits, dairy products, and some vegetables and grains. This includes sugar that is added to food and drinks by food companies, cooks or consumers. Many people drink juices, and this is a healthy approach. But directly eating fruits is better, because the human body can process it easily. It is better to eat a small piece of fruit, which our bodies can digest better rather than drink smoothies or more than half a cup of fruit juice because it is the same as drinking soft drinks.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693060/1301c3b555204c7e8abeb2c5c62cb4a6.mp3"}, {"id": 4463, "name": "Boys and girls", "phrases": ["a higher level", "the same class", "male students", "the developments", "the content analysis results", "female students", "the passive social role", "the general social structure", "the fact", "previous studies"], "eng": "The research shows that girls have a higher level of English results than boys in the same class, because boys and girls are different in learning styles, and their brain functions are different in mechanisms. Male students were detected to be significantly more aware of the developments in the field of physics than female students. According to the content analysis results concerning this finding, unlike female students male students were more interested in technological developments. This finding is not surprising when the passive social role of females and the general social structure in which they tend to more sociable fields are considered. This finding may have occurred due to the fact that males are generally more interested in technology than females. Previous studies support this finding. Boys are more simplified, and teachers' teaching style normally suits girls better than boys. Teachers should find different teaching approaches respectively for boys and girls.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693061/18deb212f44a4680b6c42a0a77b1e05a.mp3"}, {"id": 4464, "name": "Hook sentence", "phrases": ["an essay", "a chance", "a writer", "many materials", "worth attention", "the first couple", "the introduction", "the reader", "— — Build", "an emotional connection"], "eng": "An essay is a chance to identify your read and learned. As a writer, you first need to collect many materials, then write an essay in four or five paragraphs, structures and quotes. If someone is searching for a book or article to read, he or she will decide from the very beginning whether this work is worth attention. If you want to wow your teacher, polish the introduction, especially the first couple of sentences. Add an essay hook — something interesting, funny, shocking, or intriguing to win the reader's attention. —— Build an emotional connection with your reader right from the start. A hook in the essay is a catchy sentence or paragraph in the impressive introduction which serves as an attention element and an important part. “ ” An excellent hook sentence is engaging and interesting; it is a perfect method to start an argumentative or persuasive essay. The hook for your essay often appears in the first sentence. The opening paragraph includes a thesis sentence. Some popular hook choices can include using an interesting quote, a little-known fact, famous last words, or a statistic.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693062/3e1641c96107478eabd7d410b519ad6f.mp3"}, {"id": 4465, "name": "Paper rejection", "phrases": ["a disappointing experience", "some advice", "young researchers", "a troubling issue", "many things", "the chance", "the beginning", "a better result", "the career path", "another journal"], "eng": "Rejection happens to all of us, and it can be a disappointing experience. I will now give some advice for young researchers. Many things have changed today, which can be a troubling issue. The chance of getting a paper published is becoming smaller and smaller. Although it never is easy to take, rejection is particularly hard at the beginning of your career. But rejections will lead to a better result and will be good for the career path. Use this feedback to improve your paper for submission to another journal as well as your next, more robust study of the topic. Usually, several individuals with expertise in the topic have donated substantial time to provide detailed advice to advance your paper and future work. Also, remember that publication does not mean funding. Investors will learn how to attract and engage young researchers at the same time.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693063/ae72bdecb2c448bca190034b63971eda.mp3"}, {"id": 4466, "name": "The stability of mood", "phrases": ["a unique trait", "emotional stability", "a roller coaster ride", "some individuals", "a certain level", "happiness lies", "a delicate balance", "the natural ebb", "the optimal emotional state", "a moderate level"], "eng": "Emotional stability is a unique trait that differs from person to person. For some individuals, their moods fluctuate dramatically, resembling a roller coaster ride, while others present a consistently composed and relaxed demeanor. Studies have suggested that the key to achieving happiness lies in maintaining a certain level of emotional containment. It is a delicate balance between maintaining a sense of control while also allowing for the natural ebb and flow of emotions. The optimal emotional state appears to be characterized by a point of equilibrium, wherein there is a moderate level of emotional containment and resilience. Essentially, the secret to emotional well-being involves finding this balance. It means navigating between intense and loose emotions, striving for a state of gentle containment coupled with a poised resilience. This harmonious emotional state ultimately grants an individual a sense of contentment and well-being. Therefore, understanding and achieving this delicate equilibrium is essential for emotional health and happiness.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693064/27ea476b5d51424ba6f5f1fe72bafdcf.mp3"}, {"id": 4467, "name": "A good engineer", "phrases": ["a complicated system", "the engineering course", "the answers", "personal life experience", "daily life", "the common everyday life", "the tiny things", "microsoft systems", "the system", "the new outcomes"], "eng": "Today, this course you are going to take is about what engineering is and how to work with a complicated system. “ ” “ ” You guys should know the answers, because all of you guys are from the engineering course. Especially, when you design, build, debug and develop something new, during these process, you are working with the complicated system. How to program complicated systems and how would you know it actually works before producing it. Inspirations are from your daily life, you probably need to consider your personal life experience. And from the common everyday life to the tiny things that you cannot see virtually, and the inspirations normally exist in the tiny levels. A complicated system such as your laptops running Microsoft systems. That means the system is not able to see, which means you guys have to virtualize it. Engineering is here to help virtualize by using systems. Nowadays, the complicated systems are relatively reliable, and you guys work upon these and need to deliver the new outcomes which are reliable as well. This is what we do now and we are good at. Engineering is to help virtualize by using systems. In order to develop and produce a reliable system, you need to consider more on the risks, potential, predictability and accuracy.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693065/28e1c1f7fe244e7ea3561558d7a2b50c.mp3"}, {"id": 4468, "name": "Luxury brand", "phrases": ["the question today", "a luxury brand", "the standard business response", "high price", "small amounts", "the standard output", "the reality", "the only way", "one color television", "two televisions"], "eng": "The question today is, what makes a luxury brand a luxury brand and how do we distinguish it is very hard to answer. “ ” “ ” The standard business response is to say, 'they are more exclusive'. “ ” And we get exclusivity by having high price and relatively small amounts of the product available. The reality, however, of luxury brands is that they are sold in their millions, and in some cases, are not priced that much higher than the standard output. The only way I can really answer your question is to say, it is all relative. As you said in your introduction, it wasn’t that long ago in Australia that we would have considered two televisions to be a luxury, or even further back, one color television. And you can make a strong argument, for example, that Starbucks in China, right now, is a luxury purchase – because of its cost, because of how frequently it is purchased by many people. —— So, I think the long answer is a complicated one, but the answer is, it depends who you talk to. I think in the business community what we would say, is that there is a small cluster of 'more expensive brands' which have a distinct strategy that we would identify as being 'luxury brands' and they start with the Rolls Royces and the Tiffanys and the Louis Vuittons of the world. “ ” “ ” And, I think that tends to be how we see them.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693066/561a9a9de48a40a3ac25945f303d10ec.mp3"}, {"id": 4469, "name": "Curator", "phrases": ["the National Museum", "extension history courses", "a curator", "the kinds", "particular kind", "the kind", "an uncontested view", "material culture", "other people", "other historians"], "eng": "I am going to talk today mostly about what I do as a curator here at the National Museum of Australia but I want to draw some generalities from that in terms of a series of curatorial practices, tools, techniques and methods that I think could be of interest to your students and to you in developing extension history courses. I want to talk about what I do as a curator and then from that also talk a bit about the kinds of history that I think museums are particularly good at creating and communicating. I think this is something I would really like to discuss because it is not necessarily very well understood is that I think museums, as Dave insisted by putting up my quote in his slide, create a very particular kind of history. Dave It’s not the kind of history that gets created in books or in dating films or in compositions, it’s a very particular kind of history that grows out of the fact that museums are centrally interested and defined by their collections. I should say that is not an uncontested view of museums but it is certainly my view of museums. Curators try to understand material culture as evidence of other people’s lives as a means to try to understand other people - what they look like, what they did, how they made a living, what they hoped for in their lives, how they tried to construct their world and why they made particular choices. —— One way in which curators differ from other historians is therefore in terms of how we interrogate the past, what elements we use to communicate the past. Most academic historians are trained very much in the discipline of words and they concentrate on words still today, although it is changing a little bit. If you go through university history primarily you are encouraged to draw on things like archival accounts, manuscripts and now oral histories, and most of that work is actually promulgated in the form of books. There are also other kinds of historians. Obviously, filmmakers and photographers concentrate on creating images of the world and arranging them in meaningful sequences, but curators attend to objects. We look at objects as evidence of the past and try to arrange objects in meaningful ways called exhibitions.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693067/a6f38701ceaa4203ace15d85bcaab75e.mp3"}], "rl": [{"id": 1568, "name": "Double pendulum", "phrases": ["the chaos physics equation", "a double pendulum", "coupled differential equations", "the equation", "the pendulum bob", "the initial angles", "the double pendulum intriguing", "initial conditions", "the smallest deviation", "the starting position"], "eng": "The chaos physics equation for a double pendulum is a fascinating topic that explores the intricate dynamics of this system. The equation involves a set of coupled differential equations that describe the motion of the two linked pendulums. Factors such as the length of each arm, the mass of the pendulum bob, and the initial angles of displacement all contribute to the complexity of the equation. What makes the double pendulum intriguing is its sensitivity to initial conditions. Even the smallest deviation in the starting position or velocity can lead to drastically different outcomes. This phenomenon, commonly known as the butterfly effect, highlights the chaotic nature of the double pendulum's motion. The chaos physics equation for the double pendulum has practical relevance in various fields, such as robotics and physics education. Researchers use computer simulations and physical models to experiment with this system, gaining insights into its nonlinear behavior. In conclusion, the chaos physics equation for the double pendulum showcases the complexity and unpredictability of its motion. This system serves as an intriguing example of chaos theory, reminding us of the intricate dynamics hidden within seemingly simple physical systems.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658427/5d8f2912274c4f4b8d02d506016825e9.mp3"}, {"id": 1569, "name": "Leadership", "phrases": ["an executive order", "an interesting idea", "the coercive threat", "quiet persuasion", "martin Luther King Jr", "a charismatic leader", "the power", "the leader wields", "a spectrum", "the United States"], "eng": "A leader can define or clarify goals by issuing a memo or an executive order, an edict or a fatwa or a tweet, by passing a law, barking a command, or presenting an interesting idea in a meeting of colleagues. Leaders can mobilize people's energies in ways that range from subtle, quiet persuasion to the coercive threat or the use of deadly force. Sometimes a charismatic leader such as Martin Luther King Jr. can define goals and mobilize energies through rhetoric and the power of example. · · We can think of leadership as a spectrum, in terms of both visibility and the power the leader wields. On one end of the spectrum, we have the most visible: authoritative leaders like the president of the United States or the prime minister of the United Kingdom, or a dictator such as Hitler or Qaddafi. At the opposite end of the spectrum is casual, low-key leadership found in countless situations every day around the world, leadership that can make a significant difference to the individuals whose lives are touched by it. Over the centuries, the first kind, the out-in-front, authoritative leadership, has generally been exhibited by men. Some men in positions of great authority, including Nelson Mandela, have chosen a strategy of \"leading from behind\"; more often, however, top leaders have been quite visible in their exercise of power. · “ ” Women (as well as some men) have provided casual, low-key leadership behind the scenes. But this pattern has been changing, as more women have taken up opportunities for visible, authoritative leadership.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678142/53e49702dca24eee846ba436449246b6.mp3"}, {"id": 1570, "name": "Globalization", "phrases": ["the world", "40 years", "a remote village", "a global pandemic", "the global economic system", "thirty years", "the miracle", "the planet", "bad stuff", "the stuff"], "eng": "I've been thinking a lot about the world recently and how it's changed over the last 20, 30, 40 years. 20 30 40 Twenty or thirty years ago, if a chicken caught a cold and sneezed and died in a remote village in East Asia, it would have been a tragedy for the chicken and its closest relatives, but I don't think there was much possibility of us fearing a global pandemic and the deaths of millions. Twenty or thirty years ago, if a bank in North America lent too much money to some people who couldn't afford to pay it back and the bank went bust, that was bad for the lender and bad for the borrower, but we didn't imagine it would bring the global economic system to its knees for nearly a decade. This is globalization. This is the miracle that has enabled us to transship our bodies and our minds and our words and our pictures and our ideas and our teaching and our learning around the planet ever faster and ever cheaper. It's brought a lot of bad stuff, like the stuff that I just described, but it's also brought a lot of good stuff. A lot of us are not aware of the extraordinary successes of the Millennium Development Goals, several of which have achieved their targets long before the due date. That proves that this species of humanity is capable of achieving extraordinary progress if it really acts together and it really tries hard.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678143/1640b3caebe340d3a589b857864c3bf5.mp3"}, {"id": 1571, "name": "Measuring food", "phrases": ["clinical weight-loss", "portion size", "real-world settings", "good way", "some scales", "objective way", "hands-on approach", "primary school maths", "the dimensions", "the geometric volume formulas"], "eng": "I'm a dietitian and I work in clinical weight-loss recently. Accurately estimating portion size is critical in research or real-world settings. For example, if you're trying to watch your weight and you're out to dinner and you're presented with a bowl of food, there's no really good way to actually estimate how much you're eating unless you're gonna whip some scales out of your bag. So we wanted to find a more objective way for people to quantify what they're eating when they're out and about. I came up with a more hands-on approach. We got people to measure the dimensions of the food using the width of their fingers and remembering back to primary school maths. We use the geometric volume formulas to estimate the weight of the food. To show you how this works, I've ordered a piece of lasagna. And that's my box, a glass of wine and that's my cylinder. —— And I'm feeling pretty healthy, so I order some watermelon for dessert. And that's my wedge. So this was I know it's seven by five, by four fingers. In the future, I see this method be incorporated into smartphone applications. So you put your finger, it's in along with your height and your weight. And the app will do all of the calculations for you. And then you've got a more accurate way to estimate the portion size.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678144/1163c8dfa5fb4e829bee66d3a99b7666.mp3"}, {"id": 1572, "name": "Innovation and invention", "phrases": ["innovation equals invention", "the same thing", "innovation equals", "the world", "some great satisfaction", "an invention", "a technology", "innovation equals invention times commercialization", "a new idea", "innovation something"], "eng": "He says innovation equals invention. Let me just stop here. Innovation equals invention often people mistake these two things for the same thing. Innovation equals invention, they are not. Innovation is something that generates value for the world. It makes something faster, better, cheaper. It gives someone some great satisfaction. An invention is an idea, a technology, a patent. In and of itself, it does not generate value. So these two are not the same thing. And sometimes you see them interchange. And that's not correct. So innovation equals invention times commercialization. So and when we look at this equation of innovation something of value, it requires a new idea and then it requires someone or some organization that is going to commercialize that idea and to make it a value to the world. ——", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678146/d41dbd6cbbff49289eae21b09d395a4e.mp3"}, {"id": 1573, "name": "Three types of questionnaires", "phrases": ["the steps", "own questionnaires", "a few terms", "three types", "level measurement", "category-type questions", "nominal questions", "ethnic origin", "ordinal-type questions", "category questions"], "eng": "What I've decided to provide is the steps that I take when analyzing my own questionnaires. However, before I begin, it would be useful to remind you of a few terms we use when talking about questionnaires. Questions can be divided into three types. This is sometimes called level measurement. Firstly, we have category-type questions, which are also known as nominal questions. These are when participants select from a list of categories for their response, such as male or female or they may include ethnic origin. Secondly, we have ordinal-type questions. These are similar to category questions. But instead of the categories being independent, there is some sort of order between them. If we ask people to indicate their age in categories, this is an ordinal type question. Thirdly, we have continuous questions. These are any questions that can be answered by a number. It could be an open-ended question asking participants to tell you how many times they attended lectures or how often they used a VLE. VLE Or it could involve asking them to rate the importance or intensity of some experience.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678147/c33aa756f07348dc84850d29451ee2d3.mp3"}, {"id": 1574, "name": "Discovering the port of Roman London", "phrases": ["the port", "the historical records", "roman London", "the first century", "third century", "the late third century", "the fourth century", "the history", "the archaeological evidence", "the material evidence"], "eng": "But what we are going to discuss today is how the port of London was discovered and what we discovered about it. Now if you look at the historical records of Roman London, there is only about 14 actual references to London in antiquity and contemporary references. 14 And all those only one is in the first century, there are none at all at the second or third century. There is only one in the late third century and there are four in the fourth century. So if you are a historian trying to write the history of Roman London, it's really difficult. You don't have much data, you're going to depend on the archaeological evidence, the material evidence of the port and indeed the town to have any understanding of what happened then. And so, what we're looking at here is how did we discover about the port of London, there is no historical documentation, no customs books, no tariffs, no idea of the taxes. We have to understand the port entirely from the archaeological evidence. So that's what we are going to do today. So, if we move on to the next slide, I love live streaming. Thank you very much.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678148/b0873f2b92844c50b8b276a2e60bdbf2.mp3"}, {"id": 1575, "name": "Licking and grooming", "phrases": ["the stress reactivity", "the study", "LG LG refers", "the level", "the experiment", "moderate stress reactivity", "the findings", "significant implications", "a nurturing", "an increased stress reactivity"], "eng": "The study explores the impact of maternal licking and grooming (LG) on the stress reactivity of adult rats. LG LG refers to the level of attention and care provided by mother rats to their offspring through licking and grooming behaviors. LG The experiment examined the effects of high and low levels of LG on the stress reactivity of the rats as they grow into adulthood. LG The findings reveal that high LG leads to a more moderate stress reactivity in the rats. LG This has significant implications as it suggests that a nurturing and attentive environment during infancy can potentially reduce the risk of poor development and diseases later in life. On the other hand, low LG results in an increased stress reactivity in the rats. LG This, in turn, elevates the risk for various health conditions such as heart disease, type II diabetes, alcoholism, affective disorders, and brain aging. Ⅱ These findings highlight the crucial role of maternal care and attention in shaping the stress response system in offspring. It demonstrates that early experiences and maternal care can have long-lasting effects on an individual's stress reactivity and overall health. This study underscores the importance of providing nurturing and supportive environments for infants to promote optimal development and reduce the risk of various health issues in adulthood.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658437/9d4e88b3ff544def9c2191c9eb1ed2b0.mp3"}, {"id": 1576, "name": "Politics and international relations", "phrases": ["an in-depth understanding", "the exciting disciplines", "the complex field", "the workings", "public policy", "public administration", "four compulsory units", "two majors", "a wide choice", "national security studies"], "eng": "This course provides students with an in-depth understanding of the exciting disciplines of politics and international relations. Students will learn about the workings of political institutions in countries around the world and explore the complex field of relations between nations. Topics in governance, public policy, public administration, national security and border control ensure that students receive a broad and current education in the range of issues which are covered under the label of politics and international relations. Students will undertake four compulsory units and two majors, one in politics and international relations and the other in governance and policy. They will also choose an elective major from a wide choice of options including political communication, international studies, international business and national security studies. In addition to acquiring specialist knowledge and competencies in Politics and International Relations and Commerce, students will graduate with a range of generic skills such as critical thinking, enhanced communication abilities, problem-solving and strong capacities to work with others. They will also develop ethically based and socially responsible attitudes and behaviors.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678149/ea90fda305dc4116aabe237d49d1dd21.mp3"}, {"id": 1578, "name": "Technology erode privacy", "phrases": ["an informed debate", "a society", "a human right", "the Universal Declaration", "the physical world", "all kinds", "obscured glass", "the real world", "the privacy", "automatic number plate recognition"], "eng": "So that creates tensions and that's what I want to talk about. Because I think it’s important we are as a society able to have an informed debate about how much privacy is enough but not too much, how much security is enough but not too much. Privacy is a human right that simply quoting the Universal Declaration. In the physical world, we’ve got all kinds of protections. There is evidence that we care about our privacy: we’ve got doors, we’ve got obscured glass, we’ve got locks, we wear clothes, we put up shutters. And technology continues to erode the privacy that exists in the real world in the three spatial dimensions. Security cameras, automatic number plate recognition take away anonymity. Long lenses paparazzi take away distance and the privacy that used to create. And body scanners are increasingly being used to see through clothes, for example. This process isn’t going to slow down and the new quantum technologies are actually being able to do gravitational sensing and that’s advancing at a remarkable rate and you can’t shield gravity. So some of the new quantum technologies are able already to see through walls and will, and there are technologies also for seeing round corners now using scattered light from lasers. Technology continues to erode privacy.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678151/41d4181bbe9246e8a6de1ab07b59d315.mp3"}, {"id": 1579, "name": "Tutorial", "phrases": ["a second year", "evie Carroll", "degree subject", "independent learning", "each tutorial", "a reading list", "each annals", "every tutorial", "15 students", "the tutorial"], "eng": "My name is Evie Carroll. Evie Carroll I’m a second year studying international business. My degree subject is made up of tutorials, lectures and independent learning. And today I’m going to speak about tutorials. Before each tutorial, we’re asked to prepare in advance. We’re usually given a reading list, which we have to complete before each tutorial. We are given websites to look at, each annals to look at and we have to prepare by writing our notes down. In every tutorial, there is about 5 to 15 students and these are led by the tutors which are usually masters or PhD students. 5 15 And then when we come into the tutorial we are put into small groups. I’m asked to discuss our ideas, generate new ideas and then feedback to the class. During our tutorials, there’s lots of support given. Our tutors are there so that we can ask questions at any time. We also have our peers there, to which we can also ask questions. If we need help before the tutorial, we can email any of the tutors and they’ll provide you with help. The difference between lectures and tutorials is that in lectures you usually have about 200 to 300 students whereas in tutorials are about 5 to 15 students, 200 300 5 15 which allows you to discuss matters, put your hands up and talk to your tutors about any difficulties you may have with a subject.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678152/36c7598f05c344acab1231ff490628c4.mp3"}, {"id": 1580, "name": "Biology", "phrases": ["first tutorial", "many different topics", "a whole bunch", "first video", "the first thing", "the definition", "the study", "a certain point", "all right", "the scientific definition"], "eng": "Welcome to your very first tutorial in biology. Now, in this video series what I want to do is I want to talk to you guys about many different topics concerning biology. For example, I want to talk to you guys about DNA and genetics in cells, in bacteria, in life and a whole bunch of interesting stuff. DNA But since this is the very first video, I think what we should do in this video is just stick with the very basics. And the first thing I want to do is talk to you guys about what is biology. So, let's go ahead and answer that question. And the definition of biology is this: the study of life in living organisms. All right, that makes sense up to a certain point up until organisms because you may have heard of organisms before. “ ” And you may have your own definition but the scientific definition of an organism is a living thing. Well, that's easy. We know what living things are. I'm a living thing, plants, grass is a living thing. My puppy named Old Dan, cutest puppy ever, by the way, is a living thing but whenever we talk about living things. Old Dan Believe it or not, things get rid of complicated because then you have to ask yourself 'what is life'. “ ” Well, of course, if you ask your grandma or your best friend or even if you ask a philosopher 'what is life', everyone is going to give you kind of a different definition of their outlook on life. “ ” However, whenever scientists and biologists were first deciding, you know what, what is life? That's the problem that they had everyone had their own separate definition of life itself. So, what they need to do before biology was even invented, which is of course the study of life, is scientists needed to agree on the definition of life.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678153/37052472409644a6a7e84b6b6affebbb.mp3"}, {"id": 1581, "name": "London taxi drivers", "phrases": ["the Great Exhibition", "the world ’", "a great public outcry", "the London Authority", "a short walk", "penton Street", "all major taxi drivers", "the responsibility", "all taxi drivers", "the London knowledge"], "eng": "But we can really thank the Great Exhibition of 1851 for giving us the world’s premier taxi service, 1851 for it was going to this exhibition, and this fabulous exhibition inventions from all around the four corners of the Empire that the visitors were appalled, dismayed and vexed by their journeys to this exhibition because the cabbies of the day and their horse-drawn carts were absolutely terrible and could not find their way to this exhibition. And, so, a great public outcry, the London Authority sets up Public Carriage Office, which is an organization that still exists. And you can take a short walk to Penton Street up the road. Penton And this Public Carriage office took on the responsibility of licensing all major taxi drivers in London. All taxi drivers from 1851 onwards had to pass what is now known as the London knowledge, 1851 “ ” which is phenomenal knowledge of London. What is the London knowledge? It’s the ability to remember the 25,000 streets, have it all interconnected and all the main arterial roads in and out of London. 25,000 Cabbies need to know all this plus a thousand points of specific interest cafes, bars, public offices. They need to know them all as part of their training.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678154/fd98b116e0ae4412907f935f5bf14581.mp3"}, {"id": 1582, "name": "London fog", "phrases": ["the earliest pictures", "the 1835 painting", "a trueborn Londoner", "an atmospheric pollution", "the central element", "the bridge", "the steam", "both sides", "a shot-tower", "smoking industries"], "eng": "Turner, not surprisingly, painted one of the earliest pictures of London’s fog, in the 1835 painting of The Thames above Waterloo Bridge. 1835 Turner is a trueborn Londoner, is advertising his familiarity with London’s air problem by putting smoke, an atmospheric pollution at its center. —— —— And as you can see, in here, the bridge is the central element, which is a theme that’s later taken up by Monet. And it’s partly obscured by the steam and smoke, which rises from both sides of the river. Here, we see a shot-tower. I think you can just about to see, which was constructed in 1826. 1826 Do you know what shot-towers are? They produce shot for guns, ammunition. And they were very smoky, one of the most smoking industries. But it’s barely visible, as you can see, as are the various industries on the Lambeth side of the river. There’s, on this side, there’s a steamship about to dock or preparing to leave. Its black smoke thrusting up to join the kind of swirling arc of smoke there. William Rodner sees this painting as a potent essay on the energy and complexity of modern polluted urbanism. · Smoke, I think, here represents a flourishing economy, which brings employment and food on tables, but also the dirt and pollution associated with the fumes all seems to be tainted by sulfurous yellow.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678155/9100f34b3814419f92226fc349fa7c91.mp3"}, {"id": 1583, "name": "Cosmic Civilization", "phrases": ["every year", "new stars", "the planets", "the necessary criteria", "all planets", "the chances", "other cosmic civilizations", "the search", "the vast expanse", "the universe"], "eng": "It begins by stating that every year, seven new stars are formed. However, most of the planets orbiting these stars are either too hot or too cold to sustain life. Only around 20% of all planets meet the necessary criteria to have the possibility of hosting life. 20% Despite these favorable conditions, the chances of life actually appearing are incredibly small, almost close to zero. This has made the search for other cosmic civilizations extremely difficult. Scientists have been tirelessly exploring the vast expanse of the universe, using various methods such as radio signals and telescope observations, in the hope of finding evidence of extraterrestrial life. While the lecture does not provide concrete proof of the existence of other civilizations, it emphasizes the importance of continuing the search. The quest to discover other cosmic civilizations not only helps us understand the universe better but also raises fundamental questions about the origins of life and our place in the cosmos.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658438/573e79e98df548d9956c33e945291b0d.mp3"}, {"id": 1584, "name": "Early Robot", "phrases": ["the term robot", "first robots", "rossum ’", "universal Robots", "hollywood depictions kind", "absolute political turmoil", "the First World War", "a devastating impact", "the Ford manufacturing production line", "a production line"], "eng": "This is a kind of object that you’re probably all familiar with when you had the term robot, but I’m gonna show you the very, very first robots. These were the very first robots. They were characters in a play in the 1920s called Rossum’s Universal Robots, and the play was written by Czech writer called Karel Capek. 1920 · And basically, these robots, you know, people tend to think of robots as kind of cute cuddly toys or, you know, Hollywood depictions kind of devoid of politics. But the first robots were actually created and imagined in a time of absolute political turmoil. You just had the First World War, you know, it finished had a devastating impact across Europe and so people were kind and people are kind of reflecting on what does it mean to be human, what makes us human, those kinds of question. And this kind of context is what inspired Capek to kind of write this play. And interestingly, these robots being human, they are actually in the play assembled on a production line, a bit like the Ford manufacturing production line. “ ” So even though they are human, they are assembled and these robots are designed to labor, and that is their primary purpose in society. “ ”", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678157/8b84bcb1405349f499bac35f651dbd42.mp3"}, {"id": 1585, "name": "Universal philosophy", "phrases": ["the big benefit", "a universal philosophy", "206 countries", "the world", "liberal theory", "some value", "the United Nations", "the Universal Declaration", "human Rights", "the idea"], "eng": "Okay. So this is the big benefit of a universal philosophy. It says it applies to everybody. Well, looks that doesn't, you know, 205 or 206 countries in the world. And you've got something that applies to everybody. That's a bit strange, isn't it? 205 206 No, says liberal theory. There are some value structures that apply to all of us. “ ” “ ” You couldn't have the United Nations without it. It couldn't tell you that the Universal Declaration of Human Rights without this idea of values that apply to all of us just because we are humans. “ ” Now, the idea is to test that as well. Why is sport universal? Why does everybody play football? It's because the values are specified at a very thin level at the top. There are these rules and we all have to abide by just these rules. But there are lots of things about football that aren't rules specified. So Brazilian football is different from Italian football, from British football, from German football, from Spanish football. It's culturally specific, but acknowledges that there are these universal general rules to apply to everybody.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658439/4841ef77930c4700bc7bcd5e99ecfac6.mp3"}, {"id": 1586, "name": "Gas giants", "phrases": ["the gas giants", "two theories", "the same theory", "core accretion", "disk instability", "the reason", "a metallic core", "a certain pressure", "the insides", "metallic cores"], "eng": "So there are two theories for how the gas giants formed. One is the same theory I showed you just now — core accretion, right? And the other is called disk instability, and one of our colleagues at DTM has done a lot of work on that. DTM And so it's unclear exactly how they formed but you're right — what we're trying to do, the reason we're trying to get the higher and higher pressure in the lab is because we are trying to understand more about the pressure inside the gas giants. —— It's thought that the gas giants also have a metallic core, but maybe a metallic core is not made of iron. Hydrogen, for example, becomes metallic at a certain pressure, ok? So it's very possible that the insides of these planets could have metallic cores, could have hydrogen cores, could have rocky portions. We're not sure. But the higher pressure we can get in the lab, the closer we can get to understanding the interiors of the gas giants and the exoplanets that are so big.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658440/8c03da842ca047eba622a00c59ccba20.mp3"}, {"id": 1587, "name": "Three principles", "phrases": ["the guiding principles", "three principles", "the works", "a number", "ross My choice", "word equity", "no policy", "the policy", "the time", "the benefits"], "eng": "From reading philosophy, I came up with three principles as the guiding principles for a just city, of the principles of equity, democracy, and diversity. Of these were derived from the works of a number of philosophers, most preeminently I supposed on Ross. Ross My choice of word equity rather than equality is in fact based on Ross's argument that a policy ought to distribute benefits to people where the worst off become better off. “ ” equity “ ” equality So the worst off don't have to become equal to everybody else but no policy should in fact make those who are most disadvantaged, more disadvantaged. And it means that we have to talk about the policy at the time it's being enacted. To say, while we have to make our city more competitive because sometime and by and by, the benefits will trickle down to those people who were worst off doesn't justify making them worst off at that time. “ ” We have a lot of examples in the world of people whose homes were destroyed in the name of the greater good and say eventually they will benefit. “ ” But equity means that you do not in fact take advantage of those people who are weakest. “ ”", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678137/e8700bf2ff264ab190f0d27487a7e279.mp3"}, {"id": 1588, "name": "Four fundamental forces", "phrases": ["fundamental forces", "the universe", "everyday life", "the four forces", "the surface", "the earth", "the electromagnetic force", "another force", "the force", "the electricity"], "eng": "There are four fundamental forces at work in the universe. Some of them are very familiar from everyday life. Some of them are not. So we all know about gravity. That's one of the four forces. It's what keeps our ankles to the surface of the earth, and keeps the Earth in orbit around the Sun. There is another force that we're very familiar with, which is the electromagnetic force. That is the force that is responsible for the electricity, electric currents for light, for the sun's light, that's electromagnetic radiation coming from the Sun to the Earth. —— There are two other forces though that are somewhat less familiar. They are the nuclear forces. They are forces that are at work within the nuclear atoms. One of those forces is called the strong nuclear force. That really is the force that bides protons to protons, bides the quarks inside of the protons and neutrons keeping them from flying out. The other nuclear force is called the weak nuclear force. And that's a force that predominantly we know of because it's responsible for radioactivity and radioactive decay. So those four forces—strong nuclear force, weak nuclear force, electromagnetic force and gravitational force—those are the forces that work in the universe. —— ——", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678138/5ec50bc10090411e92a2a7499f5ccb1d.mp3"}, {"id": 1589, "name": "Dietary guidance", "phrases": ["the cause", "fat versus sugar", "recent debate", "a big problem", "the metabolic consequences", "public guidance", "an important step", "the same time", "a wider view"], "eng": "I think there are a lot of confusing messages about health and food out there that don't really help the cause. Look at the most recent debate, fat versus sugar, two things that we know scientifically are of concern. And I think a big problem is that in the field of nutrition science, we look at individual nutrients like fat, carbohydrate, protein, etc., to figure out the metabolic consequences of food. And so when we're putting out public guidance about what we should be eating, we talk in terms of nutrients instead of converting those nutrients into foods like fish, fruit, cookies, and so on. But I think talking about foods rather than nutrients is an important step we need to take. At the same time, we don't have to say to people, you can eat this or you can't eat that, but we should help give people a wider view of the relative proportions of various food groups and dietary patterns on the whole.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657057/20e292dbf7cc4fde8985497458b43330.mp3"}, {"id": 1590, "name": "Salience", "phrases": ["the vast amount", "do consumers", "a key role", "the perspective", "consumers attention", "certain characteristics", "some characteristics", "other words", "high levels", "the salience"], "eng": "How do consumers process the vast amount of information and multitude of possibilities presented to them? Well, from the perspective of behavioral economics, a concept called salience plays a key role in this. So salience is when consumers attention is attracted to certain characteristics. That's because to work efficiently, our brains try to take shortcuts by prioritizing some characteristics. In other words, items with high levels of salience stand out, meaning we'll be more likely to choose them. The salience of a product can be increased in a number of ways. Firstly, items can become more salient by appealing to one of our physical senses, for example, the inviting smell of freshly baked bread in a grocery store. Alternatively, products can also have higher salience when they're presented in a way that is somehow cognitively unusual. Advertisements which include shocking humor, usually attract consumers attention, and of course, sometimes a particular characteristic becomes more salient simply because our individual needs have evolved. A person who has recently become a parent may well start considering whether the items that they used to purchase without any hesitation are in fact child friendly.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658431/eaf54f2a95d244f2b6bfd81ff25ec730.mp3"}, {"id": 1592, "name": "Canned laughter", "phrases": ["a feature", "TV production", "a studio audience", "the finished product", "several reasons", "canned laughter", "live studio audiences", "technical aspects", "the wrong places", "some individuals"], "eng": "Today's session is about a feature of TV production called Canned Laughter. A recording of a studio audience laughing inserted into a program so the finished product sounds as if the studio audience is laughing along as the action unfolds. There are several reasons for the use of canned laughter, which we can divide into technical reasons and creative ones. In terms of technical aspects, canned laughter compensates for the unpredictability of live studio audiences. For instance, some individuals might laugh too loudly or in what producers consider to be the wrong places, or they might even clap and cheer, all of which can interfere with the scene. And of course, canned laughter is also needed when scenes take place outside a studio. However, canned laughter is also believed to enhance the program itself. Research has shown that the inclusion of canned laughter can actually change people's perceptions of what they're watching. It's been demonstrated that viewers are more likely to laugh or have a favorable impression of a scene when they can hear other people laughing. So canned laughter is great news for television executives that crave high ratings. Of course, as viewers' tastes in comedy have changed, many shows have moved away from the use of canned laughter. Nevertheless, it remains an effective and familiar aspect of TV comedy.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658433/c8d040019331450284e2b12df458a18b.mp3"}, {"id": 1593, "name": "Baby brain", "phrases": ["a quarter", "final size", "a baby start", "an adult", "the baby listens", "the beginning", "some parents", "the baby", "many times", "an exciting moment"], "eng": "When a baby is born, its brain is already a quarter of its final size. But when does a baby start to learn? Well, experts believe that a baby is learning even before it is born. When it is born, though, it will start learning very quickly, much more quickly than an adult. At the beginning, the baby listens and watches all the skills being performed that it needs to learn, such as speaking, walking, playing, eating, and singing. Some parents think that their baby isn't learning, but it is. The baby has to watch and listen to something many times before it can do that thing. For parents, an exciting moment is their baby's first smile. This happens at around 6 weeks old. 6 Another important moment is when baby takes its first step. The earliest this can happen is when the baby is about 9 months old. 9", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658434/ad4d1cf9de4949dfa7f2015a04d8c323.mp3"}, {"id": 1594, "name": "Health problem", "phrases": ["the world today", "big problems", "the first problem", "enough exercise", "much electricity", "electricity causes pollution", "the process", "an exercise bike", "a solution", "the exercise problem"], "eng": "So now I want to look at two big problems in the world today and something that someone has invented to solve these problems. The first problem is that people don't get enough exercise, which is obviously bad for people's health. The second is that people are using too much electricity. The process of making electricity causes pollution, which is also bad for our health as well as being bad for the environment. So here we might have a solution, an exercise bike perhaps. You were thinking, well, that solves problem number one, the exercise problem, but what about problem two? Well, this is where the idea for the invention comes from. What if you could solve the pollution and health problems at the same time? So how about an exercise bike that can create electricity? You can then use that electricity for power in your home.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658435/ebd57d6fd97e4b4e97e6963d4a51e936.mp3"}, {"id": 1595, "name": "Start in university", "phrases": ["a new student", "a good start", "all students", "a video recording", "the lecture online", "university life", "much time", "the important facts", "the lecture", "lecture notes"], "eng": "As a new student, there are many things that you can do to get a good start at university. Attending lectures is something that we expect all students to do. If you miss a lecture though, or didn't quite understand the topic, or simply want to hear it again, you can watch a video recording of the lecture online. However, university life is very busy and you won't have much time, so it's better to concentrate and take good notes when you do attend a lecture. If you make notes, it helps you to think about the important facts and ideas in the lecture, and writing these things down can help you to remember them again. There may be lecture notes available online, but making your own notes is much more valuable.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658436/87636b245c2a44cd8f7ee27a931e3f31.mp3"}, {"id": 1596, "name": "Savings", "phrases": ["the greatest economic successes", "the enormous rise", "the middle classes", "the economies", "the new middle class", "the savings habits", "savings decisions", "the country", "the richer people", "business owners"], "eng": "The enormous rise of the middle class in certain developing countries is one of the greatest economic successes of the late 20th and early 21st centuries. 20 21 This is excellent for the economies of those countries because the middle classes usually earn more than they need to live on, and thus they can save money. It's important that economists understand how these processes work, and thus they need to understand the savings habits of the new middle class. Our research therefore aimed to investigate patterns of savings and reasons for savings decisions. The country we chose to focus on was India. We found that, not surprisingly, it was the richer people, especially business owners, who tended to save more. As for the reasons for saving, the number one reason was to provide an income after retirement. Having an income after becoming too old to work was important for savers who wanted to be able to enjoy their older years. And the second most important reason was for family purposes, such as the education and weddings of their children.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656693/607e43cb7cd64dada7c11eebff59c904.mp3"}, {"id": 1597, "name": "Moon launch base", "phrases": ["the first Moon landings", "space travel", "1969 Lunar programs", "a good place", "a Moon launch base", "difficult aspect", "the journey time", "the Moon", "the cost difference", "20 times"], "eng": "Since before the first Moon landings of 1969, there has been interest in space travel to the Moon. 1969 Lunar programs are expensive and difficult, but there are several reasons why the Moon might be a good place to launch further space exploration. Firstly, a Moon launch base would eliminate the most difficult aspect of space travel, namely getting a rocket through the Earth's gravity. The journey time between, say, going to Mars from Earth rather than from the Moon is not significant. However, the cost difference would be immense, as it would take 20 times less fuel to launch a spacecraft from the Moon than from the Earth due to there being less gravity on the Moon. 20 There would not need to be a drain on the Earth's resources, as the Moon is rich in all the necessary minerals such as aluminum and silicon, which would mean that the entire infrastructure needed to enable spacecraft launch from the Moon could be done robotically using the materials already present.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2656000-2657000/2656714/3566326442774c0fad172af1a307e52b.mp3"}, {"id": 1598, "name": "Roman London", "phrases": ["the other thing", "the fact", "the context", "roman Britain", "many other inscriptions", "500 examples", "an awful lot", "the Roman army", "a society", "fancy metal inkwells"], "eng": "The other thing that this tablet tells us a little about, about, as I've mentioned, is the fact that writing is hugely important in Roman London. And it's something which really marks it out within the context of Roman Britain. Here we have in excess of 500 examples of wooden writing tablet surviving, many, many other inscriptions. 500 An awful lot of them are tool with this whole kind of idea of commerce, of business transaction, an awful lot of it. Written texts are tool of the Roman army, and that's precisely because writing in a society that where literacy rates would have been significantly lower than they were today was really a tool of power. And things like these rather fancy metal inkwells, which have been found in a number of sites in London, I think really reflect that. And in fact, they're within Britain. They're quite heavily concentrated here.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657205/1ff8b6bea72b47529fff9cef6f5cb66a.mp3"}, {"id": 1599, "name": "Salt mining", "phrases": ["the salt trade", "greater role", "salt mining", "important today", "the earliest method", "solar evaporation", "shallow pools", "the sea water dries", "A newer technique", "solution mining"], "eng": "The salt trade has existed for thousands of years and arguably has played an even greater role in shaping the world's economic and social history than products like silk, cotton, or spices. Salt mining is still hugely important today, and there are three basic ways that salt can be extracted from oceans or underground sources. So starting with probably the earliest method, which is solar evaporation. —— This method is used to extract salt from seawater. Basically, seawater is collected in shallow pools. The sea water dries out when it's exposed to sun and wind. When this happens, a layer of salt is left behind, which can be cleaned and harvested. A newer technique is solution mining. This method uses a water solution to extract salt from underground rock sources. Water is injected into the rock and absorbs the salt. The salty liquid is then pumped back to the surface where the salt can be extracted at a processing plant. Finally, deep shaft mining is similar to other types of mineral mining. Here, pieces of rock containing the salt are drilled away from the mine shaft. These pieces are then crushed into smaller chunks and transported to the top for processing.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657568/54bddc08978f409192c6d980c59b4881.mp3"}, {"id": 1600, "name": "Higher education and further education", "phrases": ["the study options", "main choices", "a university degree", "higher education", "detailed study", "the skills students", "many different careers", "degree courses", "further education", "practical skills"], "eng": "Today, we're looking at the study options available to students after completing school, and the two main choices are higher education and further education. Higher education basically means studying for a university degree. This involves detailed study and is usually theoretical in nature. That said, the skills students learn can be used in many different careers, so companies are eager to hire graduates. However, remember that degree courses are long and costly. Conversely, further education focuses more on practical skills rather than theoretical knowledge. These courses prepare students for a specific job, such as training to be a chef and offer great practical work experience opportunities. However, as the skills learnt on further education courses tend to be more specialized, they can not be transferred to other types of career very easily. As you can see, it's important to compare the pros and cons of higher and further education carefully before making a decision.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2657000-2658000/2657206/b7c9b04bddc64340bfe39090d33bcaf6.mp3"}, {"id": 1601, "name": "Paper marbling", "phrases": ["paper marbling", "the name", "special water", "detailed designs", "the history", "the origins", "turkish paper marbling", "own particular styles", "the 17th century", "the publishing industry"], "eng": "Today I am going to talk about the art of paper marbling, which, as the name suggests, is about adding beautiful, colorful designs onto paper. It involves putting a piece of paper onto a tray of special water and paint in order to create unique and detailed designs. As for the history of this art, the origins are not entirely known, although it is believed to have begun in China or Japan. Paper marbling subsequently became very popular in Turkey. Indeed, Turkish paper marbling developed its own particular styles, characterized by brighter colors. This type of marbling gained a lot of popularity in Europe in the 17th century and was used extensively in the publishing industry for book covers, especially in England. 17 It was an attractive and effective way of hiding any minor damage to a book. Nowadays, the art of paper marbling is in decline for various reasons. However, there are attempts to encourage a new generation to discover paper marbling and social media is a great way to promote it to a new audience. Paper marbling classes are also starting to appear, so perhaps there is hope for this art.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658428/fb74543142da4d19ab6bdd72d8fb7260.mp3"}, {"id": 1602, "name": "Typography", "phrases": ["a visual world", "a document", "an immediate judgment", "some common assumptions readers", "recent research", "the text", "important decisions", "the information", "a possible use", "the content"], "eng": "Typography is the art and technique of arranging letters and text on a page so that readers can read it easily and it looks attractive. So people want to read it. Why does typography matter? Well, we live in a visual world, we're used to figuring out the aim of a document by looking at its style and appearance even before we start reading it. Whenever we see a document, we form an immediate judgment. We're experts at doing this. Recent research into readers' responses to different types of print designs has revealed some common assumptions readers make when they first see a document. Subjects were presented with carefully designed pages, but couldn't read any of the text because it contained words which don't actually exist. Despite this, they could still make important decisions based on how the information was presented. They quickly decided how accurate the content was and a possible use of the document. They also looked at the boxes of texts and images to decide how serious the text might be. If the text boxes were in lots of different colors, shapes and sizes, then these were related to negative qualities. These results confirm that readers respond to how something is designed as soon as they see it.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658429/7d2172a86cfa4e2c88753003c6141f5c.mp3"}, {"id": 1603, "name": "Cave paintings", "phrases": ["the world", "first artists", "human beings", "the walls", "the animals", "the cave walls", "the second question", "the paintings", "a long time", "the artists"], "eng": "The world's first artists were ancient people who lived 40000 years ago or more and did cave paintings. 40000 But what did they paint? And who exactly were these early artists? Well, they didn't paint human beings. Instead, they painted animals on the walls of their caves. That's because animals were very important to them. After all, the animals provided them with food and clothing, as well as animals. They put their hands against the cave walls and painted around them. And it's these handprints which may help us to answer the second question, who did the paintings? For a long time, it was believed that it was mostly men. However, research done on paintings in a cave in France has shown that the artists were often women and not just men. We know this because the size of women's hands is smaller than men's hands. In fact, the majority of the hand prints in the French cave were smaller ones. This has made us think again about who the world's first artists really were.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2658000-2659000/2658430/dd33a669d39b4a04b9c74769a6f5b5e6.mp3"}, {"id": 2551, "name": "A successful entrepreneur", "phrases": ["a good idea varies", "a successful entrepreneur", "great idea", "several features", "great ideas", "other smaller ideas", "all ideas", "a concept stand", "the individuality", "the basic idea"], "eng": "To be a successful entrepreneur, you should have good ideas, but the definition of a good idea varies depending on whom you ask. “ ” A great idea should have several features. Firstly, the great idea should be various and novel. Secondly, the great idea should be unique, which means no one has thought about it. Thirdly, it is essential for great ideas to be transformative and productive. All ideas are essentially a combination of other smaller ideas, but this doesn't mean they can't be unique. Merely copying doesn't make anything idiosyncratic, it's the individuality that one puts in which makes a concept stand out. Constant innovation leaves no room for stagnation and thus, adds on to the basic idea, effectively making it unique. Unique ideas are inspired by basic things, they are simply extensions of pre-existing notions. And, an idea or a concept is unique only when it transcends its predecessor and serves its purpose in a better and more precise way.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678141/0dd508cd6ab24ab1b7a08544d3286531.mp3"}, {"id": 2552, "name": "File a patent", "phrases": ["a patent", "the patent office", "the patent officer", "the clicker", "presentation clickers", "a 0 % chance", "every single clicker", "two dollars", "a decent amount", "the other end"], "eng": "We’re thinking about this and we’re trying to say, alright, well, let’s file on a patent on this clicker. If I were to go to the patent office and say, alright, I want a patent on a clicker, period. The patent officer would just laugh. You know, the clicker has been around for a while. Presentation clickers have been around for a while. And so there would be a 0% chance that you would actually get that. If we were to somehow convince the patent office that we should be able to get on a patent on clicker, period. It would, however, be incredibly valuable. Every single clicker that was made after this point would infringe. And when it infringes, maybe we take one or two dollars each. That would be added up to be a decent amount of money. On the other end of the spectrum, let’s go to the million-word version. I go to the patent office and I say, I want a patent on this exact thing. And those million words describe every single radius, every single material, every single thing about this. And the patent officer says, yeah, we've never seen that before. Go ahead and take it. Almost 100% of chance of getting that patent, but the value of that patent would be close to zero. 100%", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678145/a1b32a79179b4522ad5cbdc92889bfbb.mp3"}, {"id": 2553, "name": "Alaska", "phrases": ["the social issues", "the native Alaskans", "the Native Americans", "poor conditions", "the cases", "alcohol abuse", "domestic violence", "many children", "a matter", "the children"], "eng": "One of the social issues faced by the state of Alaska is the lack of mental and emotional well-being of the native Alaskans. It is very unfortunate that many of the Native Americans are living under poor conditions throughout the country. In the cases of native Alaskans, even virtually entire villages are suffering from a lack of mental and emotional well-being, which includes continuing poor physical and mental health. Alcohol abuse, domestic violence, homicides, and suicides are frequent among them, which of course, lead to families falling apart. It is tragic to see that many children are abused and not educated properly. As a matter of fact, the children themselves are abusing alcohol and other chemicals, and the rate is increasing over time. Since parents are suffering from mental illnesses and alcohol abuse, they can't take care of their children. So many children are being taken care of by others or simply neglected. Therefore, we can conclude that Alaskan natives are losing hold of their communities, cultural identities, and most importantly, their childhoods. So you can see how serious the issue is. Plus, rather than making a living for themselves, they are depending on public services and subsidies. They have lost control of and responsibility for their economy and governing institutions.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678139/187d73a6c491475792b6d7fcd6fd0283.mp3"}, {"id": 2554, "name": "Tobacco", "phrases": ["the past few months", "all advertising outlets", "the tobacco industry", "the cigarette box", "the last 50 years", "cigarette advertising", "the social aspects", "the present day", "each brand", "a smoker"], "eng": "Over the past few months, the government has been pushing to remove all advertising outlets for the tobacco industry, and in particular pushing for plain packaging. The tobacco industry, however, is against this and they in particular argue that the cigarette box is not a form of advertising. Michaela has been doing her Ph.D. looking at cigarette advertising and how it's changed over the last 50 years. 50 Basically, I've accessed advertising from the tobacco industry since the 1950s and just analyze the images and looked at the use of the cigarette box within the adverts. 20 50 In the very early adverts, the cigarette box is a very small part of the adverts and they focus much more on the social aspects of smoking. However, as you move through the decades and get closer to the present day, the cigarette box became more and more of a focal point in the adverts. My argument is that the cigarette box has actually become iconic to each brand. So when a smoker takes a box out of their pocket, they are actually advertising that brand. So what we hope will come out of this is that the government will introduce plain packaging. And like Australia which has already introduced its policy and Ireland which is again beginning to introduce its policy, we hope that the UK will stop cigarette companies from using their box as a form of advertising.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2678000-2679000/2678140/c9f68c45e69046d2a1a9e01404e04e61.mp3"}, {"id": 3347, "name": "Music and well-being", "phrases": ["extraordinary
