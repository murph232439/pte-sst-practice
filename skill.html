challenges", "personal circumstances", "an intuitive part", "well-being management", "the next step", "intuitive application", "many levels", "personal endeavours"], "eng": "So what do we mean by well-being? Health, happiness, a sense of achievement and contentment, a state of mind and body where people can thrive. Well-being is not something that is purely limited to people who are facing extraordinary challenges in their lifestyle, health or personal circumstances, everybody here has a level of well-being. Music so often forms an intuitive part of our well-being management, music to pick us up, music to calm us down, music to heal our sorrows. Our aim through research is to move from this level of intuitive application of music through to informed use in our communities to take the next step in the understanding of the power of music in human life. Music already works for us on so many levels whether it’s soothing and teaching our infants, bringing people and communities together, adding spirit to our work and personal endeavours, but there is no reason to stop here.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690232/16d473f22cd9449ebacf84efb9aaaef3.mp3"}, {"id": 3348, "name": "Animal behavior V2", "phrases": ["animal behavior", "other reasons", "conservation biologists", "much space", "many mates", "the outcome", "the research", "fernando Nottebohm", "a complete overhaul", "the entire field"], "eng": "Why should we bother studying animal behavior? Well, first and foremost, because we are interested in understanding why animals do what they do. There are lots of other reasons for studying animal behavior. Conservation biologists need to know what animals do if they’re going to save them. Are those animals social or solitary? How much space do they need and how many mates do they have? Sometimes you can’t predict the outcome of the research. Fernando Nottebohm started out being interested in how birds know what to sing. · Yet his research eventually led to a complete overhaul of the entire field of neurobiology, a totally unanticipated yet utterly monumental effect. And this is the course textbook by John Alcock the fact that this is in its ninth edition tells you how fast an afield animal behavior is. · John Alcock There are lots of new developments.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690235/5e1b588016bb4a6792d1a71d6366e8f7.mp3"}, {"id": 3349, "name": "Arctic and Antarctic", "phrases": ["the polar regions", "the Greek word", "the Arctic", "the polar bears", "great bear constellations", "the name Antarctica", "the Greeks", "the Arctic first", "many ways", "’ t realize"], "eng": "So, when we talk about the polar regions, just to clarify exactly what we mean. And we have first of all the Arctic at the top of the earth and the Antarctic at the bottom, and so the Arctic was named after the Greek word for bear. “ ” Now surprisingly it’s not after the polar bears that live in the Antarctic or live in the Arctic and based on it’s after the little and great bear constellations that can be seen in the sky. Now the Greeks also hypothesize that there would be the Anti-arctic, which is how we get the name Antarctica and of course it wasn’t discovered until much later on. “ ” “ ” Now these regions are opposite in many ways other than just their names and their location on the globe, and so if we look at the Arctic first of all, and the Arctic is actually ocean surrounded by land, and so you can see here this is the UK down here and this kind of Russia and then American Canada around here, and so there is a bit of land cover in our ice on the top in the Arctic, which is Greenland here and Macie all this area here. Surprisingly a lot of people don’t realize that this isn’t actually land. The north pole isn’t on land. It’s just one big ocean.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690237/2e62defb91714f708f773dc24b6a5fd3.mp3"}, {"id": 3350, "name": "Sugar", "phrases": ["’ s lots", "ice cream", "an example", "peanut butter", "skippy Peanut Butter", "common ingredient", "the reading food labels", "any food labels", "another example", "beef stew"], "eng": "There’s sugar in a lot of foods where you don’t expect it. Of course there’s lots of sugar in donuts, ice cream, pastries, or other things that are sweet; candy of course, but there are other places where you see it and you don’t necessarily expect it. So as an example: peanut butter. Here’s a list of ingredients from Skippy Peanut Butter and you see that sugar is the second most common ingredient. Skippy So that you may know from the reading food labels that these ingredients in any food labels that are listed in order of how much there is in the food itself, so sugar comes right after peanuts. Here’s another example, Beef stew, you wouldn’t necessarily expect to find sugar in beef stew but it’s there. Now it’s down the list of ingredients, it’s actually toward the end, but if you look at the marketing of this and food at the can, it says, there’s fresh potatoes and carrots, but actually there’s more sugar in this than there is carrots. And so you wouldn’t eat something like beef stew and expect to find this to be the case.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690238/6b75263b858b4b0eabd4b9f4e3686e51.mp3"}, {"id": 3351, "name": "Taxonomy", "phrases": ["different groups", "the characteristics", "the US Postal Service", "a good way", "a letter", "the nation", "costa Rica", "specific level", "south Carolina", "a phylum"], "eng": "Welcome to today's lesson. We're continuing with our study of taxonomy. Taxonomy is how scientists classify organisms into different groups based on the characteristics that they share. So, for instance, a good way to think about taxonomy is the US Postal Service. If we want to send a letter to someone, we first start off by addressing it to the nation they are in. By default, we usually assume that's America but it doesn't have to be a treat in England or Costa Rica or Spain. You put their nation or their kingdom. Then within that kingdom, you address it to a slightly more specific level, their states. So, for instance, South Carolina would be the same as a phylum. “ ” And within that state, you would address it to their city and then to their street number, the street they live on. Then you would address it to say their apartment complex and within that complex, you'd address it by their last name to their family and then finally their first name to the specific person you want to get it to. And in that way we're able to weed out all the 400 million people we don't want to send our letter to in America and pinpoint the exact person we want the letter to reach. And in the same way, scientists use a taxonomy chart to pinpoint a living creature and organism and how it relates to everything else in the world.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690239/dad3f696ada3470399597876bb175165.mp3"}, {"id": 3352, "name": "Immigration control", "phrases": ["the envelope calculation", "all immigration controls", "an ethical point", "a policy", "the famous Rand Study reckons", "a typical immigrant", "the migrants", "the countries", "poor countries", "the neat"], "eng": "Now the economists calculated, it’s a back of the envelope calculation, that removing all immigration controls would double the size of the world economy, and even a small relaxation of immigration controls would lead to disproportionately big gains. Now for an ethical point of view, it’s hard to argue against a policy that will do so much to help people that are much poorer than ourselves. The famous Rand Study reckons that a typical immigrant who arrives in the US ends up with $20,000 a year, that’s rough. 2 It’s not just the migrants themselves who gain, it’s the countries they come from. Already, the migrants working for poor countries working in rich countries send home around 200 billion dollars a year, through formal channels, and about twice as that through informal channels. 2000 And that compares to the neat a hundred million dollars that Western governments give in aid. 1 These remittances are not wasted on weapons or siphoned off into Swiss bank accounts; they go straight into the pockets of local people. They pay for food, clean water, and medicines, they help kids in school, they help start up new businesses.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690241/963b665def424a9ba85eb60884d10666.mp3"}, {"id": 3353, "name": "Civilization and art", "phrases": ["the great civilizations", "a civilization", "a great production", "a society", "the producers", "the social structure", "the vehicle", "the time", "the Impressionists", "pre-cinematography Pierre"], "eng": "I have said before that you can’t have a civilization that doesn’t have art when we think about the great civilizations historically. All of them had a great production of culture and art because a society has built to observe itself and the sophistication of the great civilizations was their ability to look at themselves. And what allows a society to do that are the producers of art and culture with mirror back to the core of the society exactly. What is being produced at that moment? How people are thinking of themselves and how individuals are relating to the social structure at that time. Art is the vehicle through which we understand that. Were you to take away art, what would be that mirror? How would we see what we were about? How would we understand what was going on in Paris at the time of the Impressionists when people were learning to see in a completely different way? Pre-cinematography Pierre all of these things are just emerging and here are people looking at the world in a very different way, which was considered so radical at that time.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690242/df80ca77fd2247cda72fbf8724adcdd6.mp3"}, {"id": 3354, "name": "Shy fish", "phrases": ["a leader", "an individual", "a new study", "shy individuals", "some plastic plants", "the fish", "a bold fish", "a shy fish", "other groups", "the researchers"], "eng": "When you think of a leader, you may think of an individual who is above all bold. But a new study of fish called sticklebacks shows that shy individuals actually prefer to follow fish that are similarly timid. Researchers had trios of sticklebacks with known personalities play follow the leader. “ ” The fish were placed in a tank that had some plastic plants at one end and some food hidden at the other. In some of the groups, a bold fish and a shy fish acted as leaders, while another shy fish followed. And in other groups, it was a bold fish that did the following. The researchers recorded whether the follower sallied forth more frequently with the fish that was behaviorally similar or the one that was different. What they found is that shy fish were more likely to emerge from undercover when an equally wary fellow was already out there. Bold follower fish did not seem to care which leader they followed. Of course, no matter which fish a stickleback chose to stick with, the bold fish did lead more expeditions over the course of the experiment than their more retiring friends. That’s because the bold fish initiated more trips, regardless of who might be tailing them. The findings are in the journal Biology Letters. The researchers write that “when offered a choice of leaders, sticklebacks prefer to follow individuals whose personality matches their own, but bolder individuals may, nevertheless, be able to impose their leadership, even among shy followers, simply through greater effort.” “ ” We may soon see if such tendencies also hold true in humans, when Americans decide who they’ll follow in November. 11 Unless, of course, something fishy happens. —— “ ”", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690243/be4603e3ccb7403ba3626950d583b9e0.mp3"}, {"id": 3355, "name": "Animal behavior", "phrases": ["fundamental questions", "animal behavior", "proximate questions", "the mechanisms", "the proximate", "ultimate questions", "the behavior develop", "the behavior", "the behavior evolve", "the adaptive significance"], "eng": "We can ask two fundamental questions about animal behavior, they referred to as proximate and ultimate. Proximate questions are those concerned with the mechanisms that bring about behavior, ultimate questions are those concerned with the evolution of behavior. We can divide the proximate and ultimate questions into two sub-questions. For proximate, how does the behavior develop, and secondly what causes the behavior. For ultimate, you can ask how did the behavior evolve, and secondly what is the adaptive significance of the behavior, what’s the purpose. Together these comprise what are called Tinbergen's four questions about animal behavior. Niko Tinbergen was one of the founding fathers of the study of animal behavior. · These questions represent the different ways of studying animal behavior and understanding the difference between those four questions are fundamental to understanding behavior and indeed the whole of biology. How do we study animal behavior well that depends on the type of question we’re hoping to answer.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690244/31209e7b2b0d403b9a04d7ac80861df5.mp3"}, {"id": 3356, "name": "Early spring", "phrases": ["the Earth", "the first bloom", "phenomena —", "the only factor", "urban light pollution", "“ ” Richard Ffrench-Constant", "a double whammy", "the first bud burst", "13 years", "a full week"], "eng": "The Earth's temperature is rising. And as it does, springtime phenomena—like the first bloom of flowers—are getting earlier and earlier. But rising temperatures aren't the only factor. Urban light pollution is also quickening the coming of spring. \"So temperature and light are really contributing to a double whammy of making everything earlier.\" “ ” Richard Ffrench-Constant, an entomologist at the University of Exeter. · - He and his colleagues compiled 13 years of data from citizen scientists in the U.K., who tracked the first bud burst of four common trees. 13 Turns out, light pollution from streetlights in cities, and along roads pushed bud burst a full week earlier. Way beyond what rising temperatures could achieve. This disruptive timing can ripple through the ecosystem. \"The caterpillars that feed on trees are trying to match the hatching of their eggs to the timing of bud burst.\" “ ” \"Because the caterpillars want to feed on the juiciest and least chemically protected leaves.\" “ ” \"And it's not just the caterpillars, of course, that are important.\" “ ” \"But the knock-on effect is on nesting birds, which are also trying to hatch their chicks at the same time that there's the maximum number of caterpillars.\" “ ” So earlier buds could ultimately affect the survival of birds, and beyond. The findings are in the Proceedings of the Royal Society B. B The world's becoming increasingly urbanized, and light pollution is growing which Ffrench-Constant says could trick trees into budding earlier and earlier. - But smarter lighting like LEDs that dial down certain wavelengths could help. LED \"Perhaps the exciting thing is, if we understand more about how light affects this bud burst, we might be able to devise smarter sort of streetlighting that has less red components, and therefore less early bud burst.\" “ ” Thus keeping springtime an actual springtime phenomenon.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690246/66d213bd36de4fceb12a4e8bb30cd346.mp3"}, {"id": 3357, "name": "Fire safety", "phrases": ["a worldwide reputation", "fire safety products", "a broad range", "dedicated labs", "the CE mark requirements", "the European market", "the market access regulations", "most countries", "the BSI Kitemark", "a British superbrand"], "eng": "With over 40 years unrivaled experience and a worldwide reputation, BSI leads the way in testing and certification of fire safety products. 40 BSI Based on our dedicated labs in Hemel Hempstead, our team provides BSI Kitemark and CE testing and certification for a broad range of products, including fire extinguishers, hoses, alarm panels, and heat and smoke detectors. BSI CE We help clients to gain access into the European market by ensuring that products meet all the CE mark requirements. CE And we are familiar with the market access regulations of most countries across the world, enabling customers to enter markets globally. The BSI Kitemark is categorized as a British superbrand and acknowledged the world over as a symbol of trust, integrity, and quality. BSI It provides the reassurance that vital product safety and performance requirements have been met. Our team subjects each product to a rigorous set of tests along with robust production control audits designed specifically to ensure that they conform to required standards of safety and quality. We test for compatibility of fire detection and fire alarm system components to ensure that they're compatible and connectable. This service meets the growing requirement of European regulatory authorities to meet national installation guidelines. We also perform tests on individual detection components. Fire suppression products such as fire extinguishers are subjected to rigorous tests designed to ensure that they're effective, safe and capable of performing in environments and conditions in which they're stored and used. The symbols for BSI Kitemark and CE certification represent quality, safety, and trust. BSI CE For specifiers, they demonstrate a commitment to best practice procurement. And for the public, they provide the reassurance that fire safety products are effective and reliable.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690247/b22ff7495a7a4db488f1acd452996075.mp3"}, {"id": 3358, "name": "Smartphone apps", "phrases": ["computer scientist Shwetak Patel", "the initial focus", "shwetak Patel", "a new generation", "a home ’", "personal health monitoring", "industrial applications", "patel ‘ So", "a signal interest", "the users"], "eng": "Computer scientist Shwetak Patel and his team are developing new sensing systems. Shwetak Patel The initial focus was really around energy and water monitoring. They built a new generation of smart sensors that monitor electronic interference on a home’s power line or water pressure changes in the plumbing. Most of this technology has already found industrial applications, and Patel and his team turned their attention to adapting the technology for personal health monitoring. Patel ‘So how do we take this noise and make it into a signal interest was hard to us, hard to us in the core of what we did for many years and we’re taking that work and applying it to other domains.’ “ ‘ ’ ” They’re looking to take advantage of all the functionality built in our smartphones. With the users’ permission, this app can use the microphone built into most smartphones to listen to background noises, such as coughing searching for patterns that suggest a trip to the doctor might be an order. ‘We've constructed these models that try and understand how sound works, how it, what its patterns are and we give it a whole bunch of examples of different kinds of audio, things like people talking, things like people laughing, sneezing and of course coughing.’ “ ” This app uses a phone’s camera to check hemoglobin levels in blood by analyzing the color of capillary fluid through the skin. Generally, what happens is if you’re anemic, your bloods maybe a little less red and we take advantage of that by putting your finger over a camera of a phone, the camera of the phone can actually see the coloration of the blood. and this test uses the camera to tell parents worried about jaundice in newborn infants. ‘Now, jaundice is something that doctors who have seen tons of babies. He just can figure out on a very basic level of it. Is this baby, do they need to get treatment or are they in a good condition, while the first-time parent has no idea necessarily what jaundice might look like.’ “ ” The researchers say the built-in sensors found in smartphones are already commonplace, but their applications and their implications for our health and well-being may be more far-reaching than we ever imagined.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690248/70c26b7708eb426092b253dbbe79c29f.mp3"}, {"id": 3359, "name": "The politics of happiness", "phrases": ["the Gross National Happiness", "tiny little Bhutan", "sophisticated way", "the effects", "the only country", "white paper policy analyses", "other countries", "great Britain", "regular statistics", "different advanced countries"], "eng": "As Joanne pointed out, only one country, tiny little Bhutan, wedged between China and India,has adopted the Gross National Happiness as the central index of government policy, and actually has a good deal of success in education and in health and in economic growth and in environmental preservation. They have a rather sophisticated way of measuring the effects of different policies on people's happiness. They are the only country to go that far. But you are now beginning to get other countries interested enough to do kind of white paper policy analyses of happiness research what effects would it have if we used it more for public policy? You are beginning to get countries like Australia, France, Great Britain, that are considering publishing regular statistics on happiness. So it is beginning to become a subject of greater interest for policymakers and legislators in different advanced countries.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690249/bd16521835364c6f93661e5460d6f0e1.mp3"}, {"id": 3360, "name": "Soot emission", "phrases": ["the little things", "big things happen", "the plague", "nuclear bombs", "diminutive leaders", "world history", "black carbon", "diesel fuel", "million premature deaths", "los Angeles"], "eng": "Sometimes it's the little things that can make big things happen. Fleas and the plague, atoms and nuclear bombs. Diminutive leaders in world history. Soot is one of these little things. Soot also known as black carbon is released when you burn dung, coal, diesel fuel and wood. From Los Angeles to Mumbai, soot causes respiratory illnesses like lung cancer and asthma and contributes to one point six million premature deaths every year. 160 Mostly among the poor. And it gets worse. Atmospheric currents carry soot thousands of miles from where it is produced, to the Himalayas and the Arctic. Black carbon being black, absorbs sunlight, so even a little soot on snow makes it melt faster. And when snow melts global sea levels rise, threatening our freshwater indigenous communities and polar bears who hunt on the Arctic ice. Climate Change has been a big thing for a while and carbon dioxide has been its main cause. Scientists estimate that soot causes twenty five percent of human-caused global warming. 25% It's the second leading cause of Arctic warming after carbon dioxide. Let's not underestimate the impact of this tiny particle. But there's good news, reducing black carbon may be the fastest way to slow global warming. Buy time for the Arctic. Yes even more so than changing a light bulb. Since black carbon only stays in the atmosphere for a couple of weeks, reducing it will produce results immediately. Of course, reducing soot alone won't solve global warming, but solving our soot problem now will help buy time for the Arctic and allow us to deal with the bigger problem of carbon dioxide. We have the cleaner industries,cook stoves,and diesel now we have to use them. In developed nations, we've significantly reduced our black carbon, but we still have much more to do. We need to tighten our standards at home and invest in cleaner technologies in developing nations. But if you urge the US government and the European Union to take the lead on black carbon reduction, you can make a big difference. Go to www. stopsoot. org www.stopsoot.org And help stop these little things from causing big trouble.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690250/05ba74a3fd0647f4991b061ba46b44d2.mp3"}, {"id": 3361, "name": "Government Blogging", "phrases": ["a two-way interaction", "the blogger", "the White House", "the case", "the comment area", "rude online", "the governor blog", "the government", "the comment", "the original intention"], "eng": "We normally see blogging as a two-way interaction, in which the blogger creates the content and the readers interact or challenge the author. But the case will be much difficult when it comes to government, such as the White House. Because people will become more coarse and rude online, especially in the comment area. Hence the governor blog may go wild and chaotic. So the government will have to administrate the comment. Once the government starts administrating the comment, citizens may find the government manipulating what should be said and what should be shown, which contradicts the original intention.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690252/a128c98b3b574fe7848b448f8395a8c5.mp3"}, {"id": 3362, "name": "Linguists", "phrases": ["the communities", "the authority", "a career woman", "the class", "narrow areas", "the bottom line", "the dominance", "rocket science", "the first place", "language revival"], "eng": "But when we move into working with communities, we have to recognize that the communities have to be the authority in their language. Actually a woman in the class I'm teaching at Sydney at the moment, a career woman, expressed this very nicely, although she was talking about something else, she was distinguishing expertise from authority. And certainly linguists because of our training we do have expertise in certain very narrow areas of language, but we don't have the authority over what to do with that knowledge or what to do with other knowledge that the community produces. I guess for me the bottom line is languages are lost because of the dominance of one people over another. That's not rocket science, it's not hard to work that out. But then what that means is if in working with language revival we continue to hold the authority, we actually haven't done anything towards undoing how languages are lost in the first place, so in a sense the languages are still lost if the authority is still lost.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690253/461d5971326240d586101cebb39cf969.mp3"}, {"id": 3363, "name": "Venus", "phrases": ["the space age", "the planet Venus", "an earlier space mission", "a nice water cycle", "“ ” Okay", "a brief comparison"], "eng": "There is a picture, sort of artist's impression, before the space age of what Venus might be like on its surface and so this was looking at the planet Venus, it was science fiction and science fact all the way up to 56 before the start of the space age but it wasn't completely disproved, 56 this idea of a really sort of lush environment on Venus until 1967, which is when the first measurements in detail were done at Venus. 1967 So Mariner four and Mariner five confirmed the feeling from an earlier space mission that in fact the surface of Venus was not like this at all, but extremely hot and, and also that the clouds were made of sulfuric acid so there wasn't a nice water cycle like is going on in this picture and so, that it had to wait for these in situ measurements by space craft to actually do that and so Venus turned out not to be quite as Earth like as we thought and I'll sort of tell you about some of the latest results from Venus Express, which, which they actually there are some Earth like features, but to a large extent, it's not like the Earth. “ ” Okay, so a brief comparison between.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690254/bbd432fe383e455b81bc64a8023dd8d1.mp3"}, {"id": 3364, "name": "Rice", "phrases": ["the Green Revolution", "the International Rice Research Institute", "1943 “ ”", "1962 IR8 IR8", "a real impact", "the technology", "the genes", "traditional rice varieties", "1962 IR8", "optimal conditions"], "eng": "In 1943, what became known as the Green Revolution began when Mexico, unable to feed its growing population, shouted for help. 1943 “ ” Within a few years, the Ford and Rockefeller Foundations founded the International Rice Research Institute in Asia, and by 1962, a new strain of rice called IR8 was feeding people all over the world. 1962 IR8 IR8 was the first really big modified crop to make a real impact on world hunger. IR8 In 1962 the technology did not yet exist to directly manipulate the genes of plants, and so IR8 was created by carefully crossing existing varieties: selecting the best from each generation, further modifying them, and finally finding the best. 1962 IR8 Here is the power of modified crops: IR8, with no fertilizer, straight out of the box, produced five times the yield of traditional rice varieties. IR8 In optimal conditions with nitrogen, it produced ten times the yield of traditional varieties. By 1980, IR36 resisted pests and grew fast enough to allow two crops a year instead of just one, doubling the yield. 1980 IR36 And by 1990, using more advanced genetic manipulation techniques, IR72 was outperforming even IR36. The Green Revolution saw worldwide crop yields explode from 1960 through 2000. 1990 IR72 IR36 1960 2000", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690255/d384c0d225f04b2da3e123a5651a577c.mp3"}, {"id": 3365, "name": "Aristotle", "phrases": ["the reason", "rhetoric influence", "the rebel", "the dressing", "the body", "the spirit", "the soul", "the truth", "some kind", "most people"], "eng": "But Aristotle says the reason we need rhetoric is we have to be able to use it. We have to be able to use rhetoric influence, basically, the rebel, and the morons. We try to get them to understand truth. Truth is suggested, is different than rhetoric. Rhetoric is the dressing, is the body, right? Truth is the spirit, is the soul, is abstract. It doesn't have a body. It's not particular. If you wanna get somebody to the truth, you might have to use some kind of tricks. Right? Because most people are not sound and can't see the truth. That's what we think. Most people are ramble. Really. Only the educated be erudite are actually capable of seeing the truth. If you wanna get the general mass there, you may have to do fable a little bit. So Aristotle that is rhetoric. Rhetoric is something that is used to influence people. Right? And it's a kind of mentally promised a logic.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690256/f1c59e5851b7491da9ac0f485d6c5265.mp3"}, {"id": 3366, "name": "Clouds", "phrases": ["every cloud drop", "the center", "a cloud drop", "a particle", "the key question", "the ocean", "sea spray", "good chance", "sea salt", "all kinds"], "eng": "There is a lot of interesting. What forms these clouds, why are these clouds there, why do they sort of stick around? At the center, every cloud drop has a particle. You can't grow a cloud drop without having a particle there for the water to condense on. The key question that people not directly address until very recently is what actually forms these clouds. So for once you're looking out at over the ocean, turns out sea spray, sea salt is a very effective nucleus for forming clouds. So it's a really good chance that those are loaded with sea salt. But if you go inland, you start to have pollution come from all kinds of places, and so different sources form clouds more effectively than others, and we're trying to unravel which sources are actually contributing to the clouds. The clouds are incredibly important players in climate change, and that they reflective the white, they reflect the light back into space and so they're keeping things much, much cooler than they would be if they weren't there. They also play huge role in regional weather, so in actual we're starting to see shifts where having more pollution input into the clouds is affecting weather patterns, in particular, is actually reducing the precipitation so we're starting to see drought in areas with super high levels of air pollution.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690257/71d5f54d9b334282be62307c4b7292c7.mp3"}, {"id": 3367, "name": "Superhuman", "phrases": ["incredible physical power", "an accident victim", "a fact-based look", "an adrenalin-charged person", "a temporary boost", "proper terminology", "the majority", "many cases", "large body", "anecdotal evidence"], "eng": "Today we're going to recount heroic tales of superhuman feats of strength, when in the face of disaster, some people are said to have summoned up incredible physical power to lift a car off of an accident victim, move giant rocks, or like Big John of song, single-handedly hold up a collapsing beam to let the other miners escape. Are such stories true? There are many anecdotes supporting the idea, but we're going to take a fact-based look at whether or not it truly is possible for an adrenalin-charged person to temporarily gain massive strength. In proper terminology, such a temporary boost of physical power would be called hysterical strength. The majority of them are anecdotal, and interestingly not repeatable; in many cases, the person who summoned the superstrength later tried it again only to find that they couldn't do it. Basically, what we have is a respectably large body of anecdotal evidence that suggests that in times of crisis, danger, or fear, some people have the ability to temporarily exercise superhuman strength.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690258/2a7f252f738c42ba9331e470146dad42.mp3"}, {"id": 3368, "name": "Bees talks", "phrases": ["a waggle dance", "honey bees", "a headbutt", "another bee", "a warning signal", "A feeding station", "a source", "the hive", "a dangerous source", "the behaviour"], "eng": "Honey bees do a waggle dance to direct other bees to the sources of nectar. The dancing bees like this one can be halted by a headbutt from another bee. Now research has found that this headbutt is actually a warning signal. A feeding station was set up in the lab to mimic a source of nectar, then foraging bees were introduced to the dangers at the station, such as competition from rival colonies. When foragers returned to the hive they stopped bees dancing. Scientists think the behaviour warns dancers of a dangerous source of nectar.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690259/8630016574f74b9b8f3e6747724e45a6.mp3"}, {"id": 3369, "name": "Library", "phrases": ["the service desk", "each floor", "the internet", "library catalogues", "the orange signs", "the instructions", "the printers", "student cards", "the card"], "eng": "You'll see the service desk after entering the library and you can have these services at the service desk. There are computers on each floor. You can use computers to access the internet, check emails and library catalogues. Follow the orange signs to find printers. Follow the instructions to use the printers. Remember to bring student cards. You can charge the card to use printers.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690260/b794ce656c3a456dacb91eb84627d942.mp3"}, {"id": 3370, "name": "A ship", "phrases": ["a great ship", "the future", "any before", "a wise course", "every reef", "many shipwrecks", "the only one left", "the vessel", "the next few years", "all creatures"], "eng": "\"Our civilization, which subsumes most of its predecessors, is a great ship steaming at speed into the future. “ It travels faster, further, and more laden than any before. We may not be able to foresee every reef and hazard, but by reading her compass bearing and headway, by understanding her design, her safety record, and the abilities of her crew, we can, I think, plot a wise course between the narrows and bergs looming ahead. And I believe we must do this without delay, because there are too many shipwrecks behind us. The vessel we are now aboard is not merely the biggest of all time; it is also the only one left. The future of everything we have accomplished since our intelligence evolved will depend on the wisdom of our actions over the next few years. Like all creatures, humans have made their way in the world so far by trial and error; unlike other creatures, we have a presence so colossal that error is a luxury we can no longer afford. The world has grown too small to forgive us any big mistakes.\" \"", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690261/591d4fa40876480ab950000b3d3f2ec1.mp3"}, {"id": 3371, "name": "Psychologist", "phrases": ["sigmund Freud", "a famous psychologist", "the answer", "a profound influence", "some biographical information", "the beginning", "world War", "any single discovery", "famous scholars", "the development"], "eng": "For better or worse, we live in a world profoundly affected by Sigmund Freud. ・ If I had to ask you to name a famous psychologist, the answer of most of you would be Freud. He's the most famous psychologist ever and he's had a profound influence on the 20th and 21st century. 20 21 Some biographical information: he was born in the 1850s. 19 50 He spent most of his life in Vienna, Austria, but he died in London and he escaped to London soon after retreating there at the beginning of World War Two as the Nazis began to occupy where he lived. He's one of the most famous scholars ever but he's not known for any single discovery. Instead, he's known for the development of and encompassing theory of mind, one that he developed over the span of many decades.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690262/4e05feda69d1476cbe7cc23415824332.mp3"}, {"id": 3372, "name": "Teaching", "phrases": ["graduate students", "some inventions", "the result", "the learning process", "the end product", "the subject", "an intelligent group", "a vehicle", "the teaching-research results", "uncovered many interesting research problems"], "eng": "All of my research and that I conducted was my 60 plus graduate students, was motivated by their need to learn, so that we can teach. 60 Of course, in some inventions happened along the way but I've always considered the end the result. And I always consider that this invention to be byproduct, byproducts of the learning process. The end product for me was always better understanding or when one really succeeded in unifying theory that can help us in teaching the subject. I've also looked at teaching as a vehicle to try new ideas, of new ways to doing things on an intelligent group of learners. That is as the vehicle for the teaching-research results. And in my experience, this kind of teaching is the most stimulated and motivating to students. I am also uncovered many interesting research problems is the cause of teaching subject. It is this unity of research and teaching their close connection and the benefits gathered by exercising and the interplay that to be characterised the successful professor.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690263/fdb1c52d74b84380a86a3cad88265de4.mp3"}, {"id": 3373, "name": "Wilson", "phrases": ["a different world", "the focal point", "a board mainstream", "american culture", "modern literature", "an abstract sense", "TS Eliot", "ordinary people", "the division", "the brows"], "eng": "Wilson came from a different world. And he became the focal point of a board mainstream. American culture that thought that modern literature and wanted modern literature to be able to be read and appreciated by ordinary people. They were not modernists in an abstract sense. And certainly, some of them like TS Eliot and Faulkner were too difficult for some of their writings to be read by ordinary people. ・ But this was a world before the division between the brows or between a lead or whatever had established itself as a part of our consciousness. “ ” “ ” Wilson was a major player in the successful effort of his generation to establish at the heart of American life and innovative literature that would equal the great cultures of Europe. And he knew that the great cultures of Europe were there. He was not a product of a narrow American Studies kind of training at all. He joined a high artistic standard with an openness to all experience and a belief that literature was as much of a part of life for everyone as conversation. He thought the Proust and Joyce and Yeats and Eliot could and should be read by ordinary Americans and helped that to happen. Wilson was a very various man. Over a period of almost 50 years, he was a dedicated, a literary journalist, and an investigative reporter, a brilliant memoirist, and dedicated journal keeper. 50", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690264/d0b2c20b9332455f90d3c0df2eccd2e9.mp3"}, {"id": 3374, "name": "Chest X-Ray", "phrases": ["one picture", "some personal experience", "a chest x-ray", "a radiologist", "a good example", "a physical principle", "the large bright", "some parts", "good eyesight", "the distance"], "eng": "This is one picture that you probably you all know what it is when you see it. It's a familiar looking image. It's something that probably we all have some personal experience with,right? This is a chest x-ray that would be taken in your doctor's office, for example, or a radiologist's office. X And it is a good example of Biomedical Engineering and that it takes a physical principle, that is how do x-rays interact with the tissues of your body, and it uses that physics, that physical principle to develop a picture of what's inside your body, so to look inside and see things that you couldn't see without this device. X And you'll recognize some parts of the image, you can see the ribcage here, the bones you can see the heart is the large bright object down here. If you, have good eyesight from the distance,you can seethe vessels leading out of the heart and into the lungs, and the lungs are darker spaces within the ribcage.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690265/a5a2692e5bf94f8d8b40aa37cd16d15a.mp3"}, {"id": 3375, "name": "Trade-offs triangle", "phrases": ["a win-win solution", "economic growth", "the argument", "the developed", "industrialized countries", "wildlife conservation society", "a government"], "eng": "Well, it's about whether you can achieve a win-win solution, whether you can achieve economic growth which brings wealth in order to cut poverty without damaging the biodiversity. And the argument is that if you want to protect the biodiversity, you have to focus on that as a goal, but if you do that, you run the risk of hurting the poor and you also run the risk of inconvenience and reducing the economic growth. We use the developed and industrialized countries to see this argument this axis argues about.. We let us say, a government wishing to start drilling for oil in place X, which is for the wildlife under wildlife conservation society, urging them not to on the grounds that it's a wilderness. X", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690266/ba1310fd58114f1cb9d3901e2515f846.mp3"}, {"id": 3376, "name": "Australian city", "phrases": ["the world", "international trade", "a broad territory", "all towns", "a huge expense", "the government", "large amount", "the Australian people", "five cities", "isolated cities"], "eng": "Australia's location is important for the world's export, and its international trade is also very important. Since Australia has a broad territory, all towns are scattered around. There is a huge expense for transportation for trains and ferries. The government also pays large amount for its telecommunication to build up the connection among regions. The Australian people are mainly living in five cities, and they are Melbourne, Sydney, Perth, Brisbane and so on. The most special one is Perth, which is one of the most isolated cities in the world. —— However, this does not affect its status to be the largest city in Australia. Most large companies, like the two leading companies, Telstra and Qantas, are all based in Perth. Telstra Qantas", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690267/3549e9fd5cc44347879277505f8a533a.mp3"}, {"id": 3377, "name": "Narratives", "phrases": ["the comics", "different kinds", "a situation", "visual description", "the scenario", "the Second World War", "the shelter", "more visual evidence"], "eng": "The comics I show you with lots of people chatting around in a room is a form of description. —— —— We use different kinds of methods to describe a situation. Sometimes we have to use visual description, particularly when we do not witness the scenario. I was born during the Second World War and my hometown is X... X... For example when I asked my mother about the war, I always ask her \"you have mentioned this or that when you talked to me\"... \"...\" When you asked her about the shelter, I asked her \"what the shelter looks like\" and \"when did you go to the shelter\". \" \" \" \" From her response I could get more visual evidence as I can to write my book.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690268/415198dd01fb44d3a3b0f962c71c4b21.mp3"}, {"id": 3378, "name": "Climate change", "phrases": ["some adverse effects", "climate changes", "some lands", "the near future", "climate change", "less production", "financial status", "many people", "world economy", "the tropical areas"], "eng": "Some adverse effects of climate changes to agricultural productions. Some lands are unsuitable for growing crops. There will be millions of people facing hunger in Africa in the near future. Climate change will result in less production and less food. It is difficult for developing countries to deal with climate change due to their financial status and other issues. There are many people living in hunger especially in Africa. The climate change has devastating effects on world economy. The tropical areas on earth are dry and hot, and are originally not suitable for food production. The change of climate leads to extreme weather conditions such as floods and hurricanes, which exacerbates the food production. As a result, it leads to a continuous decline in food supply annually around 10 to 17%. 10%-17% And this trend is perceived to be continuing in the future by 2070. 2070 The regions suffering the most will be some African countries.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690269/4a34ee05632f44a18a5c11ccd26b2b02.mp3"}, {"id": 3379, "name": "Shuttle", "phrases": ["a space truck", "a multi-purpose vehicle", "a tremendous number", "different things", "versatile space vehicle", "the space lab", "the space station", "the Mir space station", "the useful life", "the new international space station"], "eng": "The shuttle was designed to be a space truck — it's a multi-purpose vehicle. \" \"—— We've done a tremendous number of different things with it. It's the most versatile space vehicle that has ever been built. We've used it to launch satellites. We've used it to repair satellites in orbit and put them back into orbit. We've used it to capture satellites and bring them back to Earth for repair. We've outfitted it with the space lab built by our European partners and used it before the era of the space station to do scientific research. We used it as part of our partnership with the Russians, which is still continuing, first as part of the Mir space station, \" \" —— where we actually prolonged the useful life of Mir by several years through logistical supply visits with the shuttle. And now, of course, we're using it to build the new international space station, which is a huge international partnership.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690270/d65fc72778f14fdea1ca164873aaeb7a.mp3"}, {"id": 3380, "name": "A survey with 100 CEO", "phrases": ["a hundred CEOs", "an acquisition", "frequent response", "information technology", "the IT issues", "a significant impact", "a clear understanding", "the consequences", "the one hand", "other areas"], "eng": "In our survey, over a hundred CEOs who had recently been through an acquisition or merger were asked which areas of their activities needed the most effort. As you can see, the most frequent response to this question was that information technology requires the most integration effort. According to 58 of those we surveyed, IT was the most time-consuming and needed the most work. 58 IT This is understandable as many of the IT issues are extremely complex and the consequences of any change in IT can have a significant impact. IT IT The key is how quickly and effectively IT integration can be achieved. IT And there has to be a clear understanding of the consequences there may be of not getting it right. The two other areas requiring significant attention: sales, marketing and business development on the one hand, and financial management on the other both were selected by 49 of the respondents. —— / / 49 49 ——", "audio": "https://ti.koolearn.com/upload/ti/sardine/2690000-2691000/2690271/a820745fa5fe4298881ec0ead310ca81.mp3"}, {"id": 4273, "name": "King", "phrases": ["the king", "a kingdom", "the Middle Ages", "the king come", "the previous king", "other people", "the key currency", "“ duckie ”", "the duke", "the agricultural production"], "eng": "At the top, you would have a king. Now the king would rule over a kingdom. Now, this is not so easy to govern especially during the Middle Ages. And the king might owe many people, things especially people who help the king come to power, helped him dispose the previous king or to conquer this land. And so in exchange for that and to help govern, he might grant land or fiefs to other people. And the key currency in the Middle Ages under the feudal system is land. And land in exchange for loyalty and service. So this whole thing is a kingdom. Now right over here, this is a duchy. And a duchy will be controlled by a duke. I guess I didn't call it duckie because that just doesn't sound as serious. “duckie” So the king might grant a duchy, a duchy to a duke and in exchange, the duke would provide loyalty pledged their fealty. If the kingdom is threatened, the duke will fight alongside. The duke would provide their own troops if the king wants to go conquer other territories, same thing, and also provide the king with taxes which might be in the form of coinage depending on what time and region we are in the Middle Ages or it might be in the form of a percentage of the agricultural production from this duchy.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693304/9c3cc58aab304ef9b069bc3a5e8541e7.mp3"}, {"id": 4274, "name": "Knee", "phrases": ["a cracking knee", "the sound", "most people", "“ ” Omer Inan", "an electrical engineer", "some real information", "“ ” Inan", "a high-end audio company", "the next day", "georgia Tech"], "eng": "The sound of a cracking knee isn't particularly pleasant. But it gets worse when you listen up close. \"It does for most people. But for me, it actually just makes me excited.\" “ ” Omer Inan, an electrical engineer at Georgia Tech. Omer Inan \"I actually feel like there's some real information in them that can be exploited for the purposes of helping people with rehab.\" “ ” Inan's experience with cracking knees goes back to his days as an undergrad at Stanford, where he threw discus. Inan \"If I had a really hard workout, then the next day, of course, I'd be sore, but I'd also sometimes feel that I would feel this basically catching or popping or creaking every now and then in my knee.\" “ ” A few years later, he found himself building tiny microphones at a high-end audio company. So when he got to Georgia Tech and heard the Defense Advanced Research Projects Agency, DARPA, wanted better tech for knee injuries, he thought: Why not strap tiny microphones to people's knees, to eavesdrop as their legs bend? DARPA \"What we think it is, is the cartilage and bone rubbing against each other, the surfaces inside the knee rubbing against each other, during those movements.\" “ ” He and a team of physiologists and engineers built a prototype with stretchy athletic tape and a few tiny mics and skin sensors. And preliminary tests on athletes suggest the squishy sounds the device picks up are more erratic, and more irregular, in an injured knee than in a healthy one. Which Inan says might allow patients and doctors to track healing after surgery. Inan Details appear in the IEEE Transactions on Biomedical Engineering. IEEE \"The primary application we're targeting at first is to give people a decision aid during rehabilitation, following an acute knee injury, to help them understand when they can perform particular activities, and when they can move to different intensities of particular activities.\" “ ” A useful thing to take a crack at.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693306/eac184f172c542d4a517bc61ea5ab68a.mp3"}, {"id": 4275, "name": "Smell of books", "phrases": ["a historic library", "the smell", "another historical library", "saint Paul ’", "an intensive smell", "the first time", "the library", "an important message", "an important way", "the environment"], "eng": "Indeed, the library. We’ve all been to a historic library. We’ve all enjoyed the smell of a historic library. But what is it? And what does it mean? When we’ve recently, when at UCL Center for Sustainable Heritage, we’ve recently been asked to access the environment at another historical library at Saint Paul’s Cathedral, the Wren library, an incredible place. UCL —— And it has such an intensive smell of old books, and we were also asked for the first time really I was actually taken aback by the brief, and we were asked why we should preserve the smell. It is so important to our audience. It is so important how people perceive the library. So, that is, that was quite an important message in our research. And indeed smell is an important way of how we communicate with the environment. This piece of research was done by an advertising company because advertisers are so interested in how we, how we interact with each other and the environment. And we see that the majority of people use sight obviously to interact with the environment, but in the second place, we see the smell is also very, very important.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693307/49ac17c87b4e4e93b9785d5217f679de.mp3"}, {"id": 4276, "name": "Melatonin", "phrases": ["the stuff", "the hormone", "the Pineal Gland", "the synthesis", "the size", "the corpus", "the site", "a rhythm", "the opposite", "the cortisol"], "eng": "I'm just going to take on the stuff where left off. The hormone I want to now talk about it's called melatonin. The synthesis is in the Pineal Gland, which is very small. It is the size of a pea in your brain. The corpus is the site of the soul, and it is where melatonin is made. “ ” And it has a rhythm as well. And in this sense, it is the opposite of the cortisol. It peaks at night. We call it the darkness hormone. “ ” In every species that we studied, melatonin occurs at night. And it's a hormone that prepares you for the things, that your species, does at night. So, of course, in humans we sleep, but animals, like rodents, they are awake. It's a hormone that is related to darkness behavior.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693308/0b2271b1ee83493dbbab0bc7e215cc36.mp3"}, {"id": 4277, "name": "A survey", "phrases": ["the survey", "the people", "a few years", "the Internet", "the website globalandmail.com", "frequent users", "a biased sample"], "eng": "Let's say if I'm asking which source do you often use to get your information—newspaper? Radio? TV? —— The survey shows 62 of the people chose the Internet. 62% You might be thinking I’m going to say, how important the Internet is or how quickly it has changed the world for a few years. But what if I tell you this survey is conducted on the website globalandmail.com? globalandmail.com Our answer will be different. Because the people who did this survey on this website must be frequent users of Internet. This sample is a biased sample. So we have to pay attention to how a survey is conducted.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693309/b5696af004094ded8773570f49f357dc.mp3"}, {"id": 4278, "name": "A new instrument", "phrases": ["accessible musical instrument", "the Skoog", "special needs", "an instrument", "own sounds", "traditional instruments", "the shape", "a plucked string", "a string", "an object"], "eng": "The Skoog is a new universally accessible musical instrument. It is designed to use by children or adults with special needs or in fact be used by anyone. It's soft, it's easy to play, it's robust and it can be customized to suit anyone's abilities. The Skoog helps students with special needs by allowing them to get involved in making music themselves. Skoog It's an instrument that they can play it and they can take ownership of and start creating their own sounds and music. Traditional instruments are the shape and size and made of the materials they are because of the sound that they need to make. If you want to make a sound like a plucked string, you need a string and it needs to be under tension, whereas with a Skoog, because it's a mixture of software and a sensor, then thus the computer can handle making the sound. Skoog And so we can design an object that's designed to be touched and designed to be played with. In developing the screen and working with kids in the schools and in the classrooms, it's really helped us make the Skoog something that's usable by the children themselves. Skoog They've informed us massively on how it needs to work and they've given their opinions on colours and designs. And just the feedback they've given to us has been just marvellous. It's just so enriching and it's really inspiring to actually work with these kids, particularly when you can provide them with an ability to start to playing their own music as opposed to just taking part through listening and listening to other musicians and really learning from them.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693310/601c3a3d0ba241029ae8b342aff1b3c7.mp3"}, {"id": 4279, "name": "Bilingual kids", "phrases": ["the arising concern", "the preschool year", "the reason", "the parents", "two languages", "one language", "parent role", "a good idea", "the separate speaker", "each language"], "eng": "The arising concern that a lot of people have about raising children bilingually, especially the preschool year is based on the conceptualization that the human brain at birth is essentially monolingual. And the reason why come to this occasion. Because often the parents will ask me if they use two languages at home will their child be confused, because they hearing two languages. And parents often ask my advice about whether they should use one language on parent role which is widely known that parents who are raising children bilingually. And the reason why most people think this is a good idea is that it will help to reduce the risks of the children being confused. Because they were able to associate each language with the separate speaker. The fear is that both parents use both languages, especially they use both languages interchangeable within the same conversation within the same sentences. The child will not be able to separate the languages.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693311/8b26cdc9a4e449cab876248cbb81c953.mp3"}, {"id": 4280, "name": "Stem cells", "phrases": ["a specific job", "stem cells", "muscle cells contract", "any specific structures", "all other kinds", "worn-out cells", "every four days", "the lining", "own body parts", "stem cell researchers"], "eng": "Stem cells are cells that are undifferentiated, meaning they do not have a specific job or function. While skin cells protect your body, muscle cells contract and nerve cells send signals, stem cells do not have any specific structures or functions. Stem cells do have the potential to become all other kinds of cells in your body. Your body uses stem cells to replace worn-out cells when they die. For example, you completely replace the lining of your intestines every four days. Stem cells beneath the lining of your intestines replace these cells as they wear out. Scientists hope that stem cells could be used to create a very special kind of personalized medicine, in which we could replace your own body parts with, well, your own body parts. Stem cell researchers are working hard to find ways in which to use stem cells to create new tissue to replace the parts of organs that are damaged by injury or disease. Using stem cells to replace damaged bodily tissue is called regenerative medicine. For example, scientists currently use stem cells to treat patients with blood diseases such as leukemia. Leukemia is a form of cancer that affects your bone marrow. Bone marrow is the spongy tissue inside your bones where your blood cells are created. In leukemia, some of the cells inside your bone marrow grow uncontrollably, crowding out the healthy stem cells that form your blood cells. Some leukemia patients can receive a stem cell transplant. These new stem cells will create the blood cells needed by the patient's body. There are actually multiple kinds of stem cells that scientists can use for medical treatments and research. Adult stem cells or tissue-specific stem cells are found in small numbers in most of your body's tissues.", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693312/07e57124a8b949c98d1a6f9b25d0f6d4.mp3"}, {"id": 4281, "name": "Dimension", "phrases": ["the notion", "a dimension", "many numbers", "the surface", "the earth", "a hang glider", "the space", "no reason", "three dimensions", "A four-dimensional space"], "eng": "So, let me begin with the notion of a dimension. “ ” A dimension is simply how many numbers you need to specify a location. So, if we think about the surface of the earth, the equator is one-dimensional: you need to specify only one number to specify a location on the equator, namely the longitude. —— The surface of the earth, altogether, is of course two-dimensional: you need to specify two numbers—latitude and longitude—to specify a location on the earth. —— The space above the earth is three-dimensional: if I want to tell you the location of a hang glider, I need to give you the latitude, longitude, and altitude. —— But mathematically, there’s no reason to stop at three dimensions. A four-dimensional space is simply a space in which you need to specify four numbers to specify a location in that space. A five-dimensional space would be one in which you need to specify five numbers, etc. In fact, I claim you already know an example of a four-dimensional space. So let's define an event: just to be an occurrence that happens in a small region of space at a definite time. “ ” In other words, an event is like a snap of your fingers or a clap of your hands. And now, the collection of all events—if I want to specify an event, I need to give you four numbers: I need to tell you where it happens in space and when it happens in time. ——", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693315/61acafb6d55a4482a8d44ec2acead956.mp3"}, {"id": 4282, "name": "Architecture", "phrases": ["visible manifestation", "a series", "a second Augustus", "the Emperor Augustus", "the case", "napoleon III", "the old 18th-century oil lamps", "some 20,000 gas lamps", "the chestnut trees", "50,000 trees"], "eng": "The most visible manifestation of this wealth was a series of grand projects begun by Napoleon III, mainly in Paris. Soon after he came to power in the 1850s, he said, “I want to be a second Augustus,” making reference to the Emperor Augustus's claim that he'd found Rome a city of brick and left it one of marble. 19 50 “ ” In the case of Napoleon III, he found Paris in 1851 a city of cobblestones and twisting medieval streets, and he left it one of asphalt and macadam. 1851 Because what he began doing was bulldozing Old Paris—the ancient, medieval part of Paris—and replacing it with wide new boulevards: 85 miles of them, which he lit with some 20,000 gas lamps (which took out all the old 18th-century oil lamps, replacing them with gas, which gave a much cleaner, brighter, regular light). —— —— 85 2 18 Also, 50,000 trees are planted alongside them—many of them the chestnut trees that we now think of as synonymous with Paris. 5 —— And he drained the streets with 200 miles of sewers: these new, famous Parisian sewers beneath the streets, thereby making the city a much safer, more pleasant place to wander, to stroll, to people-watch, to have coffee or absinthe in the cafés. 200 ——", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693314/c2d49812f36444ef99f493891523c914.mp3"}, {"id": 4283, "name": "Thermodynamics and kinetic theory", "phrases": ["the 19th century", "kinetic theory", "material things respond", "19 Thermodynamics", "the laws", "random motion", "valid absolute", "unusual times", "all right"], "eng": "Coming out of the 19th century with all that happened and so quickly, some of these ideas, some of these theories like thermodynamics and kinetic theory, they didn't blend the way they should have. 19 Thermodynamics has its roots in matter how material things respond to heat and temperature and so forth. The laws of thermodynamics were thought to be absolute. Now take kinetic theory: if matter consists of atoms in random motion and that's what matter is, then you open up the possibility that there will be fluctuations in samples of matter such that the laws of thermodynamics can momentarily be violated. Are the laws of thermodynamics valid absolute? Are they obeyed statistically? On average they're obeyed but they can be violated during unusual times, all right?", "audio": "https://ti.koolearn.com/upload/ti/sardine/2693000-2694000/2693313/0986b6b1b368425f9689bf06e03fe3ae.mp3"}]}, "errors": [{"part": "SST", "name": "Transportation network in Paris", "bad": "As with most cities, we recommend gettnig about on foot. Besides being eco-friendly, it's a great way to get a feel for the city. Just bear in mind that Paris is big, like really big.", "good": "As with most cities, we recommend getting about on foot. Besides being eco-friendly, it's a great way to get a feel for the city. Just bear in mind that Paris is big, like really big.", "type": "拼写", "hint": "找出拼错的单词", "diff": "As with most cities, we recommend <del>gettnig<\/del> <ins>getting<\/ins> about on foot. Besides being eco-friendly, it&#x27;s a great way to get a feel for the city. Just bear in mind that Paris is big, like really big."}, {"part": "SST", "name": "Children directors", "bad": "Social skills are vital in enabling an individual to have and maintain positive interactions with others. Many of these skills are crucial in making and sustaining friendships. Social interactions do not always run smoothly and an individual needs to be able to implement appropriate strategy, such as conflict resolution when difficulties in interactions arise.", "good": "Social skills are vital in enablin   '<div class="row"><button class="bigbtn" id="playBtn">▶ 播放原文音频</button></div>'+
  '<div style="font-size:13px;color:#98a0ae">先听音频，看着下面的词组回忆原文；再听一遍，试着用这些词组把整段说出来。</div></div>'+
  '<div class="panel"><div class="lbl" style="font-size:12.5px;color:#98a0ae;margin-bottom:6px">听力原文关键词组（按出现顺序）</div><ol class="phlist">'+item.phrases.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ol>'+
  '<div class="row" style="margin-top:6px"><button class="bigbtn ghost" id="showRef">看听力原文</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">听力原文</div><div class="ref">'+esc(item.eng)+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>{if(CUR){CUR.pause()}renderList(document.getElementById('q').value)};
  document.getElementById('playBtn').onclick=function(){playAudio(item.audio,this)};
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
}
function buildMode(item){
  var h='<span class="back" id="back">← 返回</span><div class="panel"><div class="ptitle">'+esc(item.name)+'</div>'+
  '<div class="row"><button class="bigbtn" id="playBtn">▶ 播放原文音频</button></div>'+
  '<div style="font-size:13px;color:#98a0ae">用下面全部词组，写一段完整的话（SST 写摘要 / RL 讲出来），写完点看原文对照。</div></div>'+
  '<div class="panel"><ol class="phlist">'+item.phrases.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ol></div>'+
  '<div class="panel"><textarea id="ta" placeholder="用上面的词组写成一段话..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showRef">看听力原文</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">听力原文</div><div class="ref">'+esc(item.eng)+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('back').onclick=()=>{if(CUR){CUR.pause()}renderList(document.getElementById('q').value)};
  document.getElementById('playBtn').onclick=function(){playAudio(item.audio,this)};
  document.getElementById('showRef').onclick=()=>document.getElementById('ans').classList.toggle('on');
}
function fixMode(){
  if(!FIXORDER.length){FIXORDER=shuffle(D.errors.map((_,i)=>i));FIXIDX=0;}
  var e=D.errors[FIXORDER[FIXIDX]];
  var angles=[...new Set(D.errors.filter(x=>x.name===e.name).map(x=>x.type))];
  var h='<div class="counter">第 '+(FIXIDX+1)+' / '+FIXORDER.length+' 段　'+e.part+' · '+esc(e.name)+'</div>'+
  '<div class="panel"><div class="errbad">'+esc(e.bad)+'</div>'+
  '<div style="font-size:13px;color:#98a0ae;margin-bottom:8px">把这段里的错误改过来，改完点看答案。</div>'+
  '<textarea id="ta" placeholder="写出改正后的段落..."></textarea>'+
  '<div class="row" style="margin-top:10px"><button class="bigbtn ghost" id="showAns">看答案</button><button class="bigbtn" id="next">下一段 →</button></div>'+
  '<div class="ans" id="ans"><div class="lbl">改错角度</div><div class="angle">'+angles.map(a=>'<span>'+esc(a)+'</span>').join('')+'</div>'+
  '<div class="lbl">正确段落（绿色是改动处）</div><div class="diff">'+e.diff+'</div></div></div>';
  document.getElementById('list').innerHTML=h;
  document.getElementById('showAns').onclick=()=>document.getElementById('ans').classList.add('on');
  document.getElementById('next').onclick=()=>{FIXIDX=(FIXIDX+1)%FIXORDER.length;fixMode();};
}
document.getElementById('tabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  MODE=e.target.dataset.m;
  document.getElementById('tabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.m===MODE?'on':''));
  hdr();
  if(MODE==='fix'){FIXORDER=[];fixMode();}else renderList(document.getElementById('q').value);
};
document.getElementById('subtabs').onclick=function(e){
  if(e.target.tagName!=='BUTTON')return;
  PART=e.target.dataset.p;
  document.getElementById('subtabs').querySelectorAll('button').forEach(b=>b.className=(b.dataset.p===PART?'on':''));
  renderList(document.getElementById('q').value);
};
document.getElementById('q').oninput=function(){if(MODE!=='fix')renderList(this.value)};
document.getElementById('list').onclick=function(e){
  var c=e.target.closest?e.target.closest('.card'):null; if(!c)return;
  var it=D.cards[PART].find(x=>x.id===+c.dataset.id); if(!it)return;
  if(MODE==='card')cardMode(it);else buildMode(it);
};
hdr();renderList('');
</script></body></html>
